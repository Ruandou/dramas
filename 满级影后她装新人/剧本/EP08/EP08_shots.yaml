    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "城市公园广场改造的综艺录制区。彩色道旗在微风中飘动，地面贴着'挑战区'地贴。沈逸辰穿着浅蓝牛仔外套，手持麦克风，笑容灿烂地站在镜头前。旁边站着几位练习生——乔乐安穿着粉色卫衣，兴奋地踮脚张望。远处立着挑战道具：彩色圆环、计时器、障碍路标"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "主持·阳光"
        text: "欢迎来到《星光少年》户外挑战——今天的特殊环节：默契搭档！"
      - speaker: "CHAR-006"
        emotion: "主持·神秘"
        text: "规则很简单——抽签配对，两人一组，完成三轮默契考验。"
      - speaker: "CHAR-005"
        emotion: "兴奋·小声"
        text: "天哪天哪，希望分到好队友！"

  - shot_id: "EP08-S02"
    scene_id: "SCENE-012"
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    framing: "近景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "练习生队伍中，苏念晚站在后排，齐肩短发被风吹得微微晃动。她表情平静但眼神在暗自观察——当她的目光扫过特约嘉宾区时，看到了陆景深。他穿着黑色高领毛衣（大衣脱了搭在手臂上），正低头看手机，姿态冷淡疏离。苏念晚的瞳孔微缩，内心一紧"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "内心·警觉"
        text: "陆景深？他怎么来了——"
      - speaker: "CHAR-001"
        emotion: "内心·镇定"
        text: "没事，录节目而已，保持距离就好。"
      - speaker: "CHAR-002"
        emotion: "仿佛感应到目光，抬头"
        text: "……"

  - shot_id: "EP08-S03"
    scene_id: "SCENE-012"
    characters: ["CHAR-006", "CHAR-005"]
    looks: ["CHAR-006-L01", "CHAR-005-L01"]
    framing: "中景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "镜头跟随"
    visual_description: "沈逸辰拿出抽签箱，练习生们依次抽签。乔乐安抽到和一个女练习生一组，欢呼击掌。其他几人陆续配对。最后轮到苏念晚——她伸手进箱，摸出一张纸条展开，上面写着特邀嘉宾的名字。她愣住。沈逸辰凑过去一看，夸张地吹了声口哨"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "起哄·大声"
        text: "哦哟——！林小晚，你的搭档是——"
      - speaker: "CHAR-006"
        emotion: "起哄·宣布"
        text: "陆景深老师！"
      - speaker: "CHAR-005"
        emotion: "惊呼"
        text: "哇！姐姐运气也太好了吧！"

  - shot_id: "EP08-S04"
    scene_id: "SCENE-012"
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    framing: "近景"
    duration_sec: 6
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "苏念晚转头看向陆景深。他听到自己的名字时，缓缓抬起头，视线从手机屏幕上移开，落在她身上。两人的目光在空中交汇——陆景深的表情没有变化，还是那副冷淡面孔，但他的目光在她脸上停留了比必要多一秒。苏念晚的嘴角扯出一个得体的微笑，但那笑容里有一丝不易察觉的紧张"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "礼貌·微笑"
        text: "请陆老师多多指教。"
      - speaker: "CHAR-002"
        emotion: "平静·看着她"
        text: "嗯。"
      - speaker: "CHAR-001"
        emotion: "内心·警惕"
        text: "他从EP06开始就在查我了——这组队来得真不是时候。"

  - shot_id: "EP08-S05"
    scene_id: "SCENE-012"
    characters: ["CHAR-006", "CHAR-001", "CHAR-002"]
    looks: ["CHAR-006-L01", "CHAR-001-L01", "CHAR-002-L01"]
    framing: "中景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "第一轮挑战'默契问答'。苏念晚和陆景深面对面坐在两张折叠椅上，中间放着答题板。沈逸辰拿着卡片站在侧方，其他练习生围成半圈看热闹。阳光从树叶缝隙间洒下斑驳光点。沈逸辰翻开第一张卡片，笑眯眯地问"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "主持·问答"
        text: "默契问答第一题——林小晚，请回答：陆景深老师最喜欢的颜色是？"
      - speaker: "CHAR-001"
        emotion: "秒答·脱口而出"
        text: "深蓝。"
      - speaker: "CHAR-006"
        emotion: "挑眉"
        text: "确定？"
      - speaker: "CHAR-001"
        emotion: "镇定"
        text: "确定。"

  - shot_id: "EP08-S06"
    scene_id: "SCENE-012"
    characters: ["CHAR-002"]
    looks: ["CHAR-002-L01"]
    framing: "特写"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "镜头推近"
    visual_description: "陆景深坐在对面。听到'深蓝'的瞬间，他的眉头微微动了一下——极其细微的反应，但特写镜头下清晰可见。他垂下眼睫，没有肯定也没有否定。沈逸辰举起答案牌：正确答案——深蓝。周围一片小声惊叹"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "确认·惊叹"
        text: "正确！林小晚可以啊——这个连很多老粉都不知道！"
      - speaker: "CHAR-002"
        emotion: "垂眼·不动声色"
        text: "……"
      - speaker: "CHAR-002"
        emotion: "内心·警觉"
        text: "深蓝是我从不在公开场合提的事。她怎么知道？"

  - shot_id: "EP08-S07"
    scene_id: "SCENE-012"
    characters: ["CHAR-006", "CHAR-005"]
    looks: ["CHAR-006-L01", "CHAR-005-L01"]
    framing: "中景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "气氛开始热闹。乔乐安在旁边鼓掌起哄，其他练习生也来了兴趣。沈逸辰翻到第二张卡片，表情更夸张了——这是加大难度的问题。他清了清嗓子，故意拉长声音制造悬念。阳光明晃晃地照在答题区，苏念晚的额头上渗出细密的汗珠"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "主持·增加难度"
        text: "第二题——陆景深老师最喜欢的电影是？"
      - speaker: "CHAR-006"
        emotion: "补充·笑"
        text: "提示：经典文艺片，王家卫导演。"
      - speaker: "CHAR-005"
        emotion: "抢答·举手"
        text: "《花样年华》！"
      - speaker: "CHAR-006"
        emotion: "摇头"
        text: "不是。"

  - shot_id: "EP08-S08"
    scene_id: "SCENE-012"
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    framing: "特写"
    duration_sec: 6
    mode: "i2v_ref"
    camera_movement: "镜头推近"
    visual_description: "苏念晚的特写。她听到问题的瞬间，大脑飞速运转——她当然知道答案。十年前她和陆景深在同一场电影沙龙上，亲耳听他说过最喜欢的电影是《春光乍泄》。那是圈内人都知道的小众喜好，但'林小晚'不可能知道。她的理智在喊停，但嘴快了半秒"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "嘴快·自然"
        text: "《春光乍泄》。"
      - speaker: "CHAR-001"
        emotion: "随即僵住·内心"
        text: "……坏了。"
      - speaker: "CHAR-001"
        emotion: "强撑·内心"
        text: "但刚说出口，收不回来了。"

  - shot_id: "EP08-S09"
    scene_id: "SCENE-012"
    characters: ["CHAR-002", "CHAR-001"]
    looks: ["CHAR-002-L01", "CHAR-001-L01"]
    framing: "近景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "现场气氛突然微妙地安静下来。陆景深慢慢抬起头，那双狭长的凤眼定定地看着苏念晚，目光里不再是之前的冷淡审视——而是一种更直接的、带着质询意味的注视。他的手指原本随意搭在膝盖上，此刻缓缓收紧。空气仿佛凝固了几秒"
    dialogue:
      - speaker: "CHAR-002"
        emotion: "直视·缓慢"
        text: "你怎么知道？"
      - speaker: "CHAR-001"
        emotion: "心脏猛跳"
        text: "……"
      - speaker: "CHAR-002"
        emotion: "追问·平静"
        text: "这部电影——我没在任何采访里提过。"
      - speaker: "CHAR-001"
        emotion: "头脑飞速运转"
        text: "……"

  - shot_id: "EP08-S10"
    scene_id: "SCENE-012"
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    framing: "特写"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "苏念晚的大脑在极速运转。她感觉自己的心脏跳得太阳穴都在突突响，但表情必须稳如磐石。两秒停顿——然后她露出一个'啊这个啊'的轻松笑容，调整了坐姿，语气变得像小女孩追星一样自然"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "急中生智·笑"
        text: "啊——这个啊——"
      - speaker: "CHAR-001"
        emotion: "装作坦然"
        text: "之前不是节目组建了粉丝群嘛？群里有人发过你以前的采访截图。"
      - speaker: "CHAR-001"
        emotion: "补刀·自然"
        text: "说你最爱的电影是王家卫的《春光乍泄》——好多人在底下喊'有品位'呢。"

  - shot_id: "EP08-S11"
    scene_id: "SCENE-012"
    characters: ["CHAR-002", "CHAR-006"]
    looks: ["CHAR-002-L01", "CHAR-006-L01"]
    framing: "中景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "陆景深盯着她看了三秒。她回以无辜的、恰到好处的微笑——不多不少，就是一个'运气好猜中'的粉丝该有的表情。沈逸辰敏锐地察觉到气氛微妙，立刻跳出来打圆场，夸张地拍手说'猜对了就是猜对了'。其他练习生也跟着起哄，场面重新热闹起来。陆景深收回目光，没有再追问——但他的表情分明写着'这个解释我听着，但不代表我相信'"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "打圆场·笑"
        text: "粉丝群也是消息源嘛！问题没错——正确答案：《春光乍泄》！林小晚加一分！"
      - speaker: "CHAR-002"
        emotion: "收回目光·低声"
        text: "……行。"
      - speaker: "CHAR-002"
        emotion: "内心·存疑"
        text: "粉丝群？她的语气不像在背答案——更像是……在陈述一件她早就知道的事。"

  - shot_id: "EP08-S12"
    scene_id: "SCENE-012"
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    framing: "中景"
    duration_sec: 6
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "第三轮是默契协作——两人被绑在一起双脚，需要同步走过一段障碍路线。周围人都以为他俩会配合不好，但意外地——他们走出了一种奇妙的步调一致。苏念晚迈左腿时陆景深自然地迈右腿，她倾斜时他本能地托住她的胳膊。旁边的人开始吹口哨。阳光洒在两人身上，影子在地面上融为一体。乔乐安在旁边尖叫"
    dialogue:
      - speaker: "CHAR-006"
        emotion: "惊叹"
        text: "我看错了吗？这默契度——你们真的是第一次合作？"
      - speaker: "CHAR-001"
        emotion: "一边走一边笑"
        text: "配合一下陆老师——别摔就行。"
      - speaker: "CHAR-002"
        emotion: "嘴角微动"
        text: "嗯。"
      - speaker: "CHAR-001"
        emotion: "内心·意外"
        text: "他的节奏……和我居然这么合拍。"

  - shot_id: "EP08-S13"
    scene_id: "SCENE-006"
    characters: ["CHAR-002", "CHAR-GRP-03"]
    looks: ["CHAR-002-L01"]
    framing: "中景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "节目录制结束后的后台走廊。傍晚的光线从尽头的玻璃门透进来。陆景深背对着走廊通道，站在窗前，大衣重新穿上了。他的助理快步走近，手里拿着平板电脑。走廊清场了，只有他们两人。陆景深没有回头，但听到脚步声就知道是谁"
    dialogue:
      - speaker: "CHAR-GRP-03"
        emotion: "助理·走近"
        text: "陆老师，车到了。"
      - speaker: "CHAR-002"
        emotion: "没回头·平静"
        text: "上次让你查林小晚——结果呢？"
      - speaker: "CHAR-GRP-03"
        emotion: "迟疑"
        text: "资料很干净。二十三岁，普通艺术院校毕业，没有专业表演经历。"

  - shot_id: "EP08-S14"
    scene_id: "SCENE-006"
    characters: ["CHAR-002"]
    looks: ["CHAR-002-L01"]
    framing: "特写"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "镜头推近"
    visual_description: "陆景深缓缓转过身。逆光中他的轮廓半明半暗，表情看不清楚，但声音异常清晰，每个字都像经过深思。他微微眯起眼睛，目光投向远处，像是在回忆今天下午那些下意识配合的瞬间——她如何在他开口前就知道他下一步的动作，如何说出那个他从不在媒体上提起的电影名字"
    dialogue:
      - speaker: "CHAR-002"
        emotion: "沉吟·低沉"
        text: "太干净了。"
      - speaker: "CHAR-GRP-03"
        emotion: "不解"
        text: "您的意思是——？"
      - speaker: "CHAR-002"
        emotion: "斩钉截铁·金句"
        text: "林小晚，不是一个普通的练习生。"

  - shot_id: "EP08-S15"
    scene_id: "SCENE-006"
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    framing: "近景"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "固定镜头"
    visual_description: "同一时间，后台的另一端。苏念晚靠在化妆间门口的墙壁上，确认四周无人后，拨通了陈姐的电话。她压低声音，表情与白天录节目时的天真完全不同——换回了一种冷静的忧虑。手机屏幕的微光映在她的脸上"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "压低声音·急切"
        text: "陈姐。"
      - speaker: "CHAR-004"
        emotion: "电话·沉稳"
        text: "说。"
      - speaker: "CHAR-001"
        emotion: "紧促"
        text: "今天录节目，陆景深也在。"
      - speaker: "CHAR-004"
        emotion: "电话·警觉"
        text: "然后？"

  - shot_id: "EP08-S16"
    scene_id: "SCENE-006"
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    framing: "特写"
    duration_sec: 5
    mode: "i2v_ref"
    camera_movement: "镜头推近"
    visual_description: "苏念晚的特写。她咬了咬下唇，眼里闪过一丝不易察觉的慌乱——这对她来说很少见。她压低声音，几乎像在自言自语。手机那头沉默了两秒。走廊尽头的光线逐渐变暗，她的影子被拉得很长。画面定格在她微蹙的眉头上"
    dialogue:
      - speaker: "CHAR-001"
        emotion: "低声·焦虑"
        text: "我不小心说漏了一件事。"
      - speaker: "CHAR-004"
        emotion: "电话·谨慎"
        text: "严重吗？"
      - speaker: "CHAR-001"
        emotion: "沉重"
        text: "他好像——开始怀疑我了。"
      - speaker: "CHAR-004"
        emotion: "电话·沉默两秒"
        text: "……我知道了。你先稳住，我来想办法。"
