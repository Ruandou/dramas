segments:
  - segment_id: SEG01
    label: "暴风雨前的平静"
    transition_out: "hard_cut"
    duration_sec: 10
    shot_ids: [EP10-S01]
    characters: [CHAR-001]
    prompt: "Backstage corridor of a TV variety show recording studio, cold fluorescent overhead lighting on grey cement walls. A 28-year-old Chinese woman in plain trainee outfit (white t-shirt, grey knit cardigan, canvas sneakers) with black shoulder-length hair leans against the wall looking at her phone, screen glow on her face. She lowers the phone, closes her eyes, takes a deep breath with determined expression. Cold blue-white institutional lighting, empty corridor atmosphere. Vertical 9:16 frame, photorealistic, cinematic mood lighting."

  - segment_id: SEG02
    label: "导师登场"
    transition_out: "hard_cut"
    duration_sec: 10
    shot_ids: [EP10-S02, EP10-S03]
    characters: [CHAR-006, CHAR-003]
    prompt: "High-energy TV variety show stage with curved LED wall displaying electric blue and magenta geometric patterns, professional stage lighting rig with moving-head spotlights and beam lights through theatrical haze. A 26-year-old Chinese male host in light blue denim jacket, bright smile. Then a 32-year-old Chinese woman in wine-red velvet blazer dress with deep brown wavy hair walks onto stage with commanding presence, perfect stage smile. Vertical 9:16 frame, photorealistic, vibrant stage lighting, broadcast quality."

  - segment_id: SEG03
    label: "点评时刻"
    transition_out: "hard_cut"
    duration_sec: 10
    shot_ids: [EP10-S04]
    characters: [CHAR-003, CHAR-001]
    prompt: "Variety show stage, a 32-year-old glamorous Chinese woman in wine-red velvet dress with deep brown wavy hair walks slowly along a line of young trainees. She nods and smiles professionally, then pauses as her eyes land on one trainee — her perfect smile freezes for a split second, eyes narrowing with sudden alert scrutiny. Warm stage lights, glossy black stage floor reflecting lights. Vertical 9:16 frame, photorealistic, cinematic 85mm portrait lens."

  - segment_id: SEG04
    label: "暗涌的表演"
    transition_out: "hard_cut"
    duration_sec: 10
    shot_ids: [EP10-S05, EP10-S06]
    characters: [CHAR-001, CHAR-003]
    prompt: "Split scene: First, a 28-year-old Chinese woman with black shoulder-length hair in plain trainee clothes stands under a spotlight on stage, performing a dramatic monologue with restrained but emotionally charged expression, warm golden LED backdrop. Second, close-up of a 32-year-old Chinese woman in wine-red velvet dress sitting in a judge seat, her relaxed posture slowly tensing as she watches the performance, pupils contracting with dawning recognition. Vertical 9:16 frame, photorealistic, cinematic stage lighting."

  - segment_id: SEG05
    label: "台下的涟漪"
    transition_out: "hard_cut"
    duration_sec: 10
    shot_ids: [EP10-S07]
    characters: [CHAR-005, CHAR-001]
    prompt: "Stage floor near the trainee formation, a 20-year-old Chinese girl with space buns and bright pink hoodie whispers excitedly to a 28-year-old Chinese woman in plain grey cardigan. The younger one's face is full of animated excitement while the older remains calmly composed, her gaze fixed forward. Colorful stage LED backdrop, warm ambient lighting. Vertical 9:16 frame, photorealistic, natural interaction lighting."

  - segment_id: SEG06
    label: "正面交锋"
    transition_out: "hard_cut"
    duration_sec: 12
    shot_ids: [EP10-S08, EP10-S09]
    characters: [CHAR-003, CHAR-001]
    prompt: "Intense face-off on a variety show stage. A glamorous 32-year-old Chinese woman in wine-red velvet dress and stilettos faces a composed 28-year-old Chinese woman in simple trainee clothes, two steps apart. Warm stage light hits both from the side creating symmetrical shadows. Then tight close-up of both faces in frame — one with perfect red lipstick and flawless makeup studying intently, the other with natural minimal makeup and unwavering gaze. The air between them charged with unspoken tension. Vertical 9:16 frame, photorealistic, cinematic 85mm portrait lens."

  - segment_id: SEG07
    label: "裂痕的种子"
    transition_out: "hard_cut"
    duration_sec: 12
    shot_ids: [EP10-S10, EP10-S11]
    characters: [CHAR-003, CHAR-GRP-04]
    prompt: "Backstage corridor of recording studio, cold fluorescent lighting casting harsh shadows. A 32-year-old Chinese woman in wine-red velvet dress walks rapidly with urgent stiletto clicks, her stage smile gone replaced by cold brooding expression. A young female assistant in professional attire hurries after her. Then close-up: the older woman stops and turns, face half in shadow, voice light but commanding. The assistant grips her phone nervously. Vertical 9:16 frame, photorealistic, cold cinematic lighting."

  - segment_id: SEG08
    label: "已知的风暴"
    transition_out: "fade"
    duration_sec: 8
    shot_ids: [EP10-S12]
    characters: [CHAR-001]
    prompt: "Stage corner of a TV variety show set, a 28-year-old Chinese woman in simple trainee clothes stands alone watching the direction someone left. Colorful LED backdrop shifts behind her, crew members busy in background. Her expression is calm but her eyes hold deep emotion — ten years of waiting surfacing. A faint knowing smile curves at her lips. Warm and cool mixed stage lighting. Vertical 9:16 frame, photorealistic, cinematic mood lighting."
