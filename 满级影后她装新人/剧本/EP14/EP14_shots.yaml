    description: "天台，城市夜景在身后铺开如星海。陆景深背靠栏杆，深灰色大衣被夜风轻掀。苏念晚站在几步外，双手紧握身前的背包带，夜风吹起她额前碎发。两人之间隔着一段沉默的距离。"
    dialogue:
      - speaker: CHAR-002
        emotion: 低沉·直视
        text: "我在问你——为什么藏拙。"
      - speaker: CHAR-001
        emotion: 垂下视线
        text: "……陆老师，我真的不知道你在说什么。"

  - shot_id: EP14-S02
    scene_id: SCENE-007
