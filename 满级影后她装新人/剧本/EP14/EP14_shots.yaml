    looks: [CHAR-001-L01]
    framing: 近景
    duration_sec: 5
    mode: i2v_ref
    camera: 缓推
    description: "苏念晚的睫毛微颤了一下——那是她唯一泄露的情绪。她咬住下唇内侧，像在组织一个足够可信的谎言。城市灯光在她瞳孔里碎成一片星点。"
    dialogue:
      - speaker: CHAR-001
        emotion: 低声·避开目光
        text: "那是……巧合。"
      - speaker: CHAR-001
        emotion: 内心·紧绷
        text: "他看到了那次。全部细节。他一直在看我。"

