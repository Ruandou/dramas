    looks: [CHAR-002-L01, CHAR-001-L01]
    framing: 中近景
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    description: "陆景深向前走了一步，皮鞋踩在天台地面发出细微声响。苏念晚下意识后退了半步——不是因为恐惧，是因为他说得太准了。天台的风吹动他大衣下摆。"
    dialogue:
      - speaker: CHAR-002
        emotion: 平静·笃定
        text: "你知道。从我们第一次见面你就知道我在说什么。"
      - speaker: CHAR-001
        emotion: 内心·紧张
        text: "他全都看穿了。从什么时候开始的？"

  - shot_id: EP14-S03
    scene_id: SCENE-007
    segment: 2
    characters: [CHAR-002]
    looks: [CHAR-002-L01]
    framing: 特写
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    description: "陆景深的目光锁住她，眉骨在路灯下投出阴影。他的声音不高，但每个字都像石子落入水面，清晰而笃定。"
    dialogue:
      - speaker: CHAR-002
        emotion: 平稳·一字一句
        text: "综艺那次。三秒入戏。你闭眼——再睁眼，眼泪就下来了。"
      - speaker: CHAR-002
        emotion: 平稳
        text: "那不是新人能做到的事。"

