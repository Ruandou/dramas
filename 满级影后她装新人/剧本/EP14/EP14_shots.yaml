        emotion: 声音微抖
        text: "我有舞台恐惧症。人一多就紧张。紧张就喘不上气。表演的时候……会不自觉地收。"
      - speaker: CHAR-001
        emotion: 内心·自嘲
        text: "舞台恐惧症。这借口我自己都不信。但他会信吗。"

