# 8 shots, 90s total

shots:
  - shot_id: EP71-S01
    scene: SCENE-001
    characters: ["CHAR-001", "[待补：念念]"]
    looks: ["CHAR-001-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏记大堂夜晚，客人都走了，只剩一家三口。灯笼暖光调暗，只剩几盏亮着。苏辣辣坐在条凳上，念念窝在她怀里，小揪揪靠着妈妈肩膀。苏辣辣一手搂着女儿，一手在空中
      比划讲故事。桌上空碗碟和茶杯，鸳鸯锅已收。
    dialogue:
      - speaker: [待补：念念]
        emotion: "窝在怀里"
        line: "妈妈快讲！"
      - speaker: CHAR-001
        emotion: "搂她笑"
        line: "好。那年秋天，你爸第一次来苏记——"
      - speaker: [待补：念念]
        emotion: "抢话"
        line: "然后呢？"
      - speaker: CHAR-001
        emotion: "捏她脸"
        line: "别急嘛。他呀——点了清水锅底。"

  - shot_id: EP71-S02
    scene: SCENE-001
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣的脸部近景，大杏眼在暖光里亮亮的，嘴角翘着讲英雄事迹。辣椒项链在锁骨处随说话节奏轻轻晃动。她比划着假装生气的样子——和当年真生气时一模一样。
    dialogue:
      - speaker: CHAR-001
        emotion: "比划·假装生气"
        line: "妈妈当时就说了——'微辣是底线！连微辣都接受不了的人，怎么接受得了人生？'"
      - speaker: CHAR-001
        emotion: "笑·回忆"
        line: "你爸听完……脸都绿了。"
      - speaker: CHAR-001
        emotion: "内心·甜"
        line: "可他居然没走——换个人早摔门走了。"

  - shot_id: EP71-S03
    scene: SCENE-001
    characters: ["CHAR-002", "[待补：念念]"]
    looks: ["CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      陆北辰坐在另一张条凳上，念念跑到爸爸腿上坐着。银框眼镜反射灯笼柔光，一只手扶着女儿腰，另一只手插在裤兜里。他说话时语速比对苏辣辣快半拍。
    dialogue:
      - speaker: [待补：念念]
        emotion: "仰头"
        line: "爸爸也讲！"
      - speaker: CHAR-002
        emotion: "扶她·轻声"
        line: "爸爸的版本——很简单。"
      - speaker: CHAR-002
        emotion: "停顿"
        line: "第一次吃毛肚，辣得想哭。"
      - speaker: [待补：念念]
        emotion: "瞪大眼"
        line: "真的？"
      - speaker: CHAR-002
        emotion: "嘴角微动"
        line: "嗯。但没哭。"

  - shot_id: EP71-S04
    scene: SCENE-001
    characters: ["CHAR-002"]
    looks: ["CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera: 镜头推近
    description: >
      陆北辰抱着念念，低头看女儿发顶。银框眼镜后的眼神变成回忆的柔软。薄唇微微张开又抿紧，斟酌用最简单的话讲最复杂的事。灯笼暖光把侧脸描出柔和轮廓，键盘帽吊坠
      在领口轻轻晃动。
    dialogue:
      - speaker: CHAR-002
        emotion: "低头·温柔"
        line: "后来爸爸发现——你妈妈像红汤。辣，但喝了会上瘾。"
      - speaker: CHAR-002
        emotion: "低声"
        line: "爸爸呢——像白汤。淡，但是她最需要的。"
      - speaker: CHAR-002
        emotion: "内心·轻"
        line: "两个放一起——就是你面前那个锅。"
      - speaker: CHAR-001
        emotion: "内心·听着"
        line: "这个人……什么时候学会说这种话了。"

  - shot_id: EP71-S05
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001", "CHAR-002"]
    looks: ["[待补：念念]", "CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      念念坐在陆北辰腿上，小脑袋转来转去。眉头皱着，小嘴撅着，认真消化故事。小手抓着陆北辰T恤袖子，指节用力。背景苏辣辣看着女儿表情忍不住笑。
    dialogue:
      - speaker: [待补：念念]
        emotion: "歪头"
        line: "妈妈辣，爸爸不辣……怎么在一起的呀？"
      - speaker: CHAR-001
        emotion: "笑·指着"
        line: "问得好！因为你爸后来——学吃辣了。"
      - speaker: CHAR-002
        emotion: "否认"
        line: "没有。"
      - speaker: CHAR-001
        emotion: "大笑"
        line: "骗人！你第一次吃中辣——脸都白了！"

  - shot_id: EP71-S06
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002", "[待补：念念]"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 12
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣蹲在陆北辰和念念面前。手搭在他膝盖上，仰头看他和女儿。灯笼暖光从上方洒下，把三张脸照得温暖柔和。苏辣辣大杏眼映着灯笼光点，嘴角温柔又坚定。
    dialogue:
      - speaker: CHAR-001
        emotion: "蹲下·认真"
        line: "念念，妈妈告诉你——"
      - speaker: CHAR-001
        emotion: "看陆北辰"
        line: "你爸不是学会吃辣了。是他愿意——为了妈妈，去尝那个辣。"
      - speaker: CHAR-002
        emotion: "低头"
        line: "嗯。"
      - speaker: CHAR-001
        emotion: "摸念念脸·笑"
        line: "这就叫——喜欢一个人。"

  - shot_id: EP71-S07
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001", "CHAR-002"]
    looks: ["[待补：念念]", "CHAR-001-L01", "CHAR-002-L01"]
    shot_size: CU
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      念念伸出小手指着苏辣辣锁骨的辣椒项链，又指陆北辰胸口键盘帽吊坠。小手指短短的，在两个吊坠间比来比去——一红一黑各自闪光。苏辣辣摘下辣椒项链凑到念念面前，
      红玉髓在小手旁精致又温暖。
    dialogue:
      - speaker: [待补：念念]
        emotion: "指着"
        line: "妈妈这个是什么？"
      - speaker: CHAR-001
        emotion: "摘下展示"
        line: "这个——你爸送妈妈的。辣椒。"
      - speaker: CHAR-002
        emotion: "摘下·轻声"
        line: "这个——妈妈送爸爸的。键盘帽。"
      - speaker: [待补：念念]
        emotion: "拍手"
        line: "一个是辣辣！一个是爸爸的键盘！"

  - shot_id: EP71-S08
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001", "CHAR-002"]
    looks: ["[待补：念念]", "CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 12
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏记大堂夜晚，一家三口坐在条凳上。苏辣辣靠在陆北辰肩上，念念夹在中间。灯笼暖光在头顶投出红色光晕，墙上三人影子叠在一起。念念突然举起小手。
    dialogue:
      - speaker: [待补：念念]
        emotion: "举手·大声"
        line: "我也要吃鸳鸯锅！"
      - speaker: CHAR-001
        emotion: "愣·笑"
        line: "你？能吃辣？"
      - speaker: [待补：念念]
        emotion: "挺胸·奶声"
        line: "我是辣辣的女儿！当然能！"
      - speaker: CHAR-002
        emotion: "嘴角微扬"
        line: "……随你妈。"
      - speaker: CHAR-001
        emotion: "大笑·内心"
        line: "好嘛——又一个微辣底线。"
