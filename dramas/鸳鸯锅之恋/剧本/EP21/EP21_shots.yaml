    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-005
        voice: "{voice:CHAR-005}"
        emotion: "电话音·慢"
        line: "闺女。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "轻声"
        line: "爸。"
      - speaker: CHAR-005
        voice: "{voice:CHAR-005}"
        emotion: "电话音"
        line: "去了人家家里……要勤快点。别光使嘴皮子。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "笑·眼眶红"
        line: "知道了爸。"
      - speaker: CHAR-005
        voice: "{voice:CHAR-005}"
        emotion: "电话音·沉默两秒"
        line: "……想家了就回来。爸给你留着底料。"

  - shot_id: EP21-S10
    scene: SCENE-005
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    frame_size: CU
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "看着攻略·喃喃"
        line: "零下二十度……铁锅炖……锅包肉……酸菜饺子……"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "看向日历·深吸一口气"
        line: "冰城……"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "轻声"
        line: "有多冷？"
