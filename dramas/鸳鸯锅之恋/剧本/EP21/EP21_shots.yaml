# EP21 见家长预告 · shots.yaml
# 总镜数：10

shots:
  - shot_id: EP21-S01
    scene: SCENE-001
    characters: [CHAR-002]
    looks: [CHAR-002-L01]
    frame_size: MCU
    duration_sec: 11
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "接电话·平静"
        line: "妈。"
      - speaker: CHAR-006
        voice: "{voice:CHAR-006}"
        emotion: "电话音·连珠炮"
        line: "儿子！过年必须带女朋友回来！你爸都问三遍了！整啥呢？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "僵住"
        line: "妈——这事——"
      - speaker: CHAR-006
        voice: "{voice:CHAR-006}"
        emotion: "电话音"
        line: "机票我给你订了！二十八的！带闺女一起回来！听见没！"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "低声"
        line: "……听见了。"

  - shot_id: EP21-S02
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MS
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "端着盘子·小心翼翼"
        line: "你妈……打电话了？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "收起手机"
        line: "嗯。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "吞咽"
        line: "说什么了？"

  - shot_id: EP21-S03
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: CU
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "平静"
        line: "过年。带你回哈尔滨。见我妈。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "愣住·盘子晃"
        line: "见……见你妈？"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "内心"
        line: "哈尔滨？零下二十度的那个哈尔滨？"

  - shot_id: EP21-S04
    scene: SCENE-001
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    frame_size: MS
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "拍桌子"
        line: "我跟你说！见东北婆婆就三个字——"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "紧张"
        line: "哪三个？"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "竖起三根手指"
        line: "会包饺子。"

  - shot_id: EP21-S05
    scene: SCENE-001
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    frame_size: CU
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "念手机·蹩脚东北话"
        line: "整挺好……嘎哈……你瞅啥……"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "笑到拍桌"
        line: "你这东北话——哈尔滨人听了得气哭！"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "沮丧"
        line: "那怎么办嘛……"

  - shot_id: EP21-S06
    scene: SCENE-005
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    frame_size: MS
    duration_sec: 11
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "包饺子·自言自语"
        line: "东北饺子……不就是饺子嘛。我会做火锅——饺子能难到哪去？"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "看着破皮饺子·崩溃"
        line: "……又破了。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "摔面团·内心"
        line: "苏辣辣，你能把红油锅底做到全成都第一——为什么包不好一个饺子？"

  - shot_id: EP21-S07
    scene: SCENE-005
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MS
    duration_sec: 11
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "教学·认真"
        line: "'嘎哈'就是'干什么'。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "写笔记"
        line: "嘎——哈——好的记住了。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "继续"
        line: "'整挺好'是夸人。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "抬头看他"
        line: "那我到时候天天说'整挺好'？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "嘴角微动"
        line: "……也行。我妈会喜欢你。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "低头·脸红"
        line: "你怎么知道……"

  - shot_id: EP21-S08
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MCU
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "攥着行程单"
        line: "我好紧张。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "平静"
        line: "不用。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "抬头看他"
        line: "万一你妈不喜欢我？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "看远方·低声"
        line: "她喜不喜欢——不重要。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "转头看她"
        line: "重要的是——我喜欢。"

  - shot_id: EP21-S09
    scene: SCENE-001
    characters: [CHAR-001, CHAR-005]
    looks: [CHAR-001-L01]
