      - speaker: CHAR-006
        voice: "{voice:CHAR-006}"
        emotion: "拍桌子"
        line: "好！过年咱涮火锅！闺女你来掌勺！"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "笑"
        line: "要得！"

  - shot_id: EP24-S06
