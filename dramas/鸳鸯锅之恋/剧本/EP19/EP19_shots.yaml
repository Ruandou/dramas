# EP19 反击开始 · shots.yaml
# 从 EP19_反击开始.md 导出，勿手改 yaml 当源
# 总镜数：10

shots:
  - shot_id: EP19-S01
    scene: SCENE-001
    characters: [CHAR-001, CHAR-007]
    looks: [CHAR-001-L01, CHAR-007-L01]
    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "微笑·从容"
        line: "条件你可以开。价格不是问题。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "平静"
        line: "说完了？"
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "挑眉"
        line: "你不怕——"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "打断·声音硬"
        line: "苏记不卖。今天不卖，明天不卖，什么时候都不卖。"
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "笑意加深"
        line: "那我等着。"

  - shot_id: EP19-S02
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MS
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "边剁边说"
        line: "他以为钱能买一切。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "走进来"
        line: "光生气没用。得换个打法。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "抬头"
        line: "什么打法？"

  - shot_id: EP19-S03
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MCU
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "指着屏幕"
        line: "线上点餐加直播。他打价格战，我们打流量战。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "愣住"
        line: "直播？我们？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "平静"
        line: "你不会——但小暖会。"

  - shot_id: EP19-S04
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002, CHAR-003]
    looks: [CHAR-001-L01, CHAR-002-L01, CHAR-003-L01]
    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "冲进来·兴奋"
        line: "我跟你说！直播的事，我来！"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "犹豫"
        line: "小暖，这可不是闹着玩——"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "拍胸脯"
        line: "你以为我只会八卦？我在大学可是播音社的！"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "低声"
        line: "让她试试。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "深吸一口气"
        line: "……好。那——今晚就试。"

  - shot_id: EP19-S05
    scene: SCENE-001
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    frame_size: MS
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "手忙脚乱"
        line: "手机往哪放？这个角度行不行？"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "摆食材"
        line: "先别管角度——你得先学会开播。"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "戳屏幕"
        line: "这个红色按钮是开播？我按了啊！"

  - shot_id: EP19-S06
    scene: SCENE-001
    characters: [CHAR-003]
    looks: [CHAR-003-L01]
    frame_size: CU
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "对着镜头·夸张"
        line: "欢迎来到苏记老火锅直播间！我是你们的小暖！"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "内心"
        line: "天哪我好紧张——但我好兴奋！"

  - shot_id: EP19-S07
    scene: SCENE-001
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "兴奋"
        line: "看我姐妹的手速！毛肚七上八下，这才是正宗成都火锅！"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "笑着涮毛肚"
        line: "微辣是底线。连微辣都接受不了的人——"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "接话"
        line: "——怎么接受得了人生！她说的！"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "看手机·尖叫"
        line: "在线人数——五千了？！"

  - shot_id: EP19-S08
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    frame_size: MS
    duration_sec: 11
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "递水·低声"
        line: "喝点水。别光顾着说。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "接水·小声"
        line: "谢……"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "镜头对准他们·低声"
        line: "嗑到了嗑到了……"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "发现镜头·脸红"
        line: "小暖！你拍哪呢！"
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "坏笑"
        line: "来不及了——弹幕已经疯了。"

  - shot_id: EP19-S09
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002, CHAR-003]
    looks: [CHAR-001-L01, CHAR-002-L01, CHAR-003-L01]
    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-003
        voice: "{voice:CHAR-003}"
        emotion: "尖叫"
        line: "我们上热搜了！苏记鸳鸯锅直播——热搜第三！"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "不敢相信"
        line: "什么？！第三？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "推眼镜·平静"
        line: "线上订单也爆了。系统差点扛不住。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "抱住林小暖"
        line: "小暖！我们做到了！"

  - shot_id: EP19-S10
    scene: SCENE-001
    characters: [CHAR-007]
    looks: [CHAR-007-L01]
    frame_size: MCU
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "看手机·喃喃"
        line: "热搜第三……"
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "冷笑"
        line: "苏辣辣，有点意思。"
      - speaker: CHAR-007
        voice: "{voice:CHAR-007}"
        emotion: "低声·冰冷"
        line: "你逼我的。"
