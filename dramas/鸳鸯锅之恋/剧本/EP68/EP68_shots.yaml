      - speaker: CHAR-002
        emotion: "眼神微暖"
        line: "你说'微辣是底线'那天。"
      - speaker: CHAR-001
        emotion: "愣住·内心"
        line: "他说那天……他就改了？"

  - shot_id: EP68-S06
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
