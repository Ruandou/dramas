    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 12
    mode: i2v_ref
    camera: 缓推
    description: >
      苏记老火锅大堂傍晚营业时段，暖琥珀色灯笼光洒满木质桌椅。苏辣辣和陆北辰坐在靠墙的老位置——这张桌子的木纹被火锅蒸汽熏出了深色水渍，是他们第一次见面时坐的
      那张。苏辣辣低马尾，白T外罩酒红围裙，辣椒项链在锁骨处闪着温润的光；陆北辰深蓝T恤，银框眼镜，键盘帽吊坠在领口若隐若现。两人中间摆着铜质鸳鸯锅（`PRO
      P-001`），红白两半刚端上来，还没沸腾，清澈的汤面映着灯笼的暖光。苏辣辣双手撑着下巴，眼睛亮亮地看着他。
    dialogue:
      - speaker: CHAR-001
        emotion: "笑·撑下巴"
        line: "记不记得这张桌子？"
      - speaker: CHAR-002
        emotion: "环顾·点头"
        line: "嗯。就这儿。"
      - speaker: CHAR-001
        emotion: "凑近·小声"
        line: "你第一次来的时候——坐这儿，脸臭得像欠你八百万似的。"
      - speaker: CHAR-002
        emotion: "嘴角微动"
        line: "没有。"

  - shot_id: EP68-S02
    scene: SCENE-001
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    shot_size: MCU
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏辣辣的脸部近景，大杏眼在暖光里弯成月牙，嘴角翘着。她伸手指向鸳鸯锅的红汤那一半——汤面刚冒第一个泡，小小的气泡从锅底升上来。背景虚化中能看到陆北辰模糊
      的身影。
    dialogue:
      - speaker: CHAR-001
        emotion: "指着红汤·得意"
        line: "你知道那天你第一口吃的什么？"

  - shot_id: EP68-S03
    scene: SCENE-001
    characters: ["CHAR-002"]
    looks: ["CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    description: >
      陆北辰的脸部近景，银框眼镜后的细长眼睛微微眯起，嘴角那条冷峻的线难得地松了。他低头看着红汤，喉结微微滚动——回忆涌上来的样子。薄唇抿了抿，然后吐出两个字
      。
    dialogue:
      - speaker: CHAR-002
        emotion: "低声·回忆"
        line: "毛肚。"
      - speaker: CHAR-001
        emotion: "拍桌·笑"
        line: "你还记得！七上八下——你数都不会数！"
      - speaker: CHAR-002
        emotion: "认真"
        line: "数了。错了一次。"
      - speaker: CHAR-001
        emotion: "内心·甜"
        line: "连错几次都记得……这个人。"

  - shot_id: EP68-S04
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      两人面对面坐在条凳上，鸳鸯锅蒸汽在两人之间缭绕。苏辣辣双手抱胸，假装生气，但眼睛里全是笑意——她在"演"当年吵架的样子。陆北辰双手平放在桌上，身体微微前
      倾，银框眼镜上沾了一点雾气。背景里其他客人在远处热闹，但这一桌像被雾气隔出了一个两人世界。
    dialogue:
      - speaker: CHAR-001
        emotion: "抱胸·假装生气"
        line: "你还说什么——'清水锅底，麻酱蘸料'。你是不是来找茬的？"
      - speaker: CHAR-002
        emotion: "认真·回忆"
        line: "不是找茬。是真觉得——清水挺好。"
      - speaker: CHAR-001
        emotion: "瞪眼·笑出声"
        line: "你说什么？！"
      - speaker: CHAR-002
        emotion: "轻声·转折"
        line: "后来……改了。"
      - speaker: CHAR-001
        emotion: "内心·感慨"
        line: "改了——这两个字，比'我爱你'重。"

  - shot_id: EP68-S05
    scene: SCENE-001
    characters: ["CHAR-002", "CHAR-001"]
    looks: ["CHAR-002-L01", "CHAR-001-L01"]
