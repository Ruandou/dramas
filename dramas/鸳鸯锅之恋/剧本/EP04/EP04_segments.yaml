      镜头2（5s）特写镜头推近：陆北辰低头看手机屏幕，拇指在屏幕停一秒，指尖轻轻划过屏幕上的笑脸，然后指尖轻点屏幕。银框眼镜后眼睛弯起，嘴角浮起极淡弧度。巷子里人来人往没人注意。
