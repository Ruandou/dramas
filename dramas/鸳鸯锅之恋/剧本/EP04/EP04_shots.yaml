    segment: SEG01
    visual: "宽窄巷子入口，青砖灰瓦的牌坊下阳光斑驳。林小暖半推半搡地把苏辣辣往前推，苏辣辣被推得踉跄一步，双手叉腰回头瞪她——嘴角却藏不住上扬的弧度。陆北辰双手插兜跟在两人身后，银框眼镜在午光下微微反光，面无表情但眼神一直在苏辣辣后脑勺上。巷口人来人往，红灯笼在头顶轻晃。"
    dialogue:
      - speaker: CHAR-003
        emotion: "兴奋·连珠炮"
        line: "苏老板！人家都把秘方本接了，你不得表示一下嘛？"
      - speaker: CHAR-001
        emotion: "瞪她·心虚"
        line: "那是我爸硬塞的，跟我有什么关系——"

  - shot_id: EP04-S02
    scene: SCENE-003
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    segment: SEG01
    visual: "苏辣辣深吸一口气转身面对陆北辰，下巴微扬，酒红围裙外的白T在暖光下干净利落。陆北辰低头看她，细长内双的眼睛里闪过一丝不易察觉的笑意。她双手叉腰试图摆出老板娘的架势，但肩膀绷得不太自然。背景是巷子入口的灰砖墙和绿植盆栽。"
    dialogue:
      - speaker: CHAR-001
        emotion: "双手叉腰·威胁"
        line: "听好了——规矩：手揣好，不准乱跑。"
      - speaker: CHAR-002
        emotion: "平静·配合"
        line: "行。"
      - speaker: CHAR-001
        emotion: "内心·紧张"
        line: "他为什么老盯着我看……"
        type: monologue
      - speaker: CHAR-002
        emotion: "内心·观察"
        line: "她紧张的时候，手指会绞围裙角。"
        type: monologue

  - shot_id: EP04-S03
    scene: SCENE-003
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 镜头跟随
    segment: SEG02
    visual: "两人沿着窄巷并肩走，灰砖墙两侧是手工艺店和茶馆的竹椅方桌，红灯笼在头顶连成一串暖光。苏辣辣边走边侧头讲解，手势比划得很生动，马尾随着步伐轻晃。陆北辰落后半步，手指在裤缝边无意识地敲着——程序员想事情的习惯——目光从店铺招牌移到苏辣辣的侧脸又迅速移开。阳光从窄巷上方斜洒下来，在青石板上拉出两人的长影。"
    dialogue:
      - speaker: CHAR-001
        emotion: "边走边说·炫耀"
        line: "安逸哦，这才叫成都——盖碗茶、变脸、搓麻将，你东北有吗？"
      - speaker: CHAR-002
        emotion: "落后半步·配合"
        line: "东北有暖气。"
      - speaker: CHAR-001
        emotion: "被噎·回头瞪"
        line: "……你就不能顺着我说一次？"

  - shot_id: EP04-S04
    scene: SCENE-003
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    segment: SEG03
    visual: "巷中茶馆外，竹椅方桌间围了一圈观众。变脸表演者的彩衣袖子在镜头边缘翻飞，红色脸谱面具突然转向陆北辰——距离不到一米。陆北辰的身体猛地往后仰，双手撑住竹椅扶手，银框眼镜被震得歪了一点，内双的眼睛瞬间睁到最大。苏辣辣坐在旁边，正端着盖碗茶，嘴角的茶水差点喷出来。暖黄灯笼光打在两人脸上，背景观众的笑声隐约可闻。"
    dialogue:
      - speaker: CHAR-002
        emotion: "被吓·身体后仰"
        line: "——！"
      - speaker: CHAR-001
        emotion: "笑喷·拍桌"
        line: "哈哈哈哈哈！你一个一米八的——"
      - speaker: CHAR-002
        emotion: "内心·窘"
        line: "……第一次近距离看她笑。好看。"
        type: monologue

  - shot_id: EP04-S05
    scene: SCENE-003
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: CU
    duration_sec: 6
