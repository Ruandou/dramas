    visual: "陆北辰低头看牌，手指在牌面上轻轻滑过——他在算。银框眼镜后的眼睛快速扫描手里的牌，嘴唇微动默念着什么。镜头推近他的侧脸：棱角分明的下颌线紧绷，程序员专注时特有的表情。苏辣辣在对面，手肘撑桌托着下巴，眯着眼看他——嘴角有一丝忍俊不禁的笑意。麻将牌在两人之间的绿呢桌面上排列成整齐的方阵。"
    dialogue:
