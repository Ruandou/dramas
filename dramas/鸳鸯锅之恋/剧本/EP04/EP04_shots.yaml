    segment: SEG03
    visual: "陆北辰扶正眼镜，嘴角紧紧抿着试图维持体面，但耳尖已经红透了。苏辣辣笑得前仰后合，一只手捂着肚子，另一只手里的盖碗茶盖子叮当响。她的酒窝在笑容里深深陷进去，辣椒项链在锁骨处随着笑声晃动。竹椅方桌上散落着花生壳和瓜子壳，盖碗茶冒着细小的热气。"
    dialogue:
      - speaker: CHAR-002
        emotion: "扶眼镜·嘴硬"
        line: "我没怕。"
      - speaker: CHAR-001
        emotion: "笑得停不下来"
        line: "你脸都白了还嘴硬？"
      - speaker: CHAR-001
        emotion: "擦眼泪·调侃"
        line: "变脸把你都变了——活该。"

  - shot_id: EP04-S06
    scene: SCENE-003
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 6
