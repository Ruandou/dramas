    visual: "茶馆角落的麻将桌，绿呢台面铺着，方块麻将牌排成整齐的墙。苏辣辣坐在对面，手指飞快地码牌——动作行云流水，是从小泡在麻将桌边长大的成都姑娘。陆北辰坐在她对面，低头看牌，表情严肃得像在看代码——手指笨拙地摸牌边缘，眉头皱成一条线。阳光从竹帘缝隙洒进来，在麻将桌上画出一道道光纹。"
    dialogue:
      - speaker: CHAR-001
        emotion: "码牌·得意"
        line: "成都麻将，血战到底——大赢家通吃。听懂没？"
      - speaker: CHAR-002
        emotion: "低头研究牌·困惑"
        line: "为什么有'血战'？"
      - speaker: CHAR-001
        emotion: "得意"
        line: "因为输了要脱层皮嘛。"
      - speaker: CHAR-002
        emotion: "内心·观察"
        line: "她讲麻将的样子……跟她讲火锅一模一样。"
        type: monologue

  - shot_id: EP04-S07
