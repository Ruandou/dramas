      - speaker: CHAR-001
        emotion: "噗嗤"
        line: "瓜娃子，打麻将靠手感——你算不过命的。"
      - speaker: CHAR-002
        emotion: "内心·第一次"
        line: "她叫我瓜娃子……为什么我在笑？"
        type: monologue

