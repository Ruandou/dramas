shots:
  - shot_id: EP05-S01
    scene: SCENE-001
    characters: [CHAR-003, CHAR-002]
    looks: [CHAR-003-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏记老火锅大堂，傍晚暖光灯笼照亮木质桌椅，墙上挂满老照片。
      角落一张方桌，林小暖双手叉腰站在桌前，鲨鱼夹歪了一边，连珠炮式地拍桌子。
      陆北辰坐在条凳上，深蓝T恤外罩了件薄外套，双手平放在膝盖上，
      面无表情但耳朵尖红得像辣椒——手指在裤缝上无意识地敲着。
      桌上摆着一盘没动的花生米和两杯冒着气泡的啤酒。
    dialogue:
      - speaker: CHAR-003
        emotion: "拍桌·连珠炮"
        line: "陆北辰！今天辣辣生日你到底准备礼物没有？"
      - speaker: CHAR-002
        emotion: "坐直·嘴硬"
        line: "……准备了。"
      - speaker: CHAR-003
        emotion: "凑近·逼问"
        line: "什么东西？拿出来我先审核！"
      - speaker: CHAR-002
        emotion: "内心·紧张"
        line: "她要是知道我挑了多久……"

  - shot_id: EP05-S02
    scene: SCENE-001
    characters: [CHAR-004, CHAR-002]
    looks: [CHAR-004-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      赵大鹏从旁边挤过来，红色Polo衫在暖光下格外醒目，手里端着满满一杯啤酒，泡沫溢出杯沿。
      他一屁股坐到陆北辰旁边，条凳发出"吱嘎"一声，壮实的肩膀把陆北辰挤得往边上挪了半寸。
      陆北辰从裤兜里摸出一个巴掌大的深红色天鹅绒小盒子，手指捏着盒盖边缘，指节发白。
      赵大鹏瞪大眼，啤酒差点洒出来。
      背景里大堂中央一张大桌上摆着还没点燃蜡烛的生日蛋糕，蛋糕上有个翻糖小火锅造型。
    dialogue:
      - speaker: CHAR-004
        emotion: "挤过来·神秘"
        line: "哥们儿，送礼物得投其所好——辣辣最爱啥？"
      - speaker: CHAR-002
        emotion: "低头·不确定"
        line: "辣椒？"
      - speaker: CHAR-004
        emotion: "拍大腿·自信"
        line: "整！就送辣椒！不过得整点特别的——"
      - speaker: CHAR-002
        emotion: "内心·犹豫"
        line: "一个破盒子……怎么这么沉。"

  - shot_id: EP05-S03
    scene: SCENE-001
    characters: [CHAR-003, CHAR-001]
    looks: [CHAR-003-L01, CHAR-001-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    description: >
      大堂中央大桌，林小暖弯腰点燃蛋糕蜡烛，火苗在暖光中跳动。
      蛋糕上翻糖小火锅冒着"糖霜蒸汽"。
      苏辣辣被推到桌前，酒红围裙外今天系了一条粉色生日彩带，头发比平时多扎了一个小揪揪，
      一脸惊讶——双手捂嘴，眼睛亮得像灯笼。
      她身后几桌坐满了来捧场的常客和朋友，拍手起哄。
      红灯笼在头顶连成暖光带，火锅蒸汽在灯光里氤氲成薄雾。
    dialogue:
      - speaker: CHAR-003
        emotion: "点蜡烛·喊"
        line: "辣辣快许愿！"
      - speaker: "[待补：火锅店顾客们]"
        emotion: "齐声"
        line: "生日快乐！"
      - speaker: CHAR-001
        emotion: "捂嘴·惊讶"
        line: "你们——什么时候准备的嘛！"
      - speaker: CHAR-001
        emotion: "内心·感动"
        line: "这些人……真的在乎我。"

  - shot_id: EP05-S04
    scene: SCENE-001
    characters: [CHAR-002]
    looks: [CHAR-002-L01]
    shot_size: CU
    duration_sec: 8
    mode: i2v_ref
    camera: 镜头推近
    description: >
      陆北辰坐在角落的条凳上，远离烛光人群，双手握着那个深红色天鹅绒小盒子搁在膝盖上，
      拇指在盒盖上反复摩挲。银框眼镜后的眼神越过烛光看向苏辣辣——
      她正闭眼许愿，睫毛在烛光里投下扇形阴影，嘴角弯着。
      他的喉结微微滚动，耳尖比灯笼还红，嘴唇抿成一条线。
      身旁的条凳上放着一杯没动的啤酒，泡沫已经消了大半。
    dialogue:
      - speaker: CHAR-002
        emotion: "内心·紧张"
        line: "手心全是汗……别掉地上。"
      - speaker: CHAR-002
        emotion: "内心·认真"
        line: "万一她嫌丑……算了，送了再说。"

  - shot_id: EP05-S05
    scene: SCENE-001
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: CU
    duration_sec: 10
    mode: i2v_ref
    camera: 镜头推近
    description: >
      陆北辰深吸一口气站起来，穿过人群走向苏辣辣——高瘦的身影在暖光灯笼下拉出一道长影。
      他在她面前站定，从口袋里掏出天鹅绒盒子，手指微微发颤。
      苏辣辣刚吹灭蜡烛，脸上还沾着一点奶油，转头看到他手里的小盒子，眼睛瞬间睁大。
      陆北辰"啪"地打开盒盖——特写：红玉髓辣椒吊坠静静躺在黑色丝绒上，
      红玉髓在灯笼暖光下泛着半透明的温润光泽，辣椒形小吊坠约两厘米，微微弯曲，
      金链在丝绒上垂出优雅的弧线。背景人声瞬间安静了一拍。
    dialogue:
      - speaker: CHAR-002
        emotion: "递出盒子·认真"
        line: "生日快乐。"
      - speaker: CHAR-001
        emotion: "愣住·小声"
        line: "你……你什么时候……"
      - speaker: CHAR-002
        emotion: "低声·催促"
        line: "打开看看。"

  - shot_id: EP05-S06
    scene: SCENE-001
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: CU
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    description: >
      陆北辰低头看她，棱角分明的下颌线在灯笼暖光里柔和了几分。
      他的声音比平时低半度，每一个字都像在斟酌，薄唇轻启——
      程序员用最笨的方式说最浪漫的话。
      苏辣辣仰头看他，手指不自觉地绞着围裙角，锁骨处空空的皮肤在暖光下泛着细腻的光泽。
      背景的火锅蒸汽从侧面飘来，在两人之间形成一道薄薄的暖雾。
    dialogue:
      - speaker: CHAR-002
        emotion: "低声·认真"
        line: "为了让你记住——东北也有辣。"
      - speaker: CHAR-001
        emotion: "内心·震"
        line: "他说什么……辣？他在说辣？"
      - speaker: CHAR-002
        emotion: "内心·紧张"
        line: "她不说话……完了。"

  - shot_id: EP05-S07
    scene: SCENE-001
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: ECU
    duration_sec: 6
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣的脸占满画面——特写她的大杏眼，瞳孔里映着天鹅绒盒子里红玉髓辣椒的暖光。
      她的睫毛颤了两下，嘴唇微微张开又抿紧，眼眶有一瞬泛红但硬生生憋了回去。
      然后她伸手，指尖碰到金链，把它从丝绒托上拈起来——
      红玉髓辣椒在她指间轻轻晃动，灯笼暖光在玉石表面游走。
    dialogue:
      - speaker: CHAR-001
        emotion: "拈起项链·装不在乎"
        line: "谁要记你东北……幼稚得很。"

  - shot_id: EP05-S08
    scene: SCENE-001
    characters: [CHAR-001, CHAR-003, CHAR-004]
    looks: [CHAR-001-L01, CHAR-003-L01, CHAR-004-L01]
    shot_size: MS
