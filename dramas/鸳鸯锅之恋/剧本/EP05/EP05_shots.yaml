    description: >
      周子轩站在火锅店门口——深灰西装精致得与烟火气格格不入，
      黑色短发向后梳得纹丝不乱，棱角分明的脸上带着一种从容的微笑，薄唇轻启。
      他身后花店伙计的身影在灯笼光里模糊成一团。
      他迈步走进店里，目光越过沸腾的鸳鸯锅、越过拍手的客人、越过蛋糕的烛烟——
      精准地锁定了苏辣辣。
      苏辣辣刚摸着锁骨上的辣椒项链，听到门口动静转过头，笑容瞬间凝固。
      陆北辰站在她身后两步远，银框眼镜后的眼神在看清来人的那一刻冷了下来——
      插在裤兜里的手不自觉地攥紧。
      林小暖和赵大鹏对视一眼，笑容也僵住了。
    dialogue:
      - speaker: CHAR-007
        emotion: "微笑·从容"
        line: "辣辣，生日快乐。"
      - speaker: CHAR-001
        emotion: "内心·慌"
        line: "他怎么来了……"
      - speaker: CHAR-002
        emotion: "内心·冷"
        line: "这个人，什么来头。"
