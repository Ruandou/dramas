    description: >
      苏辣辣低头把项链绕到脖子后面——手指笨拙地扣着搭扣，碎发挡住了半边脸，耳根红透。
      "嗒"一声搭扣合上，红玉髓辣椒正好落在锁骨凹陷处，跟左手腕的红绳遥相呼应。
      她摸了一下吊坠，抬头——林小暖在旁边双手捂嘴，眼眶已经红了，
      鲨鱼夹在激动中歪到了头顶；赵大鹏在后面使劲鼓掌，啤酒洒了一身也没发现。
      苏辣辣脸红得比红油还红，低下头绞手指。
    dialogue:
      - speaker: CHAR-001
        emotion: "低头·结巴"
        line: "就……就试试。又不是什么值钱的东西。"
      - speaker: CHAR-003
        emotion: "捂嘴·激动"
        line: "天哪天哪天哪——"
      - speaker: CHAR-004
        emotion: "鼓掌·大声"
        line: "整挺好！整挺好！"
      - speaker: CHAR-001
        emotion: "内心·甜"
        line: "这条链子搁在锁骨上，痒——但不想摘。"
      - speaker: CHAR-002
        emotion: "嘴角微扬·内心"
        line: "她戴了。"

