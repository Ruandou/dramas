  CHAR-005: 成年男性，55岁，音色沉稳略带沙哑（几十年厨师油烟熏的），老成都方言为主，语速缓慢有板有眼，教训人时语速会加快但很快又慢下来，说话喜欢用食物比喻（"这个底料差点意思"），情绪深沉内敛——高兴时假装不在意地哼一声，心疼女儿时声音会微微发颤
