    camera: 固定镜头
    description: >
      陆北辰把笔记本电脑转向苏辣辣——屏幕上显示"上传完成"的状态。他银框眼镜后的眼神从屏幕移到她脸上，嘴角微微上扬——程序员式的骄傲。苏辣辣凑过来看屏幕，手
      指指着某处细节，两人头挨着头，笔记本屏幕的冷白光和厨房暖黄灯光在两张脸上交汇，一半暖一半冷。背景里调料架上的各色辣椒罐在暖光里排成一排，像彩虹。
    dialogue:
      - speaker: CHAR-002
        emotion: "指着屏幕·平静"
        line: "三百六十二页，全扫完了。"
      - speaker: CHAR-001
        emotion: "惊讶·数"
        line: "你都——你什么时候扫的？"
      - speaker: CHAR-002
        emotion: "低声"
        line: "你睡着以后。"
      - speaker: CHAR-001
        emotion: "内心·甜"
        line: "这个人……嘴上不说，什么都替我想好了。"

