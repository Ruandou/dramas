# 9 shots, 90s total

shots:
  - shot_id: EP69-S01
    scene: SCENE-005
    characters: ["CHAR-005"]
    looks: ["CHAR-005-L01"]
    shot_size: MS
    duration_sec: 12
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣家客厅，午后阳光从老式木窗格间洒进来，在地砖上画出暖黄色的几何光斑。藤椅和茶几上摆着盖碗茶，茶汤冒着热气。苏爸坐在藤椅上，灰T恤外罩条纹围裙，双手
      捧着一本泛黄的螺旋笔记本——老火锅秘方本（`PROP-006`），封面上油渍斑驳，手写的"苏记"两个字已经褪色但依然清晰。他的粗糙手指在封面摩挲，法令纹
      深深的脸上是一种郑重又释然的表情。
    dialogue:
      - speaker: CHAR-005
        emotion: "摩挲封面·沉声"
        line: "辣辣，过来坐。"
      - speaker: CHAR-005
        emotion: "停顿·深吸"
        line: "这个本子……该给你了。"

  - shot_id: EP69-S02
    scene: SCENE-005
    characters: ["CHAR-005", "CHAR-001"]
    looks: ["CHAR-005-L01", "CHAR-001-L01"]
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏辣辣坐在苏爸对面的条凳上，白T恤外罩酒红围裙，辣椒项链在锁骨处闪光。她看着父亲递过来的秘方本，双手接住——指尖碰到封面上的油渍，那是几十年火锅生涯留下
      的痕迹。她的大杏眼在午后暖光里泛着水光，睫毛颤了两下，嘴唇微微张开又抿紧。苏爸的手从笔记本上缓缓抬起，拍了拍她的手背。
    dialogue:
      - speaker: CHAR-001
        emotion: "双手接过·颤声"
        line: "爸……"
      - speaker: CHAR-005
        emotion: "拍她手背·平静"
        line: "你从小在厨房打转，这个本子——比你年纪都大。"
      - speaker: CHAR-001
        emotion: "低头·哽咽"
        line: "我知道……每一页都有你的味道。"
      - speaker: CHAR-005
        emotion: "低声·嘱咐"
        line: "记住了——底料是根本。"
      - speaker: CHAR-001
        emotion: "内心·郑重"
        line: "这辈子都不会忘。"

  - shot_id: EP69-S03
    scene: SCENE-005
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    shot_size: CU
    duration_sec: 11
    mode: i2v_ref
    camera: 镜头推近
    description: >
      秘方本（`PROP-006`）的特写——苏辣辣的手指翻开第一页，泛黄纸张上密密麻麻的钢笔字迹，墨水有些晕开但字迹清晰。能看到"牛油三斤""花椒二两""干
      辣椒半斤"等配方字样。纸页边缘卷曲发黑，是被油烟熏出来的。她的手指小心翼翼地翻着，每一页都像在触摸父亲几十年的汗水。最后翻到空白页——崭新的白纸与泛黄的
      老页形成强烈对比。
    dialogue:
      - speaker: CHAR-001
        emotion: "翻页·轻声"
        line: "这页……是你当年写的第一个配方？"
      - speaker: CHAR-005
        emotion: "点头·感慨"
        line: "八几年了。那时候你还穿开裆裤呢。"
      - speaker: CHAR-001
        emotion: "笑出泪·小声"
        line: "爸……我会好好写下去。"

  - shot_id: EP69-S04
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏记老火锅厨房，暖黄灯泡照亮不锈钢灶台和调料架。苏辣辣站在料理台前，秘方本摊开在新页，右手握着钢笔在认真书写。陆北辰站在她身后偏左，银框眼镜反射着灶台灯
      光，手里拿着一台笔记本电脑，正在拍照扫描秘方本的页面。两人肩膀几乎挨着。
    dialogue:
      - speaker: CHAR-001
        emotion: "写字·专注"
        line: "新配方……改良版底料，少油不减辣。"
      - speaker: CHAR-002
        emotion: "看屏幕·点头"
        line: "嗯，拍好了。"

  - shot_id: EP69-S05
    scene: SCENE-001
    characters: ["CHAR-002"]
    looks: ["CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    description: >
      陆北辰低头看着笔记本电脑屏幕，屏幕上是秘方本页面的高清扫描图——泛黄纸张上的手写字迹被数字化保存。他的手指在触控板上滑动，调整对比度让字迹更清晰。银框眼
      镜后的眼神专注认真，像在调试代码一样严谨。背景里苏辣辣继续在秘方本上书写，钢笔尖在纸上发出沙沙声。
    dialogue:
      - speaker: CHAR-002
        emotion: "看着屏幕·认真"
        line: "备份三份。本地、云端、硬盘。"
      - speaker: CHAR-001
        emotion: "头也不抬·笑"
        line: "程序员的职业病？"
      - speaker: CHAR-002
        emotion: "严肃"
        line: "重要数据——不能丢。"

  - shot_id: EP69-S06
    scene: SCENE-001
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣放下钢笔，低头看着秘方本上自己刚写的字——笔迹和苏爸的不同，更纤细但同样认真。本子左边是泛黄的老配方页，右边是她写的新配方页。她的手指轻轻按在两页
      之间的书脊上，像在连接两个时代。背景厨房的灶台上，铜质鸳鸯锅的影子在墙上投出一个大大的圆形暖光。
    dialogue:
      - speaker: CHAR-001
        emotion: "内心·感慨"
        line: "爸用一辈子写的……我接着写。"
      - speaker: CHAR-001
        emotion: "内心·坚定"
        line: "但不是照抄——是加上我的味道。"
      - speaker: CHAR-001
        emotion: "低声·自语"
        line: "苏记，要活到下个世纪嘛。"

  - shot_id: EP69-S07
    scene: SCENE-001
    characters: ["CHAR-002", "CHAR-001"]
    looks: ["CHAR-002-L01", "CHAR-001-L01"]
    shot_size: MS
    duration_sec: 11
