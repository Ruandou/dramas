# EP70 五年后 — shots.yaml
# 从 EP70_五年后.md 镜头表导出，勿手改 yaml 当源
# 8 shots, 90s total

shots:
  - shot_id: EP70-S01
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 缓推
    description: >
      苏记老火锅大堂五年后的傍晚——暖琥珀色灯笼依旧，木质桌椅依旧，但墙上的老照片旁边多了几张品牌活动合影和媒体报道（画面中只展示照片的暖色边框，无具体内容避
      免文字问题）。苏辣辣白T恤外罩酒红围裙，头发比五年前稍长了一些，低马尾利落依旧，辣椒项链在锁骨处闪光。她正往鸳鸯锅（`PROP-001`）里下食材，动作
      比五年前更娴熟。陆北辰站在旁边帮忙递盘子，深蓝T恤，银框眼镜，键盘帽吊坠在领口处若隐若现。
    dialogue:
      - speaker: CHAR-001
        emotion: "下毛肚·熟练"
        line: "五年了——这个锅还是这么烫。"
      - speaker: CHAR-002
        emotion: "递盘子·轻声"
        line: "嗯。跟第一天一样。"
      - speaker: CHAR-001
        emotion: "笑·眨眼"
        line: "你脸还是一样臭。"
      - speaker: CHAR-002
        emotion: "嘴角微动"
        line: "……没有。"

  - shot_id: EP70-S02
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001"]
    looks: ["[待补：念念]"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏记大堂入口处，一个五岁的小女孩跑进来——[待补：念念]穿着小号的红色卫衣，扎着两个小揪揪，圆圆的脸蛋像苏辣辣，眼睛又像陆北辰的细长。她手里抱着一个比她
      脸还大的棒棒糖，跑得小皮鞋在地砖上"嗒嗒"响。苏辣辣蹲下来接住她，念念一头扎进妈妈怀里。陆北辰在旁边看着，银框眼镜后的眼神柔得像水。
    dialogue:
      - speaker: [待补：念念]
        emotion: "跑进来·奶声"
        line: "妈妈！妈妈！我又会说新词了！"
      - speaker: CHAR-001
        emotion: "蹲下·惊喜"
        line: "什么词？说给妈妈听听。"
      - speaker: [待补：念念]
        emotion: "大声·骄傲"
        line: "贼拉好吃！"
      - speaker: CHAR-002
        emotion: "嘴角上扬·内心"
        line: "赵大鹏教的。"

  - shot_id: EP70-S03
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001", "CHAR-002"]
    looks: ["[待补：念念]", "CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      苏记大堂中央的方桌旁，念念坐在儿童加高椅上，面前摆着一个小小的鸳鸯锅（没有辣的那半给她装的是番茄汤底）。她用小筷子笨拙地夹着鱼丸，一会儿说成都话一会儿说
      东北话。苏辣辣和陆北辰分坐两侧，看着女儿的眼神像在看世界上最珍贵的鸳鸯锅。背景的灯笼暖光把一家三口的影子投在墙上，像一幅温暖的剪纸画。
    dialogue:
      - speaker: [待补：念念]
        emotion: "夹鱼丸·成都话"
        line: "妈妈，这个巴适得很！"
      - speaker: CHAR-001
        emotion: "笑·教"
        line: "对了！再用东北话说一遍？"
      - speaker: [待补：念念]
        emotion: "认真·东北话"
        line: "贼拉好吃！"
      - speaker: CHAR-002
        emotion: "低头·嘴角上扬"
        line: "……教得好。"

  - shot_id: EP70-S04
    scene: SCENE-001
    characters: ["CHAR-001"]
    looks: ["CHAR-001-L01"]
    shot_size: MCU
    duration_sec: 12
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣站在苏记大堂的展示墙前，墙上挂着苏记从老店到新店的变迁照片（暖色边框无文字）。她的手轻轻搭在墙上的一个相框边角上，辣椒项链在锁骨处随呼吸起伏。她的
      眼神从老照片扫到新照片，嘴角的弧度从回忆的温柔变成现在的满足。背景里陆北辰和念念在远处的桌边笑着说话，声音隐约传来。
    dialogue:
      - speaker: CHAR-001
        emotion: "内心·感慨"
        line: "五年前，苏记还只有一间小破店。"
      - speaker: CHAR-001
        emotion: "内心·温暖"
        line: "现在……全国二十多家了。"
      - speaker: CHAR-001
        emotion: "内心·回头看"
        line: "可最让我骄傲的——还是这间老店。"

  - shot_id: EP70-S05
    scene: SCENE-001
    characters: ["CHAR-002", "CHAR-001"]
    looks: ["CHAR-002-L01", "CHAR-001-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      陆北辰坐在苏记角落的条凳上，膝盖上放着一台薄笔记本电脑，屏幕上是各种数据图表（避免文字展示）。他手指在键盘上轻敲，银框眼镜后的眼神专注——五年后的他沉稳
      了许多，但依旧是那身深蓝T恤的程序员标配。苏辣辣从后面走过来，手搭在他肩上，低头看他的屏幕。他抬头看她，嘴角难得扬起一个完整的弧度。
    dialogue:
      - speaker: CHAR-001
        emotion: "搭肩·低头"
        line: "忙什么呢？"
      - speaker: CHAR-002
        emotion: "抬头·平静"
        line: "季度报告。"
      - speaker: CHAR-001
        emotion: "笑着戳他脸"
        line: "陆总，上市了还亲自写报告？"
      - speaker: CHAR-002
        emotion: "拉她手·低声"
        line: "习惯了。改不了。"
      - speaker: CHAR-001
        emotion: "内心·甜"
        line: "五年了……这双手，还是只肯敲键盘和牵我。"

  - shot_id: EP70-S06
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣和陆北辰面对面坐在鸳鸯锅两侧——跟EP01第一次见面时一模一样的位置。锅里红白两汤都在沸腾，蒸汽在两人之间缭绕。她夹起一片毛肚在红汤里涮，然后放进
      他碗里。他夹起来嚼了两下——耳尖红了。五年了，这个反应一点没变。两人隔着蒸汽对视一笑。
    dialogue:
      - speaker: CHAR-001
        emotion: "夹毛肚·笑"
        line: "还辣不辣？"
      - speaker: CHAR-002
        emotion: "嚼·不动声色"
        line: "不辣。"
      - speaker: CHAR-001
        emotion: "指他耳朵·大笑"
        line: "骗人！你耳朵又红了！"
      - speaker: CHAR-002
        emotion: "低头·嘴硬"
        line: "热的。"

  - shot_id: EP70-S07
    scene: SCENE-001
    characters: ["[待补：念念]", "CHAR-001", "CHAR-002"]
    looks: ["[待补：念念]", "CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MS
    duration_sec: 11
    mode: i2v_ref
    camera: 固定镜头
    description: >
      念念从儿童椅上探出小脑袋，圆圆的眼睛亮晶晶地看着爸爸妈妈隔着鸳鸯锅互相喂食的样子。她的嘴里还含着半颗鱼丸，小脸鼓成一个包子。她歪着头，小揪揪跟着歪向一边
      ，一脸好奇。背景的灯笼暖光把她的小脸蛋照得红扑扑的。
    dialogue:
      - speaker: [待补：念念]
        emotion: "含鱼丸·含糊"
        line: "妈妈？"
      - speaker: CHAR-001
        emotion: "转头·温柔"
        line: "嗯？"
      - speaker: [待补：念念]
        emotion: "吞下鱼丸·好奇"
        line: "你们……是怎么认识的呀？"

  - shot_id: EP70-S08
    scene: SCENE-001
    characters: ["CHAR-001", "CHAR-002", "[待补：念念]"]
    looks: ["CHAR-001-L01", "CHAR-002-L01"]
    shot_size: MCU
    duration_sec: 12
    mode: i2v_ref
    camera: 镜头推近
    description: >
      苏辣辣和陆北辰同时愣住——然后对视。鸳鸯锅蒸汽在两人之间升腾。苏辣辣的大杏眼弯起来，嘴角翘着，看向陆北辰——"你说还是我说？"陆北辰银框眼镜后的眼神难得
      柔软，薄唇微抿，微微点头让她来。苏辣辣转头看向念念，伸手摸了摸她的小揪揪。背景灯笼暖光把这一刻定格得像一幅画。
    dialogue:
      - speaker: CHAR-001
        emotion: "愣·笑·看陆北辰"
        line: "这个嘛……"
      - speaker: CHAR-002
        emotion: "点头·轻声"
        line: "你说。"
      - speaker: CHAR-001
        emotion: "摸念念头·温柔"
        line: "念念想听啊？这故事可长了——"
      - speaker: CHAR-001
        emotion: "内心·暖"
        line: "从一锅红汤说起……"
      - speaker: 旁白
        emotion: "温柔·笑意"
        line: "五年前的那顿鸳鸯锅——她至今还记得第一口的辣。"
      - speaker: 旁白
        emotion: "温柔·笑意"
        line: "五年前的那顿鸳鸯锅——她至今还记得第一口的辣。"
