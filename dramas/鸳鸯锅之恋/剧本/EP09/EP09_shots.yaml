    dialogue: "**CHAR-006**[叹气·摇头]：「闺女……你这包的是饺子还是面饼？」**CHAR-006**[自语·低声]：「饺子都包不好，以后怎么过日子？」**CHAR-001**[低头·脸红]：「阿姨……对不起……我再练练……」**CHAR-002**[低声]：「妈，她第一次——」**CHAR-006**[摆手打断]：「你别说话。」"

