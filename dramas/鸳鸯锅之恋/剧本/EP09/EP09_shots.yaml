    visual_description: "苏辣辣双手伸进画面，左手托饺子皮，右手用筷子夹馅。饺子皮软塌塌粘在指尖，左手扯右边黏，馅从另一侧漏出。手指笨拙，指甲缝嵌面粉和肉末。镜头缓推近她的脸：咬着下唇，额头沁细汗，碎发黏在太阳穴。背景陆妈在左侧边缘双手飞速搓剂子，形成高手vs菜鸟对比。暖黄灯光下，手上面粉如薄雪。"
    dialogue: "**CHAR-001**[内心·急]：「稳住……不就是一张皮嘛，我苏辣辣什么阵仗没见过？」**CHAR-001**[咬唇·手上忙]：「等等……先捏这边还是那边？」**CHAR-001**[内心·慌]：「天哪……手好黏……完了完了……」"

