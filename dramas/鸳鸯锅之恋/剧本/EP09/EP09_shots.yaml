    visual_description: "哈尔滨陆家厨房，圆木桌上铺白色棉布，面粉袋、擀面杖、肉馅盆和饺子皮铺满桌面。陆妈坐在桌左侧，深红针织开衫，栗色烫发蓬松，双手飞快搓着剂子。苏辣辣坐在对面，白T恤外套酒红围裙，辣椒项链在锁骨处微晃，眼神紧张。陆北辰站在苏辣辣身后，双手插兜，银框眼镜后眼睛微眯。窗户凝结厚霜，透进冷蓝冬光与室内暖黄灯光对比。墙上泛黄全家福。"
    dialogue: "**CHAR-006**[兴奋·连珠炮]：「来来来，看好了——饺子皮中间放馅，对折，捏紧边，再折花边！」**CHAR-006**[边示范边说]：「咱家饺子讲究皮薄馅大，褶子要匀！」**CHAR-001**[紧张·吞咽]：「好……好的阿姨。」**CHAR-002**[低声·在苏辣辣身后]：「别紧张。」"

