    visual_description: "陆妈双手叉腰站桌边，目光从桌上饺子扫到陆北辰脸上再扫到苏辣辣脸上。陆北辰低头假装整理饺子皮，耳尖通红。苏辣辣手足无措站一旁，围裙沾满面粉。桌上两堆饺子形成鲜明对比。陆妈深吸气，双手抱胸，嘴角带"我就知道"的笑。椅背上搭着大花袄（PROP-007）色彩鲜艳。"
    dialogue: "**CHAR-006**[叹气·抱着胳膊]：「行了——天下男人都一样。」**CHAR-006**[摇头·自语]：「当年你爸追我那会儿，也偷偷帮我干活。」**CHAR-002**[低声·心虚]：「我没……」**CHAR-006**[打断·指着他]：「你闭嘴。」**CHAR-001**[内心·受挫]：「被发现了……更丢人了……」"

