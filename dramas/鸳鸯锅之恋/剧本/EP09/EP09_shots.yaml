    visual_description: "苏辣辣低头盯桌上丑饺子，手指在围裙上无意识搓着。突然动作停住——眼睛猛地亮起来，嘴角微扬。缓缓抬头，视线落在厨房调料架——一排川味调料瓶在暖光下泛微光。辣椒项链在锁骨处随深呼吸微微起伏。镜头推近她侧脸，眼神从沮丧切换成兴奋，眼里燃着小火苗。背景虚化，只剩她和调料架。"
    dialogue: "**CHAR-001**[内心·转]：「等等……阿姨之前说什么来着？她最爱尝鲜？」**CHAR-001**[内心·兴奋]：「不对……如果把川味……做成饺子馅呢？」**CHAR-001**[眼睛亮了·自语]：「对啊——我包饺子不行，可火锅……那是我的地盘！」

