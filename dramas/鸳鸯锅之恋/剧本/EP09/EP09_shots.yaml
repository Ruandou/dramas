    visual_description: "一盘饺子端上桌——外观东北饺子形状，但蘸料碟里红亮辣椒油，撒花椒粒和香菜碎。白瓷盘热气腾腾，饺皮晶莹透亮，隐约见红油浸润馅料。陆妈坐桌前用筷子夹起一个饺子犹豫送进嘴里。镜头推近她脸——咬下去瞬间咀嚼慢下来，眉头先微皱再松开，眼神从怀疑变意外再变若有所思。苏辣辣双手紧握膝盖上，屏住呼吸盯着陆妈。窗外暮色渐沉，厨房暖光把陆妈脸照得如油画。"
    dialogue: "**CHAR-001**[紧张·递盘]：「阿姨……这是我的新做法。火锅馅饺子。」**CHAR-001**[内心·祈祷]：「求求了……一定要行……」**CHAR-006**[咬一口·咀嚼·停住]：「……」**CHAR-006**[眼睛微睁·慢嚼]：「这味道……」**CHAR-006**[缓缓放下筷子·盯着苏辣辣]：「……有点东西。」"
