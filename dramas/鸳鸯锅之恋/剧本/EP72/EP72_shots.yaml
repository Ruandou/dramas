        line: "我要吃那边的！"
      - speaker: CHAR-001
        emotion: "犹豫·看陆北辰"
        line: "那边……辣的。"
      - speaker: [待补：念念]
        emotion: "挺胸"
        line: "不怕！"
      - speaker: CHAR-002
        emotion: "内心·紧张"
        line: "跟她妈……一模一样。"

