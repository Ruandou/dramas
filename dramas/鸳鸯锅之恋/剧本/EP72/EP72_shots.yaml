    description: >
      苏记老火锅大堂夜晚打烊后，只剩角落一桌亮着灯。铜质鸳鸯锅（`PROP-001`）摆在桌子中央——红汤翻滚冒泡、白汤清澈沸腾，跟EP01一模一样的锅，一样
      的位置。苏辣辣坐在左边（跟EP01她站的位置一样），白T恤外罩酒红围裙，辣椒项链在锁骨闪光。陆北辰坐右边，深蓝T恤，银框眼镜，键盘帽吊坠在领口。念念坐在
      两人中间的加高椅上，面前是番茄汤底的小碗。墙上"苏记"牌匾在暖光里泛着金边——和第一集一模一样。
    dialogue:
      - speaker: CHAR-001
        emotion: "看着锅·笑"
        line: "打烊了——就咱仨。"
      - speaker: CHAR-002
        emotion: "点头·轻声"
        line: "嗯。跟第一次一样。"
      - speaker: CHAR-001
        emotion: "眨眼"
        line: "你还记得第一次？"
      - speaker: CHAR-002
        emotion: "平静"
        line: "忘不了。"

