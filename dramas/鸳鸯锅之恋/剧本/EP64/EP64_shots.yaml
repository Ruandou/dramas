        line: "嘿嘿……"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "打开罐子·深吸一口气"
        line: "啊……就是这个味。"

  - shot_id: EP64-S08
    scene: SCENE-001
