    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "站在身后·平静"
        line: "……苏辣辣。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "浑身一僵·慢慢转头"
        line: "……"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "走近一步"
        line: "手指上是什么？"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "心虚·藏手"
        line: "没……没什么。"

  - shot_id: EP64-S10
