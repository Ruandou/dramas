        line: "就一口……就一口……"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "手指送到嘴边"
        line: "宝宝——妈妈替你尝尝……"

  - shot_id: EP64-S09
    scene: SCENE-001
    characters: [CHAR-002]
