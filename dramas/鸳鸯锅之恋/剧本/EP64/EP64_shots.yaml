      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "眼巴巴看辣椒"
        line: "……一口。就一口。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "头也不回"
        line: "不行。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "嘟嘴"
        line: "半口？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "端汤过来"
        line: "零口。"

  - shot_id: EP64-S03
    scene: SCENE-001
    characters: [CHAR-001]
    looks: [CHAR-001-L03]
    frame_size: MCU
    duration_sec: 5
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "喝一口·表情垮掉"
        line: "这……这是白开水吧？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "面无表情"
        line: "加了枸杞和红枣。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "推碗"
        line: "陆北辰——我是孕妇，不是尼姑！"

  - shot_id: EP64-S04
    scene: SCENE-001
    characters: [CHAR-002]
    looks: [CHAR-002-L01]
    frame_size: MCU
    duration_sec: 6
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "拍纸"
        line: "医生说的。辣椒刺激子宫收缩。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "不服"
        line: "那我吃了二十七年辣——"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "打断"
        line: "以前是以前。现在——"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "看着她"
        line: "你不是一个人了。"

  - shot_id: EP64-S05
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L03, CHAR-002-L01]
    frame_size: MS
    duration_sec: 10
    camera_movement: 固定镜头
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "踢他·嘟嘴"
        line: "苏记老火锅老板娘——不能吃辣。你觉得合理吗？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "不动"
        line: "合理。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "瞪眼"
        line: "你——"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "放下碗"
        line: "微辣。可以。中辣——不行。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "眼睛亮了"
        line: "微辣？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "点头"
        line: "就微辣。多一粒辣椒面都不行。"

  - shot_id: EP64-S06
    scene: SCENE-001
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L03, CHAR-002-L01]
    frame_size: MCU
    duration_sec: 10
    camera_movement: 缓推
    dialogue:
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "勾小指"
        line: "那——微辣。说话算数？"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "握住她的手"
        line: "算数。"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "靠在他肩上"
        line: "好吧……微辣也是辣。"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "内心"
        line: "她不知道——微辣那碟，我减了三成辣度。"

  - shot_id: EP64-S07
    scene: SCENE-001
