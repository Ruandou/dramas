      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "舔嘴角"
        line: "……"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "叹气"
        line: "苏辣辣——"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
        emotion: "嘴硬"
        line: "我就闻了闻！"
      - speaker: CHAR-002
        voice: "{voice:CHAR-002}"
        emotion: "走近"
        line: "闻了闻？"
      - speaker: CHAR-001
        voice: "{voice:CHAR-001}"
