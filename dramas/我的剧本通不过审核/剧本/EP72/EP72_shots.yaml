  content: 林小满笑了好一会儿才停下来。她擦了擦眼角——不是笑出眼泪——是笑得整个人都暖了。她看着屏幕上那个像素小人——笑着摇了摇头——然后伸出手——轻轻合上了笔记本电脑。房间里安静了一秒。然后她——又轻轻打开了。屏幕再次亮起——这一次——不是像素风了。屏幕里——是正常大小的沈长渊·古装。他站在她写过无数次的那座城墙上——夕阳在他身后铺开，暖金色的光勾勒出他的轮廓——玄色锦袍，玉冠束发——和EP01她第一次在剧本世界里见到他时一模一样。但完全不同的是——他的表情。不是那个"又来了一个编剧"的冷脸——是一种被期待着的、带着温度的、温暖的笑意。他看着她——没有说话——但目光里什么都说了。她看着他——也没有说话
  characters:
