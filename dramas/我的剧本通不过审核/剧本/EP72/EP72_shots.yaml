  content: 清晨的出租屋——和EP01一模一样的房间，阳光从半开的窗帘照进来。但桌上没有堆满稿纸——干净整洁，有一盆小小的绿植和一本书——《我的剧本通不过审核》样书（`PROP-014`），封面朝外。笔记本电脑（`PROP-001`）合着放在桌上。林小满坐在桌前——穿着一件宽松的灰色连帽卫衣——和EP01第一镜一模一样的卫衣。但她的表情完全不同——不是熬夜后的疲惫和焦虑——是一种从容的、带着笑意的平静。她一手端着咖啡杯，另一只手在手机上回消息——嘴角带着日常的甜。
  characters:
