  content: 林小满靠在椅背里——慢慢地、温暖地笑了。她看着屏幕上闪烁的光标——像在看一个以前很重要、但现在不再需要每天盯着的东西。她对着屏幕——像是对着那个世界里所有的人说话——声音轻而温暖，没有负担，只有一种安静的确认。她说完之后——伸出手——没有保存文档——直接点了关闭按钮。光标消失了——文档关闭了。然后她——轻轻合上了笔记本电脑。咔哒一声——很小的声音——但在安静的傍晚房间里很清晰。她合上电脑后——没有立刻站起来——就那样坐着，手还放在合上的电脑上——嘴角带着一个很淡的笑意。像是完成了一件不需要完成的事——然后发现不完成也可以。
  characters:
  - CHAR-001
  dialogue: 我不用写——你们也活得很好。
