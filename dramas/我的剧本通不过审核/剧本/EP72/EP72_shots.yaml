  content: 午后——林小满的出租屋。笔记本电脑合着。她靠在椅背里，刚和现实沈长渊发完消息——表情轻松温暖。她放下手机，站起来，走到书架前——把样书调整了一下位置——然后拿起背包（里面装着笔记本电脑），准备出门。出门前——她回头看了一眼桌上合着的电脑——嘴角浮起一个心照不宣的笑意——像在说"晚上见"。然后她对着电脑说了一句话——像每天出门前都会说的那句。
  characters:
