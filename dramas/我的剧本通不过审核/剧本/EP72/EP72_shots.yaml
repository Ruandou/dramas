  content: 林小满听到那个声音——不急着打开——歪着头，嘴角带着狡黠的笑意。她对着合上的电脑说话——语气里带着调侃——像一个终于掌握了主动权的人在逗一个被关在外面的纸片人。古装沈长渊的声音从电脑里传出来——语气里带着一丝被逗到了但努力维持镇定的轻哼——他的回答让林小满的笑意更深了——"不是纸做的了"——这句话里装着他们一起走过的全部剧情——从纸片人觉醒到获得自由意志——他知道她懂。
  characters:
