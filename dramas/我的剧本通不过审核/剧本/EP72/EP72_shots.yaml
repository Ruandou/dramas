  content: 林小满笑了好几秒之后——终于大发慈悲地伸出手——轻轻掀开了笔记本电脑的屏幕。屏幕亮起的瞬间——她的笑意停住了——不是因为惊吓——是因为屏幕上出现的画面。不是文档——不是桌面——是一个像素大小的、由几个方块组成的小人——站在一片像素风的城墙上——冲她眨了眨眼——两个像素点的眼睛交替亮了一下。她盯着那个像素小人看了三秒——然后整个人——笑得趴在了桌上——她怎么也没想到——那个在剧本世界里说一不二、惜字如金的沈长渊——会把自己压缩成一个像素小人来抗议被关在外面。他的声音——还是那个低沉磁性的声音——但从像素小人的嘴里说出来——喜剧效果直接拉满。
