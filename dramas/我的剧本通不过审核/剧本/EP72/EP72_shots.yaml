  content: 笔记本电脑屏幕亮起——登录了微信网页版，右下角弹出消息预览——翠微发来一张太妃茶馆新茶点的照片。林小满笑了一下——没点开——关掉了通知。她打开了一个新的文档——光标在空白页上闪烁。屏幕的光映在她脸上。她看着那个闪烁的光标——双手放在键盘上——但没有立刻打字。她停顿了。不是"不知道写什么"的停顿——是一个人在意识到某件事时的停顿。她的手指没有落下去——她歪了歪头——看了看窗外的暮色——又看了看光标——表情从"准备写"慢慢变成了"等一下——"的思索状。
