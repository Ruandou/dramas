- shot_id: EP63-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满的脸埋在交叉的双臂里，枕在桌面上。电脑屏幕的微光映在她脸侧——文档停在御花园婚礼那一幕。窗外杭州傍晚，暖金色夕阳从窗帘缝隙斜射进来，在桌面上铺开一道细长的光带。她的睫毛动了动——从熟睡中慢慢苏醒。
  characters:
  - CHAR-001
  dialogue: 两个小时……？
- shot_id: EP63-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她抬起头，眯着眼适应光线。桌上的手机亮着——橙姐的来电。她看了一眼屏幕上的婚礼文档——翠微拿着算盘、赵景和穿着喜服、花瓣飘落在红绸上。她嘴角不自觉地微微扬起。然后接起电话。
  characters:
  - CHAR-001
  dialogue: 橙姐——
- shot_id: EP63-S03
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 镜头跟随
  content: 挂了电话，她从桌前站起来，走到窗边拉开半掩的窗帘。杭州城在脚下铺展开——天际线被夕阳染成温柔的橘粉色，下班高峰的车流像流动的光河。她站在窗前发了一会儿呆——好久没在这个时间醒来了。
  characters:
  - CHAR-001
  dialogue: 她第一次在这个时间，看见自己住的城市在傍晚的样子。
- shot_id: EP63-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 她转身走向门口。镜头从窗边拉远，框入房间全貌——堆着没叠的被子、散落的稿纸、墙角半枯的绿萝。走廊光线从门外照进来，和房间的暖色不同，是更冷的金白色。她走出去，脚步声在旧木地板上轻轻响起。走廊空荡荡的，所有房门紧闭。尽头有一扇窗——窗外的天空从橘粉渐变成灰蓝。而在窗户左侧——一扇门，半掩着。
  characters:
  - CHAR-001
  dialogue: 走廊很安静——楼上没人，楼下也没声音。
- shot_id: EP63-S05
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 她沿着走廊慢慢走近那扇门。旧木门，白色油漆泛黄，门牌号被一张泛黄的便利贴遮住。门缝里透出一道暖色的光——不是夕阳的暖，是更沉静、更稳定的暖黄。她站定在门前，离门板只有一步的距离。里面有声音——不是风声，不是老鼠——是人的动静。木头轻轻碰触的声音，布料的摩擦声，从容而有节奏。她侧耳听了一下，呼吸不自觉地放轻了。
  characters:
  - CHAR-001
  dialogue: 里面有人——她住了三年都不知道隔壁住着谁。
- shot_id: EP63-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她抬起手——指尖停在木门边缘，离门板只有一厘米。她能感觉到门缝里渗出的暖意——和走廊傍晚的微凉空气形成温差。她深吸了一口气，指尖轻轻抵在门板上，向前推了一下。门没有锁——随着力道无声地敞开，旧门轴发出轻微的一声"吱——"。
  characters:
  - CHAR-001
- shot_id: EP63-S07
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 门完全敞开。暖黄色灯光涌出来，将站在门口的她的轮廓包裹在一片温暖的光晕里。房间不大但整齐——墙边靠着一排画框，有的用白布盖着，有的露出油彩一角。地上铺着深灰色旧地毯，散落着几卷纸和几支笔。靠近窗户的地方有一张木桌，老式台灯是唯一的光源。而背对着她——有一个人站在近处的画架前，正在整理一幅画框。白衬衫，袖子整齐地卷到小臂。
  characters:
  - CHAR-001
  dialogue: 真的有人——
- shot_id: EP63-S08
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 他背对着她，侧身用软布擦拭画框边缘。动作很轻，不疾不徐——像做了很多年，熟练到不需要思考。白衬衫背后有浅浅的褶皱——穿了一整天的自然褶皱。他放下软布，微微侧过头拿起笔——就在那一瞬间，暖黄的台灯光勾勒出他的侧面轮廓。高挺的鼻梁。清晰的下颌线。微微垂下的眼睫——银丝眼镜的细框在灯下反射出一线微光。她认识这张侧脸。她在一台旧电脑前，对着一片空白的文档，用文字描述过这张脸无数次——"沈长渊面容冷峻，下颌线棱角分明"。此刻就在她面前，暖色的灯光里。
  characters:
  - CHAR-001
  dialogue: 不是像——是他。
- shot_id: EP63-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 他似乎感觉到了身后的目光——手上的动作停了一下。不是被吓到的停顿——是"我知道你来了"的那种从容。他放下笔，直起身，然后慢慢转过身来。暖黄的灯光在他转身的瞬间从正面照亮了他的脸——银丝细框眼镜，镜片后的眼睛在光里微微眯了一下。那张脸。她写在纸上的那张脸。和她笔下的人一模一样——只是没有束发、没有古装、多了一副眼镜。
  characters:
  - CHAR-003
  dialogue: 他转过身来——像是一直在等她推门。
- shot_id: EP63-S10
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 他看到了站在门口的她。没有惊讶——而是嘴角微微上扬，浮起一个她太熟悉的弧度。不是客套的微笑——是一种混合了"你终于来了"和"我知道你会来"的、温和而笃定的笑意。他开口了——声音比她想象中低一些，温润的，但音色里的底色——和古装版一模一样。
  characters:
  - CHAR-003
  dialogue: 醒了？
- shot_id: EP63-S11
  scene_id: SCENE-001
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满向前走了一步——让自己更完整地站进门里的光中。她的目光没有从他脸上移开。眼镜、短发、没有玉冠的额头、没有玄色锦袍的白衬衫——但眼神，那个看着她的方式——和古装沈长渊一模一样。他注意到她在打量自己——没有躲闪，温和地迎着她的目光。他转身拿起桌上一本摊开的笔记本——封面是她的字迹。翻到最后一页——"全文完"两个字，旁边有一滴干了的水渍。他的声音不高不低，每一句话都像在丢一枚硬币——"隔壁""那天""哭了"——每一个词都精准地命中她记忆里的对应碎片。
  characters:
  - CHAR-001
  dialogue: 你怎么在这扇门后面？
- shot_id: EP63-S12
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 他没有直接回答。而是轻轻合上手里的笔记本——指尖在"全文完"三个字上停了一瞬。然后他抬起头，目光从笔记本移到她脸上。嘴角慢慢浮起一个弧度——不是温和客气的笑，是古装沈长渊每次把她从困境中捞出来时露出的、带着一点"我早就知道"意味的笑容。暖黄的光线里，两个人隔着几步的距离对视。他开口了——声音不高不低，带着一种已经知道答案的温和笃定。那一刻不只是现实的沈长渊在问——另一个世界的沈长渊也在问同一个问题。两个世界在这一句话里，对齐了。
  characters:
  - CHAR-003
  dialogue: 所以——你写完结局了？
