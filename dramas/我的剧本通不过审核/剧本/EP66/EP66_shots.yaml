  camera: i2v_ref 固定镜头
  content: 深夜的出租屋，暖黄台灯是唯一光源。林小满坐在电脑前——但姿势和以前完全不同。以前是瘫在椅子上、皱着眉头盯着屏幕的疲惫编剧。现在她微微前倾，双手流畅地敲击键盘，眼睛亮亮的，嘴角带着不自觉的笑意。笔记本电脑（`PROP-001`）屏幕映亮她的脸——她的表情不像在"工作"，像在做一件她很享受的事。她停下来看着屏幕，轻声念出自己刚写的句子——不是确认台词，是在品味。她微微后仰靠在椅背上，看着天花板，嘴角的笑意更深了。几秒安静——只有键盘声和窗外远处的车流声。然后她重新坐直，手指放回键盘——还想继续写。整个镜头是一气呵成的长拍，让观众感受到她沉浸在自己世界里的那种连续的满足感。
  characters:
  - CHAR-001
  dialogue: 不是甜宠穿越——不是古装宫斗——
- shot_id: EP66-S02
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 手机（`PROP-002`）在桌上震动，屏幕亮起——橙姐来电。林小满看了一眼，接起来，语气带着罕见的轻快——不是被催稿的紧张，是正写到开心处被打断但心情很好的松弛。她用肩膀夹着手机，手还在键盘上轻轻敲着——舍不得停下来。
  characters:
  - CHAR-001
  dialogue: 喂——橙姐。你打来得正好——我正写到关键地方。
- shot_id: EP66-S03
  scene_id: SCENE-001
  duration_sec: 7
  camera: i2v_ref 固定镜头
  content: 林小满靠在椅背上接电话，嘴角带着笑。画面叠化快切到电话那头的橙姐——办公室夜晚，橙姐坐在桌前，面前堆着稿件，电脑亮着。她听到林小满说"写别的东西"时——没有追问，但语气里带着一丝被勾起的好奇。她没有逼问——只是留下一句开放的话，然后挂了。林小满放下手机，看回屏幕，深吸一口气，继续打字——比之前更有动力了。
  characters:
  - CHAR-001
  dialogue: 别的东西？
- shot_id: EP66-S04
  scene_id: SCENE-012
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 橙姐的办公室——阳光从落地窗照进来，白板上贴满便签，桌上稿件堆成小山。林小满站在橙姐桌前，手里拿着一叠打印稿——只有几页纸，但她的表情比交一部完整的剧本还要郑重。她把稿子放在橙姐面前，封面没有标题，只有一行手写的字。橙姐从电脑屏幕上抬起头，目光从稿件移到林小满脸上，看到她表情的认真——不是害怕被批评的紧张，是"认真得不能再认真"的郑重。橙姐拿起稿子，看了一眼封面——没有标题——然后翻开第一页。她没说话，开始读。林小满站在桌前看着她读。整个镜头是一个连贯的中景——两人的互动在固定画框内完整呈现。橙姐翻完第一页后抬起头——表情不是"写得不错"，也不是"这里要改"——是一种复杂的、带着一丝意外的认真
  characters:
  - CHAR-001
  dialogue: 橙姐——我写了点东西——你帮我看看。
- shot_id: EP66-S05
  scene_id: SCENE-012
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 橙姐的脸——她低着头在看稿子，阳光从侧面照在她脸上。她的表情很安静——没有皱眉，没有职业审视的挑剔。她翻了一页——手指在页边停了一下。她的嘴角——几乎看不出来地——微微动了一下，不是笑，是一种"被击中"的微妙反应。她继续往下读——速度没有加快，但也没有变慢——她在认真咀嚼每一个字。
  characters:
  - CHAR-008
  dialogue: 这不是她以前写的那种——
- shot_id: EP66-S06
  scene_id: SCENE-012
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 橙姐合上最后一页——没有立刻抬起头。她低着头，手按在稿子的封面上——那是一个从未有过的停顿。林小满站在桌前，手不自觉地攥着衣角——她没有催，没有问"怎么样"，只是站在那里等着。办公室里安静得只剩下窗外远处城市的声音。那几秒的沉默在画面里被拉长——像是一场编辑和作者之间最安静的对话。然后橙姐抬起头——看着林小满——目光里没有"写得不错"的赞赏，也没有"这里要改"的职业反馈。是一种更复杂的、带着一丝震动和重新认识的认真。她开口时，声音平静——但每一个字都带着一种很少在她语气中出现的郑重。
  characters:
  - CHAR-008
  dialogue: 你把前三集——全部写完再叫我。
- shot_id: EP66-S07
  scene_id: SCENE-012
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在桌前——橙姐说"全部写完再叫我"之后，她愣了一下。不是因为被拒绝——是因为橙姐说的是"写完再叫我"，不是"写完再给我看看"——那种语气里带着"这个稿子值得我专门等"的隐含意思。她的表情从紧张慢慢变成一种小心翼翼的期待和不敢确认的震撼。
  characters:
  - CHAR-001
  dialogue: 你的意思是——
- shot_id: EP66-S08
  scene_id: SCENE-012
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 橙姐没有直接回答"通过了"——她站起来，拿起那叠稿子，没有还给林小满——而是放进了自己办公桌的抽屉里。那个动作，比任何语言都更有分量。然后她转过身，看着林小满——说出了一句她作为编辑从未对任何作者说过的话。她说的时候声音平静——但每一个字都是她从阅读那三集的过程中得出的、不容置疑的结论。说完之后，办公室里安静了一瞬——这句话的分量，比任何五星好评都要重。
  characters:
  - CHAR-008
  dialogue: 把这个写完。上一本——我不要了。
- shot_id: EP66-S09
  scene_id: SCENE-001
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满坐在电脑前——她刚从外面回来，卫衣外面还套着一件薄外套，没来得及脱。但她已经坐在桌前，打开了新文档。台灯光照亮键盘一角，笔记本电脑（`PROP-001`）屏幕上光标闪烁。她深吸一口气——手指悬在键盘上方——不是犹豫，是"准备好了"的停顿。然后开始打字——比之前更快、更坚定。手机震动——是橙姐的微信语音。她点开——橙姐的声音简洁利落，没有催稿的紧迫，只有确认——确认她还在写。林小满回了一条语音，声音里带着笑。语音发出去之后，她把手机放在一边——但没有关静音。她继续打字——键盘声在安静的房间里清脆地响着。整个镜头一气呵成——从打开文档到回复语音到继续写作——展示她带着被认可的能量全心投入的状
  characters:
  - CHAR-001
  dialogue: 好——这次——写完它。
- shot_id: EP66-S10
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的手在键盘上飞快地敲着——突然停下来。她的视线从文档移开，落在电脑屏幕右下角——那里弹出了一个半透明的提示框。不是常见的系统通知样式——淡金色的边框，光影柔和，像是从屏幕内部浮现出来的。她的手悬停在键盘上方。
  characters:
  - CHAR-001
  dialogue: 嗯？
- shot_id: EP66-S11
  scene_id: SCENE-001
  duration_sec: 7
  camera: i2v_ref 固定镜头
  content: 林小满盯着屏幕，表情几秒内变了好几次：困惑→惊讶→然后是一种复杂的——像是"果然如此"的了然。她拿起手机打给橙姐——电话接通后，她没有寒暄，直接说了屏幕上的内容。她的声音里带着一种说不清的微微震颤——不是害怕，是"这个世界的边界比她想象的还要柔软"的那种震撼。橙姐在电话那头沉默了两秒——然后问了一个一针见血的问题。
  characters:
  - CHAR-001
  dialogue: 橙姐——我电脑上弹出了一个提示——检测到新故事框架——是否连接《燕京奇缘》世界观——
- shot_id: EP66-S12
  scene_id: SCENE-001
  duration_sec: 7
  camera: i2v_ref 固定镜头
  content: 屏幕的特写——提示框上写着"检测到新故事框架。是否连接《燕京奇缘》世界观？"下方两个选项——"是"——"否"。林小满握着手机——橙姐问完那句话之后，她轻轻开口，声音很轻但异常坚定——回答了那个问题。电话那头的橙姐停顿了一瞬——然后说出了那句干脆利落的决定。林小满看着屏幕——嘴角慢慢浮起一个带着冒险感的微笑——她移动鼠标，光标从中间缓缓移到"是"上方——轻轻点击。屏幕上闪过一道柔和的金色光芒——像水面的涟漪一样向四周扩散。一个新的窗口浮现——"连接成功"——窗口边框是淡金色的古风纹样——像是两个世界之间的界面，用这种方式告诉她：它们等这一刻已经等了很久。林小满看着屏幕上的"连接成功"——嘴角的笑
  characters:
  - CHAR-001
  dialogue: ……是。
