- shot_id: EP15-S01
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 金銮殿上，文武分列两班。一名身着绯色官袍的老臣出列，手持笏板，躬身行礼。他的声音苍老但中气十足，在金銮殿的穹顶下回荡。他身旁另一名紫袍官员随即附议出列。龙椅上，赵景和眉头紧锁，手握成拳搭在膝上——他预感到今天要发生什么。
  characters:
  - CHAR-007
  dialogue: 两位爱卿——有何事要奏？
- shot_id: EP15-S02
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃坐在龙椅旁侧的椅子上，深紫色宫装，腕间凤镯暗沉。她没看任何人，垂着眼，指尖轻轻摩挲着凤镯的光滑表面——像在抚摸一件熟悉的兵器。大臣们的话音落下后，她才缓缓抬起眼，看向赵景和，嘴角噙着一丝若有若无的微笑。
  characters:
  - CHAR-005
  dialogue: 陛下——朝臣们也是一片忠心。妖女不除，朝廷不安。您说——是吗？
- shot_id: EP15-S03
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和的喉结上下滚动了一下。他看了看太妃——又看了看阶下跪着的大臣们。他的嘴唇动了动，想说"再查查"，但太妃的目光像一根针一样扎在他身上。他低下头，声音越来越小，最后几个字几乎听不见。太妃微微偏头，像在欣赏一只终于学会闭嘴的鹦鹉。
  characters:
  - CHAR-007
  - CHAR-005
  dialogue: 这个……朕觉得……是不是再查一查？林小姐她——
- shot_id: EP15-S04
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和沉默了很久。大殿里只剩下铜壶滴漏的声音和远处隐约的市井喧哗。他终于抬起头——不是看向太妃，而是看向殿门方向。那里站着一个淡紫色身影——林小满被侍卫拦在殿外，她听不到朝堂上的对话，但从赵景和的表情里已经读到了结局。赵景和闭了一下眼睛，再睁开时，声音像换了一个人——不是变硬气了，是放弃了抵抗。每一个字都像从牙缝里挤出来的。殿外，林小满看到赵景和开口的瞬间，双手垂了下去。她知道——完了。
  characters:
  - CHAR-007
  - CHAR-001
  - CHAR-005
  dialogue: 准……准奏。限那女子——三日内离宫。不得再入宫禁。
- shot_id: EP15-S05
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 散朝后。偏殿回廊下，赵景和快步追上林小满。他穿着那身明黄龙袍，但此刻的姿态不像一个皇帝——他缩着肩，声音低哑，像个做了错事被抓住的少年。他的手抬起来想碰林小满的袖子，又收了回去。林小满停下脚步，没有回头。她背对着他，肩膀绷得很紧。
  characters:
  - CHAR-007
  - CHAR-001
  dialogue: 林小姐——你听朕解释——朕不是不想帮你——
- shot_id: EP15-S06
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 赵景和绕到她面前，努力想让她看到自己眼里的真诚。他的少年气在那一刻全部涌上来——他不是在演戏，他是真的愧疚，真的想帮她，但他不知道怎么对抗太妃。林小满看着他的眼睛，看到了一个被设定为"优柔寡断"的皇帝——这不是他的错，是她写给他的设定。她的心软了一下，但更深的绝望涌上来。
  characters:
  - CHAR-007
  - CHAR-001
  dialogue: 朕知道朕对不起你——但太妃她……她在这宫里经营了十几年——朕才刚刚登基——朕的每一步都被她盯着——
- shot_id: EP15-S07
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和离开后，林小满一个人靠在回廊朱红柱子上。她低头看自己的手腕——袖口下，淡金色的"71"安静地亮着。她盯着那个数字，脑子里飞速运转：三天后必须离宫——离开皇宫=无法接触赵景和、太妃、核心剧情——无法在72天内完成剧本——永远困在这个世界的荒野。翠微从柱子后探出头，悄悄走到她身边。她小声开口，语气词全消失了——她在害怕。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 三天……被赶出宫的话，我连赵景和的面都见不到了。
- shot_id: EP15-S08
  scene_id: SCENE-003
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 深夜的书房，烛火摇曳。林小满坐在窗边案几前，手边的茶已经凉透。窗外夜色浓黑，偶尔传来几声虫鸣。突然——门被推开，没有敲门。沈长渊大步走进来，玄色锦袍融入阴影中，只有腰间玉佩在烛光中反射出一点冷光。他手里拿着一卷纸条——不是信纸，是几张折叠过的便签，纸边有被反复打开再折起的痕迹。他把纸条往桌上一放，声音听不出情绪——但就是听不出情绪，才让人觉得他此刻比平时更认真。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 还在想白天的事？
- shot_id: EP15-S09
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满展开纸条。烛光下，十几个名字密密麻麻写满了两页纸，有些名字旁边还标注了官职和"收买方式"——银两、田产、把柄。她的手微微发抖——不是因为冷，是因为她突然意识到太妃的势力比她想象的大十倍。她抬起头看沈长渊——他正看着她，眼神像是在说"现在你知道自己面对的是什么了"。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 十七个……从礼部到御史台……太妃收买了这么多人？
- shot_id: EP15-S10
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满把纸条放下，双手撑在桌上。她看着烛火发呆，脑子里疯狂运转却找不到任何解法。修改太妃的阴谋？不行——太妃如果也有修改能力，她会立刻察觉。修改大臣的记忆？——那要改十七个人的参数，倒计时直接清零。她越想越绝望。沈长渊看着她的表情变化——从震惊到思考到绝望——他知道她已经把所有的路径都走了一遍，全部是死路。他靠在椅背上，双手抱在胸前，开口了——不是安慰，是激将。他就是要逼她走到极限。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我没法改——修改太妃的阴谋她会察觉——修改大臣的记忆要消耗太多时间——我——
- shot_id: EP15-S11
  scene_id: SCENE-003
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 沈长渊的话像一根针扎进林小满的胸口。"本事只能写写偶遇戏"——她张了张嘴，想反驳，但没说出来。因为他说的有一部分是真的——她确实一直在用小修小补的方式处理问题。她坐在那里，烛火在她瞳孔里跳动。沈长渊也不催她，就坐在对面，双臂抱胸，看着她——他知道她在思考，而思考需要时间。窗外隐约传来更夫的梆子声——三更天了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ……
- shot_id: EP15-S12
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满没有立刻回答沈长渊。她站了起来，在书房里踱步——从窗边走到书架前，又从书架走回桌边。脑子里碎片的念头像弹幕一样划过。她自言自语般地整理思路，语速飞快——这是她紧张时的习惯，沈长渊已经学会了在她"碎碎念模式"时不打断她。他安静地坐在那里，看着她像困兽一样在房间里转圈。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我一直在想怎么改太妃的阴谋——但方向错了……方向错了……问题不是太妃——问题是——
- shot_id: EP15-S13
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头推近
  content: 林小满突然停下来——整个人僵住了。她眼睛亮了——不是普通的那种"想到了"的亮，是整个人从里到外被电击了一下的那种通透感。她猛地转向沈长渊，双手撑在桌面上，探过身子，烛火在她瞳孔里烧成两点金色的光。她的声音因为兴奋而微微颤抖。沈长渊的眉毛微微抬起——他看到了一个他从没在林小满脸上见过的表情：不是恐惧，不是焦虑——是猎人看到猎物破绽时的表情。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我不改太妃的阴谋——我改赵景和。
- shot_id: EP15-S14
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满的笑容凝固了。她低头看自己的手腕——淡金色的"71"安静地亮着。她集中意念，在脑子里"翻"世界观设定文档——找到了"角色核心参数修改"那一条。规则浮现在脑海中，像一行代码在屏幕上滚动，她读着读着，脸色一寸一寸变白。沈长渊注意到她的表情变化，没有追问——他等她开口。林小满抬起头，声音平静——但那种平静是强行压出来的。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ……
- shot_id: EP15-S15
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 镜头推近
  content: 沈长渊背对着她站在窗前，没有再说话。书房里只剩下烛火噼啪的声响。林小满低头看着自己手腕上的印记——淡金色的"71"在烛光中微微闪烁。她伸手用指腹轻轻碰了碰那两个数字——微温热，像皮肤下有一盏极小的灯。她闭上眼睛——脑子里飞速计算：如果不改——三日后被驱逐——72天荒野——死路。如果改——消耗5天——还剩66天——但赵景和会变成一个有主见的皇帝——他能在朝堂上驳回太妃——她就能留在宫里。她睁开眼睛，目光从犹豫变得坚定。她没有说话，但她低头看着手腕印记的眼神已经给出了答案——那里面没有恐惧，只有计算之后剩下的决心。
  characters:
  - CHAR-001
  dialogue: 不改——三天后出宫……72天荒野……写不完。
