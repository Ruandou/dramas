- shot_id: EP13-S01
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 御花园僻静处的回廊下，林小满背靠朱红柱子闭着眼——她在脑内"写戏"。睫毛微颤，嘴唇无声地翕动，手指在空中不自觉地比划着段落节奏。翠微蹲在她旁边的石阶上，双手捧着脸，紧张得大气不敢出。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 好……御花园，春光，蝴蝶飞过——你从假山后面走出来，假装在看花……
- shot_id: EP13-S02
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满睁开眼，深吸一口气——"写完了"。她看向翠微，翠微的脸已经红到了耳根。林小满上下打量她——鹅黄衫裙，双丫髻上的彩色发带在春光中格外鲜亮，腰间别着那方比翼鸟绣帕。林小满伸手帮她理了理鬓角的碎发。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 好了。你现在就去假山那边站着——数到五十，然后慢慢走出来，假装在看那丛牡丹。
- shot_id: EP13-S03
  scene_id: SCENE-006
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和沿着花径走来，手里拿着一卷书——但目光根本没在书上，而是心不在焉地扫视着花园。他走到假山附近时，脚步不自觉地放慢了。翠微从假山后慢慢走出来，假装低头看花——她的手指微微发抖，暴露了她的紧张。赵景和看到她时，脚步顿住了。那一顿不是表演——是真的惊喜。他合上书卷，嘴角不自觉地扬起，声音比平时轻了几分。
  characters:
  - CHAR-007
  - CHAR-004
  dialogue: 翠微姑娘？好巧——你也在赏花？
- shot_id: EP13-S04
  scene_id: SCENE-006
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和又走近了半步，两人之间只剩不到两尺的距离。他低头看翠微——她正假装专注地看花，但睫毛在颤，呼吸也不稳。赵景和的目光落在她腰间露出半截的绣帕上——鹅黄色，一角绣着一对比翼鸟，针脚细密，丝线在日光下泛着柔和的光。他认出了那个图案，嘴角的弧度更深了。他的手微微抬起——似乎想去碰那方绣帕——但在碰到之前又收了回来。
  characters:
  - CHAR-007
  - CHAR-004
  dialogue: 这方帕子……上回寿宴——朕好像见你拿出来过。
- shot_id: EP13-S05
  scene_id: SCENE-006
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 气氛正好。赵景和正要说什么——回廊那边传来脚步声。不紧不慢，靴底踏在石板上发出沉稳的声响。沈长渊从花径转角走出来，玄色锦袍在春光中像一道裂痕——冷色调闯入暖色调的画面。他目不斜视，直接走到赵景和面前，拱手行礼。动作标准，表情平淡，但时机精准得像掐着秒表。林小满从回廊柱子后面探出头，瞪大眼睛——她写好的桥段里没有这个人的出场。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-004
  - CHAR-007
  dialogue: 陛下。臣有紧急军务禀报——北境八百里加急。
- shot_id: EP13-S06
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和犹豫了一下——看了看翠微，又看了看沈长渊严肃的表情。军务和儿女私情之间，他选择了前者。他朝翠微幅度很小地点了点头，然后跟着沈长渊离开。翠微站在原地，手里还捏着那方绣帕，表情从刚才的羞涩慢慢变成落寞。林小满从柱子后冲出来，气得脸红。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-004
  - CHAR-007
  dialogue: 朕……先去一趟。改日再聊。
- shot_id: EP13-S07
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满几步追上沈长渊，一把拉住他的袖子。他被拽停了，侧过头俯视她——表情平静，甚至带着一丝"你终于来了"的预料之中。林小满压低声音但压不住怒气。沈长渊没急着回答，先看了看她抓着他袖子的手，然后才抬眼看她。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你干嘛？我好不容易写到他们聊到绣帕了——气氛正好——你进来一句'军务急报'全毁了！
- shot_id: EP13-S08
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满愣住了——她以为沈长渊会狡辩、会敷衍，结果他直接说"写得不行"。她张了张嘴，一时找不到反击的话。沈长渊见她松了手，理了理袖口，声音不紧不慢，像在给她上课。他微微偏头看向远处还站在花丛边发呆的翠微，又收回目光。每一个字都精准地刺中她作为编剧的盲区。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你写的这个偶遇——他正在和心仪的姑娘说话，一个臣子说来禀报军务，他就走了？
- shot_id: EP13-S09
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满站在原地说不出话——沈长渊说得对。她的桥段确实太刻意了，赵景和被一个军务就叫走了，显得他不够坚定。沈长渊看着她的表情变化，知道她想通了。他没有再等，转身要走。林小满下意识追问——她需要一个答案。沈长渊停下脚步，没有回头。他的声音从肩后传来，平静，不带情绪，但每一个字都像刻出来的。说完他继续走，玄色背影消失在花径尽头。林小满站在原地，被那句话钉住了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 那你为什么要帮我改？你明明可以不管——让我写砸了，你不就更显得比我高明？
- shot_id: EP13-S10
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满一个人站在回廊下，春光照在她脸上，但她的表情不像刚才那样愤怒或愣怔——她在思考。沈长渊的话还在她脑子里转——"你写的我太蠢了。我不想当蠢人。"她低头看自己的手腕——袖口下，淡金色的"71"若隐若现。她慢慢抬起眼，目光望向沈长渊消失的方向。远处，翠微还站在花丛边，赵景和已经走了，她正在慢慢把那方绣帕折好收进腰间。林小满看着翠微的动作，嘴角不自觉地浮起一个微妙的弧度——不是笑容，是一种新的理解。
  characters:
  - CHAR-001
  dialogue: 他说的对……那个桥段确实太刻意了。赵景和如果真喜欢翠微，怎么会被人一叫就走。
