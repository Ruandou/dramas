- shot_id: EP20-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 凌晨的出租屋，暖黄台灯是唯一光源。林小满坐在电脑前，屏幕上是密密麻麻的文档，她的脸被屏幕光照亮，眼睛发红——熬夜的疲惫挂在脸上。手机贴在耳边，她一手撑着额头，脸上是"又来了"的无奈表情。桌上咖啡杯已经空了，杯底残留一圈褐色渍迹。
  characters:
  - CHAR-001
  dialogue: 小满——第十五版了。我再给你一天，明晚十二点。
- shot_id: EP20-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的侧脸，手机夹在肩膀和耳朵之间，她低头看着自己握着鼠标的手。手腕上金色的倒计时印记在灯光下泛着微光——数字"62"隐约可见。她深吸一口气，妥协了。挂掉电话后她放下手机，目光落在屏幕上密密麻麻的修改稿上——三幕结构的批注、红色的改写字、叉掉的段落。她自语了一句，声音里全是疲惫。
  characters:
  - CHAR-001
  dialogue: 够。明晚十二点之前，我等你邮件。
- shot_id: EP20-S03
  scene_id: SCENE-001
  duration_sec: 11
  camera: i2v_ref 镜头跟随
  content: 老旧公寓楼的走廊，声控灯昏黄。林小满穿着拖鞋走下楼，身影被拉长在斑驳的墙面上。公寓一楼的信箱区，铁皮信箱排列整齐，有的生锈了。她打开自己的那个——里面除了外卖传单，还有一个牛皮纸信封塞在最深处。她愣了一下——信封边缘露出来一角，泛黄陈旧。她抽出信封，翻到正面——没有邮票，没有邮戳，只有正中间用钢笔写着"林小满
    收"三个字。她翻到背面——没有寄件地址。她的表情从困惑变成了警觉——这封信不是寄来的，是有人放在这里的。
  characters:
  - CHAR-001
  dialogue: 没有邮戳……不是寄来的。
- shot_id: EP20-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 回到房间，林小满把信放在桌上，台灯下。她撕开封口——手指有些不稳。抽出里面的信纸——米白色纸，微微泛黄，折痕清晰。展开，上面只有一行字，钢笔字迹瘦硬有力。她念出声——声音很轻，像是在确认这不是幻觉。念完后她愣住了，把信纸翻过来——背面空白。就这么一句话。她放下信纸，心跳明显加快了——胸口的起伏在灰色卫衣下清晰可见。
  characters:
  - CHAR-001
  dialogue: '''欢迎入住。请帮我把一个人的故事写完。'''
- shot_id: EP20-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满拿起信封，凑到台灯下仔细看——光线透过泛黄的纸面，露出钢笔字迹的墨痕。左上角写着一行小字，刚才没注意到。她的瞳孔微微放大——那行字是"寄件人：沈长渊"。她手指僵了一下，再往下看日期——她搬进来的那一天。她算了一下——三年前。她搬进来那天，这封信就被放进了信箱。她放下信封，手微微发抖。
  characters:
  - CHAR-001
  dialogue: 寄件人——沈长渊……房东？
- shot_id: EP20-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满深吸一口气，把信封翻过来——底部印着一个黑色二维码，不是贴纸，是直接印在纸上的。她用手指摸了摸——印刷的质感，不是后加上的。她的心跳声在安静的房间里有如擂鼓。她拿起桌上的手机——屏幕亮了，锁屏是深夜时间：2:37AM。她打开扫码功能，对准信封底部的二维码。手机屏幕上的取景框框住二维码——她的手指有些颤抖，几次没对准。她深吸一口气稳住手。
  characters:
  - CHAR-001
  dialogue: 二维码？印上去的——不是贴纸。
- shot_id: EP20-S07
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 手机屏幕——扫码成功的提示音。屏幕弹出音频播放界面，一条录音文件，没有文件名，只有日期——三年前的日期，她搬进来的那一天。播放键静静悬浮在屏幕中央。她的手指悬在播放键上方——没有按下去。她看着那个日期，瞳孔微颤。三年前的今天，有人录了一段话给她——在她还不知道会发生什么的时候。她按下了播放键。
  characters:
  - CHAR-001
  dialogue: 三年前的录音……他录了一段话给那时候的我——不，是给现在的我。
- shot_id: EP20-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 手机放在桌上，外放。林小满坐在床边，双手交握在膝盖上——一个防御的姿势，像在等判决。沈长渊的声音从手机里传出来——温和、疲惫、但很清晰。他的语气和古装沈长渊完全不同——没有那种冷峻和锐利，而是带着一种"我等你很久了"的温柔。林小满听到第一声"小满"时，整个人像被电击了一样僵住——这个声音她听过，但从未在现实中听过。她眼眶开始泛红。
  characters:
  - CHAR-001
  dialogue: 小满。
- shot_id: EP20-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的侧脸，台灯光勾勒出她的轮廓。她的眼泪无声滑落——没有啜泣，只有眼泪顺着脸颊流下来。音频继续播放——沈长渊的声音没有解释，没有长篇大论，只是几句简短的话。但每一句都像锤子敲在她心上。"别怕"两个字让她的情绪防线彻底崩塌——她捂住嘴，不让自己哭出声。他什么都知道。三年前的他就知道她会经历这一切。他提前录好了这段话——像一个在岸边等溺水者上岸的人，提前准备好了毛巾和热水。她缓缓闭上眼睛，让眼泪流。
  characters:
  - CHAR-001
  dialogue: 别怕。
- shot_id: EP20-S10
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满擦掉眼泪，拿起手机。录音播放完毕，屏幕上那个日期刺眼地亮着。她深吸几口气——平复呼吸——然后翻到通讯录，按下橙姐的号码。嘟声响起。她用手背胡乱抹了一把脸。电话接通。她的声音在发抖——不是恐惧，是一种被真相冲击后的不稳定。她尽量控制语速，但信息量太大，一句接一句往外倒。橙姐从困倦到清醒到沉默——电话那头安静了几秒，然后传来一声明显清醒了的回应。
  characters:
  - CHAR-001
  dialogue: 橙姐——你还没睡吧？
- shot_id: EP20-S11
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满握着手机，另一只手无意识地捏着信封一角。台灯的光把她的影子投在墙上——一个蜷缩的轮廓。电话那头橙姐在追问，但她不知道该怎么解释——信的内容已经够奇怪了，但二维码和录音才是真正让她后背发凉的东西。她试图描述，发现语言苍白无力。橙姐在电话那头沉默了——编辑的职业直觉告诉她这不是恶作剧。林小满最后那句"三年前的录音里，他让我等他出来"说出口后自己都起了一层鸡皮疙瘩。橙姐的声音严肃了起来——不再是催稿的语气。林小满挂了电话，手机屏幕上通话结束。她低下头，额头抵在桌沿。
  characters:
  - CHAR-001
  dialogue: 信封底部有个二维码。我扫了——是一段录音。
- shot_id: EP20-S12
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 房间重新安静下来。台灯是唯一的光源。林小满抬起头，拿起手机——指尖在屏幕上停了一瞬，然后点下了重播键。沈长渊的声音再次响起——这次她不是第一次听了，但寒意比第一次更甚。那句"我等你出来"在空荡的房间里回响——像一个在隧道尽头等待的人发出的信号。她的目光落在信封上——那行字"欢迎入住。请帮我把一个人的故事写完"在灯光下安静地躺着。她缓缓抬头看向窗外——凌晨三点的城市，只有远处几盏灯亮着。她的声音轻到几乎是气声——一个问题，没有答案。但在这个时刻，她心里已经有了一个她不敢确认的答案。镜头定格在她的侧脸上——眼眶泛红，眼神里是震惊和一种更深的东西——她意识到自己正站在某个巨大谜团的入口处。
  characters:
  - CHAR-001
  dialogue: 小满。别怕。你写得完的。我等你出来。
