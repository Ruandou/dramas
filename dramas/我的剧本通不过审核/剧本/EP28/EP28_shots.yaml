  camera: i2v_ref 镜头跟随林小满走向寝宫门口
  content: 日间的宫廊。阳光透过雕花窗格在青砖地面上投下明暗交错的图案。林小满走在廊下——脚步不快不慢——她的表情不是恐惧，是一种"又来了"的沉重感。她刚从沈长渊的那晚中出来——情感上还没有消化完——就被太妃的人叫来了。太妃寝宫的门在走廊尽头半掩着。两个宫女站在门外，看到她来了，低头行礼然后退到两侧——像平时一样。但林小满知道——今天和平时不一样。她站定在门前，深吸一口气——不是给自己打气，是做好心理准备。
  characters:
  - CHAR-001
  dialogue: 上次来这儿——她要把我写死。上上次——她冻结了密室入口。
- shot_id: EP28-S02
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 镜头从林小满的背后→推向室内→看到太妃
  content: 林小满推开门。太妃寝宫的室内和她记忆中不太一样——平时这里总是昏暗的、深紫色帷幔低垂、空气中有沉香的压迫感。但今天的寝宫——窗帘半卷，阳光从高窗照进来——深紫色的帷幔在光线下显出了暗红色——这种暖色调让整个房间看起来没那么压抑。太妃没有坐在她平时那张主位上——她坐在窗边的矮榻上，没有穿那身沉重的盛装宫服——只穿了一件深色缎面的日常长袍，发髻也比平时简单——没有凤钗，没有珠翠。她没有在等林小满走进来——她正在翻阅一本书。听到脚步声，她抬起了眼睛——目光不是平时的锐利审视——而是平和的注视。这让林小满的所有防御扑了个空。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: ——
- shot_id: EP28-S03
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在几步之外，表情从警惕变成了困惑。她没有立刻走过去坐——她看着太妃——不是在看她的表情，是在看她的整体状态。太妃没有穿宫装。没有戴凤钗。没有施浓妆。她看起来——像一个普通的四十岁女人。林小满花了几秒钟消化这个陌生的视觉信号——然后她意识到了一件事：她从来没有见过太妃不穿宫装的样子。从她第一次穿越进这个世界起——太妃就永远穿着那身压迫感极强的深紫色织金宫装、戴着凤钗。现在——太妃卸下了所有武装。林小满不知道这意味着什么——但她至少知道——今天不是鸿门宴。
  characters:
  - CHAR-001
  dialogue: 娘娘今天——和平常不太一样。
- shot_id: EP28-S04
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃坐在窗边矮榻上，手边放着一杯已经凉了的茶。她听到林小满说"和平时不太一样"，嘴角浮起一个自嘲的弧度——不是她标志性的那种冷笑——是一种"你终于注意到了"的苦笑。她低头看了看自己的衣着——没有宫装、没有凤钗——像是刚想起自己今天忘了穿上"太妃"的外壳。她沉默了一会儿——然后开口。她的声音很平静——不是威胁前的那种刻意压低——是真正的平静。她说出那句话的方式——不是质问——而是一个在心底藏了很久的问题，终于被问出来了。
  characters:
  - CHAR-005
  dialogue: 本宫今天——不太想当太妃。
- shot_id: EP28-S05
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满被这个反问堵住了。她从来没有想过这个问题——太妃喜不喜欢当太妃？她一直都在和太妃对抗——太妃的威胁、太妃的势力、太妃的"剧情权限"——但她从未想过：太妃自己——想当这个反派吗？她站在原地，张了张嘴发现没有答案。她很少在太妃面前理亏。但这一次——她确实从来没问过。太妃从她的沉默里得到了答案——不是"不是"的否定——而是"从没想过"的空白。太妃没有生气——她只是点了点头——像是预料到了这个答案。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 我——没有想过。
- shot_id: EP28-S06
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃没有再等林小满回答那个问题。她站起来——走到了窗边——背对着林小满。阳光从高窗照进来，在她肩头镀上一层金边。她的声音从光中传来——比之前更轻了一些——不是因为虚弱——是因为她即将说出的内容不需要用"太妃的威严"来修饰。这些是她真实的经历——不是剧本。
  characters:
  - CHAR-005
  dialogue: 你的前任——那个排第三的编剧——她写了我两年。
- shot_id: EP28-S07
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在原地。不需要多余的台词——她脸上的表情已经说明了一切。她从"警惕太妃"的状态——变成了"听一个人讲她的故事"的状态。这是一种危险的转变——当她开始把太妃当成一个"人"来听的时候——她就不太可能再把太妃当成"纯反派"来对付了。太妃仍然没有转身——她看着窗外——像是在回忆一个很久远的人。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 她——写了什么？
- shot_id: EP28-S08
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 镜头缓推
  content: 太妃终于转身了。她不再回忆第3个编剧——她回到了当下。她面对着林小满——不是作为"太妃对编剧"的对峙距离——而是作为一个人对另一个人的坦白。她靠在窗边，阳光从她身后照过来——让她整个人镀着一层光晕——这使得她平时凌厉的五官线条柔和了一些——但这种柔和让她的下一句话更重了。她说这句话的时候——第一次在"本宫"后面卡住了——像是"本宫"这个自称太重了，而她要说的话太轻了——轻到不该用这个沉重的自称。
  characters:
  - CHAR-005
  dialogue: 第1个编剧写本宫——写了三句话。第2个编剧让本宫说了一句台词——然后消失了。
- shot_id: EP28-S09
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满听到"剩下的三分之一是你接的"时——她的呼吸停了一瞬。太妃说的是事实——她确实只写了太妃的后半部分。她的确接手了一个"被写到一半的角色"。她没有参与太妃的起源、没有参与太妃的前期动机——她只是从自己穿越进来的那一刻开始接着写。所以——这个"反派"——其实是被分割成了三段——由三个不同的手笔——在三个不同的时期——不完全一致地——拼凑出来的。这就是为什么太妃的性格有时候会出现微妙的不一致——不是bug——是被不同编剧写过留下的缝线。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 所以——你一直在被——
- shot_id: EP28-S10
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满站在原地。她的脑子里所有关于太妃的认知——在这一刻被全部打碎然后重组。她之前所有的分析都是建立在"太妃是反派"的前提上的——太妃阻止她改写是因为权力欲→太妃冻结密室是因为心虚→太妃联合神秘人是阴谋。但如果前提错了呢——如果太妃做这一切——不是因为她恨林小满——而是因为——她怕被再次抛弃？林小满的喉咙发紧。她从来没有从这个角度想过太妃——从来没有想过一个反派——的动机——是恐惧而非恶意。她看着面前这个卸下盛装的女人——她忽然明白了什么。
  characters:
  - CHAR-001
  dialogue: 所以——你阻止我改写——不是因为你恨我——
- shot_id: EP28-S11
  scene_id: SCENE-007
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 太妃站在原地。她听到了林小满那句话——"你怕我写完之后就走了"——她的表情没有变化。但她也没有立刻反驳。因为林小满说对了。太妃沉默了很久。窗外传来隐约的风声——和远处宫人的脚步声。然后她开口了——声音很轻——轻到不像是太妃会说出来的话。她在这句话之前——停顿了很长时间——像是在下一生中最重要的决定。不再用长句排比——不再用"本宫"维持威严——她只是一个人——想要一个完整的故事。
  characters:
  - CHAR-005
  dialogue: 本宫不反对你改写这个世界。
- shot_id: EP28-S12
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满站在原地。她看着太妃——这个卸下了盛装、卸下了"本宫"这个沉重外衣的女人——她第一次觉得太妃不是"太妃娘娘"——她是一个被写了六次都没有被写完的角色。一个在七年间——被不同的手笔切割拼接——却从未完成过自己的人。林小满的喉结动了动——她想起了沈长渊——他也是一样的——在剧本之外学会新行为——在不是被写的地方生长——太妃也是。她也是一个正在觉醒的人——只是她的觉醒和沈长渊不同——她的觉醒不是学会爱——是学会"想要被完整地爱一次"。林小满的回答——不需要太长。一句话就够了。她看着太妃的眼睛，没有移开目光。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 完整——原来她要的和我要的——是同一件事。
