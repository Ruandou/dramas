- shot_id: EP47-S01
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊的书房，烛台上的蜡烛已燃近半，烛油堆积在烛台边缘。林小满坐在书案前，手指无意识地摩挲着茶杯边缘，杯中的茶已凉透。她低着头，睫毛在烛光下投出淡淡的阴影。竹帘半卷，窗外夜风吹动竹叶的沙沙声清晰可闻。
  characters:
  - CHAR-001
  dialogue: 你一直想问我什么……问吧。
- shot_id: EP47-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊站在窗边，背对着烛光，半张脸隐在阴影里。他手边是摊开的兵书——但他没有在看。腰间的青白玉佩（`PROP-004`）在烛光里泛着温润的光。他的侧脸线条在明暗交界处显得格外清晰，下颌线的棱角在烛光中像一笔水墨画的皴法。他沉默了很久，久到林小满以为他不会回答了。
  characters:
  - CHAR-002
  dialogue: 你那个方案——分发权限。你真的想好了？
- shot_id: EP47-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满终于抬起头，她的眼睛在烛光里显得有些湿。她看着他的背影——玄色锦袍在昏暗中几乎和阴影融为一体。桌上茶壶的壶嘴还在冒着极细微的热气。她放下冷了的茶杯，手指交叉放在膝上，像是给自己找个支点。
  characters:
  - CHAR-001
  dialogue: 你把大家写好了就行。我不重要。
- shot_id: EP47-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊终于转过身来，烛光照亮了他的脸——那双狭长的凤眼里没有平日的冷锐，而是一种柔和的、几乎让人心碎的目光。他看着她，一步一步走过来，在她对面坐下。桌上一盏烛台隔在两人之间，火光在彼此眼中闪烁。他伸手拿起茶壶，给自己倒了一杯——茶水已经凉透了，但他还是喝了一口。
  characters:
  - CHAR-002
  dialogue: 不重要？你在说你自己？
- shot_id: EP47-S05
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 缓推
  content: 林小满的脸在烛光中瞬间凝固。她的瞳孔微微放大——这个问题她从未想过。不是没时间想，是不敢想。她的嘴唇微张，像要说什么，但什么都说不出来。烛火在她眼中跳动，映出内心的混乱。她的手指下意识地攥紧了衣袖的布料。
  characters:
  - CHAR-001
  dialogue: 我……你和他……
- shot_id: EP47-S06
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 沈长渊的目光没有移开。他看着她的慌乱，眼底有一层薄薄的光——不是泪光，是一种近乎怜悯的温柔。他的表情没有愤怒，没有失望，只有一种"果然如此"的了然。嘴角甚至浮起一个极淡的弧度——不是嘲笑，是苦笑。
  characters:
  - CHAR-002
  dialogue: 不能。
- shot_id: EP47-S07
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的眼中浮起一层水雾。她低下头，双手紧紧攥着膝上的衣料，指节发白。她不是没想过这个答案——她只是不敢承认。烛油滴落的声音在寂静中格外清晰。她咬着下唇，努力不让自己哭出来。
  characters:
  - CHAR-001
  dialogue: 那怎么办……
- shot_id: EP47-S08
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 沈长渊伸出手，轻轻落在她攥紧的手背上——温热的触感让她愣了一下。他的手比她大很多，覆盖在她手上，像在传递什么无声的东西。烛光在他们交叠的手上投下暖色的光。他没有马上说话，就这么静静地覆着她的手，像是在告诉她：没关系，我在。
  characters:
  - CHAR-002
  dialogue: 你不用分。
- shot_id: EP47-S09
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 夜已深。沈长渊站起来，走向窗边。他伸手推开竹帘——清冷的月光瞬间涌进来，洒在他身上，给他玄色的锦袍镀上一层银灰色的边。窗外，一轮满月挂在竹梢之上，月光如水，照亮了整间书房。书案上的烛火在月光中显得暗淡了。他背对着她，仰头看着月亮，月光勾勒出他挺拔的轮廓。沉默了很久，久到林小满以为他不会再说话了。然后他开口了——声音平静得像在说一件他已经想好了很久的事。
  characters:
  - CHAR-002
  dialogue: 他想了多久……才想出这个答案的？
- shot_id: EP47-S10
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 月光下，沈长渊的表情异常清晰——他狭长的凤眼里没有平日的冷锐和距离，而是一种温柔的、几乎释然的光。他嘴角带着笑意，不是苦笑，不是自嘲，是真正的、如释重负的笑。月光在他眼中映出两粒银色的光点。他看着她，像是在看全世界最重要的东西。
  characters:
  - CHAR-002
  dialogue: ……你想好了？
- shot_id: EP47-S11
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头推近
  content: 沈长渊从窗边走回来，在她面前蹲下，和她平视。月光从窗外照进来，将两人都笼罩在清冷的银辉中。他的表情前所未有的认真，眼中倒映着她的脸。他的手还覆在她手背上，温度传过来。他的声音低沉而温柔——那句台词像是从心底深处一点一点捞起来的。在这个瞬间，他不是纸片人，不是长安侯世子，只是一个在努力让自己被爱的人。
  characters:
  - CHAR-002
  dialogue: 现实的他陪你过日子。陪你吃饭、陪你散步、陪你老去。
- shot_id: EP47-S12
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满的眼泪终于落了下来。没有声音，没有抽泣，只是眼泪无声地滑过脸颊，在月光中像水银一样发亮。她看着他——蹲在她面前、微笑着等一个答案的他——用力点了点头。月光照亮了她含泪的笑容。沈长渊伸手，用指腹轻轻擦去她脸上的泪痕——动作笨拙而生疏，像是不太会做这种事，但那份小心翼翼比任何熟练的动作都更动人。
  characters:
  - CHAR-001
  dialogue: 好。一言为定。
