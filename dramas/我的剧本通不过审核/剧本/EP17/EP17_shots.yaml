- shot_id: EP17-S01
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 御花园深处，傍晚的斜阳将花木染成金红色。苏晚晴独坐在假山旁的石凳上，月白色长裙铺展在石面上，手里端着一盏凉透的茶——她没喝，只是端着，目光落在远处的天际线上，眼神空洞。风吹动她的鬓发，她没有动。整个人像一尊雕像，安静得和周围春日生机勃勃的花木格格不入。
  characters:
  - CHAR-006
  dialogue: 又在想那个世界的事了……手机、高楼、车流……回不去了。
- shot_id: EP17-S02
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满从回廊方向走来，脚步放得很轻。她看到苏晚晴独坐的背影，停了一下——苏晚晴的姿态让她想起自己熬夜写稿时的样子：端着凉透的咖啡，盯着窗外发呆。她深吸一口气，走上前。苏晚晴听到脚步声，没有立刻回头——但她端茶的手指微微一紧，肩膀绷了一下，然后缓缓松弛，变成一种防御性的从容。她转过头时，脸上已经挂上了那副清冷疏离的表情。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 打扰你了？
- shot_id: EP17-S03
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满没有接她的刺——而是直接在她旁边的石凳上坐下来。这个动作让苏晚晴微微意外——她以为林小满会站在她面前居高临下地说话，像上次一样。但林小满坐下来，和她平视。林小满沉默了几秒，整理措辞。苏晚晴没有催促，也没有走开——她端着那盏凉茶，等林小满开口。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 我不改你的剧情。我先听听你的想法。
- shot_id: EP17-S04
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴终于放下那盏凉透的茶。她侧过头看林小满，眼神从防备变成审视——像在判断她是不是认真的。林小满没有躲避她的目光。苏晚晴沉默了几秒，然后轻轻笑了一下——不是之前的冷笑，是一种更复杂的、带着自嘲的笑。她开口了，声音比刚才低了半个调——不是示弱，是准备说真话前，下意识地收紧了音量。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 呵……你想听什么？
- shot_id: EP17-S05
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 苏晚晴站起来，走了两步，背对着林小满。她的背挺得很直——那是她的防御姿势。但她说出来的话，和她的姿态形成了反差。她开口时，声音平静得像在说别人的事。御花园的傍晚风吹过，花瓣从树上飘落。一片花瓣落在她的肩头，她没有拂去。林小满坐在石凳上，仰头看着她——第一次，她不只是在"倾听角色设定"，而是真正在"听一个人说话"。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 你知道吗？你把我写成穿越女的时候，我挺高兴的。因为我以为——穿越女都有好结局。
- shot_id: EP17-S06
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 苏晚晴重新坐下来，这次不是侧坐——她转向林小满，膝盖对着膝盖，距离近了。她说话时目光没有移开，像是要让林小满看清楚她的表情——她是认真的。她列举那些套路时，语气从平静变到带着一点点愤怒的颤音——不是因为恨林小满，是因为她被困在这些套路里太久了。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 穿越女一定要和王爷在一起——这个套路你写了多少次？五次？六次？
- shot_id: EP17-S07
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的表情从认真倾听变成了一种被当面戳穿的窘迫——不是被冒犯的那种，是被说到痛处的那种。她张了张嘴，发现无法反驳。因为苏晚晴说的是事实。她确实在所有的穿越故事里都写了同样的结局——王爷、爱情、圆满。她从来没想过给穿越女别的可能性。这个公式她用得太顺手了，顺手到没觉得有什么不对。直到此刻，一个她笔下的角色当面告诉她：你的公式，我不喜欢。林小满的视线垂下来，落在自己的手上——这双写过无数套路的手。
  characters:
  - CHAR-001
  dialogue: 你说的对。
- shot_id: EP17-S08
  scene_id: SCENE-006
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满低着头沉默了很久。苏晚晴没有催促——她拿起那盏凉透的茶抿了一口，等着。花瓣继续飘落，有一片落在两人之间的石桌上。林小满盯着那片花瓣，突然——她抬起头。眼神变了——从"被批评的窘迫"变成了一种"我知道了"的明亮。她不是在找借口，而是在想解决方案。她开口时声音不大，但每个字都带着确定的重量。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 那——如果我不写王爷呢？
- shot_id: EP17-S09
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴端着茶盏的手定住了。她抬起头看着林小满，眼神里有意外、有怀疑、也有一丝藏不住的光——像一个人在黑暗中待久了，突然看到一扇门打开时的那种光。但她没有立刻接受——她太多次被这支笔伤害过了。她放下茶盏，双手交握放在膝上——一个压住自己的动作，防止自己太快相信。
  characters:
  - CHAR-006
  dialogue: 你说真的？
- shot_id: EP17-S10
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴低下头，手指交握得更紧了。林小满看不到她的表情——但能看到她睫毛在轻轻发颤。很久的沉默。林小满没有催促——她等着。她知道这个承诺对苏晚晴来说意味着什么：不是一条新剧情线，而是一直以来她想要但不敢要的东西——被当一个人来看待，而不是一个"穿越女配"的标签。终于，苏晚晴抬起头，眼眶微微泛红但没哭——她忍住了。她开口时声音有点哑，但稳住了。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 你上次说帮我改个结局……但没说是这种结局。
- shot_id: EP17-S11
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 林小满的声音明亮起来——她真的在认真构思。她一边说一边比划，像在脑内打开了一个全新的文档。苏晚晴一开始还带着审视的表情听着，但听着听着，她眼里的防备一层一层地褪下去——因为林小满描述的不是"给她加一段可有可无的支线"，而是一个完整的、有商业逻辑、有成长弧线的事业线。这个角色弧线不是附属于任何人的——它属于苏晚晴自己。苏晚晴的嘴角动了动——一个几乎看不出来的、想要上扬又忍住了的弧度。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 我想好了——你的酒楼开在京城最繁华的街上，二层木楼，门口挂红灯笼。你从一个小摊贩做起，自己研究菜谱、谈供货商。半年后盘下铺面——
- shot_id: EP17-S12
  scene_id: SCENE-006
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 夕阳已经完全落下去了，御花园笼罩在蓝紫色的暮色中。苏晚晴站起来，拍了拍裙摆上的花瓣。她走了两步，又停下来。她没有回头——背对着林小满，她的声音恢复了一点清冷，但和开场时的清冷不同——开场时是防御，现在是……一种复杂的、混杂着感激和警惕的东西。她说完那句话后，终于转过身来。暮色中看不清她的表情，但她的眼神很清楚——那道裂缝还在，但也许可以慢慢愈合。林小满坐在石凳上没有动——她知道这句话的分量，也知道自己需要用行动来回答。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 谢谢你愿意听我说。
