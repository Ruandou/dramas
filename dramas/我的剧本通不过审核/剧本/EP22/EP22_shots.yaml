  camera: i2v_ref 固定镜头
  content: 清晨的皇宫回廊，淡金色的晨光从廊柱间斜射进来，在地砖上投下长长的影子。林小满独自走在回廊中，脚步比平时慢——她在想事情。她的视线漫无目的地扫过周围的建筑——朱红的柱子、飞翘的檐角、远处的宫门。突然——她的目光停住了。她微微皱眉，往后退了一步，又看了看左边和右边。她的表情从不自觉的走神变成了专注的审视——她觉得哪里不对，但一时说不上来。
  characters:
  - CHAR-001
  dialogue: 等等……这条路——我昨天走的时候是这样的吗？
- shot_id: EP22-S02
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满站在回廊的岔路口——左边是她熟悉的通往御花园的路，右边——出现了一条她从未见过的长廊。长廊不短，约四五十步，尽头拐了一个弯，看不到底。廊柱是深红色的，和皇宫其他建筑风格一致——但它不应该存在。林小满闭上眼睛，在脑子里回忆自己写的皇宫地图。她确定——她没有写过这条长廊。她睁开眼，长廊还在。她又闭上眼想了一遍——没有。从来没有。她的心跳开始加速——不是害怕，而是一种复杂的、混合着兴奋和不安的预感：这个世界——又在自我演化。这次不是纸上多几行字——是物理空间变了。
  characters:
  - CHAR-001
  dialogue: 我没有写过这个。
- shot_id: EP22-S03
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 镜头跟随
  content: 林小满站在长廊入口犹豫了几秒——她的直觉告诉她应该小心，但她的好奇心已经压过了谨慎。她深吸一口气，迈步走了上去。长廊比从外面看起来更深——走了十几步还没到拐角。两侧的廊柱之间有雕花木栏，木栏上刻着她没见过的花纹——不是她设定的皇宫建筑风格里的图案。她伸手碰了碰一根廊柱——木头是真实的，有纹理，有温度。她确认了：这不是幻觉。这个世界真的长出了新的部分。
  characters:
  - CHAR-001
  dialogue: 木材是真实的——不是幻觉。这个世界——自己建了一条新走廊。
- shot_id: EP22-S04
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满走到长廊拐角——她转过去。拐角之后，长廊继续延伸了二十几步，尽头是一扇门。不是普通的宫门——是一扇略矮的、厚重的木门，门板上没有雕花，没有装饰，表面朴素得像故意隐藏着什么。门上没有锁，只有一个铜质拉环。林小满在门前停下，低头看了看那个拉环——铜环被摩挲得很光滑，显然被人频繁使用过。这说明——有人经常进出这里。但这个空间她从来没有写过，那谁会知道这里？谁会使用这扇门？她的心跳又加速了——这次是紧张占了上风。
  characters:
  - CHAR-001
  dialogue: 门环是光滑的——有人经常开关这扇门。
- shot_id: EP22-S05
  scene_id: SCENE-005
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满用力推开了那扇厚重的木门——门轴发出沉闷的吱呀声。门后不是房间——是一段向下的石阶，昏暗狭窄，只有尽头透出一丝微弱的光。她犹豫了一秒——然后走了下去。石阶约有十几级，越往下空气越闷热，带着一股旧纸和灰尘混合的气味。她走到石阶尽头——眼前豁然开朗。是一个约二十平米的地下密室。密室中央有一张矮桌，桌上放着一盏铜烛台，一根燃烧过半的蜡烛——这就是她在石阶上看到的那点光。但真正让她呆住的——不是烛台。是墙。密室的三面墙上——贴满了纸条。密密麻麻，层层叠叠，像鱼鳞一样覆盖了整面墙壁。每一张纸条上都写着一个名字、一句话。有些已经泛黄卷边，有些看起来是新的。纸条之间用红绳连接着——像一张巨大的网络。林
  characters:
  - CHAR-001
  dialogue: ……这通向哪里？
- shot_id: EP22-S06
  scene_id: SCENE-005
  duration_sec: 5
  camera: i2v_ref 镜头缓推
  content: 烛光在密室中晃动，墙上的纸条投下交错的影子。林小满的视线在墙面上扫过——纸条太多了，她一时不知道应该先看哪一张。她走近了一步——烛光照亮了她面前的一小块墙面。她看到了一张纸条。上面写着一个人的名字。她认出了那个名字——因为那是她的名字。纸条上写着：「林小满——第7个编剧。」她盯着那七个字——和她昨天在手稿上看到的"长安侯世子沈长渊"一样，都是七个字。但那七个字的内容，让她的后背开始发凉。
  characters:
  - CHAR-001
  dialogue: ……
- shot_id: EP22-S07
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 镜头跟随她的视线慢速平移
  content: 林小满开始阅读墙面上的纸条。烛光在她脸上跳动，她的表情随着视线移动不断变化。第一张纸条：「林小满——第7个编剧。」第二张纸条在她旁边几寸的位置，用红绳和第一张连在一起：「太妃——剧本世界的第一个觉醒者。」——下面还有一行更小的字：「存在时间超越所有编剧。」再往右，一根红绳牵出一张纸条：「沈长渊——钥匙。」——这张纸条被红绳连接到至少五六张其他纸条上，是所有纸条中连线最多的一张。林小满的目光在"钥匙"两个字上停住了——她想起了EP21翠微的话"那个房东会不会是从这个世界出去的人"，想起了沈长渊·古装没有父亲的记忆，想起了玉佩，想起了两个世界的沈长渊长得一模一样……"钥匙"是这个意思吗？墙上的信息
  characters:
  - CHAR-001
  dialogue: 太妃——第一个觉醒者。存在时间超越所有编剧——所以太妃活的时间比这个剧本设定的长——她经历过所有前任编剧……
- shot_id: EP22-S08
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手指不自觉地抬起，想去碰那张写着"沈长渊——钥匙"的纸条——但在触碰之前又收了回来，像怕破坏什么。她往旁边走了两步，发现更多的纸条。有一张上写着「翠微——第4个编剧的造物」——下面有人用不同字迹加了一行「但你把她写活了」。她愣了一下——这句话里有一个"你"字，像是对着后来的编剧说的。她继续看：墙上有关于每个角色的不同记录——苏晚晴的名字也在上面，写着「穿越女——第6个编剧改了她的结局」。所有的信息都用红绳连接着，像一个巨大的关系图谱。墙的中央——所有红绳汇聚的地方——只有三个字：「找钥匙」。
  characters:
  - CHAR-001
  dialogue: 这些纸条不是同一个人写的——字迹不一样。不同时期的编剧都来过这里……
- shot_id: EP22-S09
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的目光重新回到"沈长渊——钥匙"那张纸条上。她仔细看了看纸条的边缘——纸张不算太旧，边角微微卷起，墨迹是深黑色——是最近才写上去的？还是被人重新描过？她看不出来。但"钥匙"这个字让她心里发紧——在EP21的世界观里，"钥匙"意味着"打开两个世界之间通道的东西"。如果沈长渊是"钥匙"，那他开的是哪扇门？是让林小满回去现实世界的门——还是让什么东西进来的门？她伸手想去拿那张纸条——想把它从墙上取下来仔细看看——就在这时，她听到身后传来一个声音。
  characters:
  - CHAR-001
  dialogue: 如果他是钥匙——他开的是哪扇门？
- shot_id: EP22-S10
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 密室入口的石阶上，一个身影无声地站在阴影中。深紫色的宫装几乎和暗处融为一体。烛光照不到她的脸——只能看到金色凤镯在她手腕上微微反光。太妃站在那里——不知站了多久。她没有出声，没有动作，只是看着林小满。那种沉默比任何咆哮都更有压迫感。她的身影从阴影中缓缓浮现，一步一步走下最后几级石阶——脚步声在密室中格外清晰。她的脸终于被烛光照亮——没有愤怒的表情，甚至没有表情。但她越是没有表情，就越让人害怕。
  characters:
  - CHAR-005
- shot_id: EP22-S11
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满猛地转过身——看到太妃的那一刻，她的心脏几乎停跳了一拍。太妃站在密室中央，烛光在她脸上投下从下往上的阴影——让她的表情看起来像一张面具。她穿着深紫色的宫装，手腕上的金色凤镯在昏暗光线中微微闪烁——像一只眼睛。她离林小满只有几步远。林小满下意识地往后退了半步——背后就是那面墙。她被困在了密室深处。太妃没有往前走——她站在原地，目光从林小满身上移开，缓慢地扫过墙上的纸条——像是在检查有没有人动过它们。她的视线在"林小满——第7个编剧"上停了一下，又移开了。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: ——太妃。
- shot_id: EP22-S12
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满和太妃对视着。烛火在两人之间跳动，影子在墙上晃动。林小满的大脑在飞速运转——她不能被太妃的气势压住，但如果她表现得知道太多，太妃可能会做出什么事。她决定先试探。她尽量让自己的声音听起来平静——但太妃比她更平静。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 这条长廊——我没有写过。这个密室——不是我建的。但它就在这里。
- shot_id: EP22-S13
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头→镜头拉远
  content: 密室内只剩下蜡烛燃烧的细微声响和两个人呼吸的声音。太妃的最后一句话在空中回荡。林小满站在墙前，背贴着冰凉的石墙——她的视线在太妃脸上和墙上的纸条之间快速切换。她的心跳声几乎盖过了其他声音。太妃没有动手，没有叫侍卫，只是站在那里——像一尊雕像一样挡在密室和出口之间。她的沉默比任何威胁都更沉重。她伸手，从袖中取出一件事物——是那扇密室门的钥匙。她慢慢举起来，火光照在铜钥匙上反射出暗金色的光。她不是在锁门——她是在展示：这扇门，归她管。林小满看着那把钥匙，突然明白了什么——太妃不是"发现"了这里。她是"守护"着这里。墙上的信息中，"太妃——第一个觉醒者"旁边那行小字——"存在时间超越所有编剧"——此
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你守卫着这个密室多久了？
