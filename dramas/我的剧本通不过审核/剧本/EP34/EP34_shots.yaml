- shot_id: EP34-S01
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃离开后，房间里安静了很久。褪色的晨光从窗纸透进来——光线是灰白色的，像隔了一层旧纱。林小满仍然握着沈长渊的手，没有松开。她的目光从太妃消失的门缝上收回来——慢慢抬起来——看着沈长渊。她的眼神不是被动的、等待审判的眼神。是一种"我决定了"的眼神。她说"我不选"——不是赌气——是一种重新掌握了主动权的语气。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我不选。——两个都不选。
- shot_id: EP34-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊没有立刻回答。他看着他们的手——紧握着的手。他慢慢地、轻轻地——回握了一下。然后他抬起头，看着她——不是"你确定吗"的质疑——是一种"我信你"的注视。他的嘴角有极淡的弧度——不是笑，是一种"我见过你做不可能的事"的确认。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ——你总是这样。
- shot_id: EP34-S03
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满松开他的手——不是放手，是松开手去拿桌上的东西。她深吸一口气，然后开口——声音里有一个决定：不能留在这里等答案。她需要回到她的世界去找线索。沈长渊没有挽留。他知道留在这里只会消耗时间——而时间对褪色的世界来说太奢侈了。他看着她——用一种"不用担心我"的目光。他说了一句很简单的话——"我等你"——这三个字在EP32的"别放手"之后，成为他们之间新的约定。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我回去。——回我的世界。找答案。
- shot_id: EP34-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满从桌上猛地抬起头——她回来了。手腕上的倒计时印记（PROP-006）微弱地闪着数字。笔记本电脑屏幕还亮着（PROP-001）。她茫然地看了看熟悉的房间——暖黄台灯、堆满书的桌子、半开的窗户。然后她立刻站起来——没有时间感受"回家"——她开始在房间里踱步，脑子里飞速运转。然后她拿起手机——翻到通讯录里"橙姐"——拨了出去。
  characters:
  - CHAR-001
  dialogue: 搜索没用。——太抽象了。——没有人研究过这个——
- shot_id: EP34-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 画面切到橙姐。她穿着家居服坐在自家沙发上，手里端着杯茶，表情是"凌晨被作者电话吵醒"那种混合着困惑和职业警觉的神情。她听林小满说完，歪了歪头——这个时间打电话问写作问题？但职业习惯让她没有追问。她想了想，认真回答了。
  characters:
  - CHAR-008
  dialogue: 你是说——角色觉醒导致世界崩塌——要么让角色恢复原状——要么让世界消失——没有第三个选项——
- shot_id: EP34-S06
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满拿着手机，沉默了。橙姐的话像一盆冷水——"在写作里没有第三条路"。她咬着嘴唇——不是放弃的表情——是不甘心的表情。她张了张嘴想反驳——但又知道橙姐说的从写作理论上是没错的。她靠在桌边，低头看着桌上摊开的本子——然后她轻声说了句话——不是问句，更像是在说服自己。电话那头的橙姐沉默了几秒——她听出了林小满声音里的不对劲。她没有追问——但她也没有挂断。她等在那里。这就是她的方式——不逼问，但陪着。
  characters:
  - CHAR-001
  dialogue: ——所以真的没有。——第三个选项。
- shot_id: EP34-S07
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 电话没有挂断。林小满握着手机——她没说话，但也没挂。她低头看着手机屏幕——不是漫无目的地看——她在翻什么。她翻到了一条旧短信。屏幕的光照亮了她的脸。她读了出来——读给橙姐听——也读给自己听。她的声音很平，但每个字都带着重量。
  characters:
  - CHAR-001
  dialogue: ——我收到过一条短信。几个月前。发件人——没有号码。
- shot_id: EP34-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 电话那头的橙姐沉默了几秒。她没有质疑"第5个编剧"是谁——她跟上了。编辑的脑子在转。她问了一个好问题——不是关于墙上的信息被篡改了多少——是关于篡改者。
  characters:
  - CHAR-008
  dialogue: ——篡改过。也就是说——你看到的那面线索墙——上面的信息——不全是真的。
- shot_id: EP34-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 橙姐的话像一把钥匙——"真正重要的信息被她藏在哪儿了"——林小满的目光落在桌上那本旧日记上（PROP-005）。她一把拿过来——翻开——快速扫读前面几任编剧的记录。她的目光越来越快——然后突然停住了。她的表情变了——从翻找的急切变成了一种确认式的警觉。她立刻拿起手机——不是拨号——橙姐还在线上。她直接对着手机说——语速快得像是怕这个发现会溜走。
  characters:
  - CHAR-001
  dialogue: 日记——前任的日记——前面几任都写到过密室——也看到过墙上的信息——
- shot_id: EP34-S10
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 橙姐在电话那头——她已经被林小满的语速带进了状态。她没有问"什么日记"——她直接抓住了关键词。她的提问精准——编辑的本能：追问细节，而不是跟着情绪走。
  characters:
  - CHAR-008
  dialogue: 断了是什么意思。——被撕了还是写不下去了。
- shot_id: EP34-S11
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 电话挂断了。林小满一个人坐在台灯下。她把日记举到灯前——灯光从纸页背面透过来，照亮了纸根的纤维。不是整齐的切割——是用力撕扯留下的不规则边缘。她微调角度——看到了半个字的墨迹残余。她翻到日记前面对比字迹——确认了。不是太妃撕的——是写这本日记的人自己撕的。她快速心算——从开始到撕掉的那一页——然后拿出手机看今天的日期。来回对比了两次——日记封面内侧的起始日期→撕掉页的位置→手机上的今天。她的手停住了。
  characters:
  - CHAR-001
  dialogue: 纸根——还有半个字的痕迹——
- shot_id: EP34-S12
  scene_id: SCENE-001
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 林小满放下日记。但她的目光没有离开那个日期。她看着并排放着的日记和手机——旧纸页上撕掉的痕迹和手机屏幕上今天的日期——它们重合了。她抬起头——看向窗外深沉的夜色。她看到的不是窗外的城市——她看到的是褪色的剧本世界、失忆的赵景和翠微、太妃说"没有第三个选项"时的眼神、沈长渊说"我等你"时的表情。然后她的目光收回来——落在日记缺页处——又落在手机上。她轻声说——声音里带着一种终于明白过来的轻——但那种轻不是轻松，是一种"原来是这样"的沉重。
  characters:
  - CHAR-001
  dialogue: 三年前的今天——前任撕掉了关键页——
