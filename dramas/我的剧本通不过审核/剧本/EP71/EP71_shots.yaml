  content: 午后的独立书店——暖黄灯光从天花板洒下，书架环绕。签售区中央一张铺着深色桌布的长桌，上面放着一摞实体书——《我的剧本通不过审核》（`PROP-014`），封面是两个世界叠影的设计。旁边有签字笔和笔名立牌。背景板是封面放大图案。几十位读者围在四周，有人翻书，有人拍照。橙姐站在签售台旁，穿着灰蓝色衬衫和深色长裤——干练但不办公室。她拿起话筒，声音里带着少见的郑重和温度——她催了林小满整部剧，今天终于看到这本书摆在这里。
  characters:
  - CHAR-008
  dialogue: 各位读者朋友——欢迎来参加林小满老师的第一场签售会。
- shot_id: EP71-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满坐在签售台后——白色衬衫外搭浅蓝色针织开衫，低马尾，比日常正式但不隆重。面前是摞好的书和一支签字笔。她听到橙姐那句"我等了很久了"——嘴角浮起一个带着温度的笑意。低头看了一眼面前的书——封面两个世界叠影，暖金色和灰蓝色交融——那是她写的，但看起来又像不是她写的，像是从她手里长出来的东西，有了自己的生命。她抬起头看向读者们——围在周围的几十张面孔，有人拿着她的书，有人举着手机在拍她。她开口时——声音里没有紧张，带着一种"我好像真的做到了"的、带着一点恍惚的轻。
  characters:
  - CHAR-001
  dialogue: 谢谢大家——来听我讲故事。
- shot_id: EP71-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 签售进行中——读者们依次上前。一个年轻女读者抱着书走到桌前——二十出头，圆框眼镜，气质文静。她没有直接把书推到林小满面前等签名——站在那里，微微踌躇了一下。然后问出了那个问题——声音不大，但签售区安静，足够让所有人都听到。不是套话，是真的好奇。林小满听到问题时——抬起了头。她的目光从桌上的书移到读者脸上——没有立刻回答。
  characters: []
  dialogue: 林老师——请问——你是怎么想出这么奇妙的故事的？
- shot_id: EP71-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满没有立刻回答。她听到这个问题的瞬间——先是愣了一下，然后低头看了一眼面前的书。封面上两个世界的叠影——暖金色和灰蓝色交融——像是在提醒她这个问题的答案不在她准备好的说辞里，而在一段真实的经历里。她决定说实话。但说实话之前——她需要先看一个人。她抬起头——目光越过面前的书堆，越过排队的人群——落在第一排。她的视线——穿过所有读者——找到了她要找的人。
  characters:
  - CHAR-001
  dialogue: ——这个问题的答案——不在我准备好的话里——
- shot_id: EP71-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的目光穿过人群，落在第一排最边上的位置。沈长渊·现实坐在那里——浅灰色亚麻衬衫，安安静静，双手放在膝盖上。他没有拿书，没有看手机——只是看着她。目光不是"我在看热闹"——是一双看了她很久的眼睛，从三年前画廊那天就开始看了。他看到她在看他——嘴角浮起一个很淡的、只有她能读懂的微笑。那个微笑里有"别紧张"——也有"我在这儿"。林小满看到他的瞬间——心跳稳了一拍。但她没有移开视线——她的目光从现实沈长渊身上，微微向他旁边挪了一点——那里有一个空位。
  characters:
  - CHAR-001
  dialogue: ——还有一个——
- shot_id: EP71-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 那个空座位上——坐着古装沈长渊。玄色锦袍，玉冠束发——和她在剧本世界里第一次见他时一模一样。他不是穿越来的——是一个投影，一个只有她能看见的存在。他的周围——读者们看不到他，椅子在他身下若隐若现——但他坐在那里，像是本来就属于这个位置。他没有看书，没有看周围——只是侧着头，看着她。那张脸上没有毒舌，没有腹黑——只有一种很深的目光。他的嘴角——浮起一个极淡的、带着全部温柔的笑意——和EP01时一模一样的弧度，但含义完全不同：第一次是"又来了一个编剧"，这次是"我来见证你写完"。他微微点了点头——像是一个仪式最后的确认。然后他的身形开始变淡——从边缘开始，像被风吹散的烟——变得透明——最后完全消失
  characters:
  - CHAR-002
  dialogue: ——写完了。
- shot_id: EP71-S07
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满的目光从那个空座位上收了回来。没有失落，没有悲伤——是一种被确认过的、带着温度的平静。她的目光回到面前的读者脸上——然后她开口了。声音不大——但安静的午后书店里，每一个字都清清楚楚。她说出这句话的时候——嘴角带着一个很淡的笑意——不是"正确答案"的笑——是"我的人生就是这样"的笑。从穿越进自己剧本的凌晨，到角色觉醒追着她改剧本的日子；从太妃说"请把我写完整"，到沈长渊说"也替我们谢谢你自己"——所有的经历，凝成了这一句话。她说完之后——看了一眼读者——又看了一眼第一排那个已经空了的座位——然后低头，轻轻笑了一下。像是终于有人问了她一个正确的问题——而她终于可以给出真实的答案。
  characters:
  - CHAR-001
  dialogue: 因为我相信——
- shot_id: EP71-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满回答完之后——年轻女读者站在原地，微微张了张嘴——然后用力点了点头，像是这句话在她心里也产生了回响。她把书放在桌上——林小满接过，翻开扉页，拿起签字笔。她的签名和一行小字——"谢谢你来听我的故事"。合上书，双手递回。读者接过书时——眼眶微红。林小满抬头看她——目光里带着一种"我懂"的温暖。
  characters:
  - CHAR-001
  dialogue: 谢谢您——我会好好珍藏的。
- shot_id: EP71-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 签售会接近尾声——最后一位读者拿到签好的书，满意离开。橙姐站在一旁——没有说"差不多了"——只是安静地看着林小满，像是一个见证了全过程的人，在确认这一刻是真的。林小满放下笔——面前的最后一本书也签完了。她揉了揉手腕，长出了一口气。橙姐看着她的侧脸——开口时，声音里没有催稿的紧迫——只有一种很少出现的、安静的认可。这是橙姐从EP01催稿到现在，第一次不是用祈使句对她说话。林小满听到这句话——没有抬头，但嘴角浮起了一个笑意——被同行认可的笑意，比被读者夸更让她开心。
  characters:
  - CHAR-001
  dialogue: 签完了。感觉怎么样？
- shot_id: EP71-S10
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 签售会结束。读者们陆续散去——有人在书架前流连，有人低头翻刚签到的书。橙姐去和书店工作人员交接。沈长渊·现实——他站起来，远远地看了林小满一眼——用目光说"我在外面等你"——然后安静地走向门口。签售台前——只剩下林小满一个人。她坐在那里，没有立刻收东西。面前还剩一本样书——出版社留给她的，封面崭新。她的手指轻轻在封面上划过——指尖触到"我的剧本通不过审核"几个字时停了一下。然后她翻开了那本书——不是从第一页开始——直接翻到了最后一页。她自己也不知道为什么要翻最后一页——可能是一种直觉——一种"也许那里有什么"的预感。她翻到了——最后一页空白纸。内容是倒数第二页结束的，最后一页是留给读者的空白页
  characters:
  - CHAR-001
  dialogue: ——不知道为什么——我想翻到最后一页。
- shot_id: EP71-S11
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 特写——书页。空白页上——一行浓墨的行楷。字迹瘦硬有力，笔锋如刀，是古装沈长渊的笔迹。每个字都写得认真，没有涂改，没有犹豫——像是写下这行字的人，在落笔之前已经想好了每一个字的分量。他写的是——"写得好。不愧是写了我的人。"然后署名——"沈长渊·古装版留"。墨色浓黑——在午后暖黄的阳光下微微反光。是真的墨迹——不是印刷。林小满的拇指轻轻抚过那行字——指尖触到墨迹微微凸起的纸面。她低着头——安静了几秒。没有人看到她的表情——如果有人在旁边，会看到她的眼眶慢慢泛红。但没有哭出来——她深深吸了一口气——然后嘴角浮起了一个笑意。不是被感动哭的笑——是一个"你这家伙——连留字都这么有你的风格"的、带着全
  characters:
  - CHAR-001
  dialogue: ——写得好。不愧是写了我的人——
- shot_id: EP71-S12
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满坐在签售台前——手里捧着那本翻到最后一页的书。她的拇指还停在那行字的位置——透过纸背，轻轻按着。午后阳光从窗户斜照进来——落在她面前的书页上。她安静地坐了片刻——然后轻轻合上书，把书抱进怀里——像抱着一个很重要的东西。她站起来——转身——看到门口的逆光里，站着一个人。沈长渊·现实在门口等她——他没有催促，只是安静地站在那里，阳光在他轮廓上镀了一层暖光。她朝他走过去——走到门口时，他侧过头看她，目光里带着一个温和的疑问句——"怎么样？"她没有回答——只是把书举起来，轻轻晃了晃。他看到她眼底隐隐的笑意——知道那是好书的意思——于是也笑了。她走出门去——午后的阳光洒在街道上——和任何一个普通的
  characters:
  - CHAR-001
  dialogue: ——他的书——总是在最后一页——留点东西给我。
