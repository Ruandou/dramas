- shot_id: EP46-S01
  scene_id: SCENE-014
  duration_sec: 6
  camera: t2v 固定镜头
  content: 双世界边界空间的全景。背景被垂直分割——左半是古燕京的宫殿飞檐与暖金色夕阳，右半是现代杭州的摩天大楼剪影与蓝灰色天际线。中央一张古木长桌，两侧各一把风格迥异的椅子。六个身影站在边界两侧——古装玄衣男子和明黄龙袍少年站在左侧暖金中，深紫宫装贵妇和月白长裙女子站在右侧冷灰中，鹅黄衫裙的丫鬟靠近中央，而中央桌后站着一个淡紫襦裙的年轻女子——一手拿着一沓卷边的剧本手稿按在桌上。
  characters: []
  dialogue: 她回来了。——带着一个没有人预料到的决定。
- shot_id: EP46-S02
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微从人群中挤到前面，杏眼圆瞪，脸上的表情从担心一下子变成了兴奋。她上上下下打量了林小满一遍，确认她没有受伤，然后才松了口气，语气里带着她标志性的夸张和真心的高兴。林小满看着她，嘴角微微扬起——是感激，也是确认自己真的回到了这里的安心。
  characters:
  - CHAR-004
  - CHAR-001
  dialogue: 小姐！你可算回来了！我们都担心死了——
- shot_id: EP46-S03
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在桌后，双手按在剧本手稿上。背景的边界线正好从她身后垂直穿过——她处于两个世界的正中间。她的表情不是兴奋，不是紧张——是一种冷静的坚定。头发有几缕垂在脸侧，她在夹缝里待了那么久，眼神却比之前亮了。她开口了——声音不大，但每个字都很稳。
  characters:
  - CHAR-001
  dialogue: 我决定——改写这个世界的底层规则。
- shot_id: EP46-S04
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在桌前，苏晚晴和太妃站在她对面，沈长渊站在她身侧稍远处——形成一种"支持与质疑"的构图张力。她的手从剧本上抬起，作出一个打开的动作——像在释放什么。太妃的眉头皱了起来，苏晚晴的眼中闪过一丝意外。而沈长渊——他只是安静地看着她，嘴角带着极淡的弧度。
  characters:
  - CHAR-001
  - CHAR-005
  - CHAR-006
  - CHAR-002
  dialogue: 从今天起——不再有编剧和角色的区别。
- shot_id: EP46-S05
  scene_id: SCENE-014
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃从人群中走出来，步伐不紧不慢。深紫色宫装的下摆轻轻拂过地面，她一步步走到桌前，站在林小满对面。她没有看林小满——而是低头看着桌上那本摊开的剧本手稿，像在看一个她见过很多次的东西。然后她抬起眼睛——那双丹凤眼里没有愤怒，而是一种"你果然还是太年轻"的冷静。她的声音很轻——这正是她真正认真时的标志。轻，但每个字都像钉子。
  characters:
  - CHAR-005
  dialogue: 你刚从夹缝回来。见到了那个造梦者。然后你就觉得自己无所不能了？
- shot_id: EP46-S06
  scene_id: SCENE-014
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满没有后退。她站在原地，目光没有一丝闪躲。她没有急着反驳——而是沉默了一拍，像是在等太妃把话说完、把重量放稳。然后她回答了——不是高声反驳，而是用一种比太妃更轻、更确定的语气说出来的。前半句像在铺路，后半句才是真正的重量。她微微前倾，双手撑在桌沿，直视太妃的眼睛——那目光里没有敌意，只有一种"你我都知道答案"的了然。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 稳定的世界就没有裂缝。——但没有裂缝，光也照不进来。
- shot_id: EP46-S07
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴一直没有说话。她站在边界空间的右侧——现代杭州那一边。月白色的长裙在蓝灰色的城市天际线背景前显得清冷而坚定。她低着头，像在思考什么。然后她抬起了头——那双丹凤眼里没有犹豫。她向前走了一步——从"现代"那一边跨过了边界线，站在了中间。这是一个无声的宣告。她开口了——清冷的声音里带着她特有的、用比喻之前的停顿。
  characters:
  - CHAR-006
  dialogue: 我同意。
- shot_id: EP46-S08
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微立刻跳起来，双手合十，杏眼放光，整个人像一只被点燃的小炮仗。赵景和站在她旁边，努力想装成熟但藏不住脸上的兴奋。沈长渊一直没有说话——他靠在左侧古燕京背景的木柱上，双臂交叉，目光一直在林小满身上。他没有急着表态——但他的沉默本身就是一种态度。
  characters:
  - CHAR-004
  - CHAR-007
  - CHAR-002
  - CHAR-001
  dialogue: 我同意！这也太刺激了吧！大家一起写故事——
- shot_id: EP46-S09
  scene_id: SCENE-014
  duration_sec: 10
  camera: i2v_ref 镜头缓推
  content: 林小满的特写。背景的两个世界渐渐虚化成模糊的光晕——暖金与蓝灰在她身后交融，像水墨滴入清水。她的脸被来自两侧的光线同时照亮——一半暖金一半冷灰。她看着太妃，也看着所有人。声音不高，不低——不是演讲，是她终于想明白之后说出来的那个答案。这句话的重量不在于音量，而在于它是她从所有经历中打捞出来的唯一结论。
  characters:
  - CHAR-001
  dialogue: 不稳定——才有真正的自由。
- shot_id: EP46-S10
  scene_id: SCENE-014
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 太妃没有立刻回答。她站在那里，深紫色的宫装在两个世界的光线下呈现出复杂的颜色——靠近古燕京的一侧是暖金，靠近杭州的一侧是冷灰。她的目光低垂——落在桌面上摊开的剧本手稿上。手稿上密密麻麻的修改痕迹——有些是她自己写的。她沉默了很久——久到翠微不安地看了看赵景和，久到苏晚晴微微皱起了眉。然后太妃开口了。声音里没有了攻击性——像一堵墙终于裂开了一道缝。
  characters:
  - CHAR-005
  dialogue: 本宫活了四十年——在六个编剧手下当过反派。
- shot_id: EP46-S11
  scene_id: SCENE-014
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 苏晚晴没有回答太妃的问题——而是向前走了一步。她站在边界的正中央，月白色的长裙被两侧的光线同时照亮。她举起了一只手——像在课堂上举手发言的学生，但她的表情不是请求许可，而是一份已经准备好的声明。她的目光没有看太妃，也没有看沈长渊——她看着林小满。因为这是她对林小满说的。
  characters:
  - CHAR-006
  dialogue: 我同意。但我有一个条件。
- shot_id: EP46-S12
  scene_id: SCENE-014
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 全景——边界空间中的所有人。苏晚晴站在中央，林小满看着她，太妃缓缓转过头来，沈长渊从靠着的柱子上直起身，翠微张着嘴忘了合上，赵景和手里的扇子停在了半空中。苏晚晴说完了那句话——声音很轻，但在边界空间的寂静中，每个字都像石头投入深水。她的表情不是悲伤——是一种"我终于说出了那个最重要的词"的如释重负。边界两侧的光线同时落在她身上。林小满的瞳孔微微放大了——她明白了。这不是一个"条件"。这是一个角色的自我确认。沉默持续了几拍。然后林小满开口了——不是什么豪言壮语，只是一个简单的、直接的、像把钥匙放在桌上的回答。
  characters:
  - CHAR-006
  - CHAR-001
  - CHAR-005
  - CHAR-002
  - CHAR-004
  - CHAR-007
  dialogue: ——让我知道自己是真实的。
