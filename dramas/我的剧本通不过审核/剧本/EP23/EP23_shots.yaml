- shot_id: EP23-S01
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 密室内，烛火跳动。太妃站在石阶前，手握铜钥匙——她没有锁门，而是将钥匙举到烛光前。钥匙在火光中泛着暗金色的光。太妃的视线从钥匙上移开，落在林小满脸上——那目光里没有愤怒，没有威胁，而是一种更深沉的东西：她不是在惩罚林小满——她是在保护那个秘密。她转身走上石阶，在登上最后一级时停住了。她开口——声音从上面传下来，带着回音，像从另一个世界传来的最后通牒。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 本宫说过——不要告诉沈长渊。这是本宫给你的最后一次提醒。
- shot_id: EP23-S02
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃消失在石阶顶端。沉闷的关门声传来——不是普通的关门声，而是一种厚重的、像石头摩擦一样的声响。林小满冲上石阶——推开密室门——门外，那条她发现的新长廊——不见了。取而代之的是一面粗糙的宫墙，墙砖紧密，看不出任何门的痕迹。长廊消失了——被"封"住了。不是被拆了，是从物理上被抹去了存在。林小满伸手摸了摸墙面——冰冷的青砖，严丝合缝，仿佛那条长廊、那扇门、那间密室，从未存在过。
  characters:
  - CHAR-001
  dialogue: ——
- shot_id: EP23-S03
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手在冰冷墙砖上缓缓滑过——她摸遍了那片区域，没有接缝，没有门缝，没有任何异样。她收回手，指腹上沾了一层灰——老墙灰，不像是新砌的。太妃的能力不仅仅是"封住"空间——她是在用这个世界自己的规则来抹除它。林小满后退了一步，又退了一步。然后她转身——开始跑。不是慌乱地跑，是那种"我必须离开这里、我必须找个安全的地方整理思路"的急促奔跑。她的裙摆扫过宫砖地面，脚步在空旷的回廊中回响。
  characters:
  - CHAR-001
  dialogue: 怎么做到的——这个世界的东西——她能直接删除？
- shot_id: EP23-S04
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 镜头跟随（奔跑）
  content: 林小满穿过皇宫回廊，脚步急促但不慌乱。她双手抱着自己——不是冷，是心跳太快的一种本能的自我搂抱。她穿过了两道宫门，确认没有人跟上来之后，在廊柱间停下，大口喘气。她靠在一根朱红柱子上，闭眼整理了五秒思绪。睁开眼时，她的眼神稍微稳了一些——恐惧还在，但已经被她压制住了。她需要和翠微对话，需要把脑子里那三条信息梳理清楚。她迈步朝沈长渊的侯府方向走去——那是她现在唯一能信任的去处。
  characters:
  - CHAR-001
  dialogue: 三条信息——第7个编剧，太妃是第一个觉醒者，沈长渊是钥匙。
- shot_id: EP23-S05
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 侯府书房，林小满把密室的事快速讲了一遍。她说得很快——筛掉了不必要的细节，只留核心信息。翠微放下手里的浇花水瓢，站在原地听着，嘴巴从微张变成了彻底张大。当林小满说到"第7个编剧"时，翠微的眼皮跳了一下。当说到"太妃是第一个觉醒者，存在时间比所有编剧都长"时，翠微的手不自觉地摸上了自己的胳膊——她在发冷。当说到"沈长渊——钥匙"时，翠微眨了两下眼——然后一屁股坐在了旁边的石凳上。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 密室墙上写着——我是第7个编剧。前面还有六个。
- shot_id: EP23-S06
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满点头。翠微的问题像一盆冷水——六个前任编剧每个人都经历了穿越→发现世界秘密→然后……然后就没了？墙上的纸条没有写他们最后去了哪里。林小满接着说第三条信息——沈长渊是"钥匙"。翠微听完没有立刻回应，而是低下头，手指又开始绞衣角——她每次深度思考都这样。过了一会儿，她抬起头来，声音比刚才轻了很多——她意识到了这句话的分量。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 第三条——沈长渊，墙上写着——钥匙。
- shot_id: EP23-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站起来，开始在书房里踱步——她的思考模式又启动了。翠微坐在石凳上，视线追着她。林小满开始把最近的线索连起来：现实中的房东和沈长渊长得一样、三年前的信、沈长渊没有父亲记忆、密室墙上"沈长渊——钥匙"——这些碎片在往同一个方向聚拢。她停下来，看向翠微——她需要一个外部的判断。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 你想——现实中的房东——和沈长渊长得一模一样。
- shot_id: EP23-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微听着，眼睛越睁越大。她没有反驳——因为林小满说的逻辑确实通。但翠微突然想到另一个问题——她的表情从不自觉的认同变成了一种新的担忧。她身子微微前倾，压低声音——像是在说一个她自己也不太敢确认的猜测。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 那太妃——她知道沈公子是钥匙——她在阻止你知道这件事——
- shot_id: EP23-S09
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满坐下来，拿起桌上的毛笔在指尖转了一圈又放下——她的思绪在加速。她回想墙上的细节："太妃——第一个觉醒者"下面还有一行小字——"存在时间超越所有编剧"。这句话的意思是——太妃在第一个编剧进来之前就已经存在了？还是说她在第一个编剧进来之后就觉醒了，然后活过了所有编剧的时代？翠微在旁边看着她，忽然想到一个问题。她问得很轻，但这个问题像一块石头沉入深水。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 她是最早醒来的——但她醒来的时间点是什么时候？是在第一个编剧来之前——还是之后？
- shot_id: EP23-S10
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 镜头缓推
  content: 两人同时沉默了。这个问题——太妃是谁写的——触及了一个更深的不安。翠微低下视线，手指在石凳边缘无意识地划着圈。过了一会儿，她抬起头，问了一个更沉重的问题。林小满不想回答这个问题——但她的沉默本身就是回答。翠微看着她的表情，自己得出了答案。她咽了一口唾沫，声音有些发紧。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 那——墙上写了六个前任编剧——他们最后——去哪儿了？
- shot_id: EP23-S11
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 深夜。侯府客房的烛火在窗纸上投下温暖的光晕。林小满坐在案前，没有写东西——只是安静地坐着。窗外传来夜鸟的几声低鸣。她的大脑在自动回放密室墙上的画面——那张张纸条像幻灯片一样在脑海中闪过。"林小满——第7个编剧。""太妃——第一个觉醒者。""沈长渊——钥匙。"还有角落里那张被污损的纸条——"第1个编剧——"后面的字看不清了。她闭上眼，试图回忆更多细节——纸条上有没有日期？有没有字迹之外的标记？但她当时太震惊了，能记住的核心信息就是这三条。她睁开眼，叹了口气——今晚是睡不着的。她摸了摸袖中的手机——这是她下意识的动作，一个现代人在不安时的本能——想看看时间，想确认现实世界还在。
  characters:
  - CHAR-001
  dialogue: 第7个编剧——我是第7个。前面六个，有人活着出去过吗？还是全部困在里面了？
- shot_id: EP23-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推→固定
  content: 安静的深夜房间。突然——林小满的袖子里传来一声震动的嗡鸣。她愣了一下——这个时间谁会找她？她抽出手机，屏幕在黑暗中亮起，照亮了她的脸。屏幕上显示：一条新短信。发件人——无号码显示，只有一个横杠。不是橙姐，不是任何人她认识的号码。她点开短信——屏幕的光照亮了她整张脸。她的瞳孔在读到第一行字时骤然收缩。她读了第一遍——没动。又读了第二遍——她的呼吸停住了。短信只有两行字：「别信墙上写的。太妃篡改过内容。——第5个编剧」林小满握着手机的手微微发抖——不是因为恐惧——是因为这句话意味着一个人。一个她在密室墙上看到过的编号。第5个编剧——还活着。不仅活着——还知道她看了墙上的内容——还知道她需要知道什么
  characters:
  - CHAR-001
  dialogue: ——这个点了，谁会——
