  camera: i2v_ref 固定镜头
  content: 画廊午后的光景——白色墙壁上挂着水墨画，阳光从大落地窗斜照进来，在地板上画出一道道温暖的光影。林小满盘腿坐在木地板上，笔记本电脑（`PROP-001`）放在面前的小木桌上。沈长渊（现实）坐在她旁边——穿着米白色亚麻衬衫，袖子卷到小臂，银色细框眼镜在午后光线里微微反光。林小满打开电脑——屏幕亮起，但画面不是普通的桌面——是燕京的街景，像是实时监控画面。她愣了一下——这比她预想的还要直接。她深吸一口气，点开了一个她从未见过的图标——一个古风纹样的窗口。她的手悬在触摸板上方——带着一点紧张和期待。沈长渊·现实微微前倾，目光同样落在屏幕上——两个人并肩坐着，像是一起打开了一扇从未被打开过的门。
  characters:
  - CHAR-001
  dialogue: 我点了一下'连接'——然后电脑就变成这样了——
- shot_id: EP67-S02
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把光标移到那扇古风纹样的窗口上——轻轻双击。屏幕闪了一下——然后出现了画面。不是风景——是一张脸。一张从某个高度俯视镜头的圆脸——杏眼圆睁——带着惊讶和好奇。是翠微。她的脸占满了整个屏幕——她似乎正在凑近什么（像是凑近一面镜子），然后她认出了林小满——她的表情从好奇变成惊喜，眼睛一下子亮了。屏幕里的背景是暖杏色的茶馆内景——太妃茶馆的木质柜台和竹桌隐约可见。林小满看到翠微的脸——她的嘴角不受控制地弯了起来。视频通话连通了。
  characters:
  - CHAR-001
  dialogue: 小满姐——真的是你！我看到你了！你在一个好白的屋子里！
- shot_id: EP67-S03
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 笔记本电脑（`PROP-001`）屏幕——翠微稍微让开了一些，露出后面的赵景和。他穿着深蓝色便服，头发简单束起——少年的脸上带着一种"这地方不对"的警惕和好奇。他凑近屏幕——不是像翠微那样整张脸贴上来——是带着帝王式的审视，微微眯起眼睛，打量着屏幕里林小满身后的背景。然后他看到了落地窗——窗外杭州的天际线，高高低低的现代建筑，远处钱塘江大桥的轮廓。他愣住了。作为剧本世界的少年天子，他见过最高的建筑是皇宫的角楼——窗外那些玻璃幕墙的高楼大厦完全超出了他的认知范围。他张了张嘴——然后说出了一句完全出乎意料的话——语气不是恐惧，是"这也太厉害了吧"的惊叹。
  characters:
  - CHAR-001
  dialogue: 外面那些——比城墙还高的——也是房子？
- shot_id: EP67-S04
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满笑着转过笔记本电脑——把屏幕朝向落地窗，让赵景和能更清楚地看到窗外的城市。沈长渊·现实也跟着站起来，走到窗边，配合地拉开了半透明的白纱窗帘——阳光涌进来，窗外的城市全景在午后光线里铺开。屏幕里传来赵景和的惊呼——但他保持了最后一丝帝王仪态，尽量克制自己的惊叹，换来的是翠微不留情面的戳穿。两个世界的人隔着屏幕和落地窗，一起看着同一片城市天际线——这一幕，魔幻又温暖。
  characters:
  - CHAR-001
  dialogue: 那是杭州的天际线——最高的那栋有六十多层——
- shot_id: EP67-S05
  scene_id: SCENE-011
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满把电脑转回来——翠微的脸重新占满屏幕。但她没在看林小满——她的目光越过了镜头，落在了画廊墙上的一面装饰镜子上——黄铜边框的复古圆镜，挂在白墙中间，正好反射出电脑屏幕的方向。翠微通过镜头看到了镜子里自己的倒影——她穿着鹅黄衫裙、梳着双丫髻、系着彩色发带的古装造型，出现在一个现代画廊的镜子里。她愣了一下——然后凑近屏幕，左右转了转头，研究自己的发型和发饰。林小满看着翠微在屏幕里臭美的样子——笑着举起手机（`PROP-002`），帮她拍了张照。快门声让翠微一惊——然后她反应过来，带着一点害羞和更多的臭美，问了那个每个穿越到现代世界的人都会问的问题。
  characters:
  - CHAR-001
  dialogue: 哇——我穿这个在你们世界的镜子里看——还挺好看的嘛——
- shot_id: EP67-S06
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 沈长渊·现实从厨房方向走回来——手里端着一个托盘，上面放着两杯热茶。白瓷杯里飘着茶香，杯沿有一缕白色的热气升起。他走到小木桌前，弯下腰，把一杯茶放在电脑旁边——不是放在自己面前，是放在电脑摄像头正前方——像是给屏幕那头的客人倒的。那个动作很自然，好像他在给站在面前的客人倒茶——没有因为对方在屏幕里就有任何区别对待。他直起身，推了推眼镜——表情温和但认真。林小满看着他给屏幕那头的古装角色倒茶——这一幕的荒谬和温暖让她忍不住笑了。
  characters:
  - CHAR-003
  dialogue: 刚泡的龙井——趁热。
- shot_id: EP67-S07
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 屏幕里的翠微——她看到电脑前放了一杯茶，愣了一下。然后她伸出一根手指——朝屏幕的方向戳了戳——当然是戳不到杯子的。但她没有尴尬——她笑着缩回手，然后用一个非常"翠微"的方式化解了这种物理距离的尴尬——她说她隔着屏幕也能闻到茶香，然后顺带吐槽了太妃茶馆的茶从来不会送到手边。屏幕外的沈长渊·现实听到她提起太妃，嘴角浮起一个温和的笑意——他对着屏幕微微点了点头，说了一句简短但暖心的承诺。
  characters:
  - CHAR-001
  dialogue: 隔着屏幕我都闻到茶香了——比太妃茶馆的还香——她从来不把茶送到客人手边——
- shot_id: EP67-S08
  scene_id: SCENE-011
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 赵景和接手了"串门"的主导权——他把翠微轻轻拨到一边，自己凑近镜头。他的目光在画廊里扫视——从沈长渊·现实（和他古装版同一张脸但戴着眼镜穿着衬衫的男人）的脸上扫过，到画廊的画作，到天花板上的射灯，到地上的木地板——最后落在一个他完全不能理解的东西上——墙角一台落地灯。银色的金属灯杆，乳白色的灯罩，简洁的现代设计。他用一个十七岁少年皇帝的全部知识储备去理解这个物体——然后得出了一个让他自己满意的结论：它和宫里的铜灯是一个东西，只是"不用点火"。他说这话时带着一种"朕什么都懂"的自信，但语气里藏不住的新奇和兴奋出卖了他。
  characters:
  - CHAR-001
  dialogue: 那个——立在地上发光的——是灯吧——
- shot_id: EP67-S09
  scene_id: SCENE-011
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 屏幕上——赵景和正在努力装作很懂现代家具的样子——突然，屏幕里的画面被一个深紫色的身影挤占了。一只手——戴着熟悉的凤镯——从画面外伸进来，把赵景和拨到一边（他的抗议声还没落地就被无视了）。太妃的脸出现在屏幕正中央——穿着深紫色宫装，发髻高挽，凤钗斜插——但她的表情不再是之前那种威严肃穆了。她带着一种"让开让开，本宫有正事"的表情挤到镜头前——然后看了看屏幕这边的画面——画廊、白墙、落地窗、现代画作——她安静了大约一秒。然后她开口了。不是"本宫驾到"式的开场——她压低声音说出的那句话，像是要把一个酝酿了很久的秘密公之于众。林小满和沈长渊·现实对视了一眼——太妃的表情不像在开玩笑。
  characters:
  - CHAR-001
  dialogue: 等一下——让本宫说句话——
- shot_id: EP67-S10
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃的表情更认真了——但不是严肃，是一种"本宫要告诉你一件很重要的事"的认真。她压低声音，像是怕被别人听到——然后说出了她那本回忆录里的一个细节。她自己写的。在茶馆开业的第二天，她坐在窗边写回忆录的"新篇章"时——抬头看到一个穿着T恤的客人走进来。她当时就想——"这是什么衣服？看起来好舒服。"她把这个细节写进了书里。然后她直视镜头——用那种太妃式的不容拒绝的语气——说出了她人生的第一个网购请求。
  characters:
  - CHAR-001
  dialogue: 我那本回忆录——写到茶馆开业的第二天——有一个穿T恤的客人走进来——
- shot_id: EP67-S11
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃说完那句话之后——屏幕里传来翠微和赵景和的笑声。太妃回头瞪了他们一眼——但那眼神已经不是以前的"本宫要你的命"了——是一个被后辈取笑的长辈带着一点尴尬但依然坚持的倔强。她转回来，看着林小满——语气里带着一种"本宫是认真的"的坚持。林小满已经笑得靠在沈长渊的肩膀上了——沈长渊·现实也笑了，推了推眼镜，说了一句认真的回答。太妃听到"多寄几件"之后——眼睛亮了。那个眼神——从威严的太妃到收到第一个网购承诺的女人——是她角色蜕变中最可爱的一帧。
  characters:
  - CHAR-001
  dialogue: 娘娘——你写回忆录的时候就在打这个主意吧——！
- shot_id: EP67-S12
  scene_id: SCENE-011
  duration_sec: 10
  camera: i2v_ref 镜头拉远
  content: 画廊的全景——午后的阳光把整个空间浸泡在温暖的金色里。笔记本电脑（`PROP-001`）的屏幕亮着，屏幕上太妃正在和翠微争论"T恤要什么颜色"，赵景和在旁边插嘴说"朕也要一件"。屏幕外——林小满靠在沈长渊·现实旁边，笑得肩膀一抖一抖的。沈长渊·现实端着茶杯，嘴角带着温和的笑意，看着屏幕里那些从另一个世界来的客人和他们争论T恤的颜色——那个表情不是"这也太荒谬了"，是"这个画面我要记住很久"。镜头从他们的中景缓缓拉远——画廊的白墙、落地窗、阳光、画作、笑声——定格在笔记本电脑的屏幕上——那张亮着的屏幕里，古装角色们还在热闹地讨论着T恤的颜色，像是一扇永远不会关上的窗。
  characters:
  - CHAR-001
  dialogue: 娘娘穿杏色好看——你皮肤白——
