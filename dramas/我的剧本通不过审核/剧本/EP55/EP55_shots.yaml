  camera: i2v_ref 固定镜头
  content: 清晨的光线透过纸糊的窗棂洒进房间，在木地板上投下菱形的暖金色光斑。林小满从一张古色古香的木床上醒来——被褥是浅青色的丝绸，枕头是瓷枕外包了一层棉布。她眨了眨眼，眼神从惺忪慢慢清醒。房间里的一切都熟悉又陌生：竹编的衣柜、铜盆架、窗边一张书案上放着她的笔记本电脑（`PROP-001`），旁边是一盏没来得及吹灭的油灯。她坐起身，长发散落在肩头——昨晚她在这睡了新世界重构后的第一觉。
  characters:
  - CHAR-001
  dialogue: 这间房……比以前亮了。
- shot_id: EP55-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满披上一件外衣（淡紫色襦裙，`CHAR-001-L02`），走向窗边。她的手搭在木窗的插销上，轻轻一推——窗户吱呀一声打开了。清晨的风裹着街市的声音涌进来——远处有叫卖声、车马声，还有……一种她说不清的低沉轰鸣，像是城市醒来的声音。她扶着窗框往外看——然后愣住了。她的瞳孔微微放大，呼吸停在半空。
  characters:
  - CHAR-001
  dialogue: 这……这是——
- shot_id: EP55-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 从林小满的视角看出去——窗户内是古朴的木框和纸面，窗外是一个不可能存在的景象。近处是燕京清晨的街市：青石板路，挑着担子的小贩，升起的炊烟，灰瓦屋顶层层叠叠。但视野延伸到远处——地平线上，一座现代钢索斜拉桥横跨宽阔的江面，钱塘江大桥的轮廓在晨雾中若隐若现，桥上车灯连成流动的光带。两个时代的景象像两张半透明的底片叠在一起——古建筑的飞檐翘角与远处玻璃幕墙高楼的剪影共存。天空也分裂着：近处是古画般的鱼肚白带一抹淡橙，远处是现代都市特有的蓝灰色雾霭。风吹动街市的旗幡，也吹动远处高楼顶上的天线。一切都在动，都在呼吸。
  characters:
  - CHAR-001
  dialogue: 燕京……和杭州……叠在一起了。
- shot_id: EP55-S05
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 茶楼内，竹桌竹椅擦拭得干干净净，窗台上摆着一盆薄荷和一盆铜钱草。翠微——穿着鹅黄色对襟短衫（`CHAR-004-L01`），袖子用襻膊带子扎起，正坐在柜台后面低头看什么。她面前不是账本，而是一台银色的平板电脑——屏幕亮着，显示着一个记账App的界面，列表里一行行毛笔风格的条目写着"铁观音×3"
    "龙井×5" "花生米×2"。翠微用手指在屏幕上划拉，动作不太熟练，眉头微皱，用食指一下一下地点，好像在戳一个不太听话的按钮。林小满走进来，看到这画面——差点笑出声。
  characters:
  - CHAR-004
  dialogue: 翠微……你这是——
- shot_id: EP55-S06
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微把平板翻过来给林小满看——屏幕上弹出一个系统更新提示，她戳了"稍后提醒"但手指没点到，于是提示框顽固地留在屏幕上。翠微一脸困惑地看着这个"不听话的小方块"。林小满接过平板，熟练地关掉提示，还给翠微。翠微看着恢复正常的界面，露出崇拜的表情。
  characters:
  - CHAR-004
  dialogue: 小姐你看看——它是不是在跟我作对？
- shot_id: EP55-S07
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 茶楼靠窗的角落里，赵景和（`CHAR-007-L02`）坐在一张竹椅上。他穿着一件灰色布衣便服——没有龙袍、没有金冠，就是一个普通年轻人的样子。但他面前的桌上摊着一沓奏折——黄绫封面，毛笔手写，每一本都批了朱砂字。而他耳朵上——塞着一副白色无线耳机。他一手执朱笔在奏折上写批语，嘴里跟着耳机里的音乐轻轻哼着调子，脚尖还在地板上一点一点地打着节拍。这画面太混搭了：古代帝王批奏折的仪式感和现代人听歌的松弛感完美共存。他看到林小满进来，摘下一边耳机，笑了一下。
  characters:
  - CHAR-007
  dialogue: 林姐姐来了？
- shot_id: EP55-S08
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 赵景和晃了晃另一只耳朵上的耳机，一脸理所当然的表情。他把奏折举起来给林小满看——朱砂批注的旁边，画了一个小小的笑脸符号。翠微凑过来看了一眼，翻了个白眼。林小满忍俊不禁——这位前皇帝已经彻底适应了新世界的混搭生活。
  characters:
  - CHAR-007
  dialogue: 苏姑娘给的。她说这叫'工作背景音'——批奏折的时候听，效率高。
- shot_id: EP55-S09
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶楼的后院不大，种着一棵枣树，树荫下放着一张竹编矮榻。太妃（`CHAR-005-L01`）坐在矮榻上——深紫色的宫装还在，但姿态完全不同了。她没有端坐着，而是靠着一个软垫，一条腿曲起，完全是一个在家看书的人最放松的姿势。她手里捧着一本书——靛蓝色封面的线装手写本，封面左上角竖写着五个墨笔字。清晨的阳光透过枣树叶的空隙洒在她身上，落下斑驳的光点。她翻了一页，动作很轻，像在对待一件极其珍贵的东西。
  characters:
  - CHAR-005
- shot_id: EP55-S10
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满轻轻走进后院，看到太妃的侧影——阳光从上方洒下来，在她深紫色的衣袍上形成了柔和的光晕。她手里那本书的封面在光线下映出靛蓝色的光泽。太妃没有抬头——但她知道林小满来了。她的手指停在某一页上，没有翻动，像是读到了什么需要消化一下的内容。过了好几秒，她才缓缓开口——声音比从前柔和了许多，少了那种"本宫"的威严，多了一个人在读自己写的一生时的那种沉静。
  characters:
  - CHAR-001
  dialogue: 你来了。
- shot_id: EP55-S11
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 特写信封的封面。靛蓝色宣纸裱糊的硬壳封面，左上角竖写着五个行楷字——"七个编剧和我"（`PROP-012`）。墨色浓黑，笔锋有力，但仔细看每一笔都有轻微的颤抖——像是一个人写着写着，手在抖，但笔没有停。林小满的目光从封面移到太妃的脸上——太妃的嘴角带着一丝她没有见过的表情：不是威严、不是嘲讽、不是警惕——是一种满足的平静。她翻开书，展示给林小满看——内页的纸张颜色深浅不一，墨色也从最初的深黑到中间的灰色再到最后的浓黑，记录着不同时期、不同心境下的书写。
  characters:
  - CHAR-005
  dialogue: '''七个编剧和我''……'
- shot_id: EP55-S12
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 太妃的手指轻轻抚过书页——触摸着某一段文字，指尖在纸面上微微停留。她没看林小满，而是看着自己写的字，像是在和许多年前的自己对话。她的声音平稳但带着暗流——不是悲伤，是那种"走了很长很长的路终于能回头看一眼"的情绪。她翻到书的开头部分，纸张的颜色更黄一些，墨迹也更淡。
  characters:
  - CHAR-005
  dialogue: 从第1个编剧写我的第一句台词开始——
- shot_id: EP55-S13
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 太妃翻到书的最后几页——纸张的颜色新一些，墨色浓黑有力。她的手指在最后一页上停了很久，指尖下面的文字是最近才写上去的。她深深地吸了一口气——不是深呼吸那种平稳的吸气，是那种"我需要压住情绪才能继续说话"的吸气。然后她抬起头，看着林小满——她的眼眶是红的，但没有哭出来。她反而笑了一下——不是从前那种带着算计的冷笑，是一个人在读完自己一生的最后一段时，发自内心的、带着泪光的笑容。
  characters:
  - CHAR-005
  dialogue: 然后——第7个编剧来了。
- shot_id: EP55-S14
  scene_id: SCENE-016
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的嘴唇微微发抖。她低头看着书，又抬头看林小满——眼泪终于从眼眶里滑落下来，但她同时也在笑。这不是悲伤的哭——是一个人终于被完整地看见、被完整地书写之后，那种如释重负的、感激的泪水。她用手背擦了擦眼泪，但新的眼泪又涌出来。她索性不擦了，任由泪水沿着脸颊流下来，滴在靛蓝色的封面上，洇成一小朵深色的花。她低头看着那朵洇开的墨花，又抬头看向林小满——笑容和眼泪同时在脸上，不矛盾。
  characters:
  - CHAR-005
  dialogue: 从第1个编剧写我第一句台词开始——到第7个编剧给了我自由。
- shot_id: EP55-S15
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满没有说话。她看着太妃脸上交织的笑容和泪水，自己的眼眶也开始发热。她想起第一次见到太妃时的场景——那个站在金銮殿上、气场全开、用一句话就压得她喘不过气来的反派。现在那个反派坐在这棵枣树下，手里捧着自己写的一生，笑得像个终于被理解了的人。林小满低下头，用指背碰了碰眼角——指背湿了。她深吸一口气。
  characters:
  - CHAR-001
  dialogue: 你说得对——你的一生。
- shot_id: EP55-S16
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 清晨的庭院里，枣树叶在微风中轻轻摇曳，阳光透过叶隙在两人身上洒下跳动的光斑。太妃低着头，双手捧着那本靛蓝色的手稿，拇指轻轻摩挲着封面上被泪水洇湿的"我"字。她抬起头看着林小满——眼角的泪还没干，但这一次笑得从容了。她轻轻地、像对自己也像对林小满说了最后一句话。然后低了低头，目光回到书上——不是逃避，是不舍得错过任何一个字。风继续吹着，树叶继续沙沙响着，这个世界的新一天才刚刚开始。
  characters:
  - CHAR-005
  dialogue: 完整了。
