- shot_id: EP35-S01
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 固定镜头→缓移
  content: 密室的烛台重新点燃了——之前崩塌时灭掉的。光线昏暗，墙上贴满发黄的纸条，红绳连接着各个名字。林小满站在那面线索墙前，目光停留在"沈长渊=钥匙"那几个字上。她的手指轻轻划过纸条边缘——纸条的边角有些翘起，像是被重新贴过。她皱起眉——这些字迹和她第一次看到时好像不太一样了。她转头看向密室最深处的那面墙——之前从未注意到那里有一道几乎看不见的缝隙，像一扇被砌死的门。墙缝里透出极淡的一丝光。
  characters:
  - CHAR-001
  dialogue: 不对——上次来看的时候——这面墙不是这样的。
- shot_id: EP35-S02
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 镜头跟随
  content: 林小满沿着墙缝摸索，手指触到一处松动——一块墙砖微微向内陷。她用力一推——整面墙像一扇暗门一样无声地打开了。门后是一个她从未见过的空间：一个圆形的隐藏藏书阁。书架沿着弧形墙壁层层排列，落满灰尘。中央有一张矮几，几上放着一盏熄灭的油灯。她举起烛台走进去——烛光照亮书架上的书名。大部分书脊上都没有名字——只有一本，在书架正中央最显眼的位置，独立放置。深蓝色封面，五个烫金大字在烛火下微微反光。她伸手取下它，指尖碰到封面时感到一阵微凉。
  characters:
  - CHAR-001
  dialogue: 这是什么地方——我从来没有写过这个场景——
- shot_id: EP35-S03
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 密室门口传来脚步声。沈长渊的身影出现在烛光照不到的暗处——他找她找到这里来了。他看到密室深处的墙被打开了——一道他从未见过的暗门敞开着，里面透出微弱的烛光。他微微眯起眼——不是诧异，是一种"果然还有隐藏空间"的了然。他走到暗门前，看到里面的景象：隐藏的藏书阁，落满灰的书架，以及站在书架前、手捧一本深蓝色书的林小满。
  characters:
  - CHAR-002
  dialogue: 你找到什么了。
- shot_id: EP35-S04
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满转过头。她手里捧着那本书，烛火在她脸上投下跳动的光影。她的表情是复杂的——有惊讶、有警觉，还有一种"你来得正好"的迫切。她看了他一眼——然后低头看手中书的封面。沈长渊走进暗室，站到她身侧，目光落在她手中的书上。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 这本书——讲的是前六个编剧的故事。
- shot_id: EP35-S05
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满在矮几前坐下来。她重新点燃油灯——昏黄的光照亮泛黄的书页。沈长渊没有坐下——他站在她身后稍侧的位置，一只手按在佩剑上，沉默地陪着她。她翻开第一页。字迹工整秀丽，但写到后半部分开始潦草，像是执笔人的精神状态在恶化。她读得很快——扫描式阅读——手指划过字行，捕捉关键信息。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 第1任——发现太妃是觉醒者——和她合作写了前几集——然后消失了。书上没写怎么消失的。
- shot_id: EP35-S06
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满抬起头看向他。她的表情里有拼图正在对齐的感觉。沈长渊的目光没有离开书页——他在认真听，也在思考。她翻到下一篇——第3任的笔记页面被划掉了大段文字，像是写着写着就后悔了。纸张边缘有水渍的痕迹。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 第3任——写了太妃三分之二的戏——然后——也消失了。她写在页面边上两个字——'对不起。'"
- shot_id: EP35-S07
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 她继续翻页。书页越来越旧，字迹也越来越不同——每个人的笔迹都不同，但能看出同一个趋势：从一开始的工整到后期的混乱。第4任的页面边缘有大片水渍痕迹。第5任的页面上有墨迹涂抹——像是写了又后悔、涂掉、又重写。林小满的指腹轻轻拂过那些凹凸不平的涂痕。她的声音从读信息变成了陈述事实——她已经沉浸在这些前任留下的痕迹里了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 第4任——发现无法离开——和太妃谈判失败——书里写着——'她哭了很多天。然后不哭了。开始写日记。'"
- shot_id: EP35-S08
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满翻到第6任编剧的篇章——页数比前五个都多。字迹从工整行书慢慢变得潦草，但能看出一个人在认真记录自己在这个世界的每一天。她的目光在行间快速移动，捕捉那些关键句。沈长渊微微俯身，一只手撑在矮几边沿——他也想看。她读到某一行时，手指停住了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 第6任——他写得最多——他写——'太妃说钥匙开门后——门后是虚无。'"
- shot_id: EP35-S09
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把书稍微侧过来一点，让烛光更亮地照在那一页上。她的表情变了——不是恐惧，而是一种"所有碎片终于对齐了"的复杂表情。她读出了第6任编剧在那行字下面新加的、用力到几乎刺破纸面的一行字。油灯的光在书页上跳动，那行字的笔压极重——像是一个人下定了某种决心后写下的。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: '''我决定让钥匙开门。我不相信她。''"'
- shot_id: EP35-S10
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满翻到第6任的最后一页。这一页和前面都不一样——字迹不再是潦草的日记体，而是一行写得极慢、极用力、几乎是一笔一划刻进纸里的字。像是写在生命最后时刻的结论。她读完之后，没有立刻说话。她看着那行字看了很久。沈长渊也没有催她——他知道书页上写了什么重要的东西。烛火在跳，她的手指停在最后一个字的笔锋上。她抬起头，目光里有火光在跳——不是烛火的倒影，是她眼睛里重新燃起的某种光。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: '''钥匙开门后——门后不是虚无。''"'
- shot_id: EP35-S11
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满合上书。灰尘在烛火上方缓缓飘动。她坐在矮几前，手还按在书的封面上——仿佛怕它消失一样。她的脑子在飞速运转——如果钥匙不是毁灭，而是连接——如果门后不是虚无，而是现实世界——那太妃一直在阻止钥匙觉醒的根本原因就不是保护这个世界。沈长渊从她手中轻轻拿过那本书——他翻到最后一页，自己看了一遍那行字。看完后他把书合上，递还给她。他的目光里有和林小满一样的了然——甚至更早一步就已经想通了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我要去找太妃。带着这本书。
