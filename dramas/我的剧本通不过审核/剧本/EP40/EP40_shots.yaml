- shot_id: EP40-S01
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 同样的御花园，同样的花树，但这一次——光线不一样了。不再是灰黯的，而是暖金色的晨光。翠微站在花树下，没有昨天的茫然——她看着远处的赵景和，目光不是陌生，而是在——回忆。赵景和站在回廊下，不敢靠近——怕再次被推开。翠微歪了歪头，好像在努力想什么。
  characters:
  - CHAR-004
  - CHAR-007
  dialogue: 你……昨天是不是来过？
- shot_id: EP40-S02
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 翠微走到赵景和面前，仰头看着他。她伸出手——不是拉他的手，而是轻轻碰了碰他袖子上的龙纹刺绣。赵景和不敢呼吸。翠微抬起头，看着他的眼睛——然后笑了。这个笑容不是林小满写过的——是她自己的。带着一点害羞、一点确认、一点"原来是你啊"的温暖。
  characters:
  - CHAR-004
  - CHAR-007
  dialogue: 不记得你说什么了。——但我记得你。
- shot_id: EP40-S03
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 酒楼一层。苏晚晴坐在掌柜的面前——不是昨天的茫然女子，而是换了一个人。她腰背挺直，眼神清亮，手指在账本上不紧不慢地点着。掌柜的坐在对面，一脸狐疑地看着这个突然闯进来的年轻女子。柜台上的算盘珠子映着窗外的光。林小满躲在楼梯后面，瞪大了眼睛看着这一幕——她什么都没写，苏晚晴自己来了。
  characters:
  - CHAR-006
  dialogue: 你这间店——流水不对。
- shot_id: EP40-S04
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 掌柜的脸色变了——不是愤怒，是被说中的震惊。苏晚晴合上账本，从袖子里抽出一张纸——是她自己写的方案。纸上是毛笔画的店铺平面图，标注了翻新方案和新的菜品定位。她把它推到掌柜面前。
  characters:
  - CHAR-006
  dialogue: 我帮你翻新——重新定位——三个月内扭亏为盈。利润我抽三成。你干不干。
- shot_id: EP40-S05
  scene_id: SCENE-002
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 金銮殿上。赵景和坐在龙椅上——不是昨天那个缩着肩膀、不知所措的少年了。他的坐姿还是带着少年人的单薄，但眼神不一样了。朝堂上，几个大臣正在激烈争论边疆军务——"必须增兵""臣以为不妥"——太妃坐在侧座上，审视着他。赵景和握了握扶手——不是紧张，是在给自己一个支点。
  characters:
  - CHAR-007
  - CHAR-005
  dialogue: 陛下——边疆告急——非增兵不可！
- shot_id: EP40-S06
  scene_id: SCENE-002
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和从龙椅上站起来。他走到大臣们面前——不是用帝王的身份压人，而是走近了说话。太妃的凤镯微微发光——她下意识地攥紧了手——因为她感觉到了：这段台词不是任何人写的。是赵景和自己想出来的。大殿里的光线从高窗斜射下来，照在他脸上，少年的轮廓在这一刻有了帝王的重量。
  characters:
  - CHAR-007
  - CHAR-005
  dialogue: 增兵要钱。不增兵要命。——朕的意思——先谈。谈不拢——再打。
- shot_id: EP40-S07
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃寝宫。深紫色的帷幔低垂，空气中是沉香的余味。太妃坐在铜镜前——但她没有照镜子，她的目光落在镜中映出的林小满和沈长渊身上。林小满站在门口，脸上有一种复杂的表情——是喜悦？是不安？是——"他们不需要我了"的失落。沈长渊站在她身后，沉默地看着。
  characters:
  - CHAR-005
  - CHAR-001
  - CHAR-002
  dialogue: 你看到了。——翠微想起来了。苏晚晴在谈生意。皇帝会自己决策了。——你的角色，长大了。
- shot_id: EP40-S08
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满没有说话。她低下头——不是难过，是在体会这种感觉。太妃说对了——有一种空落落的、但又轻盈的感觉。就像一直抱着很重的东西，突然放下了——手还在发麻，但胸口松了。她抬起头，看着太妃。
  characters:
  - CHAR-001
  dialogue: ——奇怪。有点空——但是……是好的那种空。
- shot_id: EP40-S09
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃被这个问题问住了。她张了张嘴——本来想说什么——但又合上了。她走到窗边，背对着林小满。深紫色宫装的背影在窗口的光线下显得端正又孤独。她从来没有被问过这个问题——从来没有人在乎她"试过什么感觉"。所有的编剧都只想给她写戏份，没人问过她想要什么。
  characters:
  - CHAR-005
  dialogue: ——没有人问过我。
- shot_id: EP40-S10
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃转过身来——她的表情还是克制的、威严的，但眼底有一点光不一样了。她看着林小满。不是太妃看编剧——是一个人看另一个人。她看了一眼窗外——远处隐隐传来街市的喧闹声——翠微的笑声、苏晚晴和掌柜讨价还价的声音、赵景和从大殿走出来的脚步声——那是角色们自己的声音。然后她转回视线，看着林小满。
  characters:
  - CHAR-005
  - CHAR-001
  dialogue: 他们都有了自己选择的能力——
- shot_id: EP40-S11
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 镜头推近→固定
  content: 作者空间。纯白的光芒中，林小满再次站在漂浮的文字碎片之间。她的面前浮现出太妃的属性面板——和昨天那些面板一样，半透明的光屏悬浮着。面板上写着「CHAR-005 · 太妃娘娘 · 自由意志：关闭」。她伸出手指——但停住了。她看着那个面板——不是犹豫，是在想一个问题：自由意志一旦开启，太妃会选择成为什么样的人？她不知道——这正是重点。她不再需要知道。她微微一笑，指尖划过了「关闭」二字。两个字亮起金色的光芒——变成了「开启」。整个作者空间微微震动了一下，然后——一道暖金色的光从面板中射出来，飞向了太妃的方向。
  characters:
  - CHAR-001
  dialogue: 你也是角色。——你也应该有选择的权利。
- shot_id: EP40-S12
  scene_id: SCENE-008
  duration_sec: 12
  camera: i2v_ref 镜头拉远
  content: 燕京街市。一间新开的店铺门口——暖杏色的门面，竹桌椅摆在门口，茶香袅袅。一块崭新的木匾挂在门头上——还没有写字。太妃站在门口。她已经脱下了深紫色的沉重宫装——换了一身暖杏色的衣裳（虽然还是古装，但颜色已经变了）。她的头发不再梳得一丝不苟，略微松散了一些——像终于卸下了盔甲。林小满和沈长渊站在不远处看着。太妃抬头看着空白的牌匾，然后转身——看向林小满。她的笑容里有七集以来第一次出现的——轻松。
  characters:
  - CHAR-005
  - CHAR-001
  - CHAR-002
  dialogue: ——想好店名叫什么了吗？
