- shot_id: EP64-S01
  scene_id: SCENE-011
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 画廊大门被推开。暖黄的射灯光从门缝里漫出来——不是刺眼的白，是温存的、有厚度的光。夕阳的余晖从画廊深处的落地窗斜射进来，在地板上拉出一道淡金色的光带。沈长渊侧身替她扶着门——白衬衫的袖口整齐地卷到小臂，在灯光下泛着柔和的暖白色。他做了一个"请进"的手势，不张扬，但带着一种郑重——像是递出一件等了很久的礼物。林小满跨过门槛，目光从地面升起——满墙的画作在射灯下沉默地悬挂着，水墨和油画交错，像两个时代的对话。
  characters:
  - CHAR-003
  dialogue: 欢迎——这间画廊我等了三年才敢请你进来。
- shot_id: EP64-S02
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 镜头跟随
  content: 林小满缓步走入画廊深处——白色墙壁上错落挂着画作，左侧是一幅泼墨山水，墨色浓淡在灯光下呈现微妙的层次；右侧是一幅抽象油画——灰蓝和米白的色块层叠，像被雾笼罩的城市。她的目光从一幅画移到另一幅画，脚步很轻，像是怕惊扰了这个空间的安静。走到画廊最开阔处时，她的视线自然地落向最深处——那里有一幅画，被一块米白色的亚麻布完整地盖着，和其他挂出的画形成鲜明的对比。
  characters:
  - CHAR-001
  dialogue: 这些画……都是你画的？
- shot_id: EP64-S03
  scene_id: SCENE-011
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满在画廊中央停下。她的目光越过几幅画——直直地落在最深处那幅被布盖着的画上。那幅画被单独放在一个木制画架上，不像其他画作挂在墙上，而是独立地站着——像一个被保护得很好、还没准备好见人的东西。她微微侧头，目光在那块布上停留了片刻。身后半步的沈长渊没有说话，但她也感觉到了——他的目光不在别处，在她身上。
  characters:
  - CHAR-001
  dialogue: 那幅画——为什么盖着布？
- shot_id: EP64-S04
  scene_id: SCENE-011
  duration_sec: 10
  camera: i2v_ref 镜头跟随（缓步向前）
  content: 林小满没有等他解释更多——她本能地被那幅画吸引，开始朝画廊最深处走过去。脚步不快，但带着一种下意识的确定——像是有个声音在说"就是它"。走过两排画架，绕过一张木色长凳——她在那幅盖着布的画面前停下来，距离不到一米。白色亚麻布在射灯下呈现出柔和的纹理，布的边角微微垂下，遮住了画框的边缘。沈长渊跟过来，站定在她身侧——他没有靠太近，留出了一个刚好可以并肩看一幅画的距离。他安静了足有两三秒。
  characters:
  - CHAR-001
  dialogue: 什么画——要盖着布放？
- shot_id: EP64-S05
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊没有回答——他向前迈了半步，伸手握住白布的一角。射灯的光打在他的侧脸上——银丝眼镜框反射出一线微光，他的表情很平静，但指尖的动作极轻极慢，像是怕划伤画布。他缓缓拉起白布，亚麻布从画框边缘滑落——布料滑过的声音在安静的画廊里清晰可闻。他拉着布的一角，把整块布从画上完全取下，折叠了两下，放在一旁的桌面上。抬起头，目光落在那幅画上——不是看画的内容，而是看她的反应。
  characters:
  - CHAR-003
- shot_id: EP64-S06
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 镜头从沈长渊的手缓缓上移——推向画布。油画在射灯下一点点显露——画的是一个女孩的背影。她趴在一张老旧木桌上，脸埋在交叉的双臂里睡着了。灰色卫衣的帽子松松地搭在肩后——熟悉的颜色，熟悉的款式。桌上一台银色笔记本电脑半开着，屏幕的微光照在她脸颊边。窗外是杭州的夜色——万家灯火在远处铺展，深蓝的夜空缀着几颗疏星。画的右下角，一行极小的字写在深色窗框上——一个日期，一串数字。女孩的姿态松弛而疲惫——像是一个熬夜写稿的深夜，终于撑不住睡着了。而有人，在那个时刻，没有叫醒她，而是拿起了画笔。
  characters:
  - CHAR-001
  dialogue: 画里的人——是她自己。
- shot_id: EP64-S07
  scene_id: SCENE-011
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满站在画前，整个人静止了。她的目光从画面上的背影慢慢移到右下角那行日期——三年前，九月的某一天。那是她搬进这间公寓的第一天。那天晚上她在电脑前写什么她已经不记得了——但有人记得。有人拿起画笔，把这个瞬间凝固在画布上，挂在这间画廊的最深处，等了三年，等她来打开。她缓缓转过头——沈长渊站在她身侧，没有看她，看着画。他的侧脸在射灯下轮廓分明——和古装沈长渊一模一样的下颌线，但没有那股冷锐，多了一种安静的温柔。他感觉到了她的目光，但没有转头——只是嘴角微微动了一下，像是想说"我知道你有很多问题"。
  characters:
  - CHAR-001
  dialogue: 你——那天晚上——你在看我？
- shot_id: EP64-S08
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊的目光从画上移开，落在画廊入口的方向——不是在看什么东西，是在看记忆。他的视线微微失焦，嘴角却带着一丝几乎不可察觉的笑意，像是一段被珍藏了很久的画面正在他脑海里重播。他开口了——声音不高不低，语速比平时慢一些，像在朗读一段在心里读过千百遍的文字。
  characters:
  - CHAR-003
  dialogue: 三年前的秋天——你第一次走进这间画廊。
- shot_id: EP64-S09
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊转回头，目光落在林小满脸上。他的眼神里没有"我在告诉你一个事实"的陈述感——而是一种"我终于可以说了"的释然。他接下来要说的话，他可能已经在心里排练了三年——但说出口的时候依然会不自觉地微微停顿，像在确认每一个字都是真的。
  characters:
  - CHAR-003
  dialogue: 然后你说了一句话——很小声，像是说给自己听的。
- shot_id: EP64-S10
  scene_id: SCENE-011
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满听完那番话，站在原地没有动。画上的暖光、他声音里的温度、三年前那个她完全不记得的下午——所有碎片在这一刻拼合在一起，变成了一个完整的形状。她的眼眶迅速地红了——不是难过，是一种被击穿之后的失语。她张了张嘴，想说很多话——"你为什么不说""你等了我多久""这个世界真是你为我造的吗"——但所有的句子都堵在喉咙里，变成了一句最轻的、像叹息一样的呼唤。沈长渊看着她——他见过她在剧本世界里的慌乱、吐槽、崩溃和坚强，但此刻她站在他的画面前，眼眶红红地看着他——不同的，柔软的，没有任何防御的。他向前走了半步——不是靠近，是让自己完全站到她面前。然后他开口了。声音很轻，但每一个字都像钉子一样稳稳地落在空
  characters:
  - CHAR-001
  dialogue: 沈长渊——你从三年前就开始——
- shot_id: EP64-S11
  scene_id: SCENE-011
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 那句"你在哪我就在哪"落下来之后，整个画廊安静了。射灯暖黄的光笼罩着他们——油画的颜料在光线下泛着温润的质感，那个趴在桌上睡着的女孩的背影在画框里沉默地见证着这一刻。林小满站在原地，眼泪无声地滑下来——她甚至没有抬手去擦。她已经说不出话来了。三年——三年前她在那幅古装画前自言自语的一句话，被他听到了。他画了这幅画，造了一个世界，让她的故事活过来——只因为她在三年前随口说了一句"我可以写一百集"。沈长渊看着她——眼眶微红，但没有哭。他抬起手，指尖轻轻帮她擦掉脸颊上的眼泪——动作很轻，像是怕惊醒一幅画里的人。他的嘴角浮起一个弧度——不是古装沈长渊那种"我早就知道"的腹黑笑容，是现实中的他、等了三年
  characters:
  - CHAR-001
  dialogue: 沈长渊——
