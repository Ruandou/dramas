- shot_id: EP58-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 深夜的出租屋，窗外的城市灯火稀疏。林小满（`CHAR-001-L01`）坐在桌前，笔记本电脑（`PROP-001`）屏幕亮着——一个新建的空白文档，第一行是标题「编剧的抉择」，光标在标题下方闪烁。她穿着一件灰色连帽卫衣，低马尾有些松散，几缕头发垂在脸侧。她看着屏幕，目光平静而专注。然后她拿起手机（`PROP-002`），拨了一个号码——屏幕上显示「橙姐」。嘟——嘟——两声后接通了。
  characters:
  - CHAR-001
  dialogue: 橙姐。还没睡？
- shot_id: EP58-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手指已经放在键盘上了——食指搭在F键上，像起跑线上等待发令的运动员。台灯的暖光从侧上方照下来，在她低垂的睫毛下投出淡淡的阴影。她看了一眼手机屏幕——橙姐没有挂电话，也没有说话。沉默了两三秒后，橙姐开口了——声音比平时温柔，带着一个编辑对作者最高的尊重：不催。
  characters:
  - CHAR-001
  dialogue: ……就现在？
- shot_id: EP58-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她开始打字了。手指在键盘上移动，节奏不快但很稳——每个键落下之前都有明确的目标。台灯的光照亮了她的手指和键盘的局部。她的目光在屏幕上移动，嘴唇偶尔轻轻翕动——在读自己刚写下的文字。她打了几行后停下来，声音平稳地念出了她写的场景设定——不是在读给橙姐听，是自己在确认。
  characters:
  - CHAR-001
  dialogue: 场景：两个世界的边界处。左边是燕京古城的暮色——飞檐翘角、暖金余晖。右边是杭州的夜晚——万家灯火、钱塘江大桥的流光。
- shot_id: EP58-S04
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 她敲击回车键的手指停了一下——像是在酝酿下一个画面。她的表情从专注慢慢变成一种奇异的柔和——她在写一个她很在乎的场景。她没注意到的是——当她的手指在键盘上描绘那个边界空间时，她被台灯投在墙上的影子似乎微微波动了一下，像是有风吹过她身后的空气。但她没有察觉，继续打字。
  characters:
  - CHAR-001
  dialogue: 桌面上放着两杯东西——一杯是咖啡，冒着热气。一杯是茶，碧绿的茶汤在瓷杯中轻轻晃动。
- shot_id: EP58-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满打字的节奏变了——比之前慢了，每个键按下去之前都有短暂的停顿，像在选词上花了更多心思。她在写人物。她的目光没有离开屏幕，但她的眼神不是在看文字——是在看人。她写到太妃时，嘴角浮起一个复杂的表情——不是恨，不是怕，是一种理解和心疼。她写到沈长渊时，表情柔和下来——不是甜腻的温柔，是那种"我知道我写得再好也不如他真实"的坦然。
  characters:
  - CHAR-001
  dialogue: 左边坐着太妃。深紫色的宫装，凤镯还在手腕上——但她没有端着。她坐在那里，像一个终于不需要再证明什么的人。
- shot_id: EP58-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 特写林小满的脸。她打到这里的时候，指尖微微颤了一下。不是冷——是情绪碰到了她。她的声音变得更轻了，像是怕太大声会惊动她正在写的那些画面。她低下头，停顿了一下——台灯光线下，可以看到她的睫毛在轻轻颤动。她吸了一口气，继续打字。
  characters:
  - CHAR-001
  dialogue: 她写他们的时候——他们也在那里。不是在她的想象里，是在她写的每一个字里。
- shot_id: EP58-S07
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满没有回答橙姐。她又开始打字了——这一次速度比之前快得多，像是打开了一条语言的河流。她的手指在键盘上飞舞，几乎不需要思考下一个字落在哪里。她的目光紧盯着屏幕，但眼神有点失焦——她不是在看着文字写，她是在看着那个场景，然后把看到的翻译成文字。她写到激动处时，嘴唇开始轻轻跟着念——不是读给自己听，是那些文字自己有声音。
  characters:
  - CHAR-001
  dialogue: 太妃开口了——她说，你知道我为什么一直在阻止你吗？
- shot_id: EP58-S08
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 她的语速越来越快，但声音很稳——像在记一段已经发生的对话。她没有注意到的是——笔记本电脑屏幕的边缘开始泛起一层极淡的暖光。不是台灯反射的光——是从屏幕内部透出来的。很淡，像是屏幕的白色背景温度升高了一点点。她也没注意到——她身后的墙上，她的影子的边缘开始模糊——像是光源不再来自台灯，而是从她面前的屏幕溢出来的。她只注意到文字。那些在指间流淌的文字。
  characters:
  - CHAR-001
  dialogue: 沈长渊说——但我不会走。我在这里等她回来。
- shot_id: EP58-S09
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满继续打字，但速度开始变慢了——不是因为卡壳，是因为屏幕上那层暖光越来越明显，让她不得不眯起眼睛。她一开始以为是屏幕亮度自动调高了——她伸手按了一下键盘上的亮度调节键，但光没有变暗。她皱了皱眉，手指悬在键盘上方。她终于停下了打字——屏幕上的光还在变强，从屏幕中央向外扩散，像一颗温暖的星星正在从电脑内部升起。
  characters:
  - CHAR-001
  dialogue: 嗯？屏幕——
- shot_id: EP58-S10
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 暖光越来越亮。不是刺眼的白光——是一种温暖的、带着淡金色的柔光，从笔记本电脑的屏幕中倾泻出来，照在林小满的脸上、手上、衣服上。和EP01第一次穿越时一模一样的光——但那次她害怕，她往后躲，她不知道发生了什么。这一次——她只是看着。她看着那些光像温水一样从屏幕中蔓延出来，流过她放在键盘边缘的手指。她感觉到了温度——不是烫，是那种"欢迎"的温度。她的瞳孔在光中微微收缩——不是因为恐惧，是因为光太亮了。但她没有后退。
  characters:
  - CHAR-001
  dialogue: 来了。
- shot_id: EP58-S11
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 暖光已经照亮了林小满的半张脸——从屏幕方向照过来的光在她的瞳孔里映出温暖的金色。她慢慢地、缓缓地露出一个笑容——不是得意，不是兴奋，是一个人在面对一个她等了好久终于到来的时刻时，发自心底的释然的笑。她想起了第一次穿越——咖啡打翻、电脑冒火花、她吓得往后一缩。现在她坐在这里，光从她写的文字中漫出来——而她不想逃。
  characters:
  - CHAR-001
  dialogue: 和上次一样。
- shot_id: EP58-S12
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 特写她的眼睛。暖光在她眼底流动，像金色的水波。她的目光落在屏幕上——那里有一行她刚刚写下的文字。她没念出来，但那行字观众能猜到了：「我不会走。我会一直写下去。」她看着那行字，然后伸手——不是去关电脑，不是去合上盖子，不是往后退。她的手伸向屏幕，指尖离发光的表面越来越近。她的声音轻得像叹息，但坚定得像誓言。
  characters:
  - CHAR-001
  dialogue: 但这一次——不一样。
- shot_id: EP58-S13
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手指已经触到屏幕的边缘了。暖光像有温度一样包裹着她的指尖，从接触的那一点开始泛起一圈柔和的光晕——像石子投入水面时泛起的涟漪。她没有回头看——但她知道她身后是她的出租屋，她的床，她堆满书的桌子，她生活了三年的地方。她也知道——她还会回来的。光沿着她的手指向上蔓延，像温暖的潮水覆盖了她的手腕。她的表情很平静——甚至带着一丝满足。
  characters:
  - CHAR-001
  dialogue: 橙姐——
- shot_id: EP58-S14
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 光继续蔓延——从她的手指到手掌，从手掌到小臂，像一条温暖的河流正在缓缓淹没她。她整个人在暖光中变得朦胧——轮廓开始模糊，像是她正在从一个实体变成一个光中的影子。出租屋的台灯依旧亮着，手机屏幕上的通话计时还在跳动——但那个坐在电脑前的人，正在变得越来越淡。她最后看了一眼这个世界——然后闭上了眼睛。不是害怕地闭眼——是一个人在踏入一扇她等了很久的门时，自然地闭上了眼睛。下一瞬间——出租屋空了。椅子还在微微晃动——像是有人刚刚站起来走了出去。笔记本电脑屏幕还亮着，暖光逐渐消散。桌面上，手机屏幕显示：通话中——00:00:00。橙姐的声音从听筒里传出来，越来越远——
  characters:
  - CHAR-001
  dialogue: 等我回来。
- shot_id: EP58-S15
  scene_id: SCENE-001
  duration_sec: 5
  camera: t2v 固定镜头
  content: 空镜——林小满的出租屋，深夜。台灯还亮着，笔记本电脑的屏幕也还亮着——但椅子已经空了。一扇窗户半开着，夜风吹进来，吹动了桌上散落的纸张边缘——其中一张纸微微掀起一角，又落下了。手机屏幕（`PROP-002`）还亮着——通话界面显示「橙姐」，通话时长：00:00:42。橙姐的声音还在从听筒里传出来，带着焦急和不敢相信——然后，通话变成了忙音。嘟——嘟——嘟——
  characters: []
  dialogue: 小满？！小满！你说话！——喂？！小满——！！
- shot_id: EP58-S16
  scene_id: SCENE-014
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 画面切换——两个世界的边界（SCENE-014）。一张木桌，两把椅子——左边是古风扶手椅，右边是现代简约椅。桌面上一杯咖啡冒着热气，一杯茶碧绿清亮。太妃（`CHAR-005-L01`）坐在左边——深紫色宫装，手腕上的凤镯在柔和的光线下微微反光。沈长渊·古装（`CHAR-002-L01`）坐在右边——玄色锦袍，姿态从容。桌子中间空着一个位置——没有椅子，但那里有一束光，从上方柔和地洒下来。光中——一个身影正在凝聚。淡紫色襦裙的裙摆先出现——然后是一双穿着绣鞋的脚踩在了实地上。光向上收束，露出了林小满的脸（`CHAR-001-L02`）。她缓缓睁开了眼睛。太妃看着她，嘴角缓缓上扬——不是一个反派的
  characters:
  - CHAR-001
  dialogue: 我来了。
