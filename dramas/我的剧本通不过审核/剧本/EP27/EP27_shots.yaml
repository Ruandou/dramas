  camera: i2v_ref 固定镜头
  content: 深夜的侯府书房。烛火在铜灯盏中跳动，在墙上投下晃动的影子。桌上一片凌乱——摊开的日记翻到最后一页，"不要让钥匙开门"几个字在烛光中清晰可见。旁边是那张照片——两个人的合照，其中一个人的脸被涂黑了。林小满坐在书案前，面前铺着一张宣纸，纸上写了三行字——每一行都被一条墨线用力划掉了。她的笔还握在手里，笔尖的墨已经干在纸上。她看着那张被涂黑的照片——想从中看出什么——但什么都分辨不出来。她把笔放下，用手掌按住了额头——不是哭，是一种疲惫到极致的静止。她需要一个人待着——但她不需要一个人。这种矛盾的感受让她更加沉默。
  characters:
  - CHAR-001
  dialogue: 日记说不要开门——门后什么都没有——但太妃在阻止钥匙觉醒——神秘人像他又不是他——每一句都在说'别查了'——但每一句都在说'你还没查完'……
- shot_id: EP27-S02
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 门无声地开了——没有敲门。沈长渊站在门口，夜风从他身后灌进来，吹动了桌上的宣纸边角。他没有立刻走进来——他只是站在那里，看着林小满。他的表情很复杂——不是他惯常的冷淡或倨傲——是一种他从没在她面前展示过的表情：他在担心她。林小满听到门声抬起头，看到是他，下意识地坐直了一点——然后想起自己现在的状态被看到了，又垂下眼。她试图挤出一个笑——但没有成功。沈长渊没有问她"怎么了"——他只是看着她右手捏着袖口的那个小动作。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你——你怎么来了？
- shot_id: EP27-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头跟随他移动
  content: 沈长渊没有走。他走进来——但不是走向椅子，也不是走向书案。他走到林小满身边——然后坐了下来。不是坐在她旁边的椅子上——是坐在地板上。背靠着书案的侧面，双腿随意伸展——这个姿势太不像"沈长渊"了。长安侯世子——从来不会坐地板。他坐下之后没有看她，也没有说话——就像他只是来坐一会儿的。夜风从半开的窗吹进来，烛火晃了晃。他坐在那里，侧脸的线条在烛光中柔和了一些。不说话——但他在。
  characters:
  - CHAR-002
  dialogue: 你——你坐地上干什么——
- shot_id: EP27-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满低头看着他坐在地板上的侧影。她张了张嘴——想说什么——又闭上了。这不是她写的"沈长渊"。她写他时从未写过他坐地板、从未写过他在深夜走进一个正在崩溃的人的房间然后安静地坐在旁边。她的剧本里——他是一个语言锋利、姿态倨傲的世子。但此刻坐在她脚边的这个人——和那个角色有着同一张脸、同一种声线——但他做出了不属于剧本的行为。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 这不是你会做的事。你从来没——坐过地板。
- shot_id: EP27-S05
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 沉默。很长很长的沉默。烛火在灯盏里跳动，影子在墙上缓慢移动。沈长渊坐在地板上，林小满坐在椅子上——一高一低的两个人，谁都没有说话。但这种沉默不是尴尬——它是一种奇怪的共处——他不催她说话，不劝她别难过——他只是坐在这里。过了很久——可能是几十秒——也可能是几分钟（在这个没有时间的深夜，时间失去了刻度）——他终于开口了。他的声音很平——不是那种"让我来安慰你"的语气——而是诚实的、不修饰的陈述。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你不需要假装没事。
- shot_id: EP27-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊的侧脸。他看着前方——不是看着林小满，而是看着桌上的烛火。他的表情很专注——不是在看火——而是在感受什么。一种他最近才开始拥有的感知能力——他能感觉到身边那个人的情绪状态，像潮汐一样，不需要她开口说一个字。
  characters:
  - CHAR-002
  dialogue: 你今天在书房的时候——我感觉到了一件事。
- shot_id: EP27-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满抬起头看他——她的表情不是惊讶——而是困惑和警觉混合在一起的感觉。他说他"感觉到了"——不是"看到了"哭红的眼睛——是"感觉到了"情绪本身。她放下按在额头上的手，认真地看着他。沈长渊仍然没有转头看她——他说话的方式像是在读一件发生在自己身上的陌生事。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你的情绪——像潮水一样——涌过来。
- shot_id: EP27-S08
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 沈长渊坐在地板上，背部靠着一侧书案的木腿。他的目光垂落在地面某处——不是在回避她的目光，而是在组织语言。他从来没有想过自己会说出这样的话——一个纸片人——对自己说"我的行为不是剧本写给我的"。他是第一个意识到这件事的角色。不是太妃那种"我知道我是纸片人"的意识——而是一种更深的觉醒：他不仅在剧本里有独立意识——他还在剧本之外创造新的行为。
  characters:
  - CHAR-002
  dialogue: 我刚才在这里坐了一会儿——想了一件事。
- shot_id: EP27-S09
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满完全愣住了。她看着他——眼泪从眼眶里溢出来——但她没有擦。不是因为他说的话让她感动——是因为他说的话让她意识到：他不是她写的那个角色了。他是真的。他在学习。在成长。在变成某个——连她都不知道该怎么命名的事物。她动了动嘴唇——想说什么——但声音被哽咽堵住了。就在这时——沈长渊做了另一个"剧本里没有写"的事。他伸出手——握住了她的手。不是剧本里那种"为了推进感情线而拉手"——而是一种选择：一种他不确定该怎么做但觉得应该做的选择。他的手指覆在她的手背上——很轻——像在试探这个动作是否被允许。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你在剧本外——学会安慰人了——
- shot_id: EP27-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 烛火晃了晃。林小满没有问"什么事"——她没有追问。因为她低头看到了他握住她的手——那只看似冷淡的、从不会主动触碰任何人的手——此刻正握着她的。她也没有回答。但她回握了他的手——很轻——但确实是一个回应。沈长渊感觉到了——他的眉毛微微动了一下——不是惊讶——是一种确认。夜风从半开的窗吹进来，烛火灭了。月光取而代之，照在两人身上——银白色的、柔和的光，把他们的轮廓镀上一层安静的冷光。画面定格在这无声的瞬间——他没有回答她的问题，但握紧的手给出了答案。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ——什么事？
