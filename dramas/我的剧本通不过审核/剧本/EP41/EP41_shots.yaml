- shot_id: EP41-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 午后的出租屋。阳光透过半开的窗帘斜射进来，在木地板上拉出一道温润的光带。林小满坐在床边，手里拿着一个牛皮纸信封——就是EP31老人给她的那个。阳光照亮了信封正面用瘦硬字迹写的"第42天打开"五个字。她的拇指在字迹上轻轻摩挲了一下——不是犹豫，是在确认这一刻真的来了。
  characters:
  - CHAR-001
  dialogue: 第42天……到了。
- shot_id: EP41-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她撕开封口——轻微撕裂声在安静的房间中格外清晰。倒转信封——一把铜质复古钥匙滑落在她摊开的手掌上。钥匙柄上蚀刻着"07"两个数字。紧接着一张叠好的纸条落下来。她放下钥匙，展开纸条。纸条上的字和信封上一样——瘦硬有力。她的目光快速扫过，读到某一行时——停住了。
  characters:
  - CHAR-001
  dialogue: 这把钥匙开公寓楼下07号储物柜……柜子里是我存在那里的东西——是我为你写的剧本。
- shot_id: EP41-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满拿着纸条的手微微发抖。她重新看了一遍那句话——"这个世界是为你造的"——七个字像七颗石子沉入深水。窗外的午后阳光照在她脸上，但她的表情不是明亮——是被信息击中后的空白。她的嘴唇微张，但没有发出声音。她低头看着手心里的钥匙——铜质钥匙在阳光下泛着温润的光。
  characters:
  - CHAR-001
  dialogue: ——他造的。——不是剧本——是整个世界。
- shot_id: EP41-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她攥紧钥匙——冰凉的金属触感让她定了定神。然后站起来，把纸条折好放进口袋。她拿起桌上的手机——不是储物柜里那部，是她自己的。犹豫了一秒——拨出了一个号码。她把手机贴到耳边，等待接通。
  characters:
  - CHAR-001
  dialogue: 我得先确认一件事——
- shot_id: EP41-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满一边打电话一边快步走出房间，穿过走廊。走廊光线比房间暗，她的脚步声在旧木地板上发出有节奏的轻响。阳光从走廊尽头的窗户斜射进来。她手里攥着那把钥匙，手机夹在耳朵和肩膀之间。
  characters:
  - CHAR-001
  dialogue: 橙姐——我问你个事儿。
- shot_id: EP41-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满在楼梯口站住了。她握着手机的手垂下来了一点——橙姐的话只是确认了她已经知道的事，但"确认"本身有一种沉重的力量。她沉默了两秒。楼梯间很安静，只有日光灯管的嗡嗡声。
  characters:
  - CHAR-001
  dialogue: 他是什么时候把这间房租给我的？
- shot_id: EP41-S07
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 林小满已经挂了电话，站在一楼储物柜区域。一面灰色墙面上嵌着两排深灰色金属储物柜，共十几个。头顶一盏白色日光灯管发出低频的嗡嗡声，光线冷白清冽，和楼上房间的暖黄形成鲜明对比。她找到了07号柜——柜门的金属铭牌"07"在冷光下微微反光。她握着钥匙的手举起来——对准锁孔。
  characters:
  - CHAR-001
  dialogue: 如果里面什么都没有——
- shot_id: EP41-S08
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 钥匙转动——咔哒一声，锁舌弹开。柜门弹开一条缝。冷白色的日光灯光照进柜内。柜子不深——底部静静躺着一个物体：一部老款的黑色智能手机，哑光磨砂机身，边角有磕碰痕迹，充电口附近有明显的磨损。
  characters:
  - CHAR-001
  dialogue: ——手机？
- shot_id: EP41-S09
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 缓推
  content: 她伸手拿出手机——外壳冰凉，比想象中轻。用拇指按了一下侧边的电源键——屏幕缓缓亮起。没有锁屏界面，直接显示在短信应用的草稿箱。一条未发送的草稿消息占据着屏幕。屏幕的蓝白光映在她脸上，照亮了她瞳孔中收缩的细微变化。
  characters:
  - CHAR-001
  dialogue: 小满——等你看到这条消息的时候——我已经在两个世界的夹缝里了。
- shot_id: EP41-S10
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 林小满拿着手机的手放了下来。她站在储物柜前，半晌没有动。冷白色的日光灯照在她脸上，她的表情从震惊慢慢变成一种复杂的、说不清的痛——像被什么东西击中了胸口正中。屏幕的光在她眼底闪烁，她闭上眼——试图消化这个信息：沈长渊在夹缝里。他不是消失了——他是被困住了。他在两个世界的缝隙里。手机屏幕上那几行字在她脑海中反复浮现。
  characters:
  - CHAR-001
  dialogue: ——夹缝里。——他一直在夹缝里。——从什么时候开始的？
- shot_id: EP41-S11
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满还沉浸在情绪中——突然，她手心里的手机震动了。不是普通的短信提示——是来电。老式手机的经典铃声在安静的储物柜区域里尖锐地响起。她的手腕猛地一抖——差点没拿住。屏幕切换到来电界面——上面显示着两个字：「沈长渊」。没有头像，没有归属地——就是那两个字。她的瞳孔骤然收缩。她没有立刻接——盯着那个名字看了两秒。呼吸在那一瞬间停住了。
  characters:
  - CHAR-001
  dialogue: 沈长渊？——怎么会——
- shot_id: EP41-S12
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 缓推→固定
  content: 听筒里传来的声音——低沉、有磁性、带着一层遥远的回音和断断续续的电流杂音。是古装沈长渊的声音——那个她再熟悉不过的、在剧本世界里叫她"林编剧"的人。但他的语气很陌生——不再是笃定冷静的，而是带着茫然和不确定，甚至一丝从未有过的不安。林小满抓着手机的手指关节发白。她的表情从紧张变成了无法理解——他怎么会有这个号码？他怎么在电话里？储物柜的冷白光照着她半张脸，另半张隐在阴影中。
  characters:
  - CHAR-001
  dialogue: 林小满？
