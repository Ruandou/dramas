  content: 午后的画廊，阳光从高处的天窗斜洒下来，在白色墙上投下柔和的光影。画廊里很安静，只有远处轻柔的环境音乐。沈长渊走在前面，步伐比平时慢一些——他穿着一件米白色亚麻衬衫，外搭浅驼色亚麻西装外套，银色细框眼镜在光线下微微反光。他走到画廊最深处那面墙前——停住了。墙上挂着一幅被布盖着的画。他回头看了一眼林小满——目光里带着一种"就是这里"的意味。林小满站在几步之外，穿着一件浅蓝色衬衫，外搭一件米白色薄开衫——约会装扮，比平时的卫衣正式一点。她看着那幅盖着布的画，又看沈长渊——嘴角带着一个"你要干嘛"的、带着笑意的疑惑。
  characters:
  - CHAR-001
  dialogue: 就是这里。
- shot_id: EP69-S02
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊站在画前，没有立刻拉开画布。他低着头看着那幅被遮住的画框底部——像在看一个时间胶囊。他深吸了一口气——然后开始讲述那天的事。声音很平静，但说到"我就在你身后"时，他的语速慢了一拍——因为那个画面在他脑海里存了三年，今天终于能说出来。他说到林小满当时的原话时——嘴角不自觉地浮起了一个笑意——不是"回忆一个有趣的片段"，是一个人回忆"第一次心动"时的那种不自觉的柔软。
  characters:
  - CHAR-003
  dialogue: 那天——也是下午——阳光也是这样从上面照下来——
- shot_id: EP69-S03
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在几步之外——听到沈长渊重复她三年前说过的话时，她愣住了。不是那种"你居然记得"的惊讶——是一种"原来那天他就在我身后"的震撼。她微微张了张嘴——想说什么，但没说出来。她的目光从沈长渊脸上移到那幅被盖着的画上——又移回来。她的表情在几秒内变了好几种颜色——先是愣住，然后是一种"天哪"的了然，最后嘴角开始不受控制地上扬——像是回忆起了那天的场景，然后意识到她当时完全没注意到身后有人。
  characters:
  - CHAR-001
  dialogue: 那天——你就在我身后？
- shot_id: EP69-S04
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在画前——听到沈长渊说"一动都不敢动"时，她嘴角的笑意更深了。她微微歪了歪头——问出了那个最关键的问题。语气带着一种"我已经猜到答案但我想听你说出来"的、带着笑意的好奇。沈长渊听到这个问题——他低头笑了一下——那个笑容里有一种"你果然会问这个"的、被看穿的了然。然后他说出了答案——语气很轻，像是在说一件微不足道的小事——但那种轻，恰恰是这件事最可爱的地方。
  characters:
  - CHAR-001
  dialogue: 那——为什么没说？
- shot_id: EP69-S05
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊说出答案的那一瞬间——林小满愣住了。不是被震撼的愣——是被"这个答案也太沈长渊了"击中的愣。她愣了一秒——然后笑了出来。不是礼貌的微笑——是真的被逗笑的、带着惊讶和"原来是这样"的大笑。她笑起来的时候眼睛弯弯的，整个人从刚才的微微紧张里彻底放松了下来。沈长渊看到她笑——他先是不好意思地摸了摸后脑勺——然后也跟着笑了起来。画廊午后的阳光下——两个人面对面站着，一起笑着——那个画面里没有"霸道总裁"，没有"完美男主"——只有一个社恐终于说出心里话后的轻松，和一个女孩被这个答案可爱到的开心。
  characters:
  - CHAR-001
  dialogue: 因为我社恐。
- shot_id: EP69-S06
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊笑着——然后他转过身，面对那幅被布盖着的画。他伸手——轻轻拉住了画布的一角。他没有立刻拉开——手指在布边停了一下。然后他侧过头——看向林小满——目光里带着一种"准备好了吗"的温柔确认。林小满站在他身边——微微点了点头。沈长渊轻轻拉开幕布——画布滑落，露出画框里的内容。那是一幅布面油画——暖色调的画面上，一个女孩趴在电脑前睡着的背影，窗外是杭州的夜色，远处有星星点点的城市灯火。画的右下角——有一行小字，写着日期：三年前的——那天。（`PROP-011`）
  characters:
  - CHAR-003
  dialogue: 那天晚上——我回家画了一幅画。
- shot_id: EP69-S07
  scene_id: SCENE-011
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在画前——没有动。她看着那幅画——画里的背影是她自己——趴在电脑前睡着的背影——那是三年前某个熬夜写稿的夜晚，她不知道，有人在窗外隔着夜色画下了她。她的眼眶慢慢泛红——不是因为难过——是因为"三年前有人在你不知道的时候，把你画进了他的世界里"的那种、铺天盖地的温柔。她没有说话——只是看着那幅画——眼睛亮亮的，嘴唇微微动着，像是在心里咀嚼着某种太满、太多、太重的情绪。
  characters:
  - CHAR-001
  dialogue: 三年前——你就在——
- shot_id: EP69-S08
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 镜头跟随
  content: 傍晚的杭州街道——暖黄色的路灯刚刚亮起，天空是一种温柔的蓝紫色。街道两旁的店铺亮起招牌灯，行人三三两两地走过。林小满和沈长渊并肩走在街上——没有牵手，但两个人的距离很近，肩膀偶尔轻轻地碰到一起。沈长渊的手里拿着一个画框袋（装着那幅画），林小满两手插在外套口袋里——两个人之间有一种安静而舒服的氛围。走了一段路之后，林小满停下脚步——目光落在公寓楼下临街的一个新门面上。她微微偏头——表情从放松变成了困惑——那个门面，她以前从没注意过。
  characters:
  - CHAR-001
  dialogue: 嗯？这里以前——有这个店吗？
- shot_id: EP69-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满走近那个新门面——她的脚步越来越慢，最后完全停下来。面前是一家装修精致的小茶馆——门面是很温暖的暖杏色，木质的推拉门，门口挂着一串小小的红灯笼。招牌用的是古风字体——写着"太妃茶馆"四个字——然后下面有一行稍小的字："杭州分店"。林小满站在门口——表情像见了鬼。她转头看沈长渊——又转头看招牌——又转头看沈长渊——嘴唇微微张着，一个字都说不出来。茶馆里透出暖黄色的灯光，有淡淡的茶香飘出来——一切都是真实存在的。
  characters:
  - CHAR-001
  dialogue: ——太妃茶馆。
- shot_id: EP69-S10
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在茶馆门口——她的大脑正在以肉眼可见的速度处理这个信息。她的手伸进口袋——摸出手机（`PROP-002`）——就在她拿出手机的那一瞬间，手机震动了。屏幕上弹出一条微信消息——发件人：太妃——不是古装世界的太妃，是现实世界通讯录里的"太妃娘娘"——头像是一杯茶。她盯着屏幕上的消息预览——表情从困惑变成震惊，又从震惊变成一种"这个世界的边界到底在哪里"的恍惚。
  characters:
  - CHAR-001
  dialogue: 等等——
- shot_id: EP69-S11
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满站在茶馆门口——没有立刻点开语音。她看着手机屏幕——又抬头看了一眼茶馆招牌——又低头看手机——那种"现实和虚构在眼前握手"的表情，大概是她这辈子最复杂的表情之一。她深吸一口气——点开了语音。太妃的声音从手机里传出来——是蜕变后那个温暖、从容的声音——带着一种"你看我厉害吧"的得意和"这一切都是真的"的喜悦。林小满听完语音——站在原地——愣了两秒。然后她的嘴角开始上扬——越扬越高——最后她笑了出来——不是苦笑，不是恍惚的笑——是"这也太离谱了但这居然是真的"的、带着开心的笑。她转头看向沈长渊——手机还举在耳边——声音里带着一种被魔幻现实击中的余韵。
  characters:
  - CHAR-001
  dialogue: 惊喜吗？——苏晚晴帮我开的加盟店。
- shot_id: EP69-S12
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满收起手机——站在茶馆门口，透过木框玻璃窗往里看。茶馆里有几桌客人——穿着现代衣服的人，坐在竹椅上喝茶——一切都很正常，就像一家普通的茶馆。但不普通的是——柜台后面挂着一幅字，是林小满熟悉的笔迹——太妃自己写的"七个编剧和我"。林小满看着那幅字——然后轻轻笑了。沈长渊站在她身边——他没有问"这到底怎么回事"——他只是安静地站在那里，和她一起看着这个剧本世界延伸到现实的第一家店。林小满拿出手机——给太妃回了一条语音——然后抬起头，看着暖杏色的招牌在傍晚的暮色里亮起温暖的灯光。她突然觉得——这个世界比她想象的还要大。大到一个写出来的故事——可以真的在现实中开一家店。
  characters:
  - CHAR-001
  dialogue: 她们——真的来了。
