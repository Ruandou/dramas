- shot_id: EP57-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 夜晚的出租屋，书桌上方的暖黄台灯是唯一光源。林小满（`CHAR-001-L01`）穿着宽松的灰色连帽卫衣，低马尾松松地扎着，几缕碎发垂在额前。她面前的银色笔记本电脑（`PROP-001`）屏幕亮着——桌面是空白的文件夹。她的手指没有放在键盘上，而是交叉着搁在桌上，像是在等一个信号。旁边放着一杯已经凉了的茶，杯沿有半圈茶渍。手机（`PROP-002`）屏幕朝上放在桌角。安静中，手机突然震动起来——屏幕亮起，来电显示：「橙姐」。林小满看了一眼，没有急着接。她深吸一口气，然后拿起手机，滑开接听。
  characters:
  - CHAR-001
  dialogue: 喂，橙姐。
- shot_id: EP57-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把手机放到桌上，开了免提。她的目光落在空白的屏幕上——Word文档的新建页面，光标一闪一闪。她的声音很平静——不是那种被逼到绝路的平静，是真的做好了准备的平静。电话那头的橙姐顿了一下——她听出了林小满语气里的不同。
  characters:
  - CHAR-001
  dialogue: 我在写。现在。
- shot_id: EP57-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 特写林小满的脸。台灯的暖光从侧面照着她，在她脸上投下柔和的阴影。她微微低着头，目光落在屏幕上——不是在看键盘，是在看那个空白的页面。她开口说话时声音很轻——不是没底气，是这一刻她不需要大声来证明什么。她和橙姐说的时候，手指轻轻搭在触摸板上，像是在——确认自己真的要开始了。
  characters:
  - CHAR-001
  dialogue: 不是改第十五版。不是给太妃加戏份。不是给苏晚晴写番外。
- shot_id: EP57-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 画面切到橙姐的样子（通过手机视频或想象）。她坐在出版社办公室里，面前摊着一堆稿件，手里的笔停住了。她摘下老花镜——推了推鼻梁——这是一个"让我认真听你说"的姿势。她的语气从"催稿编辑"切换到了"认真听你讲故事的人"。
  characters:
  - CHAR-008
  dialogue: 小满——你从来没说过要'从头写'。
- shot_id: EP57-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手指放到了键盘上。右手食指悬在J键上方，左手放在ASDF区域——一个习惯性的打字预备姿势。她深吸一口气——不是紧张的深呼吸，是那种"好，开始吧"的深呼吸。然后她开始打字。台灯的光照亮了她的指尖——每一个按键按下时手指微微的颤动都清晰可见。她的目光专注在屏幕上——不是在看键盘。
  characters:
  - CHAR-001
  dialogue: ……你打字了。标题是什么？
- shot_id: EP57-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 大特写笔记本电脑屏幕的一角（从侧面拍摄，不显示完整内容以防文字臆造）。台灯的暖光在屏幕表面形成柔和的反光。林小满的手指在键盘上敲击——每一个键按下时发出清脆的咔哒声。屏幕上隐约可见一行文字横跨页面上方，光标停在行末闪烁。她的指甲修剪得很短——是一个常打字的人的手。打完标题后，她的手指停了一秒，然后轻轻按下了回车键。光标跳到下一行——她开始写正文。
  characters:
  - CHAR-001
  dialogue: 她没逃——这是第一句。
- shot_id: EP57-S07
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满打字的速度越来越快。她的目光在屏幕上游走，表情随着文字内容变化——读到某些段落时她会微微皱眉，写到温暖的场景时嘴角会不自觉上扬。台灯把她的影子投在身后的墙上，随着她的动作轻轻晃动。手机开着免提躺在桌角——橙姐没有挂断，也没有说话，只是在听——听着键盘声和偶尔的呼吸声，像在听一首很久没听到的曲子。
  characters:
  - CHAR-001
  dialogue: 她以为她会逃。删掉文档、关掉电脑、假装这一切没发生过。
- shot_id: EP57-S08
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 特写林小满的眼睛。台灯的光在她瞳孔里映出一个小亮点。她的目光在屏幕上来回移动——不是在读自己写下的文字，是在回忆。回忆那些画面：金銮殿上沈长渊冷着脸说"又来了一个编剧"；翠微第一次拉着她说"小姐你可算来了"；太妃坐在枣树下捧着靛蓝色的手稿笑着说"完整了"。她的眼眶有一点红，但她没有停——手指继续在键盘上飞舞。
  characters:
  - CHAR-001
  dialogue: 她见过一个丫鬟用平板电脑记账。见过一个小皇帝戴着耳机批奏折。见过一个'反派'坐在树下写她自己的故事。
- shot_id: EP57-S09
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的手从键盘上移开，端起桌上那杯凉茶喝了一口。茶已经凉透了，但她没有皱眉——像是根本没注意温度。她靠在椅背上，目光没有离开屏幕。房间里只有台灯的暖光、键盘的余温、和手机里橙姐安静的呼吸声。她沉默了几秒——不是卡壳，是在感受自己刚刚写下的那些文字。
  characters:
  - CHAR-001
  dialogue: 你写得怎么样？
- shot_id: EP57-S10
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 她把茶杯放回桌上，重新把手放回键盘上。她的手指没有立刻开始打字——只是搭在键帽上，感受着指尖下那些小小的凹痕。她看着屏幕上自己写的文字——虽然剧情是她写的，但读起来有一种陌生的亲切感，像是另一个人写的，又像是最真实的自己。她的声音变得很轻——不是虚弱，是一个人面对自己内心最柔软的部分时，不自觉地放低了声音。
  characters:
  - CHAR-001
  dialogue: 我写了一个编剧——她没有逃跑，没有删稿，没有放弃。
- shot_id: EP57-S11
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把最后一句话打完了。她的手指停在键盘上——不是悬着，是轻轻搭在空格键上。她看着屏幕，把刚刚写下的最后一段通读了一遍。读完的瞬间——她没有按任何键，没有碰触摸板——屏幕上的光标自己移动了。它从段落的末尾跳到了下一行，停住了。林小满眨了眨眼——以为是错觉。然后光标开始自己闪烁——一明一灭——像在呼吸。她坐直了身体，手指离开了键盘。
  characters:
  - CHAR-001
  dialogue: ……嗯？
- shot_id: EP57-S12
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 大特写屏幕（角度依然避免完整显示文字以防AI臆造）。光标在下一行闪烁了三秒。然后——文字开始自动出现。不是她打的。不是键盘输入的声音。是一个字一个字地、像有人在另一个世界用键盘敲出来一样，一行字缓缓出现在屏幕上。林小满的瞳孔微微放大——她没有伸手去碰屏幕，只是看着。那行字在台灯的暖光下荧荧发亮，出现在她已经写好的最后一段下面——隔了一行空白，像是某种正式的落款。
  characters:
  - CHAR-001
  dialogue: 这——
- shot_id: EP57-S13
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手从键盘上滑落下来，垂在身侧。她的眼眶已经红了——不是悲伤的哭，是一个人被深深理解之后的那种控制不住的触动。她张了张嘴想说什么，但声音堵在喉咙里。她看着屏幕上那行字——那些字没有消失，静静地停在文档里，像是真的有一群人在另一个世界，一起写下了这句话。她用手背碰了一下眼角——手背湿了。她深吸一口气，声音终于出来了——沙哑的、带着哭腔的、但带着笑意的。
  characters:
  - CHAR-001
  dialogue: 他们看到了……
- shot_id: EP57-S14
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满低下头，双手捂住脸——肩膀轻轻抖动着。她在哭——但这不是崩溃，是释放。几个月的压力、穿越、被角色怼、写结局、改写、失去又找回——所有的情绪在这一刻找到了出口。几秒后，她放下手，擦了擦脸，眼眶红红的，但嘴角带着笑。她拿起手机，声音还在发颤，但语气已经恢复了。
  characters:
  - CHAR-001
  dialogue: 橙姐——你听到没有——他们跟我说谢谢。
- shot_id: EP57-S15
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满靠在椅背上，目光落在屏幕上那行感谢的文字上。她看了很久——久到那一行字像刻进了视网膜。然后她伸手，轻轻触碰了一下屏幕——指尖碰到"全体角色敬上"那几个字的位置。屏幕上没有反应——但她的心里有了回应。她收回手，用指背擦了擦屏幕上可能沾到的指纹，动作轻柔得像在抚摸一件珍贵的东西。然后把手指重新放回键盘上。
  characters:
  - CHAR-001
  dialogue: 还没有完。
- shot_id: EP57-S16
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的目光落在屏幕右下角——文档的字数统计在闪烁。她没有回答橙姐，而是移动鼠标，点击了菜单。"新建文档"——一个新的空白页面弹出来。她开始打字——一个标题出现在新文档的第一行。她没有念出来，但她的嘴唇轻轻动了动——像是在对自己说。台灯光照在她的侧脸上，她的表情不是疲惫，是"准备好了"。她打完标题的那一刻，光标在下面闪烁——像一个等待她跳进去的入口。
  characters:
  - CHAR-001
  dialogue: 还差最后一章——《编剧的抉择》。
