- shot_id: EP53-S01
  scene_id: SCENE-013
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 暮色更深了，天际线只剩一道暗紫色的光带。城墙上的风吹动林小满的淡紫色襦裙裙摆和鬓边碎发。她站在沈长渊面前，两人之间隔着两步的距离。沈长渊保持着问出那个问题后的姿态——没有催促，只是安静地等。她看着他狭长的凤眼，那双眼里没有追问的压力，只有一种沉稳的、毫无保留的信任——好像不管她说什么他都会接受。林小满深吸了一口气，然后开口了——声音比她自己预想的更平静。
  characters:
  - CHAR-001
  dialogue: 你的问题——我听见了。但我需要先找到答案。
- shot_id: EP53-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满穿着灰色卫衣（`CHAR-001-L01`）在出租屋里来回踱步。桌上的台灯亮着暖黄光，剧本手稿（`PROP-003`）散落在桌面上——有的翻开，有的合着，边角卷起，咖啡渍晕染。笔记本电脑（`PROP-001`）开着，屏幕已经进入待机状态。她走过去拿起一张稿纸，看了两眼又放下；拿起另一张，又放下——烦躁不安，找不到想要的东西。
  characters:
  - CHAR-001
  dialogue: 故事和人……这根本不是选择题。
- shot_id: EP53-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她随手翻了翻面前那沓厚厚的剧本手稿——页面之间突然露出一个小小的灰色边缘。她的手停住了。那是一个U盘的角——被夹在剧本手稿的中间页里，平整地卡在纸页之间，像是被刻意放进去的。她缓缓抽出那个U盘——灰色外壳，没有任何标签或标记，干干净净。她不记得自己什么时候放过这种东西在稿纸里。她翻来覆去地看了几遍——完全陌生的东西。
  characters:
  - CHAR-001
  dialogue: 这是——
- shot_id: EP53-S04
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 林小满坐到电脑前，将U盘插入USB口。屏幕上弹出一个文件夹窗口——里面只有一个视频文件，文件名写着「给第7个编剧」。她的手指悬在鼠标上，停了一秒。然后点开。视频播放器打开——先是一阵短暂的雪花噪点，然后画面稳定下来。屏幕里是一个和她的房间完全不同的空间——更空旷，墙上堆满了书，几乎像一座小型图书馆。一个中年男人坐在书堆中间，对着镜头微笑。他大约四十多岁，头发有些乱，穿着一件洗得发白的深蓝衬衫。他的脸很普通，但眼神清澈温柔，眼角细密的笑纹像刻上去的。电脑的光映在林小满的脸上，她的呼吸轻了一拍。
  characters:
  - CHAR-001
  dialogue: 给第7个编剧……
- shot_id: EP53-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 视频继续播放。第1个编剧向前倾了倾身子，表情从微笑变认真。他双手交叉放在膝盖上，眼神透过镜头直直地看过来——好像能隔着屏幕看到林小满此刻的表情。他说话的速度很慢，每一个字都像想了很久才说出口。屏幕的光映在林小满的瞳孔里，她一动不动。
  characters:
  - CHAR-001
  dialogue: 接下来的事——只有你自己能决定。
- shot_id: EP53-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧说到"人"这个字时，他身后的书堆在昏黄灯光下显得格外温暖。屏幕的光映在林小满的脸上，她的眼神微微震动——不是惊讶，而是一种被击中的感觉。他继续说下去，声音里有一种奇异的笃定——不是炫耀，而是一种完成了使命的释然。然后他停顿下来，把问题抛了回来。
  characters:
  - CHAR-001
  dialogue: 所以我造了这个世界的理由——不是要写一个好故事——是让里面的人活过来。
- shot_id: EP53-S07
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 视频播放结束。屏幕变暗。林小满深吸一口气，拿起手机（`PROP-002`），翻到橙姐的号码。凌晨两点——她犹豫了一下，还是拨了出去。响了四声，对面接通了，橙姐的声音带着被吵醒的沙哑但意外的清醒——像是她本来也没睡熟。林小满把问题摊开在电话里——不是全部真相，但足够让橙姐明白她在面临一个选择。橙姐听了半晌，没有直接给答案，只是反问了几句话。电话挂断后，林小满握着手机，靠在椅背上。橙姐没有替她做决定——但她帮她把问题理清楚了。
  characters:
  - CHAR-001
  dialogue: 橙姐……如果我告诉你，有一个选择——一边是故事本身，一边是故事里的人。你会怎么选？
- shot_id: EP53-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 电话挂断。林小满握着手机，把它放在桌上。她的表情在台灯光下半明半暗——但不再是之前的焦躁了。橙姐的话像一颗石子投进了她心里那潭浑水——不是答案，但让浑浊沉淀下来，让问题变得清晰。她看着面前那沓剧本手稿——那是她写的。里面的人——是她在乎的。她轻轻地"啊"了一声——明白了什么。
  characters:
  - CHAR-001
  dialogue: 愿意为哪个负责……
- shot_id: EP53-S09
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满站起来，拿起那沓剧本手稿走到窗边。她拉开窗帘——深夜的杭州城，万家灯火散落在黑暗的城市肌理中。每一扇亮着的窗户后面，都有故事在发生。她低头看了一眼手里的稿纸——上面写满了她为角色们写的对白、场景、动作描述。然后她抬起头，看着窗外的城市。她的表情从迷茫慢慢变得通透——像一个人终于走到了路的尽头，发现面前不是悬崖，而是一片开阔的平原。她开口了——声音不大，但每一个字都带着确定的重量。
  characters:
  - CHAR-001
  dialogue: 你选了人——因为你相信人比故事重要。
- shot_id: EP53-S10
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 她转过身，回到电脑前坐下。她看着屏幕上定格的第1个编剧的画面——他那双温柔的眼睛像在等她回答。她深吸一口气，然后说出了那句话。不是对第1个编剧说的，不是对橙姐说的，也不是对沈长渊说的——是对她自己说的。这句话说出口的瞬间，她感觉到自己整个人的姿态都变了——像一道长久纠结的结被解开。
  characters:
  - CHAR-001
  dialogue: 我的答案是——故事和人，都重要。
- shot_id: EP53-S11
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 林小满说完了答案。房间里安静了两秒。然后——笔记本电脑的屏幕突然自己亮了。不是从待机状态唤醒的那种渐亮——是瞬间亮起，像被什么力量直接激活。屏幕变成一片纯白——不是死机的白屏，而是像新文档页面一样干净明亮的白。纯白的页面上，一个字一个字地自动浮现出一行文字，逐字打出——字体不是她电脑里的任何一种。光标在最后一个字后面闪烁了一下，稳稳停住。林小满看着那行字，呼吸顿了一拍。然后她把手放上键盘——手很稳，没有颤抖。她闭上了眼睛。屏幕上的白光开始扩散，从屏幕中溢出来，像实体化的光芒一样流淌——照亮了她的脸、她的手、整张桌面、整个房间。她在光中微微笑了。
  characters:
  - CHAR-001
  dialogue: 答案已确认——
- shot_id: EP53-S12
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 纯白的作者空间。远处的透视网格线延伸至无限，空气中零星漂浮着发光的文字碎片。林小满站在空间中央——灰色卫衣和周围的纯白形成柔和的对比。她的姿态和之前任何一次都不一样：不再是一个迷茫的闯入者，而是一个笃定的守护者。在她面前的虚空中，三行发光的空位缓缓浮现——像文档中等待被填充的三行空行，金色的光线勾勒出每一条横线。每一行空位都散发着淡淡的暖金色光芒，像是世界本身在等她给出指令。她看着那三行空位，嘴角微微上扬——不是笑，是一个人终于知道自己该做什么时的表情。她抬起手，指尖朝第一行空位伸去——指尖即将触碰到的前一刻，画面停住，世界屏息。
  characters:
  - CHAR-001
  dialogue: 三条规则——一个新世界。
