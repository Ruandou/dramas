- shot_id: EP44-S01
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 傍晚的出租屋，最后一抹暮色从窗户透进来，屋里没开灯。林小满推门而入，外套没脱就靠在门边。她低头看着自己的手机（`PROP-002`）——屏幕暗着，没有新消息。她抬起左手腕，看着手腕上那个停在了"1"的淡金色倒计时印记（`PROP-006`），微弱地发着光，不再跳动。
  characters:
  - CHAR-001
  dialogue: 太妃说——前六个编剧都在那个节点放弃了。
- shot_id: EP44-S02
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满从口袋里摸出那把刻着"07"的铜质钥匙（`PROP-009`），攥在手心——冰凉的金属触感让她清醒了一些。她抬起头，目光穿过走廊——落在浴室半开的门上。那面镜子静静地立在昏暗里。她盯着那面镜子——不是在照镜子，是在看镜面本身——像一个入口。
  characters:
  - CHAR-001
  dialogue: 储柜里的手机……夹缝……镜子……
- shot_id: EP44-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 浴室门被推开。林小满走进去，手摸索到墙上的开关——"咔嗒"，灯灭了。整个房间陷入更深的昏暗，只剩下窗外城市的天光——蓝灰色的、朦胧的——在镜面上投下一个模糊的轮廓。林小满站在镜子前，看着自己在暗中的剪影。她深吸一口气——吐出来的时候，肩膀微微发抖。
  characters:
  - CHAR-001
  dialogue: ……沈长渊。
- shot_id: EP44-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在镜前，浴室门半开，身后的公寓走廊是一条暗色的通道。镜子里的她站在昏暗的光线中，轮廓模糊。她等了片刻——什么也没发生。镜子里的她和现实中的她保持着同样的姿势。她咬了咬嘴唇——没有放弃——双手撑在洗手台边缘，身体微微前倾，下巴微抬，对着镜子里的自己开口了——声音不再像试探，更像在说一件她确定应该做的事。
  characters:
  - CHAR-001
  dialogue: 我说——我要见沈长渊。
- shot_id: EP44-S05
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 镜子里的林小满——突然动了。不是跟着她动的。林小满站得笔直，但镜子里的"她"微微侧了一下头——像听到了什么声音在召唤。林小满的瞳孔骤然放大——她猛地屏住呼吸，下巴微微收紧。镜子里的倒影没有停下——它缓缓抬起手，指尖轻轻碰触镜面内侧，像是在触摸一堵玻璃墙。镜面上以指尖接触点为中心，泛起一圈极轻的涟漪——像水面被投入了一颗石子，波纹向四周扩散，扭曲了倒影的脸。
  characters:
  - CHAR-001
  dialogue: 动了……
- shot_id: EP44-S06
  scene_id: SCENE-001
  duration_sec: 8
  camera: i2v_ref 镜头推近→拉远（穿过镜面）
  content: 镜面特写。涟漪从指尖接触点向整个镜面扩散，水面般的波纹扭曲了反射的影像。林小满的倒影变得模糊、拉长、碎裂成光点——镜面不再是镜面，变成了一层微微发光的银色薄膜。镜头向前推进——穿过镜面——画面从昏暗的浴室瞬间融化进一片无限的白。像是从水里浮出水面，光线从四面八方涌来。
  characters:
  - CHAR-001
- shot_id: EP44-S07
  scene_id: SCENE-010
  duration_sec: 6
  camera: t2v 镜头缓慢推近
  content: 灰白色的无边界空间——地面隐约可见淡蓝色的透视线条网格，延伸到无尽的远方。空间中漂浮着零星的微光粒子，像未被写下的想法在空气中缓慢旋转。没有风，没有声音——只有一种纯粹的、等待被填满的寂静。远处，一个小小的身影站在网格线的交汇处——穿着米白色衬衫的剪影，在无限的白中像一滴墨。
  characters: []
  dialogue: 作者空间。——两个世界之间的夹缝。
- shot_id: EP44-S08
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 镜头推到近处。沈长渊站在那里——现实的沈长渊。米白色亚麻衬衫，袖子随意挽到小臂，深灰色长裤。他瘦了很多——衬衫显得空了一些，下颌线比之前更锋利。但他的眼睛是亮的。银丝细框眼镜后面，那双狭长的眼睛——和古装沈长渊一模一样的眼型——带着温柔的笑意。那不是社恐的、紧张的目光——他是在这里等了很久、终于等到要等的人之后的那个沈长渊，整个人透出一种卸下了所有伪装的安稳。
  characters:
  - CHAR-003
  dialogue: 你来了。
- shot_id: EP44-S09
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在作者空间的边界线上，还没从"真的穿过来了"的震撼中回过神。沈长渊向前走了几步，步伐很轻——像是在这片寂静的空间里，他学会了不发出多余的声音。他在她面前停下来，低头看着她。他比她记忆中瘦了一圈——衬衫领口处锁骨更明显了。他伸出手，慢慢握住她的手——动作很轻，像是在确认她是不是真实的、是不是真的站在了这里。
  characters:
  - CHAR-001
  - CHAR-003
  dialogue: 瘦了……
- shot_id: EP44-S10
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头缓慢推进
  content: 双手交握的特写。他的手修长、骨感——确实瘦了，但掌心是温暖的。林小满的手指紧紧回握住他，指节泛白。在灰白色的无限空间里，两只握在一起的手是唯一有温度的东西。镜头缓缓推进，从手部移到林小满的脸上——她的眼眶红了。
  characters:
  - CHAR-001
  - CHAR-003
  dialogue: 我在这里很久了。——久到快分不清时间了。
- shot_id: EP44-S11
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 沈长渊没有松开她的手。他看着她，目光里有一种沉淀了很久的平静——不是"早就知道你会来"的那种从容，是"等了很久终于等到了"之后的那种安宁。他微微侧了一下头，看向远处漂浮的微光粒子——那些粒子在半空中缓缓旋转，像未被写下的句子等待被捕捉。然后他收回视线，重新看着她。他的声音放缓了——不是虚弱，是认真到了极处之后的慢。
  characters:
  - CHAR-003
  - CHAR-001
  dialogue: 时间不多了。——倒计时还有一天。
- shot_id: EP44-S12
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 镜头缓缓拉远
  content: 林小满的瞳孔微微放大——她看着沈长渊，像在消化一句需要重新学习一生的话。她的嘴唇动了动——想说什么，但没有立刻说出来。沈长渊没有催促，只是握着她的手，站在那片无边的白色中——像他本来就属于这里、本来就应该站在这里等她。镜头从他们的特写缓缓拉远——两人站在作者空间的网格线上，周围漂浮着零星的微光粒子，像一个未完成的句子正在等待被写下第一个字。
  characters:
  - CHAR-001
  - CHAR-003
  dialogue: 用……感情写？
