- shot_id: EP50-S01
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 纯白空间中，两人隔着木桌相对而坐。第1个编剧的身影比之前淡了一些——不是透明到消失的程度，像印刷品放久了褪色了一层。他低头看了看自己的手，像在确认还剩多少时间。然后他抬起头看着林小满——目光里没有不舍，只有如释重负的温柔。林小满也看着他，眼眶还红着，但目光已经不再闪烁。桌面上那台银色笔记本电脑（`PROP-001`）的屏幕忽然自动亮起——纯白的文档界面，光标在左上角安静地闪烁。
  characters:
  - CHAR-001
  dialogue: 准备好了吗？
- shot_id: EP50-S02
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧伸出手，掌心向上，悬停在桌面上方。林小满也伸出手，指尖微微颤抖——不是害怕，是这种时刻正常的反应。两人的手在桌面上方的半空中缓缓靠近。在他们指尖触碰的一刹那——整个世界静默了一拍。笔记本电脑的屏幕闪烁了一下。林小满的瞳孔骤然收缩。
  characters:
  - CHAR-001
  dialogue: ……
- shot_id: EP50-S03
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满的瞳孔剧烈放大——她"看到"了。不是用眼睛看到的，是意识层面的一切突然涌进来：金銮殿朱红立柱上的每一道漆痕、长安侯府竹叶上滑落的每一滴露水、太妃寝宫里铜鹤香炉升起的每一缕烟、天牢石壁上每一道水痕……所有场景、所有角色、所有正在发生的对话——同时涌入她的意识。她看到翠微在御花园里追着赵景和跑，看到太妃独自坐在寝宫里发呆，看到苏晚晴在酒楼柜台后算账——整个世界，每一层、每一角、每一个人。她的左手腕内侧，倒计时印记（`PROP-006`）上的数字开始剧烈闪烁——从"71"跳到"34"又跳到"08"……然后"00"。
  characters:
  - CHAR-001
  dialogue: 我看到了……全都在……金銮殿、侯府、御花园——每一个地方我都能看到。
- shot_id: EP50-S04
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满的眼睛缓缓恢复聚焦。她收回手，低头看着自己的左手腕——那个跟了她几十集的倒计时印记（`PROP-006`）已经消失了。皮肤光洁如初，像那里从来没有过任何印记。她轻轻抚摸那个位置——温热感还在，但数字已经没了。她抬起头，看向对面的第1个编剧又像是穿透他看向更远的地方。她的表情里不是喜悦，是一种终于理解一切的、平静的震撼。
  characters:
  - CHAR-001
  dialogue: 原来……一切都在我手上。一直在我手上。
- shot_id: EP50-S05
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 第1个编剧坐在对面，他的身影已变得明显透明——不是恐怖的那种消散，是像晨雾在日出中慢慢变淡的那种透明。他低头看了看自己半透明的手，然后放下，抬起头对林小满笑了——那个笑容里没有悲伤，只有一个人终于完成使命后可以好好休息的平静。纯白空间中漂浮的光点开始缓缓旋转，像整个空间在为他送行。笔记本电脑的屏幕发出柔和的光芒，文档界面上光标依然闪烁——等待新的主人写下第一行。
  characters:
  - CHAR-001
  dialogue: 时间到了。
- shot_id: EP50-S06
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧的身影继续变淡——从半透明到几乎只剩轮廓，像一张褪色的照片最后的光影。他微笑着，目光一直落在林小满身上，像是在确认她真的准备好了。然后他散了——不是突然消失，是像一阵风带走了一团轻烟，从边缘开始缓缓消散，最后那个位置什么都没有了，只有一片纯净的白。林小满保持着伸手的姿势，看着空无一人的对面。眼泪已经流干，嘴角还挂着那个微笑。
  characters:
  - CHAR-001
  dialogue: 谢谢。
- shot_id: EP50-S07
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 镜头缓缓拉远——纯白空间中，林小满独自坐在那张木桌前。笔记本电脑的屏幕亮着，光标在左上角闪烁。她的背影在无垠的白色中显得格外渺小，又格外坚定。刚才还坐着一个活人的对面，现在是空的——只有桌面上残留着一圈极淡的、微微发光的金边，像那个人坐过的余温在慢慢消散。远处，漂浮的文字碎片重新开始缓慢旋转，像一个世界在新的守护者面前开始呼吸。
  characters:
  - CHAR-001
- shot_id: EP50-S08
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满缓缓低下头，再次看向自己的左手腕——那个曾经刻着倒计时数字的位置，现在什么也没有了。她用手指轻轻划过那片皮肤，确认不是幻觉。然后她抬起手，掌心朝上，轻轻握了一下——像是在感受掌心里的什么东西。整个世界的脉搏——她感觉到了。这片纯白的空间不再是陌生的、令人敬畏的地方——它像她的一部分。
  characters:
  - CHAR-001
  dialogue: 没有了……倒计时没有了。
- shot_id: EP50-S09
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站起来，转身看向那片无限延伸的纯白空间。她不再害怕了——不是因为她变强了，是因为她理解了。这个世界不是一个牢笼——是一座花园。而她不是园艺师——是这片土地本身。远处，漂浮的文字碎片缓缓聚拢，形成一个环绕她旋转的光环——如世界在欢迎它的新守护者。笔记本电脑的屏幕光芒变得更暖了一些，光标闪烁的频率像心跳一样均匀。
  characters:
  - CHAR-001
  dialogue: 从现在起——我来决定这个世界的方向。
- shot_id: EP50-S10
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满站在那里，脸上刚浮起一个微笑——然后她的身体突然晃了一下。她伸手扶住桌沿——不是疼痛，是承载了过多重量的冲击。整个世界的信息同时压在她身上。她的视野开始模糊，纯白的世界在眼前旋转。她听到远处传来的声音——像所有角色同时在对她说话，又像一个巨大的和弦同时被拨响。她的腿软了下去。她最后看到的画面是——笔记本电脑屏幕上，文档里自动浮现了一行字，不是她写的。字迹很小，像有人在遥远的地方写下的祝福。她想看清楚那行字，但视线已经模糊了。在意识陷入黑暗之前，她听到了自己的心跳——和这个世界的脉搏，第一次完全同步。
  characters:
  - CHAR-001
  dialogue: ……太重了……整个世界……
