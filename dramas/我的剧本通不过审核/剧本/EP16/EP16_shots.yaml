- shot_id: EP16-S01
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 深夜书房，烛火突兀地定住不动——火焰不再摇曳，像凝固的琥珀。空气中弥漫着一股极其轻微的静电感，像暴风雨来临前的压抑。林小满站起身，双手撑在桌沿，低头看着自己手腕上淡金色的"71"。沈长渊感觉到异常，从窗边转过身来——他的动作比平时慢，像是穿过某种看不见的介质。他看到林小满闭上了眼睛，呼吸变得深而慢。她没有再犹豫。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我改。
- shot_id: EP16-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满闭着眼，眉头紧锁——她在脑内"打开"了角色面板。镜头推近到她手腕上的印记——淡金色的"71"开始剧烈闪烁。她的嘴唇微微翕动，像在念什么——其实是在脑内搜索赵景和的角色参数页面。她找到了那个字段："性格：优柔寡断（倾向于听从权威意见，缺乏自我决断力）"。她深吸一口气——集中全部意念——把那个字段改成了"有主见（能够独立思考并坚持自己的判断）"。
  characters:
  - CHAR-001
  dialogue: 找到了——赵景和——角色核心参数——性格——
- shot_id: EP16-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满猛地睁开眼。她低头看自己的手腕——淡金色的数字从"71"像跑马灯一样滚动——70、69、68、67——最后停在"66"。整个变化过程不到一秒钟。然后——世界像被一只无形的手按了一下"刷新"键。书房的烛火剧烈晃了一下——不是熄灭，是整个世界闪了一帧。沈长渊眨了眨眼——他的记忆里多了一段"刚才窗外似乎有鸟飞过"的错觉补丁。但林小满知道——刷新了。她看向自己的手腕——"66"安静地亮着。五个数字，就这么没了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 71……70……69……68……67……66。
- shot_id: EP16-S04
  scene_id: SCENE-002
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 次日清晨，金銮殿上。大臣们分列两班，太妃依然坐在龙椅旁的侧位上，深紫色宫装，目光淡然。林小满被允许站在殿侧。她看着龙椅——赵景和还没有来。她的心跳很快，手心全是汗。太妃的目光若有若无地扫过她——那目光里带着一丝嘲讽，仿佛在说"最后的告别仪式吗？"林小满强迫自己不躲开那个目光。礼部尚书已经准备好了奏本——只等皇帝落座，就再次提出驱逐之事。他低声对身旁的同僚说了一句话，声音里带着志在必得的确信。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 心跳太快了……他来了吗……参数真的生效了吗……
- shot_id: EP16-S05
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和从侧殿走出来。他的步伐和昨天完全不同——不是缩着肩犹豫着走出来，而是笔直地大步走向龙椅。他坐下时，目光先扫视了全场一圈——不是怯生生的扫视，是皇帝的扫视。礼部尚书上前一步，正要开口——但赵景和抢先开口了。他的声音平静，语气不容置疑。他说完，整个大殿安静了至少三秒。礼部尚书愣在原地，张着嘴，第二个"臣"字卡在喉咙里没出来。
  characters:
  - CHAR-007
  dialogue: 朕知道礼部尚书要说什么。关于林小姐——朕已经决定了。
- shot_id: EP16-S06
  scene_id: SCENE-002
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 太妃的脸像被冻住了一样。她端茶盏的手停在半空——一动不动。然后她缓缓把茶盏放回桌上，瓷器碰触木面发出一声极轻的"嗒"。她没有看赵景和——她慢慢转头，看向殿侧站着的林小满。那个目光和昨天完全不同——不是嘲讽，不是蔑视——是震惊之后迅速冷却下来的确认。她知道。她知道林小满动了手脚。她甚至知道林小满改了哪里。凤镯在她的腕间微微发光——金色凤凰纹路在某一瞬间亮了一下，像被激活的传感器。
  characters:
  - CHAR-005
  - CHAR-007
  dialogue: 陛下——您昨天可不是这么说的。
- shot_id: EP16-S07
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 朝堂在令人窒息的沉默中结束了。赵景和起身离开——他的步伐很稳，和昨天那个缩着肩膀离开的少年判若两人。林小满站在殿侧，看着他的背影，心里百感交集——她成功改写了一个角色的核心性格，但她不知道这个改变会带来什么连锁反应。她正准备从侧门离开——太妃的声音从背后传来，不高，但像一根针扎进后颈。林小满停下脚步，没有转身。她感觉到太妃的目光像实质的重量落在她背上。
  characters:
  - CHAR-001
  - CHAR-005
  - CHAR-007
  dialogue: 成功了……他真的变了。
- shot_id: EP16-S08
  scene_id: SCENE-002
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 回廊下，太妃站在逆光中，深紫色宫装的下摆拖在石地上。她伸出手——慢慢摘下了腕上的凤镯，在指间翻看了一下。金色凤凰纹路在日光下反射出细微的光泽。她没有看镯子，而是看着林小满——那眼神不是愤怒，是一种林小满看不懂的东西。像审视，又像某种记忆被唤醒后的恍惚。太妃开口了，语气和朝堂上完全不同——没有了那股压迫感和威严，变得很平，平到让人害怕。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你改了他的性格参数。
- shot_id: EP16-S09
  scene_id: SCENE-007
  duration_sec: 12
  camera: i2v_ref 镜头推近
  content: 太妃寝宫。深紫色帷幔层层叠叠，铜鹤香炉中升起沉香的细直线条。太妃没有坐回主位——她站在香炉旁，伸手拨弄了一下香烟，烟雾被打散又慢慢聚拢。林小满站在几步之外，等着她开口。太妃开口时，她没有转身——背对着林小满说话。声音很轻，像在自言自语，但每一个字都钻进耳朵里。她说到"你和我都出不去"时，声音里第一次出现了一种林小满从未在太妃身上见过的情绪——不是愤怒，不是蔑视，是恐惧。林小满的瞳孔微微放大——太妃说的不是"你出不去"，她说的是"你和我都出不去"。"你和我"——她被同样困在这个世界里。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你以为你赢了。一个性格参数——换你留在宫里。
- shot_id: EP16-S10
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 太妃没有回答林小满的问题。她转身走向内室，深紫色背影消失在帷幔之后，留下一句话回荡在昏暗的寝宫中。林小满站在原地，脑子里那句"你和我都出不去"反复回响。她几乎是踉跄地走出太妃寝宫——翠微在外面等她，看到她出来立刻迎上去。林小满抓住翠微的手臂，声音发紧。翠微的脸色也白了——太妃的那句话如果是真的——那她面对的不是一个"反派角色"，而是一个同样被困在这个世界里的……什么？另一个编剧？前任编剧？还是——某种她还没理解的存在？回廊尽头，天色开始变暗。远远传来宫女们掌灯的声音。林小满看着手腕上那个"66"——她突然意识到，她对这个世界的了解，可能连十分之一都不到。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 想清楚吧——林小姐。这个世界——还没你想的那么简单。
