- shot_id: EP29-S01
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头·桌上俯拍中景
  content: 侯府书房，日光从竹帘缝隙中斜射进来，在书案上投下横条纹光影。书案不是平时那种整洁的文人书桌——它被彻底覆盖了：一张张宣纸铺满整个桌面，每张纸中央写着一个角色的名字——「赵景和」「翠微」「苏晚晴」「太妃」「沈长渊」——名字周围画着箭头、圆圈和潦草的字迹，标注着"当前弧线""缺失部分""需求"等。有些纸被涂改了多次，墨迹重叠，边角卷起。林小满站在案前，手里握着一支毛笔——笔尖悬在一张新纸上，上面刚写下"第二幕·重构方案"几个字。她的头发有些散乱——显然一夜没睡，但眼睛是亮的——不是因为咖啡——是因为她终于知道该怎么写了。她看着满桌的名字，自言自语。
  characters:
  - CHAR-001
  dialogue: 太妃要完整——苏晚晴要独立——翠微要有自己的事做——赵景和要长大……
- shot_id: EP29-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 书房的竹帘门被从外推开——沈长渊站在门口。他端着一杯茶，本来是要进来的——但看到书案的瞬间，他停住了脚步。他的视线扫过满桌铺开的纸张——每个名字、每根箭头、每个涂改的痕迹。他从来没有见过林小满的书桌变成这样——她的"脑内编辑器"平时只存在于她自己的意识中，而现在她把整个思考过程物理化了——铺在他桌上。他沉默了两秒——然后走进来，把茶杯放在案角唯一一块空处——那杯茶没有喝，是给她的。
  characters:
  - CHAR-002
  dialogue: 你把我的书房——变成你的作战指挥室了。
- shot_id: EP29-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头—过肩反打
  content: 林小满抬头。她没想到沈长渊会在这个时间进来——他平时上午都在练剑。她看到他放下的那杯茶——没喝，是给她的。她低头看了一眼那杯茶——然后又抬头看他。她没来得及说谢谢——因为她看到了他脸上那种"我知道你在干什么"的表情。她索性把手里的笔往笔山上一搁，直接进入正题。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你来得正好——我正要找你。下午我打算把所有人叫来——在这个厅里——开一个会。
- shot_id: EP29-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头·厅内全景·焦点在CHAR-001
  content: 侯府正厅。椅子被林小满重新摆过——围成一圈，中间是一张矮几，上面摊着她写满名字的纸张。角色们陆续入座——太妃先到，选了一个靠窗的位置，神色平静（经历了EP28的坦白后她不再是锋芒毕露的那个太妃了）；苏晚晴第二个到，坐在太妃对面，礼貌性地点了一下头；翠微和赵景和一起来的——赵景和帮翠微拉开椅子，翠微脸红了一下但很快恢复常态；沈长渊最后一个进来——他没有坐，站在林小满身侧靠后的位置，双臂交叠在胸前——像她的"参谋"而非参会者。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-006
  - CHAR-007
  - CHAR-002
  dialogue: 好——都到了。
- shot_id: EP29-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微的表情——从疑惑变成惊讶然后变成一种"终于有人问了"的感动。她张了张嘴又闭上——居然忘了怎么说话。过了好一会儿才挤出一句话，声音没有平时那么咋咋呼呼——认真的。
  characters:
  - CHAR-004
  dialogue: 小姐——你是认真的？
- shot_id: EP29-S06
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 沉默了一会儿后——赵景和先开口了。他没有用"朕"——他用了"我"。这个细节让在场的所有人都安静了一下——他很少在正式场合不用"朕"。他看起来有些紧张——手指在膝盖上轻轻摩挲着龙袍的边角——但他没有退缩。他看着林小满——不是作为皇帝对编剧——是一个少年在对另一个创作者说话。
  characters:
  - CHAR-007
  dialogue: 我——我不想再当那个——优柔寡断的小皇帝了。
- shot_id: EP29-S07
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 赵景和说完后，厅内安静了两秒。然后翠微开口了——她的语气和平时不一样。没有"天爷呀"，没有"这也太刺激了吧"——这是翠微第一次在全剧中说一句不搞笑、不吐槽、不夸张的话。她不像在跟林小满说话——她在跟"编剧"说话——认真地、平等地。她说着说着忍不住恢复了一点老本行——从袖中掏出一块绣帕（PROP-008）擦了擦手——那绣帕上隐约可见比翼鸟的刺绣图案。
  characters:
  - CHAR-004
  dialogue: 小姐——不，林小满。
- shot_id: EP29-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微说完后，苏晚晴和太妃同时开口——两人都停了一下，互相看了一眼。苏晚晴微微点头示意太妃先说——太妃摇头示意苏晚晴先说。在这个瞬间——两个曾经在剧本中对立的女人——表现出了之前从未有过的默契。最终苏晚晴先开口了。她坐得很直，双手交叠放在膝上——语气和她的清冷外表一致，但她的话比平时更简短——没有比喻，没有"呵"——直白、直接。
  characters:
  - CHAR-006
  dialogue: 我的诉求——你已经知道了。我不要再依附任何人。酒楼、商业线、独立的结局——你答应过的。
- shot_id: EP29-S09
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴说完后，所有人的目光转向太妃。太妃坐在窗边的椅子上——午后的阳光从她身后的窗格透进来，在她肩头镀上一层暖金。她没有穿盛装——但也不是EP28那天的常服——她穿了一件介于正式和日常之间的深紫色袍服——像是在告诉自己"今天不是来打架的，但也不是来示弱的"。她开口时声音平静——不是EP28那种脆弱——是经历了EP28之后的一种沉稳——她已经被林小满看到了，所以不需要再证明什么。
  characters:
  - CHAR-005
  dialogue: 本宫要的——也告诉你了。
- shot_id: EP29-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头·过肩
  content: 赵景和、翠微、苏晚晴、太妃——都说完了。所有人的目光转向了沈长渊——他是最后一个还没开口的。他站在林小满身侧靠后的位置——从会议开始就一直沉默——双臂交叠在胸前——像是那个"不需要开口"的人。但所有人都知道——他最应该开口。林小满转身看着他。她的表情不是"该你了"——而是一种更复杂的情绪——因为他的请求她早就知道——但她不知道该怎么回答。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你呢？
- shot_id: EP29-S11
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头缓推
  content: 沈长渊站到了所有角色面前——但他只看着林小满一个人。他脸上的表情不是平时那种"有意思"的玩味——也不是EP27那次握住她手时的柔软——那是一种从平静深处升起的决心——像是一个在剧本中活了很久的人，终于决定说出一句他从第一行台词起就想说的话。他的声音比他平时说话更慢——每一个字都像在称重——他说的不是一个编剧权限能解决的问题——这是一个纸片人对自己存在本质的追问。
  characters:
  - CHAR-002
  dialogue: 我不要成长线——不要事业线——不要完整的故事。
- shot_id: EP29-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 从满厅全景→快切到林小满的脸→再推到她的手腕
  content: 沈长渊的话音落下——厅内一片寂静。没有人说话——因为没有人知道该怎么回应——他说出了所有人都不敢说、但都是他们存在的那个终极问题——"真的活"。然后——在这一秒的沉默中——世界发生了变化。不是地震——不是天上掉东西——是一种更微妙但更确定的感觉——像是整个世界——在同一瞬间——非常轻微地——呼吸了一下。所有角色同时感觉到了——他们的身体僵直了不到半秒——像电脑屏幕刷新的那种闪烁——非常快——但每个人的瞳孔都微微放大了一下。闪烁结束后——一切恢复原样——但所有人都知道——刚才发生了什么。林小满低头看向自己的左手手腕——腕上的淡金色倒计时印记（PROP-006）在轻轻跳动——数字已经从47变成了4
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-004
  - CHAR-005
  - CHAR-006
  - CHAR-007
  dialogue: 刚才——那是什么——
