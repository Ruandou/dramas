- shot_id: EP21-S01
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 侯府书房，午后斜阳透过竹帘在书案上投下斑驳条纹。林小满坐在书案前，手里拿着一张空白宣纸——但她没有写任何字，只是盯着纸面发呆。她的姿态和平时完全不同：不是熬夜赶稿的亢奋，不是发现世界在代写时的震惊——而是一种更深的、被什么东西击中了之后还没缓过来的茫然。她另一只手无意识地转着毛笔，笔尖在纸边留下一小道墨痕，她没有注意到。
  characters:
  - CHAR-001
  dialogue: '''小满，如果你听到这段话……说明你已经进去了。''——他三年前就知道。三年前。'
- shot_id: EP21-S02
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微端着一碟桂花糕走进来，看到林小满的样子，脚步顿住了。她把碟子放在书案上时故意发出一点声响——想拉回林小满的注意力。但林小满只是抬头看了她一眼，目光又飘回纸面上。翠微没走，站在旁边观察了一会儿，终于忍不住开口。她伸手在林小满面前晃了晃，语气带着担心和好奇的混合。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐？你从早上坐到现在，一口水没喝。
- shot_id: EP21-S03
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满把昨天在现实世界找到信和听到录音的事告诉了翠微。她说得很简洁，但每个字都带着重量。翠微站在她面前，认真听着——她意识到这不是普通的"林小满又发现了什么新鲜事"——这是真正重要的东西。林小满说到三年前时，翠微的眼皮跳了一下——作为这个世界的原住民，她对"时间"这个概念比林小满更敏感。她沉默了一会儿，在消化这些信息。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 三年前——我还没搬进那间公寓，他就写了那封信。
- shot_id: EP21-S04
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微低下头，手指绞着衣角——这是她思考时的习惯动作。她沉默的时间比林小满预想的要长。林小满以为她没听懂，正要再解释一遍，翠微突然抬起头来看着林小满——眼神里有了一种林小满从未在她脸上见过的认真。她开口时，声音比平时低了好几度——不是在说一句随口的猜测，而是在说一个她自己也觉得很大胆、但无法不说的想法。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐——我之前没敢说——但现在我越来越觉得……
- shot_id: EP21-S05
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微那句话像一颗石子投入静水——林小满的表情在第一秒没有任何变化，但在第二秒她的瞳孔微微放大了。她没有说话。她的大脑在飞速运转——之前所有的碎片：现实沈长渊和古装沈长渊长得一样、合同的签名、三年前的信、玉佩、"钥匙"……如果翠微是对的——如果房东真的是从这个世界出去的——那一切都说得通了？不——她又推翻了这个想法——如果房东是从这个世界出去的，那古装沈长渊和现实沈长渊是同一个人在不同世界的存在？她伸手揉了揉太阳穴——信息量太大了。
  characters:
  - CHAR-001
  dialogue: 从这个世界……出去的人？
- shot_id: EP21-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站起来，开始在书房里来回踱步——这是她脑内风暴时的标志性动作。翠微站在一旁不敢打扰。林小满走了两圈，突然停住，转身面向书案。她弯下腰，开始在一堆宣纸和手稿中翻找——动作有些急，几张纸被她带落到地上。翠微赶紧蹲下帮她捡。林小满没有谢她——她找到了一份旧手稿，是她在最初写下《燕京奇缘》设定时的那一版。她翻到沈长渊的那一页——手指停在某一行上，不动了。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 我记得当初写他的设定时——我只写了一点。非常少的一点。
- shot_id: EP21-S07
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 翠微接过那份泛黄的手稿。纸上是林小满当初的字迹——那时候她的字还没被这个世界"同化"成毛笔体，还是圆珠笔的现代字迹。整页纸上只有一行字：「长安侯世子沈长渊」。就七个字。没有外貌描写，没有性格设定，没有身世背景——什么都没写。翠微抬起头看林小满，又低头看纸，又抬头看林小满。她张了张嘴，不知道说什么。林小满从她手里轻轻拿回纸，看着那七个字，声音里带着一种自己都觉得不真实的笑意——不是轻松的笑，是一种"这件事太离谱了"的本能反应。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: ……就这些？
- shot_id: EP21-S08
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 镜头跟随
  content: 林小满叠好那份手稿，站起来。她的动作比之前坚定了——茫然期过去了，她现在需要答案。翠微跟上她两步，但林小满回头冲她轻轻摇了摇头——意思是"接下来让我一个人去"。翠微停住了脚步，站在书房的门口看着林小满穿过庭院。午后的光透过竹林在青石板路上投下斑驳的影子，林小满的淡紫色裙摆扫过地面，步伐越来越快。她走过回廊的转角之前，翠微忍不住喊了一句——带着她标志性的、藏不住事的焦虑。林小满没有回头——但脚步也没有停，只是微微顿了一下，然后消失在转角处。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 我去问他。
- shot_id: EP21-S09
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 后院竹林边，沈长渊坐在石台上，手里拿着一卷书。他听到脚步声，从书卷上抬起视线——看到林小满走过来，她的表情让他微微眯起了眼。他放下书——没有说话，只是看着她走近。林小满在离他两三步远的地方停下来——没有像平时那样直接坐下来吐槽或讨论剧情。她的不一样让沈长渊警觉起来。他等她先开口。竹林的风吹过，竹叶沙沙作响。林小满看着他的眼睛——他有一张她写了无数对白的脸，但她突然意识到：这些对白，不是她写的。是这个角色自己"长出来"的。她深吸一口气，开口了——没有铺垫，单刀直入。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你今天的脚步声和平时不一样。出什么事了？
- shot_id: EP21-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊的表情变了——不是惊讶，不是防备——而是一种更复杂的、他自己也第一次意识到的"空白"。他张了张嘴，想回答，但发现没有答案可以给。他的眼神从清晰变成了一种罕见的迷茫——这个总是说话一针见血、每个动作都有目的的男人，第一次露出了"我不知道"的表情。那沉默持续了五秒——在竖屏短剧的节奏里，这是一个很长的停顿。风吹动他的发丝和衣袂，他没有动。他的目光没有看林小满——而是看着某个空无一物的方向，像是在脑子里搜索一个根本不存在的内容。
  characters:
  - CHAR-002
  dialogue: ……
- shot_id: EP21-S11
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊说完了上一句，又停住了。林小满没有催他——她站在他面前，安静地等着。竹叶的沙沙声在两人之间填满了沉默。沈长渊垂下视线——这个习惯性的、回避的动作在他身上很少见，他从来都是直视对方的那个。他开始说话，但每一个短语之间都有停顿——不是因为犹豫，而是因为他说的每一个字，都在打开一个他自己从未觉察过的空洞。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我知道'长安侯世子'是我的身份。我知道侯府是我的住所。我知道我应该姓沈。
- shot_id: EP21-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推→固定
  content: 沈长渊的声音在最后几个字上不自觉地放轻了——像一个人突然摸到自己身上有一道从不知道的伤疤。林小满没有说话——她把那份折好的手稿从袖中抽出，展开，递到他面前。沈长渊低头看了一眼——七个字。他读了一遍，又读了一遍。然后他明白了。他的表情没有大起大落——他甚至微微笑了一下，但那笑容里有太多复杂的东西：苦涩、困惑、还有一丝对他自身存在的虚无感。他把手稿还给她，站起身来。他走到竹林边缘，背对着她，沉默了很久。当他开口时，声音恢复了平常的那种平静——但太平静了，平静得不像真的。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 所以——我这个人。是一个写了七个字的角色，自己长出来的。
