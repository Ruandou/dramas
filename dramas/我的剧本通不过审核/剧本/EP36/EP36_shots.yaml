- shot_id: EP36-S01
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃寝宫的深紫色帷幔低垂。铜鹤香炉中一缕沉香袅袅升起。太妃正坐在软榻上，手中端着一杯茶。林小满突然掀开帷幔闯了进来——没有通传，没有敲门。她的呼吸急促，额角有细密的汗——她是一路跑过来的。太妃放下茶杯，抬眼——目光里没有怒意，只有一种"终于来了"的了然。林小满走到她面前，把那本深蓝色封面的书拍在矮几上——砰的一声。沉香在空气中微微颤动。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你知道这本书——对吧。
- shot_id: EP36-S02
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃没有伸手拿书。她看着那本深蓝色的封面，目光复杂——不是厌恶，也不是恐惧——是一种她不想面对的疲惫。她的手指在袖中微微收紧。林小满没有坐下。她站在那里，手按在书脊上，看着太妃。她不给太妃逃避的余地。沉默蔓延了三个呼吸那么长。铜鹤香炉中的烟继续上升，在空气中扭曲、散开。最终——太妃伸出手。她的指尖触到书的封面时，微微停顿了一下——然后她打开了书。翻到第一页。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 本宫知道这本书。——但本宫从未翻过。
- shot_id: EP36-S03
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃翻开了书。她的目光从第一行开始扫描——她的表情在变化。不是那种强烈的、外在的变化——是一种非常细微的、内在的动容。她看到第1任的笔记时，嘴角微微抿紧。她看到第2任试图烧剧本的记录时，翻页的手指停了一瞬。房间里很安静——只有书页翻动的声音和铜炉中沉香燃烧的细微声响。她的目光始终没有离开书页。
  characters:
  - CHAR-005
- shot_id: EP36-S04
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在旁边，没有催促。她看着太妃读书的样子——那个平时气场全开、用长句排比和"本宫"构建威严的女人，此刻坐在软榻上，深紫色的宫装在昏暗中显得沉静。翻到第5任的记录时太妃眉头微动。翻到第6任时——她的目光突然凝住了。她看到了最后几页。林小满能感觉到太妃的呼吸变慢了——她在反复读那行字。然后她翻回第1任的开篇——手指轻轻滑过那些字迹——像是在确认什么。
  characters:
  - CHAR-001
  - CHAR-005
- shot_id: EP36-S05
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃终于把书合上了。她没有立刻说话。她低着头，一只手还按在书的封面上——深蓝色的封面和她的深紫色指甲形成一种暗沉的和弦。铜鹤香炉中的烟袅袅上升。她的呼吸很慢——像是一边呼吸一边在想——什么时候、从哪里开始说。然后她开口了。声音和她平时不同——没有"本宫"的句式，没有排比，没有那种精心设计的压迫感。就是一个女人——坐在自己的寝宫里——承认一件她可能七年都没对任何人说过的事。
  characters:
  - CHAR-005
  dialogue: 本宫——一直以为——门后是虚无。
- shot_id: EP36-S06
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满终于坐了下来——不是在太妃对面的椅子上，而是在她旁边的矮几另一侧。这个动作本身就是一个信号：不再是"对峙"，而是"面对面"。太妃的目光追随着她坐下，然后移开——落在铜鹤香炉上升起的烟上。她的声音在这一刻变轻了——不是底气不足，而是那个她用了七年来构建的防御性叙事，正在出现裂缝。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: ——第1任写的。他写他和你合作了前五集——然后消失了。
- shot_id: EP36-S07
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃坐直了身子——不是那种要展示威严的坐直，是一种需要把自己撑起来的肢体动作。她端起那杯已经凉了的茶，喝了一口——不是口渴，是需要一个动作来给自己一点时间。放下茶杯后，她看着那本书。她的声音在接下来的话里逐渐从平静变成了轻微的波动——像一个人正在当面对质自己七年来深信不疑的谎言。
  characters:
  - CHAR-005
  dialogue: 后来——第2任、第3任、第4任——每个人都在试图开门、试图离开。本宫拦住了每一个。本宫以为自己在保护这个世界——
- shot_id: EP36-S08
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满深吸了一口气。她知道——接下来要说的事情——是太妃在这个世界存在了这么多年从未听过的方案。她必须说得清楚、说得有说服力。她看着太妃的眼睛——不是小心的试探，是平等的对话。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 如果钥匙开门后不是虚无——那钥匙就不是毁灭。
- shot_id: EP36-S09
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃没有立刻回答。她靠着软榻的靠背——深紫色的宫装在阴影中沉下去。她的目光在林小满脸上停留了很久——像是在评估这个方案的分量。然后她微微侧过头——看向铜鹤香炉里上升的那一缕烟。她说话了——声音里没有了防御，但也没有热情。是一种冷静的、已经活了太久的人才会有的谨慎。
  characters:
  - CHAR-005
  dialogue: ——你说得轻巧。钥匙觉醒——你经历过一次——世界塌了——差点就没了。
- shot_id: EP36-S10
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃沉默了很久。长过三个呼吸。长到她端起凉茶又喝了一口——但茶已经凉透了，她皱了皱眉放下。长到她伸出手——不是拿书——是把那本深蓝色的书从桌子另一侧拉到自己这边来。她把手掌按在封面上。她看着那本书——不再作为"被别人书写的人"，而是作为一个终于看清自己这些年做了什么的人。她开口时——比之前任何一次都慢——每一个词都在往下沉。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 这七年来——本宫——我——拦住了六个想要开门的人。
- shot_id: EP36-S11
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满松了一口气——但她的那口气还没完全吐出来，太妃就接过了话头。她的声音在说下一句话时，恢复了那种沉稳的、不容忽视的压迫感——不是威胁，是提醒。是那种"我活了比你久、我见过比你多"的人，在一个重要的决定做出之前，必须确认最后一个变量时的那种语气。林小满的放松只持续了一秒——然后她看到太妃的表情变了。不是变的严肃——是变的认真。那种必须被认真对待的认真。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: ——但是有一件事——你必须知道。
