- shot_id: EP32-S01
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 深夜的书房。烛火在铜灯盏中静静燃烧，竹帘半卷。沈长渊坐在书案前——不是在看兵书，而是在等。他的佩剑搁在桌上，手边是那枚青白玉佩（PROP-004），他无意识地用手指转着玉佩的穗子。他听到什么声音——抬起头——林小满出现在门口。她穿着古装（L02淡紫襦裙），但表情完全是现代人的急切——她知道他在这里等她，而她也确实回来了。沈长渊看到她的瞬间，转玉佩的手停了下来。他没问"你去了哪"——他看得出来她去了那个世界。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我回去了。那个世界——我的世界。
- shot_id: EP32-S02
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满走到桌边，站在他面前。她的语速很快——像怕说到一半就会被打断一样——她要说一件很重要的事，而他是唯一能听懂的人。沈长渊没有插话——他安静地听完，目光始终停在她脸上。他的表情变化很微妙——从专注到沉思再到一种"果然如此"的了然。她说完之后，他的第一个词是"明天"——他确认的不是那个世界发生了什么，而是她接下来要做什么。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 开门的是个老人——他说你——他说沈先生——上个月就搬走了。走得很急。说要出一趟远门。
- shot_id: EP32-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满点了点头。然后她做了一件事——她向前走了一步。不是那种普通的靠近——是一种带着决心的、几乎勇敢的靠近。她把手伸向他——抓住了他的手——不是轻轻地搭上去，是握住。沈长渊低头看着她的手——他没有抽开。他的身体微微僵硬了一下——不是抗拒，是不习惯这种接触。但他没有动。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 但在这之前——明天之前——我要你告诉我一件事。
- shot_id: EP32-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊的瞳孔微微收缩。他看着她——不是被冒犯的那种——是一种"你终于问出来了"的复杂表情。这个问题他也在心里想过。从那个梦境开始频繁出现的时候，他就想过。他低下头——不是回避，是在思考怎么回答。烛火在他侧脸上投下晃动的影子——他的表情从警觉慢慢变成一种坦然的、近似于释然的东西。
  characters:
  - CHAR-002
  dialogue: ——你为什么会这么问。
- shot_id: EP32-S05
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 沈长渊没有立刻回答。他的手被她握着，他没有抽开——但他也没有回握。他只是沉默。这个沉默很长——长到烛火跳动了四次，长到窗外的夜风把竹帘吹得轻轻晃了一下。林小满没有催他。她只是握着他的手，站在那里，等。因为她知道这个问题不能催——他在翻找自己的记忆，在区分哪些是剧本写的、哪些是他自己感知到的、哪些是那个梦境告诉他的。他需要时间把那层边界理清楚。终于——他深吸了一口气。开口时声音很低——低到她必须靠近才能听清。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 这个问题——我从来没有跟任何人说过。
- shot_id: EP32-S06
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 沈长渊终于抬起头。他的目光没有落在她脸上——而是落在了某个更远的地方。他看着烛火——但他的眼神不是在看在火——而是在看在火后面那个只有他能看到的画面。他说话的速度比平时慢——每一个词都是从他记忆深处捞上来的。他的声音里没有了他惯常的冷硬——是一种不对任何人设防的、陈述梦境时的松弛。
  characters:
  - CHAR-002
  dialogue: 我梦到过——很多次。
- shot_id: EP32-S07
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 沈长渊的目光仍然落在烛火上——但他在描述的不是这个房间。他说"安静的房间"——不是那种"周围没人"的安静——是一种连呼吸声都显得太响的安静。他的声音在这段描述中变得很轻，像是在怕吵醒什么。
  characters:
  - CHAR-002
  dialogue: 安静到——可以听见自己的心跳。
- shot_id: EP32-S08
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满屏住了呼吸。她听出来了——他在描述的不是一个普通的梦。他描述的是沈长渊·现实在画廊里的状态——那个他从未见过的、但她已经从照片和微信记录里逐渐拼凑出来的人。安静的房间=画廊。白色的墙=画廊的展墙。画=那些水墨和油画。而"站在画前面不动"——那是沈长渊·现实在想念一个人的时候的样子。她握着沈长渊·古装的手——微微颤抖。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 站着——很久——一动不动的。
- shot_id: EP32-S09
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 沈长渊终于把目光从远处收回来——他看着林小满。不是那种"我看着你说话"的注视——是一种"我现在要说的话，需要我看着你说"的注视。他知道这句话很重要。他从来没有对任何人说过这句话——因为他自己也没完全确认过它的真实性。但此刻——在这个深夜——在烛火下——在她的手心里——他确认了。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 他想的那个人——是你。
- shot_id: EP32-S10
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满没有动。她站在那里，握着他的手，眼泪从眼睛里滑下来——但她没有擦。不是因为难过——是因为"被确认了"。她一直以来隐隐感觉到但不敢确认的东西——被他说出来了。两个世界的他——都在想她。一个从三年前开始想她的，在画廊里站在画前一动不动地想念她的人。一个从剧本第一行字开始想她的，此刻正被她握着手的人。她吸了一下鼻子——声音有点抖——但她没有移开视线。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ——那你知道——他是谁吗。
- shot_id: EP32-S11
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满看着他。眼泪还在脸上，但她的表情不再是那种"在寻找答案"的表情了——她已经得到了她想要的答案。现在她做了一件她从来没做过的事——她先笑了。然后她握紧了他的手——不是"握着"，而是"扣紧"——她想让他感受到她掌心的温度。沈长渊低头看着两人交握的手——然后——他终于做了他之前没有做的动作。他回握了。手指轻轻扣住她的。他看着她——不是那种克制着什么的、小心翼翼的注视——是一种坦然的、不需要任何台词来修饰的注视：是的，我在。两个世界的我，都在。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我确认完了。
- shot_id: EP32-S12
  scene_id: SCENE-003
  duration_sec: 8
  camera: i2v_ref 固定镜头→震动效果
  content: 地面开始震动。不是之前那种转瞬即逝的"闪烁"——是持续的、越来越剧烈的震动。桌上的茶盏在托盘上发出碰撞的脆响，书案上的兵书滑落到地上。铜灯盏里的烛火剧烈摇晃——影子在墙上疯狂跳动。窗外的夜空——出现了裂纹。不是云——是天空本身——像玻璃被重击后产生的网状裂缝。林小满下意识地抓紧了沈长渊的手——这次不是出于情感的需要，是一种本能的恐惧。她看向窗外——那些裂纹正在扩大。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ——怎么回事——这不是刷新——
- shot_id: EP32-S13
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 快速切入
  content: 门被猛地推开——太妃站在门口。她没有像往常那样从容地走进来——她是冲进来的。她的头发有些散乱，深紫色的宫装上沾着灰尘——像是从很远的地方跑过来的。她的表情不是愤怒——是恐惧。那种她努力用愤怒掩盖但压不住的恐惧。她看着屋子里的两个人——看着他们握在一起的手——然后她的目光落在沈长渊身上——他的眼神。那双眼睛里有一种他从未有过的光芒。太妃倒吸一口冷气。
  characters:
  - CHAR-005
  dialogue: 你——你做了什么——
- shot_id: EP32-S14
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃看着沈长渊。沈长渊也看着她。他们之间有一种林小满看不懂的交流——太妃的目光从他的眼睛移到他的手上——那枚玉佩——腰间挂着的青白玉佩——正在微微发光。太妃的脸色彻底变了。她后退了半步——然后转向林小满，声音里混合着愤怒和绝望。
  characters:
  - CHAR-002
  - CHAR-005
  - CHAR-001
  dialogue: 你让他觉醒了——你知道吗——完全觉醒——！
- shot_id: EP32-S15
  scene_id: SCENE-003
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 太妃的话音刚落——天花板开始掉落碎片。不是灰尘——是大块大块的石片和木屑。窗外，天空的裂缝正在蔓延到整个视野——像一面被砸碎的镜子，裂纹向四面八方延伸。桌上的烛台倒了——烛火灭了——但房间里没有变暗——因为裂隙里透进来一种奇怪的、不属于这个世界的光芒——白色的、刺目的、像现实世界的白光。林小满在混乱中看向沈长渊——他也看着她。他们的手还握着。太妃在喊着什么——但声音被崩塌的轰鸣淹没了。林小满张了张嘴——想说什么——但声音出不来。沈长渊看着她——在崩塌的世界里，他做了一个选择——他握紧了她的手。然后他说了三个字——声音被崩塌声淹没——但他的口型清晰可见。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-005
  dialogue: 钥匙觉醒——门就在打开——世界撑不住了——
