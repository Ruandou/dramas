  content: 清晨的阳光透过半开的窗帘照进房间。林小满趴在桌上——脸颊枕在交叠的手臂上，笔记本电脑屏幕已经暗了，呼吸灯还在缓缓闪烁。桌上一片凌乱——剧本手稿散落，咖啡杯里的残渣已经干在杯底，便利贴从显示器边缘掉了几张在地上。她慢慢抬起头——眼睛干涩，脖子僵硬——完全是一夜趴睡导致的酸痛姿势。她眨了眨眼，看着面前熟悉的房间——这是她的房间。她的电脑。她的杯子。她恍惚地伸手摸了一下电脑——确认它是实物。不是梦里的那种"摸得到但不确定是否真实"的感觉——这是一个真实的、硬邦邦的物理世界。
  characters:
  - CHAR-001
  dialogue: 回来了……？
- shot_id: EP31-S02
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 镜头推近后拉远
  content: 林小满下意识地摸了摸左手腕——一个习惯性动作，想确认那个印记还在不在。她低头看——愣住了。手腕内侧的皮肤上，淡金色的数字纹身清晰可见：41。不是梦。不是熬夜产生的幻觉。印记还在。她用手指触碰它——皮肤表面平滑，但触碰时有极轻微的温热感从印记区域传来。她撩起袖子看了一眼更完整的显示——"41天23小时"——和昨天一模一样。她的呼吸慢了下来——不是恐惧——是一种更复杂的情绪：验证了。那个世界是真实的。
  characters:
  - CHAR-001
  dialogue: 还在——
- shot_id: EP31-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满一把抓起桌上的手机——按亮屏幕。微信图标上有未读消息。她点开——是房东的对话框。最后一条消息的时间是"昨晚11:23"——和她在剧本世界收到的那条对得上。一条文字消息，没有任何特殊。她盯着屏幕看了三秒——突然站起来——椅子向后推开发出刺耳的摩擦声。她抓起钥匙冲出房门。动作太快太突然——手机差点从手里滑落。
  characters:
  - CHAR-001
  dialogue: 昨晚11:23——没错——他真的发了——
- shot_id: EP31-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头跟随摇移
  content: 走廊。旧公寓的水泥地面，墙皮有些地方剥落了。林小满的脚步声在走廊里回响——她穿着拖鞋跑出来了，头发还没整理，卫衣皱巴巴的。她从自己的房间门口跑过一扇又一扇门——这栋楼她住了快两年，但从来没有认真看过走廊尽头那扇门。它总是关着的——她甚至不确定那是不是房东住的房间。但她现在知道了——那是必须打开的一扇门。
  characters:
  - CHAR-001
- shot_id: EP31-S05
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满站在走廊尽头的门前。门上没有门牌号——只是一扇深棕色的普通木门，门框上方的墙漆比周围白一个色号，暗示这里曾经挂过什么东西。她站在门前，手伸向门板——但停在半空中。两年了。她住在这里两年了——从没敲过这扇门。房租每个月自动扣款，租房合同上签着"沈长渊"三个字，但她从未见过他。她深吸一口气——不是紧张——是在确认自己真的要这么做。然后她敲了下去。三声。不太重——但足够清晰。
  characters:
  - CHAR-001
  dialogue: 两年——从来没敲过——
- shot_id: EP31-S06
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 门开了。但不是沈长渊。一个老人站在门口——七十岁左右，穿着旧毛衣，头发花白，眼神温和。他手里拿着一副老花镜，看起来正在看东西被打断了。他看着门口站着的这个年轻人——头发乱糟糟的，穿着皱巴巴的卫衣和拖鞋，表情里有种急切的期待——期待在看到他的脸之后迅速落空。老人没有表现出不悦——只是平静地打量着她："姑娘，你找谁？"林小满愣住了。她的嘴微微张开——准备好的话在喉咙口卡住了。
  characters:
  - CHAR-001
  dialogue: 我——我找——沈先生——
- shot_id: EP31-S07
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 老人听完林小满的话，点了点头——眼神里有种"果然如此"的了然。不是惊讶——是一种"你终于来了"的确认。他开口说话时语速很慢，像在回忆："沈先生啊——上个月就搬走了。"林小满的瞳孔微微收缩。上个月？她下意识地回想——上个月她在剧本世界里度过了几十天——但现实世界只过了不到一周？还是说现实世界的时间流速也和剧本世界一样不同步？她脑子在快速计算——但算不清。老人继续说："他说要出一趟远门——走得很急。"
  characters:
  - CHAR-001
  dialogue: 沈先生上个月就搬走了。
- shot_id: EP31-S08
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头→缓推至信件特写
  content: 老人听到林小满的问题，没有立刻回答。他看着她——目光里有一种"我就知道你会问这个"的了然。然后他转身走进屋内。林小满站在门口等——心跳很快。走廊的光线照进门内一小块地板，能看到屋内很整齐——不像有人住的样子。几十秒后，老人走回来了。他手里拿着一个牛皮纸信封——普通大小，没有贴邮票，没有写地址。他把信封递给她时，动作很轻——但这个动作本身很有分量。林小满接过信——手指碰到信封纸张的瞬间，她感觉到了一种说不清的"对"——这封信是留给她的。她低头看信封——正面用钢笔写着一行字。
  characters:
  - CHAR-001
  dialogue: 他走之前说——如果你来找他——就把这个给你。
- shot_id: EP31-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满低头看着信封。正面是钢笔写的一行字——字迹瘦硬有力，笔画干净，是她见过的那种风格：沈长渊的笔迹。她从剧本世界的信件和日记里认得这个字迹。信封上的字只有五个字——"第42天打开"。她盯着这五个字看了很久。然后她抬头看了看老人——老人已经退回门内，正要关门。她低头看手机——屏幕上是日期。第41天。第41天。她提前一天收到了信。他算准了她会来——在第41天。门在老人面前缓缓关上。林小满站在走廊里，一手握着信，一手握着手机——信封上写着明天才能打开，但她的心跳告诉她：不用打开，她已经知道了。他知道她会来。他算好了时间。他在等她。
  characters:
  - CHAR-001
