  camera: i2v_ref 固定镜头
  content: 崩塌停下了。一切都静止了——没有震动、没有碎裂声、没有裂隙里透出的白光。沈长渊的书房还在——但有什么东西变了。墙上竹帘的颜色不再是青翠的竹绿——是一种灰扑扑的、褪了色的黄。桌上的铜灯盏失去了温润的金色光泽——变得暗淡。整个世界像一张被水洗过太多遍的照片——所有的饱和度都被抽走了一层。林小满和沈长渊仍然站在原来的位置，手还握着——但她的表情在环顾四周后凝固了。她慢慢松开他的手，走向窗边，伸出手触碰那褪色的竹帘——指尖所及之处，颜色没有回来。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 停……停了……
- shot_id: EP33-S02
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满从窗边转过身，重新看向沈长渊。她盯着他的眼睛——不是那种随便看看——是在确认什么。确认他还记得。确认他没有像这个世界一样"褪色"。沈长渊站在褪色的书房里，玄色锦袍上沾着崩塌时的灰尘，但他的眼神很清晰——不是空洞的。他迎上她的目光，主动开口——像是知道她在担心什么。他的声音平稳，带着一种"别担心我"的确定。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你——还记得吗。——全部？
- shot_id: EP33-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 门被推开了——准确地说是被撞开的。赵景和踉跄着走进来。他的明黄色龙袍上沾满了崩塌时的灰烬和碎石，金冠歪了，几缕头发散落下来。但他的眼神不是痛——是迷路。他站在门口，看着房间里的两个人——像是在看陌生人——又像是在努力回忆什么。他张了张嘴，又闭上。他低头看了看自己身上的龙袍——像是第一次看到一样——露出了困惑的表情。然后他抬起头，用一种完全陌生的语气开口。
  characters:
  - CHAR-007
  dialogue: 这——这是哪儿——
- shot_id: EP33-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满快步走到他面前，半蹲下来与他对视。她的声音尽量放轻——像对受惊的孩子说话。赵景和看着她，很努力地、很努力地想从记忆里捞起什么——但捞起来的只有碎片。他说出自己的名字时，语气不是确认——是在询问。
  characters:
  - CHAR-001
  - CHAR-007
  dialogue: 景和——你好好看看我——我是林小满——
- shot_id: EP33-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 又是一阵急促的脚步声。翠微从走廊那头跑过来，鹅黄色的衫裙在褪色的世界里显得格外突兀——不是因为鲜艳，是因为连她衣服上的黄色都变得暗淡了。她在门口停下，看到林小满——她的表情亮了那么一瞬间——但那一瞬间之后，是一种更深的困惑。她歪着头看着林小满，像在看一个"应该认识但想不起来"的人。她努力笑了一下——但那笑容里有种茫然的客气。
  characters:
  - CHAR-004
  dialogue: 姑——姑娘——你——你是——
- shot_id: EP33-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满直起身，看着翠微。这是她最亲密的盟友——第一个跟她说话的纸片人，陪她吐槽太妃、一起复盘线索、一起笑一起怕的人。现在翠微看着她，目光是空的。林小满的喉咙紧了一下。她深吸一口气，尽量让声音正常。翠微还是歪着头，努力了半天——然后摇头，带着歉意笑了——像在说"对不起，我真的想不起来"。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 我是林小满。你叫我小姐。——你是翠微。我的丫鬟。——最好的朋友。
- shot_id: EP33-S07
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃走进来——不是冲进来的，不是跑进来的。她是慢慢走进来的。她的深紫色宫装在褪色后显得更暗了——像干涸的血迹。她的表情不是林小满预想中的愤怒——是一种平静过头的、像是早已预知一切的疲倦。她走到房间中央，环顾四周——褪色的竹帘、褪色的铜灯、褪色的赵景和和翠微——然后是林小满和沈长渊。她停在沈长渊面前，看了他一会儿——不是审视，是确认——然后她转向林小满，开口。
  characters:
  - CHAR-005
  dialogue: 看到了吗。——这就是觉醒的代价。
- shot_id: EP33-S08
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满看着她，等待更多。沈长渊站在林小满身边，没有插话——他知道太妃要说的东西不是他能反驳的。太妃没有让他们等太久。她的声音平稳，不带情绪——像在宣读一个无法改变的规则。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-005
  dialogue: 代价——什么代价——你说清楚——
- shot_id: EP33-S09
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 太妃走到窗边，背对着他们说话。她的声音从褪色的光影里传来——没有转身。但她的话比转身更重。沈长渊问出那个问题。太妃终于转回身——她的目光不是看着沈长渊，而是看着林小满。她知道这个问题对谁最残忍。她顿了一下——不是犹豫，是一种"你确定要听吗"的沉默——然后说了出来。林小满的呼吸在那一刻停住了。
  characters:
  - CHAR-002
  - CHAR-005
  dialogue: ——如果完全觉醒呢。
- shot_id: EP33-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃走向林小满。不再隔着距离说话——她走到她面前，离得很近。她的声音压低了——不是威胁，是一种"我只说一次"的郑重。林小满微微张了张嘴，但没有发出声音。沈长渊站在几步之外——他的手无意识地握紧了腰间的玉佩（PROP-004），但没有上前打断。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你现在有两个选择。第一——放弃他。让他回到未觉醒状态。他的记忆会清空——但这个世界会恢复。
- shot_id: EP33-S11
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃放下手。她的声音更轻了——不是因为温柔，是因为接下来的话她自己也不想说。林小满没有回答。她只是站在那里——身后是褪色的世界、失忆的赵景和、茫然的翠微——身边是握紧玉佩的沈长渊。太妃等了三秒——然后补充了一句——这句话不是选择的一部分，是她自己的经验。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-005
  dialogue: ——第二呢。
- shot_id: EP33-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头→缓推
  content: 太妃说完，没有等回答。她转身走向门口——经过茫然的赵景和时停了一瞬，看了他一眼，然后继续走。门在她身后关上。房间里只剩下寂静——和褪色的黎明。林小满站在那里。她的目光从太妃消失的门缝上移开——慢慢转向沈长渊。他仍然站在几步之外，握着玉佩。他没有说"你选吧"——没有给任何压力。他只是站在那里，看着她——像在说"无论你选什么，我都在"。林小满的目光越过他——看到墙角赵景和蹲在地上，用手指在地上画圈，嘴里念念有词："朕是谁——朕到底是谁——"——看到翠微站在窗边，茫然地拨弄着褪了色的竹帘，像在找什么她忘了的东西。然后她的目光回到沈长渊脸上。她张了张嘴——没有发出声音。她的手——从崩塌开始时就没有松开
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-007
  - CHAR-004
  - CHAR-005
  dialogue: 他们——忘记了。
