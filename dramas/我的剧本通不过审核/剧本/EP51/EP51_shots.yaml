  camera: i2v_ref 镜头推近
  content: 林小满的睫毛微微颤动。她的脸侧枕在白色病床枕头上，齐肩黑发散开在枕面上，几缕碎刘海贴着额头。病房的白炽灯在天花板上发出均匀的嗡鸣，日光透过半拉的淡蓝色窗帘在地板上投下一道暖白的光线。她缓缓睁开眼睛——瞳孔先是失焦，然后慢慢聚焦。她的目光带着茫然，像是一个长久沉在水底的人终于浮出水面，还不确定自己在哪里。
  characters:
  - CHAR-001
- shot_id: EP51-S02
  scene_id: SCENE-015
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的视线从天花板移到床边——橙姐坐在病床旁的折叠椅上，深蓝色西装外套搭在椅背上，白色衬衫袖子卷到手肘，手里握着手机屏幕正亮着，像是在回复工作消息。她似乎感觉到了林小满的目光，猛地抬起头——那双平时干练犀利的眼睛现在红红的，眼周有明显的红晕和浮肿。她张了张嘴，声音带着压不住的沙哑和一丝庆幸。
  characters:
  - CHAR-008
  dialogue: 醒了？
- shot_id: EP51-S03
  scene_id: SCENE-015
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满试图撑起身子，手臂发软，手肘在床单上滑了一下。她低头看自己——身上穿着病号服，宽大的浅蓝色条纹上衣，手腕上还贴着输液后的棉球胶带。她的意识像沉在水底的石头正在慢慢上浮——记忆碎片纷至沓来：作者空间的纯白、第1个编剧消散的身影、涌入脑海的世界脉络……然后是一片空白。她抬起头看橙姐，眼神里带着问号。
  characters:
  - CHAR-001
  dialogue: 我……睡了多久？
- shot_id: EP51-S04
  scene_id: SCENE-015
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 橙姐深吸一口气，像是要把最艰难的部分先说掉。她伸手从床头柜上拿起林小满的笔记本电脑——银色机身，A面贴满贴纸，屏幕合着。她把它放在林小满面前的被子上，动作很轻，像捧着一件易碎品。然后她开口了，一字一句，努力保持平静但声音还是微微发抖。
  characters:
  - CHAR-008
  dialogue: 三天。你昏迷了三天。
- shot_id: EP51-S05
  scene_id: SCENE-015
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满的瞳孔骤然收缩。"最后一页是我倒下去的那一幕"——这句话像一盆冷水浇醒了她。她猛地伸手去摸枕头边——手机不在。她急切地掀开被子，动作慌乱，输液的留置针在手腕上扯出一阵刺痛，她没管。橙姐从床头柜抽屉里拿出她的手机递过去。林小满接过，手指在屏幕上快速滑动——通知栏干干净净，没有未接来电，没有新消息，没有微信提醒。她打开通话记录——最近的拨出电话是三天前打给"房东"的。她按下拨号键，把手机贴到耳边。听筒里传来机械的女声——
  characters:
  - CHAR-001
  dialogue: 我手机呢？
- shot_id: EP51-S06
  scene_id: SCENE-015
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 特写林小满的表情——她的脸色在那一声"空号"的提示音中一点一点变白。她不相信地拿下手机，挂断，重新拨号——又听了一遍完整的空号提示。然后她打开微信，翻到房东的聊天框——最后一条消息是三天前她发出去的"沈先生，我钥匙忘带了您方便开一下门吗？"——消息旁边是一个红色的感叹号：对方已不是您的好友。她的拇指悬在屏幕上，微微颤抖。橙姐看着她的表情变化，满是困惑。
  characters:
  - CHAR-008
- shot_id: EP51-S07
  scene_id: SCENE-015
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满抬起头看橙姐。她的嘴唇动了动，像是要问什么，又不敢问。她深吸一口气，终于开口了——声音很小，像害怕答案。
  characters:
  - CHAR-001
  dialogue: 橙姐……你知道我房东叫什么名字吗？
- shot_id: EP51-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 公寓一楼楼道。老旧的白炽灯在头顶发出嗡嗡声，墙壁上贴着褪色的物业通知。林小满穿着宽松的病号服和一件不合身的深蓝色女士西装外套（橙姐的），光脚踩着一双医院的一次性拖鞋，快步走过转角。她的视线锁定在走廊尽头那一排银灰色储物柜上——07号柜子在中间位置，和其他柜子长得一模一样，毫无特别之处。她站定在07号柜前，呼吸急促。从口袋里掏出那把铜质钥匙——钥匙柄上刻着"07"（`PROP-009`），齿痕不规则，是她从沈长渊·现实那封信里得到的。她的手在微微发抖，钥匙齿对了好几次才插进锁孔。
  characters:
  - CHAR-001
  dialogue: 不要空……不要空……
- shot_id: EP51-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 钥匙转动——咔哒一声。锁开了。林小满深吸一口气，伸手拉开柜门。柜子里——空空荡荡。银灰色的金属内壁反射着楼道顶灯的光线，干干净净，连一粒灰尘都没有。没有手机、没有信、没有画——什么都没有。她站在那扇敞开的柜门前，保持着拉门的姿势一动不动，像一尊雕塑。楼道里只有白炽灯的嗡鸣声。过了好几秒，她才慢慢松开门把手，那一声轻响在安静的走廊里格外清晰。
  characters:
  - CHAR-001
  dialogue: ……没了。
- shot_id: EP51-S10
  scene_id: SCENE-001
  duration_sec: 10
  camera: i2v_ref 镜头跟随
  content: 林小满关上空柜门，转身走向楼道尽头的公共区域——那里有一面穿衣镜，老旧的椭圆形木框镜子，镜面有些许划痕和斑驳，就挂在消防栓旁边的墙上。她记得这面镜子——她曾站在这里，看到镜中的自己穿着古装，看到镜面泛起涟漪般的波动，那是通往夹缝的入口。现在她站在镜子前——镜中映出她憔悴的面容：苍白的脸、凌乱的头发、病号服外面套着不相称的西装外套。她伸出手，指尖触碰冰凉的镜面——没有涟漪，没有波动，只是普通的玻璃反射着她的手指。她用指节敲了敲镜面——笃笃笃——坚硬的、普通的玻璃声。什么也没有发生。
  characters:
  - CHAR-001
  dialogue: 之前在这里……明明是通的。
- shot_id: EP51-S11
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的出租屋房间。傍晚的阳光从半开的窗户斜照进来，在地板上投下一道暖金色的长方形光线。桌上的布局和她离开时差不多——马克杯里残留的咖啡渍已经干成了深褐色的圆环，几本参考书散开着，稿纸散落在桌面各处。她坐在桌前，笔记本电脑已经打开（`PROP-001`），屏幕的冷光映在她脸上。她的手指放在键盘上，但没有敲字。她正在读——屏幕上是一个打开的Word文档，《燕京奇缘》剧本。她翻到最后一页——正如橙姐所说，场景描述写着"林小满倒在地上，电脑屏幕还亮着"。
  characters:
  - CHAR-001
- shot_id: EP51-S12
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 镜头推近
  content: 她的目光在屏幕上行间扫过。她开始用鼠标向下滚动页面——文档末尾应该只有最后一页的场景描述。但滚轮转动时，页面继续向下翻了一行——下面还有内容。她停下了。鼠标指针悬停在滚动条最下方，那个通常意味着"文档结束"的位置下方，还有一小段文字。她的呼吸屏住了。她慢慢往下挪了一行——一段不在她记忆中的文字出现在屏幕上。每一个字都刺进了她的眼睛。
  characters:
  - CHAR-001
  dialogue: 等等——下面还有？
- shot_id: EP51-S13
  scene_id: SCENE-001
  duration_sec: 7
  camera: i2v_ref 缓推
  content: 笔记本电脑屏幕的特写。Word文档的白色页面上，在剧本的最后一个句号之后，隔了两个空行，出现了两行文字。字体的行间距、字形都和前面的剧本不同——不是她常用的微软雅黑，而是另一种字体，笔画更硬朗，像是一种仿宋体。文字只有两行，没有标点，干净得像刻上去的：
  characters:
  - CHAR-001
- shot_id: EP51-S14
  scene_id: SCENE-001
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的脸被屏幕光照亮，眼睛里有光在跳动——不是屏幕的反光，是她眼眶里正在积聚的泪水。她就这样盯着屏幕，一动不动。过了好几秒，她深深地吸了一口气——不是深呼吸那种平稳的吸气，而是一个人在压住情绪时那种微微发抖的吸气。她抬起手，用指背快速抹了一下眼角。然后她的眼神变了——不再是茫然和失落，而是一种确定的、坚定的光。她的嘴角动了一下——不是笑，是一个人终于知道该做什么时的表情。她低头看了一眼左手腕——已经没有倒计时印记了，但她的目光还是在那里停了一秒，像是老朋友告别。然后她抬起头，目光落在电脑屏幕上那两行字上，嘴唇微微翕动，没有发出声音。
  characters:
  - CHAR-001
  dialogue: 你在等我。
