- shot_id: EP39-S01
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 春日御花园，花仍然开着，但一切都静止得不自然。赵景和快步走到翠微面前，伸手想去拉她的手——翠微后退了一步，眼神是陌生的。她警惕地看着他，像在看一个陌生人。鹅黄色的裙摆因为后退扫过地上的落花。
  characters:
  - CHAR-007
  - CHAR-004
  dialogue: 翠微！你还好吗？是朕——
- shot_id: EP39-S02
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和的手僵在半空中。翠微的眼神里没有任何熟悉——那个会喊"小姐你清醒一点"的活泼丫鬟，现在只是一个惊恐的宫女。赵景和的手慢慢放下来。林小满在远处的回廊下看到这一幕——她捂着嘴，眼眶红了。阳光照在翠微茫然的面孔上，风吹动她鬓边的碎发，但她没有笑。
  characters:
  - CHAR-007
  - CHAR-004
  dialogue: 你……不记得朕了？
- shot_id: EP39-S03
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 二层木楼上，红灯笼安静地挂着。苏晚晴站在柜台前——不是她平时意气风发的样子，而是一个迷茫的女子，茫然地看着账本。林小满快步走进来，手里拿着一份皱巴巴的企划书——是她帮苏晚晴写的那份。她把企划书放在柜台上。
  characters:
  - CHAR-001
  - CHAR-006
  dialogue: 晚晴——这是你的商业企划书。你看看——你写的连锁方案。
- shot_id: EP39-S04
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满独自站在空荡荡的酒楼里。手中的企划书滑落在柜台上。二楼空无一人，红灯笼在风中微微摇晃。她闭上眼，深吸一口气——然后转身往外跑。
  characters:
  - CHAR-001
  dialogue: 不——赵景和——还有一个——
- shot_id: EP39-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满跑进书房，门被推开撞在墙上。暮色从竹帘缝隙中透进来，房间里昏暗。她双手撑着书桌，头发散乱，眼眶通红但没有眼泪——还没到哭的时候，还在确认最后一件事。
  characters:
  - CHAR-001
  dialogue: 赵景和——他——
- shot_id: EP39-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 林小满终于哭了出来——不是抽泣，是那种憋了很久、撑不住了的嚎啕大哭。她蹲下来，额头抵着桌面。左手腕内侧的倒计时印记（`PROP-006`）在暮色中隐约闪烁着淡淡的金色微光。沈长渊从窗边走过来，在她面前站定——他很高，俯视着她，但目光不是俯视。他安静地站了一会儿——没有说"别哭了"，没有说"会好的"。然后他蹲下来，和她平视。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我写了那么久……全部……她一键就删了……
- shot_id: EP39-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊没有立刻回答。暮色在他身后铺开，他的侧脸一半在光里一半在阴影中。他看着她的眼睛，目光里有林小满以前没注意到的东西——一种不属于"被写的角色"的清醒。
  characters:
  - CHAR-002
  dialogue: 因为我不是她写的。我是我自己醒过来的。
- shot_id: EP39-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满慢慢直起身子，用袖子胡乱擦了一下脸。她看着他——突然明白了什么。她的眼睛不哭了——开始想事情。她看着沈长渊，目光里带着一种重新聚焦的光。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: ——所以……靠自己觉醒的东西——才没人能拿走？
- shot_id: EP39-S09
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊站起来，走到窗边。竹帘外的暮色已经变成了深蓝。他没有回头，声音很平静——像是在说一件普通的、确定的事。
  characters:
  - CHAR-002
  dialogue: 那就重写。
- shot_id: EP39-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站起来，和他对视。书房里没有点灯，暮色让一切都变成剪影。沈长渊的声音在暗色中格外清晰——每一句话都像石子在平静水面上打水漂，一圈一圈的涟漪。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 让翠微自己选择要不要想起他。让苏晚晴自己决定要不要开酒楼。让赵景和自己学会当皇帝。——你替他们走的路，太妃一键就删了。
- shot_id: EP39-S11
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 沈长渊走近一步。房间里很暗，只有窗外最后一缕暮色的光照在他的侧脸上。他的眼睛在暗光中很亮。他看着她的眼神——不是编剧看角色，不是纸片人看造物主——是两个人之间的对视。他说出的每一个字都掷地有声。林小满站在他对面，眼泪干了，呼吸慢慢平稳了。她看着他——她在听。
  characters:
  - CHAR-002
  - CHAR-001
  dialogue: 他们不是空白。翠微会重新爱上他——不是因为你写得好，是因为她本来就会。苏晚晴会去开酒楼——不是因为你给了她企划书，是因为她本来就是那样的人。
- shot_id: EP39-S12
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 镜头推近→固定
  content: 纯白的作者空间。没有桌子，没有网格——只有漂浮的文字碎片在她周围旋转。林小满站在正中央，眼睛闭着，呼吸平稳。她睁开眼——面前浮现出一排排透明的"属性面板"，像半透明的光屏悬浮在半空中。每个面板上有一个角色的名字：翠微、苏晚晴、赵景和、太妃……每个面板的"自由意志"一栏都显示着灰色的两个字：「关闭」。林小满伸出手——手指触碰到翠微面板上的「关闭」二字——两个字开始发光。她没有犹豫——用力一划——像滑动手机屏幕的开关一样。两个字从「关闭」变成了金色的「开启」。然后——苏晚晴的——「开启」。赵景和的——「开启」。一个个面板依次亮起金光。整个作者空间开始微微震动——文字碎片加速旋转，然后——白光吞没了
  characters:
  - CHAR-001
  dialogue: 你们不是我写的角色。
