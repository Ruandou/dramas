shots:
- shot_id: EP49-S01
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 纯白空间寂静无声。第1个编剧缓缓收回伸出的手，在桌边拉过一张椅子坐下——那张椅子像是空间感知到他的意图而自动出现的，木质的现代简约款，和整个空间的抽象感形成微妙的对比。他坐下后，双手交叉放在桌上，身体微微前倾。林小满还站在原地，像一棵刚被风暴吹过的小树，还没有完全站稳。她看着他的动作，迟疑了一瞬，然后在他对面坐下。两人隔着一张木桌，桌上是那台合着屏幕的银色笔记本电脑（`PROP-001`）。
  characters:
  - CHAR-001
  dialogue: 你想从哪里听起？
- shot_id: EP49-S02
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧微微仰起头，目光穿过纯白的空间，像是看到了七年前的画面。他嘴角浮起一丝浅浅的笑意——不是得意，是怀念。他的目光里有一种奇异的温暖，像是隔着时间的长河，在看一个已经模糊但依然发光的记忆。风衣领口有些磨损，洗白衬衫的袖口边线也散了几根——这些细节在柔和的无影光下格外清晰，像是这件衣服陪了他很久很久。
  characters: []
  dialogue: 七年前，我也在杭州。租的公寓比你现在那间还小——窗户朝北，晒不到太阳，墙上全是便利贴。
- shot_id: EP49-S03
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的瞳孔微微收缩——那是她改写了几十版的剧本的原稿。她一直以为《燕京奇缘》是她自己的创作——她熬夜写、被编辑催、改了一版又一版，觉得自己写了无数个版本，原来……源头在这里。她张了张嘴，想问什么，但发现自己不知道从何问起。她只是安静地听着，手指无意识地抠着桌沿的木纹。
  characters:
  - CHAR-001
  dialogue: 《燕京奇缘》……我一直以为是我自己写的。
- shot_id: EP49-S04
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头缓缓推进
  content: 第1个编剧的表情变了——那些温和的笑容褪去，露出底下一层更深的情绪。他的目光变得专注而遥远，像是回到了七年前那个决定性的时刻。他放在桌上的手指微微蜷缩了一下。纯白空间中漂浮的文字碎片在无人注意的角落里轻轻震颤，像在共鸣。
  characters: []
  dialogue: 但有一个问题——我太爱这个故事了。每一个角色、每一条线、每一处景致……我都舍不得。
- shot_id: EP49-S05
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的表情从困惑到震惊再到一种缓慢的理解。她想起了翠微第一次吐槽她台词时的样子、想起了沈长渊说"你写的我太蠢了"的表情、想起了太妃说"本宫见过的编剧比你的思路多"——那些不是bug，是feature。这个世界从一开始就是被设计成"活的"。她的手从桌沿滑下，垂在膝上，整个人好一会儿没说话，只是在消化这个事实。
  characters:
  - CHAR-001
  dialogue: 所以——不是bug……是设定？
- shot_id: EP49-S06
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 第1个编剧的表情在那一瞬间出现了一道裂缝——不是崩溃，不是悲伤，是一个人被一句话说中了最柔软的地方时，无法伪装的那种反应。他低了低头，过了好几秒才重新抬起来。他的眼眶微微泛红，但他没有让眼泪掉下来——七年没有掉过。他笑了笑，那笑容里带着七年的温度和重量。风衣领口那几根散开的线头在柔和的光线下微微颤动——像是他本人一样，即将散线但还在撑着。
  characters: []
  dialogue: 代价是——我出不去了。
- shot_id: EP49-S07
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的手不自觉地攥紧了衣袖。她的表情里有一种复杂的情绪——心疼这个守了七年的陌生人，但更多的疑问像潮水一样涌上来。她深吸一口气，问出了第二个她必须知道答案的问题。
  characters:
  - CHAR-001
  dialogue: 那沈长渊呢？你说他是你拉进来的'锚'——你是怎么选中他的？
- shot_id: EP49-S08
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧听到"沈长渊"这个名字时，表情变得柔和了——那种柔和不是对一个工具的情感，是对一个真实的人的温柔。他沉默了片刻，像在回忆什么很久远但很清晰的画面。他的指尖轻轻敲了一下桌面，发出很轻的笃声。
  characters: []
  dialogue: 沈长渊——那是我在现实世界里见过的最真的人。
- shot_id: EP49-S09
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第1个编剧的身体微微前倾，双手交叉放在桌上。他的目光变得更专注了——不是审视，是一种郑重的注视，像是要说一件他想了很久很久的事。纯白空间的光线似乎微微暖了一度。
  characters: []
  dialogue: 但一个世界不能只靠'锚'活着——它需要生命力。需要一个愿意为它熬夜、为它焦头烂额、为它的角色哭和笑的人。
- shot_id: EP49-S10
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满怔住了。她的眼眶开始发热。不是因为被选中——是因为她突然明白了一切：那些深夜的催稿、那些改不完的大纲、那些"角色不听话"的崩溃……不是她的诅咒，是她被选中的理由。因为她比任何人都在乎这些纸片人。她咬着下唇，努力不让眼泪掉下来。她想起那些熬夜写翠微支线、和沈长渊拌嘴、为太妃写完整前史的时刻——那不是一个编剧在完成任务，是一个人在爱她的角色。
  characters:
  - CHAR-001
  dialogue: 所以——你选中我，不是因为我写得好……
- shot_id: EP49-S11
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 林小满用指背擦了一下眼泪，深吸一口气，然后抬起头来——她的目光变了，不是脆弱，是一种直抵核心的逼视。她看着对面的人，问出了那个她一路走到这里都在回避的问题——从EP08看到房东照片的那一刻起，这个问题就在她心里生了根。她问得很慢，因为这个问题太重。纯白空间里所有漂浮的文字碎片都静了下来，像是整个空间都在等待答案。
  characters:
  - CHAR-001
  dialogue: 沈长渊对我的感情——是你设定的吗？
- shot_id: EP49-S12
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 第1个编剧没有马上回答。他低下头，沉默了好几秒——不是犹豫，是在确认自己要如何说，才能让这句话的分量完全落到实处。当他抬起头时，他的表情里没有得意、没有回避——只有一种平静的、带着温暖的确信。他向前微微探身，语气温柔得像在安慰一个等了太久答案的孩子。纯白空间中，那些漂浮的文字碎片重新开始缓缓旋转，像松了一口气。
  characters: []
  dialogue: 小满。
