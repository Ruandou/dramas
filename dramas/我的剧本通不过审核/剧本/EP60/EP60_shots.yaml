  camera: i2v_ref 固定镜头
  content: 边界空间里，林小满坐在椅子上，看着对面的太妃。太妃的双手交握在胸前，眼眶还红着，但嘴角带着期待的笑容——那个笑容里有眼泪、有希望、有"我真的可以吗"的不确定。林小满看着那个表情——她认得这个表情。这是一个人把自己最脆弱的愿望摊开来放在你面前的表情。她深吸一口气，然后笑了——不是编剧的苦笑，不是穿越者的紧张笑，是一个创作者在面对一个"好故事"时控制不住的、发自心底的笑容。
  characters:
  - CHAR-001
  dialogue: 好。
- shot_id: EP60-S02
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满闭上眼睛——然后睁开。她伸出手，在空中做了一个"打字"的手势——就像在敲击一个看不见的键盘。她一边"打字"一边开口——不是对着太妃，像是在对自己说话——像一个创作者在构思时自言自语。她的语速变快了——那是她进入创作状态时的节奏。太妃的身体微微前倾，双手紧紧交握——像是一个等待圣诞礼物的小女孩。沈长渊在侧边，嘴角带着一个极淡的笑意——他见过林小满写故事的样子，见过她熬夜码字、碎碎念地吐槽自己的剧情——现在他又看到了这个状态。
  characters:
  - CHAR-005
  dialogue: 太妃娘娘的茶馆日常——第一场。
- shot_id: EP60-S03
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满继续在空中"打字"——她的手指在无形的键盘上跳跃。随着她的"敲击"，边界空间的边缘开始出现变化——不是直接出现画面，而是像水彩在纸上晕开一样，有淡淡的暖杏色从空间的边缘渗入。光线开始变化——从均匀的中性光，慢慢染上了一层温暖的金色。太妃的目光跟着那些色彩移动——她的嘴唇微微张开，像是一个人在看一场为自己举办的魔术表演。
  characters:
  - CHAR-001
  dialogue: 茶馆不大——摆了四张竹桌，桌上一套青瓷茶具。
- shot_id: EP60-S04
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的眼眶又红了——但不是伤心的红，是"被看见了"的那种红。她听着林小满描述那个"穿暖杏色衣裳的老板娘"——她知道那个人就是自己。她低头看了看自己身上的深紫色织金宫装——那件她穿了一整部剧的衣服。然后她抬起头，目光穿过林小满的肩膀，落在边界空间的外围——那里，暖杏色的光已经晕开了一大片，像是一扇正在打开的门的形状。她的声音哑了——不是哭哑的，是"原来我也可以被这样写"的那种哑。
  characters:
  - CHAR-005
  dialogue: 暖杏色？
- shot_id: EP60-S05
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 画面从暖杏色的光晕中清晰起来——一间温暖的茶馆完整地呈现眼前。暖杏色的木制门面，竹桌竹椅整齐地摆放着，桌上摆着青瓷茶具。柜台后方的木架上码着一排排陶瓷茶罐，一个铜壶在小炉上冒着白烟。茶馆的光线温暖而明亮——阳光透过纸糊的窗棂洒进来，在木地板上投下温柔的格子光影。太妃站在柜台后面——她的姿势和刚才在边界空间里端庄的坐姿完全不同：她微微倾身，一只手按在柜台上，另一只手端着一只刚沏好的茶杯，姿态自然——像她本来就属于这里。不是那个深紫色宫装的反派——是穿着暖杏色衣裳、头发简单挽起的茶馆老板娘。
  characters:
  - CHAR-005
  dialogue: 老板娘——太妃——正在给第一桌客人沏茶。
- shot_id: EP60-S06
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶馆的账台边，翠微坐在一张高脚凳上，手里拿着一把算盘——不是道具，是真的在算账。她穿着鹅黄色的短衫长裙，双丫髻上系着彩色发带，一脸认真地拨动着算盘珠子——然后抬头，对柜台后的太妃露出了一个灿烂的笑容。她竖起一根手指——"赚了"。太妃端着茶壶，看到那个表情——嘴角微微上扬——不是从前那种冷笑，是一个老板看到生意不错的、真实的微笑。
  characters:
  - CHAR-004
  dialogue: 老板娘——今天赚了一两银子！
- shot_id: EP60-S07
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶馆靠窗的座位，赵景和坐在那里——他穿着月白色的常服，没有穿龙袍。他看着窗外，手里端着一杯茶，姿态悠闲。翠微从账台上跳下来，走到他桌前，把一个碟子放在他面前——两碟桂花糕。赵景和抬头看她，带着一个少年气的笑容。他们之间的氛围轻松而自然——不是皇帝和宫女，就是两个普通人在茶馆里过一个普通的下午。
  characters:
  - CHAR-007
  dialogue: 常客赵公子——您的桂花糕，多加了一份桂花蜜。
- shot_id: EP60-S08
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶馆另一角，苏晚晴坐在桌前，面前摊着一本账册和一份写满字的企划书。她穿着一身素雅的月白色衣裙，但袖口卷起了一小截——像是一个做事的人。她抬头看向柜台后的太妃，用笔尾轻轻敲了敲桌面——表情认真，带着商业谈判的专业感。太妃从柜台后看过来，带着"又要谈扩张了"的无奈笑容。
  characters:
  - CHAR-006
  dialogue: 老板娘——隔壁铺子我谈下来了。开分店的钱，我出。
- shot_id: EP60-S09
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 边界空间恢复了原来的中性光线和安静氛围——但空气中还残留着暖杏色的余韵，像是一缕暖香。林小满放下了"打字"的手，轻轻呼出一口气——写完了。她看向太妃——太妃还坐在那把古风红木椅上，但她的姿势变了——她不再是那个挺直背脊、双手交叠放在膝上的端庄太妃。她微微佝偻着背，双手捂着脸——肩膀在轻轻颤抖。不是哭——是笑。她捂着脸笑。笑声从指缝里溢出来——带着眼泪、带着鼻音、带着一种"我没想到"的意外和"原来可以这样"的释然。
  characters:
  - CHAR-005
  dialogue: 哈哈哈哈——
- shot_id: EP60-S10
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃站起来——动作很急，椅子向后推了一点——她绕过桌子，走到林小满面前。林小满抬起头看她——太妃的眼泪还在流，但她的笑容是林小满见过的最明亮的笑容。不是"本宫"的笑，不是反派的笑，不是"角色"的笑——就是一个女人在被写进了一个温暖的故事之后，发自心底的笑。她看着林小满，张了张嘴——想说的话太多，堵在喉咙里出不来。所有的排比句、所有的古风修辞、所有的"本宫"——在这一刻都变得多余了。她只说出了四个字——像是一个人把一生的话压缩成了一句话。
  characters:
  - CHAR-005
  dialogue: 谢谢你——林小满。
- shot_id: EP60-S11
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 太妃站在林小满面前——然后她弯下腰，张开双臂——把林小满拥入了怀中。这是一个在剧本世界里从未发生过的事——一个纸片人主动拥抱了她的编剧。林小满的身体在接触的一瞬间微微僵了一下——不是因为害怕——是因为她感觉到了温度。太妃是有温度的。不是想象出来的温度，是真实的、温暖的、带着淡淡沉香味的体温。她的怀抱不重——像是一个很久没有抱过别人的人，小心翼翼地控制着力道——但她的手在林小满后背收拢时，带着"这辈子第一次被人好好写过"的那种满足感。林小满愣了一下——然后她的身体放松了。她抬起手——轻轻环住了太妃的背。
  characters:
  - CHAR-005
  dialogue: 过来——让本宫——让我抱抱你。
- shot_id: EP60-S12
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 拥抱的特写——太妃的脸靠在林小满的肩头，闭着眼睛——她的眼泪无声地落在林小满淡紫色襦裙的肩部布料上，洇开一小片深色。林小满的手轻轻拍着太妃的背——像在安抚一个终于被理解了的人。这个拥抱持续了几秒——在这个超时空的边界空间里，这几秒像是被拉长了一百倍。然后——有什么在变化。不是突然的——是像水彩在纸上慢慢晕开那样，缓慢而自然——太妃的深紫色衣袖，从边缘开始，一寸一寸地——变成了暖杏色。像是一条被阳光照亮的河流——从深沉的紫色，褪成了温暖的杏子色。光从她的身体里透出来——不是刺眼的亮光，是像晨光一样柔和的光晕，从她身上散发开来。
  characters:
  - CHAR-005
- shot_id: EP60-S13
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 拥抱缓缓结束——太妃直起身，松开手臂。她退后半步——然后她低头看到了自己的衣服。深紫色的织金宫装——已经完全变成了暖杏色。不是被染色，不是被替换——是从布料本身的质感上发生了改变：不再是沉重的织金锦缎，而是柔软的、透着温暖光泽的杏色棉麻质地。金线凤凰牡丹刺绣还在，但颜色从金色变成了淡银——像是凤凰也褪去了威严，变得温柔了。太妃愣住了。她抬起手——摸了摸自己的衣袖——新布料的触感柔软而温暖。她张了张嘴——说不出话。林小满也看到了——她坐在椅子上，仰头看着太妃，眼眶还红着，嘴角却带着一个"我看到了"的笑容。沈长渊在侧边——他看着这一幕，眼神里带着一种安静的惊叹——像是见证了一个他从未见过、也无法用
  characters:
  - CHAR-005
  dialogue: 这是——
- shot_id: EP60-S14
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: ⚠️ 太妃本镜应使用 CHAR-005-L02（蜕变·茶馆老板娘形象）。太妃独自站在边界空间里——她穿着全新的暖杏色衣裳，双手轻轻捧着衣袖，低头看着自己。她的眼泪已经止住了——取而代之的是一种安静的、深沉的满足。她抬起头，目光穿过空间的边界，看向远方——像是看到了那间茶馆，看到了柜台后穿暖杏色衣裳的自己，看到了翠微在算账、赵景和在喝桂花糕的茶、苏晚晴在研究开分店的账册。她微微笑了一下——不是剧本里设定的笑容，不是反派的笑，不是角色被写好后的笑——是她自己的笑。属于"暖杏色太妃"的笑容。
  characters:
  - CHAR-005
  dialogue: 我……不用再当反派了。
