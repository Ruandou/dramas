  content: 太妃的语音消息放完之后——走廊里安静了大约两秒。然后林小满和沈长渊·现实几乎同时——笑了出来。不是礼貌的微笑——是真的、控制不住的笑。林小满笑得弯下腰——一手端着咖啡怕洒了，一手举着手机——肩膀抖得厉害。沈长渊·现实也笑了——他平时温和内敛的笑容此刻也藏不住了——他摘下眼镜擦了擦，重新戴上时笑意还挂在嘴角。他们笑的是同一件事——太妃穿着"前反派，现老板娘"的T恤走在现实世界的街头——那个画面——用太妃自己的话说——"本宫穿了一辈子杏色了"。那件T恤上印着的话，是林小满写的——写在一个古装故事里——现在穿在一个古装角色的身上——走在现实世界的街道上。这个闭环，让两个世界之间的所有距离都在这一刻消
