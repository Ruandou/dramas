- shot_id: EP38-S01
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 御花园的假山旁，春日的阳光透过树梢洒下一地碎金。翠微拉着赵景和快步穿过回廊——赵景和的龙袍下摆被风吹得翻起一角，他一手提着袍角跟着跑，脸上带着"朕好歹是个皇帝"的无奈表情。林小满正站在石桥上，手扶着栏杆——她刚从侯府回来，还在消化沈长渊那句"在两个世界都留下"。翠微冲到她面前，微微喘气，赵景和在后面才追上。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-007
  dialogue: 小姐！我都听说了——太妃同意了对不对？沈公子怎么说？他答应了没有？
- shot_id: EP38-S02
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微听到"答应了"三个字的瞬间——她的表情先是愣了一拍，然后那愣怔变成了一种混合着"太好了"和"果然如此"的复杂表情。她没有欢呼——她知道这意味着什么。她往前走了一步，抓住林小满的手腕——不是那种撒娇的抓法，是有话要说的力度。她的眼睛亮晶晶的——不是因为高兴，是因为她有了一个主意。一个她想了很久、现在觉得时机到了的主意。
  characters:
  - CHAR-004
  dialogue: 小姐——你给我们写了感情线——帮我写了和皇帝的初遇、绣帕、每一场戏——
- shot_id: EP38-S03
  scene_id: SCENE-006
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 翠微压低声音说出了她的计划。赵景和在旁边听着，一开始眉头皱着，但随着翠微一条条说下去，他的眉头慢慢展开了——他开始点头。林小满听着，从犹豫到思考到慢慢接受。御花园的风吹过，假山旁的桃花瓣被风卷起经过他们之间。三个人站在石桥边——春日阳光正好，但他们在密谋一件可能改变世界规则的事。翠微说完后看着林小满，等她点头。赵景和也看着她——他已经准备好了。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-007
  dialogue: 让皇上假装反对——去太妃那边大吵一架——说'朕绝不同意让沈长渊觉醒'——逼太妃跟他争——她在争的时候会漏嘴的。
- shot_id: EP38-S04
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃寝宫的厚重帷幔垂落,铜鹤香炉中沉香袅袅。太妃正坐在软榻上翻阅一卷书册——她难得有片刻宁静。然后脚步声从殿外传来——不是通传的节奏——是硬闯的节奏。赵景和一把掀开帷幔大步走进来，明黄龙袍的袍角翻飞，脸上带着他刻意装出来的——但对他来说不难装的——愤怒。他在太妃面前站定，没有行礼。
  characters:
  - CHAR-005
  - CHAR-007
  dialogue: 皇帝今日怎么有空来本宫这儿——还带着一脸的怒气。
- shot_id: EP38-S05
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和往前逼了一步。他按照翠微教他的——不是演一个"反对觉醒的人"，是演一个"害怕觉醒会毁掉一切的人"。因为"害怕"才是太妃会认真对待的情绪——如果只是反对，太妃会用权力压他；如果是害怕，太妃会用"真相"来安抚他。这是翠微分析出来的。赵景和此刻照着做了——他的声音里带着少年气的颤抖，那是他真实的不安加上演技的放大。
  characters:
  - CHAR-007
  dialogue: 意见大了！你们都没问过朕——钥匙觉醒了世界塌了怎么办？朕的江山怎么办？翠微——她也在这个世界里——她消失了朕怎么办？
- shot_id: EP38-S06
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃站了起来。她的动作不快——但站起来之后，整个寝宫的气压变了。她走到赵景和面前，深紫色的宫装在地面上拖出一道暗影。她的声音没有提高——但每一个字都像在往下沉。赵景和站在她面前，努力不后退——他的手在袖中微微攥紧，但他的目光没有躲。太妃看着他——她以为自己在教育一个不懂事的孩子。她不知道自己在一步一步走进翠微设的陷阱。她要说的话——就是翠微想听的。
  characters:
  - CHAR-005
  - CHAR-007
  dialogue: 你以为本宫为什么要拦了七年——是因为本宫想当恶人吗？
- shot_id: EP38-S07
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃还在看着赵景和愣住的表情——她以为他是被"第一个人还活着"这件事吓到了。她的唇角微微动了一下——像是"你看，我说了你又不信"的那种无奈。然后——她听到了帷幔后面有声音。不是风声。是布料被轻轻拨开的声音——人的手碰到帷幔的声音。她猛地转头——寝宫侧边的深紫色帷幔被人从后面掀开了一角。翠微先走了出来——然后是林小满。翠微手里还攥着帷幔的边角——她一直在那里听着。太妃的目光从翠微移到林小满——她在一瞬间明白了所有。
  characters:
  - CHAR-005
  dialogue: ——你们——在帷幔后面——做什么——
- shot_id: EP38-S08
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微走上前一步——她没有退缩。她站在林小满前面半步的位置——不是挡在她面前，是和她并肩。赵景和也从和太妃对峙的位置退了两步，退到翠微身边——三个人站在一起，面对着太妃。太妃的目光在他们三个人脸上各停了一秒——从赵景和的愧疚回避，到翠微的坦然直视，到林小满的平静注视——她什么都明白了。她慢慢松开按在凤镯上的手指——她的声音在下一秒恢复了那种极轻极冷的压迫感——那是太妃最危险的声音——越生气声音越轻。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: 太妃娘娘——您在说第一个人还活着的时候——声音和平时不太一样——您怕他。不是怕他出来——是怕他被人知道还活着。
- shot_id: EP38-S09
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃安静了一息。寝宫里只有铜鹤香炉中沉香燃烧的细微声音。她低头看了看自己手腕上的凤镯（PROP-007）——金镶翠的镯面在从帷幔缝隙透进来的光影中反射出一道冷光。她伸出手——用另一只手轻轻转动了手腕上的凤镯。一个很轻的动作——但在她转动凤镯的那一刻，寝宫里的光线像被抽走了一层——变得比刚才更暗了一些。她抬起眼。她不再生气了——她进入了那种比愤怒更可怕的状态——冷淡、准确、不留余地。
  characters:
  - CHAR-005
  dialogue: 本宫给了你们角色权限——让你们能自己选择剧情——能自由行动——能爱能恨能有自己的故事——还记得吗。
- shot_id: EP38-S10
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头→镜头推近
  content: 太妃的右手抬起来——手腕上的凤镯（PROP-007）在她的动作中转向光源。金镶翠的镯面上反射出一道刺目的光——然后那光不是反射——是凤镯本身在发光。不是烛火的倒影——是一种从金镯内部透出的、暗金色的光。太妃闭上眼。她的嘴唇微微动了一下——没有声音——像是一个命令不需要说出口也能被执行。凤镯上的金光从镯体扩散开来——像水面上的涟漪一样——波光从她手腕向外荡漾——无声的、不可逆的。
  characters:
  - CHAR-005
  dialogue: 本宫收回——翠微的感情线。
- shot_id: EP38-S11
  scene_id: SCENE-007
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 金光扩散到整个寝宫。不是刺眼的——是一种像水面涟漪一样的、无声的能量波。林小满下意识抬手挡了一下——不是怕光，是一种她无法用语言描述的感觉——像整个世界在她周围被抽走了几层颜色。翠微——在金光穿过她的瞬间——她的表情变了。上一刻她还在坚定地和太妃对视——下一秒她的眼神里出现了一种茫然的空白——像一个人突然忘了自己刚才在想什么。她转头看向林小满——然后看向赵景和——她的目光在他脸上停住了——没有敌意，没有敌意也没有爱意——是一种"我认识你吗"的陌生感。赵景和也在同一刻感觉到了不对——他看向翠微，目光从担忧变成了恐惧——因为他看到了翠微看他时的眼神变成了——空的。翠微不认识他了。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: 小姐——我刚才——我们在哪儿来着——
- shot_id: EP38-S12
  scene_id: SCENE-007
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 太妃放下手腕。凤镯上的金光慢慢消退——像潮水退去一样。她没有再看任何人——她转身走回软榻，坐下来，拿起之前那卷书册——像是刚才什么都没发生过。但寝宫里的一切都不一样了。翠微站在原地，手扶着额头——她记得林小满是小姐，记得自己是个丫鬟——但"赵景和"三个字在她脑子里变成了一个空洞——她知道自己应该认识他，但那个"认识"里没有了温度。赵景和站在两步之外——他想上前又不敢——他的表情是一个17岁少年在面对"她忘了你"时的那种无措。林小满站在中间——她看着太妃的背影——她的声音在安静中响起来。没有愤怒——声音里是一种已经超过了愤怒的冷静。她在评估损失——然后决定下一步。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: 第一个编剧——在夹缝里——你还知道多少。
