- shot_id: EP59-S01
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 边界空间的光线柔和而均匀——没有阴影。林小满从空气中浮现，像是从一个界面穿到了另一个界面。她的脚步落在中性灰的地面上，激起一圈极淡的涟漪——这个空间对"进入者"有感知。她深吸一口气，抬头望向空间的中央——那里有一张木桌，和她在文档里写的一模一样：左边是深色红木，右边是浅色橡木，拼成一个完美的对称整体。桌子两侧各有一把椅子——左侧古风红木椅，右侧现代简约椅。太妃已经坐在了古风椅上——深紫色宫装，凤钗高髻，双手交叠放在膝上，姿态端庄得像一尊雕像。沈长渊站在旁边，没有坐，看到她来了，微微点头。
  characters:
  - CHAR-001
  dialogue: 我写出来了——它就在这里。
- shot_id: EP59-S02
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的目光从空间移到桌前的人身上——太妃坐在左侧的红木椅上，姿态端庄得近乎凝固。沈长渊站在右侧，玄色锦袍在柔和的光线下显得沉稳而安静。林小满看着这两个人——她笔下写出的终极场景里，坐着她最初写下的两个角色。她迈出一步，向桌前走去——她的脚步声在地面上激起一圈圈极淡的涟漪，像是这个空间在确认她的存在。
  characters:
  - CHAR-005
  dialogue: 你们真的在这里——我写的时候还以为……
- shot_id: EP59-S03
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满在太妃对面坐下——她坐在现代椅上，浅色橡木的触感温暖而真实。两个人隔着桌子对视——一半古风一半现代的桌子在柔和的光线下像是两个世界的握手。沈长渊没有坐下——他站在桌子的侧边，像一个见证者。太妃沉默了几秒——她的目光从林小满脸上移开，落在桌面上，像是在组织语言。她的手指在袖下松开了又握紧——林小满看到她手腕上的凤镯（`PROP-007`）在袖口边缘反射了一线柔和的光。太妃开口了——声音平稳，但每个字都像是一颗放在桌上的石头，沉甸甸的。
  characters:
  - CHAR-005
  dialogue: 你知道——本宫为什么一直在阻止你？
- shot_id: EP59-S04
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 太妃的脸被柔和的光线照亮——她的表情很平静，但眼底有什么东西在晃动。她的嘴唇微微抿了一下——像是在克制。然后她开口了，声音很轻——轻到像是怕被第三个人听到。她用"我"取代了"本宫"——这是第一次，在整个故事里，她对着林小满用"我"来称呼自己。这个措辞的变化比任何台词都更有力量。
  characters:
  - CHAR-005
  dialogue: 因为——我怕你写完之后，就不要我了。
- shot_id: EP59-S05
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的目光没有焦点地落在桌面上——她不是在看着桌子，而是透过桌面向下看，看到了自己的记忆深处。她的声音平稳，但每个句子的尾音都在微微下沉——不是音调的下沉，是情绪的下沉。她开始说——用她标志性的排比句，但这一次排比的不是威胁和命令，是六次失去。她的凤镯在她微微抬起的手腕上反射着柔和的光——像是也在倾听。
  characters:
  - CHAR-005
  dialogue: 第一个编剧——写了个开头，就消失了。
- shot_id: EP59-S06
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃抬起眼，眼中带着一层薄薄的水光——但她没有让眼泪落下来。她的嘴角微微上扬，带着一种苦涩的、自嘲的笑意。林小满坐在她对面——她的手放在桌上，指尖微微收紧。她看着太妃——这个从第一集就威胁她的女人——现在明白了她所有的恶意背后是什么。沈长渊站在侧边，依然沉默——但他看着太妃的眼神里多了一丝之前没有的东西：不是同情，是尊重。一个见证者对一个经历过六次失去的人的沉默尊重。
  characters:
  - CHAR-005
  dialogue: 本宫一直在想——第七个会怎么对我。
- shot_id: EP59-S07
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊从侧边迈了一步——不是走到桌边，是走到林小满的椅子旁边。他没有坐下，只是站在那里，一只手自然地搭在椅背上——不是占有的姿态，是支持者的姿态。他开口时，声音比平时低沉了一些——不是刻意压低的那种低沉，而是一个人确认了自己的位置之后，自然而然的沉稳。他的话是对太妃说的，但他没有看太妃——他看的是林小满。这一句承诺，说是给太妃听的，其实是给林小满听的。
  characters:
  - CHAR-002
  dialogue: 我不会走。
- shot_id: EP59-S08
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃听到这句话，目光微微一动——像是有什么东西在她心里裂开了一条缝。她看着沈长渊——不是审视，是确认——确认他是认真的。沈长渊迎着她的目光，没有躲闪。两个人对视了短暂的几秒——在这几秒里，太妃眼底那层薄薄的水光微微亮了一下，但她还是没有让它落下来。她移开目光，重新看向林小满——眼神里的压力褪去了大半，取而代之的是一种令人心酸的脆弱。她张了张嘴，想说什么——又没说出口。那种"想说什么又不敢说"的表情——出现在全剧最强大的反派脸上——比任何台词都更有力量。
  characters:
  - CHAR-005
  dialogue: 你——也会吗？
- shot_id: EP59-S09
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满看着太妃——看着这个从第一集就开始打压她、威胁她、一次次试图把她赶出剧本世界的女人。六任编剧的失败、太妃的恐惧、沈长渊的承诺——所有的话都在她脑海里转了一圈。然后她做了一件她以前从未做过的事——她伸出手，放在桌面上，手心朝上——不是要握手，是一个开放的、邀请的姿态。她的声音很平静，没有激动的承诺，没有发誓的激昂——就是一种"这事就这么定了"的笃定。
  characters:
  - CHAR-001
  dialogue: 我不会走。
- shot_id: EP59-S10
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的上半身微微绷紧——像是在消化这句话的重量。她的目光落在林小满摊开的手掌上。那只手——年轻、温暖、带着熬夜留下的微薄痕迹。七任编剧里，没有一个对她说过"我不会走"。她深深地吸了一口气——这是她在这个场景里第一次需要深吸气来稳住自己。然后她做了一件让林小满震惊的事——她伸出手，悬在林小满的手掌上方，没有放下去——像是不敢相信那里真的有温度。
  characters:
  - CHAR-005
  dialogue: ……你说的是真的？
- shot_id: EP59-S11
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满看着太妃悬在她掌心的手——那双手保养得很好，指尖微微泛着凉意的白。她做了一个更勇敢的动作——她轻轻翻过手掌，让掌心朝上变成了掌心朝下——轻轻地覆在了太妃的手指上。不是握住——只是一个温度接触。太妃的手指微微颤了一下——像是很久很久没有被触碰过。林小满的声音很轻，但每一个字都很清楚——她不是在安慰太妃，她是在陈述一个她已经看到了的画面：这个世界还有太多故事。
  characters:
  - CHAR-001
  dialogue: 这个世界——还有太多故事没有讲完。
- shot_id: EP59-S12
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 两个人的手在桌面中央接触——古风红木和现代橡木的拼接处。太妃的深紫色袖口拂过桌面，凤镯（`PROP-007`）的边缘反射了一线温暖的光。她的手指——悬了太久的那只手——终于轻轻落在了林小满的手背上。不是用力的、不是抓紧的——就是落下去了。像是一艘漂泊了很久的船终于靠了岸。太妃的眼眶红了——她拼命忍住不让眼泪掉下来，但有一滴还是从眼角滑落，沿着脸颊的线条无声地坠落。她张了张嘴，想说什么——但这一次，她的排比句和长句都用不上了，只剩下一句最简单的话。
  characters:
  - CHAR-005
  dialogue: 你这个人——怎么这么会说话。
- shot_id: EP59-S13
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃用另一只手的手背擦了擦眼角——动作比她从前所有的举止都要朴素，没有优雅的弧度，没有刻意的从容——就是一个普通女人在擦眼泪。然后她抬起头，眼眶还红着，但嘴角开始上扬——不是从前那种冷笑和神秘的笑，是一个带着眼泪的笑——明亮、真实、带着一种新生般的期待。她看着林小满——眼神里第一次没有了权力的重量，没有了"本宫"的面具——就像一个普通人在问另一个普通人：你下一本写什么？她开口时，声音还带着哭过的沙哑，但语气已经变得轻快——像是心里一块压了很久的石头终于被搬开了。
  characters:
  - CHAR-005
  dialogue: 那——你下一本写什么？
- shot_id: EP59-S14
  scene_id: SCENE-014
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的笑容扩大了一些——眼泪还挂在脸上，但她的表情已经带着一种孩子气的、试探性的期待。她的双手从桌上收回来，交握着放在胸前——像是一个人在许愿前的姿势。她看着林小满，目光里带着一种"我知道这个要求可能很过分"的犹豫，但更多的是"我真的很想要这个"的渴望。她开口时，用回了"我"——不是"本宫"——语气里带着一种小心翼翼的、撒娇般的试探。这句话——从全剧最威严的反派口中说出来——有一种奇异的反差感。她说的不是"给我一个更大的权力"或"让我继续统治这个世界"——她说的是一间茶馆。一个普通人的愿望。
  characters:
  - CHAR-005
  dialogue: 能给我一个角色吗？
