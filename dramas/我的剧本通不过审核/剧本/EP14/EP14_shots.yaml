- shot_id: EP14-S01
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 御花园亭中，翠微站在林小满身边，手里捏着那方绣帕——但她不是在甜蜜地摆弄它，而是在焦虑地揉搓边角。赵景和站在对面，表情困惑。林小满刚从回廊那边过来，还没站稳就被赵景和的话砸懵了。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-007
  dialogue: 林小姐，朕刚才听下人说——太妃娘娘要办太后寿宴，让朕在宴上献诗一首。
- shot_id: EP14-S02
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满看向翠微，翠微的脸色也不太对——她咬着嘴唇，像是在努力消化什么消息。林小满心里一沉。翠微慢慢开口，声音不像平时那样活泼了，语气词也消失了。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐……我也听说了。太妃娘娘让我在寿宴上领舞——说是我家乡的傩舞，展示民间风俗。
- shot_id: EP14-S03
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 太妃寝宫——深紫色帷幔层层叠叠从高处垂落，铜鹤香炉中升起细直的沉香烟线。光线昏暗，只有几盏铜灯在角落燃烧，将影子投在墙上拉得很长。太妃端坐在主位上，深紫色织金宫装，右手腕上戴着凤镯（`PROP-007`），金色的凤凰纹路在昏暗光线中微微反光。她没有站起来迎接任何人——她坐着，像一尊雕像。赵景和已经先到了，站在一旁，表情复杂。太妃的目光缓慢地扫过每个人，最后落在林小满身上，嘴角浮起一个极浅的、不带温度的弧度。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: 人到齐了。本宫长话短说——太后寿宴，七日后。
- shot_id: EP14-S04
  scene_id: SCENE-007
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 赵景和上前一步，少年气的倔强浮现在脸上。他不是在反抗太妃，而是在表达困惑——这种困惑本身就是一个信号：他想要按照自己的心意走，但太妃的指令和编剧的剧情在拉扯他。太妃没有看他，而是端起茶盏，轻轻吹了吹热气，姿态从容得像在逗一只小猫。
  characters:
  - CHAR-001
  - CHAR-005
  - CHAR-007
  dialogue: 太妃娘娘——朕的献诗……可不可以换一首？朕想自己选——
- shot_id: EP14-S05
  scene_id: SCENE-007
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 赵景和沉默了。太妃的话击中了他的软肋——生母。他在朝堂上和太妃对抗是一回事，但在自己母亲的寿宴上不配合——那是不孝。他低下头，退回了原位。翠微站在林小满身边，脸色发白。林小满看出了她的挣扎——翠微不想跳那个傩舞，但那是"太妃安排的"。一个是她信任的小姐写的剧本，一个是这个世界实际的掌权者。她不知道该听谁的。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: ……是。朕明白了。
- shot_id: EP14-S06
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 缓推
  content: 太妃终于站起身来。她缓步走向林小满，每一步都从容不迫，深紫色宫装的下摆拖在暗色石地上，像一道流动的阴影。铜鹤香炉的烟雾在她经过时被打散，又慢慢合拢。她停在林小满面前，居高临下地看着她。凤镯在她腕间微微晃动——在某一瞬间，林小满似乎看到那金色的凤凰纹路闪了一下，像是有光从内部透出。但很快又恢复正常。太妃开口，声音不重，但每个字都像在宣判。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 林小姐——你是不是觉得，这个世界的剧本只有你在写？
- shot_id: EP14-S07
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 太妃没有给林小满反驳的机会。她微微侧过身，目光扫过寝宫内所有人——赵景和低着头，翠微攥着林小满的衣袖。她的声音仍然不重，但越说越慢、越说越轻——符合她"越愤怒越冷静"的性格。最后一句她说得极轻，但寝宫里每个人都听得清清楚楚。那句话像一盆冰水浇在所有人头上。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你以为你是造物主？你不过是个写字的。
- shot_id: EP14-S08
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 太妃拍了拍手。两名宫女无声地从帷幔后走出，站到翠微两侧——不是强迫，但姿态明确：该走了。翠微下意识地抓紧了林小满的衣袖，指节发白。赵景和也被人引着往门口走，他回头看了一眼翠微，嘴唇动了动，但什么也没说出来。林小满站在原地，看着她的角色们被太妃的人一个一个地带走。翠微被带出门口前，回头看了林小满一眼——那一眼里有害怕，也有一种林小满看不懂的东西。门在林小满面前缓缓合上。寝宫里只剩下她和太妃。
  characters:
  - CHAR-001
  - CHAR-004
  - CHAR-005
  - CHAR-007
  dialogue: 小姐——
- shot_id: EP14-S09
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 太妃挥了挥手示意林小满可以走了。林小满几乎是冲出太妃寝宫的——在回廊拐角处，她看到了翠微。翠微没有被真的带走，她刚才趁宫女不注意溜了回来，躲在柱子后面等林小满。她的脸色很白，喘着气，像是跑了一段路。林小满跑过去抓住她的肩膀——翠微却先开口了，声音压得很低，带着一种林小满从未在她脸上见过的恐惧。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 你没事吧？他们有没有为难你——
- shot_id: EP14-S10
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满的表情凝固了。翠微的话像一把钥匙插进了她脑子里某个一直存在的锁孔里——太妃说那些话时确实有一瞬间的"异常"。她当时以为是烛光晃了一下，但翠微在侧面，看得更清楚。林小满脑子里飞速运转——太妃能安排剧情线、能"写入"角色记忆（翠微突然会跳傩舞）、说话时眼睛翻白（刷新症状）——如果太妃也有修改能力，那她在这个世界的能力边界在哪里？她为什么之前不用？她低头看自己的手腕——袖口下，淡金色的"71"还在微微发光。她突然想到一个问题——如果太妃也有修改能力，那她的"倒计时"是不是也和太妃有关？
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 你看清楚了吗——确定是翻白——不是烛光晃了一下？
- shot_id: EP14-S11
  scene_id: SCENE-007
  duration_sec: 10
  camera: i2v_ref 镜头推近
  content: 林小满和翠微站在回廊阴影处。太妃寝宫的大门紧闭着，深紫色帷幔在门缝中隐约可见。翠微还在后怕，手紧紧攥着林小满的袖子。林小满没有动——她在想。如果真的像她推测的那样——太妃也有修改权限——那她面对的不只是一个"不配合的反派角色"，而是一个和她平级的"编剧"。甚至——太妃的权限可能比她更大。她低头看着手腕上微微发光的"71"。天光渐暗，回廊的阴影正在拉长。远处传来宫女们筹备寿宴的脚步声和低语声——这个世界正在按照太妃的剧本转动。而她——她还不知道该怎么和另一个"编剧"对抗。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐……如果太妃也能改剧情……那我们写的那些支线——她是不是都能改掉？
