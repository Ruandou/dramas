- shot_id: EP54-S01
  scene_id: SCENE-010
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 纯白的作者空间中，三行发光的空位悬浮在林小满面前，像三行空白的法律条文在等待文字填入。她的灰色卫衣（`CHAR-001-L01`）在纯白空间中显得格外突出，她深吸一口气的弧度清晰可见。她的右手缓缓伸出——指尖触碰到第一行空位。触碰的瞬间——暖金色的光从触点扩散开来，像一个涟漪在平静的水面荡开。空位移动的方向出现了一个光点——规则开始被写入。
  characters:
  - CHAR-001
  dialogue: 第一条规则。
- shot_id: EP54-S02
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的指尖停留在第一行空位上。她开口宣读规则——声音不像在朗读，更像在宣布一个不可更改的真理。随着她说话，空位上的光点开始延展——金色的字迹在虚空中自动书写，一笔一画，像有一只无形的手握着光笔在空间中刻写。她说的每一个字都变成一个发光的文字碎片，从她的嘴唇飘出，汇入那个正在成型的规则行中。
  characters:
  - CHAR-001
  dialogue: 规则一——两世界之间，开启永不关闭的窗。
- shot_id: EP54-S03
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 规则一完整地刻印在虚空中。然后——作者空间的白色"墙壁"在某一个方向上变得透明了。像是一层纱被揭开，露出另一边的景象：透过那扇"窗"，可以看到大燕京城的街景——清晨的街道，早市正在开张，炊烟袅袅。不是穿越——是像隔着玻璃看另一个世界。林小满看着那扇"窗"，嘴角微微上扬——第一个规则生效了。
  characters:
  - CHAR-001
  dialogue: 窗——不是为了走过去。是为了知道对面有人。
- shot_id: EP54-S04
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 第一行规则的光芒稳定下来。林小满没有停顿太久，手指从第一行移到第二行空位——触碰。同样的金色涟漪再次扩散。她开口宣读第二条规则时，声音里的情感比第一条更深——因为这一条是关于那些她认识了七十多天的角色们。她在这条规则里藏着她对每个角色的歉意和祝福——给他们真正的自由。
  characters:
  - CHAR-001
  dialogue: 规则二——每一个角色——获得书写自己故事的权利。
- shot_id: EP54-S05
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 第二条规则刻入虚空的瞬间——作者空间的四面八方同时浮现出角色的幻影。不是实体，而是半透明的光影像走马灯一样在空间中流转：翠微在茶馆里端着茶盘的侧脸、苏晚晴在酒楼打算盘的专注神情、太妃在玩剧本杀时惊讶的表情、赵景和穿着布衣在茶楼里笑的样子。每一个幻影停留不到一秒就消散了，但它们出现的那一刻——每个角色幻影的眼睛都亮了一下，像是感受到了什么。林小满看着这些幻影从自己身边流过，眼眶微微发热。
  characters:
  - CHAR-001
  dialogue: 你们感觉到了吗——
- shot_id: EP54-S06
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 角色幻影消散殆尽。作者空间恢复到纯白。林小满深吸一口气——最后一条规则，也是关于她自己的。她看着第三行空位，停顿了一秒。这一秒里，她心里闪过了很多事情：第一次穿越时的慌乱、在天牢里沈长渊救她时的对话、苏晚晴问她"凭什么改我的故事"的愤怒、太妃说"请把我写完整"的请求、以及沈长渊在城墙上说"我等你"时的那双眼睛。然后她伸手触碰了第三行空位——没有犹豫。
  characters:
  - CHAR-001
  dialogue: 规则三。
- shot_id: EP54-S07
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满宣读了第三条规则。她的话语中带着一种奇异的双重身份感——既是编剧在制定规则，也是生活在两个世界中的人在描述自己的状态。随着她的宣读，第三行金色文字在虚空中刻写完成。而在最后一个字完成的瞬间——她左手手腕上那个曾经有倒计时印记的位置，亮起了微微的金色光芒——不是倒计时，是一个新的印记：一个∞形状的微光，在两个世界中无限循环的象征。
  characters:
  - CHAR-001
  dialogue: 规则三——林小满——获得在两个世界间自由穿梭的能力。
- shot_id: EP54-S08
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定→镜头旋转
  content: 三条规则全部刻印完成。三行金色文字悬浮在虚空中，散发着温暖的光芒。林小满站在它们面前，抬头看着自己写下的三行文字。她轻声说出了最后一句——不是规则，是一个宣告。这句话落地的瞬间——三条规则同时爆发出耀眼的光芒。不是刺眼的白光——是温暖的、像初升太阳一样的金色光芒，从每一行规则的文字中涌出。光芒以她为中心向四面八方扩散，充满了整个作者空间。纯白的空间开始碎裂——不是破坏性的碎裂，而是像一层外壳脱落，露出下面的真实。空间中的所有碎片都化作发光的粒子——千千万万个暖金色的光点，像萤火虫一样漂浮在虚空中。林小满站在光点的中心，她的身影在光芒中变得模糊——但她没有消失，她正在随着这些光点一起扩散到整个世
  characters:
  - CHAR-001
  dialogue: 以这三条规则之名——世界——重生吧。
- shot_id: EP54-S09
  scene_id: SCENE-013
  duration_sec: 5
  camera: t2v 镜头拉远→固定
  content: 城墙上空的晨光中，暖金色的光点像一场温柔的星雨缓缓降落。每一个光点落到城砖上、屋檐上、街道上时，都会在着落点荡开一小圈涟漪般的柔光。远处的燕京城在金色光雨的笼罩下，轮廓变得更加清晰——同时在城市的天际线上，杭州钱塘江大桥的叠影正在稳定地显现，不再是虚幻的投影，而是像两个世界在同一张画布上稳定地重叠。古老城砖的缝隙中渗出温暖的金光，整座城市像被重新注入生命——每一块砖、每一片瓦都在微微发光。
  characters: []
- shot_id: EP54-S10
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满站在城墙的边缘——她身上的灰色卫衣已经被淡紫色交领襦裙（`CHAR-001-L02`）取代——不是因为"穿越"，而是因为新的规则让她在两个世界间自然切换。她低头看着自己的手——手腕上的∞印记散发着温暖稳定的微光。她抬起头，看着被光雨覆盖的燕京，看着远处杭州的叠影，看着两个世界在同一片晨光下共存。她的表情不是惊喜——是那种所有努力都得到回报后的、安静的满足。她轻轻地、长长地呼出一口气——像是把这么多天的焦虑都呼出去了。
  characters:
  - CHAR-001
  dialogue: 新世界……
- shot_id: EP54-S11
  scene_id: SCENE-013
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 身后传来脚步声——不重，是沈长渊那种一贯沉稳的步调。林小满没有回头，但她嘴角的弧度加深了一点——她知道是他。沈长渊走到她身边停下，和她并排站在城墙边。他没有立刻说话，而是先看了一眼她手腕上那个新的∞印记——他的目光在那里停留了不到一秒，然后移开，看向前方沐浴在金色光雨中的双世界融合之城。他开口了——声音里有一种林小满从未听过的质感。不是腹黑，不是试探，不是温柔——是一种平等的、自发的、真正自由的人才能发出的声音。
  characters:
  - CHAR-001
  dialogue: 你写的？
- shot_id: EP54-S12
  scene_id: SCENE-013
  duration_sec: 12
  camera: i2v_ref 镜头拉远
  content: 城墙的全景。金色的光雨已经渐渐稀薄，天空从橙金色过渡到清澈的晨光蓝。燕京的古老屋檐和杭州的现代天际线在同一片天空下重叠——奇异的、美丽的、和谐的共存。沈长渊和林小满并排站在城墙边，中间隔着一个拳头的距离。不需要牵手，不需要拥抱——两个人站在新的世界里看同一片风景，这个画面本身就已经是最完整的答案。镜头缓缓拉远——城墙上两个身影在晨光中渐渐变成剪影。远处，燕京的街市开始苏醒，叫卖声隐约传来——和远处杭州早高峰的车流声奇妙地交织在一起。两个世界的声音——第一次在同一个清晨响起。
  characters:
  - CHAR-001
  dialogue: 窗已经打开了。故事和人都活了。剩下的——就是我们自己去过了。
