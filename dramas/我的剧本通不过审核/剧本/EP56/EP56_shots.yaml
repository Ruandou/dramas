  camera: i2v_ref 固定镜头
  content: 燕京古城墙的阶梯上，两个人一前一后地走着。沈长渊·古装（`CHAR-002-L01`）走在前面，玄色锦袍在午后的微风中轻轻摆动，玉冠束发，腰间玉佩（`PROP-004`）随着步伐轻轻晃动。他走得不算快——但每一步都很稳，像是走在一条他已经走了很多次的路上。林小满跟在他身后几步的距离，淡紫色襦裙的裙摆拂过石阶上的青苔，她的目光落在他宽阔的背脊上——这个人从她笔下走出，现在他在前面带路。她不知道要去哪，但她没有问——因为她信任他。
  characters:
  - CHAR-002
  dialogue: 带你去个地方。
- shot_id: EP56-S02
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 城墙上的全景。午后的光线柔和而温暖，古老的城砖在阳光下呈现出深浅不一的灰褐色。城墙外，远处是融合的风景——近处是燕京的街市和屋顶，远处是钱塘江大桥的钢索轮廓，两片天空在中间交融。两个人站在城墙的中段——沈长渊停下来了，林小满也停下来了。他微微侧身，指了指前方——城墙拐角处，新搭了一座竹木结构的茶寮。规模不大，几张竹桌竹椅，檐下挂着几盏暖黄色的纸灯笼，一面写着"茶"字的布幡在风中轻轻摆动。茶寮里隐约有一个人影——背对着他们，正在整理茶具。
  characters:
  - CHAR-002
  dialogue: 到了。
- shot_id: EP56-S03
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 林小满走向茶寮，脚步越来越慢。竹木搭建的茶寮不大，只有三张桌子，每张桌上放着一套素雅的青瓷茶具。檐下的纸灯笼在微风中轻轻旋转，投下温暖的橙色光晕。柜台后面的人正在低头沏茶——他穿着一件米白色的亚麻衬衫，袖口挽到小臂，露出一截清瘦的手腕。他的手指修长而稳定——注水、温杯、洗茶，动作流畅得像在做一件他练习了很久的事。林小满站住了。因为那个人的轮廓——肩膀的宽度、后颈的弧线、低头的角度——她太熟悉了。和前面那个带她来的人，一模一样。
  characters:
  - CHAR-001
  dialogue: ……不会吧。
- shot_id: EP56-S04
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 柜台后面的人听到脚步声，直起身，转过来——沈长渊·现实（`CHAR-003-L01`）。他穿着一件米白色亚麻衬衫，戴着那副银色细框眼镜，短发微微蓬松。和古装版一模一样的五官——狭长的眼型、高挺的鼻梁、薄唇——但气质截然不同：他没有那种冷峻和压迫感，取而代之的是一种温和的、略带社恐的安静。他看到林小满的那一刻——眼睛亮了一下。但和古装沈长渊不同，他没有用语言表达，只是嘴角微微上扬，露出了一个小心翼翼的、像是怕自己太高兴会吓到她的笑容。他张了张嘴，又合上了——一年的话堵在喉咙里，最后只说出了两个字。
  characters:
  - CHAR-003
  dialogue: 小满。
- shot_id: EP56-S05
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶寮里，两张竹桌被拼在一起。古装沈长渊拉开一张竹椅，自己坐下，姿态自然——老顾客了。现实沈长渊从柜台后走出来，端着一壶刚泡好的茶，在古装沈长渊对面坐下。两个人面对面——一个穿玄色锦袍、玉冠束发、冷峻如刀；一个穿米白色亚麻衬衫、戴银丝眼镜、温润如玉。相同的一张脸，相同的一双眼睛，同一个灵魂的两面。林小满站在旁边——看看左边，看看右边——一时间说不出话。两个人注意到她的表情，同时看向她——连侧头的角度都一样。
  characters:
  - CHAR-002
  dialogue: 你们……真的长得一模一样。
- shot_id: EP56-S06
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 两个沈长渊同时端起茶杯——动作几乎同步：右手握杯，左手轻托杯底，送到唇边轻啜一口。放下杯子的同时，两人对视了一眼——然后同时微微笑了一下。不是那种客气的笑——是两个人之间有一种默契的微笑。像是两个共享了同一段记忆的人，不需要语言就能理解对方在想什么。现实沈长渊先开口了——声音温润柔和，和古装版的低沉磁性不同，但语速的停顿习惯一模一样。
  characters:
  - CHAR-002
  dialogue: 那天你写完三条规则之后——世界重构的那一刻——我感觉到了。
- shot_id: EP56-S07
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 古装沈长渊端着茶杯，目光落在琥珀色的茶汤上。他沉默了几秒——像是在组织语言，又单纯在享受这一刻的安静。然后他抬起头，看着林小满——他的眼神很平静，甚至带着一丝满足。那种满足不是"得到了什么"的满足，而是"终于安排好了"的那种踏实。他开口时，语速比平时慢——像在说一件他已经反复想了很多遍、确认过每一个细节的事情。
  characters:
  - CHAR-002
  dialogue: 我们谈过了。
- shot_id: EP56-S08
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 两个沈长渊同时看向林小满——不是审视，不是期待，只是安静地、平等地看着她，像是在说"这是我们的决定，你不需要有负担"。古装沈长渊字斟句酌地继续解释，声音低沉但透着一种奇异的温柔——不是他平时那种毒舌的温柔，而是一个人在安排自己最珍视的事情时的郑重。现实沈长渊在旁边轻轻点头，像在附和。
  characters:
  - CHAR-002
  dialogue: 他在现实中陪你——吃饭、逛街、看画展、过普通日子。
- shot_id: EP56-S09
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的嘴唇微微张开又合上。她看看古装沈长渊——他端起茶杯又喝了一口，表情平淡得像在说一件日常小事。她看看现实沈长渊——他安静地看着她，眼镜后面的目光带着鼓励，但没有任何催促。她张了张嘴，想说"这太疯狂了"——但这句话到了嘴边，变成了另一句更诚实的话。她的声音有点哑，眼眶开始发热。
  characters:
  - CHAR-001
  dialogue: 你们……为我想了这么多？
- shot_id: EP56-S10
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 现实沈长渊放下茶杯，身体微微前倾——这是他说话前的一个习惯性动作，像是想让自己说的话更靠近对方一些。他的声音温润而清晰——没有社恐时的结巴，没有紧张时的犹豫，只有一种经过漫长等待后终于能说出这句话的郑重。古装沈长渊在他开口时沉默地喝茶——但他的嘴角有一个几乎不可见的弧度。
  characters:
  - CHAR-003
  dialogue: 你不必选。我们已经替你选好了。
- shot_id: EP56-S11
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 现实沈长渊站起来。动作不快——他放下茶杯，双手撑在桌面上，缓缓起身。这一刻没有音乐，没有慢镜头，就是一个普通的男人从桌前站起来走向另一个人的动作——但他做得很郑重，像这个动作他已经等了很多年。他绕过竹桌，走到林小满面前停下。林小满抬起头看他——逆光中他的轮廓和古装沈长渊几乎完全重合，但眼镜片上反射着午后的天光，柔和了那道过于锋利的轮廓线。他没有说话，只是站在那里，和她之间隔着一步的距离。
  characters:
  - CHAR-003
  dialogue: 沈长渊——
- shot_id: EP56-S12
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 现实沈长渊伸出了手——不是握手，是一个邀请拥抱的姿势。他的手臂微微张开，等着她做出选择。林小满看着他——这个人，她第一次见到他的照片是在EP08沈长渊·古装问"你手机里那个男的是谁"的时候。她第一次见到他本人是在EP48的夹缝里。他瘦了很多，但站在她面前的样子，和在夹缝里等她的时候一样——一样的小心翼翼，一样的温柔。她站起来——然后向前迈了一步。他把她拥入怀中。拥抱很轻——像是怕把她弄碎了。但他的手在她后背收拢时，带着一种"终于"的力度——不是占有，是确认。他把下巴轻轻搁在她的发顶，闭上了眼睛。
  characters:
  - CHAR-003
  dialogue: 欢迎回家。
- shot_id: EP56-S13
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 拥抱的余韵中，现实沈长渊轻轻松开了林小满——不是急着放开，是很自然地收回了手，退后半步，把空间留给她。林小满站在原地，眼睛有点红，嘴角却带着笑。她转头看向茶桌的方向——古装沈长渊还坐在那里。他手里端着那杯茶，没有站起来，也没有走过来。他的姿态很放松——一条腿自然地伸着，一只手搁在桌上。他看着她的眼神里没有失落，没有嫉妒，甚至没有"等待"。只有一种安静的满足——像是他安排好了所有事，现在只需要看着结果就好。他看到林小满看向自己，嘴角微微上扬——不是从前那种毒舌的、带刺的笑，是一个人看到自己在乎的人终于安好时，发自心底的笑意。
  characters:
  - CHAR-002
  dialogue: 我就说了——他抱起来比我暖和。
- shot_id: EP56-S14
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 古装沈长渊放下茶杯，也站了起来。他走到林小满面前——和现实沈长渊不同，他没有拥抱她，而是伸出手，像江湖中人一样拍了拍她的肩——轻轻两下。然后他看着她的眼睛，目光平静而认真。没有之前那种"我是纸片人"的距离感，也没有"你是编剧"的服从感——就是两个独立的人之间的对视。他说完这句话后，退后一步——不是疏远，是把路让开。他的目光从林小满身上移到旁边那个和自己长得一模一样的人身上，轻轻点了点头，然后转身走回茶寮，重新坐下，给自己续了一杯茶。
  characters:
  - CHAR-002
  dialogue: 去吧——他在等你。
- shot_id: EP56-S15
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 城墙上，午后的光线渐渐染上了金色。林小满站在原地——她穿着淡紫色襦裙，站在古老的城砖上——现实沈长渊站在她身边，米白色的亚麻衬衫在风中轻轻贴着他的身体。两个人并肩站着，看着远处的风景——燕京的屋顶和钱塘江大桥的叠影在午后的阳光中显得宁静而和谐。没有人说话——因为不需要。林小满微微侧头，看了一眼身边这个人的侧脸——银丝眼镜的边缘反射着远处城市的光，他的目光也看着远方，和她看着同一片风景。
  characters:
  - CHAR-001
- shot_id: EP56-S16
  scene_id: SCENE-013
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 茶寮的竹棚下，古装沈长渊独自坐在桌前。他续了一杯茶，没有喝——只是握着茶杯，感受着从杯壁传来的温度。他的目光穿过茶寮的竹帘缝隙，落在远处城墙上的两个人影上——一大一小，并排站着。他看了一会儿，然后低下头，轻轻笑了一下——不是苦涩的笑。是那种"我做到了"的笑。他端起茶杯，慢慢喝了一口——像一个在值夜班的人，确认一切都好之后，安心地泡了一杯茶。
  characters:
  - CHAR-002
  dialogue: 这班值完了——换你。
