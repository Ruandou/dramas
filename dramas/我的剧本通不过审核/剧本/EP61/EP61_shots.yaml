  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 傍晚的酒楼——客人渐渐散去，空气中还残留着菜肴的香气和暖烘烘的灯笼光。林小满从门外走进来——她穿着淡紫色襦裙，肩上落了一层薄薄的暮色。她站在门槛边，环顾四周——酒楼和上次来的时候不一样了：柜台后方的墙上多了一块木牌，上面用墨笔写着"今日推荐菜"，柜台上的账册堆得更厚了，几个跑堂的小二正在擦拭桌面准备打烊。整个空间比之前多了一种"在运营"的充实感——不是一间设定里的背景酒楼，是一间真的在赚钱的店。
  characters:
  - CHAR-001
  dialogue: 变化真大。
- shot_id: EP61-S02
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 柜台后面，苏晚晴正低头看着一本账册——她穿着一身月白色的衣裙，但和之前不同：袖口微微卷起露出一截手腕，头发从清冷的长发及腰变成了利落地挽起——用一根银簪固定。不是那种拒人千里的文艺造型，是一个做事的人的样子。她的指尖拨着算盘珠子，动作熟练而从容——和当初那个站在月光下说"原来如此"的文艺女配判若两人。听到脚步声，她抬起头——看到是林小满，嘴角浮起一个淡淡的笑容。不是从前那种带着刺的微笑——是一个老板看到朋友来了的笑容。
  characters:
  - CHAR-006
  dialogue: 你来了。
- shot_id: EP61-S03
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 两人面对面坐在靠窗的桌前。桌上放着一壶温好的桂花酒和两只青瓷小杯。窗外的暮色透过纸窗洒在桌面，整个画面被暖金色的余晖包裹着。苏晚晴给林小满倒了一杯酒——动作自然，不是"女配给编剧倒酒"的拘谨，是两个平等的人在黄昏里喝一杯的关系。林小满端起杯子，看着苏晚晴——她发现苏晚晴的眼神和以前不一样了：少了那种"你在看我笑话吗"的防御，多了一种笃定的平静。
  characters:
  - CHAR-001
  dialogue: 你变了很多。
- shot_id: EP61-S04
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 苏晚晴放下酒杯，从柜台方向拿了一份册子过来——她在林小满面前坐下，把册子放在桌上，推到林小满面前。不是递——是推。像是一个人在展示自己的作品。不是请求审核，是分享成果。月光白的封面页上——是她用毛笔端正写下的标题：「大燕王朝餐饮集团连锁方案」。林小满的目光落在封面上，微微一怔。她知道苏晚晴在做餐饮——但她没想到已经到了"连锁方案"的层面。
  characters:
  - CHAR-006
  dialogue: 你说过——我是一个可以不用依靠男主的人。
- shot_id: EP61-S05
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: ⚠️ 册子特写——翻页时用书页移动替代手指精细动作。林小满翻开册子——宣纸内页在手感上厚实质朴，但装订却是现代的三枚铜铆钉固定。第一页是手绘的燕京地图——十二个坊的位置清晰标注，每个坊上都画了一盏小灯笼的位置——那是分店的选址。毛笔线条流畅利落——不是林小满帮忙画的，是苏晚晴自己画的。她的目光顺着地图移动——从东到西，从南到北——十二个坊，十二盏灯笼。她一页页翻过去——每一页都有一张手绘的店铺布局图，旁边是密密麻麻的数字表格：毛笔写的阿拉伯数字，分行排列，能看出是预算和利润核算。
  characters:
  - CHAR-001
  dialogue: 十二个坊——每家分店的选址都标好了？
- shot_id: EP61-S06
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 苏晚晴给自己倒了一杯酒，端起来轻轻抿了一口，姿态从容。她的目光隔着杯沿落在林小满翻看企划书的动作上——不是在等评价，就只是看着。她需要的不是林小满的审批，她需要的只是"有人看到了"。她开口时，声音里带着一种"是也不是"的轻松——像是在陈述一个她已经验证过的数据。她说"你觉得呢"时——语气不是反问，是真的在问意见。不是从前的"呵，你觉得呢"那种带刺的语气——是她真的想知道林小满怎么看。
  characters:
  - CHAR-006
  dialogue: 不然呢——你以为我这两个月在干什么？
- shot_id: EP61-S07
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满翻完了最后一页——册子的最后一页不是布局图也不是预算表，而是一行字：「献给林小满——第一个相信我不需要被写也能活的人。」她的手指停在那一行字上——指尖微微颤了一下。不是悲伤的颤抖——是"没想到"的那种触动。她合上册子，安静了两秒。窗外暮色渐深，暖红的灯笼光在桌面上摇晃。她看着苏晚晴——这个当初怒气冲冲来找她"讨个说法"的穿越女配——现在坐在自己面前，端着一杯桂花酒，计划着十二家连锁分店。
  characters:
  - CHAR-001
  dialogue: 你——已经不需要我写了。
- shot_id: EP61-S08
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 苏晚晴端杯的手微微一顿——不是因为被说中了什么秘密，是因为"不需要我写了"这六个字从林小满口中说出来，和她自己心里想的是同一句话。她低头看着杯中的桂花酒——琥珀色的酒面上映着灯笼的碎光。她安静了一会儿——然后抬起头，嘴角带着一个浅浅的、释然的笑容。那个笑容里没有"呵、我倒要看看你能说什么"的防御——就只是一个终于找到了自己位置的人，在被理解之后轻轻点头的笑。
  characters:
  - CHAR-006
  dialogue: 嗯。
- shot_id: EP61-S09
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴放下酒杯，坐直了身体——她的目光穿过桌面上摊开的企划书，落在林小满身上。灯笼光在她们之间铺开一层暖红色的光晕。她的声音平稳——和之前的"文艺带刺"不同，和刚才的"释然的嗯"也不同——是一种完成了某件事之后，回头看时才会有的、安静的感谢。她不像太妃那样用排比句表达感动——她用的是自己最擅长的方式：直接说。不绕弯子——是她能给出的最高的诚意。
  characters:
  - CHAR-006
  dialogue: 但谢谢你——
- shot_id: EP61-S10
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满听到这句话——没有立刻回应。她端起酒杯，轻轻喝了一口——桂花酒的暖意顺着喉咙滑进胃里。她放下杯子时，眼眶有一点发热，但她忍住了——不是那种需要压制的情绪，而是"原来我写的故事真的能改变一个人"的那种复杂感。她看着苏晚晴——想起了她们第一次见面：苏晚晴怒不可遏地质问她"你凭什么改我的故事"，那个穿着月白色衣裙、浑身带刺的文艺女配——和现在坐在她对面的这个挽着头发、说着"谢谢"的独立女性，是同一个角色。她笑着摇了摇头——那个笑容里有欣慰、有自豪、还有一种编剧特有的"我的角色长大啦"的老母亲感。
  characters:
  - CHAR-001
  dialogue: 你知道吗——你说这句话的时候，比我写的任何一条结局都好。
- shot_id: EP61-S11
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 苏晚晴听了林小满的回答——她先是愣了一下，然后笑了——不是从前那种带着防备的笑，是一个被戳中了心底最柔软处后、有点不好意思的笑。她低下头又抬起来——脸上带着那种"行吧你赢了"的投降表情。她端起酒杯——不是敬酒的姿势，是举起来，对着林小满的方向——像是隔着一整部剧的距离，敬当初那个相遇的时刻。
  characters:
  - CHAR-006
  dialogue: 你这个人——
- shot_id: EP61-S12
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满端起酒杯，和她轻轻碰了一下——青瓷撞击发出一声清脆的响声，像是给这段关系的起点画上了一个圆满的句号。两人同时饮下——苏晚晴喝得干脆，像一个做了该做的事之后放松的老板；林小满喝得慢一点，像是在用这个动作消化这一路走来的所有波折。窗外的暮色已经完全转为夜色——暖红色的灯笼光成为房间里唯一的光源，把两个女人的轮廓温柔地包裹着。一个写故事的人，和一个自己写自己故事的人——面对面坐着，在一间黄昏的酒楼里。
  characters:
  - CHAR-001
  dialogue: 敬相遇。
- shot_id: EP61-S13
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 两人又坐了一会儿，窗外的夜色完全沉淀下来，酒楼里只剩下柜台后一盏灯笼还亮着。苏晚晴放下空酒杯，靠在椅背上——姿态放松，像是一个人完成了一天的工作之后终于可以喘口气的样子。她的目光从林小满身上移开，落在暮色消失的方向——像是想起了什么有意思的事。然后她转过头，带着一个促狭的笑容——那个笑容里带着一种"我给你办了一件事"的小得意。
  characters:
  - CHAR-006
  dialogue: 对了——有个事跟你说。
- shot_id: EP61-S14
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的瞳孔微微放大——橙姐。那个在现实世界每周催她交稿的编辑。她看着苏晚晴——表情复杂：惊讶、困惑、还有一丝"你怎么做到的"的佩服。苏晚晴是有现代记忆的——她记得自己是个穿越女配的设定，她看得懂手机，她会用邮件。但这些知识在这个古装世界里——她是怎么联网的？林小满没有问出口——因为她知道问了也不会有答案。在这个世界里，有些事不需要解释。
  characters:
  - CHAR-001
  dialogue: 你——什么时候学会发邮件的？
- shot_id: EP61-S15
  scene_id: SCENE-009
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴看到林小满的表情——那个"你在古装世界怎么发邮件"的困惑表情——她笑得更明显了。她站起来，从柜台上拿起林小满的手机——那部她带进剧本世界的旧款iPhone，透明壳里还夹着便利店小票。手机屏幕亮着——显示的是邮箱发送成功的页面。苏晚晴把手机翻过来给林小满看——收件人：橙姐。邮件正文只有一行字——苏晚晴写的，不是林小满写的。林小满看着屏幕上的字，目光停留在那行字上——表情从困惑变成了一个复杂的笑容。那是一种"我的角色替我搞定了我的人生"的奇妙满足感。
  characters:
  - CHAR-006
  dialogue: 你别担心——我没乱说。就跟她说——你在写一个很好的故事。
- shot_id: EP61-S16
  scene_id: SCENE-009
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 苏晚晴站在灯笼下，收起了促狭的笑容——变成了一种认真的、带着理解的表情。她不是在帮林小满搞定催稿——她是在用自己的方式告诉那个现实世界的编辑：有些事情急不来。她的声音很轻，但每一个字都像是她穿越了一整部剧之后才领悟到的道理——从被催稿的工具人角色，到理解创作需要时间的人。一个角色在保护编剧的创作空间。她不需要说更多了——这句话比刚才所有的感谢都更有力量。
  characters:
  - CHAR-006
  dialogue: 好故事——催不出来。
