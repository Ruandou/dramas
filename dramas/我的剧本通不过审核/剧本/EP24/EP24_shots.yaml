  content: 清晨的侯府书房。竹帘半卷，晨光斜照进来，空气中还有夜晚残留的一点凉意。林小满坐在书案前，没有发愣——她铺开了一张新的宣纸，拿起毛笔，蘸饱了墨。她的动作很稳——和昨晚收到短信时的颤抖完全不同。一夜过去了，她做出了一个决定。她低头看着空白的纸面，没有立刻下笔——她在构思。她在想：世界会自我演化——那能不能引导它——让它自己揭示太妃不想让她知道的事？
  characters:
  - CHAR-001
  dialogue: 第5个编剧说别信墙上的——但世界自己长出来的东西——太妃总改不了吧？
- shot_id: EP24-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微端着一碟早点和一杯热茶走进来——看到林小满坐在书案前的姿态，她愣了一下。她原以为经过昨晚的事，林小满今天会没有精神。但林小满坐在那里的样子——手握毛笔，背挺得很直——是她从没见过的一种状态。不是被吓到之后的强装镇定——是真正的、源于某个决定的力量。翠微把碟子放在旁边，没有催她吃早点，只是安静地站在一旁。她看到林小满在纸上写下了一行字：「深夜·御书房·秘密会议」——然后笔停住了。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐——你这是一夜没睡——还是——
- shot_id: EP24-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的笔停在纸上——只写了场景标题和地点，没有写任何对白。她放下笔，看着那行字，又看了看空白的下方区域——那里本应该写满角色对话的地方，现在是一片故意的空白。翠微凑过来看——只看到一行字。她等了一会儿——林小满没有继续写。她又等了一会儿——还是没有。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 就——就这？深夜御书房秘密会议——然后就没了？
- shot_id: EP24-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把那张只写了一行字的宣纸小心地对折两次，放在书案正中——像是在供奉什么仪式物品。她转向翠微，眼里有一种实验者即将看到结果的光芒。她解释了EP18时世界自动补全赵景和偷看翠微的戏、EP22自动补全了密室的经历——每一次，当她留下"空白"，世界就会自己填上内容。而且填的往往比她写的更精彩、更出乎意料。翠微听着，慢慢理解了——她低头看了看那张折好的纸，又抬头看林小满，眼神里多了一丝敬畏——不是对林小满的敬畏，是对这个世界的敬畏。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 之前是我不小心留白——世界自动补了。
- shot_id: EP24-S05
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 镜头从窗外夜景缓缓推入室内
  content: 深夜的御书房。月光从高窗洒进来，在地砖上投下冷蓝色的矩形光斑。室内没有点灯——只有月光和远处廊下的宫灯光线透过雕花窗格，在地面上画出细碎的花纹。整个空间安静得像一幅画。书案上摊着一卷未合上的奏折，笔架上的毛笔墨迹已干。空气中有淡淡的墨香和陈旧纸张的气息。这个场景——林小满从未写过。它此刻正在被世界自行"演出"。画面中还没有人——但远处传来轻微的脚步声，由远及近。
  characters: []
- shot_id: EP24-S06
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 御书房的侧门被推开——没有发出太大声响，门轴被精心保养过。一个身影闪了进来。深紫色宫装在月光下几乎和暗处融为一体——但金色凤镯在手腕上反射出一线微光。是太妃。她没有点灯——她不想让任何人知道她在这个时间出现在御书房。她的脚步很轻，几乎没有声响。她走到书案前，没有看那卷奏折——她在等一个人。她站在月光照不到的暗处，侧对着窗，表情半明半暗。她微微侧头，似乎在听——确认没有人跟踪她。
  characters:
  - CHAR-005
- shot_id: EP24-S07
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 御书房的另一扇门——更隐蔽的那扇——被推开了。一个身影走了进来。身形高挑修长，宽肩窄腰——和沈长渊一模一样的身形。穿着深灰色的夜行衣，面容被兜帽的阴影遮住。太妃在他进来的一瞬间绷紧了身体——但在看清是谁之后，她放松了一些——但仍然保持着警觉。月亮穿过云层，光线亮了一些——但神秘人的脸始终在阴影中。他站在太妃对面，两人之间隔着书案。他的声音从阴影中传出来——比沈长渊的声音更低沉，带着一丝嘶哑，像是刻意压着嗓子说话。
  characters:
  - CHAR-005
  - CHAR-005-L01
  - CHAR-002-L01但声音不同
  dialogue: 你又来了。这次——为什么这么急？
- shot_id: EP24-S08
  scene_id: SCENE-002
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃和神秘人在月光中对峙着。神秘人没有动——像一个雕塑一样站在阴影里。但他的声音里有了一种更紧迫的语调——不是恐惧，是一种警告。他说的"前六次"三个字让太妃的表情出现了微妙的变化——不是惊讶，是"果然你也知道"的确认。
  characters:
  - CHAR-005
  - CHAR-005-L01
  - CHAR-002-L01但声音不同
  dialogue: 前六次——我们都成功阻止了。这一次——不能出差错。
- shot_id: EP24-S09
  scene_id: SCENE-002
  duration_sec: 12
  camera: i2v_ref 镜头从正面固定→随神秘人侧面转移动
  content: 神秘人说完了最后一句话，准备离开。他转身——这个动作让他第一次完全侧对月光。月光照亮了他的轮廓——肩部的线条、下颌的弧度、侧脸的剪影——那分明就是沈长渊。同样的身材比例，同样的站姿——甚至转身的动作幅度都一模一样。但刚才的声音——那个嘶哑低沉的、带着压迫感的声音——不是沈长渊的。沈长渊说话从来不用那种压抑的方式——他的毒舌是锋利但清澈的，而不是这样浑浊的、像从很深的地方传上来的声音。神秘人没有回头。他从那扇隐蔽的门走了出去，消失在黑暗中。太妃独自站在御书房中，月光照亮了她脸上的表情——那是一种比恐惧更复杂的东西：疲惫。她不是第一次做这件事。她做了六次了。
  characters:
  - CHAR-005
  - CHAR-005-L01
  - CHAR-002-L01但声音不同
  dialogue: 第六次了——还要做多少次……
- shot_id: EP24-S10
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 清晨。林小满从房间里走出来，走到书案前。那张折好的宣纸——还在原位。但看起来——不一样了。它比昨天厚了。她站定，看着那张纸——没有立刻打开。她深吸一口气——就像拆一个不知道内容的信封。然后她拿起纸，展开。她愣住了。纸上——她昨天只写的那一行字"深夜·御书房·秘密会议"仍在。但在那行字下面——密密麻麻写满了字。是对话。是完整的戏。她一个字都没写过的那场戏——现在白纸黑字地躺在她面前。她的手微微发抖——不是因为恐惧，而是因为一种与创作完全相反的体验：她没写的东西，被写出来了。她一个字一个字地读下去。读到"钥匙快要觉醒了"时——她的呼吸停了一下。读到"那就让他别觉醒——像前六次一样"时——她的眼睛瞪
  characters:
  - CHAR-001
  dialogue: ——真的补全了。
- shot_id: EP24-S11
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 翠微听到动静跑进来——看到林小满站在书案前，手里攥着那张纸，脸色发白但不是恐惧。林小满把纸递给她，翠微接过来读了一遍——她的表情从困惑变成了震惊，再到一种"原来如此"的恍然大悟。她放下纸，看向林小满——两人眼神交汇，确认了同一件事：这个世界不只是"自动补全剧情"——它知道那些角色不知道的事。它在主动揭示真相。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐——这个世界——它知道太妃在做什么。
- shot_id: EP24-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 林小满走到窗边，推开窗——清晨的风吹进来，吹动了桌上的纸。她的大脑在飞速运转。她在脑中把所有的信息排成了一列：①密室墙说沈长渊是钥匙 ②第5个编剧说太妃篡改了墙上的内容 ③世界自我演化出的戏显示太妃在阻止钥匙觉醒 ④阻止了六次都成功了
    ⑤神秘人像沈长渊但不是他。这些信息中，哪些是真的？哪些是假的？如果太妃篡改了墙上的内容——那"沈长渊是钥匙"这个信息本身可能就是被篡改过的。如果"钥匙"不是沈长渊——那是什么？她转过身，看向翠微，说出了她此刻最核心的疑问。这个问题的答案——将决定她接下来所有行动的方向。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 太妃在阻止钥匙觉醒——阻止了六次。如果墙上的信息是真的——钥匙是沈长渊——那她就是在阻止他。
