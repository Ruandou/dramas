- shot_id: EP52-S02
  scene_id: SCENE-009
  duration_sec: 12
  camera: i2v_ref 固定镜头→缓推
  content: 燕京城内最热闹的商业街。一座二层木楼灯火通明，门口挂着烫金牌匾，红灯笼从屋檐垂到二楼的栏杆。大堂里客人满座，小二端着菜穿梭其中，空气中飘着酒菜香和算盘的噼啪声。苏晚晴站在柜台后面——她穿着一件月白色暗纹长裙，外套一件深青色比甲（`CHAR-006-L02`），头发利落地挽成单髻插了一支玉簪，整个人从清冷的穿越女配变成了干练的女老板。她正在打算盘，抬眼的瞬间看到门口的林小满，嘴角浮起笑意。她拿起柜台上那份用铜铆钉固定的册子（`PROP-013`），随手翻开，露出毛笔画的店铺布局图和阿拉伯数字。
  characters:
  - CHAR-001
  dialogue: ……你把酒楼做起来了？
- shot_id: EP52-S03
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 茶楼不大，竹桌竹椅，窗边有绿植。墙上挂着"茶"字的书法条幅。翠微穿着一件浅杏色对襟短衫，腰间系着淡蓝色围裙，袖子用襻膊带子扎起，正端着托盘给一桌客人上茶。她转身看到林小满，眼睛瞬间亮了——整个人像被点亮的灯笼，托盘差点没端稳。她把托盘往最近的桌上一搁，快步迎上来。
  characters:
  - CHAR-001
  dialogue: 小姐！你可算回来了！
- shot_id: EP52-S04
  scene_id: SCENE-016
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 翠微拉着林小满到角落的桌子坐下，压低声音说话。柜台后面传来另一个身影——赵景和穿着一身灰色布衣（`CHAR-007-L02`），端着一碟花生米走出来。没有龙袍、没有金冠，就是一个普通的年轻茶楼老板。他看到林小满，点头笑了笑，没有正式行礼，把花生米放在桌上后就回柜台后了。翠微看着他的背影，嘴角带着不自觉的笑意。
  characters:
  - CHAR-004
  dialogue: 你不在的时候，我们可都没闲着——苏姑娘把酒楼开成了京城第一，太妃娘娘她……
- shot_id: EP52-S05
  scene_id: SCENE-016
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 翠微的笑声慢慢收了，她看着林小满，眼神变得柔软。她给自己倒了一杯茶，握在手里，低头看着茶杯中浮沉的茶叶。窗外的午后光线斜照进来，在桌面上投下温暖的光斑。角落里一桌客人在轻声聊天，铜壶烧开的水在咕嘟咕嘟地响着。气氛从雀跃变成了一种安静的满足。翠微抬起头，声音轻了。
  characters:
  - CHAR-004
  dialogue: 小姐……你给我们的自由，我们都用上了。
- shot_id: EP52-S06
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃寝宫的深紫色帷幔还在，但那沉重的肃杀感消失了。巨大的紫檀木桌被清空了，上面铺着一张手绘的棋盘纸——用墨笔画的格子，写着"凶手""动机""时间线"等字样的纸片散落在桌面上。太妃——深紫色宫装还在（`CHAR-005-L01`），但她姿态完全不同了：她靠在一张软垫上，手里捏着一张写着"你是凶手"的纸条，嘴角带着玩味的笑意。两个宫女坐在对面，一个愁眉苦脸地撑着头看纸条，一个兴奋地指来指去在分析。太妃看到门口的脚步声，抬眼——看到林小满，一点儿也不惊讶。
  characters:
  - CHAR-005
  dialogue: 回来了？
- shot_id: EP52-S07
  scene_id: SCENE-007
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃放下纸条，站起身走向林小满。她的步伐依然从容，但多了一种轻松——不再像是压着权力走的重量，更像是散步。她在林小满面前停下，微微打量她。
  characters:
  - CHAR-005
  dialogue: 这个世界没有你写的那些冲突，也没塌。
- shot_id: EP52-S08
  scene_id: SCENE-013
  duration_sec: 10
  camera: i2v_ref 镜头跟随
  content: 林小满沿着城墙的石阶一级一级往上走。晚风吹动她的裙摆和鬓角的碎发。夕阳把整座城市染成暖金色——远处的屋顶、街道、树木，都笼罩在一片温柔的琥珀色光中。她走到城墙顶端，视野骤然开阔——远处，钱塘江大桥的叠影在夕阳中若隐若现，与现实中的古城墙形成双世界叠影。在城墙的另一端，背对着夕阳站着一个身影。玄色锦袍，玉冠束发，背影在落日中拉出一道长长的影子。他没有回头，但他知道她来了。
  characters:
  - CHAR-001
  dialogue: 他在。
- shot_id: EP52-S09
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊缓缓转过身。夕阳从他身后照来，在他的轮廓上镶了一层金色的光边。他看起来不太一样了——还是那双狭长的凤眼、冷峻的面部线条，但眉眼之间少了一层东西。从前他身上总有一种紧绷感——像一个随时要战斗的人。现在那种紧绷感消失了。取而代之的是一种安静——不是疲惫的安静，是一个人终于不需要再扮演任何角色时的那种踏实和从容。他看着林小满，没有任何惊讶的表情——就好像他知道她一定会回来。他的嘴角微微上扬了一下。
  characters:
  - CHAR-002
  dialogue: 我就知道你会回来。
- shot_id: EP52-S10
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 暮色更深了一些。城墙上的两人隔着几步的距离，风吹动他们的衣袂。林小满看着他——这个她笔下写出来的纸片人，这个从第一集就和她斗嘴的古装男主。现在他站在她面前，不再需要她来写他的命运了。他在等她说话。
  characters:
  - CHAR-001
  dialogue: 你不一样了。更……安静了。
- shot_id: EP52-S11
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊向前走了两步，在她面前停下。夕阳的光线从他的身后变成了侧面——不再逆光，她能看清他的眼睛了。那双狭长的凤眼里有一种从未有过的东西——不是腹黑、不是毒舌、不是试探——是一种认真的、郑重的、把自己完全摊开在她面前的坦诚。他开口时，语速比平时更慢，像是在说一件思考了很久很久的事情。他先说了第一段话——"你获得权限的时候，我感觉到了一件事。你是'门'。而我是那个让你决定要不要把门打开的人。"说完，他停顿了一下，目光深深地看了她一眼，然后说出了那最重要的问题。
  characters:
  - CHAR-002
  dialogue: 你获得权限的时候——我感觉到了一件事。你是'门'。
- shot_id: EP52-S12
  scene_id: SCENE-013
  duration_sec: 6
  camera: i2v_ref 镜头拉远
  content: 城墙的全景。夕阳在地平线上只剩下一抹橙红色的弧线，天空从金色渐变成深蓝紫色。远处的钱塘江大桥的叠影在暮色中更加清晰——两个世界的叠影像一幅未完成的画。林小满站在城墙边，沈长渊站在她面前，两人之间隔着半步的距离。风停了。整个世界像是屏住了呼吸——在等她的回答。她看着他，嘴唇微微动了动——
  characters:
  - CHAR-001
