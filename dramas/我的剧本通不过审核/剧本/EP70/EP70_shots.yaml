  content: 橙姐的办公室——上午的阳光从落地窗照进来。橙姐坐在办公桌后，桌上摊着一叠打印稿——是林小满新故事的前半部分。她面前放着一份合同——封面印着出版社的标志和"图书出版合同"字样。橙姐靠在椅背上，双手交叉放在桌上——姿态不是"编辑催稿"，是"出版人做决定"。她的表情——不是平时那种雷厉风行的紧迫——是一种很少在她脸上出现的、带着确定感的平静。她看着站在桌前的林小满——开口时声音干脆利落，但每个字都带着"我不是在跟你商量"的笃定。
  characters:
  - CHAR-008
  dialogue: 我上周五把你的稿子送到选题会了。
- shot_id: EP70-S02
  scene_id: SCENE-012
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在桌前——听到"过了"两个字时，她没有立刻反应过来。她眨了眨眼睛——像是大脑在处理这两个字的意思。然后她的表情以肉眼可见的速度变化——从困惑到"等一下你是说"的确认，再到一种不敢相信的、微微瞪大眼睛的震撼。她张了张嘴——声音比平时轻了很多——像怕自己声音太大把这个消息震碎一样。
  characters:
  - CHAR-001
  dialogue: 过了——是指——
- shot_id: EP70-S03
  scene_id: SCENE-012
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 办公室里安静了一瞬。林小满站在桌前——听到"实体书"三个字时，她整个人愣住了。不是"太好了"的开心——是一种"我从没想过这个故事可以被印成书"的、超越了预期的震撼。她低头——看着桌上那份合同——然后又抬头看向橙姐。橙姐没有说话——她把合同推到林小满面前——翻开到签名页——然后从笔筒里拿出一支笔，放在合同旁边。她的动作平静而流畅——像在做一件她一直知道会发生的事。然后她说出了那句话——不是作为编辑说的，是作为最早读到这个故事、最早被它打动的人说的。她的声音里没有夸张的煽情——只有一种很少在她语气中出现的、安静的确定。林小满站在那里——看着合同，看着笔，看着橙姐——眼眶慢慢红了。她深吸一口气——没
  characters:
  - CHAR-001
  dialogue: 这个故事——
- shot_id: EP70-S04
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃茶馆的午后——阳光透过纸窗洒进来，在竹桌上投下柔和的光影。茶馆里没有客人——但角色们都在：太妃坐在柜台后翻着一本书，苏晚晴坐在靠窗的桌前算账，翠微和赵景和坐在角落里共喝一壶茶，沈长渊·古装站在窗边，手里端着一杯茶，看着窗外。林小满推门进来——她的手里拿着一样东西——不是电脑，不是剧本手稿——是一份已经签好的"图书出版合同"的复印件。她走进茶馆时——所有角色都抬起头看向她。她站在茶馆中央——没有坐下来——站在那里，深吸一口气，然后说出了一句让整个茶馆安静下来的话。
  characters:
  - CHAR-001
  dialogue: 我签了一份出版合同——
- shot_id: EP70-S05
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满话音刚落——茶馆里所有人都停下了手里的动作。翠微手里的茶杯停在半空中。苏晚晴的算珠声停了。赵景和转过头来看她——嘴微微张着。窗边的沈长渊也转过了身——他端着茶杯的手悬在半空，没有放下。太妃从柜台后站了起来——动作很慢——她的目光从林小满手里的合同移到林小满的脸上。整个茶馆安静了几秒——然后所有人同时开口——每个人问的问题都不一样，但意思是一样的——"我们——变成书里的人物了？"
  characters:
  - CHAR-001
  dialogue: 那我——岂不是成书里人物了？
- shot_id: EP70-S06
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微那句"cos我"说出口之后——整个茶馆安静了一瞬。不是因为冷场——是因为这个思路太清奇了，所有人都没想到。然后赵景和先反应过来了——他的表情从震惊变成了一种带着少年气的、微微皱眉的不满。他放下茶杯——声音里带着一种'我老婆怎么能被别人cos'的本能抗议。翠微转过头看他——先是一愣——然后笑了出来——是那种"你在吃醋吗"的、甜蜜的笑。她用肩膀轻轻碰了他一下——像是在说"放心啦——没人cos得过我本人"。
  characters:
  - CHAR-007
  dialogue: cos你？——不行不行——那朕——那我不答应。
- shot_id: EP70-S07
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴在翠微和赵景和的互动之后——她又低下头看了看自己的手——然后抬起头，表情带着一种"我在认真想这个问题"的沉思。她的问题不是关于"被看到"的兴奋——是一个曾经被剥夺过角色设定的人，对"权利"的本能关注。她说出"版权"两个字时——语气里有半开玩笑的成分——但眼底深处，有一丝认真的光——因为她比任何人都更知道"角色被别人写"是什么感觉。太妃听到苏晚晴的问题——笑了——是那种蜕变之后、从容的、带着一点"你还是这么精明"的温暖笑意。她接过话头——语气里带着一种茶馆老板娘特有的轻松调侃。
  characters:
  - CHAR-006
  dialogue: 版权——这个得说清楚——如果我被印在书里——我有没有版权分成？
- shot_id: EP70-S08
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 茶馆里的气氛轻松起来——太妃笑着调侃苏晚晴，翠微和赵景和在角落里低声说着什么。林小满站在茶馆中央——看着这一切——嘴角带着一个很淡的笑意。她的目光从太妃移到苏晚晴，从翠微移到赵景和——然后落在窗边的那个人身上。沈长渊·古装——一直没有说话。他站在窗边——手里端着那杯茶——从刚才到现在一口都没喝。他的目光落在林小满手里的那份合同复印件上——不是在看热闹，是在看那份合同的分量。林小满注意到他的沉默——她朝他走近了一步——声音里带着一丝试探的轻。
  characters:
  - CHAR-001
  dialogue: 你怎么不说话？
- shot_id: EP70-S09
  scene_id: SCENE-008
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊端着茶杯——终于抬起目光，看向林小满。他的表情——不是"你们都在兴奋我也跟着高兴"——是一种更深、更安静的沉思。他开口时——声音不大，但茶馆里所有人都安静下来听他说话。他说的不是自己的事——是他在替她确认这件事的意义。他说的每一个字——都像是一个纸片人，在被告知"你要变成书里的人物了"之后，最真实的第一反应。不是兴奋——是一种"被郑重对待"之后的、深沉的认真。他说完之后——又补了一句——语气里带着他一直以来的那种、只有他能给出的、带着温度的毒舌。但这句话里——没有刺——只有一种"你值得这个"的确认。
  characters:
  - CHAR-002
  dialogue: 我在想——这个故事——
- shot_id: EP70-S10
  scene_id: SCENE-008
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 茶馆里安静下来——所有角色都在看她。林小满站在茶馆中央——阳光透过纸窗照在她脸上，在她的轮廓上镀了一层柔和的光。她低头看了一眼手里的合同——然后抬起头——目光扫过茶馆里每一张脸——太妃、苏晚晴、翠微、赵景和、窗边的沈长渊。这些人——她曾经以为是自己"写"出来的。后来她知道了——她不是他们的造物主——她是他们的朋友。她清了清嗓子——声音不大——但在安静的茶馆里，每一个字都清清楚楚。她说出这句话的时候——没有提前准备稿子——但她知道这句话已经在她心里存放了很久——从她第一次发现角色觉醒的那天起，从太妃在EP28说"请把我写完整"的那天起，从翠微说"小姐你清醒一点"的那天起——她就想对他们说这句话。
  characters:
  - CHAR-001
  dialogue: 这本书的扉页——我会写上一句话。
- shot_id: EP70-S11
  scene_id: SCENE-008
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满说完那句话之后——茶馆里没有任何人说话。不是冷场——是那句话太重了——重到没有人敢用随便一句话打破它。太妃站在柜台后——她的眼眶——微微泛红了。她低下头——假装在看柜台上的茶单——但她的手在轻轻发抖。苏晚晴低下了头——看着自己手里的账册——没有说话——但她握笔的手指微微收紧——像是要把那句话握住。翠微靠在赵景和肩膀上——没有说话——只是安静地抱着他的手臂——眼眶亮亮的。赵景和轻轻拍了拍她的手背——没有说话。而沈长渊·古装——依然站在窗边——没有动。但他的嘴角——有一个很淡很淡的——被看见了的笑意。不是"高兴"——是一个从被写下第一句台词那天起，就在等这一句话的人——终于等到了。茶馆里——
  characters:
  - CHAR-005
  dialogue: ——终于有人——说出来了。
- shot_id: EP70-S12
  scene_id: SCENE-008
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 茶馆里的安静持续了几秒——没有人愿意打破这句话留下的温度。然后沈长渊——一直没有说话的沈长渊——从窗边转过身来。他看着林小满——目光里有一种她很少在他脸上见过的表情——不是毒舌，不是腹黑，不是藏在玩笑底下的认真——是一种很安静的、很轻的、像是终于确认了自己存在意义的——满足。他朝她走了一步——就一步——然后停下来。他开口——声音不大，但在安静的茶馆里足够清晰。他的话很短——但每一句里都装着一个纸片人从被写下到觉醒到获得自由的全过程。他说完最后一句话之后——没有等林小满回答——他转身——端着那杯已经凉了的茶——走回窗边，继续看窗外——像是刚才那句话只是他随口说说的——但所有人都知道——那不是随便
  characters:
  - CHAR-001
  dialogue: 写得好。
