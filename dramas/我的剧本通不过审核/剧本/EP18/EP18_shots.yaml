  camera: i2v_ref 固定镜头
  content: 御花园午后的阳光下，翠微端着一只青瓷食盒穿过回廊。食盒盖子半开，冒着微微的热气——药膳的香味似乎能透过画面飘出来。她走得有点急，但又要护着食盒不让它洒了，步子显得有些手忙脚乱。她低头看了看食盒，小声嘀咕了一句。她穿的鹅黄衫裙在阳光下格外明亮，双丫髻上的彩色发带随着她的步子轻轻晃动。
  characters:
  - CHAR-004
  dialogue: 好了好了别洒了别洒了……小姐特地写的方子……说是给陛下补身子的……
- shot_id: EP18-S02
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 御花园亭中，赵景和正在批奏折——但他明显心不在焉，目光时不时往回廊方向瞟。当他看到翠微端着食盒走来的身影时，手里那本奏折扣在桌上，嘴角不自觉地扬了一下又迅速压平——努力维持皇帝的矜持。翠微走到亭前，微微欠身，把食盒放在石桌上，打开盖子——热气和香气一同升腾。赵景和低头看了一眼，又抬头看翠微——看她被热气熏得微微泛红的脸颊。
  characters:
  - CHAR-004
  - CHAR-007
  dialogue: 陛下。小姐说您近日操劳，特意让奴婢送一盏药膳过来。
- shot_id: EP18-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 侯府书房，竹帘半卷，傍晚暖金色的光在书案上铺开。林小满把毛笔搁在砚台上，身体向后一靠——伸了一个大大的懒腰。她面前摊着几张写满字的宣纸——墨迹还没干透，是她刚写完的"翠微送药膳"的完整段落。她低头快速扫了一遍自己写的内容，表情从满意变成了一点点得意——她觉得自己这段写得不错。细节有了、情绪有了、两人的互动自然不刻意。她满意地点了点头。
  characters:
  - CHAR-001
  dialogue: 不错不错——这段写得还行。细节到位，情绪自然——比之前那些硬凑的桥段强多了。
- shot_id: EP18-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把写好的宣纸整理好，放在书案一角。她站起来，走到窗边——窗外竹影摇曳，暮色渐浓。她伸了第二个懒腰——连日来的紧张和疲惫都在这一刻稍微松弛了一点。她回头看了一眼那叠宣纸，嘴角还带着满意的弧度。但她不知道——那些纸上很快会出现她没写的内容。
  characters:
  - CHAR-001
  dialogue: 行。翠微线搞定。等明天看看效果——应该不会差。
- shot_id: EP18-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 深夜。书房内只剩一盏油灯，竹帘外月色如水。林小满穿着一件薄外衫，披着头发——显然是已经准备睡了，但睡前又鬼使神差地走到书案前想再看一眼自己白天写的稿子。她拿起那叠宣纸，在灯下展开。她看了一遍——脸上的表情从困倦变成困惑。她又看了一遍——困惑变成了皱眉。她抬头想了想，又低头看了一遍。手指在纸面上划过——她的目光停在了她"没写过"的一段文字上。
  characters:
  - CHAR-001
  dialogue: 嗯？我写了他送走翠微之后就结束了啊——怎么还有一段？
- shot_id: EP18-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 油灯的光在纸面上跳动。林小满的手指停在纸面的一行字上。那行字写的是——「入夜。他没有睡。披衣起身，穿过长廊，停在她的院门外。」林小满的手指微微发抖——不是因为害怕，而是因为一种更复杂的情绪：困惑、兴奋、和一种隐约的"被超越"的失落。这段文字——比她白天写的那段要好。不是更好一点——是好很多。文字里有她没写出来的细腻感。她慢慢放下纸，看向窗外的月色——好像在确认自己是不是在做梦。
  characters:
  - CHAR-001
  dialogue: 这不是我写的字……但这是我的手稿。
- shot_id: EP18-S07
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 月色如洗。侯府深处的院落外，赵景和穿着一件轻便的月白长衫——没有穿龙袍，没有戴金冠，束着简单的发髻。他站在院门外的石阶上，没有进去。月光照在他脸上——他的表情不是"窥探"，而是一种"只是想看一眼"的温柔牵挂。他的视线落在院墙上那扇纸窗透出的微光上——烛火已熄，她睡了。他站了片刻，低头笑了一下——那笑容里有安心、有满足、还有一种少年人才有的笨拙深情。风吹动他的衣袂，月光把他的影子拉得很长。他低头看了看自己腕上系着的一根鹅黄色发带——下午翠微离开亭子时不小心落下的。他轻轻碰了碰那根发带，笑容更深了。他走了两步，又停下来，回头看了一眼——那一眼很短，却把所有的感情都说完了。
  characters:
  - CHAR-007
  dialogue: 白天你说……让我好好休息。你自己不也熬到这么晚。
- shot_id: EP18-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 油灯下，林小满把那段文字从头到尾重新读了一遍。这一次她读得很慢——逐字逐句。她的表情从不信变成震惊，从震惊变成一种复杂的、带着酸味的欣赏。她放下纸，深吸一口气，又拿起来看了一遍。她不是看不明白——她是在确认：这段文字确实不是她写的，但确实出现在她的手稿上。而且——写得好。她撇了撇嘴，有点不服气，但又不得不承认。她小声嘟囔了一句，语气里带着编剧的"职业病式挑剔"——但挑剔了半天，没找到毛病。
  characters:
  - CHAR-001
  dialogue: 这不是我写的。
- shot_id: EP18-S09
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站起来，拿着那叠纸走到窗边。窗外月色清冷，竹影摇曳。她低头看看纸上的字——确实是她的笔迹。她又抬头看看窗外的夜——仿佛在质问这个世界：你到底还有多少事是我不知道的？她回到书案前，坐下来，拿起笔又在砚台上蘸了蘸——但没有落笔。她看着纸面，脑子里飞速运转：如果世界能自动补全她写的剧情——那她是不是可以……利用这个能力？她想到了什么，眼睛亮了一下——但这次不是"编剧的灵感"，而是"实验者的兴奋"。
  characters:
  - CHAR-001
  dialogue: 如果世界会自动补全……那如果我故意留一段不写呢？
- shot_id: EP18-S10
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 次日清晨。书房的竹帘透进淡金色的晨光。林小满还在研究那叠"多出来"的手稿，她正低头看着赵景和夜访的那一段——越看越觉得这段"被代写"的戏确实写得好。这时翠微端着一盏茶走进来——她昨晚没睡好，眼下有淡淡的青色，但表情带着一种藏不住的、轻盈的愉悦。她放下茶盏时，余光扫到了林小满手中那叠纸上的一行字——「入夜。他没有睡。披衣起身，穿过长廊，停在她的院门外。」翠微的动作僵住了。她慢慢地、一个字一个字地读完了那段话。她的脸以肉眼可见的速度从正常肤色变成粉红再变成通红。她猛地背过身去，双手捂住脸颊。林小满抬头看她，愣了一拍才反应过来——翠微看到了那段夜访的内容。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐——这……这是什么——
- shot_id: EP18-S11
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 翠微还红着脸站在一旁，手指绞着衣角——她还没从"赵景和半夜来看她"的消息中缓过来。但林小满已经坐到了书案前，重新铺开一张空白的宣纸。她的表情认真、专注——和之前写剧本时不一样。之前她是在"创作"，现在她是在"实验"。她提起笔，在纸面上写下了一个场景标题。然后她停住了笔——她没有继续往下写。她看着那张只写了一个标题的纸，眼神里闪烁着兴奋和一丝紧张。翠微凑过来看了看，没看懂。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 深夜·御书房·一人独处
- shot_id: EP18-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 镜头缓推
  content: 又一个清晨。晨光刚从竹帘缝隙透进来，翠微就已经站在书案前了——她比林小满还急。林小满披着外衫快步走过来——两个人都盯着桌上那张纸。昨天还只有一行标题的纸上——现在写满了字。林小满拿起纸，从头开始读。翠微凑在她肩头一起看。林小满的表情在阅读过程中不断变化：一开始是"果然写了"的验证感——然后变成"嗯？"的意外——再然后变成"等一下"的警觉——最后变成"这不可能"的震惊。她的手微微发抖——不是因为害怕，而是因为纸上的内容走向了一个她完全没预料到的方向。翠微也看完了。她抬起头看林小满，脸上的红晕完全褪去——变成了一种苍白的震惊。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 果然——世界自己写了。
