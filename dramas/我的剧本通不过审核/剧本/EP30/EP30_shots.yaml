  camera: i2v_ref 镜头从厅内全景→缓慢推到林小满的脸上
  content: 侯府正厅，傍晚的光线从门窗透入，比下午更柔和——带着暖金色。角色们还坐在原来的位置上——没有人离开。会议已经结束了——但林小满没有说"散会"——她说的是"我现在就改。"所以所有人都在等她。林小满站在矮几前——桌上那些写着角色名字的纸还在——她低头看了一眼——然后闭上了眼睛。她不是在想怎么改——她已经想好了。她闭上眼睛是在——把所有的角色线在脑海里铺展开来——太妃的碎片弧线、苏晚晴的独立事业线、翠微的茶楼+感情线、赵景和的成长线、沈长渊——的"真的活"。然后她睁开了眼睛。
  characters:
