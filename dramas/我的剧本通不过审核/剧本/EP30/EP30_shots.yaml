  camera: i2v_ref 固定镜头→镜头开始抖动→闪白→恢复
  content: 林小满话音落下——世界没有像以前那样平稳地闪烁然后恢复。这一次——世界开始了前所未有的剧烈变化。不是EP29那种像"呼吸"一样的微妙闪烁——是像电脑重启一样的——视觉上的撕裂和重组。侯府正厅的颜色开始褪色——然后饱和度骤增——像画面的色彩被抽走又灌回。所有角色的身体在一瞬间僵直——他们的瞳孔放大——意识像被按下了暂停键。这不是0.5秒的闪烁——这是整整三秒的"空白"。三秒后——色彩恢复——角色们大口喘气——像从水下浮出水面。
  characters:
  - CHAR-001
  - CHAR-002
  - CHAR-004
  - CHAR-005
  - CHAR-006
  - CHAR-007
  dialogue: 这次——比任何一次都长——
- shot_id: EP30-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 刷新结束。翠微是最先恢复过来的——她弯着腰大口喘气，一只手撑在膝盖上，另一只手不自觉地摸着自己的额头——好像那里有什么东西在跳动。赵景和坐在她旁边——同样是喘不过气的状态——但他第一反应是转头去看翠微——确认她没事。翠微缓过气来后——她做了所有人都没想到的动作——她低头看着自己的手——翻来覆去地看——像在看一件刚发现的物品。
  characters:
  - CHAR-004
  - CHAR-007
  dialogue: 我——我刚才——好像看到了什么——
- shot_id: EP30-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 苏晚晴坐在自己的位置上——她没有像翠微那样大动作——她只是慢慢坐直了身体——然后闭上眼睛——像在"检查"自己的记忆。几秒后她睁开眼——脸上的表情不是困惑——是确认——带着一丝满意的微笑——那种很淡的、几乎看不出来的笑容——是苏晚晴式的"一切都在按计划进行"的表情。她开口时声音平静——但每个字都比平时更轻——像是在品味这些字的分量。
  characters:
  - CHAR-006
  dialogue: 我的商业线——被加进来了。
- shot_id: EP30-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头缓推
  content: 太妃没有立刻说话。她坐在靠窗的位置上——手扶着额头——像是经历了一场剧烈的头痛。她的表情不是疼痛——是在"整理"——像是在脑子里突然多了很多东西需要被归档。过了好一会儿她抬起头——她的眼神变了——不是EP03那种锐利的审视——也不是EP28那种脆弱的坦白——是一种释然——像是终于拼上了最后一块拼图。她缓缓抬起右手——看着自己手腕上的凤镯（PROP-007）——然后说了一句——她说得很轻——像在对自己确认。
  characters:
  - CHAR-005
  dialogue: 本宫——好像——完整了一些。
- shot_id: EP30-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在矮几前。她的脸色有些发白——不是因为害怕——是因为改写消耗的精力比她预想的更大——她感觉自己像跑完了一场马拉松。但听到太妃说"完整了一些"时——她笑了一下——那种疲惫但满足的笑容。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 完整了多少——
- shot_id: EP30-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃说完后，翠微突然从椅子上跳了起来——像个被踩到尾巴的猫——但不是因为害怕——是因为她刚发现了一件事。她低头翻自己的袖子——好像在找什么东西——然后抬起头看着赵景和——脸颊通红——但没有躲闪。她清了清嗓子——努力让自己听起来不像在尖叫——但失败了。
  characters:
  - CHAR-004
  dialogue: 赵景和——你——你刚才——在刷新之前——是不是——跟我表白了？
- shot_id: EP30-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 厅内的气氛因为翠微的发现轻松了不少——太妃"完整了一些"，苏晚晴商业线到位，翠微表白提前——一切都在朝好的方向发展。林小满笑着看向大家——然后她的目光落在了沈长渊身上。他一直没有说话。从刷新结束到现在——他站在原地——双臂交叠在胸前——和会议时一样的位置——表情没有变化。林小满的笑容慢慢收了——因为她看到了——他什么变化都没有。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 你——没有变。
- shot_id: EP30-S09
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头·过肩
  content: 厅内其他人还在各自检查着自己的新剧情——翠微和赵景和小声争论着"你刚才是不是脸红了"——太妃在端详自己手腕上的凤镯——苏晚晴已经拿出了一小片纸在写着什么（她的商业计划已经开始）。但林小满和沈长渊之间——隔着一小片安静的空气。林小满看着他——她知道自己失败了——不是因为她不够用力——是因为她改的是能改的东西——而他要的东西——不在剧本里。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 那你想要的东西——在哪里——
- shot_id: EP30-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头·沈长渊特写
  content: 沈长渊站在逐渐暗下的光线中——傍晚已经过去，厅内没有点灯——他的脸一半在暮色中，一半在窗外最后的夕照中。他的表情不是失望——不是对林小满失望——是一种更深层的平静——像是一个已经想通了的人，在接受一个他早就知道的答案。他说这句话时——没有EP29那种沉重的力度——没有那种"我只要你把我写活"的锋芒——而是像在说一句很简单的、他已经消化了很久的事实——他说得越平静——就越说明这个答案在他心里已经放了很久。
  characters:
  - CHAR-002
  dialogue: 你写的东西——只能改变纸上的我。
- shot_id: EP30-S11
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头·俯拍+推近
  content: 深夜的侯府书房。没有点灯——只有月光从窗外竹帘的缝隙中漏进来，在地板上画出银白色的横条纹。林小满坐在书案前——不是白天那种充满干劲的姿态——她靠在椅背上——头微微后仰——看着天花板。桌上那些写着角色名字的纸还在——但在月光下它们不再像"需求图"——它们只是她还没收起来的废纸。她的手机（PROP-002）放在案角——屏幕朝上——黑暗中屏幕突然亮起——一声轻微的震动。她低头——拿起手机——屏幕的光映在她脸上。是一条微信——来自备注名为"房东"的人——她盯着屏幕看了几秒——这个备注名在EP08之后就没有再出现过新消息——她差点忘了自己还有这个联系人。她点开消息。
  characters:
  - CHAR-001
  dialogue: ——
- shot_id: EP30-S12
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 镜头缓推→停在她的眼睛上
  content: 林小满盯着手机屏幕。房东的微信内容不长——但她读了三遍——不是因为没看懂——是因为她需要确认自己没有看错。她的表情从疲惫——变成了困惑——然后变成了——一种新的认识。她慢慢放下手机——然后低头看向自己的左手手腕——月光下，倒计时印记（PROP-006）的数字稳定地显示着"42"——没有跳动——没有闪烁——稳定得像什么都没发生过。但房东——在现实世界——他感觉到了。林小满慢慢抬起头——月光照在她的脸上——她的表情不是恐惧——是一种更深层的东西——像是她一直在拼一幅拼图——现在多了一片——但这一片——不属于她熟悉的任何区域。她不知道这片拼图会画什么——但她知道——它正在改变她对整个世界的理解。
  characters:
  - CHAR-001
  dialogue: 你感觉到了——
