shots:
- shot_id: EP42-S01
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 林小满坐在地板上，背靠着床沿，手机夹在耳朵和肩膀之间。午后的阳光已经偏西，在地板上拉出一道温暖的光带——但光带离她越来越远，她坐在阴影里。她低着头，听筒里传出断断续续的声音。她的表情不是恐惧——是一种"听到无法理解的事情"时的那种凝固。她的手指慢慢收紧，握住手机的指节泛白。阳光照在木地板上，空气中的浮尘在光柱里缓慢浮动——像时间本身在减速。
  characters:
  - CHAR-001
  dialogue: 小满——这里没有方向。没有时间。像掉进了一面镜子后面。
- shot_id: EP42-S02
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 镜头缓缓推近她的脸。她靠在床沿上，头微微后仰，眼睛盯着天花板，像在消化一个她不想消化的事实。手机屏幕的蓝白光在她脸颊上造成冷色的反射——和房间里温暖的夕阳光形成对比。她的嘴唇微张，但没有发出声音。听筒里的声音继续。她闭上眼睛——不是逃避，是"让我把这句话听清楚"的姿态。
  characters:
  - CHAR-001
  dialogue: 我在这里——终于想明白了一件事。
- shot_id: EP42-S03
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满慢慢坐直了身体。她把手机从耳朵边拿下来，看了一眼屏幕——来电显示还是"沈长淵"——然后又贴回耳边，像在确认这一切是真的。夕阳光斜照在她身上，让她的侧影在墙上拉出一道轮廓。她下意识地把左手腕翻过来——看见倒计时印记上的数字：42。还在。她放下手腕。
  characters:
  - CHAR-001
  dialogue: 你知道吗——他为什么这么做？——不是因为你是编剧。不是因为你会写故事。
- shot_id: EP42-S04
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 她的话被打断了——听筒里的回答简单、清晰，像一颗石子投入深水。她的瞳孔动了一下——不是震惊的放大，是记忆被触发的微颤。她想起了。那个深夜，她喝了酒，和一个朋友抱怨——"好想活在自己写的故事里啊。那里的人都比较单纯。"她当时以为只是醉话。但从电话那头传来的下一句话让她知道——那个醉话，被人认真记住了。
  characters:
  - CHAR-001
  dialogue: ——'好想活在自己写的故事里。'——你说的。三年前的一个晚上。你在喝酒。对面坐着你的编辑。
- shot_id: EP42-S05
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把手机从右手换到了左手。这个动作让她能看到自己的手腕——那串数字还在，但在夕阳光下看比刚才更暗了。她低头看着手腕上的印记，像在跟它说话。她需要一个更具体的答案。她需要一个"为什么是你"的解释。
  characters:
  - CHAR-001
  dialogue: 为什么是他？——他为什么要为一个不认识的人做这些？
- shot_id: EP42-S06
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 镜头推到她的眼睛。她的眼眶开始泛红——不是因为悲伤，是因为一个画面正在她脑海中浮现：三年前，她刚来杭州的第一周，在一家小画廊里，她站在一幅古装人物画前自言自语。她不知道有人在身后看她。她不知道那个人从那一天起，就记住了她。
  characters:
  - CHAR-001
  dialogue: ——三年前。画廊。你站在一幅画前面说——'这个人的故事我可以写一百集。'
- shot_id: EP42-S07
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 镜头缓缓拉远
  content: 镜头缓缓拉远——林小满整个人出现在画面中。她坐在地板上，背靠着床，双腿蜷起，手臂搭在膝盖上，手机捏在指间。她整个人看起来突然变得很小。夕阳光已经退到了墙角，房间大部分浸在灰蓝色的暮色中。她的左手腕搭在膝盖上——那串数字在暮色中发出微弱的淡金色光。她垂下头，前额的碎发遮住了她的表情。她开口了——声音干涩，像是从很深的地方打捞上来的。
  characters:
  - CHAR-001
  dialogue: 三年。——他花三年时间……建了一个世界。
- shot_id: EP42-S08
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满慢慢抬起头——她问出了那个最核心的问题。她看着前方虚空中的某一点，像在试图理解一个超越她认知的概念。
  characters:
  - CHAR-001
  dialogue: ——那你是谁？——你是他的一部分，还是另一个人？
- shot_id: EP42-S09
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满没有回答。她只是把手机更紧地贴在耳朵上。她的表情不是震惊——是一种"所有碎片终于拼在一起"后，安静地裂开的表情。眼眶红了，但没有泪水掉下来——太满的时候，反而流不出来。
  characters:
  - CHAR-001
  dialogue: 一个在外面——等你。一个在里面——陪你。
- shot_id: EP42-S10
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 手机从耳边慢慢滑落——不是因为震惊，是因为听筒里已经没有声音了。屏幕亮着——通话已结束。三个字："00:00"。她盯着那三个字看了很久。然后她把手机翻过来，屏幕朝下，放在地板上。像在埋葬什么。房间里重新安静下来——空调的低鸣声、远处街上的车声、冰箱压缩机的嗡嗡声。这些一直存在的、被她忽略的环境音——此刻全部涌了回来。她坐在黑暗的房间里，窗外最后一抹夕阳正在消失。她的手指在地板上慢慢收紧，又松开。三个深呼吸。每个呼吸都像在把散落的自己重新拼起来。
  characters:
  - CHAR-001
  dialogue: ——他还在夹缝里。——我把他一个人留在那里了。
- shot_id: EP42-S11
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 黑暗的房间中，左手腕上突然亮起一道金光——倒计时印记在自动闪烁。不是她触碰的——是它自己亮了。数字开始跳动——从42开始——像倒计时秒表被按下了加速键。金色的光芒在黑暗中一明一暗地闪烁，照亮了她手腕上细小的汗毛和皮肤纹理。
  characters:
  - CHAR-001
  dialogue: ——怎么回事——我没碰它——
- shot_id: EP42-S12
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 镜头拉近→固定
  content: 镜头从手腕拉到她的脸——金色光芒映在她脸上，照出她瞳孔中的恐惧和不可理解。数字继续疯狂下降——30 → 25 → 18 → 10 → 5。她另一只手按住手腕——但停不下来。光芒越来越亮，然后——突然停了。数字定格在1。淡金色的数字不再闪烁——静静地、固执地亮在那里。一个孤零零的"1"。她看着这个数字，呼吸急促。整个房间重新陷入灰蓝色的黑暗中。
  characters:
  - CHAR-001
  dialogue: ……一天。
- shot_id: EP42-S13
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 黑暗的角落——光影波动了一下。一个身影从虚无中浮现——深紫色的宫装，在现实世界的出租屋里显得格格不入。太妃站在房间的阴影中——不是走进去的，是像水墨在宣纸上晕开一样，从黑暗中显现出来的。她的凤镯在微弱的光线下发光。两个世界在这一刻——第一次在现实中重叠。她的声音不高不低——像她一直在那里，只是在等合适的时机开口。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 你知道真相了。
- shot_id: EP42-S14
  scene_id: SCENE-001
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃的脸在黑暗中清晰起来——她的表情不是威严，不是威胁，而是一种超越了这一切的、平静的严肃。她不是在审判——她是在传递一个她也没有办法改变的事实。这个世界有自己的规则，而她只是规则的传递者。她用最轻的声音说出了最重的话。
  characters:
  - CHAR-005
  dialogue: 明天日落之前——你必须做出最终选择。
- shot_id: EP42-S15
  scene_id: SCENE-001
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 太妃的身影开始变淡——像她来时一样，如同一滴墨在水中扩散、消散。她不是离开了这个房间——是这个世界不能再承载她了。在完全消失之前，她留下了最后几句话。林小满跪坐在地板上，仰头看着她消散的身影。手腕上的"1"在黑暗中发出微弱但坚定的光——像一颗不肯熄灭的星。太妃的身影完全消散在空气中——只留下最后一句话的回声。林小满独自坐在黑暗的房间里。手机屏幕朝下躺在地板上。手腕上的"1"静静地亮着。窗外——城市的天际线上，第一缕晨曦还未出现。距离日落——还有整整一天。
  characters:
  - CHAR-005
  - CHAR-001
  dialogue: 天亮之前——到皇宫来找我。你知道怎么来。
