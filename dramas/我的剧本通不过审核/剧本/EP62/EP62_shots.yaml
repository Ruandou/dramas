- shot_id: EP62-S01
  scene_id: SCENE-006
  duration_sec: 6
  camera: t2v 镜头拉远
  content: 御花园被装点成了一片暖红色的海洋——红绸从亭台的屋檐垂落，沿着回廊的立柱系成一排，在春日黄昏的风里轻轻飘动。杏花正值盛放，花瓣随着风飘进画面，落在红绸上、落在石阶上、落在亭前的流水里。假山旁的石径上洒满了红色的花瓣——不是林小满写的，是角色们自己布置的。亭子里摆着几桌酒席，碗筷整齐，红烛已点燃。晚霞在天空铺开一层暖金色——像是整个世界都在为这场婚礼加上一层温柔的滤镜。
  characters: []
  dialogue: 这场婚礼——我一笔都没写。
- shot_id: EP62-S02
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和站在亭前的花树下——他穿着一身大红色喜服，金色滚边，胸口系着一朵红绸花。不是龙袍——他今天不是皇帝，是一个娶亲的新郎。他的头发全部束起用一根红玉簪固定，少年的面容在喜服的映衬下显得格外明亮——眼神里有期待、有紧张、有压不住的喜悦。他的姿态挺拔——不再是那个总是微驼着背、说话跳跃的优柔少年，是一个做了选择之后站直了的人。他看着通往亭台的小径——等他的新娘走过来。
  characters:
  - CHAR-007
  dialogue: 朕——不对——我今天不当皇帝了——
- shot_id: EP62-S03
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 小径的另一头，一个红色的身影出现了。翠微穿着大红色嫁衣——不是繁复的宫廷嫁衣，是普通女子出嫁的喜服，绣着鸳鸯和并蒂莲，袖口和衣摆有精致的金线绣花。她的双丫髻不见了——头发盘成了妇人髻，插着一支红玉簪和一朵红色的绒花，是她自己选的发饰。她的脸上画了淡淡的妆容——脸颊微红，眉眼含笑，樱桃小口涂了胭脂。但最引人注目的——是她右手拿的一样东西。不是团扇，不是绣帕——是一把打磨得油亮的红木算盘。她一边走一边拨了一下算盘珠子——动作熟练得像呼吸一样自然。
  characters:
  - CHAR-004
  dialogue: 来了来了——新娘子来了！
- shot_id: EP62-S04
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 赵景和看到翠微走过来的那一瞬间——他的笑容从嘴角蔓延到了眼角。他迈出一步迎上去——但走到一半又停住了，像是怕走太快会破坏这个画面。翠微看到他那个"想走又不敢走"的表情，笑得更灿烂了。她举起手里的红木算盘——不是挡脸，是展示——然后她噼里啪啦地拨了一串珠子，报出了一个数字。赵景和听到那个数字——先是愣了一下，然后笑了——笑声带着一种"我就知道你会算这个"的宠溺。
  characters:
  - CHAR-004
  dialogue: 刚算过了——今天收的礼金——刚好够开一家茶楼分店。
- shot_id: EP62-S05
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 两人在亭前站定——夕阳把他们的身影拉长，在铺满花瓣的石径上交叠在一起。没有司仪，没有高堂——他们自己对着天地拜了三拜，每一拜，翠微手里的算盘珠子都随着动作轻轻地晃响。赵景和看着翠微，不像是皇帝看着妃子——像是一个终于娶到了心上人的少年。她抬头看他，笑容里带着"这可是我自己选的"的笃定。他低声说了一句话——声音不大，但在这个安静的黄昏里，每一个字都很清楚。他说的不是甜言蜜语——是一句和她的算盘一样务实的话。
  characters:
  - CHAR-007
  dialogue: 你当老板娘——我给你当账房先生。
- shot_id: EP62-S06
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 两人对视——赵景和伸手轻轻地握住了翠微拿着算盘的那只手。算盘在他们的手中间发出"咔"的一声轻响——不是什么浪漫的声音，但在这一刻，它比任何誓言都更有分量。他们同时笑了——不是新婚夫妻的含蓄微笑，是两个做了重大决定之后彼此确认的笑。少年放弃了皇位，丫鬟拿起了算盘——他们不是被写好的"皇帝和宫女"的结局，是他们自己选的"账房先生和茶楼老板娘"的人生。
  characters:
  - CHAR-007
  dialogue: 茶楼——就叫'景翠楼'。
- shot_id: EP62-S07
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 御花园的角落——一棵老杏树下。林小满站在那里，没有去主桌入座。她靠着树干，双手抱臂，姿态放松——但她的眼眶出卖了她。夕阳在她身后斜斜地铺开，把她整个人的轮廓镀上一层温暖的金色。她看着亭前的翠微和赵景和——看着他们拜天地、笑着说话、握着手——她的眼眶从微红变成湿润。她没有哭出声，也没有擦眼泪——就让那层水光薄薄地覆在她眼底。她的嘴角微微上扬——不是一个"我很开心"的标准笑容，是一个编剧看到自己笔下的角色活成了自己最想要的样子时，那种复杂的、安静的满足。
  characters:
  - CHAR-001
  dialogue: 我只是写了'御花园初遇'——让他们在花树下碰见。
- shot_id: EP62-S08
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的眼眶终于撑不住了——一滴眼泪从她的右眼滑落，沿着脸颊的线条无声地坠入衣领。她没有抬手去擦——不是不想擦，是她怕一抬手就会让情绪崩塌。她看着赵景和俯身在翠微耳边说了什么——然后翠微笑着用算盘轻轻敲了他一下——这个画面太"他们自己选的"了。她深吸一口气——轻轻呼出——然后低声说了一句话，像是在对自己确认这个奇迹是真的。
  characters:
  - CHAR-001
  dialogue: 我写的剧本里——没有这场戏。
- shot_id: EP62-S09
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 一个人影从侧面走近——脚步沉稳，不疾不徐。沈长渊站在林小满身侧，和她并排靠着同一棵老杏树。他没有看她——他看的是亭前婚礼的方向，目光安静而温暖。两个人都没有说话，就那么静静地站了几秒，看着远处的红色身影在夕阳里碰杯、大笑——翠微的笑声隔着半个花园传过来。然后沈长渊开口了——声音低沉，带着一种他已经知道答案的语气——但他还是想听她说。
  characters:
  - CHAR-001
  dialogue: 你写的？
- shot_id: EP62-S10
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满终于把目光从婚礼上收回来——她侧过头，看向站在她身边的沈长渊。夕阳刚好落在他的侧脸上——他的眉眼被光镀上了一层暖色，平日里凌厉的线条在这一刻变得柔和。她看着他——想起了这个剧本世界的起点：她写了一个"长安侯世子沈长渊"，用七个字创造了一个完整的灵魂。远处传来宾客的欢笑声——赵景和在喊"大家喝酒！"——她转回去再看了一眼那片暖红色的花树，然后开口了。她的声音平静——像是在陈述一个她已经思考了很久的结论。
  characters:
  - CHAR-001
  dialogue: 我只写了相遇。
- shot_id: EP62-S11
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 镜头拉远
  content: ⚠️ 四人同框——用中景构图保持面部一致性：翠微和赵景和站在亭前，苏晚晴从酒桌旁站起来，太妃从另一侧的茶台前走来。四个人手里都端着一杯酒——不是剧本安排的动作，是他们都想到了同一件事。翠微端着酒杯，目光穿过花园，锁定了角落里站在杏树下的林小满。她的笑容还挂着，但眼神变得认真——不是开玩笑的时候了。她开口时，声音不像平时那么跳脱，而是带着一种只有在婚礼上才会出现的、真诚的郑重。三个人跟着她——太妃端着暖杏色的酒杯微笑着，苏晚晴端着酒杯目光温暖。
  characters:
  - CHAR-004
  dialogue: 林小满——你过来。
- shot_id: EP62-S12
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: ⚠️ 六人同框为单人+反打+群像拆分拍摄。林小满怔了一下——她没想到会在这时候被点名。她从杏树下走出来，走到亭前——面前是四个端着酒杯的角色和一个站在她身边跟上来的沈长渊。翠微站在最前面，赵景和站在她旁边，苏晚晴靠在酒桌边沿，太妃端着一杯暖杏色的酒——六个人，六杯酒。翠微看着林小满，笑了一下——不是平时的吐槽笑，是一个新娘子在婚礼上说真心话时的那种笑。她举起酒杯——不是对着"编剧"的方向，是对着"林小满"的方向——这个区别，在场每个人都懂。
  characters:
  - CHAR-001
  dialogue: 第一杯——敬我们的朋友林小满。
- shot_id: EP62-S13
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在中间，眼眶还红着——她张了张嘴想说什么，但喉咙像被什么堵住了。她看着面前这些角色：翠微——她的第一个盟友，从工具人丫鬟变成了茶楼老板娘兼新娘子。赵景和——她写过"优柔寡断"的少年，现在笑着放弃了皇位。苏晚晴——那个曾经怒斥她的女配，现在端着酒杯目光温暖。太妃——穿着暖杏色衣裳，端着一杯茶（她不喝酒了），微笑着看着她。她抬起手——轻轻掩住了嘴——不是因为想吐，是因为情绪堵到了嗓子眼。她没办法说出一句完整的话。
  characters:
  - CHAR-001
  dialogue: 你们——
- shot_id: EP62-S14
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 太妃端着暖杏色的茶杯，微笑着举起杯子——她的姿态从容而温暖，和那个深紫色宫装的反派判若两人。苏晚晴也举起酒杯——她的笑容淡然，但眼底的温暖藏不住。翠微已经笑出了眼泪——她用嫁衣的袖口擦了擦眼角。沈长渊站在林小满身边——他什么也没说，但他举起了手里的酒杯——不是举向谁，是举向了这片天空——举向这个让他从一个"七个字"变成了一个活生生的人的世界。四个人举杯——敬的不是编剧，是那个把他们当成"人"来写的朋友。
  characters:
  - CHAR-005
  dialogue: 敬相遇。
- shot_id: EP62-S15
  scene_id: SCENE-006
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在原地——夕阳已经完全沉到了屋檐下，天空从暖金变成了温柔的紫粉色。晚风拂过杏花树，花瓣落在她的肩上、发间、酒杯边缘。她端着酒杯——那杯酒是翠微塞到她手里的——她到现在还没喝，因为她的情绪还没消化完。她看着面前这些角色——看着那些没有她也已经能活下去的脸。她终于明白了——她在这个世界的存在意义，不是"写他们"，是"和他们一起活着"。她低头看了一眼杯中的酒——琥珀色的酒面上映着最后一缕晚霞的光。她轻轻吸了吸鼻子，嘴角带着一个颤抖的笑意——像是被全世界最温暖的东西击中了一样。
  characters:
  - CHAR-001
  dialogue: 他们叫我朋友。
- shot_id: EP62-S16
  scene_id: SCENE-006
  duration_sec: 5
  camera: i2v_ref 镜头拉远
  content: 林小满终于抬起头——眼泪无声地滑落，但嘴角的笑容明亮得像一盏灯。她举起酒杯——不是举向谁，是举向天空——举向这个让她从一个"被催稿的编剧"变成了一个有朋友的人的世界。她的声音哽咽——但每个字都清清楚楚——这是她在这个世界说出的、最像她自己的话。然后画面从她的特写缓缓拉远——御花园的全景，六个人站在亭前，晚风拂过，红绸飘动，花瓣回旋。所有人同时举杯——无声的默契。定格在这一帧。
  characters:
  - CHAR-001
  dialogue: 原来——我不是编剧。
