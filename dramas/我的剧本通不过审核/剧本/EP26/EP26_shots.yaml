  content: 密室深处一个被忽略的角落。林小满和翠微通过一条狭窄的暗道走了进来——不是之前太妃发现她们的那个入口，而是另一个更隐蔽的通道。翠微提着一个小包袱，里面装着蜡烛和火折子。密室里的空气闷热而沉重，墙上的纸条在微弱的光线下像是无数只眼睛。林小满扫了一眼线索墙——太妃冻结了主入口，但没来得及清理这个备用的角落。她的目光落在角落一个落满灰的木箱上——之前她没有注意到过。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 小姐——你确定太妃不知道这个入口？
- shot_id: EP26-S02
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满蹲下来，吹开木箱上的灰。箱盖没有锁——她轻轻一掀就开了。里面不是金银财宝——是一摞旧书和纸张。上面那层是空的——有人翻过。但在最底下——压着一本牛皮封面的旧日记。封面上没有任何字，但边角已经被翻阅磨得发白。她拿起日记——封面触感粗糙，书脊有裂痕。她翻开第一页——看到字迹的那一刻，她的呼吸停了一拍。字迹是从工整到潦草的——开头几页写得整整齐齐，后面越来越乱、越来越急。和她的剧本手稿一模一样的变化轨迹。
  characters:
  - CHAR-001
  dialogue: 这是——有人写过的日记——
- shot_id: EP26-S03
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把蜡烛移近，开始读日记的开头。翠微凑过来，两人借着烛光一起看。日记里的第一页写着："第1天。我又穿越了——不是第一次，但希望是最后一次。"林小满的眉头皱了起来——"又穿越了"——这个"又"字表明，写日记的人不是第一次穿越。她翻到第二页。"第3天。角色们都觉醒了。他们知道自己是纸片人。他们对我写的剧情不满意——和上次一样。"林小满的手指停在那一行——"和上次一样"——这个人在穿越之前就知道角色会觉醒——说明这至少是他的第二次穿越。她继续读下去——越读越快——每一个字都像在照镜子。
  characters:
  - CHAR-001
  dialogue: 第1天——我又穿越了——不是第一次——但希望是最后一次——
- shot_id: EP26-S04
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满没有回答翠微的问题——因为她读到了更让人不安的内容。第7天的记录："遇到了太妃。她警告我不要修改太多——说世界会不稳定。她说的和真的一样——但我上次也听过同样的话。"又是"上次"。这个人已经穿越过至少两次——知道太妃会说什么、会做什么。他第二次走进来的时候，已经是有备而来的。但即便如此——他最后还是失踪了。林小满翻了翻日记的厚度——这本日记的记录跨越了大约两个月，比她想象的要长得多。她继续往下读——下一页开始提到密室。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 第7天——遇到了太妃——她警告我不要修改太多——说世界会不稳定——
- shot_id: EP26-S05
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满翻到日记的中段——记录着发现密室之后的经历。她读到的每一行都和自己亲身经历的几乎一模一样：密室墙上的纸条、角色的名字、"太妃——第一个觉醒者"、"沈长渊——钥匙"——每一个字她都见过。写日记的人在墙上看到了和她完全一样的信息。但有一处不同——第32天的记录里有一段她没看到的话："墙上还有一行小字——在最下面——像是被谁匆忙写上去的——'别信眼睛看到的。钥匙不是你想的那个人。'"林小满的手指停在这一行——她的心跳加快了一拍。"钥匙不是你想的那个人"——这个信息和第5个编剧的短信"别信墙上写的，太妃篡改过内容"形成了呼应。
  characters:
  - CHAR-001
  dialogue: 密室——墙上有名字——太妃第一个觉醒者——沈长渊是钥匙——和我在墙上看到的一模一样——
- shot_id: EP26-S06
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微接过日记自己看了一遍那行字——她的表情变了。如果太妃篡改了墙上的内容——那这行"钥匙不是你想的那个人"可能就是被太妃擦掉的部分。而前任编剧看到了它——记在了日记里。林小满继续往下翻——日记的后面部分开始变得不稳定。字迹越来越乱——不再按日期——有些页只有几个字，有些页大片大片的空白。她翻到倒数第6页——上面只有一句话："我又试了一次。又失败了。"倒数第5页——"太妃不让我靠近那扇门。她说门后是虚无——但上次有人告诉过我——门后不是虚无。我应该信谁？"倒数第4页——"我决定信那个人。明天——去开门。"倒数第3页和倒数第2页——被撕掉了。只剩最后一道纸根。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 钥匙不是你想的那个人——那——钥匙是谁？
- shot_id: EP26-S07
  scene_id: SCENE-005
  duration_sec: 12
  camera: i2v_ref 缓推
  content: 林小满翻到了日记的最后一页——最后一张没有被撕掉、还有字的页面。纸上只有一行字——字迹很用力，像是写最后一个字的人手在发抖，或者是在写下这句话时用了全身的力气。她读出了声——这行字像一盆冷水浇在头上："不要让钥匙开门。门后什么都没有。"林小满读完最后一个字，沉默了很久。翠微也看到了那行字——她的脸色在烛光中发白。门后什么都没有——前任编剧去了门后——然后什么都没发现？还是说——"什么都没有"的意思是——门后不存在任何东西——连门本身都是假的？如果钥匙开门后什么都没有——那太妃在阻止什么？那个神秘人在阻止什么？她转过头，看向密室墙上——那里写着"沈长渊——钥匙"。如果钥匙开门后什么都没有——那沈
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 不要让钥匙开门。门后什么都没有。
- shot_id: EP26-S08
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满把日记翻回到被撕掉的那两页的位置——她仔细看着纸根。撕得很干净——不是匆忙撕掉的，是沿着装订线整齐地撕下来的。这说明撕页的人有时间、有计划地做了这件事——不是在被追赶的慌乱中撕的。她在烛光下凑近看——在纸根的最边缘，有一点点墨迹渗透过的痕迹。倒数第3页——被撕掉之前——上面写着字。墨迹透过纸页在纸根上留下了极淡的印记。她眯起眼——试图辨认那几个几乎看不见的字。她只辨认出第一个字——"门"。门什么？门后？门前？门里面？
  characters:
  - CHAR-001
  dialogue: 撕得很整齐——是故意撕的——不是慌乱中撕的——
- shot_id: EP26-S09
  scene_id: SCENE-005
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微也凑过来看——但她也看不清更多的字了。那两页被撕得太干净——剩下的墨迹太少。林小满合上日记——手指在封面上摩挲。她感觉到日记的封面厚度——不对。封面内侧——比正常的厚了一点。她翻开封面内侧——夹层。有一张照片塞在里面——因为年代久远，纸张已经和封面粘在了一起。她小心地把它抽出来——是一张褪色的彩色照片。照片里两个人：一个穿着古装——应该是前任编剧——她穿着和林小满类似的襦裙（前任编剧也是女性）。另一个——穿着现代衣服——白T恤、深色外套——那个人——脸被涂黑了。不是曝光——是用黑色墨水笔，把脸涂成了一个黑色的椭圆形。
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 能看出第二个字吗？
- shot_id: EP26-S10
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 一张褪色的照片躺在林小满的掌心。照片里的古装女子站在左边——大约三十岁，面带微笑——但笑容里有一种疲惫。她穿着和林小满风格相近的古装——浅蓝色交领襦裙——说明她在穿越时也被自动"换装"了。而她身边站着的另一个人——穿着白色T恤、深色外套——现代服装。在这个古装世界的一个角落——一个穿着现代衣服的人——和穿着古装的前任编剧——站在一起拍照。这意味着：①那个人不是穿越后被换装的角色——他/她保留了自己的现代装束
    ②他/她可以在这个世界自由行动 ③前任编剧认识他/她——并且和他/她合照。但那个人的脸——被黑色墨水涂成了一个椭圆的黑块。是谁涂的？前任编剧自己？还是别人——在日记被藏起来之后——把照片上
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 照片里——两个人——左边的穿古装——应该是写这本日记的人——
- shot_id: EP26-S11
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满把照片翻过来——背面没有字。她又翻回来——在烛光下仔细看涂黑的部分。墨水氧化程度和照片本身的老化程度一致——不是近期涂的。是在照片被放进夹层的时候——或者之前——就已经涂掉了。她突然想到：苏晚晴说她刚诞生时看到的那个背影——穿着现代衣服——在写字。那个背影——和照片里这个穿现代衣服的人——是同一个吗？前任编剧知道那个人是谁——所以合照了——但后来又把脸涂掉了——是保护那个人？还是恨那个人？她看了看密室墙上的纸条——"沈长渊——钥匙"——又看了看日记的最后一页——"不要让钥匙开门。门后什么都没有。"——然后又看了看照片里的人——穿现代衣服、脸被涂黑。这三样东西放在一起——她脑中突然闪过一个
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 墨水的氧化程度——和照片一样老——不是最近涂的——是放进去之前就涂了——
- shot_id: EP26-S12
  scene_id: SCENE-005
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满独自站在密室中——翠微在她身后不远处，但两人都没有说话。她把日记合上，握在手里。照片被她小心地夹回了封面内侧。她看着密室墙上的纸条——那些她之前深信不疑的信息——"太妃——第一个觉醒者""沈长渊——钥匙""林小满——第7个编剧"。但现在她有了新的信息——前任编剧的日记说钥匙不是那个人、不要让钥匙开门、门后什么都没有——还有一张照片，证明有一个穿现代衣服的人自由穿梭在这个世界。哪一个是真的？墙上写的——还是日记里写的？还是两者都不完整？太妃篡改过墙上的内容（第5个编剧的短信说）。但那本日记会不会也被篡改过？照片上的脸是谁涂掉的？她闭上眼——在脑海中把EP22以来的所有信息重新排列。当她睁开
  characters:
  - CHAR-001
  - CHAR-004
  dialogue: 墙上的信息——和日记里的信息——在打架。太妃篡改了墙——但日记也可能被改过——
