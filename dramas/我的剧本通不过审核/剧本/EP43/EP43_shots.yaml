- shot_id: EP43-S01
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满坐在窗边的榻上，面前空无一物——但她盯着前方某处，像在看一块只有她自己能看到的屏幕。眼睛红肿，但没有在哭；眼眶干涩发红，下眼睑有明显的泪痕干涸痕迹。她的视线聚焦在虚空中的某一点上——"脑内编辑器"的位置。那个区域什么也没有。一片空白。竹帘半卷，午后的光线从窗外斜照进来，但照不到她的脸——她坐在光的阴影边缘。
  characters:
  - CHAR-001
  dialogue: 写啊……倒是写啊……
- shot_id: EP43-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 镜头推进到她的眼睛——瞳孔里反射着窗外竹影的微光。她的视线没有焦点，像在看着一片无形的荒原。她微微张了张嘴，又合上了。手放在膝上，指节微微泛白——不是用力，而是无处着力的那种僵硬。她垂下眼帘。
  characters:
  - CHAR-001
  dialogue: ——全白了。一个字……都写不出来。
- shot_id: EP43-S03
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 门外。翠微站在紧闭的木门前，手里端着一个食盒——竹编的，盖子微微掀起一角，露出里面码得整整齐齐的桂花糕，淡黄色，上面缀着干桂花粒。她站在门缝前，侧耳听了听——听不到任何声音。她咬了咬下唇，又抬手敲了敲门。敲门声在静谧的走廊里回响。
  characters:
  - CHAR-004
  dialogue: 小姐——你在里面吗？
- shot_id: EP43-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 翠微把耳朵贴在门上。漫长的沉默。门内什么声音都没有——不是刻意的安静，而是里面的人像不存在一样。翠微的眼眶慢慢红了。她慢慢把食盒放在门边的地上，退后半步。鹅黄的衫裙在昏暗的走廊里显得孤零零的。她张了张嘴，还想说什么——但最终没有说出口。
  characters:
  - CHAR-004
  dialogue: ……小姐。你说句话呀。
- shot_id: EP43-S05
  scene_id: SCENE-003
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 窗外。苏晚晴站在庭院里，抬头看着二楼那扇紧闭的窗户。她穿着月白色的衣裙，衣袂在午后的微风中轻轻飘动。她不是翠微那种焦虑——她是克制的、有策略的。她看着那扇窗户，像在评估一道难题。她开口了——声音不大，但咬字清晰，能穿透窗纸。
  characters:
  - CHAR-006
  dialogue: 林小满——别以为把自己关起来就能解决问题。
- shot_id: EP43-S06
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头跟随
  content: 走廊尽头。脚步声——沉稳的、一步一步的——由远及近。不是翠微的轻快碎步，不是苏晚晴的从容步伐——是太妃的。深紫色宫装的下摆拂过地砖，凤镯在腕间纹丝不动。她走到门前，看到了地上已经凉透的桂花糕——弯腰，拾起食盒，放在旁边的架子上。然后她直起身，面朝门板，开口了。她的声音不高不低——不是威胁，不是安慰，而是像一个见过同样场景很多次的人，在陈述一个她早已知道的事实。
  characters:
  - CHAR-005
  dialogue: 你前六个编剧——都是在这个节点放弃的。
- shot_id: EP43-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃没有看门——她微微侧着头，像在对着门内那个蜷缩的身影说话。她的脸上没有太妃的威仪——只有一种沉淀了很久的、接近温柔的东西。她的话不是逼问，是递过去的一把钥匙。
  characters:
  - CHAR-005
  dialogue: ——都在这里。在知道了全部真相之后——在只剩最后一步的时候。
- shot_id: EP43-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 太妃微微低下头，目光落在门缝上——仿佛能透过那一条细缝，看到里面的人。她的表情变了——不是太妃的表情，是一个等了很久、看了很多次、已经不再愤怒的人的表情。她的声音里没有责备，只有一种穿越了七次失败之后的、接近慈悲的坦白。
  characters:
  - CHAR-005
  dialogue: 写不出结局——不是因为没能力。
- shot_id: EP43-S09
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头缓缓推近
  content: 镜头推向太妃的脸——她的眼角有一丝极其细微的颤抖。她接下来的话——不是说给门内的人听的，更像是说给自己听的。那些她亲眼见证过六次的停滞、六次的门内沉默、六次再也没打开过的门。她深吸一口气，然后说出了最残酷也最温柔的那一句。
  characters:
  - CHAR-005
  dialogue: 怕写完之后——故事就真的结束了。
- shot_id: EP43-S10
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 镜头拉开
  content: 门内。林小满的侧影。她保持了很久的凝固姿势——但在太妃说出最后一个字的时候，她的肩线动了一下。不是颤抖——是一口气终于呼出来的那种松弛。她低下头，看着自己空空的双手。然后她站起来了——动作很慢，像身体比大脑先做出了决定。她走到门前，手放在门闩上。
  characters:
  - CHAR-001
  dialogue: 太妃——
- shot_id: EP43-S11
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 门开了。林小满站在门内，太妃站在门外。客栈走廊的昏暗光线与门内透出的午后阳光在门槛上交汇成一条模糊的界线。林小满的眼睛是红的，但没有哭——她的表情不是崩溃，是"被说中了"之后的那种赤裸。太妃看着她的样子——没有惊讶，没有胜利的表情，只有一种"果然如此"的、带着心疼的了然。
  characters:
  - CHAR-001
  - CHAR-005
  dialogue: 不是问我经历过什么。——我问的是你。
- shot_id: EP43-S12
  scene_id: SCENE-003
  duration_sec: 12
  camera: i2v_ref 固定镜头
  content: 太妃没有说话。她看着林小满——不是太妃看编剧的目光。是一个人看另一个人的目光。她沉默了几秒——不是在犹豫，是在回忆。她的目光有一瞬间的放空——像在透过林小满，看着七年前、五年前、三年前——那些同样站在门口、同样红着眼睛的编剧们。走廊里安静得能听到庭院里竹叶摩挲的声音。然后她开口了。她说每一个字的时候，眼睛都没有离开林小满。
  characters:
  - CHAR-005
  dialogue: 七次。
