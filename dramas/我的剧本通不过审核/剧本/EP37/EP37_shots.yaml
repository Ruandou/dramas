- shot_id: EP37-S01
  scene_id: SCENE-003
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 沈长渊的书房。傍晚的光线从竹帘的缝隙中斜射进来，在桌案上投下细密的阴影条纹。他站在窗前，背对门口，一只手按在腰间的玉佩（PROP-004）上——他的指尖轻轻摩挲着玉面的纹理。听到脚步声，他没有立刻回头。但他的手指在玉佩上停住了——他听得出她的脚步声。窗外竹影摇曳。
  characters:
  - CHAR-002
  dialogue: 你从太妃那边过来——你的步子——比平时急。
- shot_id: EP37-S02
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满站在书房门口，还没踏进去。她的手扶着门框——不是需要支撑，是一种"我还没准备好怎么说"的延迟。她看着他的背影——玄色锦袍，玉冠束发，窗外的竹影在他身上晃动。她认识这个背影很久了——在剧本里写了七十多集，在现实世界的房东照片里看过，在这个世界里面对面了无数天。但今天她要说的东西——会让这一切都不一样。她深吸了一口气，走进书房，放下了扶着门框的手。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 嗯——从太妃那儿过来的。有件事——我得告诉你。
- shot_id: EP37-S03
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满没有坐下。她站在书房中央，面对着他——她的影子被窗外的夕光拉长在青石地板上。她的语速不快不慢——她在控制自己把所有信息说完整，不是一股脑倒出来，而是一条一条摆在桌面上。沈长渊始终站着，靠在窗边——他的手垂在身侧，没有抱臂（防御姿态），没有按剑（警惕姿态）——他就那么安静地听着。但她的每一句话落下去的时候，他的目光都有一丝几乎不可察觉的变化。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 太妃被第一个编剧骗了七年。她一直以为钥匙开门后是虚无——但书里写了——门后是现实世界。
- shot_id: EP37-S04
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满深吸了一口气。刚才那些——太妃、钥匙、世界——是"任务"。接下来的——是她自己的事。她的手指微微攥紧了袖口又松开。她看着他的眼睛——这是第一次她在告诉他事实之前，先作了心理准备。但还是要说。
  characters:
  - CHAR-001
  dialogue: 还有一件事——不是关于太妃的——是我的。
- shot_id: EP37-S05
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊看着她。他听到了所有——太妃的同意、门后是现实、钥匙是他本人、以及她最后那句"不管你怎么选"。他垂着眼——不是回避，是在消化。窗外的竹影在他脸上晃动，他按在玉佩上的手指收紧了一瞬——然后松开了。他抬起头。他没有回答关于"选不选"的问题——他问了另一个问题。一个林小满没有预料到的问题。
  characters:
  - CHAR-002
  dialogue: 我选 你说——两个世界连通之后——你会留在这里——还是回你的世界——再也不回来？
- shot_id: EP37-S06
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满愣住了。她准备好了他会问"代价是什么"、"世界能撑住吗"、"太妃可信吗"——她甚至准备好了他会拒绝。但她没有准备好他问的是这个。不是在问钥匙的事——是在问她。是在问"我还见不见得到你"。她的手停在半空中——本来想做一个手势来解释通道的机制——但那个手势僵住了，然后她慢慢放下了手。她张了张嘴——她发现这个问题她也没有答案。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我——
- shot_id: EP37-S07
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 沈长渊从窗边走过去——他走到书案前，手指轻轻拂过案上摊开的那卷书简，但没有看。他的目光在远处——在看窗外那些在风中摇晃的竹影。他的声音比他想要表达的内容更平静——他早就想过这个问题了。从EP32世界崩塌的那一刻起，当他在裂缝中看到现实世界的白光时——他就在想这个问题了。
  characters:
  - CHAR-002
  dialogue: 我不怕成为钥匙——我也不怕开门。
- shot_id: EP37-S08
  scene_id: SCENE-003
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 林小满的呼吸停了一拍。他的话像一只手——不是打她——是轻轻按住了她。她从来没有从沈长渊嘴里听到过这样的话。他从来不说怕——他从来不说"需要"——他从来不说"我不希望你走"。他是那个在她写糟糕桥段时说"我帮你改"的人，是那个在她说"你觉醒了"时反问"那你还会在吗"的人。她看着他——窗外的夕光在他的侧脸上勾勒出一道暖金的轮廓。他的眼睛没有在看她——他在看远处。但他的手——他按在玉佩上的那只手——微微发白。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 我——从来没有想过——你会怕这个。
- shot_id: EP37-S09
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满沉默了几秒。然后她做了一个她自己也没预料到的动作——她在书案边坐了下来。不是在对面的客座，是沈长渊平时坐的那个位置——他的椅子。她坐下来，手放在他看过的那卷书简旁边。这个动作本身就是一个回答——她在他的空间里坐下。她抬起头看着他。她已经想好了。她开口时，声音恢复了那种她特有的、带着一点吐槽味但很认真的语调。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 好。我回答你那个问题。
- shot_id: EP37-S10
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 沈长渊看着她坐在自己的书案前。他看了很久——久到窗外的光线又暗了一分。他的目光从她脸上移到她手边的那卷书简上——那是他这些日子里反复看的一卷书，不是兵法，是他自己试着写的"如果林小满不在了"的假设。他没给任何人看过。他走到书案前，在她对面——不是隔着整张桌子，而是侧边的位置——他坐下来。他没有回答"好"或者"我选"。他说的那句话——是沈长渊式的——没有修饰，没有迂回——他直接在说出决定的同时提出了他唯一在乎的条件。
  characters:
  - CHAR-002
  dialogue: 我选择成为钥匙。
- shot_id: EP37-S11
  scene_id: SCENE-003
  duration_sec: 11
  camera: i2v_ref 固定镜头
  content: 林小满看着他——他坐下来了。他说的不是"我答应"——他说的是"我选择"。"选择"和"答应"不一样——"答应"是被动的，"选择"是主动的。沈长渊是在告诉她：这件事不是你在要求我做——是我自己决定的。他从腰间取下那枚麒麟玉佩（PROP-004），放在书案上，推到她的方向。玉佩在夕光中透出温润的光。他看着她——不是那个冷峻的长安侯世子看一个编剧的眼神——是一个人看着另一个人、在说一件重要的事时的眼神。他的声音恢复了他标志性的那种——字数少、分量重。这一次——不只是条件。是在把钥匙交出去之前——最后一个请求。
  characters:
  - CHAR-001
  - CHAR-002
  dialogue: 钥匙我给你——我这个人也给你。但你要答应我一件事。
