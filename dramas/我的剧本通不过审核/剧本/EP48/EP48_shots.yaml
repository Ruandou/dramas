- shot_id: EP48-S01
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 无垠的纯白空间向四面八方无限延伸，浅蓝色的透视网格线在地面缓缓向远处收束，消失在纯白的雾气中。空间中没有风、没有声音——只有绝对的寂静。林小满的古装身影站在网格线的中心，像一粒尘埃落在一张无限大的白纸上。她缓缓睁开眼睛，瞳孔因为这片纯白而微微收缩。淡紫色的襦裙裙摆安静地垂着，没有任何风能吹动它。远处，一张孤零零的木桌上放着一台银色笔记本电脑（`PROP-001`），屏幕合着，A面的贴纸在柔和的光线中隐约可见。
  characters:
  - CHAR-001
  dialogue: 这就是……作者空间。
- shot_id: EP48-S02
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 镜头跟随
  content: 林小满走向空间中心的木桌，每一步都没有脚步声——纯白的地面吸收了所有声音。她站定在桌前，低头看着那台笔记本电脑。屏幕合着，A面上的贴纸在柔和的无影光中显得格外清晰——其中一张便利贴上写着"第15版大纲——这次一定过"的笔迹，是林小满自己的字。她伸手，指尖悬停在屏幕上方，停顿了一秒。然后轻轻翻开屏幕——纯白的文档界面亮起，光标在左上角安静地闪烁，等着她的第一个字符。
  characters:
  - CHAR-001
  dialogue: 所有角色都在等我……沈长渊、翠微、太妃、苏晚晴——他们都把命运交到我手上了。
- shot_id: EP48-S03
  scene_id: SCENE-010
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 林小满的手指即将落在键盘上——就在这时，她停下了。屏幕上的光标突然开始不规则地闪烁，不是正常的输入节奏，而是一明一灭像心跳。她皱起眉头。然后她感觉到了——空气中的温度变了，从恒定的微凉变得有呼吸般的波动。空间远处那些漂浮的文字碎片开始震颤，像被什么力量扰动。她缓缓抬起头。
  characters:
  - CHAR-001
  dialogue: ……什么？
- shot_id: EP48-S04
  scene_id: SCENE-010
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 浅蓝色的网格线在空间某处开始扭曲，像石子投入平静水面泛起的涟漪。那些涟漪的中心，一个模糊的人影正在凝聚——从透明到半透明，轮廓逐渐清晰。是一个男人的身影。他穿着洗得有些发白的深蓝色衬衫，外面套着一件旧卡其色风衣——不是古装，是现代装束。约莫四十五六岁，身形清瘦，面容疲惫但眼神极其清澈温和，像是很久没有和人说过话、但终于等到了要等的人。他站在离她约十步远的地方，双手随意地插在风衣口袋里，嘴角带着一丝极淡的微笑。
  characters:
  - CHAR-001
- shot_id: EP48-S05
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满整个人绷紧了，一只手按在电脑屏幕上，像随时准备合上电脑逃离。但那个男人没有动，没有靠近，只是安静地站在原地，像怕惊动一只鸟。他的表情温和得不像一个闯入者——更像是等了很久的旧友。他微微歪了歪头，嘴角的笑意加深了一点，目光里带着一种复杂的情感——怀念、欣慰、还有一点点如释重负。白色的无影光打在他脸上，照出了他眼角的细纹和下巴上淡淡的胡茬。
  characters:
  - CHAR-001
  dialogue: 你是谁？怎么会在这里？
- shot_id: EP48-S06
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 缓推
  content: 林小满的眉头紧锁，警惕没有消退。她打量着这个陌生男人——他的衬衫袖口有磨损，风衣下摆有几处深浅不一的污渍，像是一个人在同一个地方待了很久很久。她的目光在他的衣着上一扫而过——现代装束？他怎么穿着现代衣服出现在这里？她的大脑飞速运转，试图找到一个解释。
  characters:
  - CHAR-001
  dialogue: 等我？你知道我要来？
- shot_id: EP48-S07
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 固定镜头
  content: 镜头聚焦在第1个编剧的脸上。他低下头，像是不知道从何说起，然后抬起头来，眼神里带着一种奇异的平静——一个人把自己最大的秘密藏了七年，终于可以说了的那种平静。他先从口袋里抽出一只手，指尖敲了敲自己的太阳穴，像是在组织语言。然后他开口了——声音不大，但每个字都清晰地落在寂静的白色空间里。
  characters: []
  dialogue: 我是第1个编剧。
- shot_id: EP48-S08
  scene_id: SCENE-010
  duration_sec: 6
  camera: i2v_ref 镜头推近
  content: 林小满整个人像被钉在了原地。她的大脑拒绝处理这句话——第1个编剧？真正的作者？她张了张嘴，什么声音都发不出来。她的手从电脑上滑落，垂在身侧。过了好几秒，她才找回自己的声音，但那个声音听起来像是别人的——又尖又哑。
  characters:
  - CHAR-001
  dialogue: 什么——？！
- shot_id: EP48-S09
  scene_id: SCENE-010
  duration_sec: 5
  camera: i2v_ref 固定镜头
  content: 第1个编剧没有急着反驳。他只是安静地听她说，然后轻轻摇头，目光里没有得意，只有一种温柔的歉意——像是在说"对不起，让你一直蒙在鼓里"。他向前走了一步，步伐很轻，像是不确定自己是否被允许靠近。
  characters: []
  dialogue: 沈长渊没有骗你。他自己也不知道。
- shot_id: EP48-S10
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 纯白空间中，两人隔着一张木桌相对而立。林小满的手紧握着桌沿，指节发白。第1个编剧站在对面，他的表情异常平静——像是把这件事在心里翻来覆去说了无数遍，已经不再有波澜了。头顶柔和的无影光照亮两人之间的桌面，那台笔记本电脑的屏幕已经自动熄灭了，像是给他们让出对话的空间。远处漂浮的文字碎片静止不动，像是也在聆听。
  characters:
  - CHAR-001
  dialogue: 锚……什么意思？为什么是他？
- shot_id: EP48-S11
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 固定镜头
  content: 林小满站在那里，她的表情像是被无数个问题堵住了喉咙。她攥紧的手渐渐松开——不是因为她接受了，是因为太多信息同时涌来，她反而冷静了。她抬起头，直视着对面的男人。她的声音里没有了恐惧，只剩下一个创作者对另一个创作者的质问——直接、赤裸、不留余地。
  characters:
  - CHAR-001
  dialogue: 那你为什么不自己守下去？为什么选中我？
- shot_id: EP48-S12
  scene_id: SCENE-010
  duration_sec: 8
  camera: i2v_ref 固定镜头
  content: 第1个编剧沉默了片刻。然后他笑了——不是礼貌的、社交的笑，而是一个人在回忆很久以前的自己时，不自觉露出的那种带着怀念和苦涩的笑。他低下头，看着自己磨损的衬衫袖口，像是在确认自己还穿着七年前的衣服。当他抬起头时，他的眼睛里有一种她从未见过的温柔——像是在看过去的自己。
  characters: []
  dialogue: 你以为我一开始就是什么了不起的人？
- shot_id: EP48-S13
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 镜头拉近
  content: 第1个编剧向前迈了一步，然后伸出手——他的手掌摊开，掌心朝上，像在等待她把手放上去。他的手指上有写字磨出的老茧，掌心有岁月的纹路。纯白的光线在他掌心和指尖勾勒出柔和的轮廓。他的眼神里没有施舍、没有怜悯——只有一种郑重的、平等的托付。林小满看着他伸出的手，又抬头看他的眼睛。她感受到了一股从心底涌起的情绪——不是恐惧，不是犹豫，是一种被选中、被信任的重量。
  characters:
  - CHAR-001
  dialogue: 所以——你今天来这里，是为了……
- shot_id: EP48-S14
  scene_id: SCENE-010
  duration_sec: 9
  camera: i2v_ref 固定镜头
  content: 第1个编剧的手依然伸着，他的笑容里多了一丝疲倦——不是虚弱的那种疲倦，是一个人终于可以卸下重担时的那种松弛。他的眼角有些发红，但他没有哭，只是微笑着。周围的纯白空间似乎变得柔和了一些，边缘微微泛着暖金色的光——像是这个世界感受到了他的释然，在回应他。林小满看着他伸出的手，又抬起头看他的眼睛。那双眼中有七年的孤独、七年的等待、七年的坚持——和一个创作者对自己作品最深沉的爱。
  characters:
  - CHAR-001
  dialogue: 那你呢？你把权限给我——你去哪？
- shot_id: EP48-S15
  scene_id: SCENE-010
  duration_sec: 10
  camera: i2v_ref 镜头拉远
  content: 林小满终于伸出手，握住了第1个编剧的手掌。在触碰的瞬间，第1个编剧的身影开始变得透明——从脚底开始，像沙粒被风吹散一样逐渐消散。但他没有痛苦的表情，只有微笑。林小满感觉一股暖流从掌心涌入——她突然"看到了"整个世界的脉络：金銮殿的每一根柱子、侯府的每一片竹叶、天牢的每一滴漏水、每个角落每个角色此刻正在做什么……整个世界的信息像一幅巨大的画卷在她脑海中展开。她的瞳孔微微放大，呼吸停滞了一瞬。当她回过神来，对面已经空无一人。只有她的笔记本电脑屏幕重新亮起，光标在左上角安静地闪烁，等着她的第一个字符——但这一次，她知道她写的每一个字，都会成为真实。她缓缓坐下，手指落在键盘上。
  characters:
  - CHAR-001
  dialogue: 谢谢你……七年辛苦了。
