      visual: 陈建国家，白炽灯泡光线偏冷。CHAR-005-L01 坐在方桌边，面前摆着铝饭盒。CHAR-001-L01 站在桌旁，刚说完营业部的事。CHAR-005-L01 猛地站起来，饭盒被带得翻倒在地，剩菜洒了一桌。
