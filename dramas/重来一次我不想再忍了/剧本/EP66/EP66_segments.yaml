    shots:
      - id: EP66-S01
        type: "全景"
        duration_sec: 6
        description: "股东大会会场座无虚席。周明轩坐在主席台上，神情从容。林晚坐在台下第一排。气氛凝重。"
      - id: EP66-S02
        type: "近景"
        duration_sec: 6
        description: "周明轩站起身，走到发言席。会场安静下来。"
  - id: EP66-SEG02
    scene_id: SCENE-013
    description: "segment 2"
    total_duration_sec: 12
    shots:
      - id: EP66-S03
        type: "中景"
        duration_sec: 6
        description: "周明轩陈述收购理由，PPT上展示着数据。"
      - id: EP66-S04
        type: "近景"
        duration_sec: 6
        description: "台下股东交头接耳。林晚表情平静，指尖轻轻敲着桌面。投资传奇坐在她旁边，微微点头。"
  - id: EP66-SEG03
    scene_id: SCENE-013
    description: "segment 3"
    total_duration_sec: 12
    shots:
      - id: EP66-S05
        type: "中景"
        duration_sec: 6
        description: "周明轩发言结束。主持人询问是否有不同意见。林晚站了起来。"
      - id: EP66-S06
        type: "近景"
        duration_sec: 6
        description: "林晚走向发言席，手里拿着一个平板。全场目光聚焦。"
  - id: EP66-SEG04
    scene_id: SCENE-013
    description: "segment 4"
    total_duration_sec: 12
    shots:
      - id: EP66-S07
        type: "特写"
        duration_sec: 6
        description: "平板上显示原型机的估值报告——未来三年预期收益翻五倍。"
      - id: EP66-S08
        type: "中景"
        duration_sec: 6
        description: "股东们交头接耳，有人点头。周明轩的表情不变，但眼神冷了几分。"
  - id: EP66-SEG05
    scene_id: SCENE-013
    description: "segment 5"
    total_duration_sec: 12
    shots:
      - id: EP66-S09
        type: "中景"
        duration_sec: 6
        description: "投资传奇站起身，走到台前。"
      - id: EP66-S10
        type: "近景"
        duration_sec: 6
        description: "全场哗然。周明轩的瞳孔微缩——这是他没有预料到的变数。"
  - id: EP66-SEG06
    scene_id: SCENE-013
    description: "segment 6"
    total_duration_sec: 12
    shots:
      - id: EP66-S11
        type: "中景"
        duration_sec: 6
        description: "投票开始。股东们逐一投票。林晚握紧拳头。"
      - id: EP66-S12
        type: "特写"
        duration_sec: 6
        description: "大屏幕上票数交替上升——50%对50%。最后一票——赵总站起来。"
  - id: EP66-SEG07
    scene_id: SCENE-013
    description: "segment 7"
    total_duration_sec: 12
    shots:
      - id: EP66-S13
        type: "中景"
        duration_sec: 6
        description: "大屏幕显示——林晚胜出。全场掌声。林晚闭上眼睛，深吸一口气。陆北辰在人群中微笑。"
      - id: EP66-S14
        type: "近景"
        duration_sec: 6
        description: "周明轩站起来，整理西装。表情平静得可怕。他走到林晚面前。"
  - id: EP66-SEG08
    scene_id: SCENE-013
    description: "segment 8"
    total_duration_sec: 12
    shots:
      - id: EP66-S15
        type: "中景"
        duration_sec: 6
        description: "周明轩走出会场，在走廊上被林晚叫住。他回头。"
      - id: EP66-S16
        type: "近景"
        duration_sec: 6
        description: "周明轩微微一笑，转身离开。走了三步，停住，回头。"
