shots:
  - id: EP66-S01
    scene_id: SCENE-013
    type: "全景"
    duration_sec: 6
    description: "股东大会会场座无虚席。周明轩坐在主席台上，神情从容。林晚坐在台下第一排。气氛凝重。"
    dialogue: "（会场低语声）"
  - id: EP66-S02
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "周明轩站起身，走到发言席。会场安静下来。"
    dialogue: "周明轩："各位股东——今天是一个重要的日子。""
  - id: EP66-S03
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "周明轩陈述收购理由，PPT上展示着数据。"
    dialogue: "周明轩："盛天资本提出的方案——溢价30%收购。这是对股东最有利的选择。""
  - id: EP66-S04
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "台下股东交头接耳。林晚表情平静，指尖轻轻敲着桌面。投资传奇坐在她旁边，微微点头。"
    dialogue: "林晚（内心）："等他说完。""
  - id: EP66-S05
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "周明轩发言结束。主持人询问是否有不同意见。林晚站了起来。"
    dialogue: "林晚："我有。""
  - id: EP66-S06
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "林晚走向发言席，手里拿着一个平板。全场目光聚焦。"
    dialogue: "林晚："在投票之前——我想给大家看一样东西。""
  - id: EP66-S07
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 6
    description: "平板上显示原型机的估值报告——未来三年预期收益翻五倍。"
    dialogue: "林晚："这是我们自主研发的新产品。独立估值报告——三倍溢价。不是收购的溢价——是它自己的溢价。""
  - id: EP66-S08
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "股东们交头接耳，有人点头。周明轩的表情不变，但眼神冷了几分。"
    dialogue: "（股东议论声）"
  - id: EP66-S09
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "投资传奇站起身，走到台前。"
    dialogue: "投资传奇："我以个人名义——担保这个估值的真实性。如果三年内达不到——差额我来补。""
  - id: EP66-S10
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "全场哗然。周明轩的瞳孔微缩——这是他没有预料到的变数。"
    dialogue: "（全场惊呼声）"
  - id: EP66-S11
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "投票开始。股东们逐一投票。林晚握紧拳头。"
    dialogue: "（无声——只有投票器的按键声）"
  - id: EP66-S12
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 6
    description: "大屏幕上票数交替上升——50%对50%。最后一票——赵总站起来。"
    dialogue: "赵总："我投——林晚。""
  - id: EP66-S13
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "大屏幕显示——林晚胜出。全场掌声。林晚闭上眼睛，深吸一口气。陆北辰在人群中微笑。"
    dialogue: "（掌声雷动）"
  - id: EP66-S14
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "周明轩站起来，整理西装。表情平静得可怕。他走到林晚面前。"
    dialogue: "周明轩："恭喜。"林晚："谢谢。""
  - id: EP66-S15
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "周明轩走出会场，在走廊上被林晚叫住。他回头。"
    dialogue: "林晚："周总——你的牌打完了吗？""
  - id: EP66-S16
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "周明轩微微一笑，转身离开。走了三步，停住，回头。"
    dialogue: "周明轩："游戏还没结束。""
