        镜头1（12秒）大特写→特写 镜头缓推→固定：深夜办公室，林晚面前那张画满箭头的关系图被暖黄灯光照亮。她看了很久——久到窗外城市灯火都开始零星熄灭。然后在凌晨寂静的办公室里她开口了——声音很轻，轻到如果有人在旁边都未必能听清，但那份重量是十年来最沉的一次：「原来……是一场局。」她轻轻折起那张纸放进包里，关掉台灯。办公室里一片黑暗，只有窗外城市灯火勾勒出她坐在椅子上的剪影。她没有立刻站起来离开——需要在这片黑暗里再多坐一会儿。
