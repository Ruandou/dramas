shots:
  - id: EP67-S01
    scene_id: SCENE-013
    type: "全景"
    duration_sec: 6
    description: "硅谷会议中心，座无虚席的国际科技峰会。大屏幕上显示着"Lin Wan - Shengtian Tech"。林晚站在幕后，深呼吸。"
    dialogue: "（英文同声传译背景音）"
  - id: EP67-S02
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "陆北辰在台下第一排，朝她点了点头。林晚微笑着走上舞台。"
    dialogue: "主持人："让我们欢迎——盛天科技CTO，林晚。""
  - id: EP67-S03
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚站在演讲台前，用流利的英文开场。"
    dialogue: "林晚（英文）："五年前——我是一个被裁员的普通员工。今天——我站在这里，想告诉各位——技术不认出身。""
  - id: EP67-S04
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "台下观众安静倾听。有人开始拿笔记录。"
    dialogue: "林晚（英文）："我们做了一件事——用三分之一成本，实现了行业顶尖的性能。""
  - id: EP67-S05
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚展示原型机数据，大屏幕上显示性能对比图。"
    dialogue: "林晚（英文）："这是我们的原型机测试数据。和行业顶尖产品的对比——我不说话，数据说话。""
  - id: EP67-S06
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 6
    description: "台下投资传奇微笑着鼓掌。观众席响起掌声。"
    dialogue: "（掌声响起）"
  - id: EP67-S07
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚的演讲进入高潮——她讲述了自己的创业故事。"
    dialogue: "林晚（英文）："有人问我——为什么要做这件事？因为我相信——最好的技术来自那些被逼到绝境的人。""
  - id: EP67-S08
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "观众起立鼓掌。林晚眼眶微红。"
    dialogue: "（全场起立，经久不息的掌声）"
  - id: EP67-S09
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "投资传奇走到台边，低声对林晚说了什么。林晚惊讶地看着他。"
    dialogue: "投资传奇（低声）："刚才有人找我——周明轩的董事会通过了新的收购方案。""
  - id: EP67-S10
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "林晚表情瞬间变化。"
    dialogue: "林晚（低声）："什么时候的事？""
  - id: EP67-S11
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚稳定情绪，回到演讲台。她面朝观众，微笑。"
    dialogue: "林晚（英文）："所以我的回答是——是的，我们正在寻找全球合作伙伴。""
  - id: EP67-S12
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 6
    description: "大屏幕上出现林晚的邮箱。台下多位投资人拿出手机拍照。"
    dialogue: "（台下观众纷纷拍照记录）"
  - id: EP67-S13
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 8
    description: "林晚快步走出演讲厅，在走廊上给陆北辰打电话。"
    dialogue: "林晚："周明轩又动了一步。我们得提前回国。""
