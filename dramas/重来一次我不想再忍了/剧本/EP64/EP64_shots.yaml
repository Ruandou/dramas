total_shots: 13
shots:
  - id: EP64-S01
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚早早到办公室，发现电脑上有一封未读邮件。点开——脸色一变。"
    dialogue: "林晚（内心）："冻结？""
  - id: EP64-S02
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 6
    description: "屏幕上是银行的通知函——公司账户被"异常交易审查"冻结。林晚拿起手机。"
    dialogue: "林晚："陆北辰——出事了。""
  - id: EP64-S03
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "陆北辰快步走来，林晚把手机给他看。他皱眉。"
    dialogue: "陆北辰："周明轩的手能伸到银行去？""
  - id: EP64-S04
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "林晚："他不需要伸手——他只需要打一个电话。冻结审查，走流程七天。七天之后——我们所有供应商都会断供。""
    dialogue: "林晚："他不需要伸手——他只需要打一个电话。七天——我们撑不过七天。""
  - id: EP64-S05
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚和陆北辰坐在咖啡厅角落。桌上摊着一堆文件。"
    dialogue: "陆北辰："我认识一个人——在银行信贷部。但他欠我人情。""
  - id: EP64-S06
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "林晚看着他："多大的人情？"陆北辰沉默了一下。"
    dialogue: "陆北辰："我爸出事后——唯一没躲的人。可以试试。""
  - id: EP64-S07
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "陆北辰拿着手机走出咖啡厅。林晚独自坐在座位上，看着窗外。"
    dialogue: "林晚（内心）："他在用自己的脸面——换我的时间。""
  - id: EP64-S08
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "陆北辰回来，坐下。表情平静。"
    dialogue: "陆北辰："明天下午。资金到账。""
  - id: EP64-S09
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "林晚在工位上整理文件。贺云峰从她身边走过。"
    dialogue: "贺云峰："林副总监——还撑得住吗？""
  - id: EP64-S10
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 6
    description: "林晚抬头，微笑。"
    dialogue: "林晚："撑不撑得住——明天见分晓。贺总。""
  - id: EP64-S11
    scene_id: SCENE-013
    type: "中景"
    duration_sec: 6
    description: "公司只剩林晚一人。她盯着手机，等待银行的到账通知。时间一分一秒过去。"
    dialogue: "（无声——只有时钟滴答声）"
  - id: EP64-S12
    scene_id: SCENE-013
    type: "特写"
    duration_sec: 4
    description: "手机屏幕亮起——银行到账通知。林晚呼出一口气。"
    dialogue: "林晚（内心）："第一局——拿下了。""
  - id: EP64-S13
    scene_id: SCENE-013
    type: "近景"
    duration_sec: 10
    description: "林晚走出办公室，准备回家。手机震动——来电显示：周明轩。她接起。"
    dialogue: "周明轩（电话声）："林晚——你以为——就你有牌？""
