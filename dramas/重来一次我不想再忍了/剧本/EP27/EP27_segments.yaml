        镜头2（6秒）特写 推近 CU→ECU：图1的目光在名单上从左到右从上到下缓缓移动，表情随着阅读在微微变化。然后她的目光在某一个名字上停住了——瞳孔微微收缩，呼吸停了一瞬。她再读了一遍那个名字确定没有看错。她慢慢抬起头从纸张上移开目光看向窗外的黑暗，然后低下头手指轻轻点了点那个名字的位置。画面定格在她的手指停在那个名字上的特写。
