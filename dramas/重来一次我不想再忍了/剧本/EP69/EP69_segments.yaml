        type: "中景"
        duration_sec: 6
        description: "剪彩仪式。林晚拿起剪刀。"
      - id: EP69-S06
        type: "特写"
        duration_sec: 6
        description: "红绸缎被剪断。全场掌声。林晚的眼睛里闪着光。"
  - id: EP69-SEG04
    scene_id: SCENE-001
    description: "segment 4"
    total_duration_sec: 12
    shots:
      - id: EP69-S07
        type: "中景"
        duration_sec: 6
        description: "剪彩后，林晚和陆北辰在咖啡厅休息。"
      - id: EP69-S08
        type: "近景"
        duration_sec: 6
        description: "陆北辰看着她。"
  - id: EP69-SEG05
    scene_id: SCENE-001
