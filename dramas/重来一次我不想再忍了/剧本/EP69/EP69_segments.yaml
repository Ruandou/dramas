      - id: EP69-S01
        type: "全景"
        duration_sec: 6
        description: "明亮的新办公室，落地窗，绿植。林晚站在自己的新办公室里，看着窗外。这是她创业后的新公司。"
      - id: EP69-S02
        type: "中景"
        duration_sec: 6
        description: "苏晴走进来，手里拿着两杯咖啡。"
