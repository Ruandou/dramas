        type: "中景"
        duration_sec: 6
        description: "林晚和苏晴并肩走过开放式办公区。年轻员工们正在忙碌。"
      - id: EP69-S04
        type: "近景"
        duration_sec: 6
        description: "林晚停下来，看着一个女程序员专注地写代码。她微笑。"
  - id: EP69-SEG03
    scene_id: SCENE-001
    description: "segment 3"
    total_duration_sec: 12
    shots:
