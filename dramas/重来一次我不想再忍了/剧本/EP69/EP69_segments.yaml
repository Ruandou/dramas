    total_duration_sec: 12
    shots:
      - id: EP69-S09
        type: "近景"
        duration_sec: 6
        description: "林晚从口袋里掏出那枚硬币（EP65陆北辰给她的），在指尖翻转。"
      - id: EP69-S10
        type: "中景"
        duration_sec: 6
        description: "陆北辰笑了。"
  - id: EP69-SEG06
    scene_id: SCENE-001
    description: "segment 6"
    total_duration_sec: 12
    shots:
      - id: EP69-S11
        type: "中景"
        duration_sec: 6
        description: "林晚回到原来的公司办公室收拾东西。她环顾这个曾经奋斗了五年的地方。"
      - id: EP69-S12
        type: "近景"
        duration_sec: 6
        description: "她拿起桌上的相框——里面是和苏晴、陆北辰的合影。"
  - id: EP69-SEG07
    scene_id: SCENE-001
