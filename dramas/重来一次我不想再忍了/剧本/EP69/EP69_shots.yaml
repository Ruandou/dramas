# EP69 shots.yaml
episode: EP69
total_duration_sec: 80
total_shots: 13
shots:
  - id: EP69-S01
    scene_id: SCENE-001
    type: "全景"
    duration_sec: 6
    description: "明亮的新办公室，落地窗，绿植。林晚站在自己的新办公室里，看着窗外。这是她创业后的新公司。"
    dialogue: "林晚（内心）："三个月前——我还以为这条路走不下去了。""
  - id: EP69-S02
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "苏晴走进来，手里拿着两杯咖啡。"
    dialogue: "苏晴："林总——该剪彩了。"两人相视而笑。"
  - id: EP69-S03
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "林晚和苏晴并肩走过开放式办公区。年轻员工们正在忙碌。"
    dialogue: "林晚（内心）："这些人——把未来押在了我身上。""
  - id: EP69-S04
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "林晚停下来，看着一个女程序员专注地写代码。她微笑。"
    dialogue: "林晚（内心）："我不会让他们失望的。""
  - id: EP69-S05
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "剪彩仪式。林晚拿起剪刀。"
    dialogue: "主持人："——请林总为我们的新公司剪彩！""
  - id: EP69-S06
    scene_id: SCENE-001
    type: "特写"
    duration_sec: 6
    description: "红绸缎被剪断。全场掌声。林晚的眼睛里闪着光。"
    dialogue: "（掌声、欢呼声）"
  - id: EP69-S07
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "剪彩后，林晚和陆北辰在咖啡厅休息。"
    dialogue: "陆北辰："感觉怎么样？"林晚："比想象中——轻。""
  - id: EP69-S08
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "陆北辰看着她。"
    dialogue: "陆北辰："是因为——不用再扛着那些敌人的重量了。""
  - id: EP69-S09
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "林晚从口袋里掏出那枚硬币（EP65陆北辰给她的），在指尖翻转。"
    dialogue: "林晚："这枚硬币——我一直在想，该怎么花。""
  - id: EP69-S10
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "陆北辰笑了。"
    dialogue: "陆北辰："留着吧。等我们真的赢了那一天——用它买杯咖啡。""
  - id: EP69-S11
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "林晚回到原来的公司办公室收拾东西。她环顾这个曾经奋斗了五年的地方。"
    dialogue: "林晚（内心）："这间办公室——见证了我最狼狈的样子——和最骄傲的时刻。""
  - id: EP69-S12
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "她拿起桌上的相框——里面是和苏晴、陆北辰的合影。"
    dialogue: "林晚（内心）："都过去了。"她微笑。"
  - id: EP69-S13
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 8
    description: "林晚最后看了一眼办公室，关灯，关上门。转身离开。"
    dialogue: "林晚（内心）："第一幕——落幕。""
