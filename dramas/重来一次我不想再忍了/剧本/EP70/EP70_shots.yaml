    type: "中景"
    duration_sec: 6
    description: "林晚在新公司的办公室里加班。窗外天色渐暗。手机震动——陆北辰的消息。"
    dialogue: "（手机屏幕亮起：陆北辰"天台上见？"）"
  - id: EP70-S02
    scene_id: SCENE-017
    type: "近景"
    duration_sec: 6
    description: "林晚微笑着回了一个字："好。""
    dialogue: "（文字：林晚"好。"）"
  - id: EP70-S03
    scene_id: SCENE-017
    type: "中景"
    duration_sec: 6
    description: "林晚路过那家常去的咖啡厅，买了杯咖啡。店员微笑着递给她。"
    dialogue: "（日常的背景声）"
  - id: EP70-S04
    scene_id: SCENE-017
    type: "近景"
    duration_sec: 6
    description: "林晚走出咖啡厅，抬头看了看城市的天际线。"
    dialogue: "林晚（内心）："这个城市——好像和以前不一样了。""
  - id: EP70-S05
    scene_id: SCENE-017
    type: "全景"
    duration_sec: 6
    description: "林晚推开天台的门。陆北辰已经在那里了，背对着她，看着城市的天际线。"
    dialogue: "陆北辰（回头）："你来了。""
  - id: EP70-S06
    scene_id: SCENE-017
    type: "中景"
    duration_sec: 6
    description: "林晚走过去，把一杯咖啡递给他。"
    dialogue: "林晚："这次——轮到我带咖啡了。""
  - id: EP70-S07
    scene_id: SCENE-017
    type: "中景"
    duration_sec: 6
    description: "两人并肩站在天台栏杆前。城市的灯火在脚下铺开。"
    dialogue: "陆北辰："还记得你第一次在天台上——是什么时候吗？""
  - id: EP70-S08
    scene_id: SCENE-017
    type: "近景"
    duration_sec: 6
    description: "林晚点头。"
    dialogue: "林晚："重生那天。坐在那里——觉得整个世界都是灰色的。""
  - id: EP70-S09
    scene_id: SCENE-017
    type: "近景"
    duration_sec: 6
    description: "陆北辰侧过头看着她。"
    dialogue: "陆北辰："现在呢？""
  - id: EP70-S10
    scene_id: SCENE-017
    type: "特写"
    duration_sec: 6
    description: "林晚看着远方地平线上的一线光。"
    dialogue: "林晚："现在——我觉得天快亮了。""
  - id: EP70-S11
    scene_id: SCENE-017
    type: "全景"
    duration_sec: 6
    description: "时间流逝。地平线上出现第一缕金色光芒。城市在晨光中苏醒。"
    dialogue: "陆北辰："林晚。"林晚："嗯？""
  - id: EP70-S12
    scene_id: SCENE-017
    type: "近景"
    duration_sec: 6
    description: "陆北辰看着她。"
    dialogue: "陆北辰："我喜欢你。从第一次在天台上看到你——就开始了。""
  - id: EP70-S13
    scene_id: SCENE-017
    type: "特写"
    duration_sec: 6
    description: "林晚的眼睛。有光在里面。"
    dialogue: "林晚："我知道。""
  - id: EP70-S14
    scene_id: SCENE-017
    type: "全景"
    duration_sec: 6
    description: "两人并肩站在天台上，看着日出。城市在脚下苏醒。咖啡杯碰在一起。"
    dialogue: "林晚（内心）："这一次——我选对了。""
