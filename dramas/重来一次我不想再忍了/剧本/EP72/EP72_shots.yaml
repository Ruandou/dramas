# EP72 shots.yaml
episode: EP72
total_duration_sec: 84
total_shots: 13
shots:
  - id: EP72-S01
    scene_id: SCENE-011
    type: "全景"
    duration_sec: 6
    description: "一场新书签售会。林晚坐在桌前，面前摆着她的自传（PROP-006）——《重来一次，我不想再忍了》。"
    dialogue: "(读者排队的声音)"
  - id: EP72-S02
    scene_id: SCENE-011
    type: "中景"
    duration_sec: 6
    description: "一个年轻女孩走到她面前，手里拿着书。林晚接过，翻开扉页。"
    dialogue: "女孩："林老师——您这本书——救了我。"林晚抬头，微笑。"
  - id: EP72-S03
    scene_id: SCENE-011
    type: "近景"
    duration_sec: 6
    description: "林晚在扉页上写下："你也可以。""
    dialogue: "林晚："是你自己救了自己。书——只是告诉你——你不是一个人。""
  - id: EP72-S04
    scene_id: SCENE-011
    type: "中景"
    duration_sec: 6
    description: "女孩抱紧书，眼眶湿润。转身离开。林晚看着她的背影。"
    dialogue: "林晚（内心）："每一代女孩——都在同一间楼梯间里哭过。但现在的她们——手里有地图了。""
  - id: EP72-S05
    scene_id: SCENE-011
    type: "中景"
    duration_sec: 6
    description: "签售结束。林晚站起来，活动了一下肩膀。苏晴走过来。"
    dialogue: "苏晴（笑）："林大作家——累不累？"林晚："比你当年做短视频——轻松多了。""
  - id: EP72-S06
    scene_id: SCENE-011
    type: "近景"
    duration_sec: 6
    description: "陆北辰从人群外走来，手里拿着一杯咖啡。"
    dialogue: "陆北辰："还是老规矩——天台上喝？"林晚接过咖啡："走。""
  - id: EP72-S07
    scene_id: SCENE-011
    type: "全景"
    duration_sec: 6
    description: "林晚和陆北辰站在天台上。城市的景色尽收眼底。"
    dialogue: "陆北辰："写这本书的时候——哭了几次？""
  - id: EP72-S08
    scene_id: SCENE-011
    type: "近景"
    duration_sec: 6
    description: "林晚想了想。"
    dialogue: "林晚："三次。写EP52的时候——写楼梯间的时候——写最后一章的时候。""
  - id: EP72-S09
    scene_id: SCENE-011
    type: "中景"
    duration_sec: 6
    description: "陆北辰从口袋里掏出那枚硬币。"
    dialogue: "陆北辰："还记得这个吗？"林晚笑了："记得。一块钱。""
  - id: EP72-S10
    scene_id: SCENE-011
    type: "近景"
    duration_sec: 6
    description: "陆北辰把硬币抛向空中，接住。"
    dialogue: "陆北辰："当初我说——等我们真的赢了的那一天——用它买杯咖啡。今天——该兑现了。""
  - id: EP72-S11
    scene_id: SCENE-011
    type: "闪回"
    duration_sec: 6
    description: "六年前。年轻的林晚蹲在楼梯间哭泣。另一个年轻的同事走过——没有人停下来。"
    dialogue: "林晚（画外音）："六年前——我蹲在那里哭。没有人在我面前停下来。""
  - id: EP72-S12
    scene_id: SCENE-011
    type: "闪回"
    duration_sec: 6
    description: "现在的林晚站在楼梯间门口，阳光透过窗子照进来。她推门走出去。"
    dialogue: "林晚（画外音）："所以——六年后——我回来——成了那个停下来的人。""
  - id: EP72-S13
    scene_id: SCENE-011
    type: "全景"
    duration_sec: 12
    description: "林晚和陆北辰并肩站在天台上。夕阳将两个人的影子拉得很长。城市在脚下铺开，无边无际。"
    dialogue: "林晚（画外音，独白）："有人问我——重来一次，最想改变什么？""
