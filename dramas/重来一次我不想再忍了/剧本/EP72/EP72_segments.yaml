segments:
  - id: EP72-SEG01
    scene_id: SCENE-011
    description: "segment 1"
    total_duration_sec: 12
    shots:
      - id: EP72-S01
        type: "全景"
        duration_sec: 6
        description: "一场新书签售会。林晚坐在桌前，面前摆着她的自传（PROP-006）——《重来一次，我不想再忍了》。"
      - id: EP72-S02
        type: "中景"
        duration_sec: 6
        description: "一个年轻女孩走到她面前，手里拿着书。林晚接过，翻开扉页。"
  - id: EP72-SEG02
    scene_id: SCENE-011
    description: "segment 2"
    total_duration_sec: 12
    shots:
      - id: EP72-S03
        type: "近景"
        duration_sec: 6
        description: "林晚在扉页上写下："你也可以。""
      - id: EP72-S04
        type: "中景"
        duration_sec: 6
        description: "女孩抱紧书，眼眶湿润。转身离开。林晚看着她的背影。"
  - id: EP72-SEG03
    scene_id: SCENE-011
    description: "segment 3"
    total_duration_sec: 12
    shots:
      - id: EP72-S05
        type: "中景"
        duration_sec: 6
        description: "签售结束。林晚站起来，活动了一下肩膀。苏晴走过来。"
      - id: EP72-S06
        type: "近景"
        duration_sec: 6
        description: "陆北辰从人群外走来，手里拿着一杯咖啡。"
  - id: EP72-SEG04
    scene_id: SCENE-011
    description: "segment 4"
    total_duration_sec: 12
    shots:
      - id: EP72-S07
        type: "全景"
        duration_sec: 6
        description: "林晚和陆北辰站在天台上。城市的景色尽收眼底。"
      - id: EP72-S08
        type: "近景"
        duration_sec: 6
        description: "林晚想了想。"
  - id: EP72-SEG05
    scene_id: SCENE-011
    description: "segment 5"
    total_duration_sec: 12
    shots:
      - id: EP72-S09
        type: "中景"
        duration_sec: 6
        description: "陆北辰从口袋里掏出那枚硬币。"
      - id: EP72-S10
        type: "近景"
        duration_sec: 6
        description: "陆北辰把硬币抛向空中，接住。"
  - id: EP72-SEG06
    scene_id: SCENE-011
    description: "segment 6"
    total_duration_sec: 12
    shots:
      - id: EP72-S11
        type: "闪回"
        duration_sec: 6
        description: "六年前。年轻的林晚蹲在楼梯间哭泣。另一个年轻的同事走过——没有人停下来。"
      - id: EP72-S12
        type: "闪回"
        duration_sec: 6
        description: "现在的林晚站在楼梯间门口，阳光透过窗子照进来。她推门走出去。"
  - id: EP72-SEG07
    scene_id: SCENE-011
    description: "segment 7"
    total_duration_sec: 12
    shots:
      - id: EP72-S13
        type: "全景"
        duration_sec: 12
        description: "林晚和陆北辰并肩站在天台上。夕阳将两个人的影子拉得很长。城市在脚下铺开，无边无际。"
