# EP68 shots.yaml
episode: EP68
total_duration_sec: 80
total_shots: 13
shots:
  - id: EP68-S01
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "投资传奇约林晚单独喝咖啡。他从公文包里拿出一份文件。"
    dialogue: "投资传奇："硅谷演讲的效果很好——三天内我收到了七个投资意向。""
  - id: EP68-S02
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "他把文件推到林晚面前。"
    dialogue: "投资传奇："这是你的礼物。""
  - id: EP68-S03
    scene_id: SCENE-001
    type: "特写"
    duration_sec: 6
    description: "文件封面写着"盛天资本——结构重组与退出方案"。林晚抬头。"
    dialogue: "林晚："这是——""
  - id: EP68-S04
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "投资传奇喝了一口茶。"
    dialogue: "投资传奇："周明轩的董事会不是铁板一块。他最大的投资人——是我以前的学生。""
  - id: EP68-S05
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "林晚翻看文件，越看越心惊。"
    dialogue: "投资传奇："只要你同意——他会在下周的董事会上提出撤资动议。周明轩——会被盛天资本董事会罢免。""
  - id: EP68-S06
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "林晚合上文件："代价是什么？""
    dialogue: "投资传奇："没有代价。就当——是给一个值得投资的年轻人的礼物。""
  - id: EP68-S07
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "林晚沉默了很久。"
    dialogue: "林晚："您为什么要帮我？""
  - id: EP68-S08
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "投资传奇看着窗外。"
    dialogue: "投资传奇："我年轻的时候——也有一个人这样帮过我。后来他去世了。我没来得及还他人情。""
  - id: EP68-S09
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "林晚眼眶微红，但没有让眼泪流下来。"
    dialogue: "林晚："谢谢您。""
  - id: EP68-S10
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "投资传奇站起身。"
    dialogue: "投资传奇："别谢我。去赢。"他拿起外套，转身离开。"
  - id: EP68-S11
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 6
    description: "林晚回到办公室，把文件放在桌上。陆北辰在等她。"
    dialogue: "陆北辰："什么情况？"林晚："我们赢了。""
  - id: EP68-S12
    scene_id: SCENE-001
    type: "近景"
    duration_sec: 6
    description: "陆北辰看着她。林晚终于露出一个发自内心的笑容。"
    dialogue: "林晚："周明轩——会被盛天资本罢免。""
  - id: EP68-S13
    scene_id: SCENE-001
    type: "中景"
    duration_sec: 8
    description: "夕阳透过落地窗照进来。林晚和陆北辰并肩站在窗前。"
    dialogue: "林晚（内心）："原来这条路走到尽头——不是复仇。是自由。""
