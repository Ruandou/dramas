# EP71 segments.yaml
episode: EP71
total_duration_sec: 80
total_shots: 13
segments:
  - id: EP71-SEG01
    scene_id: SCENE-014
    description: "segment 1"
    total_duration_sec: 12
    shots:
      - id: EP71-S01
        type: "全景"
        duration_sec: 6
        description: "四十年后。林晚已是满头白发的老人。她走进一栋老旧写字楼的楼梯间。"
      - id: EP71-S02
        type: "中景"
        duration_sec: 6
        description: "她穿着剪裁得体的西装大衣，气质优雅。环顾这个破旧的楼梯间——一切都没有变。"
  - id: EP71-SEG02
    scene_id: SCENE-014
    description: "segment 2"
    total_duration_sec: 12
    shots:
      - id: EP71-S03
        type: "中景"
        duration_sec: 6
        description: "楼梯间的门被推开。一个年轻女孩冲进来，蹲在角落哭。和四十三年前的林晚一模一样。"
      - id: EP71-S04
        type: "近景"
        duration_sec: 6
        description: "林晚站在楼梯拐角，静静地看着她。"
  - id: EP71-SEG03
    scene_id: SCENE-014
    description: "segment 3"
    total_duration_sec: 12
    shots:
      - id: EP71-S05
        type: "中景"
        duration_sec: 6
        description: "女孩抬头，红着眼睛看着这个陌生的老奶奶。"
      - id: EP71-S06
        type: "近景"
        duration_sec: 6
        description: "林晚微笑着蹲下身。从口袋里取出一张名片（PROP-005），递给她。"
  - id: EP71-SEG04
    scene_id: SCENE-014
    description: "segment 4"
    total_duration_sec: 12
    shots:
      - id: EP71-S07
        type: "特写"
        duration_sec: 6
        description: "名片——"林晚"烫银。下方是她的新公司名称。"
      - id: EP71-S08
        type: "近景"
        duration_sec: 6
        description: "女孩看着名片，再看看眼前这个温暖微笑的老人。"
  - id: EP71-SEG05
    scene_id: SCENE-014
    description: "segment 5"
    total_duration_sec: 12
    shots:
      - id: EP71-S09
        type: "近景"
        duration_sec: 6
        description: "林晚轻轻笑了。"
      - id: EP71-S10
        type: "特写"
        duration_sec: 6
        description: "女孩愣住了。名片上烫银的名字在昏黄的灯光下微微发光。"
  - id: EP71-SEG06
    scene_id: SCENE-014
    description: "segment 6"
    total_duration_sec: 12
    shots:
      - id: EP71-S11
        type: "中景"
        duration_sec: 6
        description: "林晚站起身，拍了拍女孩的肩膀，转身缓缓走上楼梯。"
      - id: EP71-S12
        type: "近景"
        duration_sec: 6
        description: "林晚没有回头。但她的嘴角微微上扬。"
  - id: EP71-SEG07
    scene_id: SCENE-014
    description: "segment 7"
    total_duration_sec: 8
    shots:
      - id: EP71-S13
        type: "全景"
        duration_sec: 8
        description: "林晚走出楼梯间的门，阳光洒进来。女孩蹲在角落，紧紧握着那张名片。楼梯间的门缓缓关上。"
