# EP71 shots.yaml
episode: EP71
total_duration_sec: 80
total_shots: 13
shots:
  - id: EP71-S01
    scene_id: SCENE-014
    type: "全景"
    duration_sec: 6
    description: "四十年后。林晚已是满头白发的老人。她走进一栋老旧写字楼的楼梯间。"
    dialogue: "林晚（画外音）："四十年了。""
  - id: EP71-S02
    scene_id: SCENE-014
    type: "中景"
    duration_sec: 6
    description: "她穿着剪裁得体的西装大衣，气质优雅。环顾这个破旧的楼梯间——一切都没有变。"
    dialogue: "林晚（画外音）："这个楼梯间——还是和当年一样。""
  - id: EP71-S03
    scene_id: SCENE-014
    type: "中景"
    duration_sec: 6
    description: "楼梯间的门被推开。一个年轻女孩冲进来，蹲在角落哭。和四十三年前的林晚一模一样。"
    dialogue: "（女孩压抑的抽泣声）"
  - id: EP71-S04
    scene_id: SCENE-014
    type: "近景"
    duration_sec: 6
    description: "林晚站在楼梯拐角，静静地看着她。"
    dialogue: "林晚（画外音）："被训了？抢功了？觉得——活不下去了？""
  - id: EP71-S05
    scene_id: SCENE-014
    type: "中景"
    duration_sec: 6
    description: "女孩抬头，红着眼睛看着这个陌生的老奶奶。"
    dialogue: "女孩："您——您是——""
  - id: EP71-S06
    scene_id: SCENE-014
    type: "近景"
    duration_sec: 6
    description: "林晚微笑着蹲下身。从口袋里取出一张名片（PROP-005），递给她。"
    dialogue: "林晚："我叫林晚。""
  - id: EP71-S07
    scene_id: SCENE-014
    type: "特写"
    duration_sec: 6
    description: "名片——"林晚"烫银。下方是她的新公司名称。"
    dialogue: "林晚："如果你想重新开始——来我这儿。""
  - id: EP71-S08
    scene_id: SCENE-014
    type: "近景"
    duration_sec: 6
    description: "女孩看着名片，再看看眼前这个温暖微笑的老人。"
    dialogue: "女孩："可是——您都不认识我——""
  - id: EP71-S09
    scene_id: SCENE-014
    type: "近景"
    duration_sec: 6
    description: "林晚轻轻笑了。"
    dialogue: "林晚："我认识你。四十年前——我也在这间楼梯间里，哭过。""
  - id: EP71-S10
    scene_id: SCENE-014
    type: "特写"
    duration_sec: 6
    description: "女孩愣住了。名片上烫银的名字在昏黄的灯光下微微发光。"
    dialogue: "林晚："去哭吧。哭完了——来上班。""
  - id: EP71-S11
    scene_id: SCENE-014
    type: "中景"
    duration_sec: 6
    description: "林晚站起身，拍了拍女孩的肩膀，转身缓缓走上楼梯。"
    dialogue: "女孩（哽咽）："谢谢您……林总。""
  - id: EP71-S12
    scene_id: SCENE-014
    type: "近景"
    duration_sec: 6
    description: "林晚没有回头。但她的嘴角微微上扬。"
    dialogue: "林晚（画外音）："不用谢。四十年前——也有人该递给我这张名片。""
  - id: EP71-S13
    scene_id: SCENE-014
    type: "全景"
    duration_sec: 8
    description: "林晚走出楼梯间的门，阳光洒进来。女孩蹲在角落，紧紧握着那张名片。楼梯间的门缓缓关上。"
    dialogue: "林晚（画外音）："但她没等到。所以我来了。""
