      对白（程野，内心）：「再拖，过年回去又是审讯。」

      镜头3（4秒）近景：程野点开年伴，浏览「春节七天·见家长」，勾选「会做饭优先」。

      对白（程野，内心）：「租七天……演完就散，比相亲省心。」「纯商业，别动心——我对自己说。」

      2020年代中国都市/小城，写实短剧，竖屏9比16，对白时画面底部居中简体白字字幕与语音同步；禁止其它乱字

