  - id: "SCENE-001"
    prompt: "Towering cliff edge at dusk, monumental scale, camera at extreme low angle looking upward along sheer rock face into vast crimson sky. A dramatic precipice dropping into infinite white mist below, jagged grey-brown granite cliff face with ancient moss and deep weathered erosion channels carved by centuries of wind. Foreground: flat stone ledge with wind-carved grooves, scattered dead leaves and small wind-twisted roots, one gnarled ancient pine tree clinging to rock edge with exposed roots gripping stone. Middle ground: cliff face extending vertically with exposed layered rock strata. Background: endless sea of golden-crimson sunset clouds, distant mountain silhouettes barely visible through warm atmospheric haze. A single faded paper spirit talisman wedged into a rock crevice, ancient and sun-bleached. Faint luminescent spirit energy motes drifting upward from the abyss below. Photorealistic rendering, shot on 16mm ultra-wide lens, dramatic golden hour sunset lighting, real geological rock textures, atmospheric perspective. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-001.png"

  - id: "SCENE-002"
    prompt: "Dilapidated small courtyard of an outer disciple residence in a Chinese xianxia cultivation sect, low angle looking upward at the humble wooden cottage emphasizing its smallness against vast sky. Weathered grey timber walls with visible grain and splitting planks, cracked dark clay roof tiles with bright green moss growing in gaps, a simple wooden door with severely peeling red lacquer revealing bare wood beneath. Overgrown stone slab path with persistent weeds and grass pushing through every crack, a chipped stone wash basin in the corner with green algae stains, scattered dried brown leaves accumulating in corners. A faded torn paper talisman above the doorframe barely readable, edges curling from moisture. Low courtyard walls of rough-stacked grey stone with lichen, one scraggly bamboo plant in a cracked ceramic pot, a worn wooden bucket with fraying rope handle. Overcast flat lighting creating compressed dreary atmosphere, muted desaturated color palette. Shot from low angle to emphasize confining small space with tall walls. Photorealistic rendering, shot on 28mm lens, overcast diffused natural lighting, aged wood and weathered stone textures. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-002.png"

  - id: "SCENE-003"
    prompt: "Wide open stone-paved training platform of a xianxia cultivation sect, dramatic low angle perspective emphasizing the expansive flat arena against towering mountain backdrop. Rectangular grey stone brick platform approximately 30 meters across with precisely fitted flagstones, faint spirit array grid lines inlaid in tarnished copper between stones, weathered wooden observation railings along two sides with thick timber posts showing years of use. A heavy bronze gong on ornate wooden frame at platform edge for marking training rounds, bamboo practice sword rack holding two dozen wooden training swords of various lengths. Morning mist drifting across the platform surface catching angled golden sunlight creating volumetric light rays. Background: steep mountainside covered in pine trees rising dramatically, distant sect pagoda rooftops visible through mist. A weathered stone boundary marker at platform corner, iron ring torch holders on posts (unlit in daylight). Photorealistic rendering, shot on 24mm wide-angle lens, dramatic morning golden hour light with volumetric mist effects. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-003.png"

  - id: "SCENE-004"
    prompt: "Towering grand ceremonial hall interior of a xianxia cultivation sect, monumental awe-inspiring scale, camera at extreme low angle looking upward toward elaborately painted coffered ceiling far above. Massive white jade-clad columns (each 2 meters diameter) rising 25 meters to ornate red-and-gold painted wooden bracket systems (dougong) supporting the soaring ceiling, polished white marble stepped platform with seven tiers leading to elevated elder council seats with carved cloud-scroll backrests. Floating ethereal spirit lanterns of pale gold light suspended impossibly in mid-air at varying heights casting warm diffused glow throughout the vast space, wisps of cloud mist drifting through open side arches connecting to exterior sky. Mirror-polished white jade floor tiles reflecting the floating lanterns above, blue-white incense smoke rising in thin streams from two large bronze tripod censers (ding) flanking the central processional aisle. Multiple tiers of stone observer seating rising steeply on both sides, intricate cloud-and-dragon scroll relief carvings on every column base. Extreme vertical composition emphasizing impossible sacred architectural height, humans would be utterly dwarfed. Photorealistic rendering, shot on 16mm ultra-wide rectilinear lens, dramatic volumetric uplighting from spirit lanterns, real white jade and polished marble materials. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-004.png"

  - id: "SCENE-005"
    prompt: "Intimate scholar study interior of a xianxia sect master at night, warm amber candlelight blending with cool silver-blue moonlight through carved wooden lattice window. Floor-to-ceiling dark wood shelving units packed densely with jade slips (green translucent tablets) and silk-bound scroll texts in neat rows, a large polished rosewood desk with inkstone and jade brush rest near the window. On the desk surface: ONE partially unrolled yellowed silk scroll with silver-colored markings visible on its inner face, frost crystals faintly forming along its edges, jade scroll ends visible. Warm candlelight from an elegant three-branch bronze candle holder on desk corner, cool blue-white moonlight streaming through intricate carved lattice window casting geometric shadow patterns across polished dark wood floor. A hanging landscape painting scroll on the far wall depicting misty mountains, a celestial bronze armillary sphere instrument on a wooden stand in the corner, celadon tea set on a small rosewood side table with faint wisps of steam rising. Polished dark wood floor, woven rush mat beneath desk. Private sanctuary atmosphere radiating scholarly refinement and cultivation mastery. Photorealistic rendering, shot on 35mm lens, mixed warm candlelight and cool moonlight dual-source lighting. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/满级师尊她装作刚入门/PROP-007.png"
    output: "assets/scenes/SCENE-005.png"

  - id: "SCENE-006"
    prompt: "Beautiful courtyard garden residence of a favored disciple in a Chinese xianxia cultivation sect, warm romantic atmosphere, low angle emphasizing the towering peach blossom trees above the elegant architecture. Two mature peach trees in full glorious bloom framing the central view with branches arching overhead creating a pink canopy, thousands of soft pink petals drifting gently through warm air, a small clear flowing stream with smooth river stones winding through the garden. Warm amber spirit lanterns (round glowing orbs) hanging from tree branches casting soft golden glow, elegant wooden veranda with carved cloud-motif railings and polished dark wood flooring extending along one side of the courtyard. Clean fitted stone path through carefully tended garden, a carved stone bench beneath the largest peach tree, medicinal herb plants in blue-glazed ceramic pots along the veranda edge. Small koi pond with lotus pads near the stream junction, water catching lantern reflections. Architecture: gracefully curved eaves with jade-green glazed roof tiles, red-painted wooden columns, painted beam ends, flowing white silk curtains partially drawn at the main doorway billowing gently in breeze. Golden warm late afternoon light filtering through blossoms creating dappled pink-gold shadows across stone path. Idyllic romantic paradise atmosphere. Photorealistic rendering, shot on 24mm wide-angle lens, warm golden hour backlight through peach blossoms. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-006.png"

  - id: "SCENE-007"
    prompt: "Dense bamboo forest on a mountain slope in a xianxia cultivation world, tall straight green bamboo stalks extending vertically far beyond the frame in every direction creating a natural cathedral of green. Bamboo trunks 8-12cm diameter with smooth green-grey segmented surface, overlapping delicate bamboo leaves forming a high canopy that filters sunlight into scattered jade-green dappled light spots on the forest floor below. A narrow moss-edged stone-paved path winding between bamboo groves disappearing into green depths, a flat grey meditation stone beside the path worn smooth from use, dried golden-brown bamboo leaves carpeting the ground between stones. Atmospheric depth visible between the endless bamboo trunks with soft misty haze in the deeper forest creating layers of diminishing contrast. Scattered pale spirit energy motes floating gently in diagonal sunbeams passing between trunks. Predominantly cool green color palette with occasional warm golden sunlight accents breaking through canopy gaps, creating pools of warmth on the forest floor. Serene private atmosphere of natural seclusion and contemplation. Photorealistic rendering, shot on 50mm lens, natural forest-filtered green light with volumetric sunbeam effects. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-007.png"

  - id: "SCENE-008"
    prompt: "Moonlit peach blossom forest at night, towering ancient peach trees in full bloom reaching high overhead, monumental romantic scale, camera at low angle looking upward through layers of luminous pink blossoms toward brilliant full moon. Full moon visible through breaks in the dense canopy of blooming peach trees, silver-blue moonlight illuminating thousands of delicate pink blossoms from above creating ethereal glow. Peach petals falling like gentle snow through silver moonbeams, a weathered stone table and two stone stools in a small clearing between the oldest gnarled tree trunks. Ground thickly carpeted with layers of fallen soft pink petals, mixed silver-blue moonlight and faint warm pink reflected light from illuminated blossoms creating magical dual-tone atmosphere. Small golden spirit firefly motes drifting lazily between branches adding warm accent points. Mature gnarled dark-barked peach tree trunks with rough textured ancient bark contrasting impossibly soft delicate pink blossoms above, distant view through tree trunks showing moonlit silver cloud sea rolling beyond a cliff edge. Dreamlike peak romantic atmosphere with tangible magical presence. Faint luminescent spirit particles rising gently from fallen petals on ground. Photorealistic rendering, shot on 28mm lens, moonlight primary illumination with spirit particle accent lighting. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-008.png"

  - id: "SCENE-009"
    prompt: "Mystical spirit beast mountain shrouded in thick morning mist in a xianxia cultivation world, primordial ancient forest atmosphere. Lush oversized exotic vegetation with leaves twice normal size, clusters of bioluminescent pale blue mushrooms growing on massive ancient tree trunks, unusual flowers with five translucent petals emitting faint spiritual purple-white glow growing between twisted roots. Rocky mountain path of uneven natural stone steps winding upward through dense fog and towering ancient trees with enormous moss-covered buttress roots, hanging green vine curtains draped between branches. Concentrated spirit energy rising from the mossy ground like pale blue-green colored steam wisps, catching morning light. Distant jagged mountain peaks barely visible as grey silhouettes through thick layered cloud, sound of waterfall implied by wet glistening rocks and fine mist spray visible in background. A carved stone trail marker post at a path junction covered partially in moss, deep parallel claw marks gouged into nearby tree bark by a large creature. Mysterious primordial wilderness atmosphere where nature thrums with spiritual energy. Photorealistic rendering, shot on 24mm wide-angle lens, diffused soft morning light through thick atmospheric mist, volumetric fog effects. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-009.png"

  - id: "SCENE-010"
    prompt: "Ruined ancient sect great hall interior devastated by catastrophic fire a century ago, frozen in tragic decay. Massive collapsed wooden roof beams charred completely black hanging at broken angles, shattered white stone columns standing at various broken heights like jagged teeth, century-old burn marks and deep soot staining the remaining cracked white marble walls in sweeping black patterns. Wild climbing vines and thick green moss aggressively growing over rubble piles and broken stonework, pale shafts of dim grey light entering through multiple gaps in the collapsed roof structure above. Prominently in the center of the ruined hall: on a surviving rough-hewn stone pedestal (waist height), an ancient bronze circular mirror approximately 30cm diameter with heavy green verdigris patina covering the ornate copper frame, yet its silver mirror surface gleams impossibly bright and perfectly clear amid all the surrounding decay, supported by a three-legged bronze mythical beast base with detailed cloud-scroll engravings, faint silver spiritual vein lines pulsing softly along the frame edges. Scattered rubble of collapsed roof tiles and broken carved stone fragments around the central pedestal, thick dust particles floating visibly in the pale light shafts. A century of undisturbed cobwebs in upper corners, fallen stone tablets face-down in debris. Atmosphere of ancient tragedy frozen in eternal stillness, one sacred relic preserved by spiritual energy amid total ruin. Photorealistic rendering, shot on 28mm lens, dramatic volumetric shaft lighting through roof gaps as primary illumination. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-010.png"

  - id: "SCENE-011"
    prompt: "Dark hidden mountain valley at night with a glowing ancient teleportation spirit formation on the valley floor, secretive ominous atmosphere. Narrow steep-walled valley enclosed by towering dark cliff faces on both sides blocking most moonlight, only a thin sliver of night sky with dim moon visible far above between cliff edges. Sparse dead twisted trees with bare grey branches growing from rock crevices. On the valley floor center: a circular stone platform approximately 5 meters diameter of fitted dark stone with complex interlocking spirit array patterns deeply carved into the surface, the carved lines glowing with steady pale blue-white luminescence as the formation's primary light source. A weathered diamond-shaped sect emblem symbol carved into the formation central keystone. Dark rocky ground of loose gravel and scattered boulders surrounding the platform, thin ground-hugging mist drifting across the valley floor at ankle height, the formation glow reflecting off the mist creating eerie blue atmosphere. Ancient rune-covered boundary stones (waist-height) marking the array perimeter at four cardinal points, partially buried and overgrown with dead vines. Photorealistic rendering, shot on 24mm wide-angle lens, extremely low-key lighting with the glowing formation as dominant blue-white light source illuminating surrounding cliff faces from below. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-011.png"

  - id: "SCENE-012"
    prompt: "Underground sealed sacred chamber with ancient spiritual array formations, cavernous vaulted stone ceiling disappearing into impenetrable darkness far above, monumental divine atmosphere with extreme vertical scale. Central dominant feature: a brilliant pillar of concentrated golden-white spiritual light rising from a circular floor array straight upward into the ceiling darkness, within this light column a complete celestial sword sheath hovers perfectly suspended at chest height, the elongated gold-white sheath radiating star-like particles outward into the chamber, its surface flowing with continuous starlight patterns. Concentric ring array patterns on the dark stone floor glowing with warm golden luminescence, ancient flowing seal-script-style symbols integrated into the array line work. Rough-hewn dark stone walls carved with elaborate protective ward patterns in geometric precision, four skeletal guardian figures in ancient deteriorated bronze armor positioned at cardinal compass points around the chamber perimeter (clearly non-human, dried bones and empty armor only). A stone reading lectern near one wall bearing what appears to be a sealed ancient letter on aged paper. Heavy atmosphere of time frozen for centuries, suspended dust particles caught motionless in the central light pillar. The chamber floor pristine and dust-free within the array boundary, thick dust beyond. Photorealistic rendering, shot on 16mm ultra-wide rectilinear lens, dramatic central golden light pillar as overwhelming primary illumination source, extreme contrast between lit center and dark periphery. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/满级师尊她装作刚入门/PROP-003.png"
    output: "assets/scenes/SCENE-012.png"

  - id: "SCENE-013"
    prompt: "Massive outdoor martial arts tournament arena in a xianxia cultivation world, monumental imposing scale, camera at extreme low angle looking upward from arena floor level emphasizing the towering spectator structures surrounding it. Elevated hexagonal polished grey granite fighting platform in center (15 meters across) with carved intertwining dragon-and-phoenix border pattern in gold inlay, raised 3 meters above ground on carved stone base with stairways on two sides. Floating spectator observation platforms at multiple dramatic heights around the arena (stone platforms hovering impossibly on glowing spirit energy), connected by translucent blue spirit-energy light bridges. Colorful cultivation sect banners (crimson red, sapphire blue, imperial gold, jade green, deep purple) hanging from extremely tall dark wood flag poles fluttering vigorously in mountain wind. A shimmering translucent dome-shaped spirit-energy barrier enclosing the fighting platform with faint hexagonal pattern visible in its surface, morning sunlight refracting through the barrier creating subtle prismatic rainbow effects on the stone below. Tiered stone spectator seating rising steeply on all sides like an amphitheater, two ornate bronze gong towers at opposing corners (3 stories tall). Dramatic mountain scenery visible beyond the arena complex, silver cloud sea rolling in distance below mountain level. Grand tournament atmosphere of inter-sect competition. Photorealistic rendering, shot on 16mm ultra-wide lens, bright dramatic high-contrast sunlight with barrier light refraction effects. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-013.png"

  - id: "SCENE-014"
    prompt: "Dark evil cultivation sect palace interior, oppressive monumental vertical scale, camera at extreme low angle emphasizing impossibly towering black stone pillars rising into darkness above. Massive ceremonial hall built entirely of polished black obsidian-like stone with cold mirror-like reflective sheen on every surface, ceiling lost in impenetrable darkness far above. Dark crimson-red light emanating ominously from deep cracks in the black stone floor and from clusters of floating dark-energy orbs (abstract, non-humanoid) drifting near the upper darkness. Central elevated throne platform of jagged raw black crystal formation rising 5 meters high with rough crystalline edges, abstract dark energy tendrils (smoke-like, formless) wisping upward from floor-level vents throughout the hall. Walls carved with angular aggressive geometric ward patterns in recessed channels filled with dried dark-red pigment, black iron torch brackets mounted on columns holding flames of unnatural dark-crimson color. A black iron ceremonial altar table positioned before the throne base bearing a single dark metal command token among ritual implements. Oppressive overwhelming evil atmosphere with extreme vertical scale suggesting infinite dark power. Photorealistic rendering, shot on 16mm ultra-wide lens, extremely dark scene with dark crimson and black color palette, minimal harsh red lighting from dark energy sources creating deep shadows. Empty environment, no people, no human figures, no faces, no ghostly faces, no skulls with faces, abstract dark energy only, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, Chinese cultivation world aesthetics, photorealistic rendering."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/满级师尊她装作刚入门/PROP-008.png"
    output: "assets/scenes/SCENE-014.png"

  - id: "SCENE-015"
    prompt: "Celestial cloud-sea observation terrace at the absolute highest peak of a xianxia cultivation sect mountain, night scene with brilliant oversized full moon, monumental ethereal scale, low angle looking outward across infinite cloud ocean. An elegant octagonal white stone terrace extending boldly outward from the sheer mountain summit over a boundless ocean of silver-white rolling clouds far below, intricately carved white jade balustrade with flowing cloud-scroll relief motifs along the terrace edge, polished white marble floor tiles reflecting the brilliant moonlight like a mirror. Vast breathtaking panoramic view: endless silver cloud sea stretching unbroken to the curved horizon in every direction below, the enormous full moon hanging luminous and dominant directly ahead casting a wide shimmering silver reflection path across the cloud surface. Mountain peak rock barely visible behind the terrace, a single ancient twisted pine tree growing dramatically from a rock outcrop beside the terrace adding organic contrast to the geometric stone. Countless spirit energy particles drifting gently upward like reverse snowfall, each catching and scattering brilliant moonlight. Cold pure silver-blue lighting palette throughout with absolute celestial serenity and isolation. The pinnacle of cultivation world ethereal transcendent beauty, feeling of standing at the boundary between mortal and immortal realms. Photorealistic rendering, shot on 24mm wide-angle lens, brilliant full moonlight as overwhelming primary cold illumination source, real white jade and polished marble stone textures. Empty environment, no people, no human figures, architectural and environmental reference only. vertical 9:16, cinematic lighting, xianxia fantasy, ethereal spirit energy particles, Chinese cultivation world aesthetics, photorealistic rendering."
    output: "assets/scenes/SCENE-015.png"
