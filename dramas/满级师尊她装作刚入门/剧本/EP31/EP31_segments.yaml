        竖屏9比16连贯叙事。
        镜头1（15秒）中景 固定镜头：金光消散——殿门打开。图2灰袍走出——与图1面对面！两人四目相对。图2瞳孔微缩——被撞见了。图1看着她面容上写满震惊——他的目光从她指尖残余的金色灵光扫到她平静的面容再扫到身后寝殿。
        [以下对白仅供语音合成，严禁在画面中显示任何文字]
        对白（季云舟，成年男性，25岁，声线温润清朗如春风，语速中偏快带笑意，说话时有明显的抑扬顿挫和戏剧感，偶尔拖长尾音表示调侃）：「你……刚才那个金光——是你？」
        对白（沈清词·内心，成年女性，17岁，声线清冷凌厉如冰泉，语速从容不迫，每个字清晰有力不带一丝多余情绪，偶尔轻笑时带淡漠距离感）：「季云舟——他看到了。」
        对白（季云舟，成年男性，25岁，声线温润清朗如春风，语速中偏快带笑意，说话时有明显的抑扬顿挫和戏剧感，偶尔拖长尾音表示调侃）：「那个灵力等级……你到底——是什么人？」
