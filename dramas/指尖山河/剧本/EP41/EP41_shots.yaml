  - {shot_id: EP41-S17, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "（读出——绣谱——第一页）——「此技——始于——唐——传——四十七——代——至——吾——手中——山河——针法——凡——一千——一百——九十——七年——愿——后——世——女儿——不——断——此——针——苏秀芝——记」", "type": "spoken"}, {"speaker": "CHAR-001", "text": "奶奶——一千——一百——九十——七年——加上——我——这一——代——就是——一千——两百——年——今天——我——要——带着——它——去——巴黎——了——不是——去——展览——是——去——告诉——世界——中国——的——女人——用——一——根——针——绣——了——一千——两百年——的——山河——还——在——继续——绣——下去", "type": "spoken"}]}
  - {shot_id: EP41-S18, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 特写, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "巴黎——我——来了——山河——我们——一起——去——让——世界——看看——一千——两百年——的——针——可以——绣——出——什么", "type": "inner"}]}
