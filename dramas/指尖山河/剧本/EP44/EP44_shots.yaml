  - {shot_id: EP44-S05, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——梵华——总部——那边——很——不满——他们说——这是——他们——第一次——遇到——合作方——完全——否决——总部——设计——方案——的——情况——艾米丽——甚至——提议——取消——合作", "type": "spoken"}, {"speaker": "CHAR-001", "text": "那就——取消——顾教授——如果——合作——的——代价——是——山河——针法——失去——自己——的——灵魂——那——我——宁愿——不——合作——钱——可以——再——赚——灵魂——丢了——就——找——不——回来——了", "type": "spoken"}]}
  - {shot_id: EP44-S06, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "那你——有没有——替代——方案——可以——让——他们——看到——山河——针法——主导——设计——是什么——样子", "type": "spoken"}, {"speaker": "CHAR-001", "text": "有——我——今晚——就——做——给他们——看——不是我——一个人——做——是——我们——一起——做——阿芳嫂——小兰——小禾——每个人——绣——一件——用——山河——针法——的——方式——不是——梵华——的——方式——明天——摆——在——艾米丽——面前——让她——看看——什么叫——从——针——开始——的——设计", "type": "spoken"}]}
