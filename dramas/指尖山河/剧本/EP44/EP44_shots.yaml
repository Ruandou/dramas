  - {shot_id: EP44-S13, scene: SCENE-011, characters: ["CHAR-001", "CHAR-008", "CHAR-009"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-008": "CHAR-008-L01", "CHAR-009": "CHAR-009-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-009-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "各位——接下来——三周——我们——要——完成——联名——系列——的——全部——手工——部分——十二件——作品——每件——都需要——山河——针法——至少——六式——这——很——难——但——我们——做到——过——更——难——的事——我们——从——零——开始——学会——了——直针——从——直针——学会——了——回针——从——回针——学会——了——缠针——现在——我们——要——让——世界——看到——我们——学——到——了——什么", "type": "spoken"}, {"speaker": "CHAR-008", "text": "苏锦——我们——跟——你——做——！你——绣——哪——我们——就——绣——哪——！", "type": "spoken"}]}
