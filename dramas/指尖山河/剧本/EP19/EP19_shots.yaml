  - {shot_id: EP19-S09, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——村长——陈大伯——今天在榕树下——说——县里来了通知——后山遗址——申报——被冻结了——说——那些石头——可能是——后人伪造的——", type: spoken}, {speaker: CHAR-GRP-08, text: "——他还说——冻结——是国家文物局的意思——说明——那些石头——不值钱——苏锦——在骗大家——", type: spoken}]}
