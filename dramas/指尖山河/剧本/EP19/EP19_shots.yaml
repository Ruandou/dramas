  - {shot_id: EP19-S11, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-002, text: "——我写了一份——反驳意见——针对马国良鉴定的——三个漏洞——第一——他说壁画颜料是民国化学颜料——但王教授已经确认——朱砂——孔雀石——金粉——全部是天然矿物——唐代标准——", type: spoken}, {speaker: CHAR-002, text: "——第二——他说碑文字体是民国仿唐——但碑文中的避讳字——世字缺笔——是唐太宗李世民——避讳——民国人——仿不出来——", type: spoken}, {speaker: CHAR-002, text: "——第三——他说十二式针法图解是后人添刻——但风化程度——和壁画主体——完全一致——如果是后人添刻——风化程度——会不同——这是——基础地质学——", type: spoken}]}
  - {shot_id: EP19-S12, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——顾教授——这份反驳书——明天——发给文物局——和碳十四报告一起——可以吗——", type: spoken}, {speaker: CHAR-002, text: "——可以——但碳十四——还需要——七天——这七天——周明远——会做什么——", type: spoken}, {speaker: CHAR-001, text: "——他会——趁冻结——加码——推动第二次村民大会——让村民——在他伪造的证据面前——动摇——重新投票——", type: spoken}, {speaker: CHAR-002, text: "——那你——打算——怎么办——", type: spoken}, {speaker: CHAR-001, text: "——绣——七天——我不去省城——不去县城——不去榕树下——我在这里——绣——七天之后——碳十四出来——我拿着报告——和反驳书——和白绢上——已经完成的——五式山河——去村民大会上——给他们看——什么是——真的——", type: spoken}]}
