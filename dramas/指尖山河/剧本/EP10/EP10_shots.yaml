# SOURCE FIDELITY PROOF: 18 shots source = 18 shots YAML ✅
shots:
  - {shot_id: EP10-S01, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "昨晚我想了一夜。顾言深说得没错——我不完全懂。但奶奶等了十年——不是等我回来继续犹豫。她等我回来——开始。", type: inner}, {speaker: CHAR-001, text: "今天是第五天。入门十二式——我学了两种。还有十种——还有山水二十四针——花鸟十六法——还有人物九变——但我不能再等了。我需要在开始之前——告诉这个村子——我要留下来。", type: inner}]}
  - {shot_id: EP10-S02, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png], dialogue: [{speaker: CHAR-001, text: "——陈主任。我想跟你说一件事。", type: spoken}, {speaker: CHAR-GRP-03, text: "苏锦啊——老宅的事我已经报上去了——镇里说可以申请危房补贴——不过要走流程——", type: spoken}, {speaker: CHAR-001, text: "不是老宅的事。我——决定留在云溪村。学我奶奶的山河针法。可能需要很长时间——可能需要一直留下来。", type: spoken}, {speaker: CHAR-GRP-03, text: "——你说什么——山河什么——", type: spoken}]}
  - {shot_id: EP10-S03, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png], dialogue: [{speaker: CHAR-GRP-03, text: "苏锦——你说的这些——失传三百年——非遗学者——我听不大懂。但你奶奶我是认识的——苏秀芝——绣花绣得好——村里都知道。但你——你一个城里人——学了三天——你说要留下来？", type: spoken}, {speaker: CHAR-001, text: "不是三天——我已经决定了。不管多久——我要把它学会。", type: spoken}, {speaker: CHAR-GRP-03, text: "问题不是你想不想学——是你学了要干什么。你奶奶绣了一辈子——从来没出过村子。你不一样——你是上海来的——你是设计师——你要是学了——拿出去——改头换面——变成什么现代设计——那还是苏家的东西吗。", type: spoken}]}
  - {shot_id: EP10-S04, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png], dialogue: [{speaker: CHAR-001, text: "陈主任——你说我奶奶绣了一辈子——从来没出过村子。你说得对。但你知道她为什么没出过村子吗。不是她不想——是她不敢。她怕——一旦被外面知道——苏家的东西就不再属于苏家了。所以她守在云溪村——守了一辈子——守到睡着——手还放在绣绷上。", type: spoken}, {speaker: CHAR-001, text: "我不会像她那样。我不是来把苏家的东西拿走——我是来把它带出去。让外面的人知道——在云溪村——有最好的针线——最好的人——最好的山河。", type: spoken}]}
  - {shot_id: EP10-S05, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png], dialogue: [{speaker: CHAR-GRP-03, text: "苏锦——你说你要把它带出去——这我管不着。但你奶奶的山河针法——如果真的是你说的那样——是苏家两百年传下来的——你一个刚回来的——学了三天——就要改——你问问村里人——他们同意不同意。", type: spoken}, {speaker: CHAR-GRP-03, text: "大家说——苏锦丫头说要留在村里学她奶奶的针法——还要拿出去给外面的人看——你们怎么看。", type: spoken}]}
  - {shot_id: EP10-S06, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png], dialogue: [{speaker: CHAR-001, text: "不用他们回答。我自己说。", type: spoken}, {speaker: CHAR-GRP-03, text: "——你说什么。", type: spoken}, {speaker: CHAR-001, text: "我知道你们在想什么。城里人——来了几天——就要改苏家两百年的规矩。我告诉你们——我不改苏家的规矩。苏家的规矩我会守着——入门十二式——山水二十四针——花鸟十六法——一针一针地学——跟奶奶学——跟太奶奶学——跟苏家十代人学。但学完之后——我要用它——做苏家从来没做过的事。", type: spoken}]}
  - {shot_id: EP10-S07, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "陈主任——你刚才说苏锦才学了三天。那我问你——苏秀芝学了多少年。", type: spoken}, {speaker: CHAR-GRP-03, text: "——这个——", type: spoken}, {speaker: CHAR-GRP-08, text: "六十年。她从十六岁开始绣——绣到七十六岁——六十年的功夫——全在箱子里——全在墙上——全在苏锦手里那本绣谱里。苏秀芝等了十年——等苏锦回来——不是等她把箱子锁上——是等她打开。", type: spoken}, {speaker: CHAR-GRP-08, text: "苏秀芝活着的时候——你们谁去看过她绣的花。没有。现在苏锦要学——你们倒是都有意见了。", type: spoken}]}
  - {shot_id: EP10-S08, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-001, text: "谢谢——", type: spoken}, {speaker: CHAR-GRP-08, text: "你奶奶要是看到——她该多高兴。她等了一辈子——总算等到苏家有一个人——敢站在村口说话。", type: spoken}, {speaker: CHAR-001, text: "我不需要你们现在就相信我。但我会让你们——看着我绣。每天——在老宅——门开着——谁都可以进来。看我做不做得到。我不关门——不躲——不藏。", type: spoken}]}
  - {shot_id: EP10-S09, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-03, text: "苏锦——你说你要学——我不拦你。但你说你要拿出去——用苏家的东西——做什么苏家从来没做过的事——这个——你得给村里一个交代。不是给我——是给你奶奶——给苏家祖宗——给云溪村。", type: spoken}, {speaker: CHAR-001, text: "什么交代。", type: spoken}, {speaker: CHAR-GRP-03, text: "你得证明——你学的东西——还是苏家的东西。不是变了味的——不是被外面人改了的——是苏秀芝的针法——是云溪村的山河。你怎么证明——你自己看着办。", type: spoken}]}
  - {shot_id: EP10-S10, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-001, text: "三个月。", type: spoken}, {speaker: CHAR-GRP-03, text: "——什么三个月。", type: spoken}, {speaker: CHAR-001, text: "给我三个月。我绣出一件作品——用山河针法——让所有人闭嘴。如果我做不到——我把绣谱交出来——交给村里——交给博物馆——随便你们怎么处理。如果我做到了——你们让我继续。不拦我——不问我——让我把奶奶的东西——带出云溪村。", type: spoken}, {speaker: CHAR-001, text: "三个月。从今天开始。", type: spoken}]}
  - {shot_id: EP10-S11, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-03, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-03: CHAR-GRP-03-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-03-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-03, text: "三个月——你确定。", type: spoken}, {speaker: CHAR-001, text: "确定。", type: spoken}, {speaker: CHAR-GRP-03, text: "你绣什么。", type: spoken}, {speaker: CHAR-001, text: "山河。我们云溪村的山河。奶奶绣了一辈子它——我现在也绣它。同一座山——同一条水——同一个村子——但用我的手——我的针——我的眼睛。", type: spoken}]}
  - {shot_id: EP10-S12, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "锦丫头——你刚才说的话——跟你奶奶年轻时一模一样。你奶奶二十岁的时候——村口的王裁缝说她绣的花不好看——她当着全村的面——当场绣了一只蝴蝶——绣完——王裁缝不说话了。", type: spoken}, {speaker: CHAR-001, text: "陈婶——奶奶的那只蝴蝶——现在在我口袋里。", type: spoken}, {speaker: CHAR-GRP-08, text: "三个月——婆婆等你。等你绣完——婆婆给你煮红豆汤——你奶奶最爱喝的。", type: spoken}]}
  - {shot_id: EP10-S13, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "三个月——一件作品——让所有人闭嘴。我在发布会上也说过类似的话——下一季——我会让所有人看到不一样的锦时——然后赵启明和林曼——在我背后——改了所有的设计稿。", type: inner}, {speaker: CHAR-001, text: "但那是在上海。这里是云溪村。这里没有人会在我背后改设计稿——因为这里的人——根本不知道设计稿是什么。他们只相信一件事——眼睛看到的。三个月后——我会让他们看到。", type: inner}]}
  - {shot_id: EP10-S14, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "三个月。入门十二式——我已经学了两种——层云针和流水针。还有十种——每天学一种——十天后我可以学完入门。然后山水二十四针——每种至少三天——那就是七十二天。加上花鸟十六法——加上设计——加上绣制——", type: inner}, {speaker: CHAR-001, text: "——时间不够。但这不重要。重要的是——我终于——有了一个期限。不是奶奶给我的——是我自己给的。三个月后——我会站在这里——同一棵榕树下——手里拿着完成的作品。到时候——所有人都会看到——苏家的东西——还姓苏。", type: inner}]}
  - {shot_id: EP10-S15, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "从今天开始——这扇门——不关了。谁都可以进来看。看我绣——看我错——看我改——看我三个月后——交出什么。", type: spoken}, {speaker: CHAR-001, text: "奶奶关了一辈子的门——我第一天就打开。不是因为我不怕——是因为我知道——关了门的东西——再珍贵——也只有一个人知道。开了门——才有人看见。有人看见——它才活着。", type: inner}]}
  - {shot_id: EP10-S16, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "陈婶——坐在门外——择韭菜。她不说话——但她坐在那里——像一座山。", type: inner}, {speaker: CHAR-001, text: "奶奶——你看到了吗。我不是一个人。陈婶在——你的蝴蝶在——墙上你的绣品在。还有——那个人——那个在村口等了我三个小时的人——他的笔记本——还在我桌上。他走了——但他留下的东西——在。", type: inner}]}
  - {shot_id: EP10-S17, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "三个月——从今天——从这一针开始。", type: inner}, {speaker: CHAR-001, text: "入门十二式——层云针——巩固——", type: inner}]}
  - {shot_id: EP10-S18, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "太阳从后山落下去——和墙上那幅绣品一样——七种金色——不同深浅——不同角度。奶奶没有夸张——她只是把看到的东西——一针一针地——留下来了。", type: inner}, {speaker: CHAR-001, text: "三个月后——我也会。用我的眼睛——我的针——我的山河。", type: inner}], overlay: "三个月——九十天——从这一针开始"}
