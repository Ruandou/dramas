  - {shot_id: EP18-S03, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——慢——才是快。奶奶用了三年——不是因为她慢——是因为她不容错——每一针——都必须——是对的。石壁上的警告——不是要你快——是要你——正确——", type: inner}]}
  - {shot_id: EP18-S04, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——你奶奶——学穿云针——用了两个月——你——五天——就碰到门槛了——别告诉她——", type: spoken}]}
  - {shot_id: EP18-S05, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——两根丝之间——穿过——不碰——不挂——不偏——和——在上海——在竞标中——在两个客户之间——周旋——一样的——都是——找到缝隙——穿过去——不留痕迹——", type: inner}]}
  - {shot_id: EP18-S06, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-002, text: "——苏锦——王教授刚打电话——说有人去了省文物局——问——云溪村遗址的申报——能不能——暂缓——理由是——土地权属——有争议——", type: spoken}]}
  - {shot_id: EP18-S07, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——李科长——是我——明远——对——上次一起吃饭的——有个事——想请你帮个忙——云溪村后山——有一个民间申报——省级文保——你能不能——看看——流程上——有没有——需要——补充材料的——地方——对——拖一拖——就好——", type: spoken}]}
  - {shot_id: EP18-S08, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——老张——国土局那边——后山那片竹林——土地性质——有没有可能——从农用地——变成——旅游开发用地——对——我知道有难度——但——云溪村的村长——站在我这边——村民——也已经——表决过了——对——三十二票——不同意——但那是——没有看到钱的表决——不算数——", type: spoken}]}
  - {shot_id: EP18-S09, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——两周——你从填表到推荐函——只用了两天——那从现在——到批文——需要多久——一个月——两个月——三个月——不管多久——我都不能等——", type: spoken}]}
  - {shot_id: EP18-S10, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——喂——是我——有个活——需要你做——云溪村后山——唐代遗址——有没有办法——出一份——鉴定——说——壁画——是近现代的——仿品——碑文——是后人刻的——多少钱——你开价——", type: spoken}]}
  - {shot_id: EP18-S11, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——苏锦——你以为你赢了——投票——专家——推荐函——你以为——这些能拦住我——你忘了——我是商人——商人的规则——不是投票——是——出价——", type: spoken}]}
  - {shot_id: EP18-S12, scene: SCENE-002, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——叫司机——去省城——今天——我要见一个人——", type: spoken}]}
  - {shot_id: EP18-S13, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-002, text: "——我低估他了——周明远——他不是普通的开发商——他在县城经营了二十年——关系——比钱——更管用——", type: spoken}, {speaker: CHAR-001, text: "——他现在——同时在三条线上——推进——文物局——国土局——伪造鉴定——", type: spoken}]}
  - {shot_id: EP18-S14, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——顾教授——你做了十年文献——你知道——历史上——有多少次——山河针法——差点失传——", type: spoken}, {speaker: CHAR-002, text: "——至少三次——明末战乱——清末太平天国——文革——", type: spoken}, {speaker: CHAR-001, text: "——三次——山河针法——都活下来了。不是因为没有周明远这样的人——是因为——每一次——都有一个苏家的女人——站了起来——拿起了针——绣了下去——。这一次——轮到我了——", type: spoken}]}
  - {shot_id: EP18-S15, scene: SCENE-002, characters: [CHAR-001, CHAR-002, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——周明远——在文物局——有关系——我信——在国土局——有关系——我也信——但在云溪村——他的关系——只有村长——只有钱——没有别的——", type: spoken}, {speaker: CHAR-GRP-08, text: "——村里——三十八户——三十二户——不卖——这就是你的——底气——锦丫头。文物局的公章——国土局的批文——再大——大不过——三十二双手——举起——不卖——", type: spoken}]}
  - {shot_id: EP18-S16, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——周明远——你的三条线——我都有对策。文物局——王教授——国土局——村民——伪造鉴定——真相——。但最重要的对策——不是防御——是——这面白绢上的——山河——", type: inner}]}
  - {shot_id: EP18-S17, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-002, text: "——我推了十年眼镜——看了十年文献——一直在找——山河针法为什么能传下来——今天——我知道了——不是因为技法——是因为——每个时代——都有一个——不怕针扎手——不怕公章压——不怕钱砸——的——女人——", type: spoken}]}
  - {shot_id: EP18-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——五个创可贴——第二式——刚刚开始——还有十式——八周。周明远——你打你的电话——我绣我的山河——你可以买通三个人——五千人——三万人——但你买不通——一个——正在绣山的——女人——", type: inner}]}