shots:
  - {shot_id: EP13-S01, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——这么大——比我想象的大——整面墙都是壁画——如果保存完整——", type: spoken}, {speaker: CHAR-002, text: "先戴上——藤蔓有刺。唐代遗址的藤蔓——有些可能已经长了五百年——根扎得很深——但壁画更古老——它不会轻易碎的。", type: spoken}, {speaker: CHAR-001, text: "——好。", type: spoken}]}
  - {shot_id: EP13-S02, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——天——顾言深——你看——", type: spoken}, {speaker: CHAR-002, text: "——这是——", type: spoken}]}
  - {shot_id: EP13-S03, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——她在绣——她在绣山河——一千两百年了——她还在绣——", type: spoken}, {speaker: CHAR-002, text: "——唐代壁画——工笔重彩——画风带有明显的盛唐向晚唐过渡特征。树——画面构图——人物比例——完全符合元和年间风格。这不是民间画工的手笔——这是受过宫廷训练的——", type: spoken}]}
  - {shot_id: EP13-S04, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——你看——她的手——拇指和食指的夹角——手腕的内扣——这是盘云针的起手式。一模一样——一千两百年——手的姿势没变过——针的拿法没变过——", type: spoken}, {speaker: CHAR-002, text: "——这——这不只是风格传承——这是精确的技术传承。她画的不是一般的刺绣场景——她画的就是山河针法的标准手势。这幅壁画——是教材——是留给后人的教科书。", type: spoken}]}
  - {shot_id: EP13-S05, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——盘云针——穿云针——流水针——风动针——坠石针——每一样——都在上面——绣谱里有的——壁画上全有——但壁画上的笔画——更早——更原始——", type: spoken}, {speaker: CHAR-001, text: "这不是传承——这是源头。绣谱里的图解——是在描摹这幅壁画。每一代苏家的女人——学了入门十二式——她们的老师——不是奶奶——不是太奶奶——是这幅壁画——是壁画上这个——一千两百年前的女人——", type: spoken}, {speaker: CHAR-002, text: "——如果这十二幅图解是壁画——那山河针法的起源就不是清代——是唐代。这个发现——会把徽州刺绣史提前至少——七百年。", type: spoken}]}
  - {shot_id: EP13-S06, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——盒——中——藏——针——传——与——后——人——", type: spoken}, {speaker: CHAR-001, text: "——针的形制——长度——粗细——一模一样。奶奶的针——不是奶奶的——是第一代的——是一千两百年传下来的——", type: spoken}, {speaker: CHAR-002, text: "——苏锦——这根针——可能比云溪村还要老——比我们脚下任何一块石头都要老——", type: spoken}]}
  - {shot_id: EP13-S07, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——元和十年——岁次乙未——长安苏氏女——避安史余乱——南迁至歙州云溪——见山水秀丽——遂结庐而居——", type: spoken}, {speaker: CHAR-002, text: "——苏氏善针黹——尤精双面全同之法——因感怀故土山河——遂创——山河针法——十二式——", type: spoken}, {speaker: CHAR-001, text: "——因感怀故土山河——她是看着云溪村的山——想着长安的山——绣出了第一针——", type: spoken}, {speaker: CHAR-002, text: "——传于乡女——立规矩——非苏门嫡传——不可悉授——", type: spoken}]}
  - {shot_id: EP13-S08, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——顾教授——最后一行写了什么——", type: spoken}, {speaker: CHAR-002, text: "——最后三行——不是碑文——不是历史记录——是她留给你的话。", type: spoken}, {speaker: CHAR-002, text: "——山河有灵——针下有命——非诚勿传——", type: spoken}, {speaker: CHAR-001, text: "——奶奶知道——她一定知道这幅壁画——她来过——她看到了这八个字——所以她写在绣谱上——绣在蝴蝶上——留给我——", type: spoken}, {speaker: CHAR-002, text: "——等一下——还有。你看右下角——还有一行更小的——刻得更深的——", type: spoken}]}
  - {shot_id: EP13-S09, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——见——碑——者——三——年——内——须——以——山——河——针——法——绣——成——一——物——否——则——", type: spoken}, {speaker: CHAR-001, text: "——针——断——人——亡——", type: spoken}, {speaker: CHAR-002, text: "——这——这不是诅咒——这是——", type: spoken}, {speaker: CHAR-001, text: "——不是诅咒——是契约。她留下山河针法——留下壁画——留下针——但有一个条件——看到壁画的人——必须在三年内——用山河针法——绣出一件作品。如果做不到——", type: spoken}]}
  - {shot_id: EP13-S10, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "奶奶来过这里——她看到了这句警告——所以她绣了一辈子——绣到了最后一针——没有断——没有人亡。但她的针断了——在最后一幅绣品完成之后的那个晚上——针断了——人也走了——", type: spoken}, {speaker: CHAR-002, text: "——苏锦——这不是超自然的东西——这是——一种传承机制——一种确保山河针法不会失传的方法——第一代绣娘知道——如果后人看到了壁画——看到了针法的源头——最珍贵的版本——就会有一个时间限制——必须在有限时间内——完成——", type: spoken}, {speaker: CHAR-001, text: "——我懂——顾教授。这不是魔法——这是工程。她想让每一个看到这幅壁画的人——不管隔了多少代——都会被逼着——去学——去绣——去完成。不完成的——不配传承。", type: spoken}, {speaker: CHAR-001, text: "她设计了一个系统——一个能运行一千两百年的系统——最后一条规则——写在石头上——", type: spoken}]}
  - {shot_id: EP13-S11, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——苏锦——这里——有后来人写的字——", type: spoken}, {speaker: CHAR-002, text: "不是唐代的——笔迹很新——可能——三四十年——炭写的——已经淡了——但还能读——", type: spoken}, {speaker: CHAR-001, text: "——这是奶奶的字——日记里的字——和这个——一模一样——", type: spoken}, {speaker: CHAR-001, text: "——秀芝——1973年春——来此——见碑——得针——", type: spoken}, {speaker: CHAR-001, text: "——她写了日期——七三年——那时候她多大——三十岁——已经绣了很多年了——然后她发现了这里——看到了壁画——看到了警告——她签了名字——像签合同——", type: spoken}]}
  - {shot_id: EP13-S12, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——1975——盘云针成——", type: spoken}, {speaker: CHAR-001, text: "——1978——十二式通——", type: spoken}, {speaker: CHAR-001, text: "——1983——山河绣成——", type: spoken}, {speaker: CHAR-001, text: "——下面还有——最后一行——1985——", type: spoken}, {speaker: CHAR-001, text: "——1985——锦儿生——", type: spoken}, {speaker: CHAR-002, text: "——你出生那年——她完成了——她把你的名字——刻在这里——和第一代绣娘——和山河针法——放在一起——", type: spoken}]}
  - {shot_id: EP13-S13, scene: SCENE-006, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——1985——我出生那年——奶奶在石壁上写——锦儿生。她没有写山河针法——她写的是我。在她心里——我——和山河针法——一样重要。不——更重要——因为我是——她在三年期限到期之前——完成的——最后一件作品。", type: inner}, {speaker: CHAR-001, text: "奶奶——你从来没跟我说过山河针法——你只给我绣蝴蝶——只让我学设计——只让我去上海——你不想让我看到这块石头——不想让我看到那句警告——你不想让我——被绑在这个契约里——", type: inner}]}
  - {shot_id: EP13-S14, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——我回来了——我是苏锦——苏秀芝的孙女——苏门第十代——我来完成契约。", type: spoken}, {speaker: CHAR-002, text: "——苏锦——碑文说——三年——从你看到壁画的第一眼开始——三年——", type: spoken}, {speaker: CHAR-001, text: "——不用三年。我三个月。我说过——三个月——绣出一件作品——让所有人闭嘴。现在我知道了——这件作品——不只是给村民看的——不只是给博物馆看的——是给这幅壁画——是给这个等了一千两百年——还在绣的女人——看的。", type: spoken}]}
  - {shot_id: EP13-S15, scene: SCENE-006, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——我不知道你的名字——碑文上只写了「长安苏氏女」——连名字都没留——但我知道你是谁。你是第一个拿起这根针的人——你是第一个在云溪村的白绢上——绣出山河的人——你是把十二式刻在这面石壁上的人——你是写下「山河有灵——针下有命」的人。", type: spoken}, {speaker: CHAR-001, text: "我——苏锦——苏门第十代——今天——在你这面石壁前——接针——接契约——接山河。", type: spoken}, {speaker: CHAR-001, text: "三年内——我必以山河针法——绣成一物——以证传承——以谢先人——以传后世。", type: spoken}]}
  - {shot_id: EP13-S16, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——走吧——顾教授。回去——我要开始绣了。", type: spoken}, {speaker: CHAR-002, text: "——我帮你。不只是因为我是做研究的——是因为——", type: spoken}, {speaker: CHAR-002, text: "——是因为——你的奶奶——把你的名字——写在这里了。她相信你能找到这里——我也相信。", type: spoken}, {speaker: CHAR-001, text: "——好。", type: spoken}]}
  - {shot_id: EP13-S17, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——你写了什么——", type: spoken}, {speaker: CHAR-001, text: "——2026——苏锦——见碑——接针——", type: spoken}, {speaker: CHAR-001, text: "——奶奶写「锦儿生」——我写「苏锦——见碑——接针」。从她把我生下来——到我回来——四十一年。不多不少——刚好够一个轮回——刚好够一个女人——从被保护的人——变成拿起针的人。", type: inner}]}
  - {shot_id: EP13-S18, scene: SCENE-005, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-005.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——你还有三个月——你打算绣什么——", type: spoken}, {speaker: CHAR-001, text: "——山河。", type: spoken}, {speaker: CHAR-001, text: "——针下有山河——奶奶说的——第一代绣娘说的——我说的——都一样。三个月后——全世界都会看到——山河针法——还活着。", type: spoken}]}