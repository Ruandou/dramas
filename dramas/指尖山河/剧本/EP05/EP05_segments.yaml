        【图1】CHAR-001-L01【图2】SCENE-002。竖屏9比16连贯叙事。镜头1（5秒）特写 固定：苏锦把自己绣的那一小块布从绣绷上取下来。四针——歪歪扭扭的，间距不均匀，最后一针还带着血迹。如果把这个拿到她以前的发布会上——会被笑死。但她看着这四针——像一个数学家看着自己推导出的第一个公式。不美。但里面藏着一个完整的逻辑系统。她从箱子里拿起奶奶绣的蝴蝶——放在自己的四针旁边。镜头2（5秒）中景 固定：苏锦站起来。腿跪麻了——扶着绣架站稳。陈婶的面条已经凉了——荷包蛋的蛋黄凝固在面条上。她端起碗大口大口地吃——从昨晚就没吃东西。面条虽凉但很香。她一边吃一边看着墙上奶奶的绣品——用新的眼光。不在看"好看"，在看每一针的角度、力度、方向。
