        [以下对白仅供语音合成]
        对白（陈婶，elderly female voice, strong Huizhou dialect, warm and weathered tone）：「锦丫头——晌午了。你从早上到现在没吃东西吧？我给你下了碗面。你奶奶以前绣到忘了吃饭——也是我端过来。你们苏家的人——绣起来就不要命。」
        对白（苏锦）：「陈婶——你看这幅竹叶。每一片针脚方向都不一样——你知不知道奶奶绣这片竹林绣了多久？」
        对白（陈婶）：「这个我不懂——我只知道她绣这片的时候，在竹林里坐了一整个春天。每天早上去——傍晚回来。有时候下雨也不走——打把伞坐在那里看。她说竹子在雨里最好看。」
        对白（苏锦）：「在竹林里坐了一个春天——」
        对白（陈婶）：「是啊——她说竹子有灵。不动的时候是一种样子，风来了又是一种样子。要看到竹子不装样子的时候——才能绣。」
        对白（苏锦）：「观其形于风中——得其势于心中——」
        对白（陈婶）：「面快凉了——你先吃。我回去了。」
