        [以下对白仅供语音合成]
        对白（苏锦）：「不对——入针的时候手腕要转。不转的话丝线会拧——拧了就会鼓包。」
        对白（苏锦）：「奶奶的手——七十年——手腕一转就是三十七度。我不行。我是设计师——我在纸上画过几千张设计稿。但我的手不知道怎么做。」
        对白（苏锦）：「竹叶——每一片针脚方向都不一样。叶尖朝上向左倾——叶尖朝下向右倾——」
        对白（苏锦）：「这不是在绣竹叶。这是在用针——模拟自然光在风中的方向变化。奶奶的绣品——每一幅都是一套光学计算。六十年前。没有电脑。没有公式。只有一双手。」
