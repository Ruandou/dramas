        对白（苏锦）：「四针。歪的。间距不对。最后一针有血。」
        对白（苏锦）：「奶奶绣这只蝴蝶——大概用了几千针。每一针都在正确的位置。六十年——几千针——几百万针。」
        对白（苏锦）：「好吃——从小到大最好吃的面。」
        对白（苏锦）：「陈婶说——奶奶在竹林里坐了一个春天。下雨也不走。我现在懂了——她不是在观察。她是在计算。用眼睛当量角器——用记忆当数据库——用一双手当计算机。」
