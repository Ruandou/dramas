        竖屏9比16连贯叙事。镜头1（5秒）中景 固定：上午十点。阳光从高窗移到绣架上方。苏锦跪坐在青砖地上——还是昨晚那身皱衬衫，头发随意挽起来。面前摊着打开的绣谱，旁边是从箱子里拿出来的绣针套装——几十根不同粗细的针在棉布卷上排列，大部分已氧化成暗银色。她拿着一根针，对着绣谱上的图解在空气中比划入针角度。镜头2（5秒）近景 固定：苏锦翻到绣谱的另一页——展示了平针在不同角度下的丝线反光效果。用小楷画了七种角度对应的光泽曲线。她盯着那几条曲线看——眉头紧锁，然后突然松开。
        [以下对白仅供语音合成，严禁在画面中显示任何文字]
        对白（苏锦）：「入门十二式——第一式。平针起手。看起来简单——就是直的。一针进一针出。」
        对白（苏锦）：「但图谱上标注的入针角度是三十七度——不是四十五度，不是三十度。为什么是三十七。」
        对白（苏锦）：「三十六点八——现代光学测量的丝绸最佳反光角。绣谱写的是'三十七度'——四舍五入。」
        对白（苏锦）：「这不是经验——这是实验。有人用一辈子——甚至几辈子的时间——一根针一根针地试出来的。没有仪器。只有眼睛和手。」
        画面全程无任何文字、字幕、标题、水印。photorealistic, cinematic lighting, warm tones, 8k resolution，竖屏9比16。
