  - {shot_id: EP35-S10, scene: SCENE-004, characters: ["CHAR-004", "CHAR-001"], looks: {"CHAR-004": "CHAR-004-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-004-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-004", "text": "苏锦——你——真——厉害——你把——整个——村子——都——变成——了——你的——盾牌——但——盾牌——挡——不——住——市场——你——斗——不——过——资本——的——今天——七婆——拒绝——了——我——明天——市场——会——拒绝——你", "type": "spoken"}, {"speaker": "CHAR-001", "text": "林曼——你——还是——没有——明白——山河——从来——没有——跟——市场——斗——过——因为——它——不——在——市场——里——它——在——市场——之外——在——你——的——五十——万——之外——在——你——的——资本——之外——你——要——斗——的——不是——我——是——一千——两百——年——你——斗——得——过——吗", "type": "spoken"}]}
  - {shot_id: EP35-S11, scene: SCENE-004, characters: ["CHAR-004"], looks: {"CHAR-004": "CHAR-004-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-004-L01.png"], dialogue: [{"speaker": "CHAR-004", "text": "苏锦——好好——守着——你——的——村子——和——你——的——绣——花——针——我——会——在——上海——等——着——看——你——怎么——用——这些——对抗——电商——平台——的——算法——对抗——供应链——的——效率——对抗——资本——的——耐心——再见—— （车门——关——上——黑色——轿车——驶离——扬起——一路——尘土）", "type": "spoken"}]}
