  - {shot_id: EP35-S04, scene: SCENE-003, characters: ["CHAR-006", "CHAR-004"], looks: {"CHAR-006": "CHAR-006-L01", "CHAR-004": "CHAR-004-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-006-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-004-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-006", "text": "姑娘——你——不是——苏锦——的——朋友——苏锦——的——朋友——不会——背着——她——来——找我——你——是——她——在——上海——的——那个——合伙——人——对吧——那个——害——她——的——人", "type": "spoken"}, {"speaker": "CHAR-004", "text": "（脸色——变——了——但——保持——镇定）——七婆——您——误会——了——我和苏锦——之间——有些——事情——很——复杂", "type": "spoken"}, {"speaker": "CHAR-006", "text": "复杂——我不——懂——复杂——我只——懂——针——针——不会——骗——人——你——的——手——没有——拿——过——针——你的——心——我——看不清——所以——我——不——信", "type": "spoken"}]}
  - {shot_id: EP35-S05, scene: SCENE-004, characters: ["CHAR-007", "CHAR-008", "CHAR-001"], looks: {"CHAR-007": "CHAR-007-L01", "CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-007", "text": "苏锦——那个——女的——真的——去——找——七婆——了——你说——七婆——会不会", "type": "spoken"}, {"speaker": "CHAR-001", "text": "不会——陈伯——七婆——守——了——山河——七十——年——如果——五十——万——就——能——买——走——她——那——山河——早——就——断——了——我——不是——担心——七婆——我——是——担心——林曼——她——不——知道——自己——在——跟——什么——样——的——人——说话", "type": "spoken"}]}
  - {shot_id: EP35-S06, scene: SCENE-004, characters: ["CHAR-008", "CHAR-001"], looks: {"CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "苏锦——我们——要——不——要——去——看看——万一——七婆——被——说——动——了——呢——毕竟——五十——万——对于——村里——的——老人——来说——是——一辈子——都——见——不到——的——钱", "type": "spoken"}, {"speaker": "CHAR-001", "text": "阿芳嫂——你——觉得——山河——针法——值——多少——钱", "type": "spoken"}, {"speaker": "CHAR-008", "text": "我——不知道——应该——很——多——吧", "type": "spoken"}, {"speaker": "CHAR-001", "text": "七婆——知道——在她——心里——山河——针法——没有——价格——只有——重量——那是——七十——年——的——重量——五十——万——太——轻——了", "type": "spoken"}]}
