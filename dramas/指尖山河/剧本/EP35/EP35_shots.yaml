  - {shot_id: EP35-S13, scene: SCENE-011, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——林曼——动手——了——她——联合——周明远——在——三个——电商——平台——同时——上线——了——新——系列——价格——定——在——我们——的——三分——之一——全部——是——机器——刺绣——加——手工——修——整——打——的——旗号——是——「让——非遗——走进——寻常——百姓——家」", "type": "spoken"}, {"speaker": "CHAR-001", "text": "让——非遗——走进——寻常——百姓——家——好——漂亮——的——口号——顾教授——你知道——这个——口号——最——厉害——的——地方——是——什么——吗——是——它——让——我们——如果——反对——就——显得——我们——不想——让——非遗——走进——百姓——家", "type": "spoken"}]}
  - {shot_id: EP35-S14, scene: SCENE-011, characters: ["CHAR-008", "CHAR-001"], looks: {"CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "苏锦——这些——衣服——跟——我们——做——的——好像——但——为——什么——这么——便宜——我们——一件——手工——旗袍——光——材料——就——要——上千——块——她们——怎么——做到的", "type": "spoken"}, {"speaker": "CHAR-001", "text": "她们——用的——不是——手工——阿芳嫂——机器——绣——底——稿——人工——只——做——最后——的——修——整——所以——可以——批量——生产——成本——只有——我们——的——十分——之一", "type": "spoken"}, {"speaker": "CHAR-008", "text": "那——买——的——人——知道——区别——吗", "type": "spoken"}, {"speaker": "CHAR-001", "text": "大多数——人——不——知道——他们——只看——图片——和——价格", "type": "spoken"}]}
  - {shot_id: EP35-S15, scene: SCENE-011, characters: ["CHAR-001", "CHAR-002"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-002": "CHAR-002-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——数据——出来——了——昨天——二十三——单——今天——到——现在——只有——三——单——林曼——的——价格——战——起作用——了——消费者——在——用——钱包——投票", "type": "spoken"}, {"speaker": "CHAR-001", "text": "三——单——比——我——预想——的——多", "type": "spoken"}, {"speaker": "CHAR-002", "text": "你——不——担心", "type": "spoken"}, {"speaker": "CHAR-001", "text": "担心——但——担心——没用——顾教授——林曼——可以——降价——但——她——降——不——了——时间——消费者——今天——买——了——她——的——产品——可能——觉得——很——划算——但——穿过——洗——过——之后——就——会——发现——区别——那些——真正——想要——山河——的人——会——回来——的", "type": "spoken"}]}
