  - {shot_id: EP36-S13, scene: SCENE-003, characters: ["CHAR-001", "CHAR-002"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-002": "CHAR-002-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "你——一夜——没——睡", "type": "spoken"}, {"speaker": "CHAR-001", "text": "我——想到——了——顾教授——山河——白绢——太——大——了——带——去——比赛——不——现实——但——我——可以——带——山河——针法——去——不是——一幅——作品——而是——一——种——技法——我——要——在——比赛——现场——绣——让——评委——看到——针——是怎么——穿过——丝——线——是——怎么——变成——山河——的——这——比——带——成品——更——有——说服——力", "type": "spoken"}]}
  - {shot_id: EP36-S14, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——你知道——吗——你——刚才——做——了——一件——非常——聪明的——事——山河——针法——的——价值——不——在于——某——一——幅——作品——的——宏大——在——于——技法——本身——的——精妙——带——技法——去——比赛——比——带——作品——更——有——冲击力——因为——作品——是——结果——技法——是——过程——非遗——大赛——要——看——的——不是——结果——是——传承——的——过程", "type": "spoken"}, {"speaker": "CHAR-001", "text": "所以——你——觉得——可以", "type": "spoken"}, {"speaker": "CHAR-002", "text": "不是——可以——是——必须——这——就是——山河——针法——应该——被——世界——看到——的——样子", "type": "spoken"}]}
  - {shot_id: EP36-S15, scene: SCENE-004, characters: ["CHAR-007", "CHAR-008", "CHAR-001"], looks: {"CHAR-007": "CHAR-007-L01", "CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-007", "text": "苏锦——！全村——的——人——都——来——送——你——了——！你——看看——七婆——也——来了——！你——一定——要——拿——个——奖——回来——！让——那个——林曼——看看——！让——那个——周明远——看看——！我们——云溪村——的——手艺——不是——他们——用——钱——能——砸——倒——的——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "陈伯——我——尽力——但——奖——不是——我——能——决定——的——我——只能——决定——我——绣——得——好——不——好", "type": "spoken"}]}
