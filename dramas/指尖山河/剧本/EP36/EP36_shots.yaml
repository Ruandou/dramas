  - {shot_id: EP36-S03, scene: SCENE-011, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "林曼——你的——广告——我——看到——了——很——漂亮——尤其——是——那个——「非遗——同款——工厂——直供」——你——把——非遗——两个——字——用得——真——好——可惜——工厂——直供——的——不是——非遗——是非遗——的——影子", "type": "spoken"}, {"speaker": "CHAR-004", "text": "（电话那头——声音——带着——笑意）——苏锦——我——不是——来——跟你——吵架——的——我——是——来——跟你——说——一声——今天——早上——八点——开始——我们——在——三个——平台——的——广告——全面——上线——了——到——中午——十二——点——为止——销售额——已经——突破——三十——万——四个——小时——三十——万——你——的——云溪——绣坊——一个月——能——卖——多少", "type": "spoken"}]}
  - {shot_id: EP36-S04, scene: SCENE-011, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 特写, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "林曼——你——打——这——个——电话——不是——为了——炫耀——数字——你是——想——听——我——慌——但——你——听——不——到——因为——我不——慌——你——卖——的——是——产品——我——绣——的——是——证明——你——的——三十——万——在——三——天——之内——可——能——变成——三——万——但——我——的——山河——再过——一百——年——还是——山河——我——不——跟——你——比——速度——因为——你——根本——不——知——道——慢——的——力量——有——多大", "type": "spoken"}, {"speaker": "CHAR-004", "text": "（沉默——三秒——挂断）", "type": "spoken"}]}
  - {shot_id: EP36-S05, scene: SCENE-011, characters: ["CHAR-008", "CHAR-007", "CHAR-001"], looks: {"CHAR-008": "CHAR-008-L01", "CHAR-007": "CHAR-007-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "苏锦——我们——还——绣——吗——没人——买——了——绣——给——谁——看", "type": "spoken"}, {"speaker": "CHAR-007", "text": "绣——！当然——绣——！没——人——买——就——不——绣——了——？那——种——地——的——没——人——买——菜——就——不——种——了——？什么——道理——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "阿芳嫂——陈伯——说得——对——我们——绣——不——是——因为——有人——买——是——因为——我们——是——绣娘——绣娘——不——绣——花——那——叫——什么——绣娘", "type": "spoken"}]}
  - {shot_id: EP36-S06, scene: SCENE-011, characters: ["CHAR-001", "CHAR-008"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-008": "CHAR-008-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "阿芳嫂——你看——你的——回针——已经——不——歪——了——一个月——前——你——连——直针——都——绣——不——直——现在——你的——回针——可以——去——参加——比赛——了", "type": "spoken"}, {"speaker": "CHAR-008", "text": "比赛——什么——比赛", "type": "spoken"}, {"speaker": "CHAR-001", "text": "省里——的——非遗——创新——大赛——如果——我们——能——拿——到——好——成绩——林曼——的——广告——再——多——也——压——不——住——省里——的——认证", "type": "spoken"}]}
  - {shot_id: EP36-S07, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——两个——消息——第一个——省级——非遗——公示——正式——发布——了——公示期——三十——天——没有——实质——异议——就会——正式——列入——省级——非遗——名录——第二个——东西——在——文件袋——里——你——自己——打开", "type": "spoken"}, {"speaker": "CHAR-001", "text": "（打开——文件袋——抽出——一张——烫金——邀请函）——「诚邀——云溪村——山河——针法——传承人——苏锦——参加——第二届——全省——非物质——文化——遗产——创新——大赛」", "type": "spoken"}]}
  - {shot_id: EP36-S08, scene: SCENE-003, characters: ["CHAR-001", "CHAR-002"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-002": "CHAR-002-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "比赛——时间——七天——后——地点——省城——非遗——博览馆——评委——包括——省——文旅厅——的——专家——中国——非遗——保护——中心——的——研究员——还有——一位——特别——评委——时尚——教母——苏珊——程", "type": "spoken"}, {"speaker": "CHAR-001", "text": "苏珊——程——我在——上海——的——时候——看过——她的——采访——她——说——中国——的——传统——手工艺——缺乏——现代——审美——需要——被——改造——而不是——被——保护", "type": "spoken"}, {"speaker": "CHAR-002", "text": "那你——打算——怎么——回应——她", "type": "spoken"}, {"speaker": "CHAR-001", "text": "用——针——回应——用——山河——针法——告诉她——有些——东西——不——需要——被——改造——因为——它——本身——就是——最——现代——的——审美", "type": "spoken"}]}
  - {shot_id: EP36-S09, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "但——还有——一个——坏——消息——周明远——没有——闲着——他——通过——他——的——媒体——渠道——开始——散布——关于——山河——针法——真伪——的——质疑——文章——说——苏家——的——针法——没有——文献——记载——可能——是——后人——伪造——的", "type": "spoken"}, {"speaker": "CHAR-001", "text": "文献——记载——奶奶——的——绣谱——不是——文献——吗——你父亲——的——笔记——不是——记载——吗——碳十四——报告——不是——证据——吗", "type": "spoken"}]}
  - {shot_id: EP36-S10, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "法律——层面——我们——有——全部——证据——但——舆论——层面——他们——不需要——证据——只需要——质疑——一个——问号——放在——标题——里——就——够了——大部分——人——不——会——点——进去——看——内容——他们——只会——记住——标题——里的——那个——问号——这就——是——周明远——的策略", "type": "spoken"}, {"speaker": "CHAR-001", "text": "所以——非遗——大赛——更——重要——了——顾教授——听证会——证明——了——山河——针法——是——真的——非遗——大赛——要——证明——山河——针法——是——活——的——真的——东西——会——被——质疑——但——活——的——东西——会——自己——证明——自己", "type": "spoken"}]}
  - {shot_id: EP36-S11, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "七天——后——省城——全省——的——非遗——传承人——都在——我——要——带——什么——去——山河——白绢——还没——完工——如果——带——半——成品——去——那些人——会——说——什么——说——山河——针法——不过——如此——但——如果——不带——山河——去——我——还能——带——什么", "type": "inner"}]}
