        text: "肩——盘针。腰——流水针。胸——放射针。臀——回针——天哪。"
        type: spoken
      - speaker: CHAR-001
        text: "入门十二式——十二个面料力学节点——分别对应人体十二个关键受力区。这是一套人体工学。三百年前的人体工学。"
        type: inner

