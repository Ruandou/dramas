        text: "立体剪裁验证。一块布——零裁剪——只用入门十二式的四个节点。肩——盘针。腰——流水。髋——回针。胸——留空——"
        type: spoken
      - speaker: CHAR-001
        text: "我在圣马丁学过Draping——法国人说这是他们十八世纪发明的。但入门十二式——每一个节点的功能——"
        type: inner

