    camera: closeup
    duration_sec: 5
    dialogue:
      - speaker: CHAR-001
        text: "二十针。五层。同样丝线——同样丝绸——通过针法角度和捻数——做出五种面料质感。从纱到呢——不用换布——不用裁剪——不用缝纫机。"
        type: spoken
      - speaker: CHAR-001
        text: "我做了十年设计——从没见过这种技术。巴黎没有。米兰没有。伦敦没有。只有这里——只有我奶奶的针线——有。"
        type: spoken

