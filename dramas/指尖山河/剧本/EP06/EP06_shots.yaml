    camera: close
    duration_sec: 5
    dialogue:
      - speaker: CHAR-001
        text: "我把入门十二式每一种针法画成一条受力线。十二条线——形成一张力网。然后我翻出我那件获奖礼服的打版图——结构完全一样。区别只在于——我用尺子。奶奶用针。平针是拉力。回针是回弹。盘针是承重——十二种针法组合——就是一张面料力网。"
        type: spoken
      - speaker: CHAR-001
        text: "奶奶——你不是在绣花。你是在写代码。用针写——写给丝绸看的代码。"
        type: spoken

  - shot_id: EP06-S03
    scene: SCENE-002
    characters:
