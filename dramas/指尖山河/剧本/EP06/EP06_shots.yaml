        text: "流水针——在立体上——是面料在人体上的自然流动。奶奶在竹林里坐了一个春天——不是在观察竹子。是在计算面料在运动中如何贴合人体。"
        type: spoken
      - speaker: CHAR-001
        text: "山河针法的每一针——都对应人体一个受力点。十二种针法——十二个力学节点——等于一张完整的服装结构图。她不是绣娘——她是工程师。用针做笔的服装工程师。"
        type: spoken

