        type: spoken
      - speaker: CHAR-GRP-08
        text: "是你苏家的东西。你奶奶说过——苏家的女人都有一本绣谱。传媳妇不传女儿——但你奶奶她没有媳妇——只有你这个孙女。所以传给你。"
