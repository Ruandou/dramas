      - speaker: CHAR-001
        text: "第三式——层云针——五层叠加。底层粗线大角度——表层细线小角度。这是面料厚度过渡——从厚到薄——从硬到软——"
        type: spoken
      - speaker: CHAR-001
        text: "如果把这五层放大到一件衣服上——肩部垫肩过渡到袖口薄纱。一层一层——不是靠裁剪——靠针法。缝即是裁。"
        type: inner

