      - speaker: CHAR-001
        text: "录音笔记——六月十二号，凌晨一点。我已经看了六个小时——入门十二式的总纲。这些针法不是随机的——每一种都有明确功能。平针是基线。回针是固定。盘针是承重。流水针是过渡——"
        type: spoken
      - speaker: CHAR-001
        text: "这不是在描述怎么绣花。这是在描述怎么构建一个结构。"
        type: inner

  - shot_id: EP06-S02
    scene: SCENE-002
    characters:
