        text: "验证成功。未裁剪面料——仅用入门十二式四个节点——形成完整立体结构。这不是刺绣——是服装工程。山河针法的终极形态——不是绣品。是衣服。"
        type: spoken
      - speaker: CHAR-001
        text: "是可以穿在身上的山河。"
        type: inner

