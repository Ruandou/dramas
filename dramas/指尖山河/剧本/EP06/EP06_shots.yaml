        text: "你奶奶的小婆婆——就是你太奶奶——活着的时候我叫她苏家婆婆。她不识字——但认得针法。你奶奶的针法——是她教的。再往上——我也不晓得了。只知道苏家在这村子住了两百年——每一代都有一个女人守着这门手艺。"
