      - {speaker: CHAR-001, text: "是。墙上的——樟木箱里的——床底下的——全部都是。", type: spoken}
      - {speaker: CHAR-002, text: "——天哪。", type: spoken}

  - shot_id: EP08-S04
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "——光影绣。用丝线角度控制反光方向。山体——至少七种绿色——每一种的入针角度都不一样。从左边看山是翠绿的——从右边看山是深绿的。这是——这是巴黎工坊最顶级的技术——他们说这是法国人十九世纪发明的——", type: spoken}
      - {speaker: CHAR-001, text: "——奶奶二十年前就会了。用肉眼。一个人。在云溪村。", type: spoken}
      - {speaker: CHAR-002, text: "——你三天前就知道了。", type: spoken}
      - {speaker: CHAR-001, text: "是。但你是第一个——不需要我解释就能看懂的人。", type: spoken}

  - shot_id: EP08-S05
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: medium
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "今早你问图谱——这就是。", type: spoken}
      - {speaker: CHAR-002, text: "——我可以——", type: spoken}
      - {speaker: CHAR-001, text: "你等了三个小时——不是为了在门口站着。", type: spoken}
      - {speaker: CHAR-002, text: "针——下——有——山——河。线——里——藏——日——月——", type: spoken}
      - {speaker: CHAR-002, text: "——这笔迹——不是清代的。是唐代的——至少是宋代的。我在敦煌文献里见过类似的字体——唐代写经体——", type: spoken}

  - shot_id: EP08-S06
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "——层云针——五层叠加——入针角度从六十五度递减到二十五度——丝线捻数随层递增——这是织物厚度渐进式控制——现代纺织工程叫gradient density weaving——公认是二十世纪六十年代日本发明的——", type: spoken}
      - {speaker: CHAR-002, text: "——你知道这本绣谱——如果被证实年代——会改写多少本教科书吗。中国的——日本的——法国的——全部要改。你奶奶——她不是在保存一门手艺。她是在保存一段被抹掉的——人类文明史。", type: spoken}

  - shot_id: EP08-S07
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "——苏门沈氏——嘉庆二十三年——这是文献记载中最后一位山河针法传人。她嫁进了苏家——学会了山河针法——但她没有女儿——也没有收徒。她死后——所有文献都不再提到山河针法。", type: spoken}
      - {speaker: CHAR-002, text: "学界认为传承链在嘉庆二十三年——公元1818年——彻底断了。到现在——二百零八年。", type: spoken}
      - {speaker: CHAR-001, text: "——但我奶奶会。", type: spoken}
      - {speaker: CHAR-002, text: "——这意味着——传承链没有断。这二百年里——苏家的每一代女人——都在秘密地传。没有文献——没有记录——没有外人知道。她们把一套完整的唐代技术体系——靠一针一线——靠一本手抄绣谱——靠口传心授——保存了十代人。", type: spoken}

  - shot_id: EP08-S08
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "——十代人。两百年。没有一个人——把它拿出去换钱。没有一个人——告诉过外面。", type: spoken}
      - {speaker: CHAR-002, text: "因为她们知道——一旦被外面知道——它就不再属于苏家了。它会被拿走——被研究——被展示——但不会再有人——像她们那样——用一辈子去绣一只蝴蝶。", type: spoken}
      - {speaker: CHAR-001, text: "——奶奶绣到睡着——手还放在绣绷上。陈婶说——她是在等我回来。", type: spoken}

  - shot_id: EP08-S09
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: medium
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "苏锦——我必须告诉你一件事。今早我给老师打了电话。他是中国非遗保护中心的专家。他听到山河针法四个字——沉默了十秒钟。然后他说——如果是真的——这是今年非遗领域最重大的发现。", type: spoken}
      - {speaker: CHAR-002, text: "——但他说了一句话——让我从早上犹豫到现在。", type: spoken}
      - {speaker: CHAR-001, text: "——什么话。", type: spoken}

  - shot_id: EP08-S10
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "他说——山河针法如果被证实——不可能留在个人手里。它的价值——不是金钱可以衡量的。它属于全人类的文化遗产。按照现行非遗保护法——具有重大历史价值的文物级传承物——应当由国家级博物馆或研究机构统一保护。", type: spoken}
      - {speaker: CHAR-001, text: "——你是说——我奶奶留给我的东西——应该交给博物馆。", type: spoken}
      - {speaker: CHAR-002, text: "我不是这个意思——我只是传达老师的意见。我个人——", type: spoken}
      - {speaker: CHAR-001, text: "你个人什么。你研究它十年——你当然希望它进博物馆。这样你就能天天研究——发论文——开学术会议——你找它十年——现在找到了——下一步就是把它变成你的成果。对吗——顾教授。", type: spoken}

  - shot_id: EP08-S11
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: medium
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-002, text: "——你说得对。我确实想研究它。我找了它十年——如果我说我不想——那是撒谎。", type: spoken}
      - {speaker: CHAR-002, text: "但你说错了一件事。", type: spoken}
      - {speaker: CHAR-001, text: "什么。", type: spoken}
      - {speaker: CHAR-002, text: "我不是为了把它变成我的成果。我是为了——它不应该被忘记。你奶奶——她不应该被忘记。如果它进了博物馆——每天有几百人看到它——他们至少知道——在徽州——有一个姓苏的老太太——用了一辈子——做了一件人类做不到的事。", type: spoken}

  - shot_id: EP08-S12
    scene: SCENE-002
    characters: [CHAR-001, CHAR-002]
    looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "——他把我的名字——写在了传承谱系上。在断了二百零八年的线下面。铅笔写的——很轻——好像他自己也不确定。", type: inner}
      - {speaker: CHAR-001, text: "他确定。他等了三个小时——就是为了确定。他研究了十年——翻遍了所有方志——画了这张图——然后在最底下——用铅笔——写了一个只认识了四个小时的人的名字。", type: inner}

  - shot_id: EP08-S13
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "山河针法。山河针法。山河针法——他写了一整页。不同大小——不同笔迹——像是十年里每次想到它都会写一遍。", type: inner}
      - {speaker: CHAR-001, text: "他不是来拿的。他是来找的。找了十年——找到了——然后我把他赶出去了。", type: inner}

  - shot_id: EP08-S14
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "——八年前。八年前他就注意到了奶奶。那时候我还在伦敦——在学法国人发明的东西。而他在找奶奶。", type: inner}
      - {speaker: CHAR-001, text: "奶奶没有去领奖。她大概觉得——去了就要说话——说话就要解释——解释了就会有人来。所以她不去。她宁愿让所有人以为——云溪村只有一个会绣花的老太太。", type: inner}

  - shot_id: EP08-S15
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: wide
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "——", type: spoken}
      - {speaker: CHAR-001, text: "——顾言深——", type: spoken}
      - {speaker: CHAR-001, text: "——走了。三个小时没等到我回来——现在十分钟就走了。", type: inner}

  - shot_id: EP08-S16
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "他在传承谱系上写了我的名字。但他没有问过我——愿不愿意。", type: inner}
      - {speaker: CHAR-001, text: "奶奶等了十年——等我回来。不是等我来继承——是等我来决定。她给了我绣谱——给了我老宅——给了我这满墙的针线——然后走了。她把选择留给了我。她没有逼我接过这根线——她只是在等我——想清楚。", type: inner}

  - shot_id: EP08-S17
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: wide
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "他说——不是保存。是不被忘记。奶奶不怕被忘记——她绣了一辈子——没有人知道——她也不在乎。但我不一样——我是设计师。设计师最怕的——就是自己的东西没有人看到。", type: inner}
      - {speaker: CHAR-001, text: "我可以选择——把绣谱锁回樟木箱——就像苏家十代女人做的那样。传媳妇不传女儿——秘密地——安静地——直到下一个人。", type: inner}

  - shot_id: EP08-S18
    scene: SCENE-002
    characters: [CHAR-001]
    looks: {CHAR-001: CHAR-001-L01}
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - {speaker: CHAR-001, text: "奶奶——你在扉页上写了八个字。现在我要在这后面加一行。", type: inner}
      - {speaker: CHAR-001, text: "山河针法——第十一代传人——待定。不是拒绝——是没有想清楚。给我一点时间——让我想清楚——这条路——到底通向哪里。", type: inner}
    overlay: "等待——是最深的传承"
