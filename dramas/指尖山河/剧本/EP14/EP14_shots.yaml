shots:
  - {shot_id: EP14-S01, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "这把椅子——奶奶坐了几十年——木头都被她的身体磨出了形状。现在我坐下去——刚好——像量身定做的。不是量身定做——是她替我坐好的——她知道有一天——会有人坐在这里——开始绣第一针。", type: inner}, {speaker: CHAR-001, text: "第一针——苏锦——你做了十年设计师——画过几千张设计图——但你没有绣过一针——从来没有——", type: inner}}]}
  - {shot_id: EP14-S02, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——Gareth Pugh的走秀礼服——我一天能画二十张图——打版一次就过。穿针——十分钟——打个结——五次——", type: spoken}, {speaker: CHAR-001, text: "——OK——苏锦——忘掉你会的——学你不会的。从零开始——像奶奶——像第一代绣娘——像每一个在这间屋子里坐过的女人——从第一针——开始——", type: inner}}]}
  - {shot_id: EP14-S03, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——三十七度——我量的——明明量的——手一用力——角度就变了——不是铅笔——不是鼠标——是针——", type: spoken}, {speaker: CHAR-001, text: "——十年——我在纸上设计了几百件衣服——从来没想过——针——比铅笔重——比尺子滑——比剪刀更——不可控——", type: inner}}]}
  - {shot_id: EP14-S04, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——我画过最复杂的立裁结构——算过零点五毫米的缝份——设计过不对称剪裁——拿过最佳新人奖——", type: spoken}, {speaker: CHAR-001, text: "——但这些——在这根针面前——一文不值。设计是创造——刺绣是服从——服从丝线——服从丝绸——服从一千两百年不变的规矩——", type: inner}}]}
  - {shot_id: EP14-S05, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——太用力了——锦丫头。你的手——捏针像捏钢笔——设计师的手——不是绣娘的手。", type: spoken}, {speaker: CHAR-001, text: "——那我应该怎么捏——", type: spoken}, {speaker: CHAR-GRP-08, text: "——捏针——要像捏一只蝴蝶——不能太紧——太紧捏死——不能太松——太松飞走。你奶奶说的——「针下手感如流水——不急不缓——不轻不重——」", type: spoken}}]}
  - {shot_id: EP14-S06, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——你看我的手——", type: spoken}, {speaker: CHAR-GRP-08, text: "——每一个针眼——都是一针。七十年——几百万针。你奶奶的手——比我还多——针眼连成了线——线连成了茧——茧——就是山河针法的地图。", type: spoken}, {speaker: CHAR-001, text: "——陈婶——我可以——", type: spoken}, {speaker: CHAR-GRP-08, text: "——你不是在问——你是在怕。怕疼——怕不好看——怕三个月后——交不出东西。你奶奶第一次坐在这把椅子上——也怕——绣了一个月——线还是歪的——针还是扎手的。但她没停——你也不能停。", type: spoken}}]}
  - {shot_id: EP14-S07, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——对了——这次对了——", type: spoken}, {speaker: CHAR-GRP-08, text: "——嗯——盘云针——第一针——方向对——角度对——密度可以再紧一点——但第一针——够了。再来——", type: spoken}, {speaker: CHAR-001, text: "——好——再来——", type: spoken}}]}
  - {shot_id: EP14-S08, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——这种节奏——吸气——入针——呼气——拉线——和跑步不一样——和画图不一样——像弹钢琴——但更慢——更安静——每一个动作——都要求你——活在当下——活在这一针里——不能想下一针——不能想昨天——不能想三个月后——只有这一针——这一秒——", type: inner}}]}
  - {shot_id: EP14-S09, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——每一个绣娘——第一针——都会扎手。你奶奶——第一针扎在拇指上——血滴在她第一幅绣品上——那幅蝴蝶——翅膀上的红色——就是她的血染的。", type: spoken}, {speaker: CHAR-001, text: "——那我不洗——奶奶用血染了蝴蝶翅膀——我用血——绣一片枫叶——秋天——是开始的季节。", type: spoken}}]}
  - {shot_id: EP14-S10, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——你奶奶说得对——你像她。不是手像——是你的心像。她也是——在错误里找对的——在坏的里面找好的——在山河针法失传的绝望里——教出了村里最后一个会双面全同的人。", type: spoken}, {speaker: CHAR-001, text: "——谁——", type: spoken}, {speaker: CHAR-GRP-08, text: "——我。你奶奶教了我十年——没让我入门十二式——但双面全同——我会。", type: spoken}, {speaker: CHAR-001, text: "——陈婶——教我——不只是入门十二式——教我——你的手——你的节奏——你七十年绣花的——秘密——", type: spoken}, {speaker: CHAR-GRP-08, text: "——好。但你要答应我——不要因为三个月——就赶工——一针是一针——", type: spoken}}]}
  - {shot_id: EP14-S11, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——盘云针——是山河针法的地基。十二式——每一式都是从盘云针里生出来的。你奶奶说过——盘云针练不好——后面十一式——越练越歪——越练越远——最后一根线——断了——就再也接不回来。", type: spoken}, {speaker: CHAR-001, text: "——我奶奶练了多久——才练好盘云针——", type: spoken}, {speaker: CHAR-GRP-08, text: "——三年——每天五个小时。她不是天赋最好的人——但她是最不肯停的人。你在壁画上看到的那个第一代绣娘——她也不是天赋最好的——是战乱逼着她——除了绣——她没有别的活法。你——有退路——可以回上海——这就是你的挑战——不是因为你不努力——是因为你随时可以走。", type: spoken}}]}
  - {shot_id: EP14-S12, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——在上海的时候——我的老师说过一句话——「最好的设计师——不是最有创意的——是最能把想法执行出来的人。」我以为我懂了——直到今天——我发现——我从来没懂过——", type: spoken}, {speaker: CHAR-GRP-08, text: "——现在懂了——", type: spoken}, {speaker: CHAR-001, text: "——现在懂了。执行力不是加班——不是改稿——不是熬夜——是——手指捏住针——扎下去——拉出来——一千次——一万次——十万次——直到针认识你——直到丝线认识你——直到白绢认识你——", type: spoken}}]}
  - {shot_id: EP14-S13, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——太阳下山了——但我不能停。石壁上的字——三年——但不是三年——是九十个黄昏——减去今天——还有八十九个。奶奶用了三年——她可以不急——但我只有三个月——我必须——比所有人都快——", type: inner}, {speaker: CHAR-001, text: "——快——但不能乱。陈婶说得对——一针是一针——赶工绣出来的东西——一眼就能看穿——针脚会出卖你——间距会出卖你——观众不需要是专家——他们的眼睛——会感觉到——不诚实——", type: inner}}]}
  - {shot_id: EP14-S14, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——五点——我从下午三点坐到现在——四个小时——绣了——大概——两百针。陈婶三十分钟绣了一百针——奶奶可能更快——顾言深说奶奶的手速是正常绣娘的三倍——", type: inner}, {speaker: CHAR-001, text: "——两百针——连盘云针的第一段都算不上——只是一道练习题。三个月——如果这个速度——连一件最小的绣品都完不成——更不用说什么——山河——", type: inner}, {speaker: CHAR-001, text: "——好——盘云针——你是我第一个人生对手——", type: spoken}}]}
  - {shot_id: EP14-S15, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——吃饭——手都紫了——再绣——明天抬不起来——", type: spoken}, {speaker: CHAR-001, text: "——陈婶——你觉得——我能在三个月内——学会入门十二式吗——", type: spoken}, {speaker: CHAR-GRP-08, text: "——我觉得——会与不会——不在三个月——在你。你奶奶学了三年才通十二式——但你是你奶奶的孙女——你有她一半的速度——就是一年半——你没有——所以你的时间——不够。", type: spoken}, {speaker: CHAR-GRP-08, text: "——但锦丫头——我告诉你一件事。你不需要通十二式才能绣山河。山河针法的核心——不是十二式——是「山河」两个字——是你的心——你的眼睛——你的手——和这座山——这条溪——这个村——之间的——关系。十二式是工具——山河——是你的命。", type: spoken}}]}
  - {shot_id: EP14-S16, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——山河——不是十二式。山河——是外面的山——是月光下的轮廓——是奶奶绣了一辈子的——那座山——", type: inner}, {speaker: CHAR-001, text: "——盘云针第一段——不是图解——是山——是我看到的山——是奶奶看到的山——是第一代绣娘——从长安逃出来——在云溪村看到的山。她绣的不是技法——是她失去的家乡——和她找到的家乡——在针下面——变成了同一个地方——", type: inner}}]}
  - {shot_id: EP14-S17, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——深夜的云溪村——安静得像在时间之外。没有车声——没有人声——没有手机振动——只有我的针——穿过丝绸——沙——沙——沙——和一千两百年前——第一代绣娘——在这片竹林边上——听到的声音——一样——", type: inner}, {speaker: CHAR-001, text: "——今天——第一针——明天——第十针——一百针——一万针——三个月后的今天——凌晨——如果我还在绣——白绢上——会有什么——", type: inner}}]}
  - {shot_id: EP14-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——八百针——一天——奶奶第一天——几针——不知道——她没写——她只在石壁上写了「1973春来此见碑得针」——没写第一针扎了哪根手指——没写绣了多久才睡着——", type: inner}, {speaker: CHAR-001, text: "——但我知道——她和我一样——第一天的深夜——手指是疼的——心是满的——外面的山——是黑的——但绣架上的山——正在一针一针地——亮起来——", type: inner}}]}