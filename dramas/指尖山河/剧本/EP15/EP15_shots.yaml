shots:
  - {shot_id: EP15-S01, scene: SCENE-004, characters: [CHAR-010, CHAR-GRP-06, CHAR-GRP-07, CHAR-GRP-08], looks: {CHAR-010: CHAR-010-L01, CHAR-GRP-06: CHAR-GRP-06-L01, CHAR-GRP-07: CHAR-GRP-07-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-06-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-07-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——县城牌照——来找谁的——", type: spoken}, {speaker: CHAR-GRP-06, text: "——肯定是找苏锦丫头的——自从那个戴眼镜的先生在村里住了好几天——外面都知道咱村有东西——", type: spoken}, {speaker: CHAR-010, text: "——老哥——打听一下——苏锦苏小姐住哪——我是县城来的——找她谈点事——", type: spoken}}]}
  - {shot_id: EP15-S02, scene: SCENE-004, characters: [CHAR-010, CHAR-GRP-08], looks: {CHAR-010: CHAR-010-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——我去看看——这个人的笑——不对——", type: spoken}, {speaker: CHAR-GRP-07, text: "——不会吧——人家是开好车来的——说不定是苏锦在上海认识的人——", type: spoken}, {speaker: CHAR-GRP-08, text: "——苏锦在上海认识的人——都穿歪跟鞋——不穿皮鞋——", type: spoken}}]}
  - {shot_id: EP15-S03, scene: SCENE-002, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——苏小姐——久仰久仰——我叫周明远——云溪文旅开发公司的——", type: spoken}, {speaker: CHAR-010, text: "——这是我的名片——", type: spoken}, {speaker: CHAR-001, text: "——周先生——我不记得我们约过时间——你怎么知道我在这里——", type: spoken}, {speaker: CHAR-010, text: "——哎呀——云溪村不大——问两个人就知道了——苏小姐现在是名人了——整个县城——都听说后山发现了——", type: spoken}}]}
  - {shot_id: EP15-S04, scene: SCENE-002, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——周先生——后山的事情——跟你有什么关系——", type: spoken}, {speaker: CHAR-010, text: "——有关系——有大关系。苏小姐——你在竹林里发现了一个唐代遗址——壁画——碑文——这对云溪村——对全县——都是天大的好事。我是搞文旅开发的——对这种资源——非常——感兴趣——", type: spoken}, {speaker: CHAR-001, text: "——谁告诉你竹林里的事——", type: spoken}}]}
  - {shot_id: EP15-S05, scene: SCENE-002, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——苏小姐——这老宅——是奶奶留给你的——产权清晰吗——", type: spoken}, {speaker: CHAR-001, text: "——周先生——你还没回答我的问题。竹林里的事——消息传得这么快——源头是谁——", type: spoken}, {speaker: CHAR-010, text: "——苏小姐——你在上海做设计师的——你应该明白——在这个圈子——消息不是传的——是流动的——只要有一个人知道——就会有更多人知道。戴眼镜的那位顾教授——他在县城住过一晚——在招待所里打了几个电话——问了几个老朋友——", type: spoken}}]}
  - {shot_id: EP15-S06, scene: SCENE-002, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——苏小姐——我不绕弯子。唐代遗址——壁画——碑文——这是省级文保单位的料——但申报——需要钱——需要关系——需要时间。我知道你一个人——在上海的公司垮了——在村里三个月——要绣一件作品——还要守着一个唐代遗址——你扛不住的——", type: spoken}, {speaker: CHAR-010, text: "——我有个提议——你把竹林那块地——和遗址的——怎么说——「合作开发权」——签给我——我帮你跑批文——帮你找专家——帮你做宣传——三年——不——最多两年——云溪村就是第二个宏村——第二个西递——你苏锦——就是云溪村的——文化——符号——", type: spoken}, {speaker: CHAR-001, text: "——你刚才说——「合作开发权」——这块地的产权——在村委会——不在我。你来找我——说明你早就查过了——产权虽然不在我——但遗址的发现权——在我——对吗——", type: spoken}}]}
  - {shot_id: EP15-S07, scene: SCENE-002, characters: [CHAR-001, CHAR-010, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——锦丫头——昨晚上绣到几点——手上的针眼还疼不疼——", type: spoken}, {speaker: CHAR-001, text: "——一点——不太疼了——今天早上又绣了五十针——比昨天好——", type: spoken}, {speaker: CHAR-GRP-08, text: "——这位——周先生——是吧。锦丫头三个月内要绣一件作品——很忙——你有什么事——跟我说——我能做主——", type: spoken}, {speaker: CHAR-010, text: "——婶子——我是来帮忙的——真的——我带了方案——你听听——", type: spoken}}]}
  - {shot_id: EP15-S08, scene: SCENE-002, characters: [CHAR-001, CHAR-010, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——后山竹林——包括遗址——总共八十亩——我已经跟镇里打过招呼了——只要文物局认定遗址价值——政府会配合——", type: spoken}, {speaker: CHAR-010, text: "——苏小姐——你的发现权——值——三百万。", type: spoken}, {speaker: CHAR-010, text: "——三百万——你签个字——拿走——回上海——东山再起——没人知道——你在这里绣了三个月的花——没人知道——锦绣工作室——是怎么倒的——你带着三百万回去——一切——重新开始——", type: spoken}, {speaker: CHAR-001, text: "——三百万——买山河针法的源头——买我奶奶的壁画——买第一代绣娘的碑文——周先生——你给的价格——很高——但你买的东西——不卖——", type: spoken}}]}
  - {shot_id: EP15-S09, scene: SCENE-002, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——苏小姐——你确定——你不考虑——", type: spoken}, {speaker: CHAR-010, text: "——如果是我来找你谈——那说明——县里——已经知道了这件事。文化遗产——不是私人财产——是公共资源——你发现的——不代表——你说了算。", type: spoken}, {speaker: CHAR-010, text: "——我给你三天时间——考虑。三天之后——如果你还是这个态度——那么来找你的人——就不是我了——是县文物局——是国土局——是联合调查组——他们有公章——有文件——有比你更大的——权力——", type: spoken}, {speaker: CHAR-001, text: "——周先生——你在威胁我——", type: spoken}}]}
  - {shot_id: EP15-S10, scene: SCENE-002, characters: [CHAR-001, CHAR-010, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-010, text: "——威胁——苏小姐——我是一个商人——商人——不讲威胁——讲——利益分配。三百万——是分给你的比例。如果你不签字——利益要重新分配——到时候——分配给你的——可能是——零。", type: spoken}, {speaker: CHAR-010, text: "——哦——对了——你们村里——村委会——对这八十亩地——也很感兴趣。村长——陈大伯——对吧——他已经答应下周开村民大会讨论这件事。苏小姐——民主——是多数人的决定——不是你的决定。", type: spoken}}]}
  - {shot_id: EP15-S11, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——他说的陈大伯——是村长——你见过——就是上次在榕树下——说你是「外面来的人」——那个。锦丫头——他有句话说对了——这不是你一个人的事——村委会——村民——县里——很快就都会知道——", type: spoken}, {speaker: CHAR-001, text: "——陈婶——我做设计师的时候——见过这种人——品牌的——渠道的——投资的——他们说的话都一样——不是「帮助」——是「收购」。帮助——是平等的——收购——是把你变成——一个数字——在他们的报表里——", type: spoken}, {speaker: CHAR-001, text: "——三百万——他以为——山河针法——和上海那些等着被并购的小设计师品牌一样——价格合适就可以拿走的——他错了——山河针法——不是商品——是遗产——遗产的定价权——不在他手里——在我手里——在苏家——十代人的手里——", type: spoken}}]}
  - {shot_id: EP15-S12, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——锦丫头——你看——", type: spoken}, {speaker: CHAR-GRP-08, text: "——昨天——你手指上——一个针眼——今天——三个——明天——十个——三个月后——满手茧——这就是你的铠甲。周明远没有——他只靠公章——文件——关系——他以为——这些东西——能打开任何一扇门。但他不懂——你手里的这根针——能绣出山河——你怕他——一个卖旅游纪念品的——", type: spoken}, {speaker: CHAR-001, text: "——陈婶——你说得对——我怕什么——我是一个——能用一根针——绣出山河的女人——", type: spoken}}]}
  - {shot_id: EP15-S13, scene: SCENE-002, characters: [CHAR-001, CHAR-002, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-002, text: "——周明远——云溪文旅——他是县城最大的文旅开发商——但背景不是文旅——是土地整理。他买过三个古村——全部变成了度假酒店——原著居民——搬走了——", type: spoken}, {speaker: CHAR-001, text: "——他刚走——出价三百万——买我的发现权——", type: spoken}, {speaker: CHAR-002, text: "——是我的错——我在县城招待所打了一个电话——给我的导师——问他关于唐代民间织绣遗址的文献——我没想到——消息会这么快传到开发商那里——", type: spoken}, {speaker: CHAR-001, text: "——不是你的错——早晚会有人知道。竹林里的壁画——不可能藏一辈子。问题是——现在怎么应对——", type: spoken}, {speaker: CHAR-002, text: "——有办法——但需要——让遗址的价值——从「商业的」——变成「学术的」——如果省文物局认定它为省级文保单位——那开发商就动不了它——", type: spoken}}]}
  - {shot_id: EP15-S14, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——你是说——我们要在周明远拿到批文之前——让文物局——先认定遗址的价值——", type: spoken}, {speaker: CHAR-002, text: "——对——但需要证据——碳十四鉴定——碑文拓片——壁画高清照片——学术论文——这套流程——正常三个月——但如果有省里的专家背书——可以压缩到——两周——", type: spoken}, {speaker: CHAR-001, text: "——两周——我还有不到十周的时间绣山河——在这十周里——我还要——抢在开发商前面——给遗址——办一张——出生证——", type: spoken}, {speaker: CHAR-002, text: "——我可以联系省文物局的老师——他退休了——但还有影响力——只要他看到壁画照片——一定会来——", type: spoken}, {speaker: CHAR-001, text: "——那你去——现在就去——趁周明远还在等我的「三天」——", type: spoken}}]}
  - {shot_id: EP15-S15, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——三天——他给我的期限——不是用来考虑的——是用来准备的。他想让我在恐惧里犹豫——但恐惧——对我没用——我在上海经历过比这更糟的——一夜之间——十年心血变成泡沫——那种痛——比公章——比文件——比三百万的诱惑——更重——更真实——", type: inner}, {speaker: CHAR-001, text: "——他要在村民大会上——让村里人投票——决定遗址的未来。好——那就投票——我会让村里人——看到一个不一样的苏锦——不是一个外面来的设计师——是一个——坐在绣架前——手指扎满针眼——也不停的——苏家女人——", type: inner}}]}
  - {shot_id: EP15-S16, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——第一——顾言深去省城——争取文物局支持——至少两周——", type: spoken}, {speaker: CHAR-001, text: "——第二——村民大会——陈大伯站在周明远那边——但村民——不一定——他们看着奶奶绣了一辈子——他们知道——山河针法——不是旅游项目——是他们的记忆——", type: spoken}, {speaker: CHAR-001, text: "——第三——三个月之约——不会因为周明远而改变。他想要遗址——我想要山河针法——他要钱——我要时间——我们是在抢——同一个东西——不是土地——不是产权——是速度——", type: spoken}}]}
  - {shot_id: EP15-S17, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-GRP-08, text: "——锦丫头——你找到节奏了——", type: spoken}, {speaker: CHAR-001, text: "——不是我找到节奏——是它找到我了。针——昨天是我的敌人——今天——是我的战友。我和针——一起——对付周明远——", type: spoken}, {speaker: CHAR-GRP-08, text: "——村民大会——你不用担心——村里的大多数人——你奶奶帮过——你奶奶走的那年——村里三十八户——每一户——墙上都挂着你奶奶送的绣品——那是情分——是几十年的情分——周明远——再有钱——买不到情分——", type: spoken}, {speaker: CHAR-001, text: "——那就好——陈婶——等大会那天——我会让所有人看到——他们奶奶的孙女——不是来拿东西的——是来还情分的——", type: spoken}}]}
  - {shot_id: EP15-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——周明远——三天——我等你。你要村民大会——我给你村民大会。你想要山河针法的源头——可以——但你得先过我这关——", type: spoken}, {speaker: CHAR-001, text: "——针下有山河——山河——不卖——", type: spoken}}]}