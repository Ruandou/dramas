shots:
  - {shot_id: EP43-S01, scene: SCENE-004, characters: ["CHAR-007", "CHAR-001", "CHAR-008"], looks: {"CHAR-007": "CHAR-007-L01", "CHAR-001": "CHAR-001-L01", "CHAR-008": "CHAR-008-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png"], dialogue: [{"speaker": "CHAR-007", "text": "苏锦——！巴黎——怎么样——！法国人——有没有——被——山河——针法——震住——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "震住了——陈伯——不但——震住了——还——签了——合同——梵华集团——要和——我们——出——联名——系列", "type": "spoken"}]}
  - {shot_id: EP43-S02, scene: SCENE-004, characters: ["CHAR-008", "CHAR-001"], looks: {"CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "国际——奢侈——品牌——？！我们——绣——的——东西——要——卖——到——国外——去了——？我们的——针脚——还——不——太——整齐——呢——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "阿芳嫂——合同里——写了——至少一半——生产——由——云溪村——绣娘——完成——你们——每个人——都会——参与", "type": "spoken"}]}
  - {shot_id: EP43-S03, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——中国非遗保护中心——正式批复——山河针法——列入——国家级非物质文化遗产——预备名录——最快半年——最慢两年——正式成为——国家级非遗", "type": "spoken"}, {"speaker": "CHAR-001", "text": "国家级——非遗——顾教授——这——比省级——又进了一步", "type": "spoken"}]}
  - {shot_id: EP43-S04, scene: SCENE-003, characters: ["CHAR-001", "CHAR-002"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-002": "CHAR-002-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "奶奶——如果知道——一定——会去——后山——给祖宗——上香——这是——苏家——四十八代人——从来没有——得到过的——认可", "type": "spoken"}, {"speaker": "CHAR-002", "text": "那你应该——替她——上那柱香", "type": "spoken"}, {"speaker": "CHAR-001", "text": "会的——明天就去", "type": "spoken"}]}
  - {shot_id: EP43-S05, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "梵华的——正式合同——也到了——全部——按照——你的——三个条件——标注云溪村山河针法——利润百分之三十归传习所合作社——一半生产由本村绣娘完成——苏锦——你做到了——国际奢侈品牌——第一次——完全接受——合作方——的所有条件", "type": "spoken"}, {"speaker": "CHAR-001", "text": "不是我做到了——是山河针法做到了——他们——不是——在跟我谈判——是在跟——一千两百年谈判——跟时间谈判——没人能赢", "type": "spoken"}]}
  - {shot_id: EP43-S06, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "顾教授——你知道——我在——签字的时候——想到了——什么——想到了——四个月前——在上海——我在解约协议上——签字——那天——我的手——一直在抖——今天——我的手——很稳——因为——上次——我签的是——放弃——这次——我签的是——开始", "type": "spoken"}]}
  - {shot_id: EP43-S07, scene: SCENE-011, characters: ["CHAR-001", "CHAR-008"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-008": "CHAR-008-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "苏锦——你看——小禾——的——蝴蝶——！她才——学了——一个——月——！已经——比——我——学了——两年——的——还好——了——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "小禾——你——有——天赋——但——天赋——只是——起点——后面——的路——需要——时间——和——耐心——就像——山河针法——一千两百年——靠的——不是——天赋——是——一代——一代——人不——停——地——绣", "type": "spoken"}]}
  - {shot_id: EP43-S08, scene: SCENE-011, characters: ["CHAR-009", "CHAR-001"], looks: {"CHAR-009": "CHAR-009-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-009-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "小兰——问——她——什么时候——可以——教——别人——小兰——你现在——就可以——你——的——缠针——已经——比——我——还——稳——了——从下周——开始——你——负责——教——新——来的——学员——第一式——直针——你是——传习所——的——第二位——老师——了—— （小兰——先是——愣住了——然后——眼泪——掉——下来——用手语——比了——一个字）", "type": "spoken"}]}
  - {shot_id: EP43-S09, scene: SCENE-011, characters: ["CHAR-001", "CHAR-008"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-008": "CHAR-008-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "各位——有一个消息——国际品牌梵华——要和我们合作——联名系列——这意味着——你们绣的东西——会被放到巴黎、纽约、东京的旗舰店里——全世界的人都会看到——你们准备好了吗", "type": "spoken"}, {"speaker": "CHAR-008", "text": "准备好了——！苏锦——我们——虽然——针脚——不——如——你——但我们——有心——！你——教——我们——什么——我们——就——绣——什么——！绝——不——给你——丢人——！", "type": "spoken"}]}
  - {shot_id: EP43-S10, scene: SCENE-011, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "好——那——从明天——开始——每天——增加——两个——小时——的——训练——我会——亲自——带——你们——练习——梵华——的——设计——团队——下周——就到——我们要——让——他们——看到——云溪村——的——绣娘——不需要——任何——机器——也能——做出——世界——一流——的——作品——因为——我们的——机器——在这里——（举起——针）——和——这里——（指——胸口）", "type": "spoken"}]}
  - {shot_id: EP43-S11, scene: SCENE-004, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "奶奶——三件事——巴黎展出了山河针法——法国人从没见过这样的针法——国家级非遗预备名录通过了——梵华合同签了——全部条件——都是我提的——他们全部接受了", "type": "spoken"}]}
  - {shot_id: EP43-S12, scene: SCENE-004, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 特写, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "奶奶——这是我绣的第一件东西——你看——多丑——但你一定会说——「丑怕什么——继续绣就是了」——我会继续绣的——不只绣完山河白绢——还要绣好联名系列——绣好传习所——绣好山河针法的未来", "type": "spoken"}]}
  - {shot_id: EP43-S13, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——义乌YX织造厂——被吊销营业执照——罚款——五十万——周明远的明远商贸——因侵犯知识产权和不正当竞争——被责令停止侵权行为——赔偿云溪绣坊合作社——经济损失——二十万元——并公开道歉", "type": "spoken"}, {"speaker": "CHAR-001", "text": "二十万——比他——卖——十九块九——手机壳——赚的——还多——吗", "type": "spoken"}, {"speaker": "CHAR-002", "text": "应该——差不多——他——这一波——白干了——还——搭上了——公司——的名声", "type": "spoken"}]}
  - {shot_id: EP43-S14, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "这笔赔偿——全部——放进——传习所的——运营——基金——顾教授——周明远的——事——到此——为止——了——我不——想——再——在他——身上——浪费——任何——精力——因为——有——更——重要——的——事情——等着——我们——梵华——的——团队——下周——到——山河——白绢——还有——最后——一片——山——没——绣——完", "type": "spoken"}, {"speaker": "CHAR-002", "text": "你——真的——不——恨他——吗", "type": "spoken"}, {"speaker": "CHAR-001", "text": "恨——过——但——恨——太——重——了——背着——恨——走路——太——累——我——现在——需要——轻装——上路——因为——前面——还有——很——远——的——路——要——走", "type": "spoken"}]}
  - {shot_id: EP43-S15, scene: SCENE-011, characters: ["CHAR-007", "CHAR-001"], looks: {"CHAR-007": "CHAR-007-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-007", "text": "苏锦——！今天——是——三喜——临门——！巴黎——展览——成功——！国家级——非遗——名录——通过——！梵华——合同——签字——！我们——云溪村——从——来——没有——这么——风光——过——！来——干了——这——碗——米酒——！", "type": "spoken"}, {"speaker": "CHAR-001", "text": "陈伯——米酒——就不——喝了——明天——还要——训练——但我——想说——谢谢——谢谢——大家——这四个——月——没有——你们——山河——针法——走——不到——今天", "type": "spoken"}]}
  - {shot_id: EP43-S16, scene: SCENE-011, characters: ["CHAR-008", "CHAR-001"], looks: {"CHAR-008": "CHAR-008-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-008-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-008", "text": "苏锦——吃——这块——是我——蒸的——放了——红枣——甜的——你——太——辛苦——了——要多——吃——甜的", "type": "spoken"}, {"speaker": "CHAR-001", "text": "阿芳嫂——你——每次——都——让我——吃——甜的——我——都——胖了", "type": "spoken"}, {"speaker": "CHAR-008", "text": "胖——什么——胖——！你——比——回来——的——时候——还——瘦——了——！顾教授——你说——是不是——！", "type": "spoken"}, {"speaker": "CHAR-002", "text": "（在角落里——被点名——推了推眼镜——笑了）——是——瘦了——要多——吃——点", "type": "spoken"}]}
  - {shot_id: EP43-S17, scene: SCENE-003, characters: ["CHAR-001", "CHAR-002"], looks: {"CHAR-001": "CHAR-001-L01", "CHAR-002": "CHAR-002-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——梵华设计团队——下周到——他们要看——绣娘——怎么工作——然后——确定——联名系列——的设计——方案——你——准备好了吗", "type": "spoken"}, {"speaker": "CHAR-001", "text": "准备好了——顾教授——四个月前——我在上海——被赶出——发布会——觉得——这辈子——完了——今天——国际品牌——要来——云溪村——看我们绣花——命运——真的很奇怪——它把你——打到最低——其实——是在——给你助跑——蹲得够低——才跳得够高", "type": "spoken"}]}
  - {shot_id: EP43-S18, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 特写, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "山河白绢——最后阶段——梵华联名——设计阶段——传习所——第三个月——顾言深的表白——还没正式回答——这些事——像十二式针法——缠绕在一起——但不急——一件一件来——山河针法等了一千两百年——才等到今天——我才等了四个月——算什么", "type": "inner"}]}
