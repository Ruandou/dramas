shots:
  - {shot_id: EP16-S01, scene: SCENE-004, characters: [CHAR-007, CHAR-010], looks: {CHAR-007: CHAR-007-L01, CHAR-010: CHAR-010-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png], dialogue: [{speaker: CHAR-007, text: "——今天开个会——就一件事——后山竹林——县里周总——带来了一个开发计划——大家听听——", type: spoken}]}
  - {shot_id: EP16-S02, scene: SCENE-004, characters: [CHAR-007, CHAR-010, CHAR-GRP-08], looks: {CHAR-007: CHAR-007-L01, CHAR-010: CHAR-010-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-010, text: "——各位乡亲——云溪文旅——计划投资两千万——开发后山竹林——建一个——唐代绣坊主题公园——每年——预计——接待游客——二十万人——每户——每年分红——保守估计——五万——", type: spoken}]}
  - {shot_id: EP16-S03, scene: SCENE-004, characters: [CHAR-007, CHAR-010, CHAR-GRP-06], looks: {CHAR-007: CHAR-007-L01, CHAR-010: CHAR-010-L01, CHAR-GRP-06: CHAR-GRP-06-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-06-L01.png], dialogue: [{speaker: CHAR-GRP-06, text: "——五万——够我女儿一年学费了——", type: spoken}, {speaker: CHAR-007, text: "——大家听我说——后山那片竹林——荒了多少年了——除了竹子——什么都没有——苏锦丫头发现的那些石头——又不能吃——周总愿意投资——是看得起咱们村——", type: spoken}]}
  - {shot_id: EP16-S04, scene: SCENE-004, characters: [CHAR-001, CHAR-007], looks: {CHAR-001: CHAR-001-L01, CHAR-007: CHAR-007-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: [{speaker: CHAR-001, text: "——他说——除了竹子什么都没有——他不知道——那些石头上——刻着山河针法的十二式——刻着第一代绣娘的名字——刻着奶奶写的——锦儿生——那些石头——对他是零——对我是——一切——", type: inner}]}
  - {shot_id: EP16-S05, scene: SCENE-004, characters: [CHAR-001, CHAR-007, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-007: CHAR-007-L01, CHAR-010: CHAR-010-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png], dialogue: [{speaker: CHAR-001, text: "——各位叔叔婶婶——我叫苏锦——苏秀芝的孙女——你们大多数——认识我奶奶——但不认识我——我是三周前——第一次来云溪村的——我来的第一天——站在奶奶的老宅门口——", type: spoken}]}
  - {shot_id: EP16-S06, scene: SCENE-004, characters: [CHAR-001, CHAR-007], looks: {CHAR-001: CHAR-001-L01, CHAR-007: CHAR-007-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: [{speaker: CHAR-007, text: "——苏锦——今天是说开发的事——不是说你家的事——", type: spoken}, {speaker: CHAR-001, text: "——村长说得对——今天是说开发的事——但开发——不只是钱——是——你们住了几辈子的山——要变成什么样——", type: spoken}]}
  - {shot_id: EP16-S07, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-001, text: "——我奶奶——苏秀芝——绣了一辈子——你们每户——墙上——都挂着她的绣品——那是情分——她给你们绣——不要钱——只要你们喜欢——只要山河针法——有人记得——", type: spoken}, {speaker: CHAR-001, text: "——你们知道山河针法吗——双面全同——正面反面——针脚完全一样——失传了三百年——直到奶奶——在云溪村——重新绣了出来。竹林里那块石壁——上面刻的——就是山河针法的——源头——唐代——一千两百年——", type: spoken}, {speaker: CHAR-010, text: "——苏小姐说得好——正因为它珍贵——才应该开发——让更多人看到——", type: spoken}]}
  - {shot_id: EP16-S08, scene: SCENE-004, characters: [CHAR-001, CHAR-010], looks: {CHAR-001: CHAR-001-L01, CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png], dialogue: [{speaker: CHAR-001, text: "——周先生——你说开发——那我问你——你的主题公园——是建在遗址上面——还是遗址旁边——你的游客——是来看壁画——还是来坐缆车——你在其他三个古村——建了度假酒店——原著居民——搬到哪里去了——", type: spoken}, {speaker: CHAR-010, text: "——苏小姐——这是两码事——", type: spoken}]}
  - {shot_id: EP16-S09, scene: SCENE-004, characters: [CHAR-001, CHAR-007, CHAR-GRP-06], looks: {CHAR-001: CHAR-001-L01, CHAR-007: CHAR-007-L01, CHAR-GRP-06: CHAR-GRP-06-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-06-L01.png], dialogue: [{speaker: CHAR-007, text: "——够了——苏锦——你来村里才三周——你有什么资格——替全村人做决定——投票。按规矩——现场投票——同意和周总签约的——举手——", type: spoken}, {speaker: CHAR-007, text: "——举手——别怕——这是民主——", type: spoken}]}
  - {shot_id: EP16-S10, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "——你们——举手之前——想想你家的绣品——是谁绣的——", type: spoken}]}
  - {shot_id: EP16-S11, scene: SCENE-004, characters: [CHAR-GRP-08, CHAR-007], looks: {CHAR-GRP-08: CHAR-GRP-08-L01, CHAR-007: CHAR-007-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "——陈大伯——你当村长十二年——我从来不反对你——但今天——这件事——你不能替大家决定——", type: spoken}, {speaker: CHAR-007, text: "——陈婶——这是发展——村里不能永远这么穷——", type: spoken}, {speaker: CHAR-GRP-08, text: "——穷——跟卖——是两码事。你问问大家——五万块——拿一年——两年——三年——主题公园建好了——他们还会每年分五万给你吗——周总——你敢不敢把「每年」两个字——写在合同里——盖上你公司的章——", type: spoken}]}
  - {shot_id: EP16-S12, scene: SCENE-004, characters: [CHAR-010], looks: {CHAR-010: CHAR-010-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png], dialogue: [{speaker: CHAR-010, text: "——陈婶——合同细节——我们可以谈——但今天是表决——表决完了——再谈细节——", type: spoken}, {speaker: CHAR-GRP-08, text: "——先表决——再谈细节——周总——你当云溪村的人——都是傻子——", type: spoken}]}
  - {shot_id: EP16-S13, scene: SCENE-004, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——各位——我不说空话——我说事实。竹林里的遗址——顾教授已经去省城了——省文物局——会来认定——如果认定成功——云溪村——就是省级文物保护单位——政府拨款——修路——通电——建立非遗传承中心——不是主题公园——是真正的——文化遗产——", type: spoken}, {speaker: CHAR-001, text: "——开发——会有——但不是周总的开发——是我们自己的开发——是山河针法的开发——是你们——在座每一个人——都能参与——都能受益——能传给下一代的——开发——", type: spoken}]}
  - {shot_id: EP16-S14, scene: SCENE-004, characters: [CHAR-001, CHAR-007], looks: {CHAR-001: CHAR-001-L01, CHAR-007: CHAR-007-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: [{speaker: CHAR-007, text: "——政府拨款——苏锦——你说得轻巧——申请——批文——验收——三年都下不来——这三年——你给村民发钱吗——", type: spoken}, {speaker: CHAR-001, text: "——我——苏锦——在这三个月里——会用山河针法——绣出一件作品——三个月期限到的那一天——如果我的作品——被认可——我留在云溪村——建立一个真正的——非遗工作室——我带来的——不是三百万——是一千两百年——", type: spoken}]}
  - {shot_id: EP16-S15, scene: SCENE-004, characters: [CHAR-007], looks: {CHAR-007: CHAR-007-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: [{speaker: CHAR-007, text: "——好——重新表决——不同意跟周总签约的——举手——", type: spoken}]}
  - {shot_id: EP16-S16, scene: SCENE-004, characters: [CHAR-GRP-08, CHAR-001], looks: {CHAR-GRP-08: CHAR-GRP-08-L01, CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——这些手——举起来的——不是反对周明远——是选择了我——选择了奶奶——选择了山河针法——选择了——不卖——", type: inner}]}
  - {shot_id: EP16-S17, scene: SCENE-004, characters: [CHAR-010, CHAR-007], looks: {CHAR-010: CHAR-010-L01, CHAR-007: CHAR-007-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-010-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png], dialogue: []}
  - {shot_id: EP16-S18, scene: SCENE-004, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "——他还会回来的——下一次——带更多的人——更多的公章——更多的钱。你怕不怕——", type: spoken}, {speaker: CHAR-001, text: "——不怕。他有钱——我有针——他有权——我有山河——他以为他在跟一个设计师斗——他不知道——他在跟十代苏家女人——同时斗——", type: spoken}]}