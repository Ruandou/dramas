shots:
  - {shot_id: EP12-S01, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png], dialogue: [{speaker: CHAR-001, text: "封底——不平——像有什么夹在里面。奶奶从来没提过——绣谱里还有夹层。", type: inner}]}
  - {shot_id: EP12-S02, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png], dialogue: [{speaker: CHAR-001, text: "——丝绸——夹在封底里——至少一百年了——奶奶没发现——还是发现了但没动——", type: spoken}]}
  - {shot_id: EP12-S03, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "——地图——绣的地图——不是画的——是绣的。山河针法绣的山河——这不是奶奶的东西——这丝线——比绣谱里的任何一页都细——", type: spoken}, {speaker: CHAR-001, text: "——唐代的——顾言深说绣谱扉页是唐代写经体——这个夹层的年代——可能更早——", type: inner}]}
  - {shot_id: EP12-S04, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "——绣——坊——藏——经——处——苏——门——第——一——代——元——和——十——年——", type: spoken}, {speaker: CHAR-001, text: "——元和十年——公元815年——唐代——这是第一代苏家传人留下的——不是奶奶——不是太奶奶——是这个家族的——起点。", type: spoken}]}
  - {shot_id: EP12-S05, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "——同一座山——同一条溪——奶奶画的地图——和第一代绣的地图——地形完全一样。一千两百年——山没变——水没变——竹林没变——", type: spoken}, {speaker: CHAR-001, text: "——只有这个「绣」字——不在奶奶的地图上。她不知道这里——还是——她没有画出来——", type: inner}]}
  - {shot_id: EP12-S06, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "——「绣」字——在竹林最深处——地图上其他标注都是针法名字——盘云针——流水针——风动针——只有这个——是「绣」——", type: inner}, {speaker: CHAR-001, text: "——背面还有——", type: spoken}]}
  - {shot_id: EP12-S07, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "锦丫头——你怎么了——脸色不对——", type: spoken}, {speaker: CHAR-001, text: "陈婶——绣谱封底夹层里——有这个。你见过吗——奶奶给你看过吗——", type: spoken}, {speaker: CHAR-GRP-08, text: "没见过——你奶奶从来没说过绣谱里有东西——但这上面的丝线——", type: spoken}]}
  - {shot_id: EP12-S08, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "——这丝线——比你奶奶绣的还细——我看了七十年绣花——没见过这种。这上面的山——", type: spoken}, {speaker: CHAR-GRP-08, text: "——这里——竹林最里面——老人都说那里不能去。我小时候——我奶奶说过——竹林深处有座废了的绣坊——闹鬼——没人敢去。你奶奶去过一次——回来之后——绣了那幅最大的山——", type: spoken}, {speaker: CHAR-001, text: "——竹林深处——废了的绣坊——陈婶——你确定是这个地方——", type: spoken}]}
  - {shot_id: EP12-S09, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "——后人若见此图——速离——非苏门嫡传——不可入——入者——失——", type: spoken}, {speaker: CHAR-001, text: "——入者失——后面的字被虫蛀了——看不清——但大意是——不是苏家嫡传——进去了——会失去什么——", type: spoken}, {speaker: CHAR-GRP-08, text: "——难怪你奶奶不画那个位置——她不想让人找到——", type: spoken}]}
  - {shot_id: EP12-S10, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-003.png], dialogue: [{speaker: CHAR-001, text: "陈婶——我是苏家嫡传。奶奶把绣谱给了我——陈婶告诉了我传承的规矩——顾言深证实了它的年代——我在学入门十二式——", type: spoken}, {speaker: CHAR-001, text: "我要去。竹林最深处的绣坊——不管那里有什么——它等了一千两百年——等苏家的人回去。现在苏家有人了——是我。", type: spoken}, {speaker: CHAR-GRP-08, text: "去吧——但别一个人去。叫上那个戴眼镜的先生——他会帮你。", type: spoken}]}
  - {shot_id: EP12-S11, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "他在榕树下——第三天了。我欠他一个道歉——但现在——比道歉更重要的是——我需要他。", type: inner}, {speaker: CHAR-001, text: "我需要一个能看懂唐代遗址的人——需要一个不会把「绣坊藏经处」当成迷信的人——需要一个——和奶奶一样——愿意为山河针法付出一切的人。", type: inner}]}
  - {shot_id: EP12-S12, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——竹林深处——唐代绣坊遗址——疑似山河针法发源地——需要你——", type: spoken}, {speaker: CHAR-001, text: "三个字——需要你。比我欠他的道歉——比他欠我的解释——都重要。山河针法——比我们两个人——都大。", type: inner}]}
  - {shot_id: EP12-S13, scene: SCENE-004, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——翻到最后一页。", type: spoken}, {speaker: CHAR-002, text: "——唐代绣坊遗址——你确定。", type: spoken}, {speaker: CHAR-001, text: "绣谱夹层里有一张唐代古绣地图。标注了一个位置——竹林深处——写的是「绣坊藏经处——苏门第一代——元和十年」。背面还有警告——「非苏门嫡传——不可入」。", type: spoken}, {speaker: CHAR-002, text: "——元和十年——公元815年——晚唐。那个时期的徽州——是战乱避难地——很多中原士族南迁——带来了最顶尖的手工艺。如果山河针法的发源地真的在那里——那不只是非遗发现——是考古发现。", type: spoken}]}
  - {shot_id: EP12-S14, scene: SCENE-004, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "竹林深处——路可能不好走——大概要走多久——", type: spoken}, {speaker: CHAR-001, text: "陈婶说走一个小时。但她不敢去——村里人都说那里闹鬼。", type: spoken}, {speaker: CHAR-002, text: "闹鬼——对考古学来说——闹鬼的地方——通常就是遗址保存最完整的地方。因为没人敢去破坏。", type: spoken}, {speaker: CHAR-001, text: "——你怕鬼吗——顾教授。", type: spoken}, {speaker: CHAR-002, text: "——我怕的是——走到门口——发现门是锁的。", type: spoken}]}
  - {shot_id: EP12-S15, scene: SCENE-005, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-005.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——沙沙沙——每一脚踩下去——都像针在走。奶奶在竹林里坐了一个春天——她不是在看竹子——她是在听——听竹叶的声音——像针穿过丝绸的声音——一千两百年——这片竹林——没变过。", type: inner}, {speaker: CHAR-002, text: "唐代绣坊——如果是元和十年——那正好是安史之乱之后——大量中原工匠南迁——徽州是重要通道。苏门第一代可能就是那时候来到云溪村的——带着最顶尖的宫廷织绣技术——但选择了隐居——", type: spoken}, {speaker: CHAR-001, text: "——选择了不让人知道。就像奶奶——就像苏家每一代女人。她们选择藏——不是因为没有——是因为太珍贵。", type: spoken}]}
  - {shot_id: EP12-S16, scene: SCENE-005, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-005.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——谢谢。", type: spoken}, {speaker: CHAR-002, text: "——上次你说——我没有绣过一针。你说得对。但现在——我可以陪你走进去。走出文献——走进真的山河。", type: spoken}, {speaker: CHAR-001, text: "——走吧——顾教授。去看看第一代苏家女人——给我们留下了什么。", type: spoken}]}
  - {shot_id: EP12-S17, scene: SCENE-005, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-005.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——苏锦——你看——", type: spoken}, {speaker: CHAR-002, text: "——人工凿石——至少一千年以上的风化痕迹——我们——在遗址上面了。", type: spoken}, {speaker: CHAR-001, text: "——这片落叶——可能十年前落的——十年前和一千年前——对石头来说——没有区别——", type: spoken}]}
  - {shot_id: EP12-S18, scene: SCENE-005, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-005.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——红色是朱砂——绿色是孔雀石——金色是金粉——唐代壁画标准颜料——抗氧化能力极强——这个保存状态——", type: spoken}, {speaker: CHAR-002, text: "——前面——还有——", type: spoken}, {speaker: CHAR-001, text: "——走吧——它等了一千两百年——不差这几步。", type: spoken}]}