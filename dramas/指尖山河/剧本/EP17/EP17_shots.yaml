  - {shot_id: EP17-S10, scene: SCENE-006, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——第一代绣娘——你看到了吗——一千两百年后——在你这面石壁前——有一个七十岁的教授——在填申报表——有一个年轻的学者——在拍照——有一个设计师——在学盘云针——你的针——还活着——你的山河——还活着——", type: inner}]}
  - {shot_id: EP17-S11, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——这些字——比西安碑林的很多碑——都清晰——这里的湿度——温度——避光条件——天然地——保护了它们——", type: spoken}]}
  - {shot_id: EP17-S12, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——小姑娘——你看到这行字——是什么时候——", type: spoken}, {speaker: CHAR-001, text: "——五天前——", type: spoken}, {speaker: EXPERT, text: "——三年——你有三年——但你给自己定了三个月——", type: spoken}, {speaker: CHAR-001, text: "——三个月——是我给村民的承诺。三年——是给第一代绣娘的。我两个都要——完成——", type: spoken}]}
