  - {shot_id: EP17-S05, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——我在省文物局四十年——唐代遗址——看过几百处——寺庙——墓葬——城墙——但唐代民间绣坊遗址——完整保存壁画和碑文的——这是——第一处——", type: spoken}, {speaker: CHAR-002, text: "——老师——你的意思是——", type: spoken}]}
  - {shot_id: EP17-S06, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——这八个字——不是警告——是邀请。她在说——如果你看到这八个字——如果你愿意——接针——接契约——接山河——那你就是——苏家的人——哪怕你——不姓苏——", type: spoken}, {speaker: EXPERT, text: "——小姑娘——你姓苏——你奶奶——叫苏秀芝——你手上这根针——和壁画上这根——是同一根吗——", type: spoken}]}
  - {shot_id: EP17-S07, scene: SCENE-006, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png], dialogue: [{speaker: CHAR-001, text: "——是同一根——我奶奶留给我的——樟木箱——铁盒——绣谱——针——都是第一代传下来的——我在绣谱夹层里——找到了一张唐代古绣地图——标注的位置——就是这里——", type: spoken}]}
