  - {shot_id: EP17-S14, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——苏锦——这份推荐函——我签了——省文物局——会受理——但批文下来——可能需要一个月——甚至更长——", type: spoken}, {speaker: EXPERT, text: "——在这期间——如果有人——想用非学术的手段——干扰遗址——你打这个电话——", type: spoken}, {speaker: CHAR-001, text: "——谢谢——王教授——", type: spoken}]}
  - {shot_id: EP17-S15, scene: SCENE-006, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: full, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: EXPERT, text: "——顾言深——你做了十年文献研究——今天——看到实物了——感觉怎么样——", type: spoken}, {speaker: CHAR-002, text: "——感觉——文献里的每一个字——都变成了真的——石头——颜色——光线——灰尘——风吹竹叶的声音——文献里没有这些——但这里——都有——", type: spoken}]}
  - {shot_id: EP17-S16, scene: SCENE-006, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-006.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——王教授说——这是中国刺绣史缺失的那一章。那一章——从今天开始——不再缺失。因为——它被找到了——被记录——被拓印——被拍摄——被签在一份推荐函上——被交到——一个——愿意用针——绣山河的人——手里——", type: inner}]}
  - {shot_id: EP17-S17, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——苏锦——你知道吗——王教授填申报表的时候——在「传承人」那一栏——写了一行字——", type: spoken}, {speaker: CHAR-001, text: "——什么——", type: spoken}, {speaker: CHAR-002, text: "——「苏锦——苏门第十代传人——正在学习山河针法——预计完成时间——三个月后」——他把你的名字——和「预计完成」——写进了官方的文件——这在文物局的申报表里——从来没有过——但他写了——", type: spoken}, {speaker: CHAR-001, text: "——那不是预计——是承诺——", type: spoken}]}
  - {shot_id: EP17-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——王教授——在申报表上——写的不是三个月——他写的是——信念。他见过几百处遗址——但他只在一份文件上——写了「传承人」——而且——写的是我的名字。他赌了我的三个月——我——不能让他输——", type: inner}]}