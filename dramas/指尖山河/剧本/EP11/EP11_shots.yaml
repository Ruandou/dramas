# SOURCE FIDELITY PROOF: 18=18 ✅
shots:
  - {shot_id: EP11-S01, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "录音笔记——第七天——三个月倒计时第八十九天。今天开始第四式——回针。功能：固定。入针角度反向一百四十三度——丝线捻数三圈——", type: spoken}, {speaker: CHAR-001, text: "——不对——入针角度应该是一百四十五——我少了两度——拆掉重来。", type: spoken}]}
  - {shot_id: EP11-S02, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "第四次尝试——入针角度一百四十五——力度不均——右侧偏紧——原因是出针时手腕角度偏离——下次注意——", type: spoken}, {speaker: CHAR-001, text: "七天了。从第一天连针都拿不稳——到现在能自己发现角度偏差。进步——但不够。三个月——已经过去了将近十分之一——我才学到第四式。", type: inner}]}
  - {shot_id: EP11-S03, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "录音补充——手指状态：左手食指——四个针眼——三个旧的一个新的。右手中指——两个——都是新的。总计——没数——数了会更不想绣。", type: spoken}, {speaker: CHAR-001, text: "——但它不等人。山河——不等手指。", type: spoken}]}
  - {shot_id: EP11-S04, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "第十一排——回针——入针角度一百四十五——力度均匀——针脚间距一致——判定：合格。留存。", type: spoken}, {speaker: CHAR-001, text: "一排——十一针——合格。入门十二式——每一种至少要十排合格品——那就是一千三百二十针。然后山水二十四针——花鸟十六法——", type: inner}]}
  - {shot_id: EP11-S05, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "锦丫头——你这手——你奶奶绣了六十年——手上也没有这么多伤——", type: spoken}, {speaker: CHAR-001, text: "陈婶——那是因为她六岁就开始学了——皮已经磨厚了。我才第七天——皮还是上海写字楼的皮——薄。", type: spoken}, {speaker: CHAR-GRP-08, text: "泡着。泡一炷香的功夫。这是你奶奶以前用的方子——艾草——金银花——三七——活血——消肿——", type: spoken}, {speaker: CHAR-001, text: "陈婶——谢谢你。", type: spoken}]}
  - {shot_id: EP11-S06, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "你奶奶绣那幅画的时候——四十岁。手已经长满了茧——针扎上去都没感觉。她绣了整整一年——每天晚上——油灯点到天亮。你爷爷说——你疯了——她说——我没疯——我在和山说话。", type: spoken}, {speaker: CHAR-001, text: "和山说话——", type: spoken}, {speaker: CHAR-GRP-08, text: "她说——山有脾气——不同季节不同时辰——都不一样。绣快了一分——山就僵了。绣慢了一分——山就软了。得刚刚好——跟山的呼吸一样——她管那个叫听山。", type: spoken}, {speaker: CHAR-001, text: "听山——我连针都还拿不稳——", type: spoken}]}
  - {shot_id: EP11-S07, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "第五式——盘云针——入针角度三十七度——第一层——丝线捻数五圈——", type: spoken}, {speaker: CHAR-001, text: "——第一层——完成。第二层——丝线捻数四圈——入针角度不变——", type: spoken}, {speaker: CHAR-001, text: "——嘶——第二层——完成——", type: spoken}]}
  - {shot_id: EP11-S08, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "三层——不是五层。但每一层的厚度变化——方向是对的。盘云针——五层——我今天只能绣三层——但明天——会是四层——后天——会是五层。", type: spoken}, {speaker: CHAR-001, text: "山河不等手指——奶奶等了十年——不等我再多等一天。", type: spoken}]}
  - {shot_id: EP11-S09, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "第十二天了——不对——是第七天——还是第八天。我记不清了——手比脑子清楚。手指知道角度——不需要脑子指挥了——这是进步——顾言深说的肌肉记忆大概就是这个——", type: inner}, {speaker: CHAR-001, text: "第八天了——三个月倒计时——八十二天。入门十二式——我学了五种——还有七种。——慢了——按这个速度——三个月我学不完入门——更别说山水二十四针——", type: inner}]}
  - {shot_id: EP11-S10, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "对不起——让你们受苦了。我知道你们习惯了拿铅笔——拿尺子——拿面料样板——不习惯拿针。但你们会习惯的——你们会像习惯铅笔画线一样——习惯针在丝线上走。", type: spoken}, {speaker: CHAR-001, text: "奶奶的手——六十年——几百万针——该有多少针眼。她的手指——大概早就感觉不到痛了——不是不痛——是痛变成了别的——变成了每一针下去的力度——变成了针和线之间的那个角度——三十七度——那个她不用量——手自己知道的角度。", type: inner}]}
  - {shot_id: EP11-S11, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "油快烧干了——今天最后一针——绣完就睡——", type: inner}], notes: "顾言深在门外——放草药——离开。无声画面。月光+油灯光"}
  - {shot_id: EP11-S12, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——", type: spoken}, {speaker: CHAR-001, text: "——艾草——金银花——三七。和陈婶煮的一模一样。他去了县城的药店——买了草药——晚上摸黑送过来——放在门口——就走了。他不敢进来。因为上次我把他赶出去了——因为他说我不懂我手里是什么——因为他怕——我又赶他。", type: inner}]}
  - {shot_id: EP11-S13, scene: SCENE-002, characters: [CHAR-001, CHAR-GRP-08], looks: {CHAR-001: CHAR-001-L01, CHAR-GRP-08: CHAR-GRP-08-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-GRP-08-L01.png], dialogue: [{speaker: CHAR-GRP-08, text: "——这包——不是我给的。谁给的。", type: spoken}, {speaker: CHAR-001, text: "——一个朋友。", type: spoken}, {speaker: CHAR-GRP-08, text: "是那个戴眼镜的先生吧。前天在村口等了你一上午——昨天又在村口转了一整天。晚上把车停在村口——在车里睡的。早上我去送豆浆——他说不用——说自己带了面包。", type: spoken}, {speaker: CHAR-001, text: "——他昨天一整天都在？", type: spoken}, {speaker: CHAR-GRP-08, text: "在榕树下坐着——看他的笔记本。也不走——也不过来——就在那里。我问他找谁——他说——不找谁——就看看。", type: spoken}]}
  - {shot_id: EP11-S14, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "他叫顾言深。省城大学的——研究非遗的。他找了我奶奶的针法——找了十年。找到云溪村——找到了我——然后——我说他是为了把它变成他的成果——我把他赶出去了。", type: spoken}, {speaker: CHAR-GRP-08, text: "他不会走。他要是会走——三天前就走了。他在你门外转了三天——在车里睡了两个晚上——早上端着我给的豆浆——问你的手还疼不疼。我没告诉他——我说你自己去看。", type: spoken}, {speaker: CHAR-001, text: "——陈婶——他的手——干净——修长——没有针眼。他不会绣——但他懂。他比绣过的人——更懂山河针法意味着什么。", type: spoken}]}
  - {shot_id: EP11-S15, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——你把入门十二式的力学分析——全写出来了。你不绣——但你比我还懂。你写了练习优化方案——用学者的方法——帮我找最快的路。你放在笔记本里——等我自己翻到——你不说——你让我自己看。", type: spoken}, {speaker: CHAR-001, text: "——顾言深——我欠你一个道歉。还有——一个谢谢。但我不会现在去找你。等我绣完盘云针的五层——等我手上这些针眼都变成茧——我会去找你。带着我的针——让你看——我不是只会说的设计师——我是会绣的苏锦。", type: spoken}]}
  - {shot_id: EP11-S16, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——第四层——完成了。他说得对——出针时手腕微向外旋——利用丝线自身弹力——我从没想过还能这样——但丝线——确实有弹力——他比我更了解丝线的物理性质——", type: spoken}, {speaker: CHAR-001, text: "他不是在帮我——他是在和奶奶合作。奶奶绣了六十年——懂针法的感觉——但不懂力学原理。顾言深研究了十年文献——懂力学原理——但不会绣。他在帮我把奶奶的感觉——翻译成我能理解的语言。", type: inner}]}
  - {shot_id: EP11-S17, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "录音笔记——第八天——盘云针——五层——全部完成。深灰——浅灰——灰白——米白——纯白。入针角度——三十七度——每层丝线捻数递减一圈——第五层——手腕微向外旋——利用丝线弹力——完成。", type: spoken}, {speaker: CHAR-001, text: "——奶奶——我做到了。五层——盘云针——和你绣的一样的针法——虽然没你绣得好——但方向是对的。", type: spoken}, {speaker: CHAR-001, text: "——顾言深——谢谢你。你不在——但你的笔记在——你的草药在——你写的每一个字——都在帮我。", type: spoken}]}
  - {shot_id: EP11-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "他还在——在榕树下——或者在车里。他等了三天——还会等第四天——第五天——等到我准备好。", type: inner}, {speaker: CHAR-001, text: "奶奶等了十年。他等了我三天。我不会让他等十年。三个月后——我交作品的那天——我会走到榕树下——把作品给他看——然后说——顾言深——对不起——还有——谢谢。现在——请你帮我——把山河针法——带给世界。", type: inner}], overlay: "每一针——都是有人在等"}
