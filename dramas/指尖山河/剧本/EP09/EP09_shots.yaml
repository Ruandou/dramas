shots:
  - {shot_id: EP09-S01, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "——你没走。", type: spoken}, {speaker: CHAR-002, text: "——车在村口。昨晚——在车里睡的。陈婶早上一看到我就端了碗豆浆过来——她说你在睡觉让我别吵你——", type: spoken}, {speaker: CHAR-001, text: "陈婶给你了豆浆。", type: spoken}, {speaker: CHAR-002, text: "她说——锦丫头的客人——不能怠慢。", type: spoken}]}

  - {shot_id: EP09-S02, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "我来拿笔记本——也来——道歉。昨天我说的关于博物馆的事——传达得太生硬了。我老师的话——不代表我的立场。", type: spoken}, {speaker: CHAR-001, text: "那你的立场是什么。", type: spoken}, {speaker: CHAR-002, text: "我的立场——是不管你做什么决定——我都想帮你。不是帮山河针法——是帮你。因为你昨晚在我笔记本上——写了传人——待定。", type: spoken}]}

  - {shot_id: EP09-S03, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "我昨晚想了一夜。关于你老师说的——博物馆——非遗保护——全人类的文化遗产。我想了很多遍——每一遍都回到同一个问题。", type: spoken}, {speaker: CHAR-002, text: "什么问题。", type: spoken}, {speaker: CHAR-001, text: "如果我把它交出去——交给博物馆——交给研究所——交给任何机构——那它还是苏家的东西吗。还是云溪村的东西吗。苏家的女人守了它十代——不是为了有一天交给别人。她们守它——是因为它属于这里。就像后山的竹子——溪里的水——村里的青石板路。你把它搬走——它就死了。", type: spoken}]}

  - {shot_id: EP09-S04, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "你记得我说——山河针法的核心是人——对吧。", type: spoken}, {speaker: CHAR-001, text: "记得。", type: spoken}, {speaker: CHAR-002, text: "那你想过没有——如果这个人不在了——山河针法在哪里。你奶奶在的时候——它在她的针线上。你奶奶走了——它在你身上——也在绣谱上——在墙上这些绣品上。但如果有一天——你也走了——你的孩子没有学——或者学了但不想守——那它在哪里。", type: spoken}, {speaker: CHAR-002, text: "博物馆不是要把它搬走——是要让它活着。让它脱离对单一个人的依赖。让一百年后的人——两百年后的人——还能看到——在徽州——有一个姓苏的老太太——用了一辈子——做了一件人类做不到的事。", type: spoken}]}

  - {shot_id: EP09-S05, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-001, text: "你说的有道理。一百年后——如果没有人传——它就真的死了。但博物馆——不是唯一让它活着的方式。", type: spoken}, {speaker: CHAR-002, text: "——你是什么意思。", type: spoken}, {speaker: CHAR-001, text: "我是设计师——不是你。你看它——看到的是文物。我看它——看到的是技术。是可以用的技术。你说这是被抹掉的人类文明史——我说这是还没有被写完的未来。奶奶用针线做了法国人用织机做不到的事——如果我把它的原理翻译出来——用在服装设计上——它不是进博物馆——是进人的生活。", type: spoken}]}

  - {shot_id: EP09-S06, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "你的想法——把山河针法应用到现代服装设计——在理论上不是不可能。但有一个问题。山河针法的核心工艺——入针角度、丝线捻数、分层控制——这些都是手工程序。你不可能手工批量生产——", type: spoken}, {speaker: CHAR-001, text: "谁说我要批量生产。我这辈子做的都是成衣——是让衣服走进商场——走进普通人的生活。但山河针法——它不属于生产线——它属于高定。你知道高定意味着什么吗——一件衣服——一千个小时——纯手工——全球只有一件。这恰恰就是山河针法的逻辑——用时间换极致。", type: spoken}]}

  - {shot_id: EP09-S07, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "苏锦——我理解你的想法。但你不能——", type: spoken}, {speaker: CHAR-001, text: "不能什么。不能决定我奶奶的东西怎么用。顾教授——你来云溪村三天——你研究山河针法十年——但你有没有绣过一针。", type: spoken}, {speaker: CHAR-002, text: "——没有——", type: spoken}, {speaker: CHAR-001, text: "我有。昨晚。层云针——五层——二十针。你看的是文字——是图谱——是方志——是论文。我碰的是针——是线——是奶奶碰了一辈子的东西。你想保护它——但你不想理解它。", type: spoken}]}

  - {shot_id: EP09-S08, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "——你说得对。我没有绣过一针。我研究的是山河针法的历史——不是山河针法本身。", type: spoken}, {speaker: CHAR-002, text: "但你也没有想过——如果你的高定失败了——如果你没有足够的钱——如果你被人抄袭了——山河针法怎么办。你背负的不只是你的设计——还有十代人的等待。你一针绣错了——不只是你的错——是它的错。", type: spoken}, {speaker: CHAR-001, text: "那你告诉我——你把它锁进博物馆——就万无一失了？博物馆里多少东西——锁在恒温恒湿的库房里——十年没有人打开过一次。你管那个叫活着。", type: spoken}]}

  - {shot_id: EP09-S09, scene: SCENE-002, characters: [CHAR-001, CHAR-002], looks: {CHAR-001: CHAR-001-L01, CHAR-002: CHAR-002-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png], dialogue: [{speaker: CHAR-002, text: "你说的对——我不懂针法。但有一件事——我比你懂。", type: spoken}, {speaker: CHAR-001, text: "什么事。", type: spoken}, {speaker: CHAR-002, text: "你不懂你手里是什么。你把它当成奶奶的遗物——当成苏家的传家宝——当成你通往高定的秘密武器。但它不只是那些。它是全人类的记忆。是人类在工业化之前——用手能达到的最高精度。你把它锁在樟木箱里——把它当成私产——它就和锁在坟墓里没有区别。", type: spoken}, {speaker: CHAR-002, text: "你奶奶在地下——她等了你十年——不是为了让你再把它锁回去。", type: spoken}]}

  - {shot_id: EP09-S10, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "——她等了我十年——不是为了让我再把它锁回去。", type: inner}, {speaker: CHAR-001, text: "他说错了。他没有绣过一针——但他懂。他比绣过的人——更懂山河针法意味着什么。不是技术——不是传承——是——看见。让世界看见。让这个世界知道——在徽州——在云溪村——有一家人——用针线——保存了人类文明的一角。", type: inner}]}

  - {shot_id: EP09-S11, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: close, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "针在手上——山河在心里。", type: inner}, {speaker: CHAR-001, text: "奶奶——你说得对。针在手上——所以我可以选择怎么用。山河在心里——所以它永远是我的。不管它去到哪里——被多少人看到——它姓苏。永远姓苏。", type: inner}]}

  - {shot_id: EP09-S12, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "顾言深说我不懂我手里是什么。也许他说得对——我不完全懂。但我可以学。从入门十二式开始——一针一针地学。", type: inner}, {speaker: CHAR-001, text: "奶奶学了六十年——她到最后一针都在学。我现在才学了三天——有什么资格说我决定了。等我学会入门十二式——等我绣出第一件完整的山河针法作品——等我用自己的手——证明了这条路走得通——我再决定——它是锁在箱子里——还是放在博物馆里——还是穿在人身上。", type: inner}]}

  - {shot_id: EP09-S13, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "流水针——手腕角度——不能停顿——不能犹豫。像溪水转弯——", type: inner}, {speaker: CHAR-001, text: "奶奶在溪边坐了一整个春天——她不是在观察水怎么流——她是在让自己的手腕变成水。她的手不是手——是溪流。她不是在做手工——她是在做自己。", type: inner}]}

  - {shot_id: EP09-S14, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "奶奶——我现在知道了。你不是在等我回来继承——你是在等我回来——绣给你看。你想看我坐在你的位置上——拿着你的针——绣你的线。你想看——但是你没等到。没关系——我绣给你看。你在这里——我每一针——你都看得见。", type: spoken}]}

  - {shot_id: EP09-S15, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "奶奶绣的山——就是这座山。七种绿色——不同角度——不同深浅——因为每天的光不一样——每小时的影子不一样——每个季节的颜色不一样。她不是在创作——是在记录。用针线——记录山河。", type: inner}]}

  - {shot_id: EP09-S16, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: medium, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "太奶奶不认识字——但认得针法。奶奶绣了一辈子——没出过村子。我在伦敦学了设计——在上海开了公司——然后被踢出来——回到这里。", type: inner}, {speaker: CHAR-001, text: "三代人——三条路——终点是同一扇门。这扇门——奶奶没有推开。太奶奶没有推开。现在它在我面前——我要不要推。", type: inner}]}

  - {shot_id: EP09-S17, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: wide, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "顾言深说——我不懂我手里是什么。他说得没错。我确实不懂——不懂它的全部——不懂十代人为什么要守——不懂奶奶为什么不拿它换一分钱。", type: inner}, {speaker: CHAR-001, text: "但我在学。每天学一点——每天比昨天多懂一点。入门十二式——等我学完的那一天——我会懂的。到时候——我会给他一个答案。给奶奶一个答案。给我自己——一个答案。", type: inner}]}

  - {shot_id: EP09-S18, scene: SCENE-002, characters: [CHAR-001], looks: {CHAR-001: CHAR-001-L01}, camera: closeup, duration_sec: 5, ref_images: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-002.png, https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png], dialogue: [{speaker: CHAR-001, text: "针下有山河——这是扉页上的八个字。太奶奶看的——奶奶绣的——现在轮到我了。", type: inner}, {speaker: CHAR-001, text: "不是绣她们的字——是绣我的。苏锦——2026年——云溪村。", type: inner}], overlay: "有些答案——不是想出来的——是绣出来的"}
