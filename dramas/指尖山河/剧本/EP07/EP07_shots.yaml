      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - speaker: CHAR-001
        text: "意味着我奶奶绣的这只蝴蝶——比你想象的要值钱。你研究它十年——你想干什么。"
        type: spoken
      - speaker: CHAR-002
        text: "——我想记录它。保存它。我找了它十年——不是为了占有——是为了证明——中国传统纺织技艺的高度——比世界知道的要早得多。"
        type: spoken
      - speaker: CHAR-001
        text: "你刚才说——入针三十七度。你怎么知道是这个角度。"
        type: spoken

  - shot_id: EP07-S11
    scene: SCENE-004
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      CHAR-001: CHAR-001-L01
      CHAR-002: CHAR-002-L01
    ref_images:
