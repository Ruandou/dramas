        type: spoken
      - speaker: CHAR-002
        text: "——对不起。那你知道——她会的这个——叫什么吗。"
        type: spoken
      - speaker: CHAR-001
        text: "——叫山河针法。入门十二式。山水二十四针。花鸟十六法。"
        type: spoken

  - shot_id: EP07-S09
    scene: SCENE-004
    characters:
