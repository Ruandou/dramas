      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - speaker: CHAR-002
        text: "清代《徽州府志·艺文志》有一段记载：山河针法盘云针——针入三十七度——丝分五色——层叠如云。我以为是夸张——古人写东西喜欢用虚数。但刚才看了你奶奶的绣品——背面入针点——我数了——至少五个不同深度的丝线层。三十七度——不是虚数。是实测。"
        type: spoken
      - speaker: CHAR-001
        text: "你花了十年——翻遍了方志——就为了找这些数字？"
        type: spoken

  - shot_id: EP07-S12
    scene: SCENE-004
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      CHAR-001: CHAR-001-L01
      CHAR-002: CHAR-002-L01
    ref_images:
      - https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: close
    duration_sec: 5
    dialogue:
      - speaker: CHAR-002
        text: "不只是数字——我在找完整的技术体系。山河针法的文献提到它不只是刺绣——是一套系统。从面料选择到针法结构到染色工艺——全部自成一体。如果能够完整复原——它改变的不只是非遗保护。是整个中国服装设计史。"
        type: spoken
      - speaker: CHAR-002
        text: "你奶奶——她有没有留下什么——图谱？手抄本？口诀？任何形式的记录——"
        type: spoken
      - speaker: CHAR-001
        text: "你要我奶奶的绣谱。"
        type: spoken

  - shot_id: EP07-S13
    scene: SCENE-004
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      CHAR-001: CHAR-001-L01
      CHAR-002: CHAR-002-L01
    ref_images:
