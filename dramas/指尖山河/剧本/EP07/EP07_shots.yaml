    camera: close
    duration_sec: 5
    dialogue:
      - speaker: CHAR-001
        text: "——越野车。城里牌照。这种车在云溪村不常见。"
        type: inner
      - speaker: CHAR-001
        text: "大概是来旅游的。或者——考察古村落的。这种地方不缺这种人——来了一拨又一拨。拍完照就走了。没人真的留下来。"
        type: inner

