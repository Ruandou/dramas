        text: "昨晚陈婶说——苏家在这村子住了两百年。每一代都有一个女人守着这门手艺。传媳妇不传女儿——但奶奶传给了我。"
        type: inner
      - speaker: CHAR-001
        text: "她打破了规矩。苏家的规矩——到她这里断了。不——是转了方向。"
        type: inner

