    camera: medium
    duration_sec: 5
    dialogue:
      - speaker: CHAR-002
        text: "不——我不是要——我不是要你把它给我。我的意思是——如果有图谱——我可以帮你做鉴定。年代鉴定、技术参数比对、学术溯源。如果它能被证实——"
        type: spoken
      - speaker: CHAR-001
        text: "证实了然后呢。变成你的论文——还是博物馆的藏品——还是哪个品牌的「灵感来源」。我在上海做了十年设计——这种事我见多了。你说你找了它十年——那你告诉我——山河针法的核心——是什么。"
        type: spoken
      - speaker: CHAR-002
        text: "——人。"
        type: spoken

  - shot_id: EP07-S14
    scene: SCENE-004
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      CHAR-001: CHAR-001-L01
      CHAR-002: CHAR-002-L01
    ref_images:
