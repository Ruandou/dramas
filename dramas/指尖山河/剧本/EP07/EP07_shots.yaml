        text: "——如果你愿意。我的普查工作还剩三天。这三天我可以帮你做技术鉴定——免费的。不拍照——不发表——不告诉任何人。只是鉴定。你考虑一下。"
        type: spoken
      - speaker: CHAR-001
        text: "为什么。"
        type: spoken
      - speaker: CHAR-002
        text: "因为这是我找了十年的东西。因为今天之前——我以为它不存在。因为你奶奶——她不应该被忘记。"
        type: spoken
      - speaker: CHAR-001
        text: "——我会考虑。"
        type: spoken

