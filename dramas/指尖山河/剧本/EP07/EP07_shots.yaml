        text: "那个男人——应该是带队老师。深灰衬衫——金属框眼镜——看起来三十五六岁。和学生说话的语气很温和——但有一种学者式的精确。"
        type: inner
      - speaker: CHAR-001
        text: "他在看我——不对。他在看我手里的蝴蝶。"
        type: inner

