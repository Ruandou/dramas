      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: medium
    duration_sec: 5
    dialogue:
      - speaker: CHAR-001
        text: "你看得懂这个吗。"
        type: spoken
      - speaker: CHAR-002
        text: "——这是山河针法的实地训练图。每一种针法对应一个自然环境——在特定的光线、风向、湿度下练习——才能达到最佳效果。我写过论文推测过这个训练体系——但从来没见过实例。这是你奶奶画的？"
        type: spoken
      - speaker: CHAR-001
        text: "在绣谱最后一页——夹着。我今天本来要去找第一个点——盘云针——后山。"
