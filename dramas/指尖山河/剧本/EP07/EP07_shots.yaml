      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: medium
    duration_sec: 5
    dialogue:
      - speaker: CHAR-002
        text: "山河针法——失传三百年。最后一次文献记载是清代嘉庆年间——徽州苏氏——最后一任传人没有留下弟子——学界认定这门技艺已经断绝。我写了三篇论文——翻遍了省图书馆所有徽州方志——只找到了名字。连一张针法图都没有。"
        type: spoken
      - speaker: CHAR-002
        text: "而你——你刚才说出了入门十二式。连名字都知道。你知道这意味着什么吗——"
        type: spoken

  - shot_id: EP07-S10
    scene: SCENE-004
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      CHAR-001: CHAR-001-L01
      CHAR-002: CHAR-002-L01
    ref_images:
