      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png
      - https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png
    camera: closeup
    duration_sec: 5
    dialogue:
      - speaker: CHAR-002
        text: "山河针法和其他刺绣最大的区别——不是技术。是它的哲学。平针是拉力——回针是回弹——流水针是过渡。每一种针法——都像一个人的动作。站立、转身、行走。它不是在绣图案——它是在绣身体。绣人在天地间的位置。所以叫山河针法——山河在我——不在布上。"
        type: spoken
      - speaker: CHAR-001
        text: "你刚才说的——和我奶奶写的一模一样。"
        type: spoken

  - shot_id: EP07-S15
    scene: SCENE-004
    characters:
