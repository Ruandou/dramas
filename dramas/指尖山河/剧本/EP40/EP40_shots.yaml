  - {shot_id: EP40-S04, scene: SCENE-011, characters: ["CHAR-009", "CHAR-001"], looks: {"CHAR-009": "CHAR-009-L01", "CHAR-001": "CHAR-001-L01"}, camera: 近景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-011.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-009-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-001", "text": "（比划——手语——同时——说）——山河——女子——绣艺——传习所——小兰——这——十——个——字——里——面——最——重要——的——是——传——因为——山河——针法——最——核心——的——不是——技法——是——传承——技法——可以——练——传承——需要——人——以后——你——也——会——是——这里——的——老师——之一", "type": "spoken"}]}
  - {shot_id: EP40-S05, scene: SCENE-004, characters: ["CHAR-007", "CHAR-001"], looks: {"CHAR-007": "CHAR-007-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-004.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-007-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png"], dialogue: [{"speaker": "CHAR-007", "text": "（大喇叭）——云溪村——山河——女子——绣艺——传习所——今天——正式——挂牌——！从今天——开始——任何——人——不管——你是——本村——的——还是——外——村——的——不管——你——是——大——姑娘——还是——老——太太——只要——你——愿——意——学——山河——针法——这里——就——有——人——教——你——！", "type": "spoken"}]}
