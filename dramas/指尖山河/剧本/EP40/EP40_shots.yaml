  - {shot_id: EP40-S15, scene: SCENE-003, characters: ["CHAR-001"], looks: {"CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-001", "text": "顾教授——你——想说——的——那——句话——我——知道——但——我——还没——准备好——不是——你——不——好——是——我——害怕——上一次——信任——一个——人——我——失去——了——公司——失去了——上海——失去了——三年——的——人生——这一次——如果——再——错——我——会——失去——什么——山河——针法——吗——传习所——吗——还是——刚刚——重建——起来——的——自己", "type": "inner"}]}
