  - {shot_id: EP40-S13, scene: SCENE-003, characters: ["CHAR-002", "CHAR-001"], looks: {"CHAR-002": "CHAR-002-L01", "CHAR-001": "CHAR-001-L01"}, camera: 中景, duration_sec: 5, ref_images: ["https://drama-reference-images.tos-cn-beijing.volces.com/scenes/指尖山河/SCENE-003.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-002-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/looks/指尖山河/CHAR-001-L01.png", "https://drama-reference-images.tos-cn-beijing.volces.com/props/指尖山河/PROP-004.png"], dialogue: [{"speaker": "CHAR-002", "text": "苏锦——省——市场监管局——已经——立案——调查——了——YX——织造——厂——因为——侵犯——知识——产权——可能——面临——吊销——执照——周明远——的——明远——商贸——也——被——列入——了——调查——范围——另外——我——还——做了——一件——事——我把——山河——针法——的——完整——技法——文档——提交——给了——中国——非遗——保护——中心——申请——列入——国家级——非遗——预备——名录", "type": "spoken"}, {"speaker": "CHAR-001", "text": "国家级——顾教授——你——做了——多少——工作", "type": "spoken"}, {"speaker": "CHAR-002", "text": "不多——只是——把你——奶奶——的——绣谱——和我——父亲——的——笔记——做了——一——份——完整的——学术——整理——加上——你在——大赛——上——的——《破茧》——影像——资料——总——共——大概——两百——页——的——申报——材料", "type": "spoken"}]}
