  - id: SCENE-002
    prompt_en: "An intimate view into two adjoining bedrooms in a warm Shanghai apartment, viewed from the hallway doorway capturing both spaces in one continuous composition. Foreground left — Xiao Wei's bedroom: a queen-size bed with soft blush pink linen bedding and a chunky knit cream throw blanket casually draped, a minimalist white nightstand holding a ceramic table lamp with a warm amber glow and a small stack of books, a wooden dresser against the wall topped with a round Hollywood-style makeup mirror ring-lit with warm LEDs, neatly arranged skincare bottles in frosted glass, a corkboard photo wall above the dresser densely covered with Polaroid snapshots, ticket stubs, and small handwritten notes. Background right — visible through a half-open door: Chen Yi's bedroom, notably more minimal with grey-blue cotton bedding on a single bed, a wooden A-frame easel positioned by the window holding a leather-bound sketchbook, graphite pencils and a kneaded eraser scattered on a simple white IKEA-style desk, a single potted snake plant in a concrete planter on the windowsill, a black canvas backpack leaning against the bed frame. Late afternoon golden hour sunlight streaming diagonally through sheer white curtains in both rooms, dust motes suspended in the warm light beam, creating an atmosphere of quiet intimacy and unspoken longing. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-002.png
  - id: SCENE-003
    prompt_en: "A contemporary open-plan office in a mid-to-high-rise Shanghai commercial building, viewed through a 24mm wide-angle lens capturing the full workspace depth. Large floor-to-ceiling windows along the far wall revealing a blurred Shanghai city skyline with distant high-rises under overcast afternoon light. Cool white 6000K fluorescent ceiling panels providing even illumination, supplemented by natural grey daylight from the windows. Four rows of minimalist white laminate workstations arranged in pairs, each desk with a 24-inch iMac or business monitor, ergonomic grey mesh office chairs with chrome bases, personal desk items varying subtly — a Zojirushi coffee thermos on one, a tiny succulent in a geometric concrete pot on another, a small framed family photo on a third. A glass-walled conference room in the left background: a long white meeting table with eight grey upholstered chairs, a wall-mounted 65-inch flatscreen displaying a muted corporate presentation slide, a conference speakerphone at the table center. A water cooler station with paper cone cups and a Nespresso machine in a small pantry nook visible in the right corner. Grey low-pile carpet tiles across the entire floor. Clean, professional, slightly sterile — the muted hum of corporate life. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-003.png
  - id: SCENE-004
    prompt_en: "A warm and inviting ground-floor community cafe in a Shanghai residential compound, viewed through a 24mm lens capturing the cozy full interior. Rich honey-toned oak paneling on the main accent wall, an exposed concrete ceiling with three warm Edison-bulb pendant lights casting pools of amber light over the seating area. A large storefront picture window flooding the space with soft morning sunlight, revealing a blurry view of the tree-lined pathway and low-rise apartment buildings of the residential compound outside. Plush olive-green velvet upholstered armchairs arranged around a low reclaimed-elm coffee table with visible wood grain and natural edge, a built-in bookshelf along the back wall filled with well-worn Chinese paperbacks mixed with small potted succulents and a trailing string-of-pearls plant cascading from the middle shelf. A classic La Marzocco Linea espresso machine with polished chrome body on a white marble counter, ceramic latte mugs hanging from a copper rail mounted on the subway-tile backsplash, a small wooden-framed chalkboard menu leaning on the counter. Worn medium-tone hardwood floor with a faded vintage Persian-style area rug in muted reds and blues. The atmosphere is cozy, unhurried, and intimate — a neighborhood spot where secrets are shared over coffee. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-004.png
  - id: SCENE-005
    prompt_en: "An understated luxurious living room in a traditional Chinese modern mansion in Shanghai, viewed through a wide-angle lens with a slight low angle emphasizing the grand 4-meter ceiling height and the weight of the space. Deep rosewood furniture with clean contemporary Ming-style lines — a long low rectangular tea table with subtle brass corner inlays, two carved rosewood display cabinets with glass doors showing a collection of celadon ceramics, a large abstract ink wash landscape painting mounted on a cream silk-wallpapered accent wall featuring bold sweeping brushstrokes of mountains and mist. Soft warm illumination from recessed ceiling spotlights and two tall celadon ceramic table lamps with cream silk drum shades. Polished dark grey stone flooring with a faint reflective sheen, a traditional carved rosewood lattice-screen room divider partially separating the living area from a visible study alcove. Through floor-to-ceiling glass sliding doors along the right wall: a meticulously maintained Chinese scholar's garden with a small dark-stone koi pond reflecting the sky, three weathered Taihu scholar's rocks of varying heights, manicured dwarf bamboo groves along the stone wall, and flagstone pathways lit by ground-level warm LED lights. Evening atmosphere — the garden subtly illuminated against the deepening indigo sky, the interior lighting warm but the overall atmosphere formal, imposing, and emotionally cold. A space of generational power and unspoken rules, not comfort. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-005.png
  - id: SCENE-006
    prompt_en: "A warm and intimate modern bistro interior in Shanghai, viewed through a 24mm lens — designed as the versatile base restaurant for dates and quiet conversations. Dark walnut wood bistro tables with crisp white linen tablecloths, a single flickering beeswax candle in a clear glass hurricane holder on each table, warm amber glass pendant lights hanging low over each table creating intimate pools of golden light against the darker surroundings. An exposed brick accent wall painted matte charcoal grey, a long dark wood bar counter with a polished granite top and backlit shelves behind displaying wine bottles, spirit bottles, and stemmed glassware, three brass-and-leather bar stools with worn cognac leather seats. Soft bokeh of Shanghai city lights visible through large steel-framed windows dressed with sheer cream curtains. Dark stained hardwood floor with a subtle patina of wear, comfortable upholstered booth seating along the walls in deep burgundy velvet with button-tufted backs. Versatile atmosphere — warm enough for a romantic date, dark enough for a solitary drink, elegant enough for a meaningful conversation. Evening atmosphere, the interplay of candlelight and pendant lamps creating chiaroscuro. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-006.png
  - id: SCENE-007
    prompt_en: "A narrow residential corridor on a mid-floor of a Shanghai apartment building, shot from the elevator lobby looking down the hallway with a 24mm lens emphasizing the compressed, slightly claustrophobic geometry. White painted walls with subtle scuff marks and faint shadow lines near the baseboards, grey polished concrete floor tiles with a slight reflective sheen under the artificial light, cool white 4000K fluorescent ceiling panels in a continuous row casting flat even illumination that leaves no shadows. A row of six identical dark walnut wood apartment doors along the right wall, each fitted with a brushed stainless steel apartment number plate, a circular peephole at eye level, and a simple coir welcome mat on the floor below. The elevator doors visible at the far end of the corridor — brushed stainless steel with horizontal hairline finish, a small red LED floor-number indicator glowing above, a round stainless steel call button panel on the wall beside it. A red fire extinguisher in a wall-mounted glass case near the elevator, a green emergency exit sign glowing at the far end of the corridor. An narrow horizontal window at the corridor's dead end letting in a sliver of natural daylight that barely penetrates the fluorescent dominance. A transitional, anonymous space — the kind of hallway where encounters feel heightened and charged. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-007.png
  - id: SCENE-008
    prompt_en: "A bright and neatly organized neighborhood supermarket in Shanghai, viewed through a 24mm lens looking down a central grocery aisle with warm white 3500K LED ceiling panels casting even, flattering light. Polished cream-colored ceramic floor tiles with a subtle sheen. Two parallel aisles of metal shelving units stocked with colorful Chinese packaged goods — rows of soy sauce bottles in dark glass, cooking oil in clear plastic jugs, instant noodle packages in red and gold, jars of Lao Gan Ma chili sauce with their iconic red labels, all neatly faced and organized. A refrigerated wall section on the left with sliding glass doors revealing fresh produce — bundles of bok choy, bunches of scallions, vine tomatoes in red, cartons of milk, and stacked yogurt cups. A fresh produce display island in the foreground with neatly pyramided oranges, Fuji apples with their pink-red blush, and a whole dragon fruit under a fine misting spray that catches the light. A red plastic shopping basket with a bag of fresh noodles and a bunch of cilantro resting on the polished floor near the shelving. The atmosphere is warm, domestic, and everyday — the quiet joy of a weekend grocery run with someone you love. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-008.png
  - id: SCENE-009
    prompt_en: "A grand hotel ballroom in Shanghai set up for a corporate annual gala, viewed from a dramatic low angle looking up at the soaring 8-meter ceiling to emphasize the monumental scale and the weight of public spectacle. A towering ceiling with three massive cascading crystal chandeliers casting warm golden light across the room, dramatic uplighting along the perimeter walls in deep royal blue and champagne gold — the company's event colors. A raised professional stage at the far end with a large seamless LED video wall displaying abstract celebratory light patterns in gold and white, an overhead professional lighting rig with moving head spotlights and beam lights, a sleek black podium with a microphone stand center stage. Round banquet tables in the foreground and mid-ground — twelve tables dressed in floor-length crisp white tablecloths with gold charger plates, polished wine glasses catching chandelier light, and low floral centerpieces of white roses, eucalyptus, and baby's breath. A polished wood dance floor area between the tables and the stage, its surface reflecting the chandeliers and colored uplighting. Floor-to-ceiling draped heavy velvet curtains in deep burgundy framing the stage on both sides, secured with gold rope tiebacks. The ballroom feels vast, impressive, and electrically charged — a space where a public declaration carries maximum emotional weight, where a single voice on stage can command hundreds. Evening gala atmosphere, warm dramatic lighting with theatrical contrast. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
    output: assets/scenes/SCENE-009.png
  - id: SCENE-010
    prompt_en: "A cozy and compact Beijing apartment living room viewed through a 24mm lens, warm and deeply intimate despite its smaller footprint — the unmistakable feeling of two lives merged into one modest space. Warm amber lighting from a matte black tripod floor lamp with a linen shade and a string of warm white fairy lights draped along the curtain rod above the window, casting a soft golden glow across the room. A comfortable two-seater dark grey fabric sofa with a chunky oatmeal-colored knit throw blanket casually draped over one arm, a small round walnut coffee table holding two mismatched ceramic mugs (one cream, one forest green) and a leather-bound sketchbook with a pencil tucked in the pages. A modest birch wood bookshelf against the wall, half-filled — the lower shelves hold books with Chinese and English titles, the upper shelves display a few small framed photos (faces not visible), a tiny potted succulent, and a stack of art monographs. Through the window: a distant Beijing skyline at winter dusk, the soft silhouettes of high-rise buildings including the distinctive form of the CCTV headquarters in the distance, a light dusting of snow on the exterior windowsill and on the bare tree branches visible outside — winter atmosphere, EP33 snow-proposal mood. Three unpacked moving boxes stacked neatly in the far corner with '北京' written in marker on the side, a large framed illustration of a Shanghai streetscape leaning against one box — a piece of their old life waiting to find its place. Light wood flooring with a small woven jute rug in natural fibers, an acoustic guitar in a soft case leaning in the corner, a small potted peace lily on a low stool near the window. Smaller than the Shanghai apartment, but unmistakably theirs — every object tells part of a shared story. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
