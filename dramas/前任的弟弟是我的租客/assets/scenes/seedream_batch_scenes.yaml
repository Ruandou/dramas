  - id: SCENE-001
    prompt_en: "A warm and deeply lived-in modern Shanghai apartment living room with an open kitchen, viewed through a 24mm wide-angle lens capturing the full intimate space. Warm yellow ambient lighting from a cream fabric-shade floor lamp in the corner and soft under-cabinet LED strips glowing in the kitchen. A soft beige chenille L-shaped sofa with four scatter cushions in muted rust and olive tones, a honey-toned oak coffee table holding a white ceramic mug with rising steam and a closed silver MacBook, a floor-to-ceiling birch wood bookshelf densely packed with Chinese novels displaying worn spines and art monographs, two terracotta pots with trailing golden pothos and a tall monstera deliciosa spilling over the top shelf, a fluffy cream wool-blend area rug layered on warm light-wood laminate flooring. Open kitchen in the background: white quartz countertops with subtle grey veining, white subway tile backsplash with dark grout lines, a stainless steel refrigerator door covered in colorful sticky notes and a pinned takeout menu, a small terracotta pot of fresh basil on the windowsill above the sink, sheer cream linen curtains filtering soft city light. Evening atmosphere — the glow of distant Shanghai high-rises barely visible through the window, the space wrapped in amber warmth. Photorealistic rendering, shot on 24mm wide-angle lens, natural lighting, real architectural materials. Empty environment, no people, no human figures, architectural and environmental reference only."
