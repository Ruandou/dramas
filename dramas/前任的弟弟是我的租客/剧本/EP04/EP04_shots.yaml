  - shot_id: EP04-S04
    shot_no: 4
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 6
    camera: "特写 缓推"
    description: "镜头极缓慢推近便签。淡黄色便利贴，字迹清秀工整但有棱角——钢笔写的，墨色深蓝。'辰逸'两个字最后的捺笔有一个小小的回锋，像写的人犹豫了一瞬。便签边缘微微卷起（从便签本上撕下的痕迹）。旁边的白瓷盘里，煎蛋还在冒着极细的热气，蛋黄在晨光下泛着半透明的光泽。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·凝视"
        line: "他的字——和他的人一样。安静但有棱角。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·想起"
        line: "第一天他写了'早安'。第二天写了'牛奶在微波炉'。第三天——他记得我上次说煎蛋喜欢溏心的。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·轻微不安"
        line: "一个认识不到两周的租客——为什么对你的习惯知道得这么清楚？"
    mode: i2v_ref
    reference_images:
      look_urls:
