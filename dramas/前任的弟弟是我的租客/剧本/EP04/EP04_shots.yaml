  # ===== SEG01: 清晨的香味 (SCENE-001 · 10s · 2镜) =====
  - shot_id: EP04-S01
    shot_no: 1
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 固定镜头"
    description: "小薇卧室门口。她穿着浅灰色棉质睡衣从门内走出来，棕卷发微乱披散在肩上，脸上还有枕头压出的淡淡红印。晨光从客厅落地窗斜照进来，在木地板上铺了一层淡金色。她打了个小呵欠，然后——停住了。她的鼻翼微微翕动，头转向厨房方向。空气中飘着煎蛋的焦香和黄油的甜味，混杂着现磨咖啡的醇厚气息。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·刚醒·迷糊"
        line: "又是这个味道……"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·吸鼻子"
        line: "煎蛋。黄油。咖啡——他几点起来的？"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
      scene_urls:
        SCENE-001: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/前任的弟弟是我的租客/SCENE-001.png"  # ✅ TOS permalink

  - shot_id: EP04-S02
    shot_no: 2
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "小薇的中特写。她靠在卧室门框上，双手环抱胸前——不是冷，是某种还没完全醒透的柔软。她的视线越过客厅，落在厨房吧台上。晨光在她脸上镀了一层绒毛般的柔光，眼下的淡青色遮瑕还没涂——但比起一周前退婚那晚，已经淡了很多。她的嘴角无意识地弯了一下，随即被她压平——像是不允许自己习惯这份好。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·柔软"
        line: "第七天了。他每天都比我早。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·警觉"
        line: "不要习惯。林小薇。不要习惯任何人的好。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·矛盾"
        line: "可是——煎蛋真的好香。"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
