    camera: "特写 固定镜头"
    description: "小薇的面部特写。她说完'没有'之后，嘴角维持着微笑——但瞳孔在眼眶里极轻微地晃动了一下。同事已经收回身子开始喝咖啡了，但小薇的手指在键盘边缘蜷缩了一下——指尖按在空格键上，屏幕上的PPT往下翻了一页，她完全没有注意到。她偏过头假装看屏幕，但这个角度暴露了她的耳垂——微微泛红。"
