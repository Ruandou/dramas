        emotion: "内心·停顿"
        line: "第四张。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·自问"
        line: "林小薇——你在干什么？你贴他的便签干什么？"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·防御"
        line: "只是觉得扔了可惜。不是什么别的意思。"
