    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 固定镜头"
    description: "厨房吧台。白色石英石台面上整齐摆着：一个白瓷盘——煎蛋边缘微焦、溏心蛋黄刚好凝固；两片全麦吐司烤到表面金黄；一小碗切好的草莓和蓝莓摆成扇形。盘子旁边压着一张淡黄色便利贴。旁边是一台胶囊咖啡机，已经预热好了，绿灯亮着。窗台上那盆罗勒在晨光里绿得发亮——上周小薇忘了浇水，现在叶片饱满湿润。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·读便签"
        line: "煎蛋趁热吃。牛奶在微波炉里，叮一分钟。——辰逸"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
