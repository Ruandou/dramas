        speaker: CHAR-001
        emotion: "内心·愣住"
        line: "热水？是热水——"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·震惊"
        line: "这个热水器坏了一个多月了。物业来了三次，每次都说等配件。他——他什么时候修的？"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·不敢相信"
        line: "他自己修好的。一个租客——把房东家的热水器修好了。"
