    camera: "特写 固定镜头"
    description: "她的手部特写。她撕下那张便签——很轻地，指甲小心地从台面上掀起一角，然后完整地揭下来。她没有揉掉，也没有扔进垃圾桶。她看了两秒，然后把便签贴在了冰箱门上——那里已经贴了三张同样颜色的便签，排列成一小排。她的手指在便签边缘轻轻按了一下，让它贴得更牢。然后她的手指在便签上方停了一秒——像在数。"
    dialogue:
