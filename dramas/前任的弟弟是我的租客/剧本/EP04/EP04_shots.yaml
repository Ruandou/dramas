    description: "小薇坐在吧台高脚凳上，一条腿蜷起来踩着凳杠。她咬了一口吐司，慢慢嚼——腮帮子鼓起来，眼神放空。晨光从窗户斜射到她侧脸上，睫毛在颧骨上投下细碎的阴影。她的睡衣袖口有点长，盖住了半只手，只露出指尖捏着吐司边。整个人窝在晨光里，像一只还没完全醒来的猫。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·咀嚼"
        line: "他应该已经出门了。每天都是——我起来的时候，他人已经走了。"
