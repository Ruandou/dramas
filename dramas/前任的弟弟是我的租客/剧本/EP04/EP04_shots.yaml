    camera: "特写 缓推"
    description: "她的眼睛特写。棕色的虹膜在冷白灯光下看起来很清澈——但里面有一种新的情绪在翻涌。不是恐惧，不是快乐，是某种介于'被触动'和'被困扰'之间的东西。她盯着屏幕上PPT的某一页——标题是'Q2工作计划'，但她一个字也没看进去。镜头极缓慢地向她的眼睛推近，瞳孔里映出屏幕的微光，但她的视线的落点根本不在屏幕上。"
