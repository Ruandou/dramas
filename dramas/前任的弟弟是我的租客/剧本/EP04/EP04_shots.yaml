    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "她走进浴室——打算先洗手。拧开水龙头，手放在水流下——突然她整个人顿住了。她迅速把手缩回来，又伸过去，让热水冲在掌心上。她盯着水龙头——那个坏了一个多月、物业来了三次都没修好的热水器——出水口正稳定地冒着蒸汽。她弯下腰，侧头看向热水器：控制面板的指示灯正常亮着绿色，不再是之前那个闪烁的故障红灯。水温稳定而均匀。"
    dialogue:
