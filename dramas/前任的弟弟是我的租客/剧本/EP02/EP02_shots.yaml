    duration_sec: 5
    camera: "特写 固定镜头"
    description: "小薇的面部特写。她微笑着听他回答——但眼底的笑意是僵的，嘴角弧度维持得有些吃力。她盯着他的袖口：一片暗色油渍，不知是什么时候沾上的。她的瞳孔微微右移——瞥向自己干净整洁的茶几，然后视线转回来，但笑容已经收不住了。"
    dialogue:
      - type: spoken
        speaker: 邋遢男
        emotion: "懒散·拖沓"
        line: "没啥要求。有床就行。"
      - type: spoken
        speaker: 邋遢男
        emotion: "补充"
        line: "对了，月租能便宜不？我上份工作刚辞——暂时手头有点紧。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·警惕"
        line: "没有稳定收入。衣服三天没换了。"
      - type: spoken
        speaker: 小薇
        emotion: "挤出微笑"
        line: "好的，我再考虑一下，有消息通知你。"
