    description: "辰逸站在沙发旁边，手里拿着自己的那杯咖啡——黑的，没加糖没加奶。他顺着她的视线看向雏菊，又看向她。他的表情极其平静，甚至有一丝不易察觉的歉意——像一个不小心暴露了太多的人。阳光透过奶油色窗帘在他镜片上形成一小块柔和的反射，遮住了他眼底的细节。小薇看着他，手里还握着咖啡杯，拇指在杯沿上轻轻摩挲——这是她在试图理解什么时的小动作。"
