    description: "小薇走近沙发。她一边擦头发一边绕到茶几对面——步履很轻，毛绒拖鞋踩在羊毛混纺地毯上几乎没有声音。她的眼睛落在他压在包下的素描本上——牛皮封面露出一角，边缘磨损泛白。她嘴角浮起一个微笑——带着刚洗完澡的热气、一点好奇、一点打趣。她的头发还在往下滴水，在她睡衣肩膀处晕开两个小小的深色水渍。落地灯的暖光从侧面打在她脸上，让她的笑显得格外软。"
    dialogue:
      - type: spoken
        speaker: CHAR-001
        emotion: "调侃·眼睛弯起来"
        line: "画女朋友啊？藏那么快。"
    mode: i2v_ref
