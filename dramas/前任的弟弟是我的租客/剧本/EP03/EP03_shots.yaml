    description: "素描本打开——一个对开跨页。左页：铅笔素描——一个女生仰头大笑。她的棕色中长发被风扬起，眼睛弯成两道月牙，嘴角上扬的弧度画得极其精细——连笑纹的走向都被铅笔捕捉到了。背景是模糊的樱花树枝，花瓣几笔带过。线条干净利落，有职业插画师的掌控力。但是右下角的线条相比其他部分略显生涩——像一个还在练笔的人在努力画好。右下角有一行铅笔小字标注日期。右页：同一个女生——但角度变了。这次她低着头在看什么东西，侧脸被一束光打亮，睫毛在脸颊上投出阴影。沉思的表情画得极其专注——铅笔的排线层层叠叠，营造出柔和的灰度过渡。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·回忆·声线不自觉放柔"
        line: "2019年秋天。樱花早谢了——但她在樱花树下拍毕业照那天，是我第一次按快门。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·低声"
        line: "快门不够——我想画下来。画下来就不会忘。"
    mode: t2v
    reference_images: {}  # t2v mode: close-up of sketchbook pages, no character/scene refs

