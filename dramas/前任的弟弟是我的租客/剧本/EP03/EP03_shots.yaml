    camera: "中景 固定镜头"
    description: "电梯门打开——走廊冷白荧光灯均匀地铺在地面上。陆辰逸从电梯里走出来：深灰色连帽卫衣，白色T恤内搭领口露出一道边，细框眼镜后的眼睛干净安静。他右手拖着一个黑色登机箱，左手臂弯里夹着一个折叠木制画架——A字型画架用帆布绑带束着，原木纹理在走廊冷光下泛着淡淡的暖。背上的黑色帆布斜挎包鼓着——里面隐约是画具。整层楼的走廊安静地延展，六扇深色胡桃木公寓门均匀排列。他的球鞋踩在灰色抛光地砖上几乎没有声音。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·安静"
        line: "就是这个楼层。六楼。她的门牌号——601。"
