    description: "门从内打开。林小薇站在玄关——米色针织衫外系了一条米白围裙，棕色微卷中长发用鲨鱼夹随意夹在脑后，几缕碎发垂在耳侧。她看到辰逸时眼睛下意识弯了一下——不是刻意微笑，是被他的干净和安静轻微电到的本能反应。上午阳光从客厅窗户斜照进来，在她身后投出温暖的光晕。辰逸站在门口，逆光的轮廓在暖黄与走廊冷白的交界处，像走进另一个世界。"
    dialogue:
