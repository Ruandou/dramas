    prop_ids: []
    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "辰逸的中特写。他坐在沙发上——手还按在斜挎包上，指节微微泛白，指尖抵在牛皮封面上。他听到\"女朋友\"三个字时，嘴唇动了动——不是准备回答，是咽下了什么。镜片后面的眼睛抬起来看了她一眼——一瞬。那一瞬的眼神复杂极了：有点像被刺中秘密的人，又有点像被她说中了什么却不敢承认的人。然后他低下头——黑发遮住了眉毛，手指从素描本上慢慢松开。他既没有否认。也没有承认。他只是把素描本往包里推了推。"
    dialogue:
      - type: spoken
        speaker: CHAR-002
        emotion: "沉默了两秒·轻声"
        line: "不是。"
      - type: spoken
        speaker: CHAR-002
        emotion: "补充·声音更低·不看她的眼睛"
        line: "……随便画几笔而已。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·捕捉到他的闪烁"
        line: "'不是'。但他在说'不是'的时候——不敢看我。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·一丝说不上来的直觉"
        line: "他肯定在画一个人。而且那个人——他不想让我知道是谁。"
