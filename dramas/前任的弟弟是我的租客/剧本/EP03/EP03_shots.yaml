    duration_sec: 6
    camera: "中特写 缓推"
    description: "她走到床边坐下——床垫微微凹陷。她把毛巾搭在脖子上，双手放在膝盖上，十个手指交叉握在一起。床头灯在她脸上制造了柔和的明暗：一半在暖光里，一半在阴影里。她低下头，湿发垂下来遮住了半边脸。然后她抬起头——眼睛里有某种东西在慢慢沉淀：困惑、不安、和被触动的柔软混在一起。镜头缓缓推近她。窗外夜色已深——远处高楼的灯光透过纱帘变成模糊的光斑，像城市在呼吸。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·数算·声音轻但清晰"
        line: "他知道我咖啡加多少糖。他知道我百合花粉过敏。他做了我最爱吃的菜。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·十字路口"
        line: "一个陌生人不该知道这些。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·某个微弱的猜测"
        line: "除非——他不是陌生人。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·想起他藏素描本的动作"
        line: "还有那个本子。他藏起来的那一刻——像被人抓住了秘密。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·深呼吸·决定暂时搁置"
        line: "林小薇。别想太多。也许只是……巧合。也许他只是——观察力好。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·但她知道不是巧合"
