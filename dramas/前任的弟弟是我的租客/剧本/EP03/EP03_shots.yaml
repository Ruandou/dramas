    description: "小薇的手停在半空中。咖啡勺悬在杯口上方——银色勺子里堆着深褐色的粉末，她的手没有抖，但整个动作僵住了两秒。镜头从她的手缓缓推到她脸上：她的睫毛颤了一下，眼睛没有立刻看向辰逸——她先盯着自己手里的咖啡勺，像在确认自己没听错。然后她偏头看向他，表情不是惊吓，是一种更复杂的——好奇中带着一根细细的警觉的刺。上午阳光从百叶窗缝隙落在他拿糖罐的手指上，骨节分明，动作安静。"
