    description: "他在601号门前停下。门牌号在拉丝不锈钢面板上微微反光。他把画架靠在墙边，抬手——手指悬在门铃上方停了一秒。不是犹豫，是某种仪式感的停顿。然后他按下去——克制而清晰的两声。走廊里只有电梯低频的机械嗡鸣和他自己的呼吸。他低头看了一眼自己的行李箱——就这一个箱子。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·深呼吸"
