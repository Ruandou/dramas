        speaker: CHAR-001
        emotion: "内心·对比·酸涩"
        line: "连辰轩——在一起三年都不知道我咖啡要放糖。他每次都给我点美式。"
      - type: spoken
        speaker: CHAR-001
        emotion: "收回视线·故作轻松"
        line: "……对。一勺半。你记性真好。"
      - type: spoken
