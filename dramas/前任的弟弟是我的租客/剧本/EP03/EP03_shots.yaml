    description: "又一页——女生在吃饭。筷子夹起一块红烧排骨正要往嘴里送，腮帮子鼓起来一点，眼睛满足地眯着。桌子对面伸出一只手——手指修长，正在帮她擦掉嘴角的酱汁。这是辰逸想象中的视角——画里那只手，是他自己的。铅笔把排骨的酱色光泽画得极逼真——用不同方向的排线叠加出琥珀色的反光。线条比前面几页更自信、更自由。"
