    duration_sec: 6
    camera: "中特写 固定镜头"
    description: "小薇的中特写。她放下筷子——筷尖搭在碗沿上，发出很轻的\"嗒\"一声。她看着辰逸，表情在暖黄灯光下显得柔软，但眼睛里有一点专注的、观察的锐利——像在解一道题。辰逸正在喝汤，白色的汤匙在他修长的手指间显得很小。他没有抬头看她，但他的动作有一瞬间的放慢——他感受到了她的目光。她嘴角还有排骨酱汁留下的很淡的一点痕迹，但她没擦。"
    dialogue:
      - type: spoken
        speaker: CHAR-001
        emotion: "试探·语气轻松但眼睛不轻松"
        line: "你才搬进来一天——我怎么觉得，你好像在这儿住了很久了。"
      - type: spoken
        speaker: CHAR-002
        emotion: "放下汤匙·看她·安静"
        line: "是吗。"
      - type: spoken
        speaker: CHAR-001
        emotion: "追问·声音轻"
        line: "你平时一个人住，也做这些？"
      - type: spoken
        speaker: CHAR-002
        emotion: "对视一秒·然后垂眼·声音更轻了"
        line: "不。一个人的时候——不做红烧排骨。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·这句话击中了她·停顿"
        line: "不做红烧排骨。所以——今天是特意做的。"
