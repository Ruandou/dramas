    description: "厨房水槽前。小薇挽起袖子在洗碗——水龙头的水声哗哗响，白色碟子在她手里翻转，泡沫从指缝滑下。辰逸站在她旁边，伸手去拿她洗好的盘子准备擦干。小薇侧身用胳膊肘轻轻挡开他——一个很自然的\"我洗就行\"的动作。辰逸的手停在半空，然后收了回去。他靠在石英石台面边缘，手指无意识地摩挲着台面边缘——但不走，就站在她斜后方两步的位置。"
