    description: "辰逸面部大特写。走廊里唯一的暖光细线刚好从下方打在他脸上——不讨好的死亡角度，却反而让他的表情无处可藏。他的皮肤比平时更白——不是白皙，是失血后的苍白。嘴唇抿成一条几乎没有血色的线。他的凤眼平时是安静干净的——此刻眼白有点泛红，瞳孔里有剧烈晃动的光。他整个人像被冻在了原地——手还搭在门框上，指节抵着木框边缘，指甲因为用力而变成白色。他的呼吸极轻极缓慢，像怕自己的存在本身发出声音。从门缝里又漏出一句话——模糊的，但能听出是小薇的声音，和闺蜜的手机那头传出的快速追问。"
    dialogue:
