    description: "辰逸站在客厅里，手里拿着叠好的抹布。他看着厨房方向——小薇的背影。暖黄灯光笼罩着她，她正在用干布擦一个已经擦了三遍的盘子。辰逸的表情在无人注视时终于松了下来——不是放松，是卸下伪装的疲惫。他的嘴唇微启，像想说什么，但只吸了一口气又合上。他把抹布叠好放在茶几角上，转身走向走廊。步伐比平时少了一点轻盈——多了一点不易察觉的沉重。他的右手在卫衣口袋里握成了拳，口袋布料微微鼓起。"
