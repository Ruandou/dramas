        speaker: CHAR-001
        emotion: "内心·观察"
        line: "他没有问'你前任叫什么'。一个正常人听到这句话——第一反应应该是好奇。除非——他不需要问。他已经知道了。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·确认"
        line: "陆辰逸。你知道。你什么都知道。"
