    description: "小薇站在厨房水槽前洗碗。水龙头流出的温水冲刷着白色瓷碗，蒸汽氤氲在她脸上。她没有回头，但她的耳朵在听——客厅方向，辰逸正在收拾桌子。碗碟碰撞的声音比平时慢了半拍。她把手里的碗翻过来冲底部——这个动作重复了两遍，无意义的重复。水流声盖住了她轻微的叹息。她关掉水龙头。厨房安静下来。客厅也没有声音。"
