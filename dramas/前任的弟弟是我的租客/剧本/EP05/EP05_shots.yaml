    description: "从走廊的另一端看向辰逸——他的全身中景。他赤脚站在自己卧室门口，门框像一个画框把他框在里面。走廊黑暗，只有来自小薇门缝的那条金色光线——它横在地板上，正好切在他的赤脚前，像一道他不敢跨越的界线。他身后的卧室是黑的，画架立在窗边——月光勾出A型画架的轮廓和上面那本打开的素描本（PROP-001）。他侧着头，看着走廊尽头那扇漏光的门——姿势像被钉在十字架上，动不了，也不想动。镜头极缓慢地向他推近——画面中唯一的光源就是他脸上和脚前的那条金线。"
