    description: "辰逸的大特写——筷子停在半空中。一块排骨夹在两根筷子之间，悬在碗上方五厘米处。他的手指僵住了——指节因为突然停住的动作而泛白，但筷尖稳稳地没有抖动。他脸上的表情经历了三个阶段，都在不到一秒内切换：先是瞳孔微微放大（被击中），然后是下颌线收紧（本能防御），最后——他眨了两次眼，把筷子放回碗里，重新露出平时的安静微笑。速度极快，像什么都没发生。但那双凤眼深处，刚才的暖光不见了——换成了一种很深的、几乎看不出的小心。"
