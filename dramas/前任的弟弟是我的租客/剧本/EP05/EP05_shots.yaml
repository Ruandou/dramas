    camera: "中景 固定镜头"
    description: "走廊——小薇卧室门缝里的光熄灭了。走廊瞬间沉入完全的黑暗，只剩远处窗户透进来的一丝极淡的城市微光。辰逸还站在他的门口——现在连那条金色的界线也消失了。他慢慢把搭在门框上的手收回来，动作极轻极慢——像怕手臂碰到任何东西发出声音。他的身影在黑暗中是一个更深的剪影。他退回自己房间——没有关门，只是退到门框以内。然后他极轻地、极慢地把房门合上。门锁扣合的咔哒声——在安静的走廊里响得刺耳。他靠在门板上，在黑暗中闭上了眼睛。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·黑暗中"
        line: "她睡了。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·沉默"
        line: "明天早上——我该说什么？'对不起，我骗了你'——还是'对不起，我是认真的'？"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·绝望"
        line: "她会问我为什么。她会让我解释——一个她前男友的亲弟弟，为什么搬进她的公寓，在她身边住了这么久。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·最后一个念头"
        line: "我该怎么告诉她——我等了五年，不是为了骗她。是为了爱她。"
