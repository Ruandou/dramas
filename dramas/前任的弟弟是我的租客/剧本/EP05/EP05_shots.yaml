        emotion: "内心·缺氧"
        line: "她要赶我走吗？"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·绝望"
        line: "她一定会的。我是骗了她的人——我是她前男友的亲弟弟——搬进她的公寓，假装什么都不认识。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·惊恐"
        line: "她刚才在电话里说'我还没想好'。没想好——意思是她在考虑让我走。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·自我审判"
        line: "陆辰逸。你等了五年——换来的就是这一刻。她终于知道了。而你对她说过的所有话——每一句'刚好'、每一个安静的微笑——现在在她眼里都变成了骗局的一部分。"
