    duration_sec: 6
    camera: "中特写 固定镜头"
    description: "小薇的卧室。她挂了电话——手机屏幕暗下去，被她轻轻放在床头柜上。她靠着床头，仰面看着天花板。环形灯的暖光在她脸上投下柔和的阴影。她的表情不是痛苦——是某种下定决心的平静。她伸手拉了一下床头灯的开关——房间沉入黑暗，只有窗帘缝隙透进来的城市微光。她躺下去，侧身面向窗户。眼睛还睁着，映着远处高楼的零星灯火。看不见她的表情，只能看到她蜷缩的背影。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·挂电话后"
        line: "苏妍问我要不要赶他走。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·平静"
        line: "赶走他——是最简单的选择。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·转折"
        line: "但——我还没有问他。我要听他亲口跟我说。不是我在网上搜到的照片，不是名片背面的手写字——是他自己开口。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·最后"
        line: "陆辰逸——明天早上。我们谁先开口？"
    mode: i2v_ref
