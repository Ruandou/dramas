    description: "双人中景——桌子的宽度隔在两人之间。小薇的上半身微微前倾，手伸向桌子对面的他。辰轩的手从桌上收回，放到了自己膝盖上——一个明确的拒绝触碰的信号。白色桌布上，烛台的火苗在两人之间摇曳，把影子拉成两个方向。"
    dialogue:
