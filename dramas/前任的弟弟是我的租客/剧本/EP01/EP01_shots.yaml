    look_ids: [CHAR-001-L01]
    prop_ids: [PROP-002]
    duration_sec: 5
    camera: "特写 固定镜头"
    description: "她的手搭在白色桌布上，六爪铂金钻戒在烛光中折射出细碎光芒。她的拇指无意识地转动戒圈——这是她紧张又甜蜜时的习惯动作。背景虚化，只有戒指清晰。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 甜蜜
        line: "这枚戒指……我每天都戴着。今晚，他应该会正式说出来了吧。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 紧张
        line: "怎么还没来……"
