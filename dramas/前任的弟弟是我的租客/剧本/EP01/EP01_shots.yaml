  # ===== SEG02: 冷漠的登场 (SCENE-006) =====
  - shot_id: EP01-S03
    shot_no: 3
    scene_id: SCENE-006
    char_ids: [CHAR-003]
    look_ids: [CHAR-003-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 固定镜头"
    description: "陆辰轩从餐厅入口走来，深蓝色定制西装，黑发一丝不苟。他步伐僵硬，面色紧绷，眉头深锁——眉头间那道常年皱出的竖纹异常明显。他没有看小薇，视线落在桌上某个虚空的位置，径直坐下。"
    dialogue:
      - type: spoken
        speaker: CHAR-001
        emotion: "欣喜·微笑"
        line: "辰轩，你来了！我还以为堵车——"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-003-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-003-L01.png"  # ✅ TOS permalink
      scene_urls:
        SCENE-006: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/前任的弟弟是我的租客/SCENE-006.png"  # ✅ TOS permalink

  - shot_id: EP01-S04
    shot_no: 4
    scene_id: SCENE-006
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 6
    camera: "中特写 固定镜头"
    description: "小薇的笑容在脸上凝固。她的眼睛从他进门时的弯月形逐渐恢复平直——她注意到了：他没有看她。他的手交握在桌上，指节因为用力而泛白。她嘴角的弧度慢慢消失，取而代之的是困惑和隐隐的不安。"
    dialogue:
      - type: spoken
        speaker: CHAR-003
        emotion: "冷漠·打断她·不看她"
        line: "小薇。你先坐下。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 察觉异样
        line: "他今晚不对劲。手指一直在敲桌面。他不看我的眼睛。"
      - type: spoken
        speaker: CHAR-001
        emotion: "试探·轻声"
        line: "你……怎么了？"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
      scene_urls:
        SCENE-006: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/前任的弟弟是我的租客/SCENE-006.png"  # ✅ TOS permalink

  # ===== SEG03: 退婚宣言 (SCENE-006) =====
  - shot_id: EP01-S05
    shot_no: 5
    scene_id: SCENE-006
    char_ids: [CHAR-003]
    look_ids: [CHAR-003-L01]
    prop_ids: []
    duration_sec: 5
    camera: "特写 固定镜头"
    description: "陆辰轩的面部特写：他薄唇紧抿，喉结上下滚动了一次——是吞咽，不是准备说话。眼神始终回避镜头方向（小薇的位置），落在桌面烛台上。烛火在他瞳孔里跳动，但他的表情像被冻住了。他开口时声音很轻，像从很远的地方传来。"
    dialogue:
      - type: spoken
        speaker: CHAR-003
        emotion: "冷漠·不看她的眼睛"
        line: "我们不合适。"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-003-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-003-L01.png"  # ✅ TOS permalink
      scene_urls:
        SCENE-006: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/前任的弟弟是我的租客/SCENE-006.png"  # ✅ TOS permalink

  - shot_id: EP01-S06
    shot_no: 6
    scene_id: SCENE-006
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 6
    camera: "中特写 缓推"
    description: "小薇的中特写。她的睫毛颤动了一下——先是没听懂。然后她微微偏头，像在确认自己听错了。嘴唇张开又合上。镜头极缓慢地向她推近，捕捉她瞳孔里烛光从温暖变成刺眼的过程。她的手指仍搭在桌沿，维持着刚才想去碰他手的姿势，现在僵在半空。"
    dialogue:
      - type: spoken
        speaker: CHAR-001
        emotion: "震惊·声音轻得几乎听不见"
        line: "……什么？"
      - type: spoken
        speaker: CHAR-003
        emotion: "依旧不看她·重复"
        line: "我说，我们不合适。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 崩塌
        line: "不合适？三年了……他选在今天，告诉我——不合适？"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
