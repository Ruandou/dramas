    shot_no: 8
    scene_id: SCENE-006
    char_ids: [CHAR-003]
    look_ids: [CHAR-003-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 镜头跟随"
    description: "辰轩站起身。他的动作快而僵硬，椅子在地板上发出轻微的刮擦声。他没有回答她的问题，只是从西装内袋掏出钱包，抽出几张钞票放在桌上——不是买单，是结束。然后他转身走向餐厅门口，步伐快得像在逃离。整个过程没有看她一眼。"
    dialogue:
      - type: spoken
        speaker: CHAR-003
        emotion: "背对她·声音发虚"
        line: "没有理由。戒指你留着吧。或者扔了——随你。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 绝望
        line: "他甚至不愿意编一个理由给我。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 破碎
        line: "三年的感情。连一句解释都不值得。"
    mode: i2v_ref
    reference_images:
