    duration_sec: 5
    camera: "中景 固定镜头"
    description: "高档餐厅靠窗双人桌，白色亚麻桌布上摆着银质烛台和两支红酒杯，窗外是城市傍晚的蓝调天际线。林小薇穿着米色针织衫，棕色微卷中长发散落肩头，她时而望向门口，时而低头轻抚左手无名指上的钻戒（PROP-002），嘴角带着期待的微笑。暖色烛光映在她脸上。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: 期待
        line: "今天是我们在一起三周年的纪念日。他说……有重要的事情要告诉我。"
    mode: i2v_ref
    reference_images:
      look_urls:
