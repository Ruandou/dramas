    description: "小薇的中特写。她盯着桌上那枚摘下来的戒指，眼眶里有泪水打转但没有落下。她的下唇被自己咬得发白，然后她闭上眼，深吸一口气。再次睁眼时，泪光还在，但表情变成了某种强行撑起来的镇定。窗外天色已经完全暗下来，城市的灯光透过玻璃映在她侧脸上。"
    dialogue:
