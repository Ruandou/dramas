    duration_sec: 6
    camera: "中景 固定镜头"
    description: "厨房台面旁。小薇走到咖啡机前——辰逸侧身让开半步，距离控制得极其精确：退得不远不近，刚好不会碰到她，又刚好让她知道他注意到了她的存在。她端起自己那杯咖啡，指腹贴住温热的陶瓷杯壁。她低头吹了吹咖啡表面，雾气散开。然后她抬眼看辰逸——他正在往自己杯子里加一勺半糖。动作停顿了零点几秒——他知道她在看他。但他没有抬头。"
    dialogue:
      - type: spoken
        speaker: CHAR-001
        emotion: "轻声·语气比平时更平和"
        line: "早。"
      - type: spoken
        speaker: CHAR-002
        emotion: "没有抬头·声音压得比平时更低"
        line: "早。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·察觉"
        line: "他不敢看我的眼睛。昨天之前他至少还会微笑点头。现在——连对视都省了。他知道我知道了。"
