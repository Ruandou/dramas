  - shot_id: EP06-S24
    shot_no: 24
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "玄关。她的右手握住门把手——拉丝不锈钢，冰凉的。她深吸一口气，从猫眼往外看——但猫眼里的走廊灯光和站在门口的人影让她瞬间僵硬了。她的左手抬起来捂住嘴——不是害怕，是一种'不会吧'的震惊。她的瞳孔在猫眼透镜后放大。然后她极慢地把手从嘴上移开，垂到身侧，握着门把手的右手——拧开了锁。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·认出·声音几乎卡在喉咙里"
        line: "是——他。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·混乱"
        line: "陆辰轩。他为什么会在这里。今晚——偏偏是今晚。"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
