    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "小薇端着咖啡走向沙发。经过书架时她的余光扫过那排白桦木书脊——上周那张名片（PROP-003）就是从其中一本书里掉出来的。她的脚步没有停，但手指在咖啡杯上收紧了一下。她在L型沙发的一端坐下，把腿蜷起来，膝盖抵着沙发扶手。窗外的晨光在她脸上铺了一层薄薄的浅金色，但她的眼神是醒着的——不是困，是全神贯注。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·复盘"
        line: "那张名片——'辰逸，哥的电话你存一下'。上周我从书架上发现的。我当时以为只是巧合。现在我知道了，那是陆辰轩亲笔写给他的。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·决定"
        line: "不要问。至少——不是现在。再等等。等他自己说。"
