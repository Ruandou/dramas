        speaker: CHAR-001
        emotion: "内心·准备"
        line: "问他。现在。不是质问他为什么骗你——是问他到底是谁。这五年，他在你生活里扮演了什么角色。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·害怕"
        line: "但如果他说——'对不起，我马上搬走'——怎么办？"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·否定"
        line: "那就让他走。但至少——我要一个答案。"
