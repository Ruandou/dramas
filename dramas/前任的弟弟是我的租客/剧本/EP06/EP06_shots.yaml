        emotion: "内心·观察"
        line: "他今天没有在画我。他的素描本翻到了新的空白页——但他画不出来。以前每天晚上，他都在画。画咖啡杯、画书架、画窗外的夜景——但都是借口。他画的一直是我。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·心疼"
