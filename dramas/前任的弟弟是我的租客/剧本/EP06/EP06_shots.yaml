        speaker: CHAR-001
        emotion: "内心·集结"
        line: "够了。林小薇。你已经看了他一整天了。你发现了提拉米苏。你拼出了所有碎片。你知道他从他哥那里了解了你的每一个细节——喜欢什么、讨厌什么、过敏什么。但你不知道最重要的事情——他是谁。不是名字。是——你是谁，陆辰逸。"
