    description: "全景——从公寓深处向玄关方向拍摄。画面被切割成三个层次：前景——小薇站在门口，侧身，一手还扶着门框，暖黄与冷白两种光在她身上交叠，她处于两种光、两个人、两种过去之间的正中位置。中景——门框之外，走廊冷白荧光灯下，陆辰轩一身深蓝西装，眉头深锁，手里攥着信封，他的影子投在走廊地板上，被拉成一个细长扭曲的形状。远景——客厅暖黄灯光下，陆辰逸站在书架前，没戴眼镜，素描本和铅笔还留在他脚边的地毯上。三个人。一扇门。两个世界的光在门口交汇。暖黄和冷白在门框处各占一半——像对峙，也像一个即将被打破的平衡。画面定格。"
