    description: "小薇的中特写——她微微偏头，从笔记本电脑屏幕边缘上方悄悄看他。她的眼睛藏在屏幕的冷白光后面，但目光是真切的、直接的。看的是他的手指——握铅笔的手指，停在空白纸页上的手。没有在画她。他今天没有画她。她注意到了。她的喉结上下动了动，然后她收回目光，睫毛垂下来遮住了一半的瞳孔。"
