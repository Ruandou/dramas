  - shot_id: EP06-S26
    shot_no: 26
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中特写 固定镜头"
    description: "小薇的中特写——她站在门内，身体重心不自觉地向后退了半步。暖黄灯光从她背后照来，把她框成一个逆光的剪影，面部特征半隐在阴影里。门外的冷白光从正面打在她脸上——两种色温在她身上交叠，左边脸偏暖金，右边脸偏冷白。她的手还扶着门把手，忘了松开。嘴唇微张——没有叫他的名字，没有说'你怎么来了'，只是看着他，像在看一个本该只存在于过去的幽灵突然走进现在。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·冻结"
        line: "陆辰轩。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·困惑·不安"
        line: "为什么是今晚。偏偏是他正要回答我的时候。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·警觉"
        line: "他喝了酒。他的眼睛是红的。他不是来闲聊的。"
    mode: i2v_ref
    reference_images:
