    description: "辰逸的面部特写。在她说出'陆辰轩是你哥'的瞬间，他的表情没有崩塌——而是安静地闭合了。眼睛垂下，睫毛在镜片后投下阴影。然后——他做了一个动作：把素描本从膝盖上拿起来，合上，放到身边的地毯上。动作很慢、很稳，像在放下一件很重的东西。然后他摘下了细框眼镜——用左手，食指和拇指捏住镜腿——轻轻放在素描本的封面上。没有了眼镜的遮挡，他的眼睛毫无保留地暴露在暖黄灯光下：窄长清澈的凤眼，瞳孔深邃，里面有一层薄薄的水光——不是眼泪，是比眼泪更克制的、被压抑了很久的东西。然后他抬起头，直视她的眼睛。全剧第一次——他准备回答。"
    dialogue:
      - type: spoken
        speaker: CHAR-002
        emotion: "声音比平时更慢·更低·每个字都像经过长久的准备"
