    duration_sec: 4
    camera: "中景 固定镜头"
    description: "陆辰轩站在门口的中景——走廊在他身后延伸成一条无尽的冷白隧道。他看到小薇的瞬间，眉头皱得更紧了——不是愤怒，是那种见到一个你亏欠过的人时无法掩饰的狼狈。他的喉结动了动，攥着信封的左手收紧，牛皮纸发出轻微的褶皱声。他张开嘴想说什么——但话还没出口，他的视线越过了小薇的肩膀，看到了客厅里面的某样东西。他的表情在零点几秒内从狼狈变成了某种更暗的东西——瞳孔猛然收缩。"
    dialogue:
      - type: spoken
        speaker: CHAR-003
        emotion: "看到什么·声音卡在喉咙里"
        line: "你——"
