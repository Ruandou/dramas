    duration_sec: 6
    camera: "中特写 固定镜头"
    description: "她的中特写。她站在打开的冰箱门前——冷白光从下方打在她脸上，在她额骨和鼻梁上制造了不寻常的光影。她的右手仍握着冰箱门把手，指节泛白。嘴唇微张——想说什么但什么都没说。她慢慢抬起左手，用指尖轻轻碰了一下那盒提拉米苏的盖子。塑料盖是冰的。她的嘴角动了一下——不是笑，是一种苦涩的、终于明白的表情。然后她回头——透过厨房的开放视角看向客厅。辰逸正背对着她站在书架前，手里拿着一本书，但页没有翻。他的肩膀绷得很紧。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·沉重"
        line: "他知道我喜欢提拉米苏——只可能从一个渠道得知的：辰轩。过去的三年里，他一直在从他哥那里了解我。我的喜好、我的习惯、我的生活——像一个旁观者，远远地收集关于我的一切。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·混乱"
        line: "这算什么？暗恋？偷窥？还是——比那更复杂的东西？"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·自嘲"
        line: "而我——到现在才发现。"
