    duration_sec: 5
    camera: "中景 固定镜头"
    description: "清晨阳光透过奶油色亚麻窗帘洒进开放式厨房，光线还是偏冷的浅金色。陆辰逸站在白色石英石台面前——深灰色卫衣、白T内搭、黑发略遮眉、细框眼镜——正在手冲咖啡。他的手很稳，热水注入时画着细密的同心圆。白色陶瓷杯旁边已经放好了一杯——那是小薇的杯子（杯沿有细微的咖啡渍痕迹，是她惯用的那只）。他做完后没有立刻端走自己的那杯，而是站在台面前低头看了两秒咖啡壶，像在想什么，然后轻呼一口气。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·小心"
        line: "昨天她在电话里说——'我怀疑我的租客是我前男友的弟弟'。她知道了。但她没有质问我。"
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·不安"
        line: "她越沉默，我越不知道她在想什么。"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-002-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-002-L01.png"  # ✅ TOS permalink
      scene_urls:
        SCENE-001: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/前任的弟弟是我的租客/SCENE-001.png"  # ✅ TOS permalink

  - shot_id: EP06-S02
    shot_no: 2
    scene_id: SCENE-001
    char_ids: [CHAR-001]
    look_ids: [CHAR-001-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 固定镜头"
    description: "卧室门打开。林小薇走出来——米色针织衫外披了一件浅灰开衫，棕卷发还带着刚睡醒的蓬松，眼下依然有熬夜后的淡青。她在走廊口停了一秒，看到厨房里辰逸的背影。她的目光从他肩膀上的线条滑落到台面上那两杯咖啡——一杯已经放在她惯常坐的沙发位置对应的方向。她的睫毛低垂了一下，然后她走向厨房。脚步比平时轻——像在避免制造多余的声响。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·停顿"
        line: "他还在。昨晚听到我打电话之后——他还在。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·观察"
        line: "两杯咖啡。他知道我会在这个时间起床。和过去的每一天一样——他什么都知道。"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-001-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-001-L01.png"  # ✅ TOS permalink
