  # ===== SEG13: 门外的人 =====
  - shot_id: EP06-S25
    shot_no: 25
    scene_id: SCENE-001
    char_ids: [CHAR-003]
    look_ids: [CHAR-003-L01]
    prop_ids: []
    duration_sec: 5
    camera: "中景 固定镜头"
    description: "门从内向外推开——走廊的冷白荧光灯从门缝涌入玄关，在地板上切割出一道锐利的明暗分界。门外站着一个男人——深蓝色定制西装，白色衬衫最上面两颗扣子松开，领带微微拉松，像刚从某个正式场合离开。他的黑发一丝不苟但有一缕垂在额角——不是造型，是疲惫。眉头深锁，眉心那道常年皱出的竖纹在冷白灯光下像一道刀刻的痕迹。他的眼睛带着某种复杂的情绪——愧疚、焦虑、以及一丝被酒精染红的血丝。右手还悬在半空——刚刚按完门铃的姿势。左手攥着一个牛皮信封。陆辰轩——三个半月来首次真人出镜。"
    dialogue:
      - type: sound_effect
        speaker: null
        emotion: null
        line: "走廊冷白荧光灯的低频嗡鸣"
    mode: i2v_ref
    reference_images:
      look_urls:
        CHAR-003-L01: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/前任的弟弟是我的租客/CHAR-003-L01.png"  # ✅ TOS permalink
