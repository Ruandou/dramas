    duration_sec: 5
    camera: "中景 镜头跟随"
    description: "小薇转身，向玄关走去。她的赤脚踩在木地板上发出轻微的回音，经过奶油色地毯边缘，经过书架。她的手无意识地顺了一下额前垂下的头发——然后她想起什么，回头看了一眼辰逸。他还坐在地毯上，摘下眼镜后的脸在暖黄灯光下看起来比平时更年轻，也更脆弱。他也在看她——眼神里有一种她从未见过的东西：不是害怕被发现，是害怕她开门后——一切都会变。她的脚步停了一秒。然后继续走向门口。"
