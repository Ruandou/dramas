    duration_sec: 6
    camera: "中景 固定镜头"
    description: "辰逸坐在书架旁的地毯上。他背靠着书架最底层，双腿交叉，素描本（PROP-001）摊开在膝盖上。暖黄灯光从他侧面照来——他的侧脸一半在光里，一半在阴影中。细框眼镜的镜片上有一层薄薄的反光，遮住了他部分的眼睛。他手里的铅笔停在一页新的白纸上——空白的，什么都没有画。他的手握着铅笔，指节稳定，但手腕没有在动。他在发呆。准确地说——他在用力克制自己不要抬头看向她的方向。他身后的书架上，曾经夹着那张名片（PROP-003）的那本书被换到了最上一层——他挪过位置了。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-002
        emotion: "内心·克制"
        line: "她知道。我听到了她昨晚的电话——每一个字都听到了。她没有赶我走。但她的沉默比质问更让我害怕。我不知道她想要什么。是解释，还是——我的离开。"
    mode: i2v_ref
