    description: "她的眼睛——大特写。暖黄灯光从右侧斜上方照进她的瞳孔，在里面融成一个金色的小光点。她的睫毛在轻轻颤动——不是因为困，是因为在压着什么。她的眼珠慢慢移动——从左到右，像在读屏幕上某一行字，但其实屏幕上的页面依然是空白的。她在心里写字。然后在某个瞬间，她的眼神突然定住了——下眼睑微微收紧，瞳孔里那枚金色光点不再晃动。她做出了一个决定。"
    dialogue:
