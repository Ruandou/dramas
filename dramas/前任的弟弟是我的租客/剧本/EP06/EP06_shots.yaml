    description: "她的中特写。她低头看他——这个角度很少出现在他们的日常里。平时她看他，平视或微微仰视，因为他在物理上比她高。但现在她站着，他坐在地上——她看到了他头顶的发旋、刘海遮住的眉头、还有他按在素描本上的手指——指节微微泛白。她深吸一口气，声音没有抖。但每一个字之间的停顿，比平时长了一倍。"
