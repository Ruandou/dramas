    duration_sec: 6
    camera: "大特写 固定镜头"
    description: "她的眼睛——大特写。冰箱冷白光映在她瞳孔里，使她棕色的虹膜呈现出一种几乎透明的琥珀色。她的睫毛在轻微颤动。眼睛里没有泪——不是想哭——是某种更复杂的情绪在快速翻涌：先是惊讶，然后是一种缓慢的、后知后觉的恍然。瞳孔微微收缩——她在串联信息。冰箱马达的低频嗡鸣填充了所有的安静。"
    dialogue:
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·串联"
        line: "他知道我咖啡加一勺半糖。他知道我对百合花过敏。他知道我最喜欢的菜是红烧排骨。他知道我被退婚的那天——他是第一个申请租房的人。现在——他知道我最爱的甜点。"
      - type: inner_monologue
        speaker: CHAR-001
        emotion: "内心·停顿·声音开始发抖"
        line: "这些——全都不是巧合。"
