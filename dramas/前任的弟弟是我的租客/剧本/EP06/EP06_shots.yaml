    description: "她的中特写。她缓缓合上笔记本电脑——'咔哒'一声轻响，在安静的公寓里异常清晰。这声音打断了房间里唯一的持续性声源（键盘声），留下一个突兀的安静。她把手平放在合上的银色MacBook上，指尖微微用力压着金属外壳。然后她抬起头，看向辰逸的方向。她的表情不再是观察——是直面。嘴唇抿成一条线，不是愤怒，是某种做好了准备的坚定。暖黄灯光在她侧脸上铺了一层柔和的金色，但她的下颌线是紧绷的。"
