    camera: "中景 固定镜头"
    description: "客厅内。辰逸已经从地上站了起来。他没来得及戴上眼镜——素描本和眼镜还留在地毯上。他就站在书架前面，暖黄灯光从侧面打在他身上，把他的影子拉得很长，投在身后的书架上。他的脸因为摘了眼镜而显得更纯粹——没有遮挡，没有过滤。他看着门口的方向，看着那个和他有五分相像但气质截然不同的男人。他看辰轩的眼神不是害怕——是冷。是一个准备了很久终于不需要再躲的人的眼睛。"
