      text: |
        【图1】陆辰轩 CHAR-003-L01（深蓝定制西装，领带拉松，眉头紧锁，左手攥着信封）【图2】陆辰逸 CHAR-002-L01（深灰卫衣，没戴眼镜，站在书架前）【图3】林小薇 CHAR-001-L01（米色针织衫，浅灰开衫，站在门口，暖黄与冷白两种光在身上交叠）【图4】小薇公寓 SCENE-001。
        竖屏9比16连贯叙事。
        镜头1（4秒）中景 固定：图1站在门口的中景——走廊在他身后延伸成一条无尽的冷白隧道。看到图3的瞬间，眉头皱得更紧了——不是愤怒，是那种见到一个亏欠过的人时无法掩饰的狼狈。喉结动了动，攥着信封的左手收紧。张开嘴想说什么——但话还没出口，视线越过了图3的肩膀，看到了客厅里面的某样东西。表情在零点几秒内从狼狈变成了某种更暗的东西——瞳孔猛然收缩。
        镜头2（4秒）中景 固定：客厅内。图2已经从地上站了起来。没来得及戴上眼镜——素描本和眼镜还留在地毯上。站在书架前面，暖黄灯光从侧面打在身上，把影子拉得很长，投在身后的书架上。脸因为摘了眼镜而显得更纯粹——没有遮挡，没有过滤。看着门口的方向，看着那个和他有五分相像但气质截然不同的图1。看图1的眼神不是害怕——是冷。是一个准备了很久终于不需要再躲的人的眼睛。
        镜头3（4秒）全景 固定：全景——从公寓深处向玄关方向拍摄。画面被切割成三个层次：前景——图3站在门口，侧身，一手还扶着门框，暖黄与冷白两种光在身上交叠，处于两种光、两个人、两种过去之间的正中位置。中景——门框之外，走廊冷白荧光灯下，图1一身深蓝西装，眉头深锁，手里攥着信封，影子投在走廊地板上被拉成细长扭曲的形状。远景——客厅暖黄灯光下，图2站在书架前，没戴眼镜。三个人。一扇门。两个世界的光在门口交汇。暖黄和冷白在门框处各占一半——像对峙，也像一个即将被打破的平衡。画面定格。
        [以下对白仅供语音合成，严禁在画面中显示任何文字]
        对白（陆辰轩，成年男性，30岁，中音偏厚带商务精英感，语速较快但底气不足声音发虚，愤怒时音量拔高但缺少真正力量感像在虚张声势，道歉/悔悟时声线明显颤抖有哭腔，醉酒时口齿含混）：「你——」
        对白（陆辰逸，成年男性，24岁，中低音清朗干净有少年感，说话节奏偏慢有自然停顿，日常温和安静音量偏小，认真表白时声线灼热坚定有微微颤抖，对母亲/哥哥时有克制的冷感但保持礼貌）：「哥。」
        画面全程无任何文字、字幕、标题、水印。
