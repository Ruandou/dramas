- id: SCENE-001
  prompt: Ancient Chinese xianxia sect mountain gate, towering weathered grey-stone
    archway gate with layered tiled flying eaves and an old worn stone plaque above
    the opening, its carved surface faded almost blank by decades of rain and wind,
    camera at low angle looking upward, monumental scale, humans dwarfed by the architecture.
    Vine-covered mossy stone steps rising steeply toward the gate, a wide stone plaza
    with cracked slabs and grass growing through the joints in the foreground, two
    old cracked stone lanterns flanking the gate, faint spiritual energy motes drifting
    in the air, spring green vines and moss covering the stone, a few fallen leaves
    on the steps. On the middle stone step of the main stairway, the same coarse indigo-blue
    abandoned-baby swaddle wrap from the reference image rests flat on the step surface,
    faded mottled blue-gray cloth, hand-sewn seams, one small cloth patch stitched
    on the lower corner, edges lightly frayed, clean but aged, a narrow cotton tie
    strap resting beside it on the same step. Poor sect atmosphere, worn but tidy
    and warm, bright soft golden daylight. Empty environment, no people, no human
    figures, architectural and environmental reference only. ancient Chinese xianxia
    fantasy, bright warm golden tones with spring green accents, cute candy-color
    accents on the baby heroine, soft bright atmosphere, comedic tone over oppression,
