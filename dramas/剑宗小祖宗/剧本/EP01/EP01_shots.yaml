# 引擎: MiniMax-H3 (engine_registry.video_defaults(), 2026-08-07 切换) — 非 seedance 快照

episode_id: EP01
source_md: 剧本/EP01/EP01_剧本.md
defaults:
  endpoint: https://metaso.cn/api/minimax/v2/video_generation  # MiniMax-H3（metaso 中转）；CLI 实际以 MINIMAX_API_BASE 为准，本字段为信息性
  model: MiniMax-H3  # engine_registry.video_defaults() minimax；无版本后缀（seedance 需后缀，minimax 不需要）
  seed: 78786  # 与同项目 segments.yaml 的 defaults.seed 保持一致（固定 seed 提升音色/语速稳定度）
  ratio: "9:16"
  resolution: 768P  # MiniMax-H3 分辨率档位（seedance 快照为 720p，不一致以 video_defaults() 为准）
  duration: 5  # 视频生成引擎模型默认视频长度（秒）；非单镜头时长。每段实际时长见 shot.duration_sec，须保证全集合计落入 90-120s（见 Gate 1）
  generate_audio: false  # shots 为中间产物，无需独立音频合成
  watermark: false
  prompt_suffix: "ancient Chinese xianxia fantasy, bright warm golden tones with spring green accents, cute candy-color accents on the baby heroine, soft bright atmosphere, comedic tone over oppression, cinematic lighting, high detail, 9:16 vertical composition"
  negative_prompt: "modern objects, smartphone, electric wires, cars, glass skyscraper, neon signs, zipper, wristwatch, jeans, sneakers, plastic items, contemporary clothing, real-world dynasty emblems or era names, blood, gore, graphic injury, burnt corpse, painful scream close-up, horror atmosphere, dark oppressive tone, kneeling worship crowd, incense altar worship, religious idol veneration, english text, latin letters, watermark, logo, platform UI"

