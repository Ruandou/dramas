  resolution: 768P  # MiniMax-H3 分辨率档位（seedance 快照为 720p，不一致以 video_defaults() 为准）
  generate_audio: true  # H3 原生输出音轨，无需外部 TTS 混音
  watermark: false
  prompt_suffix: "ancient Chinese xianxia fantasy, bright warm golden tones with spring green accents, cute candy-color accents on the baby heroine, soft bright atmosphere, comedic tone over oppression, cinematic lighting, high detail, 9:16 vertical composition"
