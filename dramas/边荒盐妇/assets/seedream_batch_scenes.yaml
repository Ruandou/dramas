  - id: "SCENE-002"
    prompt: "Coastal salt-workers' village lane at early evening in its prospering era, warm amber hearth light: rows of rammed-earth cottages with grey tile and thatch roofs, whitish salt-frost bloom staining the lower earthen walls, warm golden lamplight spilling from open wooden doorways and paper-screened windows, clusters of red-brown clay pickle jars and brine pots stacked along house walls, bamboo drying racks hung with salted vegetables, neat firewood bundles, a stone-flagged lane leading through the village toward a simple timber village gate in the far distance, thin cooking smoke rising from clay chimneys into a dusk sky, a wooden hand-cart loaded with salt sacks parked by a wall, a hanging unlit paper lantern under an eave. Lived-in warmth, humble prosperity, layered depth from foreground lane to distant gate. Ancient East Asian pre-industrial coastal salt-making period drama environment, fictional Da Yong dynasty, photorealistic cinematic still, shot on 35mm lens, warm amber hearth-light palette over low-saturation earth tones with salt-white accents, 9:16 vertical composition. No text, no characters, no writing, no signboards, no banners with writing, no inscriptions anywhere. No modern objects, no plastic, no electric light bulbs, no power lines. Empty environment, no people, no human figures, no faces, no silhouettes, no body parts, environmental reference only."
