  - id: "SCENE-001-EP82"
    prompt: "Breathtaking high-angle aerial-style establishing shot looking down along a hundred-pace ceremonial salt road at deep winter dusk: a wide straight path swept clean across a frozen crystallized salt field, the path surface pure gleaming white like moonlit snow — a wedding carpet made of salt crossing the sealed winter salt flats; both sides of the path lined with two long receding rows of glowing red paper lanterns on rough wooden poles, evenly spaced, their warm crimson-gold light pooling on the white salt surface; at the far end of the salt road on the beach head stands a single bronze fire basin on a sturdy tripod stand with bright flames dancing; beyond it the dark winter sea horizon under an indigo twilight sky with faint first stars; snow-dusted salt mounds and frozen mirror-like brine pools flank the road glimmering icy blue-white; thin frost mist drifting low over the salt; dramatic cinematic contrast between cold moonlit salt-white and warm festive red lantern light, vast solemn celebratory emptiness. Ancient East Asian pre-industrial coastal salt-making period drama environment, fictional Da Yong dynasty, photorealistic cinematic still, aerial wide-angle perspective, natural dusk lighting, real weathered materials, 9:16 vertical composition. No text, no characters, no writing, no inscriptions anywhere. No modern objects, no plastic, no concrete, no power lines. Empty environment, no people, no human figures, no faces, no silhouettes, no body parts, environmental reference only."
