  - id: "SCENE-002-EP84"
    prompt: "一块崭新的黑漆木匾特写居中，匾上只有三个巨大的金箔简体汉字：「雪盐镇」，从右往左排列，楷书，金字微微凸起于黑漆底面。三个字必须全部使用现代简体字形：第一个字是「雪」，第二个字是简体「盐」（上面是「土」加点撇、下面是「皿」，绝对不是繁体「鹽」），第三个字是简体「镇」（左边是两笔简写金字旁「钅」，绝对不是繁体「鎮」，不要写出完整的「金」字旁）。字迹清晰、工整、可辨认，除「雪盐镇」三字与左下角一列虚化小字落款和一枚朱红小印外，画面中不得出现任何其他文字。匾额窄边起线、四角包铜，两端系着大红绸花绶带。牌匾高挂在一座新落成的木结构镇门门楼横梁下，灰瓦顶、粗木柱，清晨冬日低角度仰拍，阳光斜照在黑漆和金箔上；门洞下方远处可见土屋街道与白茫茫盐田天际线。喜庆而庄重，纪念碑式仰拍尺度。架空古代大雍朝、前工业海盐时代的写实电影剧照质感，35mm广角仰拍，自然冬日光线，9:16竖构图，低饱和大地色调。画面中没有任何繁体字，没有现代物品，没有塑料，没有水泥，没有电线，没有电线杆。空镜环境，无人物，无人形，无面孔，无剪影，无肢体，仅作环境参考。"
    output: "assets/scenes/SCENE-002-EP84.png"
  - id: "SCENE-003"
    prompt: "Bustling small-town market street of an ancient border town captured in the quiet moment just after dawn before opening, bright neutral daylight: a stone-paved street lined with wooden market stalls under plain undyed cloth awnings, bamboo baskets of dried goods, hanging gourds, coarse pottery stacked on boards, plain cloth banners without any writing stirring in the breeze; in the right foreground a bright newly opened salt shop with fresh light-toned timber storefront, open shutter boards, neat rows of snow-white salt displayed in shallow wooden trays and glazed clay jars on the counter, and above the lintel a clean new wooden shop sign board bearing the three characters \"雪盐号\" in regular script (楷书), Simplified Chinese characters, clear legible calligraphy; farther down the opposite side of the street a gloomy old shop facade of heavy black-lacquered timber with no legible signage; grey tile roofs receding, a distant town gate closing the perspective. NOT inscribed with any other characters or text besides \"雪盐号\". Ancient East Asian pre-industrial coastal salt-making period drama environment, fictional Da Yong dynasty, photorealistic cinematic still, shot on 35mm lens, low-saturation earth-tone palette with salt-white highlights, 9:16 vertical composition. No modern objects, no plastic, no glass panes, no power lines. Empty environment, no people, no human figures, no faces, no silhouettes, no body parts, environmental reference only."
