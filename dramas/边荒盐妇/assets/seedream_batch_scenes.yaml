  - id: "SCENE-001"
    prompt: "Vast coastal salt evaporation field under blazing midday sun, extreme wide establishing shot with endless depth, monumental landscape scale. Foreground: a rectangular crystallization pool rimmed by low rammed-earth bunds, its surface crusted with brilliant white salt crystals sparkling in harsh sunlight; ONE weathered old wooden salt rake with a long grey-brown pole handle and a wide flat toothed wooden head, salt residue lodged in its grain, matching the prop reference image, rests leaning against the earthen pool bank. Midground: a geometric grid of brine evaporation pools mirroring the pale sky, narrow mud walkways between pools, several conical white salt mounds heaped like small snow pyramids, wooden brine buckets and rough ceramic brine jars beside a plank sluice gate, a low reed-mat windbreak fence. Background: shimmering white salt-alkaline flats stretching to a hazy sea horizon, heat haze rising. Blazing natural sunlight, salt-white glare highlights on every crystal surface, low-saturation earth tones of mud, weathered wood and grey-brown banks. Ancient East Asian pre-industrial coastal salt-making period drama environment, fictional Da Yong dynasty, photorealistic cinematic still, shot on 35mm wide-angle lens, natural lighting, real weathered materials, 9:16 vertical composition. No text, no characters, no writing, no signboards, no inscriptions anywhere. No modern objects, no plastic, no concrete, no power lines. Empty environment, no people, no human figures, no faces, no silhouettes, no body parts, environmental reference only."
