  CHAR-002: "A young man's voice, gentle and warm with subtle wit. Medium pitch, smooth and measured, occasionally playful with dry humor. Speaks in metaphors and analogies. Chinese Mandarin, refined and thoughtful cadence."
  CHAR-006: "An ancient ethereal voice, neither clearly male nor female, with classical Chinese cadence. Medium-low pitch, resonant and slightly echoing, as if speaking from across millennia. Occasionally tsundere and snarky. Classical Chinese phrasing mixed with modern complaints."

