# EP01 Seedance 镜头配置 (segments.yaml)
# 对应 EP01_一张照片引发的误会.md v4.0
# Seedance 2.0 fast | 15 SEG | 29 SHOTS | 155s

global_defaults:
  model: doubao-seedance-2-0-fast-260128
  ratio: "9:16"
  resolution: 720p
  generate_audio: true
  prompt_suffix: "禁止画面中出现任何文字或字幕。现代都市轻喜剧风格，写实风格，竖屏9比16。"
  negative_prompt: "ancient costume, historical clothing, period costumes, weapon, military uniform, blurry, distorted, low quality, watermark, subtitles burned into frame, anime style, cartoon style, police uniform, judge robe, real brand logo, real celebrity face"
  text_cfg_scale: 7.0

segments:

  # ═══════════════════════════════════════════════════════════
  # SEG01 · 外卖站日常 + 接单出发 · SCENE-001 · 12s · 3镜
  # ═══════════════════════════════════════════════════════════
  - segment_id: SEG01
    scene_id: SCENE-001
    shots: [EP01-S01, EP01-S02, EP01-S03]
    duration_sec: 12
    content_roles:
      - label: "[图1] young_chinese_man_delivery_uniform"
        image_path: "assets/generated/CHAR-001-L01_01.jpg"
      - label: "[图2] chubby_delivery_guy_green_uniform"
        image_path: "assets/generated/CHAR-003-L01_01.jpg"
    prompt: "[图1] young_chinese_man_delivery_uniform | [图2] chubby_delivery_guy_green_uniform — 中午12点，繁忙的外卖站点，塑料棚下三排电动车充电。前景：林小跑（[图1]，25岁，疲惫但清澈的眼神，蓝色外卖服）低头看手机，屏幕显示商业分析文章。中景：王大锤（[图2]，圆脸，嘴里塞半个包子，包子渣掉在绿色外卖服上）探头入画递包子。调度室窗口，值班组长（短发，蓝色马甲）探出身甩小票。白板上红色磁铁贴"晴天科技"。暖黄午后阳光，热闹站点氛围。竖屏9比16，写实风格。"
    dialogue_lines:
      - speaker: "CHAR-001"
        text: "昨晚三点才睡……这个收购案的逻辑还是没想通。"
      - speaker: "CHAR-003"
        text: "小跑！包子！猪肉大葱！"
      - speaker: "CHAR-001"
        text: "锤哥，我在看东西。"
      - speaker: "CHAR-GRP-01"
        text: "小跑！晴天科技！三单！二十分钟！"

