# EP01_segments.yaml — API 提交段配置（最终格式）
# 源文件：剧本/EP01/EP01_穿越之始.md
# 生成方式：segment-builder (dry-run: 使用本地路径，资产待用户授权后生成上传)

episode_id: EP01
source_md: 剧本/EP01/EP01_穿越之始.md

defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: "9:16"
  resolution: 720p
  generate_audio: true
  prompt_suffix: "Vertical 9:16 continuous narrative, modern Chinese urban setting, realistic drama style, warm natural lighting, subtle comic timing, no brand logos, no platform UI, no text overlay, no subtitles, no watermark, no background music"
  prompt_suffix_silent: "Vertical 9:16 continuous narrative, modern Chinese urban setting, realistic drama style, warm natural lighting, atmospheric ambient sound only, no dialogue, no text overlay, no platform UI"
  negative_prompt: "Horizontal video, letterbox, black bars, watermark, text overlay, subtitles, brand logo, platform UI, background music, distorted faces, unnatural movement, cartoon style, anime style, 3D rendering, CGI, poor lighting, dark scenes without narrative purpose, horror elements, violence, gore, explicit content"

voice_prompts:
  CHAR-001: "成年女性，28岁，声线明亮带温暖的沙哑感，语速中偏快，说话时带吐槽节奏——爱用上扬疑问句结尾，情绪激动时语速更快并夹杂笑声"
  CHAR-002: "成年男性，30岁，声线偏低沉有磁性，语速偏慢，语调平缓冷感（初期），偶尔出现语气波动（被女主带偏后压不住的笑意）"
  CHAR-003: "中性合成语音，无性别特征，冷感机械声带轻微电子音效，语速均一。惊叹时音调升高、无语时拖长尾音"

