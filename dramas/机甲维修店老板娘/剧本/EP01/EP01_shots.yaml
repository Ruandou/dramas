defaults:
  endpoint: https://metaso.cn/api/minimax/v2/video_generation  # MiniMax-H3（metaso 中转）；CLI 实际以 MINIMAX_API_BASE 为准，本字段为信息性
  model: MiniMax-H3  # engine_registry.video_defaults() minimax；无版本后缀（seedance 需后缀，minimax 不需要）
  seed: 78786  # 与同项目 segments.yaml 的 defaults.seed 保持一致（固定 seed 提升音色/语速稳定度）
  ratio: "9:16"
  resolution: 768P  # MiniMax-H3 分辨率档位（seedance 快照为 720p，不一致以 video_defaults() 为准）
  duration: 5  # 视频生成引擎模型默认视频长度（秒）；非单镜头时长。每段实际时长见 shot.duration_sec，须保证全集合计落入 90-120s（见 Gate 1）
  generate_audio: false  # shots 为中间产物，无需独立音频合成
  watermark: false
  prompt_suffix: "vertical 9:16 composition, stylized realism with cinematic lighting, detailed mechanical textures, warm-cool color contrast (amber workshop tones vs cool steel blue tech tones), subtle film grain, high detail, high quality"
  negative_prompt: "military themes, weapons, soldiers, war scenes, modern politics, political symbols, real brand logos, real celebrity faces, traditional Chinese characters, garbled text, supernatural or religious elements, gore, blood, violence, children in danger, deformed hands, extra fingers, watermark, low quality, blurry, distorted"

