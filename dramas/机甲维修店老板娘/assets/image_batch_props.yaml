items:
- id: PROP-001
  prompt: Prop reference photograph, single object isolated on warm neutral silk background,
    dramatic product lighting with soft shadows. ONE single aged leather-bound repair
    notebook, semi-open, worn dark brown cowhide cover with scuffed corners and a
    faint embossed gear emblem, pages yellowed and dog-eared with age, a faded sepia
    landscape photo corner tucked inside the pages, thin red cloth bookmark, old oil-stained
    fingerprints on the leather. Vertical 9:16, detailed prop reference sheet.
  output: assets/props/PROP-001.png
