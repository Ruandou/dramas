  - id: "SCENE-001"
    prompt: "Faded red Spring Festival couplets (chunlian) on both sides of the main doorframe, the paper curling and sun-bleached from months of weather, a period marker of 1988 small-town China. Camera at low angle looking upward at a modest two-story red-brick residential courtyard house, making the building tower over the viewer. Thick-walled grey brick construction with a dark tiled roof overhang, hand-painted wooden door with rusted iron ring handles. A mature Chinese scholar tree (huai shu) dominates the left side, its dense canopy casting dappled green shade across the packed-earth courtyard. Cotton rope clotheslines stretch between the house and a low side wall, with faded floral-print fabric and white cotton garments drying in warm afternoon sun. Against the right wall, a brick-built outdoor kitchen stove with blackened cast-iron wok, a bamboo-handled ladle resting on the rim, thin grey smoke wisps rising. A worn wooden chopping block beside the stove. Weathered bamboo broom leaning against the wall. In the foreground near the window, a single vintage silver harmonica resting on the wooden windowsill, showing surface scratches and patina matching the prop reference. A stack of hand-thrown ceramic bowls on a crude shelf. Old Chinese calendar from 1988 hanging on the interior wall visible through the window, alongside a faded New Year print (nian hua). A vintage Phoenix brand bicycle leaning against the far wall. Warm golden afternoon sunlight streaming from the west, long shadows, cicada-summer atmosphere, packed earth ground showing foot-worn paths. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm wide-angle lens, natural lighting, real architectural materials, 1980s Chinese small town aesthetic. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-001.png"
    output: "assets/scenes/SCENE-001.png"

  - id: "SCENE-002"
    prompt: "Camera at low angle looking upward emphasizing the tall ceiling of a converted classroom repurposed as a music practice room in a 1988 Chinese small-town primary school. In the center of the composition, a single dark brown upright piano with yellowed ivory keys showing age discoloration, several keys slightly misaligned, a thin layer of dust on the flat top surface where a slanted afternoon sunbeam cuts through, illuminating floating dust motes in a dramatic volumetric light column. The piano is the visual anchor of the room. On the piano's music rest, a hand-written music score booklet with aged cream paper, matching the prop reference. Tall single-pane wooden-framed windows along one wall, one pane cracked and repaired with strips of newspaper, afternoon golden light streaming in at a sharp angle creating strong diagonal shadows across the scuffed wooden floor. Whitewashed plaster walls showing patches of damp and peeling paint. A row of small wooden student chairs stacked against the back wall. A faded world map pinned to the wall. A cracked green chalkboard on the front wall with faint chalk residue. An old-fashioned broom in the corner. A single rusted iron radiator beneath the window. Warm golden tones, dusty atmosphere, nostalgic 1980s Chinese school aesthetic. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real architectural materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-003.png"
    output: "assets/scenes/SCENE-002.png"

  - id: "SCENE-003"
    prompt: "A serene riverside scene at golden hour sunset in a small 1988 Chinese town. A narrow river with calm water reflecting the warm orange-pink sky, shimmering golden light dancing on gentle ripples. Several mature weeping willow trees along the near bank, their long drooping branches touching the water surface, swaying gently. A simple arched stone slab bridge with weathered grey limestone blocks crossing the river at mid-ground, lichen growing in the mortar joints. The far bank shows low earthen embankment with wild grass and a few scattered wildflowers. A muddy footpath along the near bank with flattened grass showing regular foot traffic. A large flat river stone near the water's edge, smooth from years of current. Reeds and cattails growing at the waterline. Distant low-rise buildings of the small town silhouetted against the warm sky. A single wooden fishing boat moored to a willow trunk with hemp rope. Warm golden-orange sunset light from the west casting long shadows, peaceful contemplative atmosphere, 1980s Chinese rural riverside aesthetic. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real natural materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
    output: "assets/scenes/SCENE-003.png"

  - id: "SCENE-004"
    prompt: "Interior of a 1988 Chinese state-run restaurant (guoying fandian). Above the entrance doorway, a wooden board sign inscribed with the characters \"国营饭店\" in bold red Simplified Chinese regular script. White plaster walls with a green painted wainscoting border at hip height. Square wooden tables with simple wooden benches, surface showing years of wear and ring stains from hot bowls. A large blackboard menu on the wall behind the service counter, handwritten in white and yellow chalk listing dishes and prices in Simplified Chinese characters. A metal cash register on the counter with a glass partition. White enamel cups filled with pale green tea on several tables. A large glass-fronted display cabinet showing white porcelain bowls and stacked plates. Fluorescent tube lighting on the ceiling casting even cold-white light. A red thermos flask on each table. Worn terrazzo tile floor with a slight sheen. A wall clock with Roman numerals showing 12:00. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, interior lighting, real architectural materials, 1980s Chinese institutional dining aesthetic. NOT inscribed with any other characters or text besides what is specified."
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-005.png"
