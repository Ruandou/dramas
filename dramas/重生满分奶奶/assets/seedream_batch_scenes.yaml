  - id: "SCENE-009"
    prompt: "A bright and warm private music teaching studio in a small Chinese town, late 1990s to 2000s era. On the main wall, a large hand-painted banner poster inscribed with the characters \"音乐不是天才的专利\" in bold Simplified Chinese regular script on cream-colored paper, the text centered and clearly legible. Bright natural sunlight flooding through large windows with thin white curtains, creating a cheerful and inviting atmosphere. Light honey-toned wooden flooring. A small upright piano in one corner, its surface clean and well-maintained, with a few colorful music-themed stickers on the side panel. A low wooden shelf unit displaying multiple hand-written music score booklets matching the prop reference, arranged upright like library books. On a child-sized wooden table, a dark blue hand-bound music education textbook with the title \"音乐启蒙\" in white characters on the cover, matching the prop reference, alongside colorful xylophones and small percussion instruments for children. Simple wooden chairs sized for young students arranged in a semicircle. A cork board on one wall pinned with children's drawings of musical notes and colorful music worksheets. Potted plants on the windowsill — a small jade plant and a spider plant. A woven rug with a musical note pattern on the floor. Warm, nurturing, educational atmosphere, late 1990s Chinese private tutoring space aesthetic. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real materials. NOT inscribed with any other characters or text besides what is specified."
