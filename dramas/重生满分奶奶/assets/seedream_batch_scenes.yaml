  - id: "SCENE-005"
    prompt: "A large red fabric banner reading '文艺汇演' strung across the top of the proscenium arch above the stage, a period marker of 1980s Chinese cultural events. Camera at low angle looking upward at the stage of a small 1988 Chinese provincial cultural palace theater, making the stage architecture tower dramatically overhead. Heavy dark red velvet main curtain drawn open, revealing deep burgundy side curtains (leg curtains) framing the stage. The stage floor is polished dark planks of aged hardwood with visible grain and scuff marks from performances. In the center-rear of the stage, a single dark brown upright piano positioned for performance, matching the prop reference, its surface catching the stage light. A single white spotlight beam from above creating a dramatic pool of light on the piano area, with theatrical haze and dust visible in the beam. Above the stage, exposed metal rigging bars with stage lights pointing downward. The orchestra pit visible at the front edge as a dark recessed area. Rows of empty wooden fold-down seats visible in the dim foreground of the audience area. Walls decorated with simple geometric Art Deco-inspired moldings typical of 1980s Chinese public cultural buildings. A clock on the back wall of the stage. Warm amber stage lighting with dramatic shadows, 1980s Chinese theater aesthetic. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on wide-angle lens, theatrical lighting, real architectural materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
