  - id: "SCENE-006"
    prompt: "Camera at low angle looking upward emphasizing the high ceiling of a professional music conservatory practice room, late 1980s China. Sound-absorbing acoustic panels of dark grey compressed fiber mounted on the walls at regular intervals. In the center of the room, a single glossy black grand piano with the fall board open revealing pristine white and black keys, the polished ebony surface reflecting the window light like a mirror, matching the prop reference. On the piano's music rest, a hand-written music score booklet with aged cream paper and pencil notation, matching the prop reference. Three metal music stands positioned around the room, each stacked with loose sheet music pages and bound scores, matching the prop reference. Tall wooden-framed windows with thin white curtains letting in soft afternoon light. On the windowsill, a small potted cactus (spherical golden barrel type) in a simple terracotta pot. Light honey-toned hardwood parquet flooring with a subtle sheen. A worn leather piano bench with adjustable height mechanism in front of the grand piano. A coat rack near the door with a fabric instrument case strap hanging. Warm natural light mixed with a soft amber desk lamp on a small side table. Late 1980s to early 1990s Chinese conservatory aesthetic, academic atmosphere. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real architectural materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
