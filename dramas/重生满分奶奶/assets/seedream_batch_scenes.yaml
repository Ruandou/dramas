  - id: "SCENE-010"
    prompt: "A modern 2016 Chinese hospital single-occupancy patient room, room number 307 visible on a small plaque beside the door. White walls with a light blue accent stripe at waist height. A standard hospital bed with crisp white sheets, white cotton blanket folded at the foot, and a slightly elevated head section with mechanical controls. Beside the bed, a contemporary cardiac monitoring unit with a dark screen displaying a subtle green baseline waveform and vitals readout in digital characters. An IV pole with a fluid bag hanging nearby. A bedside cabinet with a small drawer, on top sits a plastic water pitcher and cup. A large window with white aluminum frames showing an evening cityscape view — distant apartment buildings with warm yellow lights, urban skyline at dusk. On the windowsill, a glass vase holding a bouquet of fresh mixed flowers — white lilies and pink carnations with green foliage. A visitor's chair with blue fabric upholstery beside the bed. A whiteboard on the wall with medical notes. Clean linoleum flooring in a neutral beige tone. Soft fluorescent ceiling panel providing even clinical lighting, with warmer accent light from the bedside reading lamp. Modern Chinese hospital aesthetic, quiet and clinical yet with touches of warmth from the flowers and city view. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, interior lighting, real modern materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
