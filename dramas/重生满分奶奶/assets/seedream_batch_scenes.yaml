  - id: "SCENE-007"
    prompt: "A 1992 Chinese railway station platform, camera positioned at platform level looking down the long concrete platform receding into the distance. The platform surface is grey poured concrete with painted yellow safety lines along the edge, worn smooth by decades of foot traffic. A classic green-painted Chinese passenger train (lüpi huoche) occupies the track, its dark green carriages with cream window frames stretching into the distance, windows showing faded blue curtains inside. Thick white steam billowing from under the train carriages, rising and dissipating in the warm air. Cast-iron platform columns supporting a corrugated metal canopy roof with exposed steel trusses. Old-style metal platform benches bolted to the concrete. A faded green metal sign hanging from the canopy. A black analog clock mounted on a pillar showing departure time. Scattered luggage items on the platform — woven bamboo baskets, canvas bags, rope-tied cardboard boxes — left by passengers. Platform overhead wires and catenary system visible. Warm diffused daylight filtering through the canopy, slight atmospheric haze from steam, 1990s Chinese railway aesthetic, melancholic departure atmosphere. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real architectural materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
    output: "assets/scenes/SCENE-007.png"

  - id: "SCENE-008"
    prompt: "Camera at slightly elevated angle looking across a modest early-2000s Chinese apartment living room, emphasizing the lived-in domestic space. White painted plaster walls with a simple cream picture rail molding. On the main wall, a framed family photograph showing a scenic portrait composition (no visible faces — photographed from behind or a landscape-style family moment), the frame is dark wood with a slight golden tint. A 29-inch CRT color television set on a low wooden TV stand, the screen dark, with a set-top antenna. Beside it, a black Singer-style sewing machine on its own wooden table, folded fabric stacked on the shelf below. Grey poured concrete floor with a simple floral-print cotton rug in the seating area. A brown faux-leather sofa with armrest covers, a few cushions. A red thermos flask and enamel cups on a square wooden coffee table. Through the window, a view of a Chinese city residential block with laundry hanging from balconies. A simple white ceiling light fixture. A wall calendar from around 2005 showing a scenic landscape photograph. A children's school backpack hanging on a hook by the door. Warm natural daylight from the window, modest but comfortable early 2000s Chinese middle-class domestic aesthetic, showing signs of gradual improvement. Empty environment, no people, no human figures, architectural and environmental reference only. Photorealistic rendering, shot on 35mm lens, natural lighting, real materials. NOT inscribed with any other characters or text besides what is specified. no text, no characters, no writing, no inscriptions, no calligraphy."
