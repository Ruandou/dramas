    shot_size: ECU
    duration_sec: 4
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "林秀芝坐到钢琴前木凳上。手悬在琴键上方，十根手指纤细白皙，指尖没有一丝老茧。阳光照在手背上血管隐约可见。手指微蜷然后伸展，指尖落在琴键边缘微微发凉。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "手指听脑子的，脑子听……"}
      - {speaker: CHAR-001, type: 内心, emotion: 颤, line: "心的。"}

  - shot_id: EP14-S08
    segment: SEG05
    scene: SCENE-012
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: ECU
    duration_sec: 4
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "林秀芝手指按下琴键，第一个音符犹豫。手指在琴键上移动试图弹奏月光奏鸣曲。手指开始微颤，一个该按中央C的指头落偏按到旁边黑键上。不和谐的音在考场回荡。⚠️只拍摄静态手指搭在琴键上"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 慌, line: "手……在抖。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "脑子里清清楚楚，可手指……跟不上。"}

  - shot_id: EP14-S09
    segment: SEG05
    scene: SCENE-012
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: ECU
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "手指继续在琴键上移动但越来越不稳。右手小指滑掉又一个错音。手停在半空指尖发抖。阳光照在琴键上黑白分明。她咬着下唇手指重新放回琴键，不想放弃。⚠️只拍摄缓慢手指放置"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 颤, line: "六十年……你听过无数遍这首曲子。"}
      - {speaker: CHAR-001, type: 内心, emotion: 咬牙, line: "手会忘，但心记得。"}

