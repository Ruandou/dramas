    visual_description: "音乐学院走廊午后光线从大窗户照进来。林秀芝从考场走出，碎花衬衫微皱，表情恍惚眼神没焦点。走廊另一端陈望秋靠在窗边等，看到她出来直起身，没问考得怎样，慢慢走过来。"
