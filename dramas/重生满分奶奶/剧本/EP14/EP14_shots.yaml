    mode: i2v_ref
    camera: 固定镜头
    visual_description: "林秀芝站起来走到钢琴侧面，深深鞠躬，弯腰角度比一般考生更大停留更长。直起身时眼眶微红但嘴角带微笑。午后阳光照在身后黑色三角钢琴上，琴面反光像镜子照着她背影。"
    dialogue:
      - {speaker: CHAR-001, type: 对白, emotion: "平静·微哑", line: "我知道了。谢谢老师。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "他说的每个字都是事实。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "六十年的感情再深，也补不了二十年的技术空白。"}

