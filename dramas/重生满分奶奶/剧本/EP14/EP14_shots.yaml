    visual_description: "手指在琴键上继续移动，速度慢半拍，手指记忆和肌肉较劲。表情从慌乱逐渐平静，不是认命是60岁灵魂的释然。琴声错漏百出但每个对的音符里都有温度。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 平静, line: "弹不完美……没关系。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "至少每一个音都是真心的。"}

