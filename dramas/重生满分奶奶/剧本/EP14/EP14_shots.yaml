# EP14 考场风云 — shots.yaml
# Seedance 有效镜数: 16

shots:
  - shot_id: EP14-S01
    segment: SEG01
    scene: SCENE-011
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "1988年初夏省城音乐学院校门外，阳光透过梧桐树洒下斑驳光影。红砖墙校门口站着背乐器盒的考生。林秀芝在人群中，碎花衬衫在晨风里微微鼓起，齐耳短发被风吹到耳后。目光越过人群忽然停住。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 微惊, line: "望秋？"}

  - shot_id: EP14-S02
    segment: SEG01
    scene: SCENE-011
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "陈望秋站在梧桐树荫下，白衬衫领口微敞，左肩斜挎黑色小提琴硬壳琴盒。他看着她笑了，眼角弯弯。林秀芝也笑了。两人隔着人群对视，阳光从梧桐叶间漏下在地面投下光斑。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "他也来了。"}
      - {speaker: CHAR-002, type: 对白, emotion: 温和, line: "你也来考试？"}
      - {speaker: CHAR-001, type: 对白, emotion: "点头·微笑", line: "嗯。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "前世，我从不知道他也考过音乐学院。"}

  - shot_id: EP14-S03
    segment: SEG02
    scene: SCENE-013
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: CU
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "笔试考场内，长条木桌整齐排列，阳光从高窗洒进来照亮试卷。林秀芝坐靠窗位，握着钢笔笔尖飞快移动，表情从容，碎花衬衫袖口挽到手肘。窗外梧桐树影在试卷上轻轻晃动。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 从容, line: "这些题目……太熟悉了。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "前世在师范教了一辈子音乐史。"}

  - shot_id: EP14-S04
    segment: SEG02
    scene: SCENE-013
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    visual_description: "林秀芝笔尖飞快书写，手稳如抄课文。最后一题分析贝多芬三个乐章，她几乎没停顿写满整页。远处几张桌外陈望秋也在埋头答题，小提琴盒靠在椅腿旁。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 笑意, line: "贝多芬……老朋友了。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "这些题，是六十年积累给我的见面礼。"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "笔试……稳了。"}

  - shot_id: EP14-S05
    segment: SEG03
    scene: SCENE-013
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: MS
    duration_sec: 8
    mode: i2v_ref
    camera: 缓推
    visual_description: "音乐学院走廊，林秀芝站在钢琴考场门口深吸气。走廊尽头大窗户午后阳光在地板上拉出长光影。手指无意识碰了一下腰间口琴。门上贴着钢琴实技纸条。她推门，阳光从门缝涌出来照亮她的脸。"
    dialogue:
      - {speaker: CHAR-001, type: 内心, emotion: 深吸气, line: "钢琴实技……"}
      - {speaker: CHAR-001, type: 内心, emotion: "", line: "前世，我就是因为技术不够，没考上。"}
      - {speaker: CHAR-001, type: 内心, emotion: 坚定, line: "这辈子……用六十年的感情补。"}

