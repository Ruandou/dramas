    mode: i2v_ref
    camera: 固定镜头
    visual_description: "主考官坐谱架后透过丝框眼镜看林秀芝。表情从例行公事变得专注，铅笔停在评分表上方没动。眉头微皱，不是不耐烦而是困惑。花白短发在午后阳光里泛银光。"
    dialogue:
      - {speaker: CHAR-GRP-04, type: 内心, emotion: 专注, line: "技术确实差……"}
      - {speaker: CHAR-GRP-04, type: 内心, emotion: 困惑, line: "但这个孩子的乐感，倒是少见。"}

  - shot_id: EP14-S11
