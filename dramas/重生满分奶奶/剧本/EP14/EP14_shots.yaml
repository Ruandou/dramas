    mode: i2v_ref
    camera: 固定镜头
    visual_description: "钢琴考场内，午后阳光从高窗照在黑色三角钢琴上，琴面反光。琴盖打开露出黑白键。主考官坐谱架后木椅上，花白短发丝框眼镜，铅笔在评分表上轻敲。林秀芝站在钢琴旁，碎花衬衫与黑色钢琴形成对比。"
    dialogue:
      - {speaker: CHAR-GRP-04, type: 对白, emotion: 平静, line: "开始吧。"}

  - shot_id: EP14-S07
    segment: SEG04
    scene: SCENE-012
    characters: [CHAR-001]
