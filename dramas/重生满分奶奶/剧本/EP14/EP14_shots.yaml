    mode: i2v_ref
    camera: 固定镜头
    visual_description: "陈望秋递来一瓶玻璃瓶汽水(PROP-007)，老式透明玻璃瓶标签印橘子味，瓶身凝着水珠。林秀芝接过，瓶身冰凉贴着掌心。她抬头看他，他的眼神温柔什么都没说但什么都说了。午后光从窗户照进把两人笼在暖色光晕里。"
