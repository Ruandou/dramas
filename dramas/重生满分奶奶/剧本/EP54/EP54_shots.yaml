# EP54 shots.yaml
# 生成自：EP54_继续前行.md
# 每个镜头独立配置，含参考图与对白

shots:
  # ========== SEG01 - 收好信（SCENE-008, 清晨） ==========
  - shot_id: EP54-S01
    scene_id: SCENE-008
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L02]
    framing: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      清晨的客厅，淡金色晨光从窗户斜射进来，窗帘在微风中轻轻摆动。
      木桌上摊开放着那封发黄的信，旁边是一本翻开的《月光奏鸣曲》乐谱。
      林秀芝穿着米色针织开衫，头发随意别在耳后。
      她低头看着信纸，手指轻轻抚过纸面上的字迹——表情是沉淀后的平静。
      她慢慢将信纸对折，动作轻柔而郑重。
    dialogue:
      - speaker: CHAR-001
        emotion: 平静·轻缓
        delivery: normal
        text: 「六十岁的我……谢谢你。」
      - speaker: CHAR-001
        emotion: 喃喃自语
        delivery: soft
        text: 「我会记住你说的话。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-008
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
      - type: prop
        id: PROP-010
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-010.png"
      - type: prop
        id: PROP-003
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-003.png"

  - shot_id: EP54-S02
    scene_id: SCENE-008
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L02]
    framing: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      特写——林秀芝的手。她把折好的信纸缓缓夹入乐谱的中间页，指尖将乐谱抚平。
      晨光落在乐谱泛黄的页面上，照出手写字迹。
      她合上乐谱，手掌在封面上轻轻按了一下——像在做一个郑重的承诺。
      阳光在乐谱封面投下一道斜斜的光影。
    dialogue:
      - speaker: CHAR-001
        emotion: 低声·坚定
        delivery: normal
        text: 「不是改变命运。是过好每一天。」
      - speaker: CHAR-001
        emotion: 自语
        delivery: soft
        text: 「就今天。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-008
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
      - type: prop
        id: PROP-003
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-003.png"

  # ========== SEG02 - 当下（SCENE-008, 清晨） ==========
  - shot_id: EP54-S03
    scene_id: SCENE-008
    character_ids: [CHAR-001, CHAR-002]
    look_ids: [CHAR-001-L02, CHAR-002-L02]
    framing: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      陈望秋从厨房方向走来，手里端着一杯热茶，白气袅袅。
      他看见林秀芝已经把信收好，微微一笑。
      他把茶放在她面前的桌上，在她对面坐下。
      晨光在他侧脸勾勒出柔和的轮廓。
      墙上挂着一把旧小提琴，旁边是新添的"小提琴工作室"的牌子。
    dialogue:
      - speaker: CHAR-002
        emotion: 温和
        delivery: normal
        text: 「收起来了？」
      - speaker: CHAR-001
        emotion: 点头·平静
        delivery: normal
        text: 「嗯。该看的看了，该懂的懂了。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-002-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-008
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"

  - shot_id: EP54-S04
    scene_id: SCENE-008
    character_ids: [CHAR-001, CHAR-002]
    look_ids: [CHAR-001-L02, CHAR-002-L02]
    framing: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      两人面对面坐着，中间隔着那杯茶的热气。
      陈望秋看着她，眼神里有种温柔的试探。
      林秀芝迎着晨光微笑，是一种从未有过的释然表情。
      窗台上有一盆小花，花瓣在光影中半透明。
      远处传来一两声鸟鸣。
    dialogue:
      - speaker: CHAR-002
        emotion: 轻声·确认
        delivery: soft
        text: 「不纠结了？」
      - speaker: CHAR-001
        emotion: 微笑·金句
        delivery: warm
        text: 「纠结什么？今天太阳很好，我想去教室看看。」
      - speaker: CHAR-001
        emotion: 温暖
        delivery: normal
        text: 「走吧——咱们的日子还长着呢。」
      - speaker: CHAR-002
        emotion: 跟着笑
        delivery: warm
        text: 「嗯。长着呢。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-002-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
