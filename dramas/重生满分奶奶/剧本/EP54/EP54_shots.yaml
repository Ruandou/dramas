        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"

  # ========== SEG03 - 满园桃李（SCENE-009, 日） ==========
  - shot_id: EP54-S05
    scene_id: SCENE-009
    character_ids: []
    look_ids: []
    framing: LS
    duration_sec: 6
    mode: t2v
    camera_movement: fixed
    visual_description: >-
      宽敞明亮的音乐教室，阳光从大窗户倾泻进来。
      墙上贴着"音乐不是天才的专利"的标语。
      几排小椅子，五六架电子琴和打击乐器整齐摆放。
      角落里，一面崭新的牌匾——"全省模范音乐教室"，金属在阳光下微微反光。
      窗台上摆着盆栽绿植，一架旧立式钢琴靠墙而立。
      气氛温暖有活力。
    dialogue: null
    sound_effects: "远处传来孩子们的琴声和笑声"
    reference_images:
      - type: scene
        id: SCENE-009
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/重生满分奶奶/SCENE-009.png"

  - shot_id: EP54-S06
    scene_id: SCENE-009
    character_ids: [CHAR-001, CHAR-002]
    look_ids: [CHAR-001-L02, CHAR-002-L02]
    framing: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      林秀芝站在教室中央，环顾四周，嘴角带着满足的笑意。
      陈望秋站在她身旁，肩上挎着小提琴盒。
      他指向墙角的牌匾，眼中带着骄傲。
      墙上挂着几幅学生画的音乐主题画作，还有一张合影——林秀芝和她的学生们。
      阳光在木地板上投下温暖的光斑。
    dialogue:
      - speaker: CHAR-002
        emotion: 骄傲
        delivery: normal
        text: 「全省的模范。你做到了。」
      - speaker: CHAR-001
        emotion: 轻笑
        delivery: warm
        text: 「不是我一个人做到的。」
      - speaker: CHAR-001
        emotion: 目光远·温暖
        delivery: soft
        text: 「是大家——一起。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-002-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-009
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/重生满分奶奶/SCENE-009.png"

  # ========== SEG04 - 传承（SCENE-009, 日） ==========
  - shot_id: EP54-S07
    scene_id: SCENE-009
    character_ids: [CHAR-001, CHAR-007]
    look_ids: [CHAR-001-L02, CHAR-007-L02]
    framing: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      教室的另一角，年轻女教师赵小满正在教一个小女孩弹琴。
      她约20岁，低马尾扎得整齐，银色细框眼镜，白色衬衫简洁干净。
      她的坐姿端正，手指在琴键上轻柔地示范。
      小女孩认真地看着她的手指。
      林秀芝站在不远处看着这一幕，目光里有骄傲、感动，还有一丝遥远的怀念。
      午后的斜阳在地板上拉出长长的影子。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·感动
        delivery: internal
        text: 「她的名字叫小满……跟我的女儿前世同名。」
      - speaker: CHAR-001
        emotion: 内心·温柔
        delivery: internal
        text: 「可是这一次，她是我的学生——不是我忽略的孩子。」
      - speaker: CHAR-001
        emotion: 内心·释然
        delivery: internal
        text: 「传承比改变更重要。我懂了。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-007-L02
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/重生满分奶奶/CHAR-007-L02.png"
      - type: scene
        id: SCENE-009
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/重生满分奶奶/SCENE-009.png"

  # ========== SEG05 - 师徒对话（SCENE-009, 日） ==========
  - shot_id: EP54-S08
    scene_id: SCENE-009
    character_ids: [CHAR-001, CHAR-007]
    look_ids: [CHAR-001-L02, CHAR-007-L02]
    framing: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      赵小满教完那节课，走向林秀芝。
      她摘下眼镜擦了擦，脸上带着温和的笑意。
      两人并肩站在窗边，阳光在她们身上投下明亮的光。
      赵小满的目光温柔而笃定，看着林秀芝时眼中有一种超越师生的感激。
    dialogue:
      - speaker: CHAR-007
        emotion: 温和·笑
        delivery: normal
        text: 「林老师。我刚才教那孩子弹C大调音阶。」
      - speaker: CHAR-001
        emotion: 点头·温暖
        delivery: warm
        text: 「我看你教得比我还好。」
      - speaker: CHAR-007
        emotion: 摇头·认真
        delivery: normal
        text: 「是您教得好。您教我的。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-007-L02
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/重生满分奶奶/CHAR-007-L02.png"
      - type: scene
        id: SCENE-009
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/重生满分奶奶/SCENE-009.png"

  - shot_id: EP54-S09
    scene_id: SCENE-009
    character_ids: [CHAR-001, CHAR-007]
    look_ids: [CHAR-001-L02, CHAR-007-L02]
    framing: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      赵小满顿了顿，低下头，然后抬起眼睛看着林秀芝——眼神里有一层更深的理解。
      林秀芝的笑容微微凝住，像是被说中了什么。
      两人之间有一种微妙的沉默，充满理解而不是尴尬。
      窗外传来孩子们在院子里嬉闹的声音。
    dialogue:
      - speaker: CHAR-007
        emotion: 停顿·轻声
        delivery: soft
        text: 「林老师，我一直想问您——」
      - speaker: CHAR-001
        emotion: 看着她·耐心
        delivery: normal
        text: 「嗯？」
      - speaker: CHAR-007
        emotion: 认真·金句
        delivery: normal
        text: 「您在我身上，看到了另一个人，是吗？」
      - speaker: CHAR-001
        emotion: 愣住·眼眶微红·随后含笑
        delivery: soft
        text: 「……看出来了？」
      - speaker: CHAR-007
        emotion: 微笑·点头
        delivery: warm
        text: 「嗯。但我不介意。」
      - speaker: CHAR-007
        emotion: 温柔
        delivery: warm
        text: 「因为您把最好的东西——都给了我。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: character
        id: CHAR-007-L02
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/looks/重生满分奶奶/CHAR-007-L02.png"
      - type: scene
        id: SCENE-009
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/scenes/重生满分奶奶/SCENE-009.png"

  # ========== SEG06 - 十年一瞬（SCENE-008, 傍晚） ==========
  - shot_id: EP54-S10
    scene_id: SCENE-008
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L02]
    framing: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      傍晚的客厅，窗外是2010年的小镇街景——街道上有了更多路灯，远处有零星的二层楼房。
      林秀芝独自坐在窗边，42岁的她眼角多了几道细纹，但眼神更沉静温暖。
      她端着一杯茶，目光落在窗外。
      客厅布置比几年前更充实——多了书架、几盆植物，墙上挂着全家福和音乐教室师生合影。
      暮色将一切染成温柔的橘红色。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·感慨
        delivery: internal
        text: 「一晃好几年了。音乐教室成了，望秋的工作室也开了。」
      - speaker: CHAR-001
        emotion: 内心·平静
        delivery: internal
        text: 「小满也长大了……像一棵树，慢慢长成了它该有的样子。」
      - speaker: CHAR-001
        emotion: 内心·释然
        delivery: internal
        text: 「我不再问'如果当初'了。我现在只问——今天过得怎么样。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-008
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"

  # ========== SEG07 - 慧兰的来信（SCENE-008, 傍晚→暮色） ==========
  - shot_id: EP54-S11
    scene_id: SCENE-008
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L02]
    framing: CU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: >-
      门铃声响起。林秀芝起身去开门——门口没有人，只有地上躺着一个信封。
      她弯腰捡起来，关上门。
      特写——她的手握着信封。米黄色信封上贴着邮票，邮戳清晰可见："2010年5月"。
      寄件人写着"周慧兰"三个字。字迹比年轻时潦草了一些，少了一分张扬，多了一分疲惫。
      林秀芝的表情从好奇慢慢变为一种预感到什么的凝重。
      她缓缓走向桌边，打开台灯。灯光照亮了信封。
    dialogue:
      - speaker: CHAR-001
        emotion: 声音微变
        delivery: normal
        text: 「慧兰？」
      - speaker: CHAR-001
        emotion: 内心
        delivery: internal
        text: 「她的信……不太像她的风格。以前她写信总是一大段一大段的。」
      - speaker: CHAR-001
        emotion: 喃喃
        delivery: soft
        text: 「这次——只写了几行。」
    reference_images:
      - type: character
        id: CHAR-001-L02
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - type: scene
        id: SCENE-008
        url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
      - type: prop
        id: PROP-008
        url: "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-008.png"

  # ========== SEG08 - 两种人生（SCENE-008, 暮色→夜） ==========
  - shot_id: EP54-S12
    scene_id: SCENE-008
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L02]
    framing: CU
    duration_sec: 12
    mode: i2v_ref
    camera_movement: push_in
    visual_description: >-
      特写——林秀芝的眼睛。她低头读信，目光快速扫过第一行——然后停住了。
      她的表情从疑惑变为震惊，从震惊变为一种复杂的沉默——不是悲伤，而是一种"果然如此"的了然。
      镜头缓缓推进到近景——信纸在她手中微微颤动。
      窗外已经完全暗下来，台灯的光在她脸上投下暖黄的光晕。
      她读完最后一个字，慢慢放下信纸，目光落在远处的黑暗里。
      桌面上，信纸摊开着，最后几行字在灯光下隐约可见。
    dialogue:
      - speaker: CHAR-001
        emotion: 读信·缓慢
        delivery: normal
        text: 「秀芝，你说得对。」
      - speaker: CHAR-001
        emotion: 读信·停顿
        delivery: soft
        text: 「嫁给有钱人不等于幸福。」
      - speaker: CHAR-001
        emotion: 读信·复杂
        delivery: soft
        text: 「但我不后悔——至少我知道了什么是不幸福。」
      - speaker: CHAR-001
        emotion: 放下信·低声
        delivery: soft
        text: 「慧兰……」
      - speaker: CHAR-001
        emotion: 内心·释然与悲伤交织
        delivery: internal
        text: 「你选了安全的路……我也差点选了那条路。」
      - speaker: CHAR-001
        emotion: 内心·声音渐轻
        delivery: internal
        text: 「前世的我，嫁了条件合适的人……结局和你一样。」
      - speaker: CHAR-001
        emotion: 低头看信·喃喃·金句
        delivery: soft
        text: 「幸福不是嫁给谁……是成为谁。」
      - speaker: CHAR-001
        emotion: 抬头·目光渐定
        delivery: normal
        text: 「还好。这辈子的我，选对了。」
