    description: 林秀芝没有像平时那样催她或讲道理。她只是从行李袋里掏出一张火车票，轻轻放在枕头边。票面是深蓝色的——"北京"两个字清晰可见。林满半睁着眼，看到火车票愣住了。林秀芝嘴角带着一丝神秘的笑。
    dialogue: |-
      **CHAR-001**[微笑·平静]：「我们去北京。」
      **CHAR-004**[猛地睁开眼·坐起来]：「啊？现在？！」
      **CHAR-001**[笑着点头]：「嗯。现在。」

