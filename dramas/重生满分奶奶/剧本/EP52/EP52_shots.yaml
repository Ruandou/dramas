    description: 绿皮火车的车厢——绿色皮革座椅套有细微裂纹，行李架上的编织袋和尼龙包堆叠，车窗是推拉式的。林满趴在窗边，脸几乎贴到玻璃上，看着外面飞驰而过的田野、村庄、山峦。林秀芝坐在对面，没有看窗外，而是看着女儿的背影。阳光在车厢内移动，切割出明暗交错的光影。桌上的搪瓷缸里泡着茶，蒸汽袅袅。
    notes: 火车场景注意保持车厢年代感——没有液晶屏、没有现代座椅套
    dialogue: |-
      **CHAR-004**[贴着玻璃·兴奋]：「妈你看——那群牛！还有一条河！」
      **CHAR-001**[看着女儿·温柔]：「嗯，妈妈看到了。」
      **CHAR-004**[转头·眼睛亮]：「我们真的要去北京？真的？」
      **CHAR-001**[点头·眼眶微红]：「真的。」
      **CHAR-001**[内心·轻声]：「前世……我连县城都没带她去过。这辈子，至少要让她看到世界有多大。」

