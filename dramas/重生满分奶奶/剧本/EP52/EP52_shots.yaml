    description: 傍晚时分，母女俩拖着行李走到家门口。夕阳把墙染成暖橙色，路灯还没亮，天边的云是绛紫色的。林秀芝脸上还有未褪的温暖笑意——她低头掏钥匙。然后她抬头——陈望秋站在门口的台阶上。他穿着浅灰色衬衫，袖口挽着，像是站了有一会儿了。他没有像往常那样笑着迎上来，他手里攥着一个东西——一个旧信封。林秀芝的笑意慢慢收了。
