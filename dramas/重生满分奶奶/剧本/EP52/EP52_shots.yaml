    description: 陈望秋走到林秀芝面前，把信封递过去。他的手很稳，但递信的动作有一种郑重的缓慢。信封是米黄色的——纸已经发黄发脆，边角有些磨损，明显放了很久。封面上没有邮票，没有邮戳，只有一行手写的字。林秀芝接过信，低头看信封上的字——她的手突然顿住了，像被电了一下。
