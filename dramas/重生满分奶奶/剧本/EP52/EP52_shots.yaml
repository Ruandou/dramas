    description: 清晨五点——窗外还是灰蓝色的。林满的房间略显凌乱，墙上贴着海报，桌上堆着课本。林满蜷缩在被子里睡得正香。林秀芝推门进来，已经穿戴整齐——米色针织开衫、深色长裤，肩上挎着一个帆布行李袋。她走到床边轻轻坐下。清晨的光线从窗帘缝透进来，暖黄色的细线落在林满的脸上。
    dialogue: |-
      **CHAR-001**[轻声·温柔]：「满满，起床了。」
      **CHAR-004**[迷迷糊糊·裹紧被子]：「唔……妈……今天又不用上学……」

