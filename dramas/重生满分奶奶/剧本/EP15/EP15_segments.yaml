# EP15 退还是进 — segments.yaml
# ⭐首个付费卡点
# Segment 数：8
# 总时长：~88s（EP02+ 合规区间 75-100s）

seedance_defaults:
  model: doubao-seedance-2-0-fast-260128
  ratio: "9:16"
  resolution: 720p
  duration_sec: "8-10"
  generate_audio: true
  prompt_suffix: "禁止画面中出现任何文字或字幕。年代质感写实风格，温暖金色色调，胶片颗粒感，情绪肖像摄影。"
