    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "走廊侧面。林秀芝低着头靠在墙上，陈望秋从画面左侧走来，站在她身旁一步远的地方，不靠近也不远离。他的白衬衫袖口卷到手肘，手里没有琴盒。走廊里其他考生渐渐散去，只剩下两人。阳光在两人之间的地板上画出一道亮线。"
    dialogue: "**CHAR-002**[温和]：「综合排名过线了。」\n**CHAR-001**[苦笑]：「勉强。」\n**CHAR-002**[平静]：「勉强也是过线。笔试你考了第一。」\n**CHAR-001**[低声]：「技术差太多……」\n**CHAR-002**[看她]：「还有复试。」"

  - shot_id: EP15-S04
    segment: SEG03
    scene: SCENE-014
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    shot_size: MLS
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "正午阳光炙热。音乐学院后门的青砖街道上，梧桐树叶遮出斑驳阴影。林秀芝走出校门，面前突然出现赵建国——穿着最好的深灰中山装，纽扣系到顶，满头是汗。他手里提着一个布包，脚上的黑布鞋沾满灰尘。几个骑自行车的路人从身后经过。"
    dialogue: "**CHAR-003**[紧张·挠头]：「秀芝……我来接你回去。」\n**CHAR-001**[震惊]：「建国？」"

  - shot_id: EP15-S05
    segment: SEG04
    scene: SCENE-014
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "赵建国憨厚地笑着，从布包里掏出一个油纸包——是路上买的烧饼，还冒着热气。他递到林秀芝面前，手上有厚厚的茧子。林秀芝没接，看着他额头的汗和中山装上的褶皱。梧桐叶的阴影落在两人脸上一晃一晃。"
    dialogue: "**CHAR-003**[认真]：「我跟厂里请了假。你考完了，咱回家吧。」\n**CHAR-001**[平静]：「你怎么知道我在这儿？」\n**CHAR-003**[低头]：「问了你妈……她说你来省城考什么钢琴。」\n**CHAR-003**[犹豫]：「钢琴那东西……你弹得又不好，何必呢？」\n**CHAR-001**[微微后退]：「……谁告诉你我弹得不好？」\n**CHAR-003**[急了]：「不是，我是说……条件，条件我都有。你跟我回去，工作稳定——」"

  - shot_id: EP15-S06
    segment: SEG05
    scene: SCENE-014
    characters: [CHAR-001, CHAR-002, CHAR-003]
    looks: [CHAR-001-L01, CHAR-002-L01, CHAR-003-L01]
    shot_size: MS
    duration_sec: 9
    mode: i2v_ref
    camera: 缓推
    prompt_zh: "陈望秋从校门走出，站在林秀芝身后三步远。赵建国看到他，笑容僵了一瞬。三人站在梧桐树荫下，阳光从叶缝漏下来像碎金子。陈望秋没有表情，只是看着林秀芝的背影。"
    dialogue: "**CHAR-003**[对陈望秋]：「你也在啊。」\n**CHAR-002**[点头]：「嗯。」\n**CHAR-003**[低声]：「她……考得不太好。」\n**CHAR-001**[转身·平静]：「我自己会跟他说。」\n**CHAR-001**[对赵建国]：「建国，你人很好。但我——」"

  - shot_id: EP15-S07
    segment: SEG06
    scene: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera: 缓推
    prompt_zh: "省城廉价旅馆房间，昏黄灯泡从天花板垂下。水泥墙刷了半截绿漆，木板床上铺着洗旧的花床单。林秀芝坐在床沿，双手摊开放在膝盖上——20岁的手，细嫩、没有老茧。桌上放着一瓶喝了一半的汽水。窗外是省城的夜色，远处有零星灯光。"
    dialogue: "**CHAR-001**[内心]：「退一步……回清河镇。当老师。嫁建国。一辈子安安稳稳。」"

  - shot_id: EP15-S08
    segment: SEG06
    scene: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "手部特写。林秀芝翻过手掌，看着掌心的纹路。指尖轻轻触碰拇指——在模拟弹琴的指法，动作缓慢而犹豫。灯光在手背上投下柔和的阴影。"
    dialogue: "**CHAR-001**[内心]：「六十年的脑子，配二十年的手……够不够？」\n**CHAR-001**[低声·自语]：「……够。一定够。」"

  - shot_id: EP15-S09
    segment: SEG07
    scene: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera: 缓推
    prompt_zh: "林秀芝起身走向墙上的镜子——一面带锈斑的小方镜，钉在绿漆墙上。她站在镜前，昏黄灯光照出她年轻的面容。齐耳短发微微散乱，碎花衬衫领口有一颗扣子松了。镜子边缘有水渍。"
    dialogue: "**CHAR-001**[低语]：「六十岁那年……我对护士说……」"

  - shot_id: EP15-S10
    segment: SEG07
    scene: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "镜中面容特写。她的眼睛从迷茫转为清明——60岁灵魂的坚定浮现出来。嘴角不再颤抖。灯光在瞳孔中映出小小的光点。"
    dialogue: "**CHAR-001**[内心·回忆]：「如果再来一次……我一定不会放弃。」\n**CHAR-001**[对镜子·坚定]：「还没有结束。」"

  - shot_id: EP15-S11
    segment: SEG08
    scene: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: ECU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "手部大特写。她的右手缓缓攥成拳头，指节发白，青筋微微鼓起。银色口琴的带子垂在手腕旁。拳头攥紧后停住不动。"
    dialogue: "**CHAR-001**[内心]：「这双手……败过一次。这次——不会再败。」"

  - shot_id: EP15-S12
    segment: SEG08
    scene: SCENE-015
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera: 镜头拉远
    prompt_zh: "窗口视角。林秀芝猛地抬头——窗外传来小提琴声。对面低矮建筑的窗台上，月光下坐着陈望秋，正在拉琴。琴身在月光中泛着温润的光。他的身影模糊但确定。林秀芝站在窗前，攥紧的拳头慢慢松开。琴声穿透夜色，像一句说不出口的话。"
    dialogue: "**CHAR-002**[内心]：「说不出口的话……那就用琴说。」"
