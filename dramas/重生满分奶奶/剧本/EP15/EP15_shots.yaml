    mode: i2v_ref
    camera: 缓推
    prompt_zh: "上午阳光从走廊尽头的大窗斜射进来，林秀芝站在水泥墙前的红纸成绩榜前。她微微仰头，眼眶泛红，嘴唇紧抿。身旁有三两个考生走过，没人在意她。碎花衬衫在日光下颜色柔和，腰间银色口琴反光。"
    dialogue: "**CHAR-001**[内心]：「笔试第一……钢琴倒数。」"

  - shot_id: EP15-S02
    segment: SEG01
    scene: SCENE-011
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    prompt_zh: "面部特写。阳光打在她右半边脸，左半边在阴影中。眼睛盯着红纸方向，嘴唇颤抖了一下又压住。一滴泪没落下来，被她用手背迅速擦掉。"
    dialogue: "**CHAR-001**[内心]：「六十年的脑子……配二十年的手。」\n**CHAR-001**[低声·自语]：「手会忘……但心记得。」"

  - shot_id: EP15-S03
    segment: SEG02
