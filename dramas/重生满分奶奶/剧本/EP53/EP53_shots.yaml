    camera_shot: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "陈望秋的手伸过来，轻轻覆在她的手上——不是握紧，只是覆着，传递温度。林秀芝抬起头看他，眼眶微微泛红。台灯的光从侧面照过来，在他们之间形成一层柔和的光晕。墙上映着两个人的影子，交叠在一起。她深吸一口气，终于低下头，手指缓缓探入信封的开口处。纸的摩擦声在静夜里格外清晰。"
    dialogue:
      - speaker: CHAR-001
        emotion: 深吸·缓缓
        text: "你说得对。我不该躲了。"
      - speaker: CHAR-002
        emotion: 微笑·点头
        text: "嗯。我陪你。"
      - speaker: CHAR-001
        emotion: 低头拆信·手微抖
        text: "致未来的我……这是第一行。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"

  - shot_id: EP53-S03
    scene_id: SCENE-008
    characters:
      - CHAR-001
    looks:
      - CHAR-001-L02
    props:
      - PROP-010
    camera_shot: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "极近的特写——她的手指缓缓将信纸从信封中抽出。纸张摩擦的声音，发黄的纸页边缘有细碎的裂痕。信纸折了三折，折痕处已经泛白，几乎要断裂。她的指尖轻轻展开信纸，动作极慢极轻——像是在触碰一件随时会碎的东西。古老墨水的痕迹在暖光下清晰可见，笔迹颤抖而有力。"
    dialogue:
      - speaker: CHAR-001
        emotion: 震惊·喃喃
        text: "这字迹……是我的没错。"
      - speaker: CHAR-001
        emotion: 指尖轻抚字迹
        text: "是我老了以后……六十岁写的字。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
    prop_reference_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-010.png"

  - shot_id: EP53-S04
    scene_id: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      - CHAR-001-L02
      - CHAR-002-L02
    props:
      - PROP-010
    camera_shot: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "陈望秋凑近了一些，目光落在信纸上，但没有读——他只是在确认她的状态。林秀芝的呼吸变浅了，目光钉在信纸上。她的手指微微颤抖，眼眶开始泛红——不是悲伤，是那种'原来这一切都是真的'的震动。台灯的光在她眼中闪烁。"
    dialogue:
      - speaker: CHAR-002
        emotion: 轻声·怕惊动什么
        text: "你确定这是你写的？"
      - speaker: CHAR-001
        emotion: 点头·声音发紧
        text: "我认得出。每一个笔画……都是我老了以后才会写的手势。"
      - speaker: CHAR-001
        dialogue_type: inner
        emotion: 内心·颤动
        text: "原来我真的做到了……这封信跨过了时间……"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"

  - shot_id: EP53-S05
    scene_id: SCENE-008
    characters:
