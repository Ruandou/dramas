    camera_shot: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝抬起头看了陈望秋一眼，确认他在听。他微微点头。她低下头继续读，声音稳了一些。陈望秋的目光没有离开她，他的手轻轻放在桌上，指尖离她的手很近——没有刻意触碰，但随时可以。"
    dialogue:
      - speaker: CHAR-002
        emotion: 低声·确认
        text: "1988……就是你跟我说的那一年。"
      - speaker: CHAR-001
        emotion: 点头·继续读
        text: "请记住：不要害怕犯错。"
      - speaker: CHAR-001
        emotion: 读信·声音微颤
        text: "所有的遗憾……都是生命的一部分。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"

  - shot_id: EP53-S07
    scene_id: SCENE-008
    characters:
