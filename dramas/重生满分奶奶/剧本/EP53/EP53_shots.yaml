    camera_shot: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "深夜的客厅，只有一盏旧台灯亮着，暖黄的光铺在木桌面上。窗外是深蓝色的夜，远处有零星的灯火。林秀芝坐在桌边，手里攥着那个发黄的信封（PROP-010），指节泛白。信封边缘已经磨损，纸纹里嵌着岁月的灰尘。陈望秋坐在她身旁，浅灰色衬衫，安静地陪着她。桌上放着一杯早已凉透的茶，茶面凝了一层薄膜。"
    dialogue:
      - speaker: CHAR-001
        emotion: 声音发颤·低
        text: "我该看吗？"
      - speaker: CHAR-002
        emotion: 温柔·目光暖
        text: "它在等你。等了一整天了。"
      - speaker: CHAR-001
        emotion: 低头·手指摩挲信封边缘
        text: "可是我害怕——"
      - speaker: CHAR-002
        emotion: 轻声·打断
        text: "怕什么？我在。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
