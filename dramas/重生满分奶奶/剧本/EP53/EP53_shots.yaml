    camera_shot: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "镜头缓缓推近信纸——发黄的纸面，蓝色的墨水字迹，颤抖但有力的笔画。她的手指沿着字行缓缓移动，像在触摸另一个时空的自己的痕迹。字体端庄但略显无力——老年人的笔迹特征。暖光在纸面形成微妙的阴影。"
    dialogue:
      - speaker: CHAR-001
        emotion: 读信·缓而清晰
        text: "致未来的我——"
      - speaker: CHAR-001
        emotion: 读信·声音轻
        text: "如果你真的在1988年重新来过——"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
