  - shot_id: EP53-S12
    scene_id: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      - CHAR-001-L02
      - CHAR-002-L02
    props:
      - PROP-010
    camera_shot: CU
    duration_sec: 12
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "极近的特写——她的眼睛。瞳孔里有光在晃动——台灯的光，像一盏在深夜里独自亮着的灯。她的表情从困惑变为一种深深的恐惧——不是害怕未知的恐惧，而是'我好像知道这是什么'的恐惧。信纸在她手中微微颤抖，纸张发出细碎的声响。然后她慢慢抬起头，看向陈望秋。她的嘴唇动了动，声音很轻很轻。陈望秋的表情从担忧变为紧张。镜头缓推到双人近景——她看着他的眼睛，像是在确认自己是不是在做梦。桌面上，信纸摊开着，最后一行字'那里有你需要知道的真相'在台灯下隐约可见。"
    dialogue:
      - speaker: CHAR-001
        emotion: 瞳孔微颤·声音很轻
        text: "307病房……是那间。"
      - speaker: CHAR-002
        emotion: 警觉·俯身
        text: "哪间？"
      - speaker: CHAR-001
        emotion: 声音发紧·像在憋着呼吸
        text: "我做心脏手术的那间病房。"
      - speaker: CHAR-001
        emotion: 声音低得几乎听不见
        text: "不是这一世。"
      - speaker: CHAR-002
        emotion: 倒吸一口气
        text: "……那一世。"
      - speaker: CHAR-001
        emotion: 攥紧信纸·复杂
        text: "它在告诉我——那里还有真相。"
      - speaker: CHAR-001
        emotion: 声音断断续续
        text: "2016年……还有十一年……但那间病房……我死在那里。"
