      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"
    prop_reference_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/重生满分奶奶/PROP-010.png"

  - shot_id: EP53-S02
    scene_id: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    looks:
