    camera_shot: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝读到这里，声音突然哽住了。她停下，嘴唇微微颤抖，眼泪无声滑落，滴在信纸上，墨迹洇开了一小片。她抬手想擦泪，但手也在抖。陈望秋没有说话，只是把她手里的信纸轻轻压低了一些，让她不用举着——他的手接过了信纸一角，但没有抢走读，只是帮她托着。他的另一只手覆住了她握拳的手。台灯的光把两人的影子拉得很长。"
    dialogue:
      - speaker: CHAR-001
        emotion: 读信·哽咽·几乎说不下去
        text: "所有的遗憾……都是生命的一部分。"
      - speaker: CHAR-002
        emotion: 柔声·眼中有光
        text: "六十岁的你……说得很对。"
      - speaker: CHAR-001
        emotion: 抬头看他·泪流满面
        text: "是我自己写给自己的话啊……"
      - speaker: CHAR-001
        dialogue_type: inner
        emotion: 内心·释然与悲伤交织
        text: "原来我一直知道答案……只是不愿意面对。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"

  - shot_id: EP53-S08
    scene_id: SCENE-008
    characters:
      - CHAR-001
    looks:
      - CHAR-001-L02
    props:
      - PROP-010
    camera_shot: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝擦了擦眼泪，重新稳住声音继续读。她低头看着信纸，嘴角不自觉地微微上扬——一种苦涩但温暖的笑意。泪水还挂在脸上，但她的呼吸平稳了一些。她读到最后那句话时，声音越来越轻，像在咀嚼每一个字的分量。"
    dialogue:
      - speaker: CHAR-001
        emotion: 读信·泪中带笑
        text: "你不需要做一个完美的母亲——"
      - speaker: CHAR-001
        emotion: 读信·声音碎但坚定
        text: "只需要做一个真实的母亲。"
      - speaker: CHAR-001
        emotion: 看着信纸·低语
        text: "落款——2016年的你。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"

  - shot_id: EP53-S09
    scene_id: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    looks:
      - CHAR-001-L02
      - CHAR-002-L02
    props:
      - PROP-010
    camera_shot: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "陈望秋伸出手，轻轻替她擦去脸上的泪痕。他的动作很慢很轻，拇指划过她的颧骨。林秀芝抬起眼睛看他，眼中有泪光，但也有一种从未有过的明亮——像是终于被什么东西接住了。两个人的距离很近，呼吸可闻。窗外远处传来一声夜鸟的轻啼。"
    dialogue:
      - speaker: CHAR-002
        emotion: 温柔·金句
        text: "你已经做到了。"
      - speaker: CHAR-002
        emotion: 微笑·认真
        text: "真实的你，就很好。"
      - speaker: CHAR-001
        emotion: 泪中带笑
        text: "真的吗……我这辈子。"
      - speaker: CHAR-002
        emotion: 坚定·点头
        text: "嗯。满满那孩子不是说了吗——你在学。"
      - speaker: CHAR-001
        dialogue_type: inner
        emotion: 内心·温暖
        text: "被女儿理解之后……又被六十岁的自己理解了。这辈子，值了。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486257655c9a2a2bfec8b82a34b9075d10d5d2c5eccb1fb_0.jpeg"

  - shot_id: EP53-S10
    scene_id: SCENE-008
    characters:
      - CHAR-001
    looks:
      - CHAR-001-L02
    props:
      - PROP-010
    camera_shot: ECU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "镜头缓缓推进到她的面部——眼睛。她低头看着'2016年的你'这几个字，瞳孔微微变化。从感动到困惑，从困惑到某种更深的理解。她的手指下意识地在桌面上轻轻敲击了两下——那是她紧张时弹琴键的习惯动作。她抬起头，目光从信纸上移开，望向虚空中的某一点——像是在计算什么。"
    dialogue:
      - speaker: CHAR-001
        emotion: 愣住·思考
        text: "2016年……那是我写信的时间。"
      - speaker: CHAR-002
        emotion: 轻声
        text: "你从未来给自己寄了信。"
      - speaker: CHAR-001
        emotion: 喃喃·像在算
        text: "2016年……距离现在还有十一年。"
      - speaker: CHAR-001
        dialogue_type: inner
        emotion: 内心·震动
        text: "原来时间不是直线走的……它真的可以被折叠……"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
      - "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/021782486210435c9a2a2bfec8b82a34b9075d10d5d2c5e7d5b02_0.jpeg"

  - shot_id: EP53-S11
    scene_id: SCENE-008
    characters:
      - CHAR-001
    looks:
      - CHAR-001-L02
    props:
      - PROP-010
    camera_shot: ECU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "她的目光继续往下移动——信纸的最下方还有一段话，比上面的字更小、更挤，似乎是后来加上去的。她的表情从沉思慢慢转变为困惑，然后是一种逐渐放大的震惊。她读得更慢了，每个字都像在确认自己没看错。当读到'307病房'时，她的呼吸明显停了一拍。特写捕捉到她瞳孔的细微收缩。"
    dialogue:
      - speaker: CHAR-001
        emotion: 读信·声音变了
        text: "P.S. 在2016年的春天——"
      - speaker: CHAR-001
        emotion: 读信·更缓·每个字都加重
        text: "去清河镇中心医院的307病房。"
      - speaker: CHAR-001
        emotion: 停住·眼神变了
        text: "307……病房？"
      - speaker: CHAR-001
        emotion: 读信·声线低下去
        text: "那里有……你需要知道的真相。"
    image_reference_url: "https://ark-acg-cn-beijing.tos-cn-beijing.volces.com/doubao-seedream-5-0/0217824870909274f01ec66621d0980a42fd45436ed759574b45d_0.jpeg"
    character_reference_urls:
