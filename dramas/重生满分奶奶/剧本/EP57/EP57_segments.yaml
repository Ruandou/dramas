segments:
  - segment_id: SEG01
    title: 琴声剧断（碎片式·宁静→剧痛→危机）
    narrative_function: "开场钩子。林秀芝在家弹琴，心脏突然剧痛——命运倒计时启动。上集（EP56）两个小满同框的温暖在这里被突然打断。"
    scene: SCENE-008
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP57-S01
    total_duration_sec: 8
    transition_from_previous: dissolve（时间跃迁：EP56毕业典礼→EP57初春家中）
    dominance_rhythm: 碎片式
    notes: "SPROP-003（乐谱）在钢琴谱架上可见。林秀芝心脏剧痛是EP55-57积累的身体危机在本次发作的定点。"

  - segment_id: SEG02
    title: 医生的命令（权力翻转·遮掩→担忧→坚定）
    narrative_function: "冲突升级。林满以医生身份坚持要母亲住院，林秀芝从掩饰到接受。母女权力关系翻转——前世林秀芝控制女儿，这辈子女儿保护母亲。"
    scene: SCENE-008
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP57-S02
      - EP57-S03
    total_duration_sec: 11
    transition_from_previous: hard_cut
    dominance_rhythm: 权力翻转
    notes: "林满'我是医生'的台词是关键——前世她没有这个身份，这辈子她选医学是为了保护妈妈。林秀芝的内心独白链接EP53跨时空信件的线索（307病房）。"

  - segment_id: SEG03
    title: 他放下了一切（蓄力式·等待→安心→守护）
    narrative_function: "情感高亮。陈望秋放下所有工作来陪她——金句'唯独你——我从来没放下过'是陈望秋视角中与前世的最大呼应（前世他不在身边，这辈子的每分每秒他都在）。"
    scene: SCENE-010
    time_of_day: 傍晚
    interior_exterior: 内景
    shot_ids:
      - EP57-S04
      - EP57-S05
    total_duration_sec: 11
    transition_from_previous: dissolve（时间推移·午后→傍晚，场景切换·家→医院）
    dominance_rhythm: 蓄力式
    notes: "SCENE-010（307病房）首次在本集出现。夕阳暖光是本段情绪基调——与前半段家中光线的午后形成时间推进感。陈望秋金句为本集第一句可截图台词。"

  - segment_id: SEG04
    title: 老朋友来了（蓄力式·意外→感慨→释然）
    narrative_function: "群像情感汇聚。赵建国和赵小满来探望，形成EP66赵建国说出'谢谢你拒绝我'的情感伏笔。前世的两个关键人物共同见证她走向307病房。"
    scene: SCENE-010
    time_of_day: 傍晚
    interior_exterior: 内景
    shot_ids:
      - EP57-S06
      - EP57-S07
    total_duration_sec: 11
    transition_from_previous: hard_cut
    dominance_rhythm: 蓄力式
    notes: "⚠️ S06门口三人同框（CHAR-003+CHAR-007+CHAR-002）在Seedance边界，建议在画面描述中以CHAR-003+CHAR-007为主，CHAR-002和CHAR-001作为反应镜头分别处理。赵建国的台词'跟你学了一辈子'是本集第二句金句候选。"

  - segment_id: SEG05
    title: 满屋子的信（独白递进·宁静→温暖→感动）
    narrative_function: "温情段落。展示学生来信和满屋的花——这是林秀芝用一生换来的爱。为EP58中的'不是冰冷的病房而是充满爱的病房'做最后的情感积累。"
    scene: SCENE-010
    time_of_day: 深夜
    interior_exterior: 内景
    shot_ids:
      - EP57-S08
    total_duration_sec: 10
    transition_from_previous: dissolve（时间推移·傍晚→深夜，探视时间过去）
    dominance_rhythm: 独白递进
    notes: "全段纯内心独白。'我以为这辈子最大的收获是钢琴，原来——是他们'是本集第三句金句。镜头拉远展示病房全貌——花、信、贺卡堆满房间，与前世的冰冷病房形成视觉对比。"

  - segment_id: SEG06
    title: 护士来了（碎片式·温情→打断→独处）
    narrative_function: "过渡段。护士巡房带来人间温度，也提醒时间流逝。护士走后林秀芝独处——为SEG07-08的月光旧信做情绪铺垫。"
    scene: SCENE-010
    time_of_day: 深夜
    interior_exterior: 内景
    shot_ids:
      - EP57-S09
      - EP57-S10
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 碎片式
    notes: "[待补：护士]是一个新的群演角色（CHAR-GRP-09+）。护士的台词'您真幸福'是对林秀芝这一生的第三方验证——她确实被爱包围着。Shot 10是情绪过渡——从温暖到独处的月光时空。"

  - segment_id: SEG07
    title: 抽屉里的信（独白递进·安静→触碰→连接）
    narrative_function: "悬念升温。林秀芝从抽屉中拿出那封跨越时空的信——EP52中发现的旧信。月光照亮信封上的字迹，她与60岁的自己建立连接。"
    scene: SCENE-010
    time_of_day: 深夜
    interior_exterior: 内景
    shot_ids:
      - EP57-S11
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 独白递进
    notes: "PROP-010（跨时空信件）是本段核心道具。这是EP57到EP58的叙事桥梁——信上的内容（307病房）直接指向下一集。月光作为视觉母题开始被推向高潮。"

  - segment_id: SEG08
    title: 月光下的光（情感钩·触动→确认→悬念）
    narrative_function: "集末悬念/Cliffhanger Zone。信在月光下发出微光——超越现实的视觉处理。林秀芝确认了'60岁的自己一直在等她'。'明天见'是EP57的最后一句话，也是EP58的开门钥匙。"
    scene: SCENE-010
    time_of_day: 深夜
    interior_exterior: 内景
    shot_ids:
      - EP57-S12
    total_duration_sec: 12
    transition_from_previous: hard_cut
    dominance_rhythm: 情感钩
    notes: "⚠️ 发光效果——如果Seedance 2.0无法渲染'信纸发光'效果，可在Prompt中改为'月光照在信纸上，字迹被照亮得格外清晰，仿佛在发光'的保守方案。全段纯独白+无对白段——但SEG08是单人独白段，统计上不计入单人独白段限制（因为有SEG01-06的整体对话覆盖）。'明天见'三重含义：向今晚的家人告别、向60岁的自己告别、向观众许下EP58的承诺。钩子类型：H-SUS + H-EMO。"
