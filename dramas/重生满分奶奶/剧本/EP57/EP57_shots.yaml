    camera_movement: fixed
    visual_description: "赵建国坐下，和站在床另一侧的陈望秋形成对称。窗台上已经摆了好几束花——白色的百合、粉色的康乃馨、还有不知名的野花。赵建国看着林秀芝，沉默了几秒，然后开口——没有客套，没有铺垫，只有他那种特有的、直来直去的真诚。夕阳的光把整个房间染成暖金色。赵小满站在父亲身后不远处。"
    dialogue:
      - speaker: CHAR-003
        emotion: 真诚
        delivery: 看着林秀芝·声音发沉
        text: 「秀芝，手术的事——别怕。」
      - speaker: CHAR-003
        emotion: 认真
        delivery: 停顿·眼神认真
        text: 「你这一辈子，什么坎儿没过过？」
      - speaker: CHAR-001
        emotion: 被触动
        delivery: 浅浅笑了
        text: 「建国，你什么时候学会说这种话了？」
      - speaker: CHAR-003
        emotion: 不好意思但真诚
        delivery: 低头又抬头·认真
        text: 「跟你学的。跟你学了一辈子。」
      - speaker: CHAR-007
        emotion: 轻声
        delivery: 补充
        text: 「林老师，音乐教室的孩子们——都在等您出院。」
      - speaker: CHAR-001
        emotion: 眼眶发热
        delivery: 握紧被角·点头
        text: 「好。我一定回去。」
      - speaker: CHAR-001
        emotion: 感慨
        delivery: 内心独白
        text: 「前世，病床边没有这么多人。这次……不一样了。」

  - shot_id: EP57-S08
    scene: SCENE-010
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: MLS
    duration_sec: 10
    mode: i2v_ref
    camera_movement: pull_out
    visual_description: "深夜的病房。探视时间已过，家人回去了。病房安静下来，只有心电监护仪发出微弱的、有节奏的滴声。镜头从林秀芝的视角慢慢拉远——展示整个房间。窗台上、床头柜上、地上——到处是花束、果篮、贺卡和一叠叠用橡皮筋扎好的信。一封封手写信叠在一起，有的信纸露在外面，可以看到稚嫩的字迹。卡片上有手画的钢琴和音乐符号。那些花在白色的房间里绽放——有百合、康乃馨、满天星，还有一个塑料瓶里插着一朵不知哪个学生从路边摘来的小野花。林秀芝坐在床上，手里捧着一封拆开的信，嘴角带着淡淡的笑。温暖的灯光和月光交织。"
    dialogue:
      - speaker: CHAR-001
        emotion: 轻柔
        delivery: 内心独白·看着满屋的信和花
        text: 「这些信……都是孩子们写的。」
      - speaker: CHAR-001
        emotion: 笑了
        delivery: 内心独白·拿起一封画着钢琴的信
        text: 「小虎的字还是这么丑。但他的信每次都写最长。」
      - speaker: CHAR-001
        emotion: 温暖中带哽咽
        delivery: 内心独白·拿起另一封信
        text: 「'林老师，等我考完试就去看您。您要等我。'」
      - speaker: CHAR-001
        emotion: 金句·感动
        delivery: 内心独白·把信贴在胸口
        text: 「我以为这辈子最大的收获是钢琴。原来——是他们。」

  - shot_id: EP57-S09
    scene: SCENE-010
    characters:
