    visual_description: "2016年初春的客厅，窗外光秃的树枝在风中微微晃动。林秀芝（48岁，齐肩微卷发，鬓角银丝比去年更多，穿一件深灰色高领毛衣）坐在老钢琴（PROP-003在谱架上）前，手指在琴键上游走。琴声流畅温暖——《月光奏鸣曲》变奏。茶几上放着一杯凉透的茶和一包未拆封的药。突然，她手指在高潮处猛地一停——琴键发出一声突兀的重音。她的手按住左胸，身体微倾，额头上瞬间渗出汗珠。呼吸变得急促，阳光照在她收紧的眉头和微张的嘴唇上。"
    dialogue:
      - speaker: CHAR-001
        emotion: 平静中带隐忧
        delivery: 内心独白·弹琴时
        text: 「月光……弹了多少年了。」
      - speaker: CHAR-001
        emotion: 发紧
        delivery: 内心独白·手停住按住胸口
        text: 「……又来了。比上次更频繁了。」
      - speaker: CHAR-001
        emotion: 强撑
        delivery: 低声·对自己说
        text: 「我没事……我没事的。」

  - shot_id: EP57-S02
    scene: SCENE-008
    characters:
      - CHAR-004
      - CHAR-001
    look_ids:
