    camera_movement: fixed
    visual_description: "敲门声响起。陈望秋起身去开门。门口站着赵建国（51岁，深灰色夹克，头发比年轻时稀疏许多，鬓角全白，但腰板依然挺直，手里拎着一个果篮）和赵小满（26岁，浅驼色大衣，银色细框眼镜，低马尾，气质文静，手里抱着一束白色百合）。赵建国站在门口有些局促——大半辈子了，他面对林秀芝时还是有一丝手足无措。赵小满轻轻推了推父亲的胳膊，示意他进去。⚠️ 3人同框（CHAR-003+CHAR-007+CHAR-002在门口），镜头聚焦门口互动，CHAR-001在病床上为背景。"
    dialogue:
      - speaker: CHAR-003
        emotion: 沉稳但局促
        delivery: 站在门口·声音直接
        text: 「听说你住院了。来看看。」
      - speaker: CHAR-001
        emotion: 意外但温暖
        delivery: 看到他们
        text: 「建国……小满，你们怎么来了？」
      - speaker: CHAR-007
        emotion: 关切
        delivery: 走进来·把花放在窗台上·温声
        text: 「林老师，听说您要手术。我们都坐不住。」
      - speaker: CHAR-003
        emotion: 笨拙
        delivery: 把果篮放下·挠了挠头
        text: 「也不知道买什么。水果——总归能吃。」
      - speaker: CHAR-002
        emotion: 自然
        delivery: 替赵建国拉了把椅子
        text: 「坐吧。站着说话累。」

  - shot_id: EP57-S07
    scene: SCENE-010
    characters:
      - CHAR-001
      - CHAR-003
      - CHAR-002
    look_ids:
