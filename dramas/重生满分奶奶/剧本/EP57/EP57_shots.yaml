    camera_movement: fixed
    visual_description: "护士关上门，脚步声远去。病房重新安静下来。林秀芝没有立刻躺下——她坐在床上，看着满屋子的花和信。她伸手关了床头灯，只留下壁灯微弱的光。月光从窗外涌进来，照在她脸上。她的表情在月光下慢慢变化——从温暖的笑容变成深沉的安静。那是暴风雨来临前的平静，一个人面对命运时的独处时刻。"
    dialogue:
      - speaker: CHAR-001
        emotion: 平静
        delivery: 内心独白·关了灯在月光中静静坐着
        text: 「他们都走了。」
      - speaker: CHAR-001
        emotion: 轻得像呼吸
        delivery: 内心独白
        text: 「现在……只有我一个人了。」
      - speaker: CHAR-001
        emotion: 深沉
        delivery: 深吸一口气·缓慢吐出
        text: 「明天——就是那一天。」

  - shot_id: EP57-S11
    scene: SCENE-010
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "林秀芝在黑暗中坐了一会儿。然后她慢慢地、仿佛被什么力量牵引着——伸手打开了床头柜的抽屉。月光照进抽屉里，照亮了最深处那个东西——一个发黄的信封（PROP-010）。她的手在半空中停了一瞬，然后轻轻地、像触碰时光一样，把信封拿了出来。她将信封放在手心，月光照在信封上——上面有她60岁时的字迹，模糊但真切。她轻轻摩挲着发黄的纸缘。"
    dialogue:
      - speaker: CHAR-001
        emotion: 目光复杂
        delivery: 内心独白·看着信封
        text: 「又到了看这封信的时候。」
      - speaker: CHAR-001
        emotion: 遥远
        delivery: 内心独白
        text: 「从老房子墙缝里找到……快十年了。」
      - speaker: CHAR-001
        emotion: 复杂的情绪
        delivery: 内心独白·轻抚信封
        text: 「每次看，都觉得是另一个我在对我说话。」
      - speaker: CHAR-001
        emotion: 低声
        delivery: 像在跟过去的自己说话
        text: 「你……还在吗？」

  - shot_id: EP57-S12
    scene: SCENE-010
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: ECU
    duration_sec: 12
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "大特写——林秀芝的手轻轻抽出信纸，手指微颤。月光刚好穿过窗户，照在泛黄的信纸上。信纸边缘有些脆裂，折痕处已经发白。当月光触及信纸的瞬间——那几行字，在月光下竟然微微发出银色的光晕。不是错觉——是真的在发光。她的手顿住了，低头看着那些发光的字。最熟悉的那行字清晰浮现：'307病房有你需要知道的真相。'她的嘴唇微微张开，眼眶里有泪光闪烁。信纸上的光芒如呼吸般轻轻闪动。她抬起头，看向窗外的月亮——同一轮月亮，照着2016年的她，也照着1988年的她，也照着60岁的她。然后她低头，目光回到那行字上。镜头缓缓推向那发光的字迹。⚠️发光效果——若Seedance不稳定改用'月光照在信纸上字迹格外清晰'替代。"
    dialogue:
      - speaker: CHAR-001
        emotion: 金句·声音微颤但不恐惧
        delivery: 低头看着发光的信纸
        text: 「原来——你一直在等我。」
      - speaker: CHAR-001
        emotion: 释然中带着勇气
        delivery: 内心独白·抬头看月亮又低头看信
        text: 「前世的我……你准备好了吗？」
      - speaker: CHAR-001
        emotion: 宁静
        delivery: 轻声·双手将信纸贴在胸前闭上眼
        text: 「明天见。」
      - speaker: null
        emotion: 无对白
        delivery: 月光下信纸上的字轻轻闪烁了一下
        text: ""
