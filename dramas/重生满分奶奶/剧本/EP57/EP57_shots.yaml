    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林满（22岁，白大褂外套深色棉服，实习医生胸牌挂在领口，低马尾，眉头紧锁）快步从厨房门口走进来。她听到了那声突兀的重音。目光直接落在母亲按着胸口的手上，脸色瞬间变了。她一把抓起茶几上那包未拆封的药查看——药已经过期了。她的手指微微颤抖，但声音控制得很稳。"
    dialogue:
      - speaker: CHAR-004
        emotion: 担忧但压住
        delivery: 快步走近·声音压低但很急
        text: 「妈——胸口又疼了？」
      - speaker: CHAR-001
        emotion: 掩饰
        delivery: 松开手·勉强笑
        text: 「没事。弹太久了，手抽筋。」
      - speaker: CHAR-004
        emotion: 沉下脸
        delivery: 举起过期药
        text: 「弹琴手抽筋——跟心脏有什么关系？」
      - speaker: CHAR-004
        emotion: 不容商量
        delivery: 直视母亲
        text: 「你必须住院。」
      - speaker: CHAR-001
        emotion: 想辩解
        delivery: 看着女儿的眼睛·话咽了回去
        text: 「小满，妈真的……」
      - speaker: CHAR-004
        emotion: 坚定带着微颤
        delivery: 打断·声音坚定
        text: 「我是医生。我的病人是你，你得听我的。」

  - shot_id: EP57-S03
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "特写——林秀芝的脸。女儿那句'我是医生'让她的表情凝固了一瞬。她看着眼前这个年轻坚定的女孩——那个她前世从未有过的'医生女儿'。她张了张嘴，想说'我真的没事'，但想起了那封信上写的地址——307病房。该来的终究要来。她的表情从抗拒慢慢变成一种奇异的平静——不是屈服，而是接受。她轻轻地、几乎不可察觉地点了一下头。"
    dialogue:
      - speaker: CHAR-001
        emotion: 复杂
        delivery: 内心独白·看着女儿
        text: 「前世……我从来没听过这句话。」
      - speaker: CHAR-001
        emotion: 淡笑中带涩
        delivery: 内心独白
        text: 「前世的我——没有医生女儿。」
      - speaker: CHAR-001
        emotion: 接受
        delivery: 轻声·像对自己说
        text: 「好。妈听你的。」
      - speaker: CHAR-001
        emotion: 深沉
        delivery: 内心独白
        text: 「307病房……在等我。像那封信里写的一样。」

  - shot_id: EP57-S04
    scene: SCENE-010
    characters:
