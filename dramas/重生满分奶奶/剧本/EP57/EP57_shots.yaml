    camera_movement: fixed
    visual_description: "门被轻轻推开。陈望秋（50岁，深色休闲夹克，鬓角花白，手里拎着一个保温壶和一个琴盒）走进来。他脸上带着温和的笑，但眼神里的担忧藏不住。他走到床边，把保温壶放在床头柜上，顺手调整了一下那束花的位置——像他做了一辈子的事：沉默地、细心地、不声张地照顾她。"
    dialogue:
      - speaker: CHAR-001
        emotion: 意外但温暖
        delivery: 转头看到他·嘴角扬起
        text: 「你怎么来了？今天不是有课吗？」
      - speaker: CHAR-002
        emotion: 平静
        delivery: 放下保温壶·轻声
        text: 「退掉了。」
      - speaker: CHAR-001
        emotion: 微愣
        delivery: 不敢相信
        text: 「退掉了？那可是你最喜欢的学生——」
      - speaker: CHAR-002
        emotion: 温和但坚定
        delivery: 打断
        text: 「学生以后还可以教。你只有一个。」
      - speaker: CHAR-002
        emotion: 金句·深沉
        delivery: 坐在床边椅子上·声音很低很稳
        text: 「秀芝，我这辈子放下过很多东西。但唯独你——我从来没放下过。」
      - speaker: CHAR-001
        emotion: 眼眶微红
        delivery: 伸手握住他的手
        text: 「望秋……」
      - speaker: CHAR-002
        emotion: 守护
        delivery: 回握她的手·看着窗外·轻声
        text: 「我在这儿。哪也不去。」

  - shot_id: EP57-S06
    scene: SCENE-010
    characters:
