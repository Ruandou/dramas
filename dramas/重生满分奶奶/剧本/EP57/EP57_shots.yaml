    mode: i2v_ref
    camera_movement: fixed
    visual_description: "病房（SCENE-010·307病房）。傍晚的夕阳透过窗户斜照进来，在白色地板上投下暖橘色的光斑。林秀芝穿着蓝白条纹病号服，半靠在升高了的床头。窗台上已经放了一束花。床头柜上放着水杯和几本书。她看着窗外，神情平静但不轻松。"
    dialogue:
      - speaker: CHAR-001
        emotion: 平静
        delivery: 内心独白·靠在床头看窗外
        text: 「2016年……就是今年。」
      - speaker: CHAR-001
        emotion: 感慨
        delivery: 内心独白·低头看自己的手
        text: 「和前世一模一样的病房。但这一次——」

  - shot_id: EP57-S05
    scene: SCENE-010
    characters:
      - CHAR-002
      - CHAR-001
    look_ids:
      - CHAR-002-L02
      - CHAR-001-L02
    shot_size: MCU
