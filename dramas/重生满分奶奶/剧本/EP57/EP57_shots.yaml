        emotion: 轻声·带着微笑
        delivery: 走进来·提醒时间
        text: 「林老师，快十一点了。明天手术——得好好休息。」
      - speaker: CHAR-001
        emotion: 温和
        delivery: 放下信·笑
        text: 「好，马上睡了。」
      - speaker: "[待补：护士]"
        emotion: 羡慕
        delivery: 看了一眼满屋的花
        text: 「您真幸福。我在这层楼干了三年——没见过谁的病房有这么多花。」
      - speaker: CHAR-001
        emotion: 满足
        delivery: 环视房间·微笑
        text: 「是啊……我很幸福。」
      - speaker: "[待补：护士]"
        emotion: 温柔
        delivery: 走到门口·回头
        text: 「晚安，林老师。」
      - speaker: CHAR-001
        emotion: 感谢
        delivery: 点头
        text: 「晚安。辛苦你了。」

  - shot_id: EP57-S10
    scene: SCENE-010
    characters:
