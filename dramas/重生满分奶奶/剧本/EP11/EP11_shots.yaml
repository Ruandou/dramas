    prompt_zh: >
      后台续接。陈望秋快速取出小提琴，走到钢琴旁侧耳听音，拉出标准音。
      两个乐器声音交汇，逐渐趋近。林秀芝表情从绝望变专注变惊喜。
    dialogue: >
      CHAR-002[专注]：「再来。一个一个校。」// 
      CHAR-001[轻声]：「准了……这个准了。」// 
      CHAR-002[继续拉]：「还有三个。快。」

