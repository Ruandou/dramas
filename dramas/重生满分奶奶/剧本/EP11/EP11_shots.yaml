shots:
  # ---- SEG01: 钢琴被人动了手脚 ----
  - shot_id: EP11-S01
    segment: SEG01
    scene: SCENE-005
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    reference_images:
      - type: scene
        id: SCENE-005
        cdn_url: *scene_005
      - type: look
        id: CHAR-001-L01
        cdn_url: *look_001
      - type: look
        id: CHAR-002-L01
        cdn_url: *look_002
    prompt_en: >
      A dimly lit backstage area of a 1988 Chinese provincial cultural palace theater. 
      A dark brown upright piano sits near the wing curtain, lid open. A young woman 
      (20, ear-length bob, pink floral blouse, dark blue cotton trousers, black cloth 
      shoes, silver harmonica at waist) rushes to the piano and presses several keys — 
      the sound is clearly out of tune, dissonant and harsh echoing through the empty 
      backstage. Her fingers freeze, expression shifting from anticipation to shock. 
      Through the curtain gap, golden stage light spills in. A tall young man (22, 
      white cotton shirt with collar slightly open, dark trousers, black canvas shoes, 
      black violin case slung on left shoulder) hurries over from the shadows. He sees 
      her crouching by the piano checking the tuning pins. Dim yellow bulbs cast long 
      shadows. Distant audience chatter is faintly audible.
    prompt_zh: >
      傍晚文化宫舞台侧面昏暗后台。深棕色立式钢琴旁，林秀芝按琴键后发现走调。
      陈望秋从小提琴琴盒里快步赶来。昏黄灯泡投下长影。
    dialogue: >
      CHAR-001[震惊]：「什么……」// 
      CHAR-001[低声·自语]：「音准全乱了。有人动了调音钉。」// 
      CHAR-002[急切·走过来]：「怎么了？」// 
      CHAR-001[抬头·压低声音]：「有人动了调音钉。几个键的音全偏了。」// 
      CHAR-002[眼神一沉]：「……演出前十分钟。」// 
      CHAR-001[内心]：「谁干的？来不及查了。」

