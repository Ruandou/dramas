    prompt_zh: >
      舞台中央白色追光灯。林秀芝走入光圈坐在钢琴前。台下观众席昏暗——
      前排校长（黑框眼镜、深蓝中山装），中间林母（短卷发、碎花罩衫）。
      林秀芝闭眼，手指落下。
    dialogue: >
      CHAR-001[内心]：「这辈子……我终于坐在这里了。」// 
      CHAR-001[内心]：「上辈子我60岁躺在病床上，哼的就是这首曲子。」// 
      CHAR-001[内心]：「那时候我以为，这辈子都不会有机会弹了。」

