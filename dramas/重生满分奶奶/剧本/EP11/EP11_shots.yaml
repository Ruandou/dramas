      林秀芝眼含泪光但微笑。身后红丝绒幕布轻晃。
    dialogue: >
      CHAR-001[长舒一口气]：「都准了。」// 
      CHAR-002[坚定·低声]：「别管谁干的。你弹得比他们好一万倍。」// 
      CHAR-002：「去上台。证明给他们看。」

  # ---- SEG03: 月光的第一声 ----
  - shot_id: EP11-S04
