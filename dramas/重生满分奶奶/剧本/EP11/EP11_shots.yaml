    prompt_en: >
      Under the backstage light. The official unfolds and extends a printed document 
      toward the young woman — a music academy brochure (white paper with vertical 
      columns and a red seal visible). Her hand slowly reaches out to take it, and the 
      moment her fingertips touch the paper, her hand begins to tremble. Camera slowly 
      pushes in on her face — expression shifting from shock to an indescribable 
      complexity: surprise, fear, disbelief. Dim yellow backstage light illuminates 
      her reddening eyes. The official turns and leaves. She stands alone, both hands 
      holding the brochure, head bowed — suddenly rapid footsteps echo from the 
      corridor. Her mother appears in the doorway, short curly hair slightly disheveled, 
      floral housecoat with one button misaligned. The mother's expression shifts from 
      the pride of listening to the music to raw fear, eyes locked on the paper in her 
