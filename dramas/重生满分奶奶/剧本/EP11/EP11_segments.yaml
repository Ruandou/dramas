# ============================================================
# Seedance 默认参数（从分集 .md YAML 头继承）
# ============================================================

seedance_defaults:
  model: doubao-seedance-2-0-fast
  ratio: "9:16"
  resolution: 720p
  duration_sec: "8-10"
  generate_audio: true
  prompt_suffix: "禁止画面中出现任何文字或字幕。年代质感写实风格，温暖金色色调，胶片颗粒感，情绪肖像摄影。"
  negative_prompt: "smartphones, laptops, LED screens, modern cars, plastic furniture, contemporary fashion, flat-screen TVs, digital cameras, modern signage with English text, anime style, cartoon, 3D render, unrealistic proportions, fantasy elements, sci-fi elements"

# ============================================================
# 声音卡片 (P0 voice_prompt，全文复制)
# ============================================================

voice_cards:
  CHAR-001: "「成年女性，20岁外表60岁灵魂，声线温柔但有超出年龄的沉稳感，语速适中偏慢，偶尔蹦出超前词汇时语气微妙变化，独处时喃喃自语像在跟看不见的人对话，感动时声音会发颤但努力保持平静」"
  CHAR-002: "「成年男性，22岁，声线温和清澈带有文艺气质，语速偏慢而清晰，喜欢用音乐术语形容事物，紧张时声音会轻一点，激动时反而沉默，表达爱意时从不直接说而是语气更柔和」"
  CHAR-003: "「成年男性，23岁，声线憨厚低沉，语速适中偏快，说话直来直去不绕弯子，紧张时会清嗓子，被拒绝时声音发紧但努力控制，后期成熟后语速变慢但每句更有分量」"
  CHAR-005: "「成年女性，50岁，声线粗犷有力带北方方言口音，语速快嗓门大，爱用祈使句，关心时用批评句式，感动时背过身去声音变小假装没哭，从不说我爱你但行动充满爱意」"
  CHAR-GRP-01: "「成年男性，50多岁，声线威严沉稳带官腔，语速慢但有压迫感，喜欢用反问和质问句，对下属说话居高临下但也有被林秀芝打动时语气软化的时刻」"
  CHAR-GRP-03: "「成年男性，50岁，声线温和官方，语速适中，说话得体有分寸，赏识人才时语气真诚热情」"

