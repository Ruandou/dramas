episode_id: EP55
episode_title: 时间加速
shots:
  - shot_id: EP55-S01
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "2014年黄昏的客厅。暮色从窗户透进来，为一切镀上一层橘金色的光。林秀芝（46岁）坐在客厅的旧立式钢琴前，穿着一件深米色针织开衫，头发用发夹松松地别在耳后。她正在弹一首舒缓的曲子——手在琴键上游走，琴声在房间里流淌。她的手指稳健而温暖，表情安详。窗台上的小花在暮色中投下细长的影子。"
    dialogue:
      - speaker: CHAR-001
        emotion: 平静
        delivery: 轻声哼唱
        text: 「……♪…」
    notes: "哼唱无台词，以音符标注"

  - shot_id: EP55-S02
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "特写——她的手。右手正在弹一个完整的音阶上行，突然——在弹到高音区的第三个音时，她的手指僵住了。她的手迅速从琴键上抽回，捂着左胸口。特写帧里能看到她指关节发白、眉头因突如其来的不适而拧紧。琴键上最后一个弹下的音在空气中颤抖、消失。室内归于寂静。"
    dialogue:
      - speaker: CHAR-001
        emotion: 痛苦·不安
        delivery: 低声·自语
        text: 「……嗯……」
      - speaker: CHAR-001
        emotion: 不安
        delivery: 低声·自语
        text: 「怎么……又来了。」

  - shot_id: EP55-S03
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "脚步声从厨房方向传来。陈望秋（49岁，穿浅灰色衬衫，袖子挽到手肘，戴着围裙）快步走进客厅，手上还带着洗菜时沾的水珠。他看到林秀芝捂胸口的姿势，脸色瞬间变了——担忧和警觉同时涌上。他在她面前蹲下，手搭在她膝盖上，目光紧紧看着她。暮色将两人的轮廓勾勒出柔和的边缘。"
    dialogue:
      - speaker: CHAR-002
        emotion: 紧张
        delivery: 快步走近·蹲下身
        text: 「秀芝？怎么了？」
      - speaker: CHAR-001
        emotion: 掩饰
        delivery: 勉强微笑
        text: 「没事。可能坐久了——」
      - speaker: CHAR-002
        emotion: 坚定
        delivery: 打断
        text: 「多久了？」

  - shot_id: EP55-S04
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝被他问得愣了一下，眼神闪烁——她本想糊弄过去，但看到他的表情，知道自己骗不了他。陈望秋的手还搭在她膝上，目光不转移。墙上钟的秒针发出清晰的滴答声。"
    dialogue:
      - speaker: CHAR-001
        emotion: 犹豫
        delivery: 低头
        text: 「……最近弹琴久了会有一点。休息一下就好了——」
      - speaker: CHAR-002
        emotion: 坚决
        delivery: 站起来·拿外套
        text: 「明天去医院。这次听我的。」
      - speaker: CHAR-001
        emotion: 想争辩
        delivery: 抬头
        text: 「望秋——」
      - speaker: CHAR-002
        emotion: 温和但不容商议
        delivery: 回头
        text: 「不去我不放心。」

  - shot_id: EP55-S05
    scene: SCENE-010
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "医院门诊走廊。白色的墙，淡蓝色踢脚线，日光灯照明散发着冷白的光。一排塑料候诊椅沿墙排列。林秀芝坐在椅子上，目光放空，手指在膝盖上无意识地轻轻敲动——她紧张时的习惯。陈望秋站在她旁边，一只手拿病历袋，另一只手搭在她肩上。走廊尽头偶尔有护士推着医疗器械经过。墙上的时钟显示上午十点。门上的科室牌写着心内科。"
    dialogue:
      - speaker: CHAR-001
        emotion: 隐约不安
        delivery: 内心
        text: 「心内科……前世的病。」
      - speaker: CHAR-001
        emotion: 压抑
        delivery: 内心
        text: 「二十年了……我以为我已经躲开了。」
      - speaker: CHAR-002
        emotion: 温柔
        delivery: 低头·轻声
        text: 「别紧张。可能就是累了。」
      - speaker: CHAR-001
        emotion: 勉强
        delivery: 抬头·微笑
        text: 「嗯。可能是。」
      - speaker: CHAR-001
        emotion: 沉重
        delivery: 内心
        text: 「但我知道不是——这个感觉，我太熟悉了。」

  - shot_id: EP55-S06
    scene: SCENE-010
    characters:
      - "[待补：中年男医生]"
      - CHAR-001
      - CHAR-002
    look_ids:
      - "[待补：中年男医生]"
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "诊室内。医生——约50岁中年男性，穿白大褂，胸前挂听诊器，头发有些花白——坐在办公桌后面，手里拿着心电图报告。他表情温和但专业，将报告放下，目光从纸面移向林秀芝。林秀芝和陈望秋并排坐在就诊椅上。窗外是医院院区，有几棵法国梧桐，叶子在阳光下泛着金色。"
    dialogue:
      - speaker: CHAR-001
        emotion: 隐约紧张
        delivery: 微微前倾
        text: 「医生，怎么样？」
      - speaker: "[待补：中年男医生]"
        emotion: 温和平稳
        delivery: 看报告
        text: 「林老师，心电图显示——您的心脏有些早搏。」
      - speaker: CHAR-002
        emotion: 急切
        delivery: 向前倾
        text: 「早搏？严重吗？」
    notes: "⚠️ 医生手持报告，建议保持中景机位，不需辨认报告文字"

  - shot_id: EP55-S07
    scene: SCENE-010
    characters:
      - "[待补：中年男医生]"
      - CHAR-001
    look_ids:
      - "[待补：中年男医生]"
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: slow_push
    visual_description: "特写——医生的脸和报告。他翻了一页，指着一处波形解释。镜头缓推到林秀芝的脸——她在听，表情从普通的关切变成一种难以名状的复杂——像是听到了一个她早就知道、但一直不愿面对的消息。她放在膝盖上的手微微握紧。"
    dialogue:
      - speaker: "[待补：中年男医生]"
        emotion: 专业但温和
        delivery: 指着报告
        text: 「目前不算严重。但需要多注意休息，不能太劳累——尤其是精神压力。」
      - speaker: "[待补：中年男医生]"
        emotion: 温和
        delivery: 直接对林秀芝
        text: 「建议定期复查。避免剧烈情绪波动，心脏负荷会加重。」
      - speaker: CHAR-001
        emotion: 发紧
        delivery: 点头
        text: 「好……我记住了。」
      - speaker: CHAR-001
        emotion: 沉重
        delivery: 内心
        text: 「和前世的诊断……一模一样。」

  - shot_id: EP55-S08
    scene: SCENE-010
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "走廊的长椅上，两人并肩坐着。陈望秋握着她的手，像是在给她温度。林秀芝的目光落在地面的瓷砖缝隙上——失焦的、望向远方的眼神。光从走廊尽头的窗户照进来，在地板投出整齐的光块。远处有模糊的医院广播声。陈望秋没有说话，只是把她的手握得更紧了一些。她缓缓转过头看向窗外。"
    dialogue:
      - speaker: CHAR-001
        emotion: 沉重
        delivery: 内心
        text: 「二十年了。我选了不一样的路——不一样的丈夫、不一样的事业、不一样的人生。」
      - speaker: CHAR-001
        emotion: 恐惧中带着清醒
        delivery: 内心
        text: 「但身体的宿命……是一样的。」
      - speaker: CHAR-001
        emotion: 平静中带着不可动摇
        delivery: 内心
        text: 「命运在告诉我——有些东西，改变不了。」
      - speaker: CHAR-001
        emotion: 释然交织勇气
        delivery: 轻声·对陈望秋·微笑
        text: 「我没事。真的。」
      - speaker: CHAR-001
        emotion: 坚定
        delivery: 内心·金句
        text: 「如果这就是命运想把我拉回去的绳子……我得让它看看——这二十年的每一天，我都不是白活的。」

  - shot_id: EP55-S09
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "傍晚，两人回到家。陈望秋把钥匙放在玄关的小桌上，转身看着林秀芝——眼神里有一种小心翼翼的探究。他在观察她是否真的没事。客厅没有开灯，暮色从窗户渗进来，将一切都染成温暖的暗金色调。林秀芝脱掉外套挂在门边，动作缓慢但平稳。"
    dialogue:
      - speaker: CHAR-002
        emotion: 温和但认真
        delivery: 看着她
        text: 「秀芝，你最近是不是有什么事没跟我说？」
      - speaker: CHAR-001
        emotion: 故作轻松
        delivery: 背对着他·挂外套
        text: 「没事。就是累了。」
      - speaker: CHAR-002
        emotion: 温柔但探究
        delivery: 走到她身边
        text: 「你骗不了我。二十多年了。」

  - shot_id: EP55-S10
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-002-L02
    shot_size: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝转过身，和他面对面。暮色中两人的脸只看得清轮廓。她看着他眼里真实的担忧，心里一软——但她不能告诉他真相。她只是伸手，轻轻拍了拍他的手臂。"
    dialogue:
      - speaker: CHAR-001
        emotion: 微笑·温柔但坚定
        delivery: 对上他的目光
        text: 「真的没事。就是——年纪到了。」
      - speaker: CHAR-001
        emotion: 柔软
        delivery: 轻拍他手臂
        text: 「我会注意的。我答应你。」
      - speaker: CHAR-002
        emotion: 叹气
        delivery: 手揽住她肩·低声
        text: 「好。但下次不舒服——必须第一时间告诉我。」
      - speaker: CHAR-001
        emotion: 安心
        delivery: 靠在他肩上·轻声
        text: 「嗯。一定。」
      - speaker: CHAR-001
        emotion: 复杂
        delivery: 内心
        text: 「我不能告诉你——你越担心，我越怕——因为我正在重复我前世走过的路。」

  - shot_id: EP55-S11
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: MCU
    duration_sec: 12
    mode: i2v_ref
    camera_movement: slow_push
    visual_description: "深夜。林秀芝一个人站在卧室的穿衣镜前。房间只开了一盏台灯，从侧后方投来暖黄色的光，照亮她半边脸。她穿着一件素色的睡袍，头发散落下来，已经长出几缕银丝。47岁了——眼角有细纹，法令纹加深，但嘴角的微笑依然温暖。她看着镜子里的自己，目光从审视慢慢变成一种复杂的接受。台灯的灯光在镜面上投下柔和的反射。"
    dialogue:
      - speaker: CHAR-001
        emotion: 审视
        delivery: 内心
        text: 「四十七了。头发有了白的，眼角有了纹——但笑容还是热的。」
      - speaker: CHAR-001
        emotion: 自问
        delivery: 内心
        text: 「我活成了我想要的样子吗？」
      - speaker: CHAR-001
        emotion: 微笑·释然
        delivery: 内心
        text: 「我活成了我想要的样子——一个真实的人，不是完美的，但真实的。」
      - speaker: CHAR-001
        emotion: 轻声·释然
        delivery: 内心
        text: 「如果命运一定要把我拉回去……至少这二十七年，我是真正活过的。」

  - shot_id: EP55-S12
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 12
    mode: i2v_ref
    camera_movement: slow_push
    visual_description: "特写——林秀芝坐在书桌前。台灯下，她从一个抽屉里拿出那封泛黄的信（PROP-010）。信纸在灯光下微微透光，边缘已经磨损。她不是要读——而是看着信纸的最后一页。镜头缓缓推到信纸上最后一行的位置。她的手停在纸面上，指尖轻轻抚过那行字。然后她把信折好——放回她心口的内衣口袋。然后她抬起头，目光望向窗外的夜空。月光从窗帘缝隙漏进来，在地板上画出一道银白色的线条。"
    dialogue:
      - speaker: CHAR-001
        emotion: 平静但沉重
        delivery: 内心·打开信
        text: 「2016年的春天……307病房。」
      - speaker: CHAR-001
        emotion: 停顿
        delivery: 内心·抚过字迹
        text: 「现在——是2014年。」
      - speaker: CHAR-001
        emotion: 轻声
        delivery: 内心·望向窗外
        text: 「还有两年。」
      - speaker: CHAR-001
        emotion: 复杂——恐惧与平静交织
        delivery: 内心·金句
        text: 「命运在等我……但这一次，我不是去赴一场灾难——」
      - speaker: CHAR-001
        emotion: 渐定
        delivery: 轻轻合上信
        text: 「我是去见一个答案。」
