episode_id: EP49
episode_title: 小满的钢琴
shots:
  - shot_id: EP49-S01
    scene: SCENE-009
    characters: [CHAR-001, CHAR-007]
    looks: [CHAR-001-L02, CHAR-007-L01]
    shot_type: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 午后阳光透过白色窗帘洒进音乐教室。林秀芝坐在小满身旁的矮凳上，两人面前是一架小立式钢琴。小满的两条小辫子在阳光下微微晃动，她瘦小的手指在琴键上小心翼翼地按着。谱架上摊开放着《月光奏鸣曲》乐谱，纸张泛黄。墙上"音乐不是天才的专利"标语隐约可见。林秀芝的手轻轻搭在小满的肩上，指尖微微用力——是在帮她数拍子。
    dialogue:
      - speaker: CHAR-007
        emotion: 紧张
        text: 林老师……我又卡住了。
      - speaker: CHAR-001
        emotion: 温柔·轻声
        text: 别着急。小满，先把右手放下来。
      - speaker: CHAR-007
        emotion: 低头·怯生生
        text: 我怕弹错……
    notes: null
  - shot_id: EP49-S02
    scene: SCENE-009
    characters: [CHAR-007, CHAR-001]
    looks: [CHAR-007-L01, CHAR-001-L02]
    shot_type: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 特写两人的手——林秀芝温暖的手握住小满瘦小的手，轻轻放在琴键上。阳光在她们的手指上跳跃，灰尘在光柱中浮动。琴键泛着旧象牙色的温润光泽。小满的手指微微发抖，但在林秀芝的引导下逐渐安定下来。
    dialogue:
      - speaker: CHAR-001
        emotion: 微笑
        text: 你看，你的手比上周稳多了。
      - speaker: CHAR-001
        emotion: 内心
        text: 教她弹琴的时候……就像在教前世的自己。
      - speaker: CHAR-007
        emotion: 小声·眼睛亮了一下
        text: 真的吗？
    notes: null
  - shot_id: EP49-S03
    scene: SCENE-009
    characters: [CHAR-007]
    looks: [CHAR-007-L01]
    shot_type: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: push_in
    visual_description: 小满深吸一口气，重新开始弹奏。这次她的手指在琴键上流畅了许多——虽然仍有几个音弹得不太准，但整段旋律已经成型了，是《月光奏鸣曲》第一乐章的简化版。她的小辫子在弹奏时轻轻晃动，瘦小的背脊努力挺直。阳光在她认真的侧脸上勾勒出金色的轮廓。
    dialogue:
      - speaker: CHAR-007
        emotion: 一边弹·声音带着笑意
        text: 我这次……应该不会错了。
    notes: null
  - shot_id: EP49-S04
    scene: SCENE-009
    characters: [CHAR-001, CHAR-007]
    looks: [CHAR-001-L02, CHAR-007-L01]
    shot_type: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 小满弹完最后一个音，手停在琴键上，转头看林秀芝，眼神里满是期待。林秀芝看着她，眼眶微红——不是因为曲子有多好，而是因为小满脸上那种满足的笑容。林秀芝轻轻鼓掌，下巴微微抬起——那是忍住眼泪的姿势。
    dialogue:
      - speaker: CHAR-001
        emotion: 点头·声音微哑
        text: 小满，你弹完了。
      - speaker: CHAR-007
        emotion: 笑·眼睛亮晶晶
        text: 我弹完了！
      - speaker: CHAR-007
        emotion: 低头看琴键·轻声
        text: 这是我第一次……完整地把一整首弹下来。
      - speaker: CHAR-001
        emotion: 摸了摸她的头
        text: 以后会越来越多的。
    notes: null
  - shot_id: EP49-S05
    scene: SCENE-009
    characters: [CHAR-007, CHAR-001]
    looks: [CHAR-007-L01, CHAR-001-L02]
    shot_type: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 小满坐在琴凳上，低头摆弄自己的手指。林秀芝侧坐着，温柔地看着她。窗外的光线渐渐从金黄变暖，下午的时光安静地流淌。小满沉默了半晌，然后抬起头，认真地看着林秀芝——那种眼神不是一个8岁孩子该有的沉静。
    dialogue:
      - speaker: CHAR-007
        emotion: 沉默了一会儿·声音很小
        text: 林老师……
      - speaker: CHAR-001
        emotion: 轻声
        text: 嗯？
      - speaker: CHAR-007
        emotion: 抬起头·认真
        text: 我妈从来不会像你这样教我。
      - speaker: CHAR-007
        emotion: 认真
        text: 你比我妈还了解我。
    notes: golden_line: 你比我妈还了解我 (5/5 criteria)
  - shot_id: EP49-S06
    scene: SCENE-009
    characters: [CHAR-001]
    looks: [CHAR-001-L02]
    shot_type: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: slow_push
    visual_description: 林秀芝的特写。她的笑容僵在脸上——不是难过，而是这句话像一把钥匙，突然打开了前世的某扇门。她的瞳孔微微放大，嘴唇张开又合上。阳光在她脸上切割出明暗交界线。她的手无意识地按在胸口——心脏的位置。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·金句·酸楚
        text: 前世的小满……也说过一模一样的话。
      - speaker: CHAR-001
        emotion: 内心·声音发颤
        text: 但那次她是哭着说的——是抱怨。
      - speaker: CHAR-001
        emotion: 内心·泪涌
        text: 可这一次……是信任。
    notes: null
  - shot_id: EP49-S07
    scene: SCENE-009
    characters: [CHAR-001, CHAR-007]
    looks: [CHAR-001-L02, CHAR-007-L01]
    shot_type: MS
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 林秀芝回过神来，用力眨了眨眼睛把泪水逼回去。她低头看着小满，伸出手轻轻拨了拨小满额前的碎发。然后露出一个真正的、毫无阴霾的笑容。小满被她看得有点不好意思，低下头，但嘴角在上扬。阳光把两人的影子拉得很长，在木地板上交叠在一起。
    dialogue:
      - speaker: CHAR-001
        emotion: 收拾情绪·温暖
        text: 老师知道。
      - speaker: CHAR-001
        emotion: 轻轻握住小满的手
        text: 以后你想说、想弹，都来找老师。
      - speaker: CHAR-001
        emotion: 内心·慢慢说·释然
        text: 前世我没能好好陪她。
      - speaker: CHAR-001
        emotion: 内心·坚定
        text: 但这一次……这个小满，我会一直陪着。
    notes: null
  - shot_id: EP49-S08
    scene: SCENE-008
    characters: [CHAR-004]
    looks: [CHAR-004-L02]
    shot_type: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 傍晚的客厅，桌上摆着饭菜还没动。门口，5岁的林满站在那里，手里抱着一个布娃娃。她没有进门，而是透过虚掩的门缝，偷偷看客厅里的情景——妈妈正牵着赵小满的手走进来，妈妈脸上的笑容那么温柔。林满的大眼睛眨了眨，嘴巴瘪了一下。
    dialogue:
      - speaker: CHAR-004
        emotion: 内心·委屈
        text: 妈妈又带小满姐姐回来了。
      - speaker: CHAR-004
        emotion: 低头·揪着布娃娃的耳朵
        text: 她笑得好开心……
    notes: null
  - shot_id: EP49-S09
    scene: SCENE-008
    characters: [CHAR-001, CHAR-007]
    looks: [CHAR-001-L02, CHAR-007-L01]
    shot_type: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 从林满的视角看过去——林秀芝正在帮小满把书包放好，低头对小满说了句什么，小满仰头笑了。林秀芝摸了摸小满的头。这个画面温馨自然，但对于门缝里偷看的林满来说，像是针扎。林秀芝完全没注意到门口的女儿。
    dialogue:
      - speaker: CHAR-001
        emotion: 笑着·对小满说
        text: 先洗手，然后吃饭。饿了吧？
      - speaker: CHAR-007
        emotion: 笑
        text: 嗯！谢谢林老师。
    notes: null
  - shot_id: EP49-S10
    scene: SCENE-008
    characters: [CHAR-004, CHAR-001]
    looks: [CHAR-004-L02, CHAR-001-L02]
    shot_type: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 林满终于从门后走出来，站在客厅中间，小脸绷得紧紧的。林秀芝看到女儿，脸上的笑容没来得及收，但林满的表情让她愣住了。小满也转过头，有些不知所措。林秀芝蹲下身子，朝林满伸出手——但林满没有过去。她站在三步远的地方，眼眶红红的，像是忍了很久。
    dialogue:
      - speaker: CHAR-004
        emotion: 声音发颤·克制
        text: 妈妈。
      - speaker: CHAR-001
        emotion: 站起来·觉察到不对
        text: 满满？怎么了？
      - speaker: CHAR-004
        emotion: 终于憋不住
        text: 妈妈，你为什么对她比对我还好？
      - speaker: CHAR-007
        emotion: 低头·小声
        text: 林老师……
      - speaker: CHAR-001
        emotion: 愣住
        text: 满满，妈妈没有——
    notes: golden_line: 妈妈，你为什么对她比对我还好？ (5/5 criteria)
  - shot_id: EP49-S11
    scene: SCENE-008
    characters: [CHAR-001, CHAR-004]
    looks: [CHAR-001-L02, CHAR-004-L02]
    shot_type: CU
    duration_sec: 11
    mode: i2v_ref
    camera_movement: fixed
    visual_description: 林秀芝走到林满面前蹲下，双手扶着女儿瘦小的肩膀。她没有急于解释，而是先看了林满的眼睛——那双和自己一模一样的杏眼里全是委屈和不解。林秀芝轻轻把林满拉进怀里，抱得很紧。林满起初僵着，然后慢慢把脸埋进妈妈的肩窝里。布娃娃从她手里滑落，掉在地上。
    dialogue:
      - speaker: CHAR-001
        emotion: 抱着她·声音温柔而坚定
        text: 满满，妈妈爱你。
      - speaker: CHAR-001
        emotion: 轻声
        text: 妈妈不想再犯同样的错。
      - speaker: CHAR-004
        emotion: 闷在她肩窝里·不懂但委屈还在
        text: 什么错……
      - speaker: CHAR-001
        emotion: 没有回答·只是抱得更紧
        text: 等你长大了，就会明白。
    notes: golden_line: 妈妈不想再犯同样的错 (5/5 criteria)
  - shot_id: EP49-S12
    scene: SCENE-008
    characters: [CHAR-001]
    looks: [CHAR-001-L02]
    shot_type: CU
    duration_sec: 11
    mode: i2v_ref
    camera_movement: slow_push
    visual_description: 林秀芝抱着林满，脸贴着女儿柔软的头发。她的眼睛看着前方——不是看小满，也不是看任何实物，而是望向很远的地方。月光透过窗纱照进来，在她脸上投下淡淡的银色。她的嘴唇动了动，没有出声。但观众能感受到她的内心正在和自己对话。小满安静地站在一旁，默默地看着这一幕。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·坚定
        text: 这辈子，我不会再让我的女儿觉得——妈妈不够爱她。
      - speaker: CHAR-001
        emotion: 内心·看着怀里的林满·温柔
        text: 满满，你现在不懂。但妈妈会用一辈子让你懂——你是最重要的。
    notes: null
