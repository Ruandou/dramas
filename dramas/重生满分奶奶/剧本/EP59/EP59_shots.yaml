episode_id: EP59
episode_title: 醒来
shots:
  - shot_id: EP59-S01
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-002]
    look_ids: [CHAR-001-L03, CHAR-002-L03]
    framing: ECU_to_MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: push_in_to_fixed
    visual_prompt: >-
      Complete darkness for the first 1.5 seconds, then extremely slow light bleeding into frame from the right edge as morning sunlight enters. ECU on a single human eye — eyelashes trembling slightly, pupil slowly contracting as consciousness returns, eyeball rotating as if surfacing from deep water. The focus is completely blurry at first, then very slowly pulls to sharpness. As focus clears, the camera subtly pulls back from ECU to reveal a 50-year-old Chinese man's face leaning close — he has dark circles under his eyes from a sleepless night, a slightly wrinkled dark sweater, and salt-and-pepper hair catching the morning light. He is holding her hand in both of his, his thumb gently stroking her skin. Behind him: white hospital walls, a blue accent stripe, and the green waveform of a cardiac monitor. Soft warm golden morning light from a window on the right. Emotional intimacy, photorealistic, 2016 Chinese hospital recovery room aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-002
        emotion: 温柔·轻声·压抑一夜的紧张
        text: 秀芝？你听得到吗？
      - speaker: CHAR-002
        emotion: 见她的睫毛动了动·声音微颤
        text: 睁开眼睛——看看我——
      - speaker: CHAR-001
        emotion: 虚弱但确认地轻声
        text: 望……秋……
      - speaker: CHAR-001
        emotion: 内心·巨大的释然
        text: 不是梦……他真的在。
      - speaker: CHAR-002
        emotion: 紧握住她的手·声音发哽
        text: 我在。一直在。

  - shot_id: EP59-S02
    scene_id: SCENE-010
    character_ids: [CHAR-004, CHAR-001, CHAR-002]
    look_ids: [CHAR-004-L05, CHAR-001-L03, CHAR-002-L03]
    framing: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Hospital room door opens gently from the left side of frame. A 23-year-old Chinese woman in a white doctor's coat rushes in, her low ponytail slightly loose, her face showing exhaustion from a sleepless night. When she sees her mother's eyes open — she freezes mid-step as if struck by lightning, then rushes to the bedside, crouches down, and takes her mother's other hand. Tears spill from her eyes onto the white hospital sheet. Her name badge is visible on her white coat (住院医师). Chen Wangqiu is on the other side of the bed, looking up at his daughter with red-rimmed eyes. Morning sunlight streaming through the window creates a warm golden pool on the bed. Emotional hospital reunion, photorealistic, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-004
        emotion: 俯身·声音带着哭腔
        text: 妈——
      - speaker: CHAR-004
        emotion: 眼泪掉在白色床单上
        text: 你终于醒了……吓死我了……
      - speaker: CHAR-004
        emotion: 哽咽·像回到了小时候
        text: 你知道我等了多久吗——

  - shot_id: EP59-S03
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-004, CHAR-002]
    look_ids: [CHAR-001-L03, CHAR-004-L05, CHAR-002-L03]
    framing: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Three-person frame — Lin Xiuzhi lying in the hospital bed, her left hand held by Chen Wangqiu (50-year-old man in dark sweater, visible only from the shoulder), her right hand held by Lin Man (23-year-old doctor in white coat, crouching beside the bed). Lin Xiuzhi looks at her daughter, then turns to look at Chen Wangqiu, and a slow, warm smile spreads across her weak face. Her lips move — "I'm back." Morning light from the window bathes all three figures in a warm golden glow. The composition emphasizes the family triangle, the three of them connected through touch, forming an intimate tableau. Photorealistic, profound emotional warmth, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 虚弱但坚定地微笑·金句
        text: 我回来了。
      - speaker: CHAR-001
        emotion: 内心·巨大的温暖涌上心头
        text: 前世……醒来时，床边谁都没有。
      - speaker: CHAR-001
        emotion: 内心·眼角滑落一滴泪·释然
        text: 这次……他们都在。

  - shot_id: EP59-S04
    scene_id: SCENE-010
    character_ids: [CHAR-002, CHAR-001]
    look_ids: [CHAR-002-L03, CHAR-001-L03]
    framing: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Chen Wangqiu turns slightly, using his free hand to wipe the corner of his eye. Then he looks back at Lin Xiuzhi, trying to steady his voice but the emotion still leaks through. The tension that had been in his face before surgery is gone now — replaced by a quiet, exhausted relief. Morning light traces the soft contours of his face, the fine lines at the corners of his eyes telling decades of stories. Behind him: white wall, cardiac monitor with green waveform. Emotional release, photorealistic, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-002
        emotion: 擦眼角·声音努力平稳但微微发颤
        text: 手术很成功。医生说——没事了。
      - speaker: CHAR-002
        emotion: 深深看她一眼
        text: 你没事了，秀芝。
      - speaker: CHAR-001
        emotion: 轻声·看着他
        text: 我知道。
      - speaker: CHAR-001
        emotion: 嘴角浮起微笑
        text: 睁开眼睛看到你的脸——我就知道了。

  - shot_id: EP59-S05
    scene_id: SCENE-010
    character_ids: [CHAR-004]
    look_ids: [CHAR-004-L05]
    framing: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Close-up of a 23-year-old Chinese female doctor standing beside the hospital bed. She briefly checks the cardiac monitor, the green waveform reflecting in her eyes, then writes a note on the clipboard — a gesture she has repeated thousands of times, but today her fingers are trembling slightly. She closes the chart and looks back at her mother, eyes still red but voice now carrying the professional warmth of a doctor. Morning light catches the name badge on her white coat. Her face shows a mix of professional composure and daughterly love. Photorealistic, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-004
        emotion: 声音努力恢复专业但尾音仍带哽咽
        text: 恢复得很快。妈——你真棒。
      - speaker: CHAR-001
        emotion: 看着女儿·温柔地
        text: 穿着白大褂站在我面前，说"恢复得很快"——比我棒多了。
      - speaker: CHAR-001
        emotion: 内心·骄傲
        text: 女儿成了医生……前世我都没等到。

  - shot_id: EP59-S06
    scene_id: SCENE-010
    character_ids: [CHAR-004, CHAR-001]
    look_ids: [CHAR-004-L05, CHAR-001-L03]
    framing: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Lin Man tucks the clipboard under her arm and sits back down beside the bed. She looks at her mother, a smile breaking through her tear-streaked face. She gently arranges the corner of the blanket — a doctor's practiced gesture, but the pause of her fingertips holds a tenderness only a daughter possesses. The white curtain by the window rustles softly in the morning breeze. Lin Xiuzhi half-reclines on the pillow, watching her daughter, her gaze slowly moving between Chen Wangqiu and Lin Man — as if taking in every detail of this quiet painting. Morning light fills the room with a warm golden hue. Photorealistic, mother-daughter warmth, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-004
        emotion: 平复情绪·微笑
        text: 等你出院——我给你弹一首曲子。
      - speaker: CHAR-001
        emotion: 惊讶
        text: 你什么时候学的？
      - speaker: CHAR-004
        emotion: 调皮地
        text: 从小在音乐教室偷学的。
      - speaker: CHAR-001
        emotion: 感动地·轻声
        text: 好。妈等着。
      - speaker: CHAR-001
        emotion: 内心·温暖中带着释然
        text: 前世……离开手术室时，谁都不在走廊尽头。
      - speaker: CHAR-001
        emotion: 内心·轻轻闭上眼睛·微笑
        text: 这一生——够了。

  - shot_id: EP59-S07
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: MS
    duration_sec: 9
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Warm afternoon sunlight floods a spacious hospital room. Lin Xiuzhi (48 years old, now wearing a soft light-blue cotton shirt instead of a hospital gown) is half-reclining on the elevated hospital bed, her gaze directed toward the window. Outside the window: an afternoon city view — distant apartment buildings against a pale blue sky, a few birds flying past. On the windowsill, a glass vase with white lilies starting to bloom. Her expression is calm — not lonely, but the peaceful stillness of someone who has lived two lifetimes and can finally take a quiet breath. Her hand rests lightly over her chest, feeling her heartbeat — steady, strong. Soft ambient afternoon light fills the room. Photorealistic, peaceful contemplation, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·平静中带着淡淡的回顾
        text: 前世……也是手术醒来后，病房里只有监护仪的滴滴声。
      - speaker: CHAR-001
        emotion: 内心·微微笑了
        text: 那天下午——我想了很久。如果再来一次……
      - speaker: CHAR-001
        emotion: 内心·目光落在手上的婚戒·温暖
        text: 然后我真的来了。
      - speaker: CHAR-001
        emotion: 内心·声音轻柔而满足
        text: 这扇窗户看到的——是同一个城市。但已经不是同一个我了。

  - shot_id: EP59-S08
    scene_id: SCENE-010
    character_ids: [待补：护士, CHAR-001]
    look_ids: [待补：护士, CHAR-001-L03]
    framing: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      A gentle knock on the hospital room door. A young nurse (approximately 25 years old, white nurse uniform, neat short hair, warm smile) peers in, holding a brown kraft paper package — rectangular, the size of a book or photo album. Seeing Lin Xiuzhi awake, she smiles and enters, placing the package on the bedside table. The package has simple address information on the front. Afternoon sunlight filters through the window, creating a warm atmosphere. Photorealistic, modern Chinese hospital room, 2016 aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 听到敲门·转头
        text: 请进。
      - speaker: 待补：护士
        emotion: 微笑·将包裹放在床头
        text: 林老师，有您的包裹。上午刚到的。
      - speaker: 待补：护士
        emotion: 补充·带着笑意
        text: 寄件人——写的是"赵小满"。
      - speaker: CHAR-001
        emotion: 微微一怔
        text: 小满……

  - shot_id: EP59-S09
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Close-up of Lin Xiuzhi's face. Her gaze rests on the package on the bedside table. Her fingers gently touch the brown wrapping paper. Her expression shifts from surprise to growing anticipation and a subtle sense of recognition. She slowly sits up a little straighter, reaches for the package — it's light, and whatever is inside makes a soft clinking sound when she shifts it. The handwriting on the wrapping paper is neat and elegant — she recognizes it as Zhao Xiaoman's handwriting. Afternoon sunlight catches the side of her face. Photorealistic, subtle suspense, 2016 Chinese hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 手指轻轻抚摸包裹表面的字迹·轻声·带着温暖的笑意
        text: 小满的字……比她爸写得好多了。
      - speaker: CHAR-001
        emotion: 内心·渐渐有了预感
        text: 上次见她……她说要给我一个惊喜。

  - shot_id: EP59-S10
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: ECU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: slow_push_in
    visual_prompt: >-
      Extreme close-up of hands carefully tearing open the sealed package. Brown kraft paper peels back to reveal a transparent CD jewel case inside. Afternoon sunlight catches the clear plastic, refracting rainbow highlights onto the fingers. The inner sleeve text is visible but deliberately off-focus — the viewer cannot read what it says. The fingers gently press against the CD case surface. Warm afternoon light, gentle reflections on the plastic surface. Photorealistic, moment of discovery, 2016 hospital room aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 拆开包裹·低头看去·喃喃
        text: 这是……
      - speaker: CHAR-001
        emotion: 看到CD封面·声音里带着不确定的期待
        text: 赵小满——钢琴独奏专辑？

  - shot_id: EP59-S11
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      Close-up of Lin Xiuzhi's face as she looks down at the CD in her hands. Afternoon sunlight illuminates her face, and her expression transforms from confusion to profound emotional impact — as if something in her heart has been unlocked. Her lips part slightly. Her fingers gently trace across the cover — not to check it, but as if touching something sacred. Then she reads aloud, her voice growing softer until barely audible — "To my teacher — Lin Xiuzhi." Tears well in her eyes, spilling over. Sunlight catches the tears on her cheeks, making them glisten. She smiles through the tears — a smile of overwhelming recognition and love. Photorealistic, profound emotional realization, 2016 hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 声音轻颤·读着CD上的题字
        text: 献给我的老师——
      - speaker: CHAR-001
        emotion: 声音哽咽·含着泪微笑
        text: ——林秀芝。
      - speaker: CHAR-001
        emotion: 内心·巨大的感动涌上心头
        text: 小满……你做到了。
      - speaker: CHAR-001
        emotion: 内心·眼眶红了
        text: 我教的第一批学生……第一个出了专辑的钢琴手。

  - shot_id: EP59-S12
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: MCU
    duration_sec: 10
    mode: i2v_ref
    camera_movement: slow_push_in
    visual_prompt: >-
      Lin Xiuzhi leans back against the pillow, holding the CD case against her chest with both hands. Afternoon golden sunlight floods the entire room, illuminating her face with bright, warm radiance. Tears stream silently down her cheeks, falling onto the transparent CD case where they catch the light like tiny gems. But she is not crying — she is smiling. A warm, released smile, as if the answer to a lifetime has been written on this small disc. She closes her eyes briefly, pressing the CD to her heart, then opens them again, looking toward the window. The sky outside is clear blue, the sunlight perfect. Somewhere off-screen, piano music begins to play — the opening notes of Moonlight Sonata, but a younger, braver interpretation. Photorealistic, emotional fulfillment, 2016 hospital aesthetic, 9:16 vertical composition.
    dialogue:
      - speaker: CHAR-001
        emotion: 把CD贴在胸前·眼眶含泪但笑容灿烂
        text: 小满……你做到了。
      - speaker: CHAR-001
        emotion: 内心·低着头看CD·声音颤抖但坚定
        text: 我这一辈子——没有白过。
      - speaker: CHAR-001
        emotion: 内心·抬头看向窗外阳光·释然而圆满
        text: 这就是答案。
