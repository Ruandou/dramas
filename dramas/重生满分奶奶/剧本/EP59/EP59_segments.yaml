episode_id: EP59
episode_title: 醒来
segments:
  - segment_id: SEG01
    title: 苏醒（碎片式·黑暗→模糊→看清）
    narrative_function: "Hook Zone — 从EP58的心跳声桥接。黑暗到光的苏醒过程。建立'手术成功了'的确认。林秀芝从麻醉中醒来，第一个看到的是陈望秋的脸——不再是前世那个陌生的护士。内核情绪：'这次有人等我。'"
    scene: SCENE-010
    time_of_day: 清晨
    interior_exterior: 内景
    shot_ids:
      - EP59-S01
    total_duration_sec: 10
    transition_from_previous: audio_bridge（心跳声延续自EP58末尾——SEG08黑暗中的心电监护仪哔声慢慢加速、变得规律，然后淡出为恢复室环境音。画面从全黑慢慢亮起——林秀芝的睫毛在晨光中颤动）
    dominance_rhythm: 碎片式
    notes: "SEG01为全段单镜10s——从ECU大特写眼睛到MCU陈望秋。ECU大特写眼睛无需唇形同步，Seedance可拍。audio bridge确保与EP58的视觉连续性。'我在。一直在。'呼应EP58陈望秋的'别怕。我在。'——跨集情感回收。CHAR-002-L03（50岁·深色毛衣·花白鬓角）首次在EP59出现——延续EP58造型。⚠️ 从模糊到清晰的视觉过渡需在Prompt中描述为'blur to sharp, gradually focusing vision'。"

  - segment_id: SEG02
    title: 妈妈醒了（碎片式·焦灼→如释重负→温馨）
    narrative_function: "Hook Zone（续）— 林满冲进病房，母女情感爆发。林秀芝说出'我回来了'——全剧重生主题的终极确认。前世vs今生的对比通过内心独白揭示。'我回来了'既是手术苏醒，也是灵魂从'前世'回到'今生'的宣言。"
    scene: SCENE-010
    time_of_day: 清晨
    interior_exterior: 内景
    shot_ids:
      - EP59-S02
      - EP59-S03
    total_duration_sec: 11
    transition_from_previous: hard_cut
    dominance_rhythm: 碎片式
    notes: "⚠️ EP59-S02三人同框短暂出现（CHAR-001+CHAR-002+CHAR-004）——Seedance渲染多人同框有不稳定性，建议用中近景构图确保面部清晰。金句'我回来了'（4字）通过Rule 34：a可截图✅、c情绪共振✅、d角色指纹✅——只有经历过两辈子的她能说出。本段是前3SEG的金句位置✅。"

  - segment_id: SEG03
    title: 家人的声音（蓄力式·紧张释放→温暖→骄傲）
    narrative_function: "Substance Zone — 术后信息的确认（'手术很成功'）和角色关系的细化。陈望秋的情感释放——压抑了一夜终于说'没事了'。林满作为医生的专业形象与女儿身份的切换。前世对比信息通过内心独白揭示（'女儿成了医生……前世我都没等到'）。"
    scene: SCENE-010
    time_of_day: 清晨
    interior_exterior: 内景
    shot_ids:
      - EP59-S04
      - EP59-S05
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 蓄力式
    notes: "本段2轮对话（陈望秋说→林秀芝回应 / 林满说→林秀芝回应），控制在2轮内✅。CHAR-005是林满（CHAR-004）的单人近景——展现专业医生的自信与女儿柔情。CHAR-004-L05（23岁·住院医师·白大褂）适用EP58-EP72 ✅。"

  - segment_id: SEG04
    title: 医生的女儿（情感钩·调侃→温暖→未来）
    narrative_function: "Substance Zone — 母女关系的进一步深化。林满说'等你出院我给你弹一首曲子'——这是她从未做过的事（前世母女关系疏离）。林秀芝的内心独白'这一生——够了'是对全剧重生主题的个人确认。"
    scene: SCENE-010
    time_of_day: 清晨
    interior_exterior: 内景
    shot_ids:
      - EP59-S06
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 情感钩
    notes: "本段为单镜10s——中近景对话+内心独白的混合呈现。Seedance单段长度10s在推荐范围内（8-10s）。内心独白'前世离开手术室时谁都不在走廊尽头'是第三段前世对比——与本集SEG02、SEG05形成递进式三段结构。本段结束恢复室清晨戏份——为SEG05午后病房时间跳跃做过渡准备。"

  - segment_id: SEG05
    title: 窗边（独白递进·平静→对比→满足）
    narrative_function: "Transition — 时间跳跃（从清晨到午后），从恢复室转到普通病房。林秀芝独自一人——但不再是前世的独自一人。独白中第三次出现前世对比（'同样的城市，不同的我'），形成三段式递进（SEG02第一次→SEG04第二次→SEG05第三次）。"
    scene: SCENE-010
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP59-S07
    total_duration_sec: 9
    transition_from_previous: dissolve（恢复室晨光融化为午后阳光——窗帘在风中飘动的节奏变得更慢、更安静。时间跳跃：清晨→午后）
    dominance_rhythm: 独白递进
    notes: "本段为全集唯一单人独白段（仅CHAR-001独自在场，全部为内心独白），符合Rule 38（≤2段单人独白段✅）。9s单镜——需确保画面有足够细节维持注意力（窗景、阳光、花束、手部动作）。CHAR-001服装从蓝白条纹病号服（SEG01-04）变为淡蓝色棉质衬衫（SEG05-08）——时间跳跃的视觉信号。前世/今生对比第三次出现，形成三段递进式回收。"

  - segment_id: SEG06
    title: 包裹来了（碎片式·意外→好奇→预感）
    narrative_function: "Substance Zone — 包裹送达。悬念建立——护士带来包裹，寄件人是'赵小满'。林秀芝认出小满的字迹，产生期待。这是Cliffhanger Zone的前奏——制造'包裹里是什么？'的疑问。"
    scene: SCENE-010
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP59-S08
      - EP59-S09
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 碎片式
    notes: "两镜结构：第一镜护士进门送包裹（信息传递），第二镜林秀芝认出寄件人（情绪反应）。[待补：护士] 为未分配ID群演——已在待补群演清单中登记（建议CHAR-GRP-09+）。'寄件人写的是赵小满'是核心信息句——让观众提前1秒知道是谁寄来的，制造期待。⚠️ 护士角色为一次性出现（1个segment，2句台词），建议CHAR-GRP-09+。"

  - segment_id: SEG07
    title: CD（独白递进·期待→看到→感动）
    narrative_function: "Cliffhanger Zone — 打开包裹，发现CD封面上的献词。信息揭露+情感冲击。核心信息：赵小满的钢琴独奏专辑。CD封面写'献给我的老师——林秀芝'。这是教育传承的终极回报。"
    scene: SCENE-010
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP59-S10
      - EP59-S11
    total_duration_sec: 11
    transition_from_previous: hard_cut
    dominance_rhythm: 独白递进
    notes: "两镜结构：第一镜手部大特写撕开包裹+露出CD盒（6s），第二镜面部特写读到题字时的情感冲击（5s）。⚠️ CD封面文字由角色对白读出——规避Seedance渲染文字不可靠的问题。⚠️ EP59-S10（ECU手部+CD盒）无唇形同步要求——Seedance可拍。本段金句'小满……你做到了'在SEG08出现（相邻段），但SEG07的'献给我的老师——林秀芝'为信息行非金句，两句金句不相邻✅。"

  - segment_id: SEG08
    title: 一生的答案（情感钩·感动→泪水→确认→圆满）
    narrative_function: "Cliffhanger Zone（续）— 情感收束。林秀芝把CD贴在胸前，听赵小满弹的《月光奏鸣曲》。内心的终极释然——'这就是答案'。本段为EP60（母女终极和解）做情绪铺垫。"
    scene: SCENE-010
    time_of_day: 午后
    interior_exterior: 内景
    shot_ids:
      - EP59-S12
    total_duration_sec: 10
    transition_from_previous: hard_cut
    dominance_rhythm: 情感钩
    notes: "本段为单镜10s——面部情绪特写。CD播放器的音乐（赵小满版本的《月光奏鸣曲》）从画面外传入。本段非静音段——有3句内心独白+旁边CD音乐✅（Rule 21：≤1段静音段）。金句'小满……你做到了'（SEG08，10字）是后2SEG金句✅。本段为EP60（母女和解）的情绪铺垫——从'学生带来的满足'自然过渡到'与母亲的告别'。结尾钩子类型：H-EMO（情感钩）+ H-INF（信息钩：CD揭开了教育传承的圆满），但母女之间最深的结还没有解开——驱动EP60。"
