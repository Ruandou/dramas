episode_id: EP56
episode_title: 林满长大了
shots:
  - shot_id: EP56-S01
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "2015年初夏的午后客厅。阳光从窗户斜照进来，在地板上投出明亮的光块。林秀芝（47岁，齐肩微卷发，穿一件浅米色针织开衫）坐在客厅的旧立式钢琴前，正在弹一首轻柔的曲子。她手边放着一杯已经凉了的茶。窗外传来几声鸟鸣。钢琴上的谱架摊开着《月光奏鸣曲》的乐谱。她的手指在琴键上缓缓游走，表情宁静——像每次等待女儿回家时的模样。"
    dialogue:
      - speaker: CHAR-001
        emotion: 期待
        delivery: 内心
        text: 「毕业典礼……应该快结束了。」
      - speaker: CHAR-001
        emotion: 温暖
        delivery: 内心·轻声笑
        text: 「一眨眼，那个要我抱的小姑娘——要毕业了。」

  - shot_id: EP56-S02
    scene: SCENE-008
    characters:
      - CHAR-004
      - CHAR-001
    look_ids:
      - CHAR-004-L04
      - CHAR-001-L02
    shot_size: MS
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "门被推开的声音传来。林秀芝的手指在琴键上停下，她转头——门口，林满站在阳光里。22岁的林满穿着一件深蓝色的学士毕业袍，手里拿着卷起来的毕业证书，脸上带着兴奋和微微紧张的笑容。阳光从门口涌进来，在她身上镀了一层金边。林秀芝站起来，脸上绽开笑容。"
    dialogue:
      - speaker: CHAR-004
        emotion: 兴奋
        delivery: 清亮
        text: 「妈，我毕业了！」
      - speaker: CHAR-001
        emotion: 欣慰
        delivery: 笑中带泪
        text: 「毕业了……林满，你长大了。」
      - speaker: CHAR-004
        emotion: 柔软
        delivery: 快步上前抱住
        text: 「妈……」
      - speaker: CHAR-001
        emotion: 感慨
        delivery: 内心
        text: 「二十二年前那个扎马尾辫的小丫头……真的长大了。」

  - shot_id: EP56-S03
    scene: SCENE-008
    characters:
      - CHAR-004
      - CHAR-001
    look_ids:
      - CHAR-004-L04
      - CHAR-001-L02
    shot_size: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "两人在钢琴旁的小沙发上坐下。林满把毕业证书放在茶几上，但她的表情从最初的兴奋变成了某种犹豫——她低下头，手指在膝盖上轻轻绞着。林秀芝注意到了这个细节，她侧过头看女儿，笑容慢慢收住，变成一种温柔的等待。阳光在两人之间的茶几上投下一道明亮的分界线。"
    dialogue:
      - speaker: CHAR-001
        emotion: 温和
        delivery: 注意到她的犹豫
        text: 「怎么了？毕业了还不开心？」
      - speaker: CHAR-004
        emotion: 犹豫
        delivery: 声音小了些
        text: 「开心。但是妈——我有件事要跟你说。」
      - speaker: CHAR-001
        emotion: 耐心
        delivery: 轻轻点头
        text: 「你说。妈听着。」

  - shot_id: EP56-S04
    scene: SCENE-008
    characters:
      - CHAR-004
      - CHAR-001
    look_ids:
      - CHAR-004-L04
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "特写——林满的脸。她抬起头，深吸一口气，像在下定一个很大的决心。她的眼神里有忐忑，但也有一种坚定的光。林秀芝的手轻轻搭在她手背上——无声的支持。镜头缓缓推进，捕捉林满微微颤抖的嘴唇和坚定的眼神。窗外的风吹动了窗帘，光影在林满脸上晃动。"
    dialogue:
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 深吸一口气
        text: 「我的专业分配下来了。」
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 直视妈妈的眼睛
        text: 「不是音乐。」
      - speaker: CHAR-001
        emotion: 愣住
        delivery: 手停在半空
        text: 「不是音乐？那你——」
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 打断·快速
        text: 「我报的是医学院。」

  - shot_id: EP56-S05
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-004
    look_ids:
      - CHAR-001-L02
      - CHAR-004-L04
    shot_size: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝的手停在半空——这是她完全没有预料到的一个回答。她愣了两秒，嘴唇微张，像是在消化这个词：医学院。林满看着她，眼神里有一种'我知道你很惊讶但我没有选错'的坚定。两人之间的空气仿佛凝固了两秒。窗外的树叶沙沙作响。"
    dialogue:
      - speaker: CHAR-001
        emotion: 愣住
        delivery: 声音轻了
        text: 「医学院？」
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 点头
        text: 「嗯。五年制临床医学。毕业了。」
      - speaker: CHAR-001
        emotion: 复杂
        delivery: 声音缓了下来
        text: 「你不是一直喜欢音乐吗？从小跟着我弹琴——」
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 打断·温和
        text: 「妈，我喜欢音乐。但音乐不是我想守护世界的方式。」

  - shot_id: EP56-S06
    scene: SCENE-008
    characters:
      - CHAR-004
    look_ids:
      - CHAR-004-L04
    shot_size: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "特写——林满的脸，她微微仰起头，眼神清亮。阳光从侧面照亮她的脸颊，年轻的脸庞上有一种超越年龄的坚定。她停顿了一下，像是在组织语言，然后说出来——每一个字都清清楚楚。"
    dialogue:
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 目光坚定
        text: 「我想当医生。」
      - speaker: CHAR-001
        emotion: 震惊
        delivery: 声音微颤
        text: 「医生……可是你从没跟我说过啊。」
      - speaker: CHAR-004
        emotion: 歉意但固执
        delivery: 微笑
        text: 「我怕说了，你会劝我不要去。」

  - shot_id: EP56-S07
    scene: SCENE-008
    characters:
      - CHAR-001
    look_ids:
      - CHAR-001-L02
    shot_size: CU
    duration_sec: 11
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "特写——林秀芝的脸。她听到了那句话，但整个世界仿佛在那一瞬间安静了。她的眼神从震惊慢慢变成一种深沉的回忆——她想起了前世。她的眼眶慢慢红了——不是因为难过，而是因为释然。镜头缓缓推近，捕捉她眼角皱纹里的泪水。阳光在她脸上投下温暖的光影，她的嘴角从惊愕慢慢上扬——那是释然的笑。"
    dialogue:
      - speaker: CHAR-001
        emotion: 回忆
        delivery: 内心·声音发紧
        text: 「前世……我让她学会计。我说'稳定最重要'。」
      - speaker: CHAR-001
        emotion: 释然
        delivery: 内心·泪水盈眶
        text: 「这辈子——我让她自己选。」
      - speaker: CHAR-001
        emotion: 骄傲
        delivery: 内心·声音轻颤
        text: 「她选了医学。」
      - speaker: CHAR-001
        emotion: 骄傲
        delivery: 轻声
        text: 「林满……你自己选了医生。」
      - speaker: CHAR-001
        emotion: 感动
        delivery: 泪水滑落
        text: 「妈为你骄傲。」

  - shot_id: EP56-S08
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-004
    look_ids:
      - CHAR-001-L02
      - CHAR-004-L04
    shot_size: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "林秀芝向前倾身，手搭在女儿的手上。她看着林满，眼里是真实的疑问——她想知道为什么。阳光在两人交握的手上投下温暖的光斑。茶几上毕业证书的边缘泛着金色的光。窗外有汽车驶过的声音，但房间里很安静。"
    dialogue:
      - speaker: CHAR-001
        emotion: 认真
        delivery: 轻声
        text: 「妈不反对你选什么。但我想知道——为什么是医学？」
      - speaker: CHAR-001
        emotion: 探究
        delivery: 认真地看她
        text: 「你从来没提过。五年了，你从来没说过想当医生。」
      - speaker: CHAR-004
        emotion: 低头
        delivery: 回握住母亲的手
        text: 「因为我不想让你担心。」

  - shot_id: EP56-S09
    scene: SCENE-008
    characters:
      - CHAR-004
    look_ids:
      - CHAR-004-L04
    shot_size: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "特写——林满的脸。她抬起头，直视镜头（母亲的视角）。她的眼眶也有泪光在闪，但她控制着不让它掉下来——她想说清楚，想让她妈妈明白。阳光在她的睫毛上投下细碎的光点。"
    dialogue:
      - speaker: CHAR-004
        emotion: 稳中有颤
        delivery: 直视母亲
        text: 「你弹琴的时候，有时候会突然停下来。」
      - speaker: CHAR-004
        emotion: 坚定
        delivery: 声音渐低
        text: 「你不说。但我看到了——你捂着胸口。」
      - speaker: CHAR-001
        emotion: 愣住
        delivery: 嘴唇微张
        text: 「小满……」
      - speaker: CHAR-004
        emotion: 含泪
        delivery: 微微笑
        text: 「妈，音乐是你保护世界的方式。」
      - speaker: CHAR-004
        emotion: 坚定·深情
        delivery: 金句·一字一句
        text: 「而我学医——是因为我想保护你。」

  - shot_id: EP56-S10
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-004
    look_ids:
      - CHAR-001-L02
      - CHAR-004-L04
    shot_size: MCU
    duration_sec: 11
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "中近景——林秀芝听到那句话的瞬间，所有的防线都崩塌了。她的眼泪夺眶而出——不是无声的感动，而是那种从胸腔深处涌出来的、控制不住的泪。她一把抱住了林满，把脸埋在女儿的肩窝里。林满愣了一下，然后紧紧回抱住母亲，下巴搁在母亲的头顶上。两个人在午后的阳光里紧紧拥抱。钢琴的琴键在阳光下泛着温润的象牙白。"
    dialogue:
      - speaker: CHAR-001
        emotion: 哽咽
        delivery: 一把抱住
        text: 「小满……林满……」
      - speaker: CHAR-004
        emotion: 哽咽
        delivery: 回抱住母亲
        text: 「妈，你别哭啊……」
      - speaker: CHAR-001
        emotion: 哭着笑
        delivery: 松开一点看着她的脸
        text: 「前世……不，我是说——以前我总想让你过'对'的人生。」
      - speaker: CHAR-001
        emotion: 笑中带泪
        delivery: 金句
        text: 「我以为让你自己选，是我给你的礼物。原来——你选的这条路，才是你给我的礼物。」
      - speaker: CHAR-004
        emotion: 含泪笑
        delivery: 微微笑
        text: 「那这礼物——你喜欢吗？」
      - speaker: CHAR-001
        emotion: 感动
        delivery: 用力点头·泪流满面
        text: 「喜欢。妈特别特别喜欢。」

  - shot_id: EP56-S11
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-004
      - CHAR-007
      - CHAR-002
    look_ids:
      - CHAR-001-L02
      - CHAR-004-L04
      - CHAR-007-L02
      - CHAR-002-L02
    shot_size: MS
    duration_sec: 10
    mode: i2v_ref
    camera_movement: fixed
    visual_description: "傍晚的客厅亮起了暖黄的灯。茶几上摆着几碟菜和一些水果——陈望秋（50岁，深色Polo衫，鬓角微白，系围裙）从厨房探出头。门铃响了。林满跑去开门——门口站着一个穿着浅米色长裙、披着一件轻薄开衫的年轻女人。她戴着一副银色细框眼镜，气质文静优雅——正是赵小满（26岁，钢琴教师，低马尾，文静优雅）。她手里拿着一束白色的小花。客厅里传来轻柔的古典乐从收音机里流淌出来。"
    dialogue:
      - speaker: CHAR-004
        emotion: 惊喜
        delivery: 开门
        text: 「小满姐！你怎么来了？」
      - speaker: CHAR-007
        emotion: 微笑
        delivery: 递上花束
        text: 「恭喜毕业，小满。」
      - speaker: CHAR-007
        emotion: 温声
        delivery: 转向林秀芝
        text: 「林老师，我来晚了——音乐会那边刚结束。」
      - speaker: CHAR-001
        emotion: 欢喜
        delivery: 迎上前拉着她的手
        text: 「不晚，来得正好。」
      - speaker: CHAR-001
        emotion: 关心
        delivery: 打量她的穿着
        text: 「今天有演出？」
      - speaker: CHAR-007
        emotion: 腼腆
        delivery: 低头看长裙
        text: 「嗯，下午有一场学生汇报演出。」

  - shot_id: EP56-S12
    scene: SCENE-008
    characters:
      - CHAR-001
      - CHAR-004
      - CHAR-007
    look_ids:
      - CHAR-001-L02
      - CHAR-004-L04
      - CHAR-007-L02
    shot_size: MS
    duration_sec: 12
    mode: i2v_ref
    camera_movement: push_in
    visual_description: "赵小满放下花，和林满站在一起。林满还穿着医学院的白大褂（她特意从包里翻出来穿上给妈妈看）——白色笔挺，胸口别着一枚实习医生的徽章。赵小满穿着优雅的浅色演出长裙——柔软飘逸。两个'小满'并肩而立——一个白大褂，一个演出服。一个要当医生，一个已经是音乐教师。林秀芝站在她们面前，看了又看，目光在两个年轻女人之间来回游移。她眼里的泪水始终没有停，但嘴角的笑容却越来越大。陈望秋系着围裙站在通往厨房的门口，看着这一幕，也微微笑了。暮色从窗外渗进来，和室内的暖光灯交融，整个房间都笼罩在一种温润的金色中。"
    dialogue:
      - speaker: CHAR-001
        emotion: 满眼是光
        delivery: 声音轻了
        text: 「你们两个站在一起——让我好好看看。」
      - speaker: CHAR-001
        emotion: 笑中带泪
        delivery: 目光在两人间移动
        text: 「一个穿白大褂——」
      - speaker: CHAR-001
        emotion: 笑中带泪
        delivery: 看向赵小满再看向林满
        text: 「一个穿演出服。」
      - speaker: CHAR-004
        emotion: 笑
        delivery: 微微挺胸
        text: 「妈，怎么样？」
      - speaker: CHAR-001
        emotion: 感动·圆满
        delivery: 金句·一字一顿·含泪但笑容明亮
        text: 「两个小满——一个保护身体，一个滋养灵魂。我这辈子……圆满了。」
      - speaker: CHAR-001
        emotion: 释然
        delivery: 内心·轻声
        text: 「前世我让女儿学会计。这辈子——她自己选了医生。而赵小满——继承了我的音乐。」
      - speaker: CHAR-001
        emotion: 释然
        delivery: 内心·最后一句
        text: 「这大概就是——命运给我的回信。」
