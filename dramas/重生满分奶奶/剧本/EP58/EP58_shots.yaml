episode_id: EP58
episode_title: 307病房
shots:
  - shot_id: EP58-S01
    scene_id: SCENE-010
    character_ids: [CHAR-002, CHAR-001]
    look_ids: [CHAR-002-L03, CHAR-001-L03]
    framing: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      清晨的307病房，初春阳光在白色床单上投下温暖光影。陈望秋（50岁，深色圆领毛衣，鬓角银丝）坐在床边，双手捧着一只女人的手，拇指轻轻摩挲她的手背。林秀芝（48岁，蓝白条纹病号服，及肩卷发散在枕上）半靠在床头，看着他微笑。床头柜上放着一封叠好的旧信和一杯水。窗台上有多束鲜花。柔和的暖色自然光，情绪肖像摄影，2016年中国现代医院病房，胶片颗粒感。
    dialogue:
      - speaker: CHAR-002
        emotion: 温柔·坚定
        text: 别怕。我在。
      - speaker: CHAR-001
        emotion: 微笑·轻声
        text: 我知道。
      - speaker: CHAR-001
        emotion: 内心
        text: 前世……也是307。但那次，床边没有人。
      - speaker: CHAR-001
        emotion: 内心
        text: 这次……有他。有女儿。什么都有了。

  - shot_id: EP58-S02
    scene_id: SCENE-010
    character_ids: [CHAR-004, CHAR-001, CHAR-002]
    look_ids: [CHAR-004-L05, CHAR-001-L03, CHAR-002-L03]
    framing: MS
    duration_sec: 5
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      林满（23岁，白大褂，低马尾，住院医师胸牌）推门走进病房，手里拿着病历。她在床边站定，看着母亲和父亲。她的表情专业克制但眼底有担忧。林秀芝抬头看她，笑容温暖。陈望秋仍然握着妻子的手。清晨阳光从窗外照进来，三个人的轮廓在温暖的光线中。2016年中国医院病房，写实风格。
    dialogue:
      - speaker: CHAR-004
        emotion: 声音专业但尾音微紧
        text: 妈。麻醉师马上来了。
      - speaker: CHAR-001
        emotion: 微笑
        text: 好。妈准备好了。
      - speaker: CHAR-004
        emotion: 轻声补充
        text: 我在手术室陪你到麻醉。
      - speaker: CHAR-001
        emotion: 内心·感慨
        text: 前世我从没想过…有一天女儿会穿着白大褂、对我说"我在"。

  - shot_id: EP58-S03
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-002]
    look_ids: [CHAR-001-L03, CHAR-002-L03]
    framing: MCU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: follow
    visual_prompt: >-
      病床被推出病房，沿走廊向手术室移动。林秀芝躺在病床上，陈望秋走在床边，一只手一直握着她的手，步伐与推床同步。头顶日光灯一格格滑过。他的手指微微收紧。走廊尽头手术室红灯亮着。2016年中国医院走廊，冷白灯光与暖色墙面形成对比，动态跟随镜头，情绪肖像摄影。
    dialogue:
      - speaker: CHAR-001
        emotion: 轻声
        text: 望秋。
      - speaker: CHAR-002
        emotion: 温和
        text: 嗯？
      - speaker: CHAR-001
        emotion: 微笑·半开玩笑
        text: 等我醒了——给我弹首曲子。
      - speaker: CHAR-002
        emotion: 声音稳但眼眶微红
        text: 好。弹你最喜欢那首。
      - speaker: CHAR-001
        emotion: 内心
        text: 如果我醒不来…至少最后听到的是他的声音。

  - shot_id: EP58-S04
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: push_in
    visual_prompt: >-
      特写——林秀芝的脸。病床停在手术室门口。她看着天花板，日光灯的光芒渐渐充满视野。她的表情从淡淡的微笑慢慢变为一种奇异的平静——眼睛里有光，不是恐惧，而是接受。眼皮微微颤动。天花板的光晕开始模糊、扩散。她轻轻闭上了眼睛。2016年手术室走廊，冷白日光灯在瞳孔中反射，大特写情绪肖像，胶片颗粒感。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·轻柔
        text: 1988年…那架旧钢琴…
      - speaker: CHAR-001
        emotion: 内心
        text: 月光…合奏…第一次牵手…
      - speaker: CHAR-001
        emotion: 内心
        text: 林满的第一声"妈妈"…
      - speaker: CHAR-001
        emotion: 内心·平静
        text: 我这一生——够了。
      - speaker: CHAR-001
        emotion: 内心·轻声
        text: 307…我来了。

  - shot_id: EP58-S05
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: MS
    duration_sec: 8
    mode: i2v_ref
    camera_movement: pull_back
    visual_prompt: >-
      纯白的无限空间。没有墙，没有天花板，没有地板——无尽白色如静止的光海。林秀芝（48岁，蓝白条纹病号服，赤脚）站在空间中央，低头看自己的手。她摸了摸自己的脸，环顾四周。白色空间里开始浮现模糊轮廓——一张病床的影子、一面墙的影子、一扇窗户的影子——像水墨在白纸上慢慢显形。梦境般的非写实现实，意识空间，柔和纯净的白光，超现实氛围。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·困惑
        text: 这是…梦里？
      - speaker: CHAR-001
        emotion: 内心·渐渐明白
        text: 不…这不是梦。
      - speaker: CHAR-001
        emotion: 轻声·自语
        text: 我到了…两个世界之间。
      - speaker: CHAR-001
        emotion: 内心
        text: …有人在这里。

  - shot_id: EP58-S06
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-001]
    look_ids: [CHAR-001-L03, CHAR-001-L04]
    framing: MLS
    duration_sec: 10
    mode: i2v_ref
    camera_movement: push_in
    visual_prompt: >-
      白色空间凝聚成另一个307病房——色调偏冷，家具更旧，窗帘是褪色碎花布。一张旧式病床，床上是素色棉被。窗前站着一个瘦削的白发老人——60岁林秀芝，花白短发，面颊消瘦，穿浅蓝色条纹病号服，背微驼，正看着窗外。冷调阳光照进来。48岁林秀芝站在病房门口，看着那个背影。那个背影缓慢转过来——两张相同的脸隔着二十年时光对望。超现实意识空间，冷调与暖调交织，两个时间线交汇，情绪肖像摄影。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·声音开始颤抖
        text: 那个房间…也是307。
      - speaker: CHAR-001
        emotion: 内心
        text: 但那不是我的307…她的床单不一样…
      - speaker: CHAR-001
        emotion: 内心·震惊地意识到
        text: 那是——另一个我。
      - speaker: CHAR-001
        emotion: 轻声
        text: 60岁的我…
      - speaker: 旁白
        emotion: 轻声·温暖
        text: 同一个医院。同一个病房。同一个手术。两个时间线的她——在麻醉的虚空中，终于相遇了。

  - shot_id: EP58-S07
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-001]
    look_ids: [CHAR-001-L03, CHAR-001-L04]
    framing: MCU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      两人对望。60岁林秀芝（花白短发，消瘦面颊，皱纹深刻，杏眼依然有光）缓缓转过身来，嘴角带着温柔的微笑——没有震惊，只有"终于来了"的释然。48岁林秀芝站在几步之外，嘴唇微张，眼眶泛红。二人之间隔着一小段距离，仿佛隔着二十年时光。暖金色光晕环绕60岁的她，冷白光照着48岁的她。意识空间，超现实氛围，温情的对视，情绪肖像摄影。
    dialogue:
      - speaker: CHAR-001-L04
        emotion: 微笑·温柔
        text: 你来了。
      - speaker: CHAR-001
        emotion: 声音发紧
        text: 你…一直在等我？
      - speaker: CHAR-001-L04
        emotion: 微笑·点头
        text: 等了一辈子。

  - shot_id: EP58-S08
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: CU
    duration_sec: 5
    mode: i2v_ref
    camera_movement: push_in
    visual_prompt: >-
      特写——48岁林秀芝的脸。她看着60岁的自己，表情复杂到无法形容——像照镜子但镜中人老了二十岁。她下意识抬手，摸了摸自己的脸——眼角没有皱纹，面颊饱满。然后她放下手，看着对方，慢慢露出一个笑容——不是心酸，而是接受。金色微光从她身后浮现。意识空间，大特写情绪肖像，写实情感渲染，胶片颗粒感。
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·百感交集
        text: 60岁的我…面容这么老了。
      - speaker: CHAR-001
        emotion: 内心
        text: 但她的眼睛…和1988年的我一样亮。
      - speaker: CHAR-001
        emotion: 轻声·像对自己说
        text: 原来…我一直是我。

  - shot_id: EP58-S09
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L04]
    framing: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      近景——60岁林秀芝坐在病床边缘，手放在膝盖上，姿态放松坦然。她看着远方，阳光照在她花白的头发上泛着银光。她的表情温和而好奇——像一个母亲问远归的女儿"你过得怎么样"。她身后，旧式病房的轮廓在白色空间中若隐若现。金色暖光包裹着她，显得安详而释然。意识空间，情绪肖像摄影，温暖色调，胶片颗粒感。
    dialogue:
      - speaker: CHAR-001-L04
        emotion: 温和·像拉家常
        text: 你过得好吗？
      - speaker: CHAR-001-L04
        emotion: 眼中有深意
        text: 那个1988年重新开始的人生…值得吗？

  - shot_id: EP58-S10
    scene_id: SCENE-010
    character_ids: [CHAR-001]
    look_ids: [CHAR-001-L03]
    framing: CU
    duration_sec: 6
    mode: i2v_ref
    camera_movement: fixed
    visual_prompt: >-
      特写——48岁林秀芝。她听到问题后沉默了两秒——不是犹豫，是在心里把所有画面过了一遍：钢琴、月光、陈望秋的手、林满的笑、音乐教室的信。她笑了——这个年龄最真实的笑容，眼睛弯弯，嘴角扬起。金色光从她身后散发。她的眼神坚定温暖。意识空间，大特写情绪肖像，温暖金光，胶片颗粒感。
    dialogue:
      - speaker: CHAR-001
        emotion: 发自内心地笑了
        text: 我过得很好。
      - speaker: CHAR-001
        emotion: 声音坚定
        text: 虽然有遗憾——但我没有后悔。
      - speaker: CHAR-001
        emotion: 内心·轻柔
        text: 一颗琴键都没后悔过。

  - shot_id: EP58-S11
    scene_id: SCENE-010
    character_ids: [CHAR-001, CHAR-001]
    look_ids: [CHAR-001-L04, CHAR-001-L03]
    framing: MCU
    duration_sec: 11
    mode: i2v_ref
    camera_movement: push_in
    visual_prompt: >-
      两人同框——60岁的坐在床边，48岁的站在几步之外。中间隔着的不是距离，是二十年时间。当48岁说出"没有后悔"后，60岁低下头——像悬着的心终于放下。然后她抬起头，眼眶泛红但笑容灿烂。两人目光交汇，温暖的金色光晕将两人笼罩。白色空间从边缘开始慢慢消散。镜头缓缓推近两人的脸。超现实意识空间，两个时间线的和解，温暖色调，情绪肖像摄影。⚠️ 两个同角色不同年龄同框——需确保面部识别稳定，建议Prompt中明确区分"48-year-old Lin Xiuzhi, younger face, fuller cheeks"和"60-year-old Lin Xiuzhi, white hair, thinner face with wrinkles"。
    dialogue:
      - speaker: CHAR-001-L04
        emotion: 低头沉默后抬头·眼中有泪但笑容灿烂
        text: 那就够了。
      - speaker: CHAR-001-L04
        emotion: 声音微颤但坚定
        text: 我也可以——放心了。
      - speaker: CHAR-001
        emotion: 急切
        text: 你要去哪？
      - speaker: CHAR-001-L04
        emotion: 笑容温暖
        text: 去该去的地方。
      - speaker: CHAR-001-L04
        emotion: 最后看她一眼
        text: 你替我——好好活下去。

