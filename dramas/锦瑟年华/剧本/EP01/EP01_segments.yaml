voice_prompts:
  CHAR-001: "成年女性，23岁，清越中带一丝低沉的中音底色——不是尖锐的女高音，而是像琴弦被缓缓拉紧时的嗡鸣。日常说话柔和克制，情绪爆发时声音会突然下沉，有一种被压抑了太久终于破茧的力量。平时语速偏慢，每一个字都经过掂量——她在伪装身份不能说错半个字。愤怒时语速反而加快如断弦急雨。极少主动打断别人，习惯用沉默回应挑衅。情绪极深时说完半句话忽然收住像琴弦骤停。对慕白说话时偶尔会不自觉地放软声线然后立刻警觉收回。"
  CHAR-002: "成年男性，27岁，温润如玉的中音，有一种被良好教养浸润出的从容感——不是傲慢，而是那种从不需要提高音量来表达的平静。语速适中偏缓，习惯在关键句前微微停顿——他在思考。后期真相揭露后声音中多了一层不易察觉的沙哑——那是被痛苦磨损过的质地。质问祖父时语速陡然加快，情绪在嗓音边缘若隐若现。对锦瑟说话时语速会不自觉地放得更慢更柔。重伤后说话时有轻微的气短和停顿。引用古诗或乐理时会有一种自然的陶醉语气——他是真的爱音乐。"
  旁白: "成年女性，声线温润而有质感——像翻开一本旧书时纸张的声音。语速从容，语调中有一种「讲述一段值得被记住的故事」的庄重感。不带过度煽情，而是让故事本身说话。"

