      - speaker: CHAR-002
        line: "不是曲谱——是手法。右手挑、左手吟——"

  - shot_id: EP01-S12
    shot_no: 12
    mode: i2v_ref
    duration_sec: 6
    refs:
      scene_id: SCENE-001
      look_ids:
