        line: "我看见娘了。她站在火光里——把白玉兰簪塞进我手里。"
      - speaker: CHAR-001
        line: "她说——活下去。不要回头。永远不要回头。"
      - speaker: CHAR-001
        line: "可是我回来了——娘。我回来了。"

