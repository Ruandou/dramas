shots:
  # ===== SEG01: 十五年前·灭门 =====
  - shot_id: EP01-S01
    shot_no: 1
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: null
      look_ids: []
    assets:
      look_urls: {}
      scene_urls: {}
    api:
      text: "冬日长安东市刑场，灰蒙蒙的天压得很低。木制刑台高筑，四周站满沉默的百姓。刑台上跪着三十二个身影，最前面是一个穿青色文士袍的中年男人，脊背挺直。刽子手手中的刀反射着冷白色的日光。"
      content_roles: []
    dialogue:
      - speaker: 旁白
        line: "天宝十年腊月。长安东市刑场。"

  - shot_id: EP01-S02
    shot_no: 2
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: null
      look_ids: []
    assets:
      look_urls: {}
      scene_urls: {}
    api:
      text: "人群中，一个约八岁的小女孩被人群挤在最前排。小脸煞白，眼睛瞪得极大——那双眼睛里没有泪，只有一种被冻住了的恐惧。一只苍老的、布满青筋的手从她身后伸过来，紧紧捂住了她的嘴。监斩台上，令牌落地。"
      content_roles: []
    dialogue:
      - speaker: 旁白
        line: "沈氏一族三十二口人，以『通敌叛国』之罪——满门抄斩。"
      - speaker: 旁白
        line: "沈鹤亭跪在最前面。他没有喊冤。刀光落下时，人群中一个八岁的女孩——被一只苍老的手捂住了嘴。"

  # ===== SEG02: 十五年·深山 =====
  - shot_id: EP01-S03
    shot_no: 3
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: null
      look_ids: []
    assets:
      look_urls: {}
      scene_urls: {}
    api:
      text: "终南山深处，云雾缭绕的山谷中一间竹屋。屋前古松虬曲，松下摆着两张琴案。一个白髯及胸的老人端坐案前，手指轻按在一张古琴上。他身边坐着一个约十岁的女孩，小手学着老人的姿势放在一张略小的锦瑟上。"
      content_roles: []
    dialogue:
      - speaker: 旁白
        line: "白髯先生——沈鹤亭的故交。他把女孩带到了终南山深处。教她读书，教她弹琴。"
      - speaker: 旁白
        line: "最重要的是——他把沈家失传的指法，一音一节地还给了她。"

  - shot_id: EP01-S04
    shot_no: 4
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: null
      look_ids: []
    assets:
      look_urls: {}
      scene_urls: {}
    api:
      text: "同一片松林，季节已换了好几轮。琴案前坐着的女孩已经长成了少女，身姿挺拔，手指在锦瑟上翻飞如燕。她的侧脸隐在阴影中，只有发间一支白玉兰簪在暮色中微微发亮。镜头缓缓推向她的眼睛——那双眼睛里，十五年前的恐惧已经变成了被压在水面下的火焰。"
      content_roles: []
    dialogue:
      - speaker: 旁白
        line: "十五年了。"
      - speaker: 旁白
        line: "现在是天宝二十五年。太乐令选拔赛开赛在即——优胜者可在御前献艺。这是她唯一的机会。"

  # ===== SEG03: 长安·归来 =====
  - shot_id: EP01-S05
    shot_no: 5
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: SCENE-009
      look_ids: []
    assets:
      look_urls: {}
      scene_urls:
        SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-009.png
    api:
      text: "朱雀大街宽阔的黄土路面被午后的阳光晒得发白，两侧槐树投下斑驳的树影。街面上车马如梭，远处一队骆驼商队正从西门方向缓缓行来。坊墙高耸，朱雀门在远处的薄雾中隐约可见。街边公告栏前围着一群人，一张崭新的告示上朱红大印格外显眼：太乐令选拔赛。"
      content_roles: []
    dialogue:
      - speaker: CHAR-001
        line: "长安。"
      - speaker: CHAR-001
        line: "我又回来了。"

  - shot_id: EP01-S06
    shot_no: 6
    mode: i2v_ref
    duration_sec: 5
    refs:
      scene_id: SCENE-009
      look_ids:
        - CHAR-001-L01
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/锦瑟年华/CHAR-001-L01.png
      scene_urls:
        SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-009.png
    api:
      text: "【图1】CHAR-001-L01【图2】SCENE-009。人群中，一个穿靛青色唐制齐胸襦裙的女子缓步走过公告栏。面纱遮住了她大半张脸，只露出一双远山眉和微微上挑的眼尾。她的目光扫过告示上的每一个字——很慢，像在确认什么。面纱被风吹起一角，露出线条分明的下颌和紧抿的薄唇。"
      content_roles:
        - file: CHAR-001-L01
          role: reference_image
          label: 图1
        - file: SCENE-009
          role: reference_image
          label: 图2
    dialogue:
      - speaker: CHAR-001
        line: "朱雀大街还是这么宽。人还是这么多。"
      - speaker: CHAR-001
        line: "没有人会认出我。没有人会记得一个死了十五年的孩子。"
      - speaker: CHAR-001
        line: "太乐令选拔赛——到御前去。在皇帝面前，把父亲的琴声弹给所有人听。"

  # ===== SEG04: 茶肆·落座 =====
  - shot_id: EP01-S07
    shot_no: 7
    mode: t2v
    duration_sec: 5
    refs:
      scene_id: SCENE-001
      look_ids: []
    assets:
      look_urls: {}
      scene_urls:
        SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-001.png
    api:
      text: "一条窄巷深处，一间不起眼的茶肆。木质结构的屋顶低矮，几根原木柱子撑着横梁，上面挂着几串干药材和艾草。午后阳光从格子窗棂斜射进来，在粗陶茶碗和旧木桌上切出一道道明暗交错的条纹。空气中浮动着茶香和细尘，三两个茶客散坐在角落。最里面靠窗的角落，一张空琴案安静地等着。"
      content_roles: []
    dialogue:
      - speaker: CHAR-001
        line: "这间茶肆——离大明宫只隔了六条街。"
      - speaker: CHAR-001
        line: "六条街。十五年的路，只剩下最后六条街了。"

  - shot_id: EP01-S08
    shot_no: 8
    mode: i2v_ref
    duration_sec: 6
    refs:
      scene_id: SCENE-001
      look_ids:
        - CHAR-001-L01
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/锦瑟年华/CHAR-001-L01.png
      scene_urls:
        SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-001.png
    api:
      text: "【图1】CHAR-001-L01【图2】SCENE-001。锦瑟走进茶肆，径直走向角落的琴案。她将怀中抱着的锦瑟轻轻放在案上——琴身表面的漆有细微的修补痕迹，近看能发现两三处拼接的纹理。她的手指拂过琴弦时极其轻柔，像在触碰一个沉睡的人。面纱下，她的嘴唇微微动了一下——是默念。然后她坐下，脊背挺直如弦，双手落在了琴弦上。"
      content_roles:
        - file: CHAR-001-L01
          role: reference_image
          label: 图1
        - file: SCENE-001
          role: reference_image
          label: 图2
    dialogue:
      - speaker: CHAR-001
        line: "父亲说过——锦瑟是天地之间有情的乐器。琴弦一拨，万物回响。"
      - speaker: CHAR-001
        line: "那就让长安先听一听。什么是沈家的琴声。"

