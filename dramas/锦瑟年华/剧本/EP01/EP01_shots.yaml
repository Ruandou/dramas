        SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-001.png
    api:
      text: "茶肆里一片死寂。老茶客的茶碗还端在半空中，茶水已经凉了。中年男子不知何时站了起来。掌柜在柜台后面张着嘴，手里的算盘珠子停在一个数字上。阳光从窗棂移了一格——已经过去了一盏茶的时间。然后，不知道是谁先鼓了掌——零落的掌声在茶肆里炸开，像迟到的雷鸣。"
      content_roles: []
    dialogue:
      - speaker: CHAR-001
        line: "满座无人言语。这就是沈家的琴。"
      - speaker: CHAR-001
        line: "父亲——我做到了。"

  # ===== SEG09: 白衣·发问 =====
  - shot_id: EP01-S17
