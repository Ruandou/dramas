      text: "【图1】CHAR-001-L01【图2】CHAR-002-L01【图3】SCENE-001。两人在茶肆的一角形成了对峙般的构图：图2站立，图1端坐。图1没有立刻回答。她先伸手按住仍在微微颤动的琴弦——这个动作恰好遮住了她微微收紧的指尖。然后她缓缓抬头，面纱上的眼睛与图2的目光相遇。那双眼睛极平静——平静得不像一个刚刚弹完《月照关山》的人。"
