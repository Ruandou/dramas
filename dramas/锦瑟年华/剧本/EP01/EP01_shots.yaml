    api:
      text: "【图1】CHAR-001-L01【图2】SCENE-001。大特写：图1右手三指并拢，指尖有薄茧——那是十五年每日抚琴磨出的印记。指甲修剪得极短，这是沈氏指法的要求：以肉拨弦，音色才能温润如月。第一根弦被拨动——中指先落，食指紧随，无名指从弦下挑过，三指如雁阵掠过渡口，一气呵成。琴弦在特写下颤动，反射着一线从窗棂漏入的微光。"
      content_roles:
