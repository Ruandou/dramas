        - file: SCENE-001
          role: reference_image
          label: 图2
    dialogue:
      - speaker: CHAR-001
        line: "《月照关山》。"
      - speaker: CHAR-001
        line: "父亲在玉门关外写的曲子。"
      - speaker: CHAR-001
        line: "他说——月亮照在大唐的宫殿，也照在西域的沙漠。"

  - shot_id: EP01-S10
    shot_no: 10
    mode: i2v_ref
    duration_sec: 5
    refs:
      scene_id: SCENE-001
      look_ids:
        - CHAR-001-L01
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/锦瑟年华/CHAR-001-L01.png
      scene_urls:
        SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/锦瑟年华/SCENE-001.png
    api:
      text: "【图1】CHAR-001-L01【图2】SCENE-001。近景：图1的上半身在窗棂投下的光影中微微前倾，面纱随呼吸轻轻起伏。她的眼睛半阖——不是闭眼，而是将全部注意力收进了指尖。茶肆里原本闲散的交谈声像被刀切断了，一个老茶客端着茶碗的手停在了半空中，另一个背对镜头的中年男子缓缓转过了身。空气中只有琴声在流淌——幽冷、克制、像月光一寸一寸漫过戈壁。"
      content_roles:
        - file: CHAR-001-L01
          role: reference_image
          label: 图1
        - file: SCENE-001
          role: reference_image
          label: 图2
    dialogue:
      - speaker: CHAR-001
        line: "十五年前——他没来得及在御前弹完。"
      - speaker: CHAR-001
        line: "今天，我替他弹。阿爹——你听。这是你的琴。你的弦。"

