    api:
      text: "【图1】CHAR-002-L01【图2】SCENE-001。特写：图1的脸从漫不经心变为全神贯注。他的眼睛紧紧锁在角落那个弹琴的背影上——准确地说，是锁在她右手三指的运行轨迹上。剑眉缓缓蹙起，随即瞳孔微扩——那是认出了什么的表情。他的喉结上下滚动了一次。镜头从他脸上缓缓推向他的眼睛：那双眼睛里先是震惊，然后是难以置信，最后沉入一种深水般的凝重。"
