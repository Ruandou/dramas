        镜头1（6秒）MCU 固定镜头：图1挣扎着从镜面地面上撑起上半身——手在镜面上撑得指节发白金血从掌心淌下与吞噬印记金光交融。抬头顺着金色能量线汇聚方向看去——密室中央半空之中一枚拳头大小金色珠子悬浮在三米高处缓缓旋转。珠子散发万道金光如微型太阳日珥在密室中交织成金色的网。镜面地面完美反射金光创造无限金色虚空幻觉——图1仿佛悬浮在宇宙中心。珠子周围金色星辰光点环绕如微型星系。金色光线照在图1脸上将金血映成灿烂金色——如同神迹。金色瞳孔中漩涡纹与珠子旋转同频共振越来越快。
        镜头2（6秒）CU 镜头推近：图1仰望金色珠子——嘴唇微张金色瞳孔满是震撼。那不是恐惧是血脉深处的共鸣——如迷路的孩子终于找到家的方向。珠子金光突然剧烈脉动一下如心跳——然后从珠子深处传来一个声音。那声音苍老温和带着跨越岁月的慈爱与等待——如祖辈呼唤。图1瞳孔骤缩嘴唇颤抖。镜面地面上倒影与珠子光芒融为一体。珠子中金色漩涡纹与掌心吞噬印记遥相呼应——同源同脉。
