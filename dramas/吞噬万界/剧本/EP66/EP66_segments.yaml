      【图1】万界监者本体 CHAR-017-L03（金甲大面积碎裂，身体半透明化）【图2】林渊 CHAR-001-L04（白仙袍残破，金光微闪）【图3】天裂谷·万丈高空 SCENE-032。
      竖屏9比16连贯叙事。
      镜头1（7秒）LS 固定镜头：万丈高空——图1金甲继续碎裂，大块大块金色甲片从身上剥落坠入云海。身体开始半透明化，金色光芒从碎裂处外泄如将灭灯笼。下方九道光柱缓缓收敛，天地间异象逐渐平息。远处图2悬立虚空——白仙袍残破但仍有金光微闪，面容疲惫但眼神坚定。二人隔空对视。
      镜头2（5秒）CU 镜头推近：图1面庞最后特写——金色瞳孔中傲慢崩塌，被不甘取代。金甲碎片如金色雪花在脸庞周围飘落。嘴唇微动，声音破碎如碎裂的钟——
      [以下对白仅供语音合成，严禁在画面中显示任何文字]
      对白（林渊，成年男性，少年声线逐渐成熟，语调低沉克制，语速偏慢，关键时刻声音压低越怒越冷）：「借来的？」
      对白（林渊，成年男性，少年声线逐渐成熟，语调低沉克制，语速偏慢，关键时刻声音压低越怒越冷）：「他们的信任……比天还重。」
      对白（万界监者，成年男性，声线低沉带金属回响，如神谕般空旷，语速极慢，被击伤时声音破裂）：「不可能……一个下界……」
