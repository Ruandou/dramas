# === 格式模板 — 不得删除/增减任何字段 ===
# 对齐影后装新人项目实战格式

episode_id: EP##
source_md: 剧本/EP##/EP##_[标题].md

defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast-260128  # ⚠️ 必须带版本后缀，无后缀名方舟返回 404 InvalidEndpointOrModel.NotFound
  seed: 78786  # ⚠️ 全集固定 seed：官方推荐「固定 seed+详细声音描述」提升同角色跨段音色/语速稳定度；项目内统一一个值，段级 api.seed 可覆盖
  ratio: "9:16"  # 横竖屏可选：从 `制片规范.md` → `aspect_ratio` 读取（"9:16" 竖屏 / "16:9" 横屏）
  resolution: 720p
  generate_audio: true
  watermark: false
  prompt_suffix: "[从制片规范复制]"
  prompt_suffix_silent: "本段无对白无语音，禁止画面中出现任何文字。[风格描述]"
  negative_prompt: "[从制片规范复制]"

voice_prompts:
  CHAR-###: "[声音描述，从 资产/声音卡片.md 全文复制，不含「」]"

segments:
  - segment_id: EP##-SEG01
    shot_ids: [EP##-S01]
    duration_sec: 10
    speakers: [CHAR-###]
    refs:
      scene_id: SCENE-###
    assets:
      look_urls:
        # 含可见人脸的形象必须用 -mesh 版（Seedance 人脸过滤，见 AGENTS.md Stage 3 清单 G）；
        # 剪影/背影等无脸形象去掉 -mesh 后缀用原图（以 资产/形象索引.md 的 mesh 登记为准）
        CHAR-###-L##: https://drama-reference-images.tos-cn-beijing.volces.com/looks/<剧名>/CHAR-###-L##-mesh.png
      scene_urls:
        SCENE-###: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/<剧名>/SCENE-###.png
      prop_urls: {}
    api:
      # 结构化 api 块（推荐，P2 起主推）：平台无关，CLI 按引擎渲染最终 text——
      #   minimax(H3) → Ref2VA 六段式（含 LOCK FACE 锁脸声明 + <d> 内嵌对白）
      #   seedance    → 旧【图N】格式（由 prompt_renderer._render_legacy 生成）
      # subjects: 本段全部参考素材（角色/场景/道具），id/file 与 content_roles 对应
      subjects:
        - id: CHAR-###-L##
          file: CHAR-###-L##
          name: 角色名
          role: character          # character / scene / prop
          gender: female           # character 必填：female→LOCK HER FACE / male→LOCK HIS FACE
          desc: 服装/外形简述（供锁脸声明）
        - id: SCENE-###
          file: SCENE-###
          name: 场景名
          role: scene
          desc: 时段/光线简述
      # shots: 逐镜头描述；speakers 为镜头内对白（voice 用声音卡片 P0 全文）
      shots:
        - shot_no: 1
          duration_sec: 5
          shot_type: 中景
          camera: 固定镜头
          visual: 画面描述，角色用 subject id 指代（如 CHAR-###-L## 推门进来）
          speakers:
            - subject: CHAR-###-L##
              voice: "{voice_prompt 全文}"
              dialogue: "台词内容"
      soundscape: 环境音简述（可选，默认「环境音贯穿」）
      music: N/A                    # 或 BGM 描述；无 BGM 写 N/A
      # 旧 text 字段已废弃（CLI 渲染生成）；存量 YAML 保留作兼容兜底
      content_roles:
        - { file: CHAR-###-L##, role: reference_image, label: 图1 }
        - { file: SCENE-###, role: reference_image, label: 图2 }
    transition_to_next: hard_cut
