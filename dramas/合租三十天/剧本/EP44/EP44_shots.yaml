  visual_description: "林晓棠从文件夹里抽出一张标注了红线的纸，递给陈小满。暖黄灯光照在纸上，红线圈出了一处空白。许辰从床边探身看了一眼。陈小满接过纸，眉头皱起，手指顺着红线滑过。桌上的便利贴密密麻麻，有些已经皱了。"
  dialogue:
  - speaker: CHAR-001
    emotion: "递纸"
    line: "这里——第二笔转账，缺金额。"
  - speaker: CHAR-003
    emotion: "接过·皱眉"
    line: "念真姐那年没拿到回执？"
  - speaker: CHAR-002
    emotion: "摇头"
    line: "只有银行流水截图。他们没给过正式凭证。"
  - speaker: CHAR-005
    emotion: "低声"
    line: "先标注待补，发出去再说？"
  - speaker: CHAR-001
    emotion: "点头·在页边写字"
    line: "标了。等补全了更新。"

