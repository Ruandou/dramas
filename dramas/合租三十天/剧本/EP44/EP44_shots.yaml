  visual_description: "陈小满卧室，凌晨四点。暖黄台灯是唯一光源，笔记本电脑屏幕白光照亮四个人的脸——陈小满坐在桌前，键盘下方垫着揉皱的草稿纸。许辰坐在床边，自己的笔记本电脑搁在膝盖上，屏幕显示排版软件。苏念真盘腿坐在床尾，黑框眼镜反射屏幕光，手指绞着枕巾。林晓棠搬了把椅子坐角落，膝头文件夹翻开着，笔夹在耳后。桌上散落着空咖啡杯和密密麻麻的便利贴。"
  dialogue:
  - speaker: CHAR-003
    emotion: "低头念屏幕·沙哑"
    line: "她签完那份协议才知道，自己不是项目合伙人，是替罪羊。"
  - speaker: CHAR-005
    emotion: "轻声"
    line: "这一段重点标出来。读到这里，读者已经走不掉了。"
  - speaker: CHAR-002
    emotion: "内心·盯着屏幕"
    line: "是我的陈述……每一个字都是真的。"
    type: monologue
  - speaker: CHAR-001
    emotion: "翻文件·低声"
    line: "第三页，转账记录的日期——查过了。"

