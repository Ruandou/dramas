# EP70 旧盒子 — segments.yaml
# 真相源：剧本/EP70/EP70_旧盒子.md
# 版本：v1.0

segments:

  # ── SEG01 · Hook Zone: 远程面试成功（蓄力式·期待→确认） ──
  - segment_id: SEG01
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP70-S01, EP70-S02]
    narrative_function: "Hook Zone — 林晓棠远程面试成功，三人期待中的紧张转为惊喜"
    rhythm: "蓄力式·期待→确认"
    dialogue:
      - speaker: CHAR-001
        emotion: "紧张·低声"
        text: "……我在。"
      - speaker: CHAR-001
        emotion: "哽咽·压低"
        text: "……谢谢。"
      - speaker: CHAR-003
        emotion: "捂嘴·小声"
        text: "成了！棠姐成了！"

  # ── SEG02 · 陈小满的第二本书（蓄力式·惊喜→自豪） ──
  - segment_id: SEG02
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP70-S03]
    narrative_function: "陈小满宣布签下第二本书的合约，从讨好式谦虚到被认可"
    rhythm: "蓄力式·惊喜→自豪"
    dialogue:
      - speaker: CHAR-003
        emotion: "紧张·双手捧合同"
        text: "那个……我也有个消息。"
      - speaker: CHAR-003
        emotion: "小声"
        text: "我签了……第二本。"
      - speaker: CHAR-001
        emotion: "惊喜"
        text: "小满！"
      - speaker: CHAR-003
        emotion: "低头·声音更小"
        text: "出版社说……第一本卖得还不错。"
      - speaker: CHAR-002
        emotion: "挑眉"
        text: "还不错？你上次跟我说'一般般'。"
      - speaker: CHAR-003
        emotion: "脸红"
        text: "我怕……说大了不好。"

  # ── SEG03 · 苏念真的合伙人（蓄力式·克制→释放） ──
  - segment_id: SEG03
    scene_id: SCENE-001
    duration_sec: 9
    shot_ids: [EP70-S04]
    narrative_function: "苏念真宣布正式成为共享空间运营合伙人，毒舌外表下的真心"
    rhythm: "蓄力式·克制→释放"
    dialogue:
      - speaker: CHAR-002
        emotion: "故作随意"
        text: "既然都在报喜……"
      - speaker: CHAR-002
        emotion: "推眼镜"
        text: "共享空间的运营合伙人。"
      - speaker: CHAR-002
        emotion: "轻描淡写"
        text: "八号楼一楼，下个月开始。合伙人不是白当的。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "苏念真，你也会藏着掖着了。"
      - speaker: CHAR-002
        emotion: "挑眉"
        text: "跟你学的。"

  # ── SEG04 · "留下来的理由"（独白递进·沉思→坚定） ──
  - segment_id: SEG04
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP70-S05, EP70-S06]
    narrative_function: "三人反思三十天的蜕变——各自找到了留下来的理由"
    rhythm: "独白递进·沉思→坚定"
    dialogue:
      - speaker: CHAR-001
        emotion: "望窗外·轻声"
        text: "三十天。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "我来的时候，只有一个行李箱和一场官司。"
      - speaker: CHAR-003
        emotion: "低声·坚定"
        text: "我也是。来的时候，觉得城市这么大，没有我的位置。"
      - speaker: CHAR-003
        emotion: "抬头·笑"
        text: "现在……好像找到了。"

  # ── SEG05 · 方屿的到来（碎片式·惊喜→温暖） ──
  - segment_id: SEG05
    scene_id: SCENE-001
    duration_sec: 8
    shot_ids: [EP70-S07]
    narrative_function: "三人从窗户看到方屿提着行李箱出现在楼下"
    rhythm: "碎片式·惊喜→温暖"
    dialogue:
      - speaker: CHAR-001
        emotion: "惊讶·轻声"
        text: "楼下……是方屿？"
      - speaker: CHAR-003
        emotion: "探头看"
        text: "他带了行李箱！"
      - speaker: CHAR-002
        emotion: "身体僵了一秒"
        text: "……他来干嘛。"

  # ── SEG06 · 方屿正式搬来（刺探式·试探→告白） ──
  - segment_id: SEG06
    scene_id: SCENE-002
    duration_sec: 10
    shot_ids: [EP70-S08, EP70-S09]
    narrative_function: "方屿正式搬来，用'你说了算'完成沉默型告白"
    rhythm: "刺探式·试探→告白"
    dialogue:
      - speaker: CHAR-002
        emotion: "平静·挑眉"
        text: "方屿。你这是……？"
      - speaker: CHAR-006
        emotion: "低声"
        text: "搬过来了。"
      - speaker: CHAR-002
        emotion: "追问"
        text: "搬过来……跟谁？"
      - speaker: CHAR-006
        emotion: "直视苏念真"
        text: "你说了算。"
      - speaker: CHAR-003
        emotion: "捂嘴·小声"
        text: "好甜。"

  # ── SEG07 · 碰杯庆祝（独白递进·温暖→满足） ──
  - segment_id: SEG07
    scene_id: SCENE-002
    duration_sec: 8
    shot_ids: [EP70-S10]
    narrative_function: "四人碰杯庆祝各自的里程碑——留下来的理由"
    rhythm: "独白递进·温暖→满足"
    dialogue:
      - speaker: CHAR-001
        emotion: "举杯·微笑"
        text: "面试过了。合伙人。第二本书。搬来了。"
      - speaker: CHAR-001
        emotion: "轻声"
        text: "三十天……我们都有了自己的答案。"
      - speaker: CHAR-003
        emotion: "举杯"
        text: "敬留下来的理由。"

  # ── SEG08 · 王叔到来（蓄力式·平静→沉重） ──
  - segment_id: SEG08
    scene_id: SCENE-002
    duration_sec: 9
    shot_ids: [EP70-S11, EP70-S12]
    narrative_function: "王叔带着旧盒子到来——上一任租客的故事浮出水面"
    rhythm: "蓄力式·平静→沉重"
    dialogue:
      - speaker: CHAR-007
        emotion: "温和"
        text: "打扰了。"
      - speaker: CHAR-007
        emotion: "看手里盒子"
        text: "有样东西，该给你们了。"
      - speaker: CHAR-001
        emotion: "好奇"
        text: "王叔，这是什么？"
      - speaker: CHAR-007
        emotion: "沉默片刻"
        text: "之前住这里的三个姑娘……留下的。"

  # ── SEG09 · 旧盒子（蓄力式·揭晓→悬疑·H-INF） ──
  - segment_id: SEG09
    scene_id: SCENE-002
    duration_sec: 10
    shot_ids: [EP70-S13, EP70-S14]
    narrative_function: "Cliffhanger — 王叔打开旧盒子，泛黄照片和旧信现身，递向三人"
    rhythm: "蓄力式·揭晓→悬疑"
    dialogue:
      - speaker: CHAR-007
        emotion: "缓慢"
        text: "她们也住了三十天。后来各自走了。"
      - speaker: CHAR-007
        emotion: "叹气"
        text: "这东西我替她们保管了三年。"
      - speaker: CHAR-007
        emotion: "温和·郑重"
        text: "你们应该看看。"
      - speaker: CHAR-001
        emotion: "低声"
        text: "……王叔。"
      - speaker: CHAR-007
        emotion: "转身·背对"
        text: "茶泡好了。想看就看。"

