# EP09 三人同盟 — segments.yaml
# 真相源：剧本/EP09/EP09_三人同盟.md
# 版本：v1.0

segments:

  # ── SEG01 · Hook Zone: 物业上门（蓄力式·日常→威胁） ──
  - segment_id: SEG01
    scene_id: SCENE-001
    duration_sec: 11
    shot_ids: [EP09-S01, EP09-S02]
    narrative_function: "Hook Zone — 物业经理上门，噪音投诉威胁通知房东"
    rhythm: "蓄力式·日常→威胁"
    dialogue:
      - speaker: CHAR-001
        emotion: "起身"
        text: "我来。"
      - speaker: CHAR-002
        emotion: "头也不抬"
        text: "别是那个前夫。"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "严肃"
        text: "202住户，这周收到四起噪音投诉。"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "敲投诉单"
        text: "再不解决，我只能通知房东了。"

  # ── SEG02 · 威胁升级（刺探式·威胁→逼迫） ──
  - segment_id: SEG02
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP09-S03, EP09-S04]
    narrative_function: "威胁升级 — 物业经理施压，苏念真气场顶回去"
    rhythm: "刺探式·威胁→逼迫"
    dialogue:
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "冷淡"
        text: "隔壁60岁老太太，楼下带孩子的——"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "强调"
        text: "你们三个合租，动静大了点吧？"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "威胁"
        text: "三天。三天没改善，我直接打报告。"
      - speaker: CHAR-002
        emotion: "平静·低声"
        text: "哦？什么报告？说来听听。"

  # ── SEG03 · 策略分工（独白递进·紧迫→团结） ──
  - segment_id: SEG03
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP09-S05, EP09-S06]
    narrative_function: "策略分工 — 三人决定分工：林晓棠谈判、苏念真查法规、陈小满安抚邻居"
    rhythm: "独白递进·紧迫→团结"
    dialogue:
      - speaker: CHAR-001
        emotion: "严肃"
        text: "通知房东，我们就得搬。"
      - speaker: CHAR-001
        emotion: "环视两人"
        text: "这次，我们得一起扛。"
      - speaker: CHAR-002
        emotion: "冷静"
        text: "我查法规，噪音投诉需要举证。"
      - speaker: CHAR-002
        emotion: "看向陈小满"
        text: "小满，你嘴甜，去跟邻居聊聊。"
      - speaker: CHAR-003
        emotion: "犹豫"
        text: "我……我去？"
      - speaker: CHAR-002
        emotion: "戴回眼镜"
        text: "你比我们加起来都好使。"

  # ── SEG04 · 法规依据（独白递进·搜寻→发现） ──
  - segment_id: SEG04
    scene_id: SCENE-003
    duration_sec: 10
    shot_ids: [EP09-S07, EP09-S08]
    narrative_function: "法规依据 — 苏念真在厨房查到物业无举证权，投诉单是废纸"
    rhythm: "独白递进·搜寻→发现"
    dialogue:
      - speaker: CHAR-002
        emotion: "自语·快速"
        text: "物业管理条例第三十二条……噪音投诉需提供分贝检测报告。"
      - speaker: CHAR-002
        emotion: "敲桌子"
        text: "没有检测仪数据，他们根本没有举证权。"
      - speaker: CHAR-002
        emotion: "冷笑"
        text: "物业吓唬人的。"
      - speaker: CHAR-002
        emotion: "自信"
        text: "没有分贝检测——投诉单就是废纸。"

  # ── SEG05 · 化解邻里（碎片式·紧张→融化） ──
  - segment_id: SEG05
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP09-S09, EP09-S10]
    narrative_function: "化解邻里 — 陈小满用真诚打动年长邻居，对方态度软化"
    rhythm: "碎片式·紧张→融化"
    dialogue:
      - speaker: "CHAR-GRP-PENDING-年长女邻居"
        emotion: "不满"
        text: "又是你们？半夜叮叮当当——"
      - speaker: CHAR-003
        emotion: "鞠躬"
        text: "阿姨对不起，是我们不好。"
      - speaker: CHAR-003
        emotion: "递水果"
        text: "这个……给您赔个不是。"
      - speaker: CHAR-003
        emotion: "低声"
        text: "阿姨，我……我们三个外地来的，日子不好过。"
      - speaker: CHAR-003
        emotion: "诚恳"
        text: "能不能……再给我们一次机会？"
      - speaker: "CHAR-GRP-PENDING-年长女邻居"
        emotion: "叹气·软化"
        text: "行了行了，水果拿回去。"
      - speaker: "CHAR-GRP-PENDING-年长女邻居"
        emotion: "摆手"
        text: "以后注意点。"

  # ── SEG06 · 三人对峙物业（权力翻转·逆转爆发） ──
  - segment_id: SEG06
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP09-S11, EP09-S12]
    narrative_function: "三人对峙物业 — 林晓棠谈判+苏念真亮法规，三人联手碾压"
    rhythm: "权力翻转·逆转爆发"
    dialogue:
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "不耐烦"
        text: "三天到了——"
      - speaker: CHAR-001
        emotion: "打断·平静"
        text: "张经理，聊聊？"
      - speaker: CHAR-002
        emotion: "冷淡·展示屏幕"
        text: "物业管理条例第三十二条。"
      - speaker: CHAR-002
        emotion: "推眼镜"
        text: "噪音投诉，需要分贝检测报告。"
      - speaker: CHAR-002
        emotion: "微笑"
        text: "张经理，你们测过了吗？"

  # ── SEG07 · 击退物业（蓄力式·逆转→释放） ──
  - segment_id: SEG07
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP09-S13, EP09-S14]
    narrative_function: "击退物业 — 物业经理被怼到哑口无言，尴尬撤退"
    rhythm: "蓄力式·逆转→释放"
    dialogue:
      - speaker: CHAR-001
        emotion: "冷静"
        text: "我们已经跟邻居沟通过了。"
      - speaker: CHAR-001
        emotion: "微笑·职业"
        text: "问题解决了。"
      - speaker: CHAR-003
        emotion: "举糕点·笑"
        text: "阿姨还给我们送了糕点呢！"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "尴尬"
        text: "这……"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "清嗓子"
        text: "那行吧，这次就算了。"
      - speaker: "CHAR-GRP-PENDING-物业经理"
        emotion: "转身"
        text: "以后注意点。"

  # ── SEG08 · 三人相视而笑（独白递进·释放→温暖） ──
  - segment_id: SEG08
    scene_id: SCENE-002
    duration_sec: 9
    shot_ids: [EP09-S15]
    narrative_function: "三人相视而笑 — 联手击退物业后的温暖释放，三人同盟的情感确认"
    rhythm: "独白递进·释放→温暖"
    dialogue:
      - speaker: CHAR-002
        emotion: "挑眉"
        text: "三个女人对付一个物业。"
      - speaker: CHAR-002
        emotion: "轻笑"
        text: "有意思。"
      - speaker: CHAR-003
        emotion: "笑"
        text: "念真姐，你好厉害。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "第一次……觉得不是一个人在扛。"

  # ── SEG09 · 王叔说漏嘴（蓄力式·温暖→悬疑·H-SUS） ──
  - segment_id: SEG09
    scene_id: SCENE-002
    duration_sec: 10
    shot_ids: [EP09-S16, EP09-S17]
    narrative_function: "Cliffhanger — 王叔修门锁时说漏嘴：上一任租客也是三个姑娘，后来出了事"
    rhythm: "蓄力式·温暖→悬疑"
    dialogue:
      - speaker: CHAR-007
        emotion: "温和"
        text: "门锁有点松了，我来修修。"
      - speaker: CHAR-001
        emotion: "起身"
        text: "王叔，您进来坐。"
      - speaker: CHAR-007
        emotion: "自语·平淡"
        text: "门锁这种东西，得经常看看。"
      - speaker: CHAR-007
        emotion: "叹气"
        text: "上一任租客也是三个姑娘……"
      - speaker: CHAR-007
        emotion: "突然停顿"
        text: "……后来出了事。"
      - speaker: CHAR-001
        emotion: "愣住"
        text: "……出了什么事？"
      - speaker: CHAR-007
        emotion: "慌忙"
        text: "没……没什么。年纪大了，说岔了。"

