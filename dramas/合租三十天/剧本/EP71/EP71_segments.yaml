segments:

  # ── SEG01 · Hook Zone: 打开旧盒子（蓄力式·郑重→好奇） ──
  - segment_id: SEG01
    scene_id: SCENE-001
    duration_sec: 11
    shot_ids: [EP71-S01, EP71-S02]
    narrative_function: "Hook Zone — 王叔示意三人打开旧盒子，揭开盒盖发现老照片和旧信"
    rhythm: "蓄力式·郑重→好奇"
    dialogue:
      - speaker: CHAR-007
        emotion: "温和·郑重"
        text: "你们应该看看里面。"
      - speaker: CHAR-001
        emotion: "低声"
        text: "王叔……"
      - speaker: CHAR-007
        emotion: "摆手"
        text: "先看。看完了再说。"
      - speaker: CHAR-002
        emotion: "低声"
        text: "等一下。照片下面……还有东西。"
      - speaker: CHAR-003
        emotion: "屏息"
        text: "是一封信。"

  # ── SEG02 · 发现老照片（独白递进·好奇→震撼） ──
  - segment_id: SEG02
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP71-S03, EP71-S04]
    narrative_function: "发现老照片——十年前也有三个女孩在这里住过三十天"
    rhythm: "独白递进·好奇→震撼"
    dialogue:
      - speaker: CHAR-003
        emotion: "轻声"
        text: "背面写着日期……十年前。"
      - speaker: CHAR-002
        emotion: "凑近看"
        text: "十年前。"
      - speaker: CHAR-001
        emotion: "低声·感慨"
        text: "这间公寓……十年前就有三个女孩住过。"
      - speaker: CHAR-003
        emotion: "小声"
        text: "和我们一样。"

  # ── SEG03 · 信的内容（旁白递进·沉静→感动） ──
  - segment_id: SEG03
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP71-S05, EP71-S06]
    narrative_function: "旁白朗读旧信内容——上一任三个女孩也在这里度过了人生最难的三十天"
    rhythm: "旁白递进·沉静→感动"
    dialogue:
      - speaker: CHAR-001
        emotion: "低声"
        text: "看看她们写了什么。"
      - speaker: CHAR-002
        emotion: "轻声"
        text: "信封上写着……'给下一批住进来的人'。"
      - speaker: NARRATOR
        emotion: "温柔·缓慢"
        text: "'我们三个人在这里住了三十天。这是我们人生最难的三十天。'"
      - speaker: NARRATOR
        emotion: "温柔·缓慢"
        text: "'但后来我们都找到了出路。一个成了母亲，一个找到了爱的人，一个学会了拒绝。'"

  # ── SEG04 · "比我们勇敢"（蓄力式·递进→高潮·情感核心） ──
  - segment_id: SEG04
    scene_id: SCENE-001
    duration_sec: 11
    shot_ids: [EP71-S07, EP71-S08]
    narrative_function: "情感高潮 — 陈小满念出信的最后一句，三人沉默后林晓棠点破传承的真相"
    rhythm: "蓄力式·递进→高潮"
    dialogue:
      - speaker: CHAR-003
        emotion: "声音发颤"
        text: "最后一句……"
      - speaker: CHAR-003
        emotion: "念"
        text: "'希望下一个三十天的人——比我们勇敢。'"
      - speaker: CHAR-001
        emotion: "低声"
        text: "我们不是第一批被困在这里的人。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "也不会是最后一批。"

  # ── SEG05 · 提议写回应（蓄力式·沉默→温暖） ──
  - segment_id: SEG05
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP71-S09, EP71-S10]
    narrative_function: "陈小满提议在信背面写下自己的话给下一批住进来的人"
    rhythm: "蓄力式·沉默→温暖"
    dialogue:
      - speaker: CHAR-003
        emotion: "擦眼泪·认真"
        text: "我想在背面写点什么。"
      - speaker: CHAR-002
        emotion: "挑眉·声音微哑"
        text: "写什么？"
      - speaker: CHAR-003
        emotion: "小声"
        text: "给下一批住进来的人。写我们来过。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "好。一起写。"
      - speaker: CHAR-002
        emotion: "轻声"
        text: "……行。"

  # ── SEG06 · 写下自己的话（独白递进·各自坚定→共鸣） ──
  - segment_id: SEG06
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP71-S11, EP71-S12]
    narrative_function: "三人在信背面写下各自的话——林晓棠写接受不完美，苏念真写不用戴面具，陈小满写终于说了不"
    rhythm: "独白递进·各自坚定→共鸣"
    dialogue:
      - speaker: CHAR-001
        emotion: "低声·边写边念"
        text: "我来的时候，以为自己什么都做不好。三十天以后——我学会了接受不完美的自己。"
      - speaker: CHAR-002
        emotion: "低声·边写"
        text: "我在这里，终于不用再戴面具。"
      - speaker: CHAR-003
        emotion: "低声·写"
        text: "我终于说了'不'。"
      - speaker: CHAR-003
        emotion: "抬头·笑"
        text: "希望你也可以。"

  # ── SEG07 · 放回盒子（蓄力式·完成→传承） ──
  - segment_id: SEG07
    scene_id: SCENE-001
    duration_sec: 10
    shot_ids: [EP71-S13, EP71-S14]
    narrative_function: "信和照片放回盒子，王叔提到新租客今天搬来——也是三个姑娘"
    rhythm: "蓄力式·完成→传承"
    dialogue:
      - speaker: CHAR-001
        emotion: "轻声"
        text: "放好了。"
      - speaker: CHAR-002
        emotion: "低声"
        text: "该交给下一批人了。"
      - speaker: CHAR-007
        emotion: "缓慢·微笑"
        text: "新租客今天搬进来。"
      - speaker: CHAR-007
        emotion: "平静"
        text: "也是三个姑娘。"
      - speaker: CHAR-003
        emotion: "低声·微笑"
        text: "又开始了。"

  # ── SEG08 · 新租客（碎片式·循环→微笑·H-EMO） ──
  - segment_id: SEG08
    scene_id: SCENE-011
    duration_sec: 9
    shot_ids: [EP71-S15, EP71-S16]
    narrative_function: "Cliffhanger — 三个新租客在走廊争吵卧室分配，林晓棠靠在门框微笑——又来三个了"
    rhythm: "碎片式·循环→微笑"
    dialogue:
      - speaker: "CHAR-GRP-18"
        emotion: "不满"
        text: "我要主卧！我先来的！"
      - speaker: "CHAR-GRP-19"
        emotion: "争"
        text: "凭什么？我也签了合同！"
      - speaker: "CHAR-GRP-20"
        emotion: "举手"
        text: "那个……要不我们先商量？"
      - speaker: CHAR-001
        emotion: "靠在门框·微笑"
        text: "又来三个了。"
      - speaker: CHAR-002
        emotion: "推眼镜·轻声"
        text: "三十天。够她们吵的。"
      - speaker: CHAR-003
        emotion: "低声·微笑"
        text: "这间公寓的三十天……又要开始了。"

