    晓棠在拨号，手指在屏幕上发抖。客厅里只有拨号的嘟嘟声和陈小满焦灼的呼吸。茶几上散着许辰事务所的方案。陈小满站在旁边，双手绞在身前。窗外传来楼下孩子的笑声，刺耳地形成对比。
  dialogue:
    - speaker: CHAR-001
      type: dialogue
      emotion: 急促
      content: "他不接……打了三个了。"
    - speaker: CHAR-003
      type: dialogue
      emotion: 低声
      content: "晓棠姐……"

- shot_id: EP26-S04
