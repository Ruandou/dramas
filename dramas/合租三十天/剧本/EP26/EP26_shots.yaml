- shot_id: EP26-S01
  scene: SCENE-001
  characters: [CHAR-001, CHAR-003]
  looks: [CHAR-001-L01, CHAR-003-L01]
  shot_size: MS
  duration_sec: 5
  mode: i2v_ref
  camera: 固定镜头
  visual_description: >-
    傍晚公寓客厅，窗外天色暗下来。陈小满举着手机外放，林晓棠站在旁边，手机攥在手里，浅蓝衬衫还没来得及换。手机扬声器里传出赵一鸣的声音。晓棠的手开始发抖。
  dialogue:
    - speaker: CHAR-004
      type: dialogue
      emotion: 温和
      content: "晓棠，豆豆想妈妈了。"
      source: phone
    - speaker: CHAR-004
      type: dialogue
      emotion: 温和
      content: "我就带她出来转转。"
      source: phone
    - speaker: CHAR-001
      type: dialogue
      emotion: 惊慌·低声
      content: "他把豆豆……"

- shot_id: EP26-S02
  scene: SCENE-001
  characters: [CHAR-001]
  looks: [CHAR-001-L01]
  shot_size: CU
  duration_sec: 6
  mode: i2v_ref
  camera: 缓推
  visual_description: >-
    晓棠的脸部特写。窗外最后一点暮光照在她半边脸上，另半边沉在阴影里。下巴绷紧，眼眶泛红，瞳孔里映着手机屏幕的光。她的嘴唇在发抖，但强迫自己深吸一口气。身后客厅的生活痕迹在虚焦里。
  dialogue:
    - speaker: CHAR-001
      type: monologue
      emotion: 内心·崩溃
      content: "赵一鸣把豆豆带走了。"
    - speaker: CHAR-001
      type: monologue
      emotion: 内心
      content: "这是他第一次直接动手。"
    - speaker: CHAR-001
      type: monologue
      emotion: 内心·颤抖
      content: "不能慌。不能让他看到我慌。"

- shot_id: EP26-S03
