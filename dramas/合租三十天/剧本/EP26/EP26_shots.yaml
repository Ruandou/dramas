  characters: [CHAR-002, CHAR-001]
  looks: [CHAR-002-L01, CHAR-001-L01]
  shot_size: MS
  duration_sec: 5
  mode: i2v_ref
  camera: 固定镜头
  visual_description: >-
    苏念真从厨房方向走出来，深灰卫衣袖子卷到肘部，黑框眼镜后面的目光平静。她扫了一眼客厅里两人的状态——晓棠的手在抖，陈小满的脸苍白——然后走到晓棠面前，声音不高但每个字都压住恐慌。
  dialogue:
    - speaker: CHAR-002
      type: dialogue
      emotion: 平静
      content: "冷静。发生了什么？"
    - speaker: CHAR-001
      type: dialogue
      emotion: 急
      content: "赵一鸣把豆豆接走了！不告诉我——"
    - speaker: CHAR-002
      type: dialogue
      emotion: 打断
      content: "现在慌没用。"

