  visual_description: >-
    下午公寓客厅，午后阳光从窗户斜照进来，在地板上切出暖金色的长条。林晓棠坐在沙发左侧，双手抱臂，两腿蜷起，浅蓝衬衫袖口挽了两道，头发比平时乱。苏念真坐在沙发另一端，深灰卫衣，黑框眼镜，手边放着笔记本，一条腿翘着，姿态是典型的分析师模式。
  dialogue:
    - speaker: CHAR-001
      type: dialogue
      emotion: 紧张·防备
      content: "他不是那种人。"
    - speaker: CHAR-002
      type: dialogue
      emotion: 冷静
      content: "哪种？"

