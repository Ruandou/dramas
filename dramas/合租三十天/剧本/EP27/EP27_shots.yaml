    同一构图，晓棠抱着靠枕，下巴绷紧。念真侧过身面对她，眼镜后面的目光不是审判——是分析。茶几上摊着赵一鸣的法律文件，被晓棠的手压着。窗外偶尔有鸟叫，衬得客厅更安静。
  dialogue:
    - speaker: CHAR-001
      type: dialogue
      emotion: 压低声
      content: "接豆豆那天……他只是想看孩子。"
    - speaker: CHAR-002
      type: dialogue
      emotion: 淡淡
      content: "那他提前告诉你了吗？"

