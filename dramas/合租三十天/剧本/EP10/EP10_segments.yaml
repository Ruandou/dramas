# EP10 家长会 — segments.yaml
# 真相源：剧本/EP10/EP10_家长会.md
# 版本：v1.0

segments:

  # ── SEG01 · Hook Zone: 初遇（碎片式·好奇→靠近） ──
  - segment_id: SEG01
    scene_id: "SCENE-011"
    duration_sec: 7
    shot_ids: [EP10-S01, EP10-S02]
    narrative_function: "Hook Zone — 家长会上，豆豆拉着妈妈遇到许辰父子"
    rhythm: "碎片式·好奇→靠近"
    dialogue:
      - speaker: CHAR-009
        emotion: "兴奋"
        text: "妈妈看！那个男生有恐龙书包！"
      - speaker: CHAR-009
        emotion: "拉手"
        text: "我们去看！"
      - speaker: CHAR-009
        emotion: "开心"
        text: "你这个剑龙画得好！"
      - speaker: CHAR-005
        emotion: "微笑·看过来"
        text: "……小朋友很自来熟啊。"

  # ── SEG02 · 第一句对话（刺探式·试探→敞开） ──
  - segment_id: SEG02
    scene_id: "SCENE-011"
    duration_sec: 9
    shot_ids: [EP10-S03, EP10-S04]
    narrative_function: "晓棠与许辰第一次交谈，得知他是单亲爸爸"
    rhythm: "刺探式·试探→敞开"
    dialogue:
      - speaker: CHAR-001
        emotion: "礼貌"
        text: "你家小朋友……叫什么？"
      - speaker: CHAR-005
        emotion: "温和"
        text: "小宇。他平时不太跟人说话。"
      - speaker: CHAR-005
        emotion: "温和"
        text: "小宇跟我，一个人带大的。"
      - speaker: CHAR-005
        emotion: "微笑"
        text: "建筑师，自己画图。"

  # ── SEG03 · 公园对话（独白递进·温暖→共鸣） ──
  - segment_id: SEG03
    scene_id: SCENE-009
    duration_sec: 9
    shot_ids: [EP10-S05, EP10-S06]
    narrative_function: "公园长椅，两人聊孩子和生活，许辰注意到晓棠的疲惫"
    rhythm: "独白递进·温暖→共鸣"
    dialogue:
      - speaker: CHAR-005
        emotion: "看着远处"
        text: "小宇平时很慢热。"
      - speaker: CHAR-005
        emotion: "轻声"
        text: "豆豆一拉他就跟着跑了。"
      - speaker: CHAR-001
        emotion: "微笑"
        text: "豆豆也一样……人来疯。"
      - speaker: CHAR-005
        emotion: "认真"
        text: "豆豆在家……也这么活泼？"
      - speaker: CHAR-001
        emotion: "愣·低头"
        text: "……是。我很忙，但她从来不抱怨。"
      - speaker: CHAR-005
        emotion: "温和"
        text: "那说明你做得很好。"

  # ── SEG04 · 被看见（蓄力式·温暖→触动·SAT-WARM） ──
  - segment_id: SEG04
    scene_id: SCENE-009
    duration_sec: 10
    shot_ids: [EP10-S07, EP10-S08]
    narrative_function: "许辰说出全剧第一句让晓棠被看见的话，感情线萌芽"
    rhythm: "蓄力式·温暖→触动"
    dialogue:
      - speaker: CHAR-005
        emotion: "温和"
        text: "豆豆这个年纪，愿意主动交朋友——"
      - speaker: CHAR-005
        emotion: "认真"
        text: "说明她在家很安心。"
      - speaker: CHAR-005
        emotion: "平静"
        text: "你看起来很累，但很用心。"
      - speaker: CHAR-001
        emotion: "愣住·轻声"
        text: "……很久没人说这句话了。"

  # ── SEG05 · 神秘信封（碎片式·日常→悬念） ──
  - segment_id: SEG05
    scene_id: SCENE-001
    duration_sec: 8
    shot_ids: [EP10-S09, EP10-S10]
    narrative_function: "苏念真收到匿名信封，拆开发现合同和便签"
    rhythm: "碎片式·日常→悬念"
    dialogue:
      - speaker: CHAR-002
        emotion: "低声"
        text: "没有署名。没有寄件地址。"
      - speaker: CHAR-002
        emotion: "读出·低声"
        text: "想清楚了联系我。"

  # ── SEG06 · 合同与便签（蓄力式·审视→警觉） ──
  - segment_id: SEG06
    scene_id: SCENE-001
    duration_sec: 9
    shot_ids: [EP10-S11, EP10-S12]
    narrative_function: "苏念真翻看合同，决定先不告诉室友"
    rhythm: "蓄力式·审视→警觉"
    dialogue:
      - speaker: CHAR-002
        emotion: "自语"
        text: "和解协议……谁跟谁和解？"
      - speaker: CHAR-002
        emotion: "冷笑"
        text: "有意思。"

  # ── SEG07 · 心情不错（独白递进·温暖→轻松） ──
  - segment_id: SEG07
    scene_id: SCENE-002
    duration_sec: 9
    shot_ids: [EP10-S13, EP10-S14]
    narrative_function: "夜晚，晓棠向念真分享遇到许辰的事"
    rhythm: "独白递进·温暖→轻松"
    dialogue:
      - speaker: CHAR-001
        emotion: "微笑"
        text: "今天家长会，遇到一个人。"
      - speaker: CHAR-001
        emotion: "温和"
        text: "做建筑设计的。也是单亲爸爸。"
      - speaker: CHAR-002
        emotion: "挑眉"
        text: "单亲爸爸？"
      - speaker: CHAR-001
        emotion: "点头"
        text: "他跟儿子说话的方式……不一样。"

  # ── SEG08 · 别入戏太快（权力翻转·温暖→冷静） ──
  - segment_id: SEG08
    scene_id: SCENE-002
    duration_sec: 10
    shot_ids: [EP10-S15, EP10-S16]
    narrative_function: "念真用分析式口吻提醒晓棠，同时暗中担心自己的信封"
    rhythm: "权力翻转·温暖→冷静"
    dialogue:
      - speaker: CHAR-001
        emotion: "平静"
        text: "他说我看起来很累，但很用心。"
      - speaker: CHAR-002
        emotion: "停顿"
        text: "……单亲妈妈遇到建筑师。"
      - speaker: CHAR-002
        emotion: "认真"
        text: "慢热的儿子和社恐的女儿玩到一起。"
      - speaker: CHAR-002
        emotion: "平静"
        text: "这种剧情，别入戏太快。"
      - speaker: CHAR-001
        emotion: "合上电脑"
        text: "我没入戏。就是今天心情不错。"
      - speaker: CHAR-002
        emotion: "压低声"
        text: "人好不代表没目的。"

  # ── SEG09 · 深夜独坐（蓄力式·平静→不安·H-INF） ──
  - segment_id: SEG09
    scene_id: SCENE-002
    duration_sec: 11
    shot_ids: [EP10-S17, EP10-S18]
    narrative_function: "深夜，苏念真独自打开合同，发现要求交出'研究数据'——有人知道了她的秘密"
    rhythm: "蓄力式·平静→不安"
    dialogue:
      - speaker: CHAR-002
        emotion: "读出·低声"
        text: "甲方要求乙方……移交全部研究数据……"
      - speaker: CHAR-002
        emotion: "读出·声颤"
        text: "……及相关原始材料。"
      - speaker: CHAR-002
        emotion: "压低声·颤"
        text: "我谁都没告诉。"
