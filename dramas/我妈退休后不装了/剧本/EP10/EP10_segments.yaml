        CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（压着情绪）【图2】张蕾 CHAR-005-L01（电话那头）【图3】林家客厅 SCENE-001。近景 固定镜头：慧兰试图让女儿理解但张蕾只看到家庭将瓦解。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-005-L01, role: reference_image, label: 图2}, {file: SCENE-001, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-005, line: "你跟爸各退一步不行吗？"}
      - {speaker: CHAR-001, line: "我退了四十年了。你让我退到哪里去？"}
      - {speaker: CHAR-005, line: "为了这个家——"}
      - {speaker: CHAR-001, line: "这个家以前也没人在乎过我。你们在乎的都是'家里有个妈'。"}
  - <<: *s
    segment_id: EP10-SEG04
    shot_ids: [EP10-S04]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（挂掉电话，把手机扣桌上）【图2】林家客厅 SCENE-001。近景 固定镜头：更多来电提醒弹出来。她把手机翻扣桌上。世界安静了但她忽然很想哭。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）为什么每个人都觉得我该忍…"}
      - {speaker: CHAR-001, line: "（内心）我明明已经忍了四十年了。"}
      - {speaker: CHAR-001, line: "（内心）在他们眼里，我就是一个'妈'，不是一个'人'。"}
  - <<: *s
    segment_id: EP10-SEG05
    shot_ids: [EP10-S05]
    speakers: []
    api:
      text: "【图1】林慧兰 CHAR-001-L01（坐在黑暗客厅里捂嘴无声哭泣）【图2】林家客厅 SCENE-001（夜间昏暗）。特写 固定镜头：深夜慧兰独自坐在黑暗客厅里终于哭了——压抑的从胸腔深处涌出来的哭声。她捂住嘴。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue: []
  - <<: *s
