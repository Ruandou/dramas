      text: "【图1】王翠花 CHAR-007-L01（压低声音）【图2】林慧兰 CHAR-001-L01（一愣苦笑）【图3】林家客厅 SCENE-001。近景 固定镜头：翠花压低声音说了银行的事。慧兰听完第一反应不是愤怒是悲哀。"
