    api:
      text: "【图1】林慧兰 CHAR-001-L01（在卫生间洗脸，看镜子）【图2】林家客厅 SCENE-001。近景 固定镜头：慧兰哭了很久。站起来去卫生间洗脸。看着镜子里眼睛红肿但目光平静的自己——点了下头。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）哭完了。该干嘛干嘛。"}
      - {speaker: CHAR-001, line: "（内心）这条路是你自己选的。不能回头。"}
  - <<: *s
    segment_id: EP10-SEG07
    shot_ids: [EP10-S07]
