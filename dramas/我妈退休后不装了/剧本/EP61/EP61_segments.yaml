  - {speaker: CHAR-006, line: 所以我也想给你一个家。不是让你回家做饭的那种家——是两个人互相支持的家。}
- segment_id: EP61-SEG04; shot_ids: [EP61-S04]; duration_sec: 10; scene_id: SCENE-010; scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png; look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}
