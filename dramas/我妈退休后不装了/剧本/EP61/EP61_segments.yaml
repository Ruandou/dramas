  - {speaker: CHAR-006, line: 那我等你。等你哪天不怕了——或者你永远不想结婚也没关系。我就这样陪着你也挺好的。}
- segment_id: EP61-SEG06; shot_ids: [EP61-S06]; duration_sec: 10; scene_id: SCENE-010; scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png; look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}
