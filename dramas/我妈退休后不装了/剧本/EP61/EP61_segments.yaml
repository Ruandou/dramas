  - {speaker: CHAR-001, line: 你让我再进一个家——我害怕。不是怕你不好——是怕我自己又回到原来的样子。}
  - {speaker: CHAR-001, line: 我现在好不容易——学会了为自己活。}
- segment_id: EP61-SEG05; shot_ids: [EP61-S05]; duration_sec: 10; scene_id: SCENE-010; scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png; look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}
