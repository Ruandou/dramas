    api:
      text: "【图1】林家客厅 SCENE-001（清晨，慧芳坐沙发上揪着衣角，面前半碗粥）【图2】林慧兰 CHAR-001-L01（正在收拾碗筷）【图3】林慧芳 CHAR-010-L01（听到砸门声吓得一抖，脸色刷白）。中景→近景：安静清晨突然被急促砸门声打破。慧芳吓到发抖。慧兰放下碗镇定起身。"
      content_roles: [{file: SCENE-001, role: reference_image, label: 图1}, {file: CHAR-001-L01, role: reference_image, label: 图2}, {file: CHAR-010-L01, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: EXTRA, line: "开门！"}
      - {speaker: CHAR-010, line: "是他…他怎么找到这里的…"}
      - {speaker: CHAR-001, line: "你别出声。姐去开门。"}
      - {speaker: CHAR-010, line: "姐，不要开…他会打人的…"}
      - {speaker: CHAR-001, line: "有我在。他不敢。"}

  - <<: *seg1
    segment_id: EP14-SEG02
    shot_ids: [EP14-S02]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（站在门口拉开门，表情镇定）【图2】林家客厅 SCENE-001门口玄关（门打开后外面站着一个50多岁粗犷男人，工装夹克，满脸横肉，一身酒气，表情嚣张）。中景 门框构图：慧兰开门与门外男人形成对峙——门框内慧兰占半边。男人想往里闯。紧张对峙感。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: EXTRA, line: "我找我老婆。让她出来。"}
      - {speaker: CHAR-001, line: "她不在。你走吧。"}
      - {speaker: EXTRA, line: "不在？我看着她进去的。让开！"}
      - {speaker: CHAR-001, line: "我说了，她不在。你再敲我家门，我报警。"}

  - <<: *seg1
    segment_id: EP14-SEG03
    shot_ids: [EP14-S03]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（扶着门框，眼神直视对方，一字一句，气势不输）【图2】林家客厅 SCENE-001门口玄关。近景 固定镜头：男人伸手要推慧兰。慧兰没动——扶住门框稳住。她盯着对方的眼睛说'你碰我一下试试'。那个眼神让男人的手停在空中。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: EXTRA, line: "你让不让——"}
      - {speaker: CHAR-001, line: "你碰我一下试试。"}
      - {speaker: EXTRA, line: "你——"}
      - {speaker: CHAR-001, line: "我家有监控。你碰我一下，就是入室滋事，够你进去蹲几天。"}

  - <<: *seg1
    segment_id: EP14-SEG04
    shot_ids: [EP14-S04]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（挡在门口，冷静回应男人的每一个借口）【图2】林家客厅 SCENE-001门口玄关。中景 固定镜头：男人被噎住改换策略朝屋里喊慧芳名字。慧兰不为所动替他一一回答。男人的假可怜被慧兰冷静拆穿。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
