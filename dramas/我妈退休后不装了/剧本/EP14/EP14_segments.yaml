      - {speaker: EXTRA, line: "林慧芳！你出来！你不回家孩子咋办？"}
      - {speaker: CHAR-001, line: "孩子二十多岁了。他自己会做饭。"}
      - {speaker: EXTRA, line: "咱们结婚二十多年，你就这么狠心？"}
      - {speaker: CHAR-001, line: "结婚二十多年，你打了她二十多年。你说她狠心？"}

  - <<: *seg1
    segment_id: EP14-SEG05
    shot_ids: [EP14-S05]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（站在门口，表情从平静变成看穿一切的笑）【图2】林家客厅 SCENE-001门口玄关。近景 固定镜头：男人恼羞成怒提高声音。慧兰淡淡一笑——那种看穿一切的笑。她的话隔着门让屋里的慧芳听到了——慧芳咬着嘴唇不让自己哭出声。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: EXTRA, line: "我跟我老婆的事，轮不到你一个外人管！"}
      - {speaker: CHAR-001, line: "外人？她是我妹妹。你打她的时候，你找别的女人的时候，怎么不说她是'你老婆'？"}
      - {speaker: EXTRA, line: "你——你懂什么！你一个被老公甩了的女人——"}

  - <<: *seg1
    segment_id: EP14-SEG06
    shot_ids: [EP14-S06]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（沉默两秒——被戳到痛处但迅速恢复平静，拿出手机悬停在拨号键上）【图2】林家客厅 SCENE-001门口玄关。特写→近景：那把刀还是扎到了肉——慧兰表情变了一瞬。但她只沉默两秒就恢复平静。她举起手机，手指悬在110拨号键上。动作不急不缓但威慑力十足。"
