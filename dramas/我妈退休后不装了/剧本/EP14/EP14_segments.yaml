    dialogue:
      - {speaker: CHAR-001, line: "你说对了。我是被老公甩了。"}
      - {speaker: CHAR-001, line: "但我懂法律。你再多说一句，我打110。"}
      - {speaker: EXTRA, line: "你——你敢！"}
      - {speaker: CHAR-001, line: "你试试我敢不敢。"}

  - <<: *seg1
    segment_id: EP14-SEG07
    shot_ids: [EP14-S07]
    speakers: [CHAR-001]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（站姿不变，手机举着，眼神坚定）【图2】林家客厅 SCENE-001门口玄关。中景→特写：两人对峙五秒。楼道安静得能听到时钟嘀嗒声。男人的眼神从凶狠变成犹豫——他以为女人都怕事但眼前这个女人是真的会报警。他退了半步。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: EXTRA, line: "好。你狠。"}
      - {speaker: CHAR-001, line: "走之前我告诉你一句话——你敢再来，我不仅报警，我还帮你老婆起诉离婚、申请保护令。我说到做到。"}
      - {speaker: EXTRA, line: "你——你一个离婚女人——"}
      - {speaker: CHAR-001, line: "你再说一句？"}

  - <<: *seg1
    segment_id: EP14-SEG08
    shot_ids: [EP14-S08]
    speakers: [CHAR-001, CHAR-010]
    api:
      text: "【图1】林慧兰 CHAR-001-L01（关上门背靠着门缓缓吐气，手在发抖但她克制着不表现出来）【图2】林慧芳 CHAR-010-L01（从屋里冲出来一把抱住姐姐，哭着）【图3】林家客厅 SCENE-001门口玄关。中景→近景：男人铁青着脸转身下楼，楼梯间传来狠狠踹墙声。慧兰等了三秒确认走远才关上门。靠着门吐气——手还在发抖。慧芳冲出来抱住她。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-010-L01, role: reference_image, label: 图2}, {file: SCENE-001, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-010, line: "姐！"}
      - {speaker: CHAR-001, line: "没事。他走了。"}
      - {speaker: CHAR-010, line: "你刚才…你太厉害了…他从来没那么怕过一个人。"}
      - {speaker: CHAR-001, line: "怕他就输了。你记住——你越怕他越欺负你。"}

  - <<: *seg1
    segment_id: EP14-SEG09
    shot_ids: [EP14-S09]
