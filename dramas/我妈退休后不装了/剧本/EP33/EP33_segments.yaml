    scene_urls: {SCENE-004: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-004}
  api:
    text: 张蕾转身打开水龙头假装洗手但鼻子已经塞了。慧兰看到了没戳穿她，走回灶台掀开锅盖看咕嘟咕嘟的水。厨房里很安静但不尴尬。张蕾关掉水龙头哑着嗓子叫了一声妈。
    content_roles:
    - {file: SCENE-004, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-005, line: 妈——}
  - {speaker: CHAR-001, line: 嗯？}
- segment_id: EP33-SEG05
  shot_ids: [EP33-S05]
  duration_sec: 10
  speakers: [CHAR-005, CHAR-001]
  refs: {scene_id: SCENE-004, look_ids: [CHAR-005-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-004: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-004}
  api:
    text: 张蕾深吸一口气转过身说出藏在心里的话——以前觉得妈妈让她忍是不懂她，现在才知道妈妈不是让她忍，是除了忍没有别的办法。慧兰背对着女儿手顿了一下——蕾蕾，你比你妈强。
    content_roles:
    - {file: SCENE-004, role: reference_image, label: 图1}
    - {file: CHAR-005-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-005, line: 妈——我以前一直觉得你不懂我。}
  - {speaker: CHAR-005, line: 你每次说「家和万事兴」让我忍——我心里想，你不懂我的处境。}
  - {speaker: CHAR-005, line: 现在我才知道——你不是让我忍。你是……除了忍没有别的办法。}
  - {speaker: CHAR-001, line: 蕾蕾……你比你妈强。你至少——敢说出来。}
- segment_id: EP33-SEG06
  shot_ids: [EP33-S06]
  duration_sec: 10
  speakers: [CHAR-001, CHAR-005]
  refs: {scene_id: SCENE-004, look_ids: [CHAR-001-L01, CHAR-005-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01}
    scene_urls: {SCENE-004: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-004}
  api:
    text: 慧兰转过身靠在灶台上笑了——她以前最怕女儿将来过得跟自己一样。现在不怕了，因为女儿跟自己不一样，比她勇敢也比她会保护自己。张蕾流着泪但笑了。
    content_roles:
    - {file: SCENE-004, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-005-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 我以前最怕的就是——我的女儿将来过得跟我一样。}
  - {speaker: CHAR-005, line: 妈……}
  - {speaker: CHAR-001, line: 但现在我不怕了——你跟我，不一样。}
  - {speaker: CHAR-001, line: 你比我勇敢。也比我会保护自己。妈放心了。}
- segment_id: EP33-SEG07
  shot_ids: [EP33-S07]
  duration_sec: 10
  speakers: [CHAR-005, CHAR-001]
  refs: {scene_id: SCENE-004, look_ids: [CHAR-005-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-004: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-004}
  api:
    text: 张蕾走过去抱住了妈妈。锅里的水还在咕嘟咕嘟开着但这一刻什么都不重要了。张蕾在妈妈耳边说——不管官司打成什么样我都支持你。这是我欠你的。慧兰抱着女儿手紧了紧。
    content_roles:
    - {file: SCENE-004, role: reference_image, label: 图1}
    - {file: CHAR-005-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-005, line: 妈——不管你跟爸的官司打成什么样——不管你以后想做什么——我都支持你。}
  - {speaker: CHAR-005, line: 这是……我欠你的。}
- segment_id: EP33-SEG08
  shot_ids: [EP33-S08]
  duration_sec: 10
  speakers: [CHAR-001, CHAR-005]
  refs: {scene_id: SCENE-004, look_ids: [CHAR-001-L01, CHAR-005-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01}
    scene_urls: {SCENE-004: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-004}
  api:
    text: 母女俩松开。慧兰擦了擦眼角转身开锅盖发现水快烧干了。张蕾破涕为笑说还不是你害的。母女俩手忙脚乱地加水切菜炒菜——厨房里恢复了烟火气。
    content_roles:
    - {file: SCENE-004, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-005-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 哎呀水都烧干了！}
  - {speaker: CHAR-005, line: 还不是你害的。}
  - {speaker: CHAR-001, line: 怎么是我害的——是你抱着我不撒手。}
  - {speaker: CHAR-005, line: 行了行了，我的错——我来炒。}
