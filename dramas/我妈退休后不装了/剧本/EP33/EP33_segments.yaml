# SOURCE FIDELITY: EP33_剧本.md -> 9 shots 1:1 | 90s | ALL PASS
episode_id: EP33
defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: '9:16'
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: 竖向构图 9:16，温暖真实的生活质感，柔和的家庭光线，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格
  negative_prompt: 文字内容，模糊，低质量，扭曲的面部，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒
voice_prompts:
  CHAR-001: 温和沉稳的中年女声；从洗米时察觉女儿情绪的敏锐（"你今天怎么了"），到鼓励女儿时的温柔坚定（"你比你想象的要强得多"），到说出"我以前最怕女儿跟我一样"时的释然和放心——声音中带着为母的骄傲和欣慰
  CHAR-005: 干净利落的职业女性声音；从切菜时闷闷不乐，到倾诉职场委屈，到眼眶红了叫"妈"的哽咽，到抱住妈妈说"不管官司打成什么样我都支持你"的坚定——声音从憋屈到释放再到温暖
