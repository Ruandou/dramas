        【图1】CHAR-002-L01【图2】CHAR-003-L01【图3】SCENE-003。固定镜头：深夜。张明收拾完碗筷出来——厨房里水龙头还在滴水。他走到客厅——看到张大强坐在沙发上。客厅只亮着一盏落地灯——暖黄的光圈照着沙发的角落。张大强戴着老花镜——镜框滑到了鼻子尖。手里拿着一支圆珠笔和一本旧笔记本——封皮已经磨毛了边。他在上面写着什么。张明走近一看——他在记菜谱。糖醋排骨、红烧肉、清蒸鱼……全是林慧兰以前做过的菜。字写得歪歪扭扭的——有些字太大挤出了格子，有些字太小缩在角落里。但很认真—
      content_roles:
        - { file: CHAR-002-L01, role: reference_image, label: 图1 }
        - { file: CHAR-003-L01, role: reference_image, label: 图2 }
