  - {speaker: CHAR-003, line: 爸——你在写什么？}
  - {speaker: CHAR-002, line: 菜谱。你妈以前做过的那些——我凭记忆记下来。}
  - {speaker: CHAR-003, line: 糖醋排骨、红烧肉、清蒸鱼……你记得挺全的。}
  - {speaker: CHAR-002, line: 吃了四十年——总该记住几样。}
  - {speaker: CHAR-003, line: 爸——明天我去给你买本正经菜谱。}
  - {speaker: CHAR-002, line: 不用。你妈做的——我心里有数。}
