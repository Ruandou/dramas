  CHAR-006: "老年男声，音色温和偏低沉，语速不紧不慢，语气礼貌斯文带书卷气；说话时节奏稳定有分寸感，给人温和可靠的感觉"
  CHAR-007: "中年女声，音色偏亮偏厚，嗓门大语气直爽，带市井烟火气，语速中等偏快，笑声爽朗有感染力"
  CHAR-002: "老年男声，低沉粗犷，语速偏慢，语气带命令式和不耐烦；激动时声音发紧有压迫感"

