  dialogue:
  - {speaker: CHAR-001, line: 这一页——怀张明的时候。张大强说想吃酸菜鱼，我去菜市场走了一个小时。}
  - {speaker: CHAR-001, line: 这一页——张明上小学。我每天五点半起来做饭。}
  - {speaker: CHAR-001, line: 这一页……张蕾出生那天。张大强在医院说——「又是女儿」。}
  - {speaker: CHAR-010, line: 姐——}
  - {speaker: CHAR-010, line: 你的日记里，怎么全是别人？你自己呢？}
