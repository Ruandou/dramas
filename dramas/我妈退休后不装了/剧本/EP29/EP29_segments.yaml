    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 这里记的是……当年省里舞蹈进修的事。}
  - {speaker: CHAR-010, line: 你去成了吗？}
  - {speaker: CHAR-001, line: 没去。张大强说——女人结了婚，要以家庭为重。}
  - {speaker: CHAR-010, line: 你就没坚持？}
  - {speaker: CHAR-001, line: 坚持了。但他说——你一个有老公的人，跑出去跳什么舞。然后我就……把名额让了。}
  - {speaker: CHAR-001, line: 一次机会，一辈子就没了。}
