    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧兰从日记夹层抽出一张泛黄照片——二十二岁的她穿着舞蹈练功服，笑容灿烂得发光。慧芳惊讶说姐你以前这么好看笑容完全不一样。慧兰苦笑说那时候多傻以为结婚就是一辈子幸福——把照片放回去说后来就不傻了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 你看——这是我二十二岁，在舞蹈学校当老师的时候。}
  - {speaker: CHAR-010, line: 姐……你以前这么好看。这笑容，跟现在完全不一样。}
  - {speaker: CHAR-001, line: 那时候多傻。以为结婚就是一辈子幸福。}
  - {speaker: CHAR-010, line: 姐……}
  - {speaker: CHAR-001, line: 后来——就不傻了。}
