    text: 深夜·林家客厅。只亮了一盏台灯，光线昏黄柔和。慧兰抱着旧日记本坐在沙发上发呆。慧芳从卧室出来倒水，看到姐姐还没睡，端了两杯水走过来轻声问怎么还不睡。慧兰说睡不着，翻翻旧东西。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-010, line: 姐，还不睡？明天要开庭了。}
  - {speaker: CHAR-001, line: 睡不着。翻翻旧东西。}
  - {speaker: CHAR-010, line: 那是什么？}
  - {speaker: CHAR-001, line: 我年轻时候的日记本。}
  - {speaker: CHAR-010, line: 你结婚这么多年……还留着呢？}
  - {speaker: CHAR-001, line: 一直带在身边。搬了几次家都没舍得丢。}
