  CHAR-010: 沙哑疲倦的中年女声；此时带着关切和心疼（"姐，还不睡？"），被姐姐的故事感动到哽咽（"姐……"），最后看到姐姐写"第二次人生"时的欣慰和敬佩（"你的背影……从来没这么直过"）
