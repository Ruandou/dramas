  api:
    text: 慧兰翻开日记第一页，泛黄纸页上是她二十出头时工整有力的字迹——写给十年后的自己的信。她轻声读出来声音有些抖。慧芳凑过去看说姐你年轻时字真好看。慧兰苦笑说现在老了连笔都拿不动了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 「十年后的慧兰，你还好吗？你还在跳舞吗？你嫁给那个他了吗？」}
  - {speaker: CHAR-010, line: 姐，你年轻时字真好看。}
  - {speaker: CHAR-001, line: 年轻时候……字多有力。你看现在，老了连笔都拿不动了。}
  - {speaker: CHAR-010, line: 这照片是你？}
  - {speaker: CHAR-001, line: 嗯。二十二岁的时候。}
