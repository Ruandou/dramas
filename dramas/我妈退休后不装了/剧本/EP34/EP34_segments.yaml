voice_prompts:
  CHAR-001: 温和沉稳的中年女声；从拆信时的手抖紧张（"我自己看"），到看判决书时颤抖着说"判了"的激动，到抱着妹妹哭喊"四十年法律认了"的如释重负，到平静地说"四十年终于可以放下了"的释然——声音经历完整的情感释放弧线
  CHAR-010: 沙哑疲倦的中年女声；从紧张地问"我帮你看"，到听到好消息尖叫"真的！！"，到又哭又笑说"姐你做到了"——声音里是见证亲人胜利的喜悦
  CHAR-002: 低沉粗哑的中老年男声；从气急败坏砸东西骂人（"凭什么给她补偿"），到被儿子怼得哑口无言（"你——"），到最后低声问"她真的不回来了"的失落——声音从爆裂到低沉
  CHAR-003: 普通的年轻男声；从沉默沉默到站起来讲道理（"请保姆四十年要多少钱"），声音不大但每个字都有分量——这是张明成长的声音
