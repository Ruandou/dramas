  dialogue:
  - {speaker: CHAR-003, line: 爸。妈做了四十年饭——请保姆四十年要多少钱？}
  - {speaker: CHAR-003, line: 妈带了两个孩子长大——请家教要多少钱？}
  - {speaker: CHAR-003, line: 妈照顾爷爷奶奶到终老——请护工要多少钱？}
  - {speaker: CHAR-003, line: 妈这些年——一分钱工资没拿过。}
