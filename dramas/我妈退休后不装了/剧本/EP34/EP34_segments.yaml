  - {speaker: CHAR-002, line: 凭什么！凭什么给她经济补偿！}
  - {speaker: CHAR-002, line: 我挣的钱，凭什么分她一半！}
  - {speaker: CHAR-002, line: 你妈她这些年——她做过什么？不就是在家做做饭带带孩子吗？这就值十几万？}
