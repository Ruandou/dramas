  api:
    text: 张明终于开口了——他平静地问他爸：妈做了四十年饭，请保姆四十年要多少钱？妈带了两个孩子长大，请家教多少钱？妈照顾爷爷奶奶到终老，请护工多少钱？妈这些年一分钱工资没拿过。张大强愣住了。
