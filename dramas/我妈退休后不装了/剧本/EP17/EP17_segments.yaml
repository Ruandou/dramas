  CHAR-006: 温和稳重的老年男声，语速偏慢，带书卷气，普通话标准；对慧兰说话时带着欣赏和尊重
  CHAR-007: 爽朗明快的中年女声，语速快，操着北方口音，风风火火；着急时音调高，被慧兰淡定回应后语气由急转安
