  CHAR-007: 爽朗明快的中年女声，语速快嗓门大，北方口音；说服慧兰时热情洋溢，慧兰成功后比她本人还兴奋
  CHAR-006: 温和稳重的老年男声，简洁有力；说跳得真好时语气真诚
  EXTRA: 标准的普通话播报声，比赛主持人的公事公办语气
