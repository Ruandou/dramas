    dialogue:
      - speaker: CHAR-007
        line: "我觉得……可能就不是了。投资是要占股份的——你拿了人家的钱，人家就要说话。"
      - speaker: CHAR-001
        line: "所以我得想想。我不想好不容易有了自己的东西——最后又变成别人的。"
