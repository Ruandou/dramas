  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L02, CHAR-010-L01, CHAR-GRP-002-L01]}
  assets:
    look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01.png, CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 林家客厅。慧兰和慧芳在择菜——门铃响了。慧兰开门看到二姨和三姑站在门口。她们一进门就东张西望——嘴上说着来看看你，眼神里全是好奇和不赞同。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-010-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 慧兰啊！我们来看看你！你说你这孩子——怎么也不跟家里说一声！}
  - {speaker: CHAR-001, line: 二姨、三姑——你们怎么来了？}
- segment_id: EP40-SEG02
  shot_ids: [EP40-S02]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 二姨和三姑坐下就开始数落——全村都知道了你离婚的事。慧兰倒茶没接话。慧芳忍不住说是我姐夫出轨。二姨摆摆手说男人嘛谁不犯点错忍忍就过去了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-010-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 全村都知道了！你一个六十岁的老太太——离什么婚？丢人不丢人？}
  - {speaker: CHAR-010, line: 二姨，是我姐夫出轨——}
  - {speaker: CHAR-GRP-002, line: 男人嘛！谁不犯点错？忍忍就过去了！}
- segment_id: EP40-SEG03
  shot_ids: [EP40-S03]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 三姑帮腔说离婚了一个人怎么过——你不考虑自己也要考虑孩子。慧兰放下茶壶平静地说——我考虑孩子考虑了三十年，现在该考虑自己了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 你这么大年纪了，离婚了一个人怎么过？以后生病了谁照顾你？}
  - {speaker: CHAR-GRP-002, line: 你不考虑自己，也要考虑孩子啊！}
  - {speaker: CHAR-001, line: 我考虑孩子考虑了三十年——现在，该考虑自己了。}
- segment_id: EP40-SEG04
  shot_ids: [EP40-S04]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 二姨急了说当妈的哪能这么自私。三姑说吃苦受累那是应该的。慧兰认真地看着三姑——三姑，你这一辈子过得好吗？三姑被问住了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 你这叫什么话！当妈的哪能这么自私！}
  - {speaker: CHAR-GRP-002, line: 我们这一辈子不都是这么过来的吗？吃苦受累那是应该的——你享什么福啊！}
  - {speaker: CHAR-001, line: 三姑——你这一辈子，过得好吗？}
- segment_id: EP40-SEG05
  shot_ids: [EP40-S05]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L02, CHAR-GRP-002-L01]}
  assets:
    look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 慧兰一字一句地问——三姑你十九岁嫁人生了五个孩子伺候公婆三十年。你吃过一顿为自己做的饭吗？你买过一件只为自己喜欢的衣服吗？三姑眼圈红了没有回答。二姨想说什么。慧兰说——二姨，你也一样。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-001, line: 三姑，你十九岁嫁人，生了五个孩子，伺候了公婆三十年。}
  - {speaker: CHAR-001, line: 你吃过一顿为自己做的饭吗？你买过一件只为自己喜欢的衣服吗？}
  - {speaker: CHAR-001, line: 二姨，你也一样。}
- segment_id: EP40-SEG06
  shot_ids: [EP40-S06]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 沉默许久。二姨声音低下来——慧兰我们是怕你以后后悔。慧兰坚定地说——我不离婚才会后悔。我六十岁了才知道什么叫为自己活。你们觉得我疯了——但我这辈子从来没有这么清醒过。二姨和三姑对视了一眼——准备好的说辞说不出口了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 慧兰——我们不是来骂你的。我们是怕你以后后悔。}
  - {speaker: CHAR-001, line: 我不离婚，才会后悔。}
  - {speaker: CHAR-001, line: 我六十岁了——我才知道什么叫'为自己活'。你们觉得我疯了——但我这辈子，从来没有这么清醒过。}
- segment_id: EP40-SEG07
  shot_ids: [EP40-S07]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L02, CHAR-GRP-002-L01]}
  assets:
    look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 慧兰站起来走到窗边——转身一字一句地说——你们那一套，'女人就该忍就该吃苦就该为了孩子活一辈子'——在我这不好使了。我不是你们了。我也不想再当你们了。二姨和三姑坐在沙发上谁也没再说话。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-001, line: 二姨、三姑——你们那一套。'女人就该忍、就该吃苦、就该为了孩子活一辈子'——在我这，不好使了。}
  - {speaker: CHAR-001, line: 我不是你们了。我也不想再当你们了。}
- segment_id: EP40-SEG08
  shot_ids: [EP40-S08]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 二姨和三姑走到门口。三姑回头说——慧兰你变了。慧兰微笑说嗯变好了。三姑张了张嘴说那你好好的就走了。慧兰站在门口看着她们走远的背影——也是苦命人。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 慧兰——你变了。}
  - {speaker: CHAR-001, line: 嗯。变了。变好了。}
  - {speaker: CHAR-GRP-002, line: 那……你好好的。}
  - {speaker: CHAR-001, line: 嗯。我会好好的。}
- segment_id: EP40-SEG09
  shot_ids: [EP40-S09]
  duration_sec: 10
  speakers: [CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L02, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 慧兰关上门回到客厅。慧芳眼眶红红地说——姐你刚才说的那些话我听得都想哭。慧兰笑着拿起菜继续择——你是不是也觉得我疯了？慧芳摇头说不是——我是觉得你终于活过来了。慧兰没说话但嘴角是笑着的。她赶走的不是亲戚，是那个困了她六十年的笼子。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-010-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-010, line: 姐——你刚才说的那些话，我听得都想哭。}
  - {speaker: CHAR-001, line: 你是不是也觉得我疯了？}
  - {speaker: CHAR-010, line: 不是。我是觉得——你终于活过来了。}
