# SOURCE FIDELITY: EP40_剧本.md -> 9 shots 1:1 | 90s | ALL PASS
episode_id: EP40
defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: '9:16'
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: 竖向构图 9:16，温暖真实的生活质感，柔和的家庭光线，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格
  negative_prompt: 文字内容，模糊，低质量，扭曲的面部，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒
voice_prompts:
  CHAR-001: 温和沉稳的中年女声；从开门时的意外（"二姨三姑你们怎么来了？"）到平静回应（"我考虑孩子考虑了三十年——现在该考虑自己了"）到字字如针的质问（"你吃过一顿为自己做的饭吗？"）到最后的金句——"你们那一套在我这不好使了"——声音从客气到坚定到温柔地讲出最狠的话
  CHAR-010: 沙哑疲倦的中年女声；替姐姐鸣不平（"是我姐夫出轨"），到最后感动（"姐——你终于活过来了"）
  CHAR-GRP-002: 阴阳怪气的中老年声音；二姨的尖刻（"丢人不丢人"）和三姑的固执（"吃苦受累那是应该的"）——后被问住时的沉默
segments:
