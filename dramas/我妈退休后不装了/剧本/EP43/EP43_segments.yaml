  - {speaker: CHAR-007, line: 我也跟你一样——忍了二十多年了。我老公你也知道，爱喝酒，喝多了就骂人。}
  - {speaker: CHAR-007, line: 以前觉得忍忍就过去了。但看到你离婚后过得那么好——我就在想，我到底在怕什么？}
