    api:
      text: "【图1】林慧兰 CHAR-001-L01（站起来走到窗边，背对妹妹，晨光照背影——脊背挺直）【图2】林慧芳 CHAR-010-L01（坐沙发上不安地看着姐姐的背影）【图3】林家客厅 SCENE-001。中景 固定镜头：慧兰站起来走到窗边。她的背影在晨光里很瘦但很直。慧芳看着姐姐变了——以前那个含胸低头的人不见了。慧兰转身走回来坐下，表情平静但眼神坚定。"
