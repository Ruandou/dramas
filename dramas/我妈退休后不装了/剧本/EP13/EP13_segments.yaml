voice_prompts:
  CHAR-001: "温和沉稳的中年女声，略带沧桑感，语速中等偏慢，情绪激动时语调会上扬但保持克制，普通话标准带轻微北方口音；开导妹妹时语气温暖有力"
  CHAR-010: "沙哑疲倦的中年女声，音色偏暗，语速慢，经常哽咽或欲言又止，普通话带地方口音，初期破碎感和无助感明显，后期对话中逐渐获得力量"
  CHAR-007: "爽朗大嗓门的中年女声，语速快、笑点低，自带喜庆感，普通话带地方口音，闺蜜感十足；转为严肃话题时声调突然压低形成反差"

