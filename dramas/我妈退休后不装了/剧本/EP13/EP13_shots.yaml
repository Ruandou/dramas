      - speaker: CHAR-007
        line: "你姐可厉害了！大寿宴上撕协议、蛋糕糊张大强一脸！你是没看见——全场人都傻了！"
      - speaker: CHAR-010
        line: "姐你…你真的？"
      - speaker: CHAR-001
        line: "别听她夸张…"
      - speaker: CHAR-007
        line: "对了慧兰——我刚在楼下碰见一个人。你前夫。"
      - speaker: CHAR-001
        line: "他来了？"
      - speaker: CHAR-007
        line: "他听说你帮妹妹打官司的事，在楼下跳脚骂街呢。说'林慧兰你等着'。"
