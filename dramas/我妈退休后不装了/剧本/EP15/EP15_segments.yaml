      CHAR-001-L01（接过水果，意外又温暖的笑容）。中景：姐妹俩回家路上慧兰看到熟悉身影——李建国从长椅上站起来递过水果袋。
    content_roles:
    - file: SCENE-006
      role: reference_image
      label: 图1
    - file: CHAR-006-L01
      role: reference_image
      label: 图2
    - file: CHAR-001-L01
      role: reference_image
      label: 图3
  dialogue:
  - speaker: CHAR-006
    line: 林…林姐。听说你去三亚了？
  - speaker: CHAR-001
    line: 李老师？你怎么在这？
  - speaker: CHAR-006
    line: 我路过…看到你回来脸色好多了。这是刚买的水果，你拿着。
  - speaker: CHAR-001
    line: 谢谢李老师。
