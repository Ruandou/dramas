  - CHAR-010
  refs: *id001
  assets: *id002
  api:
    text: 【图1】律师事务所门口 SCENE-007外景（秋天阳光，桂花树）【图2】林慧芳 CHAR-010-L01（站在门口深呼吸，手里攥着名片和材料清单）【图3】林慧兰
      CHAR-001-L01（看着妹妹微笑）。中景：走出律所。秋天阳光。慧芳站在门口深吸一口气——天好像比来的时候亮了一些。
    content_roles:
    - file: SCENE-007
      role: reference_image
      label: 图1
    - file: CHAR-010-L01
      role: reference_image
      label: 图2
    - file: CHAR-001-L01
      role: reference_image
      label: 图3
  dialogue:
  - speaker: CHAR-010
    line: 姐。
  - speaker: CHAR-001
    line: 嗯？
  - speaker: CHAR-010
    line: 原来我不是只能忍。
  - speaker: CHAR-001
    line: 你本来就不用忍。只是没人告诉过你。
