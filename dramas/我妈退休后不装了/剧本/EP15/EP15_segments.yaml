source_md: 剧本/EP15/EP15_剧本.md
defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: '9:16'
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: 竖向构图 9:16，温暖真实的生活质感，明亮的办公环境，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格
  negative_prompt: 文字内容，模糊，低质量，扭曲的面具，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒
voice_prompts:
  CHAR-001: 温和沉稳的中年女声，略带沧桑感，语速中等偏慢，普通话标准带轻微北方口音；与律师对话时条理清晰
  CHAR-010: 沙哑疲倦的中年女声，音色偏暗，语速慢，经常哽咽或欲言又止，普通话带地方口音；本集中逐渐有了希望感
  CHAR-006: 温和儒雅的中老年男声，语速从容，音色温暖有书卷气，普通话标准；说话时略带紧张和局促
  CHAR-002: 低沉粗哑的中老年男声，习惯性命令式语气，语速较快，普通话带北方口音
