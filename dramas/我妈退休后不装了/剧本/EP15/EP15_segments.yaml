      CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01.png
    scene_urls:
      SCENE-007: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-007.png
  api:
    text: 【图1】律师事务所 SCENE-007（简洁明亮办公室，落地窗）【图2】林慧兰 CHAR-001-L01（在前台登记，从容）【图3】林慧芳 CHAR-010-L01（紧张地站在姐姐身边，打量四周）。中景：慧兰带慧芳走进律所。慧芳有些紧张——这辈子没进过这种地方。慧兰轻车熟路登记。
    content_roles:
    - file: SCENE-007
      role: reference_image
      label: 图1
    - file: CHAR-001-L01
      role: reference_image
      label: 图2
    - file: CHAR-010-L01
      role: reference_image
      label: 图3
  dialogue:
  - speaker: CHAR-001
    line: 你好，我约了周律师。
  - speaker: CHAR-010
    line: 姐…你常来这儿啊？
  - speaker: CHAR-001
    line: 来过几回。打官司嘛，律师楼门槛都要踩平了。
  - speaker: CHAR-010
    line: 你比我能干太多了……
- segment_id: EP15-SEG02
  shot_ids:
  - EP15-S02
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-010
  refs: *id001
  assets: *id002
  api:
    text: 【图1】律师事务所 SCENE-007办公室内（办公桌、书架、绿植）【图2】林慧芳 CHAR-010-L01（坐在椅子上紧张地揪包带）。中景 固定镜头：周律师走进办公室坐下打开笔记本。她语气专业但不冰冷。慧芳紧张地讲述情况。
    content_roles:
    - file: SCENE-007
      role: reference_image
      label: 图1
    - file: CHAR-010-L01
      role: reference_image
      label: 图2
  dialogue:
  - speaker: EXTRA
    line: 林姐跟我提过一些。你来说说你的情况吧。
  - speaker: CHAR-010
    line: 我…他出轨了三年…前几天把那个女人带回家了。
  - speaker: EXTRA
    line: 有证据吗？聊天记录、照片之类的？
  - speaker: CHAR-010
    line: 我…我不敢存那些。
- segment_id: EP15-SEG03
  shot_ids:
  - EP15-S03
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-001
  - CHAR-010
  refs: *id001
  assets: *id002
  api:
    text: 【图1】林慧兰 CHAR-001-L01（条理清晰地替妹妹补充情况）【图2】律师事务所 SCENE-007办公室。近景 正反打：慧兰替妹妹补充情况——分居时间、收入、暴力倾向。她说话有条有理。周律师边听边记。慧芳在旁边听着——第一次听人用法律语言替她说话。
    content_roles:
    - file: CHAR-001-L01
      role: reference_image
      label: 图1
    - file: SCENE-007
      role: reference_image
      label: 图2
  dialogue:
  - speaker: CHAR-001
    line: 他换了门锁，我妹现在住我那儿。收入方面他在工地当工头，不稳定。
  - speaker: EXTRA
    line: 夫妻共同财产呢？存款、房子？
  - speaker: CHAR-010
    line: 房子是他婚前买的…我不知道他有多少存款。
  - speaker: EXTRA
    line: 没关系。这些我们都可以查。
- segment_id: EP15-SEG04
  shot_ids:
  - EP15-S04
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-010
  refs: *id001
  assets: *id002
  api:
    text: 【图1】律师事务所 SCENE-007办公室。近景 固定镜头：周律师合上本子，一条条分析慧芳的情况。慧芳的眼神从迷茫慢慢变得有光——原来她有权利。
    content_roles:
    - file: SCENE-007
      role: reference_image
      label: 图1
  dialogue:
  - speaker: EXTRA
    line: 虽然没抓到现行的出轨证据，但分居+门锁更换+他带人回家的事实，足够作为感情破裂的证明。
  - speaker: CHAR-010
    line: 那…我能拿到什么？
  - speaker: EXTRA
    line: 婚后共同财产的一半。如果证明他的过错，你可以多分。另外——家暴记录如果能找到，对你的抚养权主张也有利。
- segment_id: EP15-SEG05
  shot_ids:
  - EP15-S05
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-010
  refs: *id001
  assets: *id002
  api:
    text: 【图1】林慧芳 CHAR-010-L01（听到家暴二字肩膀缩了一下，接过名片时手在抖）【图2】律师事务所 SCENE-007办公室。近景 特写：慧芳听到家暴记录时肩膀缩了一下。周律师注意到放轻语气递过心理咨询名片。
    content_roles:
    - file: CHAR-010-L01
      role: reference_image
      label: 图1
    - file: SCENE-007
      role: reference_image
      label: 图2
  dialogue:
  - speaker: CHAR-010
    line: 家暴…我没有去医院验过伤。他每次打得不重…就是扇耳光、推搡。
  - speaker: EXTRA
    line: 我明白。很多当事人都不去验伤——不是伤不重，是不敢。
  - speaker: EXTRA
    line: 这是我认识的一位心理咨询师。你如果愿意可以去找她聊聊。
  - speaker: CHAR-010
    line: 谢谢…真的谢谢你。
- segment_id: EP15-SEG06
  shot_ids:
  - EP15-S06
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-001
  refs: *id001
  assets: *id002
  api:
    text: 【图1】律师事务所 SCENE-007办公室。中景：周律师翻出慧兰自己的卷宗聊她的案子。慧兰认真听着。慧芳在旁边瞪大眼睛——姐姐的官司比想象的复杂。
    content_roles:
    - file: SCENE-007
      role: reference_image
      label: 图1
  dialogue:
  - speaker: EXTRA
    line: 林姐，你的案子我看了。张大强转移存款的证据——我建议你调取近三年的银行流水。
  - speaker: CHAR-001
    line: 好。我去银行申请。
  - speaker: EXTRA
    line: 林姐，说实话——我办过这么多离婚案子，你是第一个自己把证据整理得这么清楚的当事人。
- segment_id: EP15-SEG07
  shot_ids:
  - EP15-S07
  duration_sec: 10
  speakers:
  - EXTRA
  - CHAR-001
  refs: *id001
  assets: *id002
  api:
    text: 【图1】林慧兰 CHAR-001-L01（听到律师说酷，愣了一下然后笑了）【图2】林慧芳 CHAR-010-L01（也跟着笑了，几天来第一次笑）【图3】律师事务所
      SCENE-007办公室。近景：周律师看着这对姐妹忍不住说出心里话。慧兰被酷这个字逗笑了。慧芳也跟着笑了。温暖时刻。
    content_roles:
    - file: CHAR-001-L01
      role: reference_image
      label: 图1
    - file: CHAR-010-L01
      role: reference_image
      label: 图2
    - file: SCENE-007
      role: reference_image
      label: 图3
  dialogue:
  - speaker: EXTRA
    line: 林姐，我冒昧说一句——我做了十年离婚律师，你是我见过最酷的客户。六十岁打离婚官司、自己整理证据、还带着妹妹来维权——真的，太酷了。
  - speaker: CHAR-001
    line: 六十年了…第一次有人用酷说我。
- segment_id: EP15-SEG08
  shot_ids:
  - EP15-S08
  duration_sec: 10
  speakers:
