- shot_id: EP66-S02; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 面馆内，王翠花放下抹布走到桌前，在林慧兰对面坐下，双手撑在桌上，表情认真。林慧兰抬头看着她，一脸纠结。}; dialogue: [{speaker: CHAR-007, line: 靠不靠谱我不知道——但我看你一整天魂不守舍的。}, {speaker: CHAR-001, line: 我就是在想——全国连锁。}, {speaker: CHAR-007, line: 听起来挺吓人的。}]
- shot_id: EP66-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 面馆门口，62岁儒雅男人李建国推门进来，身穿驼色亚麻西装，手里拎着一袋水果。他看到林慧兰和翠花还没走，露出温和的笑容。}; dialogue: [{speaker: CHAR-006, line: 还没关门？我路过看灯还亮着。}, {speaker: CHAR-001, line: 老李你来得正好——帮我看看这个。}, {speaker: CHAR-006, line: （戴上金丝眼镜仔细看）}]
- shot_id: EP66-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 李建国看完名片，沉默片刻，摘下眼镜。林慧兰紧张地看着他。王翠花也凑过来。面馆暖色灯光打在三人脸上。}; dialogue: [{speaker: CHAR-006, line: 明德餐饮投资……我听说过这家。}, {speaker: CHAR-001, line: 怎么样？}, {speaker: CHAR-006, line: 他们喜欢包装故事、快速扩张。之前几个品牌都是铺到全国就出问题了。}, {speaker: CHAR-007, line: 那不就是骗人的吗！}]
- shot_id: EP66-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 林慧兰把名片翻来覆去地看，手指抚过名片上的字。李建国温和地看着她。面馆暖黄的灯光照着两人。}; dialogue: [{speaker: CHAR-001, line: 可是他们说……可以把面馆做到全国去。}, {speaker: CHAR-006, line: 慧兰——面馆是你自己的孩子，还是你想让它变成一家公司？}, {speaker: CHAR-001, line: （愣住）……}]
- shot_id: EP66-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 林慧兰沉默了很久，低头看名片。李建国温和地注视着她。翠花走过来站在慧兰身边，手搭在她肩上。}; dialogue: [{speaker: CHAR-001, line: 我就是……想证明我能做成大事。}, {speaker: CHAR-006, line: 你现在做的事——不就是大事吗？一个小面馆养活了自己、帮了翠花、让全家人对你刮目相看。}, {speaker: CHAR-007, line: 老李说得对。}]
- shot_id: EP66-S07; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 王翠花站起来，手搭在林慧兰肩膀上，弯下腰看着她。林慧兰抬头看翠花，脸上带着犹豫。}; dialogue: [{speaker: CHAR-007, line: 慧兰——你问我靠谱不靠谱——我觉得这事儿得你自己决定。}, {speaker: CHAR-001, line: 我要是拒绝了……会不会错过机会？}, {speaker: CHAR-007, line: 你那个叫不叫错过，得看你自己想要什么。}]
- shot_id: EP66-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 林慧兰转头看向李建国。李建国温和地回望她，金丝眼镜挂在颈间，表情认真而温暖。}; dialogue: [{speaker: CHAR-001, line: 老李你说——我该去谈吗？}, {speaker: CHAR-006, line: 我觉得你应该去谈——听听他们怎么说。但是慧兰——不管他们说什么——你都可以选择说'不'。}, {speaker: CHAR-001, line: 说'不'……}]
- shot_id: EP66-S09; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 林慧兰把名片翻过来，从口袋里掏出一支笔，在背面写了一个字。王翠花好奇地凑过来看。林慧兰写完抬头，表情若有所思。}; dialogue: [{speaker: CHAR-007, line: 写什么呢？}, {speaker: CHAR-001, line: 我写了一个字——'等'。}, {speaker: CHAR-007, line: 等什么？}, {speaker: CHAR-001, line: 等我想清楚——面馆是我的孩子，还是我的生意。}]
