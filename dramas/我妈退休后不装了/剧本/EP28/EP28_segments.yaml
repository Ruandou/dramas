    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 张大强愣在原地——他以为慧兰闹是因为他有外遇是指望他回头。慧兰说不是因为别人是因为你——是因为跟你过的这四十年让我再也不想跟你过了。张大强声音低下去却还在嘴硬。
