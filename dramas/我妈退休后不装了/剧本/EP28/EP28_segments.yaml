  CHAR-002: 低沉粗哑的中老年男声；从气急败坏（"开门！"）到质问（"你是我老婆"）到咬牙威胁（"净身出户"）到愣住（"四十年了……"）最后哑口无言——声音从高到低，气势一步步被打掉
  CHAR-010: 沙哑疲倦的中年女声；此时带着对姐姐的崇拜和担心（"姐你手在抖"）
