  - {speaker: CHAR-001, line: 就……散散步呗。}
  - {speaker: CHAR-010, line: 你脸红了。}
  - {speaker: CHAR-001, line: 别瞎说。}
  - {speaker: CHAR-010, line: 我没瞎说——你耳朵都红了。}
