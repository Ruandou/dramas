  - {speaker: CHAR-001, line: 离婚是你先提出来的。协议是你拿出来的。现在你跟我说我没办完手续？}
  - {speaker: CHAR-002, line: 那也不行！你——}
  - {speaker: CHAR-001, line: 张大强，你讲不讲理？}
