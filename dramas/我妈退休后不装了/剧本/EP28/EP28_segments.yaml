  - {speaker: CHAR-002, line: 你……你说什么？}
  - {speaker: CHAR-001, line: 我说——不是因为别人。是因为你。是因为跟你过的这四十年，让我再也不想跟你过了。}
  - {speaker: CHAR-002, line: 你……你胡说什么……}
  - {speaker: CHAR-001, line: 我没有胡说。是你一直不明白。}
