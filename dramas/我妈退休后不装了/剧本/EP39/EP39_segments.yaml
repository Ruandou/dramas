  - {speaker: CHAR-004, line: 你妈现在倒好——天天在外面跳舞、跟老头子散步，自己孙子都不管了。}
  - {speaker: CHAR-003, line: 妈现在也不容易……}
  - {speaker: CHAR-004, line: 她不容易？不容易还有心思跟那个李建国约会？}
