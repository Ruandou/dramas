- shot_id: EP70-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-006.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-006.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 林慧兰低下头，手指交叉在一起，有些犹豫。李建国温柔地注视着她。}; dialogue: [{speaker: CHAR-001, line: 那别人会说闲话的——说我们不清不楚。}, {speaker: CHAR-006, line: 慧兰——你都六十岁了，还在乎别人说什么吗？}, {speaker: CHAR-001, line: （笑了）也是……我连离婚都不怕了，还怕闲话？}]}
- shot_id: EP70-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-006.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-006.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 两个人相视而笑，夕阳下的湖面波光粼粼照在他们脸上。画面温暖美好。}; dialogue: [{speaker: CHAR-006, line: 所以——你的答案是？}, {speaker: CHAR-001, line: 我的答案是——不结婚。}, {speaker: CHAR-006, line: （点头）嗯。}, {speaker: CHAR-001, line: 但是——我们可以平等地在一起。}]}
