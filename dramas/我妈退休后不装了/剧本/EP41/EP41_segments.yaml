  - {speaker: CHAR-001, line: 但我那时候想的都是——'他们真好'。从来没想过自己也可以。}
  - {speaker: CHAR-006, line: 你现在可以了。}
  - {speaker: CHAR-001, line: 对。我现在可以了。}
