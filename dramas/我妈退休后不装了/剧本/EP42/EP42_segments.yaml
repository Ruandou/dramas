  CHAR-003: 普通的年轻男声；从进门的不自然（"路过来看看你"），到恍惚的回忆（"小时候我也这样看你包过饺子"），到那句憋了四十年的"对不起"（哽咽），到"从来没说过一句谢谢"——全程内疚、哽咽、克制
  CHAR-008: 清脆童声；天真活泼（"奶奶你在包饺子！""奶奶你看我包的！"）
