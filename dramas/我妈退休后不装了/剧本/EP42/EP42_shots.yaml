        【图1】CHAR-001-L02【图2】CHAR-008-L01【图3】CHAR-003-L01【图4】SCENE-001。中景 固定：吃完饭，张明带着张昊走了。在门口——张昊回头喊了一声，声音亮得像一个小喇叭。慧兰挥挥手——围裙还没解，上面沾着面粉。张明走了几步又回头——他站在楼道里，逆着光，看不清表情，但他的声音很清楚。慧兰点点头——没有说不用来，也没有说你必须来——就是轻轻点了一下头。她关上门——门锁咔哒一声。然后她靠在门上——后背贴着冰凉的门板，眼睛看着桌子上吃剩的饺子。盖帘上还放着张昊包的那个歪歪扭扭的饺子——她没舍得煮。她轻轻笑了一下——不是哈哈大笑，是那种从心底慢慢浮上来的、安静的、圆满的笑。不是每个等了四十年的道歉都能等到。她等到了。
