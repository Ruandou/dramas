    text: 儿子家客厅·傍晚。王芳坐在沙发上发呆——手机上是法律咨询页面。她今天去旁听了婆婆的离婚案，本来是想看婆婆出丑的，结果听完整个陈述后心里有什么东西被触动了。
    content_roles:
    - {file: SCENE-003, role: reference_image, label: 图1}
    - {file: CHAR-004-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-004, line: 家庭劳动的经济价值……难道……真的有法律依据？}
- segment_id: EP31-SEG02
  shot_ids: [EP31-S02]
  duration_sec: 10
  speakers: [CHAR-004]
  refs: {scene_id: SCENE-003, look_ids: [CHAR-004-L01]}
  assets:
