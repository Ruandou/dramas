    - {file: SCENE-003, role: reference_image, label: 图1}
    - {file: CHAR-003-L01, role: reference_image, label: 图2}
    - {file: CHAR-004-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-003, line: 我今天……也去法庭了。}
  - {speaker: CHAR-004, line: 你去了？}
  - {speaker: CHAR-003, line: 下班后去的。站在最后一排。}
  - {speaker: CHAR-003, line: 妈说的那些话——我都听到了。}
  - {speaker: CHAR-003, line: 你说——妈这些年……是不是太苦了？}
