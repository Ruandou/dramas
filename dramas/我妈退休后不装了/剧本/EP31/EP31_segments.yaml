    scene_urls: {SCENE-003: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-003}
  api:
    text: 王芳靠在沙发上脑子很乱。她想起这些年把孙子丢给婆婆、让她做饭洗衣——她一直觉得婆婆"不就是在家里干点活吗"。现在她知道那些"不就是干点活"，在法律上叫"承担了较多家庭义务"。
    content_roles:
    - {file: SCENE-003, role: reference_image, label: 图1}
    - {file: CHAR-004-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-004, line: 我这些年……都在干什么啊。}
  - {speaker: CHAR-004, line: 每次把张昊送过去——妈从来没说不。}
  - {speaker: CHAR-004, line: 我就觉得……那是她应该做的。}
