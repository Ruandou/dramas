    scene_urls: {SCENE-003: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-003}
  api:
    text: 王芳放下手机又拿起来——她一直觉得婆婆在家做家务是天经地义的。但今天法庭上听到"一万四千六百天没有休息过"——那个数字像一根针扎在心里。她算了一下——四十年。
    content_roles:
    - {file: SCENE-003, role: reference_image, label: 图1}
    - {file: CHAR-004-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-004, line: 一万四千六百天……那是多少年？}
  - {speaker: CHAR-004, line: 四十年……}
- segment_id: EP31-SEG03
  shot_ids: [EP31-S03]
  duration_sec: 10
