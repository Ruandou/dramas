    scene_urls: {SCENE-003: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-003}
  api:
    text: 王芳搜索家庭主妇离婚能分多少财产——看到民法典第一千零八十八条。她念出法条——家务劳动补偿。放下手机表情复杂——所以妈这些年不是白做的？
    content_roles:
    - {file: SCENE-003, role: reference_image, label: 图1}
    - {file: CHAR-004-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-004, line: 家务劳动补偿……民法典第一千零八十八条……}
  - {speaker: CHAR-004, line: 夫妻一方因抚育子女、照料老年人、协助另一方工作等承担较多义务的，有权在离婚时请求补偿……}
  - {speaker: CHAR-004, line: 所以……妈这些年，不是白做的？}
