    - {file: CHAR-004-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-003, line: 我回来了。}
  - {speaker: CHAR-003, line: 怎么了？坐这儿发什么呆？}
  - {speaker: CHAR-004, line: 没……没什么。}
  - {speaker: CHAR-003, line: 你手机屏幕上——我看好像是法律什么的？}
  - {speaker: CHAR-004, line: 没有！你看错了。}
