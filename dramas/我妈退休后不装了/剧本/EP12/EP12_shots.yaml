# SOURCE FIDELITY: EP12剧本.md -> 9 shots 1:1 | 90s | ALL PASS
episode_id: EP12
defaults: &d
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: "9:16"
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: "竖向构图 9:16，温暖真实的生活质感，明亮的自然光线，沙滩海洋，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格"
  negative_prompt: "文字内容，模糊，低质量，扭曲的面部，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒"
shots:
  - &s01
    shot_id: EP12-S01
    shot_no: 1
    mode: i2v_ref
    duration_sec: 10
    refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01], prop_ids: [PROP-005]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
      prop_urls: {PROP-005: https://drama-reference-images.tos-cn-beijing.volces.com/props/我妈退休后不装了/PROP-005.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（穿浅蓝色碎花连衣裙——觉醒后第一次敢穿亮色【图2】林家客厅 SCENE-001（沙发上摊着几件衣服，老照片墙）【图3】红色行李箱 PROP-005（中号，放在客厅中央）。中景 固定镜头：慧兰往行李箱叠衣服。动作很慢——像在确认真的要走了。她看一眼墙上的老照片。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}, {file: PROP-005, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）六十年了。第一次为自己收拾行李。"}
      - {speaker: CHAR-001, line: "（内心）不是给丈夫。不是给孩子。是给我自己。"}
      - {speaker: CHAR-001, line: "（内心）他们说我疯了。也许我真的疯了。"}
      - {speaker: CHAR-001, line: "（内心）疯了就疯了。疯一次又怎样。"}
  - <<: *s01
    shot_id: EP12-S02
    shot_no: 2
    look_ids: [CHAR-001-L01, CHAR-005-L01]
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
        CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（一边接电话一边叠衣服）【图2】张蕾 CHAR-005-L01（手机界面显示来电头像，干练短发）【图3】林家客厅 SCENE-001。近景 固定镜头：手机响，慧兰接起。张蕾声音急切。慧兰手上动作没停，语气平静但坚定。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-005-L01, role: reference_image, label: 图2}, {file: SCENE-001, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-005, line: "妈，你一个人去三亚？你疯了吗？爸说要跟你算账！"}
      - {speaker: CHAR-001, line: "让他算。我等着。"}
      - {speaker: CHAR-005, line: "妈！我是为你好！你怎么就不明白？"}
      - {speaker: CHAR-001, line: "你为我好？那你告诉妈，妈这辈子什么时候为自己好过？"}
      - {speaker: CHAR-005, line: "但是你一个人……"}
      - {speaker: CHAR-001, line: "我一个人怎么了？我一个人活得很好。挂了啊。"}
  - <<: *s01
    shot_id: EP12-S03
    shot_no: 3
    look_ids: [CHAR-001-L01, CHAR-007-L01]
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
        CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（拉着行李箱走到门口，接第二个电话，嘴角上扬）【图2】王翠花 CHAR-007-L01（手机界面显示联系人头像，喜庆笑容）【图3】林家客厅 SCENE-001门口。中景 固定镜头：正要开门手机又响。看到是翠花，慧兰接起，被逗笑。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-007-L01, role: reference_image, label: 图2}, {file: SCENE-001, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-007, line: "慧兰！听说你要去三亚？真的假的？"}
      - {speaker: CHAR-001, line: "真的。我已经到门口了。"}
      - {speaker: CHAR-007, line: "你太牛了！给我带椰子回来！哈哈哈！"}
      - {speaker: CHAR-001, line: "你这人……"}
  - <<: *s01
    shot_id: EP12-S04
    shot_no: 4
    look_ids: [CHAR-001-L01]
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（手放在门把手上，深吸一口气）【图2】林家客厅 SCENE-001门口（晨光照进来）。中景 固定镜头：慧兰挂掉电话深吸一口气转动门把手。门打开晨光照在她脸上。她拉着行李箱跨出门槛——这一步像跨过一整个人生。门轻轻关上。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）原来，门槛跨过去，就没那么难了。"}
      - {speaker: CHAR-001, line: "（内心）他们会在背后说三道四。让他们说去。"}
  - <<: *s01
    shot_id: EP12-S05
    shot_no: 5
    refs: {scene_id: SCENE-009, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-009.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（浅蓝碎花裙，鞋拎手上，赤脚站在沙滩上，表情由不敢相信变成笑）【图2】三亚海滩 SCENE-009（蔚蓝大海延伸到天际，海浪轻拍沙滩）。中景 固定镜头：慧兰站在沙滩边第一次见到真正的海。风把她的头发吹乱她没去理。她的表情从不相信慢慢变成释然的笑。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-009, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）这就是海啊……"}
      - {speaker: CHAR-001, line: "（内心）六十岁了。第一次见真正的海。"}
      - {speaker: CHAR-001, line: "（内心）小时候说长大了要看海。长大了。老了。终于来了。"}
  - <<: *s01
    shot_id: EP12-S06
    shot_no: 6
    refs: {scene_id: SCENE-009, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-009.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（举起手机自拍，风吹起裙摆，笑得自然开心）【图2】三亚海滩 SCENE-009（旁边一对年轻情侣也在笑）。近景 固定镜头：慧兰举起手机拍照。一开始有些生涩然后越来越自然。她转半圈让裙摆飞起来。旁边情侣看她笑得开心也跟着笑。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-009, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）年轻的时候总说——等孩子大了就去旅游。"}
      - {speaker: CHAR-001, line: "（内心）等孩子大了。等退休了。等老了。"}
      - {speaker: CHAR-001, line: "（内心）不等了。就现在。"}
  - <<: *s01
    shot_id: EP12-S07
    shot_no: 7
    refs: {scene_id: SCENE-009, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-009.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（站在水边，张开双臂面向大海，阳光照在脸上，风吹裙摆和头发）【图2】三亚海滩 SCENE-009（海浪轻轻拍脚踝，夕阳金光照海面）。全景 固定镜头：慧兰放下手机走到水边。海浪拍脚踝。她张开双臂面向大海——五十年来第一次完全为自己做的决定。阳光洒在她脸上。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-009, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）五十年来第一次。完全为自己做的决定。"}
      - {speaker: CHAR-001, line: "（内心）风是咸的。阳光是烫的。活着真好。"}
  - <<: *s01
    shot_id: EP12-S08
    shot_no: 8
    refs: {scene_id: SCENE-009, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-009.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（坐在沙滩上看手机，表情从惊讶到笑）【图2】三亚海滩 SCENE-009（手机屏幕显示朋友圈评论区爆炸）。近景 固定镜头：慧兰坐在沙滩上挑选九张照片发朋友圈。刚发出去手机就炸了。她一条条翻看——有祝福有骂声。她嘴角挂着笑。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-009, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-007, line: "慧兰你这照片拍太好了！我给你点赞了！"}
      - {speaker: CHAR-002, line: "林慧兰你是不是疯了？丢人丢到三亚去了！你等着！"}
      - {speaker: CHAR-001, line: "（内心）骂吧。骂得越凶，我越知道我做对了。"}
  - <<: *s01
    shot_id: EP12-S09
    shot_no: 9
    refs: {scene_id: SCENE-009, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-009: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-009.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（站起来沿海岸线走，回头看一眼沙滩上的脚印，然后继续走，微笑）【图2】三亚海滩 SCENE-009（夕阳下的沙滩，一串脚印延伸向远方）。远景 固定镜头：慧兰站起来把手机放进口袋。她沿着海岸线往前走。走出几步回头看了一眼脚印。笑了笑继续往前走。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-009, role: reference_image, label: 图2}]
