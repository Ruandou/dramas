# SOURCE FIDELITY: EP11剧本.md -> 9 shots 1:1 | 90s | ALL PASS
episode_id: EP11
defaults: &d
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: "9:16"
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: "竖向构图 9:16，温暖真实的生活质感，柔和的家庭光线，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格"
  negative_prompt: "文字内容，模糊，低质量，扭曲的面部，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒"
shots:
  - &s01
    shot_id: EP11-S01
    shot_no: 1
    mode: i2v_ref
    duration_sec: 10
    refs: {scene_id: SCENE-012, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-012: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-012.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（背着新买的书法工具包，神情局促）【图2】社区活动中心 SCENE-012（走廊挂着老年大学牌子，几扇教室门）。中景 固定镜头：慧兰走进社区活动中心。大厅老年大学牌子醒目，走廊里老年人有说有笑。她有些局促——这辈子第一次为自己报班。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-012, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-001, line: "（内心）六十岁了还要跟小学生一样紧张。"}
      - {speaker: CHAR-001, line: "（内心）没事的。学个写字而已。"}
  - <<: *s01
    shot_id: EP11-S02
    shot_no: 2
    look_ids: [CHAR-001-L01, CHAR-GRP-001-L01]
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
        CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（坐靠窗位置铺宣纸）【图2】老太太同学 CHAR-GRP-001-L01（大红衬衫烫卷发，磨墨，精神十足）【图3】社区活动中心 SCENE-012。近景 固定镜头：慧兰找靠窗位置坐下。旁边老太太主动搭话。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-GRP-001-L01, role: reference_image, label: 图2}, {file: SCENE-012, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-GRP-001, line: "新来的？以前练过吗？"}
      - {speaker: CHAR-001, line: "没。第一次握毛笔。"}
      - {speaker: CHAR-GRP-001, line: "第一次好啊！我退休后才开始学，今年第七年了。你看我这字——七年前跟鸡爪子似的。"}
      - {speaker: CHAR-001, line: "您真幽默。"}
  - <<: *s01
    shot_id: EP11-S03
    shot_no: 3
    look_ids: [CHAR-001-L01, CHAR-GRP-001-L01]
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
        CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（握毛笔手有些抖）【图2】老太太 CHAR-GRP-001-L01（自来熟地聊）【图3】社区活动中心 SCENE-012书法教室。近景 固定镜头：老太太一边磨墨一边聊。慧兰握笔的手有些抖——太久没拿笔了。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-GRP-001-L01, role: reference_image, label: 图2}, {file: SCENE-012, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-GRP-001, line: "你一个人来的？老伴不陪你来？"}
      - {speaker: CHAR-001, line: "我没老伴了。分开了。"}
      - {speaker: CHAR-GRP-001, line: "分了好。一个人清净。我那个走了十年了，我都不想再找。"}
      - {speaker: CHAR-001, line: "您看着真不像一个人。"}
  - <<: *s01
    shot_id: EP11-S04
    shot_no: 4
    look_ids: [CHAR-GRP-001-L01, CHAR-001-L01]
    assets:
      look_urls:
        CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
    api:
      text: "【图1】老太太 CHAR-GRP-001-L01（云淡风轻说自己的故事）【图2】林慧兰 CHAR-001-L01（听得入神）【图3】社区活动中心 SCENE-012书法教室。近景 固定镜头：老太太说起七十岁离婚——云淡风轻像说别人的事。慧兰听得入神。"
      content_roles: [{file: CHAR-GRP-001-L01, role: reference_image, label: 图1}, {file: CHAR-001-L01, role: reference_image, label: 图2}, {file: SCENE-012, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-GRP-001, line: "我七十岁那年离的婚。离完婚第一件事就是报了这个书法班。"}
      - {speaker: CHAR-001, line: "七十岁…离婚？"}
      - {speaker: CHAR-GRP-001, line: "怎么，嫌晚？我告诉你——只要还活着，什么时候都不晚。"}
      - {speaker: CHAR-001, line: "您不后悔？"}
      - {speaker: CHAR-GRP-001, line: "后悔没早离。浪费了二十年。"}
  - <<: *s01
    shot_id: EP11-S05
    shot_no: 5
    look_ids: [CHAR-GRP-001-L01, CHAR-001-L01]
    assets:
      look_urls:
        CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
    api:
      text: "【图1】老太太 CHAR-GRP-001-L01（放下毛笔认真看慧兰）【图2】林慧兰 CHAR-001-L01（沉默一下）【图3】社区活动中心 SCENE-012。近景 固定镜头：老太太放下毛笔认真看着慧兰。那眼神是一个过来人的通透。她说的话让慧兰愣住了然后笑了。"
      content_roles: [{file: CHAR-GRP-001-L01, role: reference_image, label: 图1}, {file: CHAR-001-L01, role: reference_image, label: 图2}, {file: SCENE-012, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-GRP-001, line: "你有心事。说吧。"}
      - {speaker: CHAR-001, line: "我也想离婚。"}
      - {speaker: CHAR-GRP-001, line: "多大岁数？"}
      - {speaker: CHAR-001, line: "六十。"}
      - {speaker: CHAR-GRP-001, line: "那你早着呢！我七十才离，你比我年轻十岁！你慌什么？"}
  - <<: *s01
    shot_id: EP11-S06
    shot_no: 6
    look_ids: [CHAR-001-L01, CHAR-GRP-001-L01]
    assets:
      look_urls:
        CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png
        CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png
    api:
      text: "【图1】林慧兰 CHAR-001-L01（愣住然后笑）【图2】老太太 CHAR-GRP-001-L01（跟着一起笑）【图3】社区活动中心 SCENE-012（夕阳照进来）。中景 固定镜头：慧兰愣住然后笑了——不是客气是被逗笑。两个加起来一百三十多岁的女人笑得前仰后合。夕阳暖洋洋照进来。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: CHAR-GRP-001-L01, role: reference_image, label: 图2}, {file: SCENE-012, role: reference_image, label: 图3}]
    dialogue:
      - {speaker: CHAR-001, line: "听见您这么说，我好像不怕了。"}
      - {speaker: CHAR-GRP-001, line: "怕什么？天塌不下来。男人离了你过得更好，你离了男人也过得更好。"}
      - {speaker: CHAR-001, line: "我今天来对了。"}
      - {speaker: CHAR-GRP-001, line: "妹子，人生啊，六十才开始。"}
  - <<: *s01
    shot_id: EP11-S07
    shot_no: 7
    refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01]}
    assets:
