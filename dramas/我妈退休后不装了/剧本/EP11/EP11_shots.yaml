      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue: []
  - <<: *s01
    shot_id: EP11-S08
    shot_no: 8
    refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01]}
    assets:
      look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01.png}
      scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
    api:
      text: "【图1】林慧兰 CHAR-001-L01（不敢相信地看着门口的女人）【图2】林家客厅 SCENE-001门口。近景 固定镜头：门口女人听到脚步声抬起头。看起来比实际年龄沧桑。两人对视五秒——二十年前的记忆涌上来。"
      content_roles: [{file: CHAR-001-L01, role: reference_image, label: 图1}, {file: SCENE-001, role: reference_image, label: 图2}]
    dialogue:
      - {speaker: CHAR-010, line: "姐。"}
      - {speaker: CHAR-001, line: "慧芳？你怎么…"}
      - {speaker: CHAR-010, line: "姐…我没地方去了。"}
      - {speaker: CHAR-001, line: "出什么事了？你慢慢说。"}
  - <<: *s01
    shot_id: EP11-S09
    shot_no: 9
    refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01]}
    assets:
