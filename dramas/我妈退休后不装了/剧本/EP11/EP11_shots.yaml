      - {speaker: CHAR-001, line: "不走了。姐这儿就是你家。"}
      - {speaker: CHAR-010, line: "姐…我对不起你…这么多年都没联系你。"}
      - {speaker: CHAR-001, line: "不说这个。回来就好。"}
      - {speaker: CHAR-001, line: "（内心）原来不是我一个人。原来有这么多姐妹，都在忍。"}
