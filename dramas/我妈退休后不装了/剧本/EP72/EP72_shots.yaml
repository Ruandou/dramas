- shot_id: EP72-S02; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 门开了，58岁王翠花端着菜走进来，62岁李建国拎着两瓶酒跟在后面。林慧兰笑着迎上去。}; dialogue: [{speaker: CHAR-007, line: 慧兰！我来蹭饭了！}, {speaker: CHAR-006, line: 过年好——带了两瓶好酒。}, {speaker: CHAR-001, line: 快进来快进来——就等你们了！}]}
- shot_id: EP72-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png}; api: {text: 张大强还站在门口，手里拎着一个塑料袋，表情犹豫不决。张明站起来叫他，张蕾也开口了。}; dialogue: [{speaker: CHAR-003, line: 爸——进来吧。}, {speaker: CHAR-002, line: 我……我就来看看。}, {speaker: CHAR-005, line: 爸——进来坐。今天过年。}, {speaker: CHAR-002, line: （犹豫了一下，走进来）}]}
- shot_id: EP72-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png}; api: {text: 张大强把塑料袋放在桌上，里面是一盘凉拌黄瓜。林慧兰看着那盘菜愣住了。张昊好奇地凑过来。}; dialogue: [{speaker: CHAR-002, line: 我……学了一个月，做了一盘凉拌黄瓜。}, {speaker: CHAR-001, line: （看着那盘菜，愣了几秒）……放着吧。}, {speaker: CHAR-008, line: 爷爷做的黄瓜！我要吃！}]}
- shot_id: EP72-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png}; api: {text: 大家坐定，圆桌围得满满当当。酒杯都倒上了。张明和张蕾都看向妈妈，期待她说几句话。}; dialogue: [{speaker: CHAR-003, line: 妈——你说两句吧。}, {speaker: CHAR-005, line: 对——妈，这一年……你说几句。}, {speaker: CHAR-001, line: （看了看桌上的每一个人，深吸一口气）}]}
- shot_id: EP72-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-006-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-006: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-006-L01.png}; api: {text: 林慧兰站起来，举起酒杯。灯光照在她脸上，她的眼神坚定明亮。翠花和李建国也微笑举杯。}; dialogue: [{speaker: CHAR-001, line: 这一杯——我敬我自己。}, {speaker: CHAR-007, line: 敬你！}, {speaker: CHAR-006, line: （微笑举杯）}]}
- shot_id: EP72-S07; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 林慧兰继续说，声音有些哽咽但脸上带着自豪的笑容。她的丝巾和红衣在灯光下格外温暖。}; dialogue: [{speaker: CHAR-001, line: 敬我六十岁——才学会爱自己。敬我这一年的勇气——撕掉协议、拒绝带孙子、开了面馆、站在法庭上。}, {speaker: CHAR-001, line: 敬每一个——跟我一样迷惘过的女人。}]}
- shot_id: EP72-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-004-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-004-L01.png, CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-007: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}; api: {text: 张蕾眼眶红了站起来举杯。张明也站起来。王芳低头抹眼角。翠花流着泪但笑着。张大强低着头。}; dialogue: [{speaker: CHAR-005, line: 妈——我敬你。你是我这辈子最佩服的人。}, {speaker: CHAR-003, line: 妈——我也敬你。对不起……还有谢谢。}, {speaker: CHAR-007, line: 慧兰——我最好的姐妹。我敬你！}]}
