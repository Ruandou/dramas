  api:
    text: 张大强又煮了一锅——水太多面条成了一锅浆糊。尝了一口寡淡无味。他放下碗盯着那碗面——想起以前慧兰做的汤清面弹上面卧着荷包蛋。他从来没说过一句好吃。
