  shot_ids: [EP44-S09]
  duration_sec: 10
  speakers: [CHAR-007, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L02, CHAR-007-L01]}
  assets:
    look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫看了看手机又看了看翠花——嚅嗫了几句转身走了。翠花关上门靠在门上手在抖。慧兰走过去抱住她——你做得很好。你刚才那句话特别有力量。翠花在她肩膀上哭了——但这一次是释放不是恐惧。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-007-L01, role: reference_image}
  dialogue:
