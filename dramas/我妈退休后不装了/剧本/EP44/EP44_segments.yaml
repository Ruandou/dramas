  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 慧兰打开门。门口站着一个满脸通红的男人——翠花的丈夫。他劈头盖脸地骂——就是你离了婚不够还要带坏我老婆。慧兰站在门口没有让开平静地说——进来说。别在门口吵邻居都听着。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 林慧兰！就是你！你离了婚不够还要带坏我老婆！你在外面勾引男人就算了——还拉我老婆下水！}
  - {speaker: CHAR-001, line: 进来说。别在门口吵——邻居都听着。}
- segment_id: EP44-SEG03
  shot_ids: [EP44-S03]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02, CHAR-007-L01]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫冲进客厅指着翠花骂她长本事了。翠花缩在沙发上不敢抬头。慧兰走过去挡住他指着翠花的手指——你说话就说话，手指头收回去。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-007-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 你长本事了是吧！还想离婚？我看你是被这个疯女人洗脑了！}
  - {speaker: CHAR-001, line: 你说话就说话——手指头收回去。}
- segment_id: EP44-SEG04
  shot_ids: [EP44-S04]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫气笑了说你算什么东西管我家的事。慧兰不急不躁——我是她朋友她的事就是我的事。你说我带坏她——那她为什么要离婚？日子过得好好的会想离吗？
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 林慧兰你算什么东西？你有什么资格管我家的事？}
  - {speaker: CHAR-001, line: 我是她朋友。她的事就是我的事。你说我带坏你老婆——那她为什么要离婚？她日子过得好好的会想离吗？}
- segment_id: EP44-SEG05
  shot_ids: [EP44-S05]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫憋了几秒说我对她不好吗我让她吃让她穿。慧兰说你对她好在哪里说出来听听。他张嘴想说但发现能说出口的都是"我没打她"——这叫什么好？他愣住了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 我对她不好吗？我让她吃让她穿！她还有什么不满意的？}
  - {speaker: CHAR-001, line: 那你对她好在哪里？你说出来让我听听。}
  - {speaker: CHAR-001, line: 说不出来了？因为你自己也知道——那些不叫好。}
- segment_id: EP44-SEG06
  shot_ids: [EP44-S06]
  duration_sec: 10
  speakers: [CHAR-GRP-002, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫恼羞成怒往前冲了一步。慧兰不躲不闪不紧不慢拿起手机打开录像对准他——你继续说。我录着。你想让多少人看到你现在的样子？
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 你少跟我讲这些大道理！我老婆的事轮不到你管！}
  - {speaker: CHAR-001, line: 你继续说。我录着。你想让多少人看到你现在的样子？}
- segment_id: EP44-SEG07
  shot_ids: [EP44-S07]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-GRP-002-L01, CHAR-001-L02]}
  assets:
    look_urls: {CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花的丈夫僵住了想去抢手机。慧兰退后一步——你再走一步我直接发网上。发到你们公司群发到小区业主群。你不是要脸吗我今天就让你要个够。他的气焰肉眼可见地矮了下去不敢动了。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
  dialogue:
  - {speaker: CHAR-001, line: 你再走一步，我直接发网上。发到你们公司群，发到小区业主群。}
  - {speaker: CHAR-001, line: 你不是要脸吗？我今天就让你要个够。}
- segment_id: EP44-SEG08
  shot_ids: [EP44-S08]
  duration_sec: 10
  speakers: [CHAR-007]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-007-L01, CHAR-GRP-002-L01]}
  assets:
    look_urls: {CHAR-007-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-007-L01.png, CHAR-GRP-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-002-L01.png}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}
  api:
    text: 翠花从沙发上站起来走到老公面前声音有点抖但坚定——我们的事我们自己解决。你要是继续闹那我明天就去法院起诉。她丈夫不敢相信地看着她——这个被骂了二十年从来没还过嘴的女人在说"起诉"两个字。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-007-L01, role: reference_image}
    - {file: CHAR-GRP-002-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-007, line: 我们的事——我们自己解决。不要到别人家闹。}
  - {speaker: CHAR-007, line: 你要是还想谈，我们回去好好说。你要是继续闹——那我明天就去法院起诉。}
