  CHAR-007: 爽朗大嗓门的中年女声；从恐惧（"是他……他跟踪我"）到缩在沙发上的不敢出声，到站起来说出那句话时的颤抖但坚定（"我明天就去法院起诉"）——从恐惧到爆发
  CHAR-GRP-002: 阴阳怪气的中老年声音转为愤怒粗哑的男性声音（翠花的丈夫）——从砸门怒吼（"王翠花你给我出来！"）到气急败坏的辱骂，到被手机录像后气焰矮下去的嚅嗫——声音从高到低
