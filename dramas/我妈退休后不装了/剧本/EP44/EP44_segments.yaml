    text: 林家客厅·下午。慧兰和翠花在包饺子。翠花说离婚的事已经跟老公摊牌了他气得摔了杯子。话音未落门被拍得山响——外面传来吼声"王翠花你给我出来！"翠花脸白了。慧兰站起来平静地说别怕。在我家他不敢怎么样。
    content_roles:
    - {file: SCENE-001, role: reference_image}
    - {file: CHAR-001-L02, role: reference_image}
    - {file: CHAR-007-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-002, line: 王翠花！你给我出来！你以为你躲得了？}
  - {speaker: CHAR-007, line: 是他……他跟踪我。}
  - {speaker: CHAR-001, line: 别怕。在我家，他不敢怎么样。}
