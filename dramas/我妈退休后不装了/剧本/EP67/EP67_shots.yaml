- shot_id: EP67-S02; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}; api: {text: 张蕾放下手机，身体前倾表情认真。张明转头看她，一脸不解。客厅暖黄灯光照着三人。}; dialogue: [{speaker: CHAR-005, line: 妈，我是做商业的。投资公司的套路我见过——他们要的是你的故事和品牌，不是你的面。}, {speaker: CHAR-003, line: 那人家给钱还不好？}, {speaker: CHAR-005, line: 拿了钱就不是你的了。}]}
- shot_id: EP67-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-004-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-004-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-004: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-004-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 王芳插话，手指敲着茶几，一脸精明算计的表情。林慧兰看着她，表情平静。}; dialogue: [{speaker: CHAR-004, line: 我倒是觉得——能赚大钱干嘛不赚？你这一碗面一碗面卖，得卖到什么时候。}, {speaker: CHAR-001, line: 那你觉得我应该答应？}, {speaker: CHAR-004, line: 我没说答应——我就是说别跟钱过不去。}]}
- shot_id: EP67-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张明站起来，有点激动地说话。林慧兰抬头看着儿子，露出意外的表情。}; dialogue: [{speaker: CHAR-003, line: 我说两句——妈，你开店以来我一直在看。你比以前开心了，自信了。要是让投资公司插手——你还能这么开心吗？}, {speaker: CHAR-001, line: 张明——你第一次替我想。}]}
- shot_id: EP67-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png}; api: {text: 张大强站在客厅门口不肯进来，双手抱胸，一脸不屑。张蕾转头瞪他。}; dialogue: [{speaker: CHAR-002, line: 哼——我就说她折腾不起来。还连锁——能把自己那碗面煮好就不错了。}, {speaker: CHAR-005, line: 爸你能不能别每次都说风凉话？}, {speaker: CHAR-002, line: 我说的是事实！}]}
- shot_id: EP67-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}; api: {text: 林慧兰站起来，平静地面对张大强。她身姿挺拔，眼神坚定。张大强被她看得有些愣住。}; dialogue: [{speaker: CHAR-001, line: 张大强——我今天叫你来，不是听你打击我的。我是告诉你——不管我做什么决定，都跟你没关系了。}, {speaker: CHAR-002, line: （愣住，说不出话）}]}
- shot_id: EP67-S07; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}; api: {text: 林慧兰转向三个孩子，语气坚定地说出自己的决定。张明站起来，表情惊讶。}; dialogue: [{speaker: CHAR-001, line: 我想了一个星期——我决定不去见那个投资公司了。}, {speaker: CHAR-003, line: 妈——你确定？}, {speaker: CHAR-001, line: 确定。这面馆是我的孩子——不是拿来卖的。}]}
- shot_id: EP67-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-005: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张蕾站起来走到妈妈身边，手搭在妈妈肩膀上。林慧兰转头看女儿，眼眶微红。}; dialogue: [{speaker: CHAR-005, line: 妈，我支持你。你刚才说的那句话——面馆是你的孩子——比任何商业模式都值钱。}, {speaker: CHAR-001, line: 那你之前转了二十万给我——我不一定还得了这么快。}, {speaker: CHAR-005, line: 那个钱不要你还——那是我的投资。}]}
