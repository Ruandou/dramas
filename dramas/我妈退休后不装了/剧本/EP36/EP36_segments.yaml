  api:
    text: 两人拿着离婚证走出民政局大门。张大强停住脚步转头看着慧兰——憋了半天说了一句"你……保重"。慧兰看着他——没有恨没有怨，只是点了点头说"你也保重"。两人站在门口片刻，然后朝不同的方向走去。
