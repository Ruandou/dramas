    text: 慧兰穿过马路走到他面前。李建国把花递给她，没有说话。慧兰接过花低头闻了闻——淡淡的清香。她抬头看着他——眼眶有点热。她问他等了多久了。他说没多久——值得等的人，等多久都值得。
