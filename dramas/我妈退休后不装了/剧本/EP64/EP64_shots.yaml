    dialogue:
      - speaker: CHAR-003
        line: "爸还不睡？"
      - speaker: CHAR-002
        line: "明天要给你妈做糖醋排骨——我得把糖和醋的比例写清楚。"
      - speaker: CHAR-002
        line: "你说——她会吃吗？"
      - speaker: CHAR-003
        line: "会。她是开面馆的——不会拒绝一碗饭。"
