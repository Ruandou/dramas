    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 林家客厅。慧芳从法院回来推门进来满脸是泪，手里拿着判决书。慧兰吓了一跳问怎么了。慧芳说不出话把判决书塞到姐姐手里。慧兰打开一看——准予离婚，孩子抚养权归女方，男方支付经济补偿。慧兰的手也抖了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-010-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐——}
  - {speaker: CHAR-001, line: 慧芳？怎么了？}
  - {speaker: CHAR-001, line: 判了？}
  - {speaker: CHAR-010, line: 判了……都判给我了。}
- segment_id: EP32-SEG02
  shot_ids: [EP32-S02]
  duration_sec: 10
  speakers: [CHAR-001, CHAR-010]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧兰看完判决书眼眶红了。她放下判决书走过去一把抱住妹妹——太好了。慧芳在姐姐怀里哭得像个孩子。她说我赢了，我真的赢了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 好。太好了。}
  - {speaker: CHAR-010, line: 姐……我赢了……我真的赢了……}
- segment_id: EP32-SEG03
  shot_ids: [EP32-S03]
  duration_sec: 10
  speakers: [CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-010-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 姐妹俩抱着哭了很久。慧芳哭着说把聊天记录转账记录全拿出来了法官信她了。慧兰拍着她的背说你做得对，你比他勇敢。慧芳说是你教我的——不为自己活一次这辈子就白活了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-010-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐……是他先出轨的……法官信我了。}
  - {speaker: CHAR-010, line: 我把证据都拿出来了——聊天记录……转账记录……他赖不掉了。}
  - {speaker: CHAR-001, line: 你做得对。你比他勇敢。}
  - {speaker: CHAR-010, line: 是你教我的。你说的——不为自己活一次，这辈子就白活了。}
- segment_id: EP32-SEG04
  shot_ids: [EP32-S04]
  duration_sec: 10
  speakers: [CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-010-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 姐妹俩在沙发上坐下来。慧芳把判决书像宝贝一样叠好收起来。她说以前觉得自己这辈子完了——四十多岁没工作老公出轨谁还要她。现在觉得才刚刚开始。慧兰认真地看着她说——一个人不是靠别人活的，是自己活的。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-010-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐……我以前觉得自己这辈子完了。}
  - {speaker: CHAR-001, line: 现在呢？}
  - {speaker: CHAR-010, line: 现在觉得——才刚刚开始。}
  - {speaker: CHAR-001, line: 这就对了。}
  - {speaker: CHAR-010, line: 你知道我以前怎么想的吗——四十多岁了，没工作，老公出轨，谁还要我。}
  - {speaker: CHAR-001, line: 慧芳。一个人不是靠别人活的——是自己活的。}
- segment_id: EP32-SEG05
  shot_ids: [EP32-S05]
  duration_sec: 10
  speakers: [CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-010-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧芳从包里拿出一张纸——是她在法院门口复印的慧兰的判决书副本。她的判了可姐姐的还没出结果。她担心地看着姐姐说张大强的律师挺厉害的。慧兰沉默着没说话。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-010-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐——我在法院门口……复印了一份你的判决书。}
  - {speaker: CHAR-001, line: 还没判。}
  - {speaker: CHAR-010, line: 我知道。姐……你说，你的会怎么判？}
  - {speaker: CHAR-001, line: 不知道。}
  - {speaker: CHAR-010, line: 张大强那个律师……挺厉害的。}
- segment_id: EP32-SEG06
  shot_ids: [EP32-S06]
  duration_sec: 10
  speakers: [CHAR-010]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧兰沉默着把纸合上放在茶几上。慧芳认真地看着她说——姐，不管你的官司赢不赢，你都已经赢了。你教会了我怎么活。慧兰眼眶热了，拍了拍妹妹的手没说话。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐——不管你的官司赢不赢——你都已经赢了。}
  - {speaker: CHAR-010, line: 你教会了我——怎么活。}
- segment_id: EP32-SEG07
  shot_ids: [EP32-S07]
  duration_sec: 10
  speakers: [CHAR-001, CHAR-010]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧兰去倒水回来看到慧芳坐在沙发上把判决书翻来覆去地看。慧兰站在门口看了一会儿——想起几个月前妹妹刚来投奔时瑟缩在门口的样子。她问看了几遍了？慧芳不好意思地笑了说第五遍了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 看了几遍了？}
  - {speaker: CHAR-010, line: 第五遍了。}
  - {speaker: CHAR-001, line: 再看就要被你翻烂了。}
- segment_id: EP32-SEG08
  shot_ids: [EP32-S08]
  duration_sec: 10
  speakers: [CHAR-010, CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-010-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 慧芳喝了口水说今天法官宣判的时候脑子里全是姐说的"不为自己活一次这辈子就白活了"。她说那是她这辈子听过的最有力量的话。慧兰看着妹妹有些感动但没说什么只是笑了——傻妹妹。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-010-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-010, line: 姐你知道吗——今天法官宣判的时候，我脑子里全是你说的话。}
  - {speaker: CHAR-001, line: 哪句？}
  - {speaker: CHAR-010, line: 「不为自己活一次，这辈子就白活了」。}
  - {speaker: CHAR-010, line: 姐——那句话……是我这辈子听过的最有力量的话。}
  - {speaker: CHAR-001, line: 傻妹妹。}
- segment_id: EP32-SEG09
  shot_ids: [EP32-S09]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-001, look_ids: [CHAR-001-L01, CHAR-010-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-010-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-010-L01}
    scene_urls: {SCENE-001: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001}
  api:
    text: 姐妹俩依偎在沙发上窗外暮色渐沉。慧兰看着窗外想着自己的官司——我的判决会怎么判呢。慧芳靠在她肩膀上已经睡着了脸上有泪痕但嘴角是笑的。慧兰低头看了看妹妹轻轻揽住她闭上了眼睛——不管怎么判，我都不会再回去了。
    content_roles:
    - {file: SCENE-001, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-010-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 我的判决……会怎么判呢……}
  - {speaker: CHAR-001, line: 不管怎么判——我都不会再回去了。}
