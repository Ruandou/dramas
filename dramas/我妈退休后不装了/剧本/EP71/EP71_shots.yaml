- shot_id: EP71-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 林慧兰拿起手机看微信，露出欣慰的表情。窗外阳光照进客厅。}; dialogue: [{speaker: CHAR-001, line: （读微信）妈，我下个月升总监了。面试的时候面试官问我谁对我影响最大——我说是我妈。}, {speaker: CHAR-001, line: （自言自语）我影响了她……以前她说我'老糊涂了'。}]}
- shot_id: EP71-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 林慧兰翻到手机里翠花在分店门口的照片，照片里翠花笑得很灿烂。}; dialogue: [{speaker: CHAR-001, line: 翠花那家分店——生意比我这主店还好。谁能想到——一年前她还连离婚都不敢提。}, {speaker: CHAR-001, line: 翠花说——女人离了婚才算真正活明白。}]}
