- shot_id: EP71-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-001.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 电话响了。林慧兰走到茶几旁接起电话，表情从疑惑变成惊讶。}; dialogue: [{speaker: CHAR-001, line: 喂？}, {speaker: CHAR-GRP-001, line: 请问是林慧兰女士吗？我是卫视女性励志节目的编导——我们想邀请您来参加我们的节目录制。}, {speaker: CHAR-001, line: 我？上电视？}, {speaker: CHAR-GRP-001, line: 对——您的故事感动了很多人。}]}
