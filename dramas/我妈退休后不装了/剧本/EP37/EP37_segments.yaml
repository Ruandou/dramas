  - {speaker: CHAR-001, line: 我活了六十年——今天是第一次觉得，日子是自己的了。}
  - {speaker: CHAR-001, line: 以前做的每一顿饭，洗的每一件衣服，忍的每一次委屈——都是为了别人。}
  - {speaker: CHAR-001, line: 今天开始——我想为自己活了。}
  - {speaker: CHAR-007, line: 你终于醒了。}
