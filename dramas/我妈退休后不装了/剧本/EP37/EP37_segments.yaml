    - {file: CHAR-007-L01, role: reference_image}
  dialogue:
  - {speaker: CHAR-GRP-001, line: 慧兰姐，以后打算干什么？}
  - {speaker: CHAR-001, line: 先把日子过成自己的。不用给谁做饭，不用等谁回家——想去哪去哪。}
