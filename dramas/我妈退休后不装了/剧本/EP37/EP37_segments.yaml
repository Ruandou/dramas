    text: 慧兰端着杯子声音有点哽咽——活了六十年第一次觉得日子是自己的了。以前做的每顿饭洗的每件衣服忍的每次委屈都是为了别人。今天开始想为自己活了。姐妹们安静了几秒然后掌声响起来。翠花抹着眼睛说你终于醒了。
