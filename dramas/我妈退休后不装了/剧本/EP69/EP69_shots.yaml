- shot_id: EP69-S02; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张昊跑到奶奶面前，兴奋地从书包里掏出一张作文纸。林慧兰好奇地弯下腰看。}; dialogue: [{speaker: CHAR-008, line: 奶奶——我给你看个东西！}, {speaker: CHAR-001, line: 什么呀？考试卷子吗？}, {speaker: CHAR-008, line: 不是！是作文！老师说我写得好——让我念给家人听！}]}
- shot_id: EP69-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png}; api: {text: 张明在旁边坐下。林慧兰放下抹布，认真地看着孙子。张昊清清嗓子，准备念作文。}; dialogue: [{speaker: CHAR-008, line: （清清嗓子念）我的奶奶——题目：我最崇拜的人。}, {speaker: CHAR-001, line: （愣了一下）崇拜……我？}, {speaker: CHAR-003, line: 我也第一次听——他说要念给你听。}]}
- shot_id: EP69-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张昊认真地捧着作文纸念。林慧兰听着，眼眶开始发红。面馆暖色灯光照在祖孙俩身上。}; dialogue: [{speaker: CHAR-008, line: 我最崇拜的人是我奶奶。我奶奶以前是一个家庭主妇——每天做饭洗衣服带我。后来有一天她变了——她开始为自己活了。}, {speaker: CHAR-001, line: （眼眶开始发红）}]}
- shot_id: EP69-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张昊继续摇头晃脑念作文。林慧兰的眼泪在眼眶里打转，但她努力保持微笑。}; dialogue: [{speaker: CHAR-008, line: 奶奶开了一家面馆，面特别好吃。奶奶还跳舞跳得很棒。奶奶说女人不用靠别人——自己也能过得很好。我觉得奶奶很酷。}]}
- shot_id: EP69-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 林慧兰的眼泪终于掉下来了。她赶紧转过身假装看别处。张昊放下作文纸，担心地看着奶奶。}; dialogue: [{speaker: CHAR-008, line: 奶奶——你怎么哭了？是不是我念得不好？}, {speaker: CHAR-001, line: 没有……你念得很好。奶奶是……太高兴了。}]}
- shot_id: EP69-S07; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-003-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-003: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-003-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张明站起来走到妈妈身边，看着妈妈流泪自己也动容了。林慧兰擦了擦眼泪。}; dialogue: [{speaker: CHAR-003, line: 妈——你看，连小昊都看懂了。}, {speaker: CHAR-001, line: 我没想到……家里最小的一个，反而是最懂我的。}, {speaker: CHAR-003, line: 妈——对不起。我以前不懂你。}]}
- shot_id: EP69-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png, CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png}; api: {text: 张昊拉着奶奶的手，仰头看着她，眼神天真认真。林慧兰低头看着孙子，眼泪又涌上来。}; dialogue: [{speaker: CHAR-008, line: 奶奶！我作文最后写了一句话——我说等我长大了——我也要像奶奶一样勇敢！}, {speaker: CHAR-001, line: 小昊……}, {speaker: CHAR-008, line: 奶奶你说——你现在开心吗？}]}
- shot_id: EP69-S09; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png]; assets: {look_urls: {CHAR-001-L02: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-008-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-010.png}; content_roles: {CHAR-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L02.png, CHAR-008: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-008-L01.png}; api: {text: 林慧兰蹲下来，双手扶着孙子的肩膀，含泪笑着回答。张昊开心地笑了。面馆暖色灯光笼罩着祖孙俩。}; dialogue: [{speaker: CHAR-001, line: 开心。特别开心。小昊——你记住奶奶这句话——不管什么时候，为自己活都不晚。}, {speaker: CHAR-008, line: 那我长大了可以开面馆吗？}, {speaker: CHAR-001, line: 你可以开任何你想开的东西。}]}
