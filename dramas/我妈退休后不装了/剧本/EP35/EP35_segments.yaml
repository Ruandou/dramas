  - {speaker: CHAR-002, line: 每天早上五点半……晚上十一点……}
  - {speaker: CHAR-002, line: 她从来没买过一件贵衣服……}
  - {speaker: CHAR-002, line: 从来没说过……她想要什么。}
  - {speaker: CHAR-002, line: 我四十年……都没问过她一句。}
