  api:
    text: 慧兰坐在沙发上拿着手机——强制执行申请已经撤回了。她做到了，但没有高兴的感觉。慧芳问姐你怎么不高兴。慧兰说以为会高兴的——但他终于低头了，四十年的委屈终于有结果了——但她只觉得很累。四十年换来的赢没什么好高兴的。
