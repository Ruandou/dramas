  - {speaker: CHAR-001, line: 我以为我会高兴。他终于低头了。四十年的委屈——终于有结果了。}
  - {speaker: CHAR-001, line: 但我只觉得很累。四十年换来的赢——没什么好高兴的。只是——终于可以翻篇了。}
