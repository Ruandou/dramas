  api:
    text: 张大强一个人坐在空荡荡的客厅里。钱已经转过去了，账户解冻了，但他没有如释重负的感觉。他第一次认认真真地想——这四十年来林慧兰每天到底在做什么。想到每天早上五点半晚上十一点、她从来没买过一件贵衣服、从来没说过一句"我想要什么"——他捂住了脸。
