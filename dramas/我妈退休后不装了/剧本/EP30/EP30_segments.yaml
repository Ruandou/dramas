defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast
  ratio: '9:16'
  resolution: 720p
  duration: 5
  generate_audio: false
  watermark: false
  prompt_suffix: 竖向构图 9:16，温暖真实的生活质感，柔和的家庭光线，自然肤色，细腻纹理，电影级打光，细节丰富，高分辨率，写实摄影风格
  negative_prompt: 文字内容，模糊，低质量，扭曲的面部，畸形的手，水印，签名，卡通，动漫，插图风格，过度锐化，过度饱和，恐怖，灵异，血腥，暴力，政治元素，低俗暗示，卧姿，色情，泳装，裸露，吸烟，酗酒
voice_prompts:
  CHAR-001: 温和沉稳的中年女声；从按住律师说"让我自己来"的平静坚定，到法庭陈述时的字字铿锵（"四十年一万四千六百天"），到回忆年轻时梦想的微微颤抖，到最后说出"我不欠任何人"时的释然有力——声音从平静到激昂再到释然的完整弧线
  CHAR-002: 低沉粗哑的中老年男声；从起初不屑哼声（"看她能说出什么来"）到急了插嘴（"你胡说！"）被反问后哑口无言（"我……"）到最后低头承认（"我没想过你是这么想的"）——声音从高到低被打掉气势
  CHAR-005: 干净利落的职业女性声音；从旁听席上的紧张沉默，到站起来挽住妈妈时声音哑了（"我们回家"），到走出法庭后忍着泪笑着说"特别行"——声音里的情感从内敛到释放
