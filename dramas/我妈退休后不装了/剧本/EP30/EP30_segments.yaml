    text: 家事法庭开庭。张大强的律师在攻击慧兰"不履行妻子义务"。慧兰的律师要反驳——慧兰伸手按住律师，站起来说"法官，我有话要说"。张大强不屑地哼了一声。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-002-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 法官，我有话要说。}
  - {speaker: CHAR-002, line: 看她能说出什么来。}
- segment_id: EP30-SEG02
  shot_ids: [EP30-S02]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-001-L01, CHAR-005-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 慧兰慢慢站起来。她看了女儿一眼给了一个安心的眼神，然后转向法官。声音平静但每个字都清清楚楚——四十年，一万四千六百天，没有一天休息过。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-005-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 法官，我为这个家做了四十年家务。}
  - {speaker: CHAR-001, line: 没有工资，没有假期，没有退休金。}
  - {speaker: CHAR-001, line: 我每天早上五点半起床，晚上十一点才能睡。}
  - {speaker: CHAR-001, line: 四十年——一万四千六百天。我没有一天休息过。}
- segment_id: EP30-SEG03
  shot_ids: [EP30-S03]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-001-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 慧兰说起年轻时是舞蹈老师，有一个去省里进修的机会——因为结婚放弃了。想出去工作他说不用，想学东西他说没用。我的人生从来没由我自己决定过。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-001, line: 我年轻的时候是舞蹈老师。}
  - {speaker: CHAR-001, line: 有一个去省里进修的机会——我放弃了。因为他说，女人结了婚要以家庭为重。}
  - {speaker: CHAR-001, line: 我想出去工作——他说不用。我想学点东西——他说学那些有什么用。}
  - {speaker: CHAR-001, line: 我的人生——从来没由我自己决定过。}
- segment_id: EP30-SEG04
  shot_ids: [EP30-S04]
  duration_sec: 10
  speakers: [CHAR-002, CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-002-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 张大强坐不住了突然插嘴说"你胡说"。慧兰没有激动——她平静地转向他，问他敢不敢当着法官的面说支持过她。张大强张了张嘴说不出话。慧兰没等他回答——他不记得了，因为他从来没在意过。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-002-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-002, line: 你胡说！我什么时候不让你去了？}
  - {speaker: CHAR-001, line: 张大强，你敢当着法官的面说——你支持过我？}
  - {speaker: CHAR-002, line: 我……}
  - {speaker: CHAR-001, line: 法官，他不记得了。因为他从来没在意过。}
- segment_id: EP30-SEG05
  shot_ids: [EP30-S05]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-001-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 慧兰的声音开始抖——四十年的委屈终于有机会说出来。她说我养大了两个孩子照顾了公婆伺候了丈夫，我做的饭他吃了四十年洗的衣服穿了四十年——我不欠这个家任何东西。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-001, line: 这四十年来，我没有对不起任何人。}
  - {speaker: CHAR-001, line: 我养大了两个孩子，照顾了公婆，伺候了丈夫。}
  - {speaker: CHAR-001, line: 我做的饭他吃了四十年，我洗的衣服他穿了四十年。}
  - {speaker: CHAR-001, line: 我收拾的家他住了四十年——我不欠这个家任何东西。}
- segment_id: EP30-SEG06
  shot_ids: [EP30-S06]
  duration_sec: 10
  speakers: [CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-001-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 法庭安静。慧兰缓了一口气说出今天真正想说的话——不是来要钱的，是来要一个说法的。我这一辈子值不值得？我不欠任何人——包括你，张大强。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
  dialogue:
  - {speaker: CHAR-001, line: 今天我站在这里——不是来要钱的。}
  - {speaker: CHAR-001, line: 我是来要一个说法的。}
  - {speaker: CHAR-001, line: 我这一辈子——值不值得？}
  - {speaker: CHAR-001, line: 我不欠任何人。包括你——张大强。}
- segment_id: EP30-SEG07
  shot_ids: [EP30-S07]
  duration_sec: 10
  speakers: [CHAR-002, CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-002-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 慧兰说完了。法庭安静得能听见呼吸。张大强低着头——他第一次没有反驳。法官宣布休庭择日宣判。慧兰深深吸了一口气——憋了四十年的话终于说出来了，胸口从来没有这么轻过。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-002-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-002, line: 我没想过……你是这么想的。}
  - {speaker: CHAR-001, line: 你没想过的事情——太多了。}
- segment_id: EP30-SEG08
  shot_ids: [EP30-S08]
  duration_sec: 10
  speakers: [CHAR-005, CHAR-001]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-005-L01, CHAR-001-L01]}
  assets:
    look_urls: {CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01, CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 旁听席上张蕾站起来穿过座位走到妈妈身边。慧兰还站在那里有些恍惚。张蕾什么都没说只是挽住妈妈的手臂说妈我们回家。慧兰看到女儿眼眶一下子红了——你全都听到了？嗯，全都听到了。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-005-L01, role: reference_image, label: 图2}
    - {file: CHAR-001-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-005, line: 妈。}
  - {speaker: CHAR-001, line: 蕾蕾……}
  - {speaker: CHAR-005, line: 我们回家。}
  - {speaker: CHAR-001, line: 你……都听到了？}
  - {speaker: CHAR-005, line: 嗯。全都听到了。}
- segment_id: EP30-SEG09
  shot_ids: [EP30-S09]
  duration_sec: 10
  speakers: [CHAR-001, CHAR-005]
  refs: {scene_id: SCENE-008, look_ids: [CHAR-001-L01, CHAR-005-L01]}
  assets:
    look_urls: {CHAR-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-001-L01, CHAR-005-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-005-L01}
    scene_urls: {SCENE-008: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-008}
  api:
    text: 母女俩走出法庭。阳光从走廊窗户洒进来照在她们身上。慧兰眯了一下眼睛问妈刚才还行吧。张蕾看着妈妈忍着泪笑着说特别行——我等了二十八年今天终于听到了。慧兰拍拍女儿的手说妈也等了四十年今天终于说出来了。两人挽着手走进阳光里。
    content_roles:
    - {file: SCENE-008, role: reference_image, label: 图1}
    - {file: CHAR-001-L01, role: reference_image, label: 图2}
    - {file: CHAR-005-L01, role: reference_image, label: 图3}
  dialogue:
  - {speaker: CHAR-001, line: 妈刚才……还行吧？}
  - {speaker: CHAR-005, line: 特别行。}
  - {speaker: CHAR-001, line: 那就好。}
  - {speaker: CHAR-005, line: 妈——你刚才说的那些话……我等了二十八年，今天终于听到了。}
  - {speaker: CHAR-001, line: 妈也等了四十年——今天终于说出来了。}
