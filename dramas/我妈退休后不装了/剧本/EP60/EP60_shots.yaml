        line: "慧兰——你做的面真的是最好吃的。我活到六十五岁才说这句话——太晚了。但还是要说。"
      - speaker: CHAR-007
        line: "慧兰——你刚才真帅。"
      - speaker: CHAR-001
        line: "是吗？我觉得我做的面更帅。"
