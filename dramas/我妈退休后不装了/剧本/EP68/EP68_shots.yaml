- shot_id: EP68-S02; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}; api: {text: 张大强直起腰，看着广场发愣，眼神空洞。大姐关切地走过来看他。}; dialogue: [{speaker: CHAR-002, line: （自言自语）以前都是她扫……我从来没动过手。}, {speaker: CHAR-GRP-001, line: 您说啥？累了就歇会儿。}, {speaker: CHAR-002, line: 没、没——我说这广场真大……扫起来还挺费劲。}, {speaker: CHAR-GRP-001, line: 可不是嘛！我们每天扫一遍。}]}
- shot_id: EP68-S03; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}; api: {text: 社区主任大姐送水过来，看到张大强穿着红马甲扫地，表情意外。张大强尴尬地笑了笑。}; dialogue: [{speaker: CHAR-GRP-001, line: 张大哥今天第一天来？难得啊——以前请都请不动你。}, {speaker: CHAR-002, line: 以前……是我糊涂。}, {speaker: CHAR-GRP-001, line: 咋了？受啥刺激了？}, {speaker: CHAR-002, line: 一个人在家待着——想明白了一些事。}]}
- shot_id: EP68-S04; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}; api: {text: 张大强坐在花坛边喝水，表情复杂地看着广场上的人群，若有所思。大姐也坐下来陪他。}; dialogue: [{speaker: CHAR-002, line: （自言自语）面馆……以前她在家里忙了一辈子，我连句谢谢都没说过。现在她开了面馆——倒过得挺好。}, {speaker: CHAR-GRP-001, line: 张大哥你说啥？}, {speaker: CHAR-002, line: 没什么——想起一些以前的事。}, {speaker: CHAR-GRP-001, line: 想开点——人得往前看。}]}
- shot_id: EP68-S05; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}; api: {text: 广场上几个小孩在踢足球，球滚到花坛边。张大强弯腰帮他们捡球，一个小孩跑过来接过球。}; dialogue: [{speaker: CHAR-GRP-001, line: 谢谢爷爷！}, {speaker: CHAR-002, line: （愣了一下）爷爷……叫得还挺好听的。}, {speaker: CHAR-GRP-001, line: 爷爷你笑起来还挺好看的嘛！你应该多笑笑。}, {speaker: CHAR-002, line: 我笑了吗？}, {speaker: CHAR-GRP-001, line: 笑了！可好看了！}]}
- shot_id: EP68-S06; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}; api: {text: 张大强摸了摸自己的脸，表情复杂。他弯下腰继续扫地，动作比之前熟练了一些，阳光照在他红色马甲上。}; dialogue: [{speaker: CHAR-002, line: （内心独白）活了大半辈子——今天才觉得做点事心里踏实。以前总觉得自己了不起……其实啥也不是。}]}
- shot_id: EP68-S07; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}; api: {text: 一个小女孩跑过来递给张大强一瓶水。张大强蹲下来，和小女孩说话，表情变得柔和。}; dialogue: [{speaker: CHAR-GRP-001, line: 爷爷喝水！妈妈说志愿者辛苦了！}, {speaker: CHAR-002, line: 谢谢啊……你几岁啦？}, {speaker: CHAR-GRP-001, line: 我八岁！}, {speaker: CHAR-002, line: 哦……我孙子也八岁。你妈妈在哪？}, {speaker: CHAR-GRP-001, line: 在那边买菜！爷爷你扫地累不累？}]}
- shot_id: EP68-S08; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png}; api: {text: 张大强一个人坐在长椅上，从口袋里掏出一封皱巴巴的信。他看着信发呆，信上字迹模糊。}; dialogue: [{speaker: CHAR-002, line: （看着信自言自语）我写给你的信——你退回来了。也是……说了四十年伤人的话，打了一辈子你——写一封信就想抹平。}, {speaker: CHAR-002, line: 哪有这么便宜的事……张大强啊张大强——你真是个混蛋。}]}
- shot_id: EP68-S09; mode: i2v_ref; refs: [https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png]; assets: {look_urls: {CHAR-002-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001-L01: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}, scene_url: https://drama-reference-images.tos-cn-beijing.volces.com/scenes/我妈退休后不装了/SCENE-005.png}; content_roles: {CHAR-002: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-002-L01.png, CHAR-GRP-001: https://drama-reference-images.tos-cn-beijing.volces.com/looks/我妈退休后不装了/CHAR-GRP-001-L01.png}; api: {text: 张大强把信折好放回口袋，站起来继续扫地。夕阳照在他红色马甲上，大姐在远处喊他收工。}; dialogue: [{speaker: CHAR-002, line: （自言自语）不原谅就不原谅吧。}, {speaker: CHAR-002, line: 但剩下的日子——我得做个像样的人。}, {speaker: CHAR-GRP-001, line: 张大哥！收工了！明天还来不？}, {speaker: CHAR-002, line: 来。明天还来。}]}
