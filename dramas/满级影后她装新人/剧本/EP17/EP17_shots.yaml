shots:
  - shot_id: EP17-S01
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-GRP-18, CHAR-001, CHAR-002]
    looks: [CHAR-GRP-18-L01, CHAR-001-L01, CHAR-002-L01]
    shot_size: 中全景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "片场布景改为暖色调——暖黄路灯道具、长椅、人造落叶铺地，营造都市夜晚浪漫氛围。导演站在监视器后做最后调整。苏念晚站在标记点前，低头整理衬衫袖口，深呼吸。陆景深从化妆间走出来，大衣换成了灰色休闲风衣，目光落在她身上。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·稳住
        text: "感情戏……控制好分寸。"
      - speaker: CHAR-GRP-18
        emotion: 职业·指令
        text: "灯光再偏左一点——好。演员就位！"

  - shot_id: EP17-S02
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: 中近景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "苏念晚站在长椅旁，陆景深从对面缓步走来停在她面前。他高出她半个头，低头看她时，那双凤眼里带着她看不懂的情绪。苏念晚的指尖微微蜷缩。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·警觉
        text: "他走近了。保持住。"
      - speaker: CHAR-002
        emotion: 平静·表演前
        text: "准备好了？"
      - speaker: CHAR-001
        emotion: 抬眼·平静
        text: "嗯。"

  - shot_id: EP17-S03
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-GRP-18]
    looks: [CHAR-GRP-18-L01]
    shot_size: 中景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "导演举起场记板。监视器屏幕上出现两人同框的构图。"
    dialogue:
      - speaker: CHAR-GRP-18
        emotion: 高声
        text: "第三场第一次——开始！"

  - shot_id: EP17-S04
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: 近景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 缓推
    visual: "苏念晚进入角色，抬起眼时目光柔和了三分——这是'林小晚'的温柔眼神，不是苏念晚的锋芒。陆景深看着她，他的表演从冷面变成了克制的心动。"
    dialogue:
      - speaker: CHAR-001
        emotion: 表演·温柔
        text: "你来了。我等了你很久。"
      - speaker: CHAR-002
        emotion: 表演·低沉
        text: "等我？为什么等我？"
      - speaker: CHAR-001
        emotion: 表演·轻笑
        text: "因为我知道你会来。"

  - shot_id: EP17-S05
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: 特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "陆景深的目光突然变了——不是角色的眼神，是他自己的。那双狭长凤眼里多了一丝认真和试探。苏念晚敏锐地察觉到了异样——词不对。剧本里没有接下来的这句。她呼吸微滞。"
    dialogue:
      - speaker: CHAR-002
        emotion: 低声·偏离剧本
        text: "你是不是每天都在躲我？"
      - speaker: CHAR-001
        emotion: 微怔·接住
        text: "我……没有。"

  - shot_id: EP17-S06
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-002, CHAR-001]
    looks: [CHAR-002-L01, CHAR-001-L01]
    shot_size: 大特写
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "陆景深又近了一步——近到苏念晚能看清他睫毛的弧度。他压低了声音，像只对她一个人说话。监视器后的导演皱了皱眉——这词不对——但没说停。苏念晚的耳尖开始泛红。"
    dialogue:
      - speaker: CHAR-002
        emotion: 低声·进一步
        text: "那你为什么不敢看我？"
      - speaker: CHAR-001
        emotion: 内心·漏拍
        text: "不是剧本里的词……"
      - speaker: CHAR-001
        emotion: 抬眼·努力镇定
        text: "我没有躲你。"

  - shot_id: EP17-S07
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-GRP-18]
    looks: [CHAR-GRP-18-L01]
    shot_size: 中景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "导演猛地从监视器后站起来，眼睛发亮，兴奋地大喊——他以为这是即兴发挥的巅峰表演。"
    dialogue:
      - speaker: CHAR-GRP-18
        emotion: 兴奋·大喊
        text: "卡！过！这段太好了！"

  - shot_id: EP17-S08
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-005, CHAR-001, CHAR-002]
    looks: [CHAR-005-L01, CHAR-001-L01, CHAR-002-L01]
    shot_size: 中全景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "片场瞬间热闹起来。乔乐安从工作人员身后跳出来，双手捂脸尖叫。苏念晚退后一步拉开距离，耳根红了一片，假装低头整理衣角。陆景深站在原地，看着她慌乱的样子，嘴角微不可察地扬起。"
    dialogue:
      - speaker: CHAR-005
        emotion: 激动·尖叫
        text: "天哪天哪天哪！姐姐你们也太甜了吧！"
      - speaker: CHAR-001
        emotion: 低头·慌乱
        text: "乐乐别闹……"
      - speaker: CHAR-002
        emotion: 低声·只有自己听到
        text: "果然。"

  - shot_id: EP17-S09
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 镜头跟随
    visual: "苏念晚走到休息区角落，背对人群。她抬起手按住胸口——心跳太快了，隔着衬衫都能感觉到。她闭上眼，深吸一口气，试图让脸上的热度退下去。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·慌乱
        text: "心跳这么快……冷静下来。"
      - speaker: CHAR-001
        emotion: 内心·自嘲
        text: "又不是没拍过感情戏。"

  - shot_id: EP17-S10
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "她睁开眼，看向片场方向——陆景深正被工作人员围着说话，他侧脸的线条在暖色灯光下格外清晰。她立刻移开视线。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·沉默两秒
        text: "可这次不一样。"
      - speaker: CHAR-001
        emotion: 内心·承认
        text: "不一样。"

  - shot_id: EP17-S11
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-005, CHAR-001]
    looks: [CHAR-005-L01, CHAR-001-L01]
    shot_size: 中近景
    duration_sec: 4
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "乔乐安一路小跑过来，一把抓住苏念晚的手臂来回晃，眼睛亮晶晶的。"
    dialogue:
      - speaker: CHAR-005
        emotion: 兴奋·机关枪
        text: "姐姐姐姐！你刚才那个反应绝了！我截图了！"
      - speaker: CHAR-001
        emotion: 无奈
        text: "截图删掉。"

  - shot_id: EP17-S12
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-005, CHAR-001]
    looks: [CHAR-005-L01, CHAR-001-L01]
    shot_size: 近景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "乔乐安凑近了压低声音，脸上带着八卦的笑容。苏念晚的笑容僵了一瞬——然后勉力维持住。"
    dialogue:
      - speaker: CHAR-005
        emotion: 八卦·压低
        text: "你老实说——跟陆影帝搭戏，是不是心动了？"
      - speaker: CHAR-001
        emotion: 笑容僵住·强装镇定
        text: "演戏而已。"
      - speaker: CHAR-005
        emotion: 歪头·不信
        text: "是吗——你耳朵都红透了。"

  - shot_id: EP17-S13
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "收工了,片场灯光渐次熄灭。苏念晚独自坐在休息区角落的折叠椅上,周围人声渐远。她从口袋里掏出手机,屏幕亮光照着她的脸。"
    dialogue:
      - speaker: CHAR-001
        emotion: 独自·低语
        text: "只是演戏……别想太多。"

  - shot_id: EP17-S14
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 大特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "手机屏幕突然亮起——微信新消息通知。发送者头像:陆景深的侧影。苏念晚的手指悬在屏幕上方,犹豫了半秒。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·微微屏息
        text: "他发消息了……现在？"
      - speaker: CHAR-001
        emotion: 内心·犹豫
        text: "要不要点开……"

  - shot_id: EP17-S15
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 大特写
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 镜头推近
    visual: "她点开了消息。屏幕上的文字简短直接——像他这个人。苏念晚的瞳孔微微放大,睫毛颤了一下,呼吸变得很浅。手机的光映在她眼底。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·屏息
        text: "……"

  - shot_id: EP17-S16
    episode: EP17
    scene_id: SCENE-015
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 大特写
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "她的脸庞特写——从额头到下颌线缓缓泛起的红晕清晰可见。她咬住下唇,想压下那个不自觉浮起的笑意。但失败了。她闭上眼,然后睁开,像是终于对自己承认了什么。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·微颤
        text: "被他说中了……"
      - speaker: CHAR-001
        emotion: 内心·承认
        text: "是真的。"
