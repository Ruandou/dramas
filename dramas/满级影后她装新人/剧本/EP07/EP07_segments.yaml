segments:
  - segment_id: EP07-SEG01
    segment_no: 1
    summary: "出发通告——乔乐安兴奋谈论综艺录制，苏念晚暗自紧张"
    scene_id: SCENE-003
    duration_sec: 10
    shot_ids:
      - EP07-S01
      - EP07-S02
    transition_to_next: audio_bridge
    dialogue:
      - speaker: CHAR-005
        line: "姐姐！《星光少年》！我从小学就追的节目！"
        shot_id: EP07-S01
      - speaker: CHAR-005
        line: "听说沈逸辰超会搞气氛的，今天肯定好玩！"
        shot_id: EP07-S01
      - speaker: CHAR-005
        line: "姐姐你不紧张吗？"
        shot_id: EP07-S02
      - speaker: CHAR-001
        line: "还好。"
        shot_id: EP07-S02
      - speaker: CHAR-001
        type: inner
        line: "综艺录制——全场都是镜头。别出错。"
        shot_id: EP07-S02

  - segment_id: EP07-SEG02
    segment_no: 2
    summary: "录制现场——导演组紧张调度，苏念晚在侧台平复心情"
    scene_id: SCENE-006
    duration_sec: 10
    shot_ids:
      - EP07-S03
      - EP07-S04
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-GRP-15
        line: "练习生先等在侧台，互动环节再上！"
        shot_id: EP07-S03
      - speaker: CHAR-GRP-15
        line: "主持人就位！三分钟倒计时！"
        shot_id: EP07-S03
      - speaker: CHAR-001
        type: inner
        line: "见过比这大十倍的舞台。"
        shot_id: EP07-S04
      - speaker: CHAR-001
        type: inner
        line: "只是那时候……不用装。"
        shot_id: EP07-S04

  - segment_id: EP07-SEG03
    segment_no: 3
    summary: "沈逸辰登场——阳光主持人控场，随机点名苏念晚上台互动"
    scene_id: SCENE-006
    duration_sec: 11
    shot_ids:
      - EP07-S05
      - EP07-S06
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-006
        line: "《星光少年》现场的朋友们——掌声给自己好吗！"
        shot_id: EP07-S05
      - speaker: CHAR-006
        line: "好久不见，想我了吗？——肯定想了，不然你们不会坐在这儿对不对！"
        shot_id: EP07-S05
      - speaker: CHAR-006
        line: "今天有星耀的练习生朋友在现场对吧！来来来——互动环节，就你了！"
        shot_id: EP07-S06
      - speaker: CHAR-006
        line: "这位同学，上来上来！"
        shot_id: EP07-S06
      - speaker: CHAR-005
        line: "姐姐！叫你呢！"
        shot_id: EP07-S06

  - segment_id: EP07-SEG04
    segment_no: 4
    summary: "电影揭晓——苏念晚认出是自己获奖的《归途》，内心挣扎后决定演但要收敛"
    scene_id: SCENE-006
    duration_sec: 11
    shot_ids:
