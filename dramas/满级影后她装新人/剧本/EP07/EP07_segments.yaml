      - EP07-S10
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-001
        type: inner
        line: "三秒。够了。"
        shot_id: EP07-S09
      - speaker: CHAR-001
        line: "你说过——春天会来的。"
        shot_id: EP07-S09
      - speaker: CHAR-001
        line: "可我等了三个春天了。"
        shot_id: EP07-S09
      - speaker: CHAR-006
        type: inner
        line: "……这么快？"
        shot_id: EP07-S10
      - speaker: CHAR-005
        type: inner
        line: "天哪……"
        shot_id: EP07-S10
      - speaker: CHAR-GRP-15
        line: "这孩子……有东西啊。"
        shot_id: EP07-S10

  - segment_id: EP07-SEG06
