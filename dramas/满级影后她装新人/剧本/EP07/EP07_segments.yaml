      - EP07-S08
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-006
        line: "经典模仿环节——来，请看大屏幕！"
        shot_id: EP07-S07
      - speaker: CHAR-006
        line: "这段哭戏出自当年横扫各大奖项的电影《归途》——有人看过吗？——没看过也没关系，看就看这位同学怎么演！"
        shot_id: EP07-S07
      - speaker: CHAR-001
        type: inner
        line: "……是《归途》。是我拍的那场戏。"
        shot_id: EP07-S08
      - speaker: CHAR-001
        type: inner
        line: "拒绝——等于告诉所有人我有问题。演——等于可能暴露。"
        shot_id: EP07-S08
      - speaker: CHAR-001
        type: inner
        line: "演。但要演得……像一个新人。"
        shot_id: EP07-S08

  - segment_id: EP07-SEG05
    segment_no: 5
    summary: "三秒入戏——苏念晚闭眼三秒后泪落，全场死寂，不可能时刻"
    scene_id: SCENE-006
    duration_sec: 11
    shot_ids:
