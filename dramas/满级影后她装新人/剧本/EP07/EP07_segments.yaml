      - EP07-S12
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-001
        line: "他们说你再也不会回来了……"
        shot_id: EP07-S11
      - speaker: CHAR-001
        line: "他们说——要我忘了你。"
        shot_id: EP07-S11
      - speaker: CHAR-001
        line: "可春天来了又走……我还是在等。"
        shot_id: EP07-S11
      - speaker: CHAR-006
        line: "好。"
        shot_id: EP07-S12
      - speaker: CHAR-006
        line: "真的好。"
        shot_id: EP07-S12
      - speaker: CHAR-006
        line: "来，掌声送给她！"
        shot_id: EP07-S12

  - segment_id: EP07-SEG07
    segment_no: 7
    summary: "录制结束——后台乔乐安激动，沈逸辰认真称赞苏念晚"
    scene_id: SCENE-006
    duration_sec: 11
    shot_ids:
      - EP07-S13
      - EP07-S14
    transition_to_next: hard_cut
    dialogue:
      - speaker: CHAR-005
        line: "姐姐你看到沈逸辰的表情了吗！他都被你震住了！"
        shot_id: EP07-S13
      - speaker: CHAR-005
        line: "你不是说你是新人吗？新人怎么可能演成这样！"
        shot_id: EP07-S13
      - speaker: CHAR-001
        line: "可能……刚好有共鸣吧。"
        shot_id: EP07-S13
      - speaker: CHAR-006
        line: "林小晚是吧？刚才那段——真的可以。"
        shot_id: EP07-S14
      - speaker: CHAR-006
        line: "你以前学过表演？"
        shot_id: EP07-S14
      - speaker: CHAR-001
