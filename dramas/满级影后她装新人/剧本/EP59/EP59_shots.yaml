        - { file: CHAR-001-L02, role: reference_image, label: 图1 }
        - { file: SCENE-008, role: reference_image, label: 图2 }
    dialogue:
      - speaker: CHAR-001
        line: "一个人的平反——不够。我要让这个行业——再也不能随便毁掉任何人。"
      - speaker: CHAR-001
        line: "这件事——我一定要做到。"
      - speaker: CHAR-002
        line: "那——开始吧。"
      - speaker: CHAR-001
        line: "嗯。开始吧。"
