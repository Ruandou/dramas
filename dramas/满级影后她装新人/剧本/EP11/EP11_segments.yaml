# EP11 段落 API 配置 — 意外出圈
# 8 segments · 11 shots · 86s total
# model: doubao-seedance-2-0-fast
# ratio: 9:16

seedance_defaults:
  model: doubao-seedance-2-0-fast
  ratio: "9:16"
  resolution: 720p
  duration_sec: "8-10"
  generate_audio: true
  prompt_suffix: ", photorealistic, cinematic lighting, modern urban setting, 9:16 vertical frame, high detail, natural skin texture, film grain subtle"
  negative_prompt: "anime, cartoon, illustration, painting, watercolor, low quality, blurry, deformed face, extra limbs, extra fingers, mutated hands, watermark, text overlay, brand logo, oversaturated skin, plastic skin, uncanny valley, 3D render, CGI look"

voice_prompts:
  CHAR-001: "成年女性，28岁，声线清冷偏低，语速中等偏慢，平时克制内敛，说话精准有力，装傻时语速加快语气上扬带无辜感，关键时刻语调沉稳有穿透力，偶尔停顿制造张力"
  CHAR-005: "年轻女性，20岁，声线甜美活泼明亮，语速快说话像机关枪，语气充满活力和天真感，紧张时语速更快声音微颤，背叛后说话变得小心翼翼声音压低，赎罪后恢复开朗但多了一份沉稳"
  CHAR-007: "成年男性，35岁，语调平稳自信带微笑感，声线温润有说服力，语速中等不疾不徐，说话像在谈判滴水不漏，威胁时语气依然温和却令人不寒而栗，撕破脸后语调骤然冰冷直接"
  CHAR-009: "年轻女性，21岁，声线娇纵跋扈略带尖锐，语速中等偏快，说话带居高临下的优越感，被怼时声音拔高带怒意"
  # 以下 [待补] 群演的 voice_prompt 由 production-planner 在集间群演回补子循环中分配正式 ID 后，由 segment-builder 补充
  # CHAR-GRP-20 ([待补：练习生A]): 年轻女性，20岁，声线直率活泼，语速中等，说话带新人的好奇和惊叹感
  # CHAR-GRP-21 ([待补：练习生B]): 年轻女性，21岁，声线沉稳略带技术感，语速偏慢，说话带认真分析的语气
  # CHAR-GRP-22 ([待补：肖铭远助理]): 年轻女性，28岁，声线恭顺礼貌，语速中等，职业化语气带微笑感

