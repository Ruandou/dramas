shots:
  - shot_id: EP18-S01
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-006]
    looks: [CHAR-006-L01]
    shot_size: 中景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "综艺舞台灯光全开，巨大的LED屏上滚动着'新星计划杀青showcase'的炫彩字样。沈逸辰穿着浅蓝牛仔外套+白T站在舞台中央，手持话筒，标志性的灿烂笑容。全场观众欢呼声此起彼伏。"
    dialogue:
      - speaker: CHAR-006
        emotion: 热情·MC
        text: "各位观众朋友们——欢迎来到新星计划杀青showcase！"
      - speaker: CHAR-006
        emotion: 带动气氛
        text: "今晚的舞台属于这群最耀眼的年轻人！"

  - shot_id: EP18-S02
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003, CHAR-002]
    looks: [CHAR-003-L01, CHAR-002-L01]
    shot_size: 中全景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "镜头摇向台下嘉宾席。方芷晴坐在第一排评委席，穿着酒红色丝绒西装裙，面带完美微笑鼓掌。陆景深坐在她隔两个座位的位置，黑衣灰外套，单手随意地搭在扶手上，目光扫向舞台。"
    dialogue:
      - speaker: CHAR-006
        emotion: 画外音·兴奋
        text: "让我来介绍一下今晚的第一位表演者——"

  - shot_id: EP18-S03
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-006]
    looks: [CHAR-006-L01]
    shot_size: 中近景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "沈逸辰转身看向舞台入口，声音提高八度，现场欢呼声更热烈了。"
    dialogue:
      - speaker: CHAR-006
        emotion: 高呼
        text: "网剧《追光》女主角——林小晚！"

  - shot_id: EP18-S04
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 镜头跟随
    visual: "苏念晚从舞台侧面走出来。没有华丽服装——白衬衫+浅蓝牛仔裙，简单干净。她走到舞台中央的话筒架前，微微低头调整话筒高度。聚光灯从上方打下，在她脸上投下柔和的光影。她抬起头，目光平静地扫过台下。"
    dialogue:
      - speaker: CHAR-001
        emotion: 内心·沉静
        text: "这首歌……十年了。"
      - speaker: CHAR-001
        emotion: 内心·冷静
        text: "终于可以唱给你们听了。"

  - shot_id: EP18-S05
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 近景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "前奏响起——一段清亮的钢琴前奏，带着十年前流行乐的风格。苏念晚闭上眼，等她再睁开时，整个人沉入了歌里。她的声音清澈而有穿透力，第一句唱出来，全场就安静了。"
    dialogue:
      - speaker: CHAR-001
        emotion: 唱歌·清澈
        text: "风停了，雨停了，只有回忆不肯停——"
      - speaker: CHAR-001
        emotion: 唱歌·渐入
        text: "你说过的话，像是刻在骨里的刺。"

  - shot_id: EP18-S06
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001, CHAR-002]
    looks: [CHAR-001-L01, CHAR-002-L01]
    shot_size: 中景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "台下渐渐安静到几乎没有杂音。陆景深原本随意靠在椅背上的身体微微前倾——他被歌声吸引了。他看着台上的苏念晚,眼神里多了一丝探究——这首歌,不像新人能写出。"
    dialogue:
      - speaker: CHAR-001
        emotion: 唱歌·继续
        text: "那个夏天的梦,我从未忘记——"
      - speaker: CHAR-002
        emotion: 内心·检索
        text: "这个旋律……在哪里听过。"

  - shot_id: EP18-S07
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003]
    looks: [CHAR-003-L01]
    shot_size: 特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴原本漫不经心地看着台上——然后她的笑容凝固了。那首旋律像一把钥匙,插进了她记忆深处某个锁孔。她的手指猛地攥紧了座位扶手,指节泛白。"
    dialogue:
      - speaker: CHAR-003
        emotion: 内心·震惊
        text: "这个旋律——"
      - speaker: CHAR-003
        emotion: 内心·确认
        text: "不可能……这不可能。"

  - shot_id: EP18-S08
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001, CHAR-003]
    looks: [CHAR-001-L01, CHAR-003-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "苏念晚唱到副歌,目光扫过台下——精准地落在方芷晴脸上。两人隔空对视,只有半秒。苏念晚的眼神里带着一丝方芷晴才能读懂的意味——不是挑衅,是确认。方芷晴的完美微笑彻底碎了。"
    dialogue:
      - speaker: CHAR-001
        emotion: 唱歌·副歌·穿透力
        text: "当你以为我走了——我却在这里。"
      - speaker: CHAR-003
        emotion: 内心·恐惧
        text: "她故意的。她就是冲我来的。"

  - shot_id: EP18-S09
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    shot_size: 大特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 镜头推近
    visual: "苏念晚闭着眼唱到最高潮——她的声音微微颤抖,不是紧张,是十年的情绪在这一刻倾泻而出。聚光灯把她的影子拉得很长。观众席中,有人悄悄抹了抹眼角。"
    dialogue:
      - speaker: CHAR-001
        emotion: 唱歌·高潮·情感满溢
        text: "我回来了——以你认不出的方式。"

  - shot_id: EP18-S10
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-GRP-04, CHAR-003]
    looks: [CHAR-GRP-04-L01, CHAR-003-L01]
    shot_size: 近景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴的助理(女,20多岁)从侧台快步走来,弯腰凑到方芷晴耳边压低声音。方芷晴听完,脸色由白转青——她死死盯着台上,呼吸变得急促。"
    dialogue:
      - speaker: CHAR-GRP-04
        emotion: 弯腰·低声
        text: "方老师,这首歌……我十年前在一张Demo上听过。"
      - speaker: CHAR-003
        emotion: 咬牙·压低
        text: "闭嘴。我知道。"

  - shot_id: EP18-S11
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-001, CHAR-006]
    looks: [CHAR-001-L01, CHAR-006-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "歌曲结束。苏念晚深深鞠躬。全场爆发出雷鸣般的掌声——甚至有观众站起来鼓掌。沈逸辰快步走上台,做出一副'我被震撼到说不出话'的表情。"
    dialogue:
      - speaker: CHAR-006
        emotion: 夸张·抹眼角
        text: "太好听了……我这眼泪都出来了。小晚你也太深藏不露了吧！"
      - speaker: CHAR-001
        emotion: 微笑·谦虚
        text: "谢谢沈老师,谢谢大家。"

  - shot_id: EP18-S12
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003, CHAR-002]
    looks: [CHAR-003-L01, CHAR-002-L01]
    shot_size: 中景
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴突然从座位上站起来——在全场注目中转身快步离席,高跟鞋敲击地面的声音急促。陆景深转头看向她离开的方向,眉头微皱。"
    dialogue:
      - speaker: CHAR-002
        emotion: 内心·警觉
        text: "她认出来了。"

  - shot_id: EP18-S13
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003, CHAR-GRP-04]
    looks: [CHAR-003-L01, CHAR-GRP-04-L01]
    shot_size: 中景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 镜头跟随
    visual: "后台走廊灯光惨白,与舞台的璀璨形成鲜明对比。方芷晴疾步走在前面,助理小跑着追在她身后。方芷晴的表情在脱离公众视线后彻底垮掉——没有微笑,只有阴鸷。"
    dialogue:
      - speaker: CHAR-003
        emotion: 冷声·边走边说
        text: "选曲是谁定的？"
      - speaker: CHAR-GRP-04
        emotion: 紧张·小跑
        text: "是她自己报的曲目……节目组没干涉。"
      - speaker: CHAR-003
        emotion: 停步·转身·声音发寒
        text: "她就这么明目张胆。"

  - shot_id: EP18-S14
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003]
    looks: [CHAR-003-L01]
    shot_size: 特写
    duration_sec: 5
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴停在一盏日光灯下,脸上的光让她看起来苍白而可怖。她低头想了三秒,然后缓缓抬起眼——那眼神里有一丝恐惧,但更多的是狠厉。"
    dialogue:
      - speaker: CHAR-003
        emotion: 低语·自问
        text: "她不怕被认出来？"
      - speaker: CHAR-003
        emotion: 低语·答案
        text: "她是故意的。"

  - shot_id: EP18-S15
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003, CHAR-GRP-04]
    looks: [CHAR-003-L01, CHAR-GRP-04-L01]
    shot_size: 中近景
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴转身,面对助理,声音压到最低但每个字都像冰锥。走廊尽头传来舞台的欢呼声,衬得这段对话格外隐秘。"
    dialogue:
      - speaker: CHAR-003
        emotion: 冰冷·一字一句
        text: "那首歌……是苏念晚写的。"
      - speaker: CHAR-GRP-04
        emotion: 倒吸一口气·震惊
        text: "苏……苏念晚？！"

  - shot_id: EP18-S16
    episode: EP18
    scene_id: SCENE-006
    characters: [CHAR-003]
    looks: [CHAR-003-L01]
    shot_size: 特写
    duration_sec: 6
    mode: i2v_ref
    camera_movement: 固定镜头
    visual: "方芷晴的瞳孔里映着惨白的灯光,那张精致的脸在阴影里半明半暗。她说完这句话后,嘴角浮起一个极其危险的弧度——不是笑,是下定决心的冷意。"
    dialogue:
      - speaker: CHAR-003
        emotion: 冰冷·确认
        text: "她不可能只是一个新人。"
      - speaker: CHAR-003
        emotion: 冷笑·决心
        text: "查。给我查清楚她到底想干什么。"
