# EP09 Shots - 机器可读镜头表
# 来源: EP09_旧记者的追踪.md
# 生成日期: 2026-06-20

shots:
  - shot_id: EP09-S01
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 中景
    duration_sec: 5
    mode: i2v_ref
    camera: 固定镜头
    visual: "45岁的中年记者坐在电脑前，戴着半框眼镜，屏幕蓝光映在他布满细纹的脸上。身后的书架上堆满泛黄的剪报册和娱乐杂志。他右手握着鼠标，食指悬停在暂停键上。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 敏锐
        text: "这个走红的新人……每个动作都有职业痕迹。"

  - shot_id: EP09-S02
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 特写
    duration_sec: 5
    mode: i2v_ref
    camera: 缓推
    visual: "电脑屏幕上，林小晚的综艺片段被暂停。张记者双击放大画面，林小晚的侧脸清晰可见。他的眉头渐渐皱起，目光从屏幕移到手边一本泛黄的剪报上。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 疑惑
        text: "林小晚……简历说你是新人。"
      - speaker: CHAR-010
        type: 独白
        emotion: 追忆
        text: "这种侧脸打光的角度……我十年前见过。"

  - shot_id: EP09-S03
    scene: SCENE-008
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    framing: 中近景
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    visual: "苏念晚站在公寓窗前，穿着一件简单的白色T恤，黑色短发有些凌乱。窗外是城市夜景，手机的屏幕光映在她清冷的面庞上。她握着手机贴耳，表情从平静到凝重的细微变化。"
    dialogue:
      - speaker: CHAR-004
        type: 电话
        emotion: 急促
        text: "刚收到确认消息。方芷晴是下期综艺的特邀导师。"
      - speaker: CHAR-001
        type: 对白
        emotion: 低声·目光微凝
        text: "下期？"
      - speaker: CHAR-004
        type: 电话
        emotion: 郑重
        text: "星耀那边已经拍板了。你要有心理准备。"
      - speaker: CHAR-001
        type: 对白
        emotion: 镇定
        text: "知道了。见面谈。"
      - speaker: CHAR-001
        type: 内心
        emotion: 冷静
        text: "躲了十年……也该正面撞一次了。"

  - shot_id: EP09-S04
    scene: SCENE-002
    characters: [CHAR-004, CHAR-001]
    looks: [CHAR-004-L01, CHAR-001-L01]
    framing: 中景
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    visual: "咖啡馆角落的卡座，窗外透进温暖的日光。陈姐穿着黑色职业套装，银灰色短发利落，双手交叉放在桌上，表情严肃。苏念晚坐在对面，面前放着一杯未动的咖啡。"
    dialogue:
      - speaker: CHAR-004
        type: 对白
        emotion: 担心·压低声音
        text: "我建议你推掉下期录制。以身体不适为由，很自然。"
      - speaker: CHAR-001
        type: 对白
        emotion: 摇头
        text: "推得了一期，推不了一季。"
      - speaker: CHAR-004
        type: 对白
        emotion: 坚持
        text: "你现在这张脸，经不起她仔细端详。"

  - shot_id: EP09-S05
    scene: SCENE-002
    characters: [CHAR-004]
    looks: [CHAR-004-L01]
    framing: 近景
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    visual: "陈姐身体微微前倾，目光紧锁苏念晚，手指轻敲桌面。她的眼神里有焦虑，但也有十年如一日的关切。"
    dialogue:
      - speaker: CHAR-001
        type: 对白
        emotion: 平静
        text: "十年了。我的脸在变。她的记忆也在变。"
      - speaker: CHAR-004
        type: 对白
        emotion: 叹气·语速加快
        text: "可你现在的身份经不起查。一个来历不明的新人——万一她让人去翻你的底呢？"

  - shot_id: EP09-S06
    scene: SCENE-002
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    framing: 近景
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    visual: "苏念晚放下咖啡杯，抬起眼直视陈姐。她的眼神不再闪躲，反而平静得令人不安——那种吃过十年苦才有的沉静。窗外阳光在她侧脸勾勒出利落的轮廓。"
    dialogue:
      - speaker: CHAR-004
        type: 对白
        emotion: 急·压低声音
        text: "万一她认出你了呢？"
      - speaker: CHAR-001
        type: 对白
        emotion: 镇定·目光不避
        text: "那我就让她认。"
      - speaker: CHAR-004
        type: 对白
        emotion: 震惊
        text: "你疯了？被认出来一切全完了！"

  - shot_id: EP09-S07
    scene: SCENE-002
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    framing: 中特写
    duration_sec: 6
    mode: i2v_ref
    camera: 固定镜头
    visual: "苏念晚微微挺直背脊，目光穿越陈姐看向窗外。她的嘴角甚至闪过一丝几乎不可见的弧度——不是笑，是一种确认猎物位置的冷静。窗外街景虚化。"
    dialogue:
      - speaker: CHAR-001
        type: 对白
        emotion: 坚定·轻声
        text: "我不靠近她，哪来的机会拿到证据？"
      - speaker: CHAR-001
        type: 对白
        emotion: 金句·目光收回
        text: "躲不是办法。越近，越能看到真相。"
      - speaker: CHAR-004
        type: 对白
        emotion: 沉默·忧虑
        text: "……"

  - shot_id: EP09-S08
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 特写
    duration_sec: 10
    mode: i2v_ref
    camera: 镜头缓缓下摇
    visual: "张记者的手翻开一本泛黄的剪报册，纸张边缘因年代久远而发脆。里面夹着一张十年前的娱乐版报道——18岁的苏念晚手捧三座奖杯，照片上少女的笑靥如花。他粗糙的指腹轻轻划过那张泛黄的照片。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 翻开剪报
        text: "苏念晚退圈前最后一部电影……当年她才十八岁。"
      - speaker: CHAR-010
        type: 独白
        emotion: 翻阅
        text: "这是她封后的那一届金像奖……三冠影后。"
      - speaker: CHAR-010
        type: 独白
        emotion: 对比
        text: "这个抬眸的角度……这个微皱的眉头……"
      - speaker: CHAR-010
        type: 独白
        emotion: 低声·自语
        text: "不可能有这么巧的事。"

  - shot_id: EP09-S09
    scene: SCENE-008
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    framing: 近景
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    visual: "苏念晚站在公寓浴室的镜子前，仅亮着一盏暖黄色的镜前灯。她看着镜中的自己——齐肩黑发，素颜，练习生装扮。她的手指轻轻触碰到镜面，指尖点在镜中自己的眉骨上。眼神平静底下藏着汹涌的暗流。"
    dialogue:
      - speaker: CHAR-001
        type: 内心
        emotion: 低声
        text: "方芷晴……十年没见了。"
      - speaker: CHAR-001
        type: 内心
        emotion: 坚定
        text: "你当年抢走的那个位置……"
      - speaker: CHAR-001
        type: 内心
        emotion: 坚定
        text: "我回来了。"
      - speaker: CHAR-001
        type: 内心
        emotion: 收尾
        text: "有些账，该算了。"

  - shot_id: EP09-S10
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 大特写
    duration_sec: 6
    mode: i2v_ref
    camera: 横移
    visual: "桌面上并排放着两张照片：左边是十年前苏念晚的侧脸特写（PROP-003），右边是林小晚综艺片段截图。张记者的手指从左到右缓慢平移，对比两双眼睛的轮廓、眉骨的弧度。两张脸庞在暖黄台灯下被照得清晰。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 自言自语·低声
        text: "人长大了会变……但骨头不会。"
      - speaker: CHAR-010
        type: 独白
        emotion: 自言自语·更肯定
        text: "颧骨、鼻梁、下颌线……相似度百分之九十以上。"

  - shot_id: EP09-S11
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 近景
    duration_sec: 6
    mode: i2v_ref
    camera: 缓推
    visual: "张记者靠回椅背，摘下眼镜，用拇指和食指捏了捏鼻梁。再睁眼时，他的目光里有职业记者发现大鱼时的兴奋和克制——一种猎人确认猎物后的沉静。台灯光在他眼中形成两点光斑。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 深吸·语气克制
        text: "十年了……你居然回来了。"
      - speaker: CHAR-010
        type: 独白
        emotion: 兴奋·克制
        text: "如果这是真的……"
      - speaker: CHAR-010
        type: 独白
        emotion: 停顿
        text: "这就是今年娱乐圈最大的新闻。"

  - shot_id: EP09-S12
    scene: SCENE-020
    characters: [CHAR-010]
    looks: [CHAR-010-L01]
    framing: 大特写
    duration_sec: 10
    mode: i2v_ref
    camera: 固定镜头
    visual: "手机屏幕的俯拍特写。张记者在社交平台的编辑框内打下最后一行字。他的拇指悬停在'发送'按钮上方，犹豫了一秒——然后按下。屏幕动画：消息发送成功。屏幕上浮现他的帖子内容。"
    dialogue:
      - speaker: CHAR-010
        type: 独白
        emotion: 低声·对着屏幕
        text: "苏念晚……真的是你吗？"
