        镜头2（6秒）中景→远景 固定→缓拉：冯小柔右脚向前迈一步——蛊虫驱动。第二步——朝向幽冥谷深处朝向未探查过的远古陷阱和崩塌阵法。步态如节拍器节奏完全一致重心摆动幅度为零——木偶行走的特征。远景：谷口上方岩台——图3右手食指和中指在虚空中交替轻点，每点一下冯小柔迈一步。左手掌心留影石微光流转——实时记录冯小柔走过的每一步。图3微笑——不是残忍是欣赏一件完美的工具。凤眼中闪过一丝金光——太初真人在她体内低语。图3看着图1——声线从从容变成低沉的几乎像在分享秘密的语气。
