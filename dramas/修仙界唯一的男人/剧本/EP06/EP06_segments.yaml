        镜头2（6秒）近景 固定镜头：图1转身朝石拱门走去——走了三步。然后停住。她没有回头，墨绿背影在正午的白光中如一棵老树的剪影。风吹过药园，满园灵植的叶片沙沙作响，蓝紫灵光在风中如波浪般起伏。她的声音从背影中传来——不大，但每个字都像被千年的阅历压过，沉稳、直接、不绕弯。图2袖中的素布包裹贴着前臂——阳元草的叶片透过布料，传来一丝若有若无的暖意。
