  # ============================================================
  # SCENE-002 · 林小夏房间 (Key Scene — EP01,09,26,45,57,72)
  # Props: PROP-003 (sketchbook), PROP-008 (paintbrushes), PROP-011 (phone)
  # Scene-embedded: none (PROP-004/009 are character-embedded)
  # ============================================================
  - id: "SCENE-002"
    prompt: >-
      Interior of an 18-year-old Chinese girl's bedroom, 2024, daytime with soft diffused sunlight through a window
      with light blue curtains. A single bed with a pink floral bedsheet pushed against one wall. A wooden study desk
      near the window is completely buried under stacks of exam prep books, practice test papers, and thick reference
      manuals, with a small desk lamp and a potted succulent plant on the windowsill. On the left side of the desk,
      a dark indigo cloth pouch containing three bamboo-handled calligraphy brushes with worn frayed bristle tips rests
      openly. A blue hardcover sketchbook covered in colorful cartoon stickers sits partially hidden under textbooks.
      The opposite wall has faded marks where posters were once taped — partial sticky tape residue and torn edges
      visible — with one remaining small decorative postcard pinned to the wall. A school backpack slumped on the floor
      near the desk. A small bookshelf with novels and art supplies. Pink and blue color scheme, teenage personal space
      that balances study pressure with hidden artistic dreams. Warm natural lighting from the window.
      modern Chinese city, 2024, warm natural lighting, soft focus background, cinematic composition, photorealistic,
      9:16 vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no posters with faces, no
      portraits, architectural and environmental reference only. NOT inscribed with any characters or text.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-003.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-008.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-011.png"
    output: "assets/scenes/SCENE-002.png"

  # ============================================================
  # SCENE-003 · 高三教室 (Key Scene — EP04,14,15,30,33,56)
  # Props: PROP-011 (phone)
  # Scene-embedded: PROP-010 (countdown board)
  # ============================================================
  - id: "SCENE-003"
    prompt: >-
      Interior of a Chinese high school senior-year classroom, 2024, daytime with harsh overhead fluorescent white
      tube lighting. A large green chalkboard dominates the front wall, with bold white chalk text in the center
      reading "距离高考30天" in large confident strokes in Simplified Chinese, surrounded by chalk smudges, eraser
      marks, and remnant math formulas. Layered erasure traces from daily countdown updates create a visible history
      on the board surface. Below the chalkboard, a worn wooden teacher's desk with chalk tray. Rows of identical
      wooden student desks and chairs packed tightly in a grid formation, surfaces covered with stacked textbooks,
      pencil cases, and water bottles. The side walls display red motivational banners and printed class schedules.
      White walls, gray floor tiles, ceiling-mounted fluorescent lights casting flat even illumination. The
      atmosphere is intense and pressurized, the weight of imminent national college entrance exams hanging in the
      air. A window on the far wall shows a glimpse of the school courtyard outside. Shot from the back of the
      classroom looking toward the chalkboard, emphasizing the endless rows of desks.
      modern Chinese city, 2024, cool fluorescent lighting, cinematic composition, photorealistic, 9:16 vertical
      frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. The chalkboard text MUST read exactly "距离高考30天" in Simplified Chinese
      and NO other text or characters anywhere in the image.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-011.png"
    output: "assets/scenes/SCENE-003.png"

  - id: "SCENE-003-night"
    prompt: >-
      Interior of a Chinese high school senior-year classroom, 2024, nighttime with only a few overhead fluorescent
      tubes lit, leaving parts of the room in shadow. A large green chalkboard with bold white chalk text "距离高考30天"
      in large confident strokes in Simplified Chinese, surrounded by chalk smudges and remnant math formulas. Layered
      erasure traces visible. Rows of wooden student desks and chairs in tight formation, surfaces covered with stacked
      textbooks. Some desks have small clip-on LED study lights creating pools of warm white light. The classroom
      window shows a dark sky. Desks are partially cleared — some students' belongings left behind from evening self-study.
      Empty chairs create an eerie atmosphere of pressure and solitude. Cool fluorescent mixed with warm desk lamp light.
      modern Chinese city, 2024, mixed fluorescent and desk lamp lighting, cinematic composition, photorealistic,
      9:16 vertical frame, high detail.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. The chalkboard text MUST read exactly "距离高考30天" in Simplified Chinese
      and NO other text or characters anywhere in the image.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-011.png"
    output: "assets/scenes/SCENE-003-night.png"

  # ============================================================
  # SCENE-004 · 创业公司办公区 (Key Scene — EP05,07,16,29,37,41,49,54,62)
  # No linked props
  # ============================================================
  - id: "SCENE-004"
    prompt: >-
      Interior of a young Chinese tech startup open-plan office space, 2024, daytime with natural light from
      floor-to-ceiling windows showing a modern city skyline with glass tower buildings in the distance. Multiple
      standing desks and adjustable-height workstations arranged in clusters, each with dual monitors, mechanical
      keyboards, and scattered sticky notes in bright colors — yellow, pink, green, blue. A large whiteboard wall
      covered in product roadmap diagrams, user flow sketches, and brainstorming notes in marker. Exposed concrete
      ceiling with visible industrial ductwork and pendant lights. A ping-pong table doubles as a meeting surface
      in the background. A small kitchenette corner with a coffee machine, instant noodle cups, and energy drink
      cans. Cable management trays and power strips everywhere. Bean bag chairs in a casual meeting area. The
      atmosphere is energetic but chaotically organized, the DNA of a startup burning through its runway. Warm
      morning sunlight mixing with cool white overhead panels.
      modern Chinese city, 2024, warm natural lighting, soft focus background, cinematic composition, photorealistic,
      9:16 vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no posters with faces, no
      portraits, architectural and environmental reference only. NOT inscribed with any characters or text.
    output: "assets/scenes/SCENE-004.png"

  - id: "SCENE-004-night"
    prompt: >-
      Interior of a young Chinese tech startup open-plan office space, 2024, late night. The city skyline outside
      the floor-to-ceiling windows is illuminated with twinkling building lights against a dark blue sky. Most desk
      lamps are off, but two or three workstations still have their monitors glowing with blue-white screen light,
      casting isolated pools of illumination. A large whiteboard with product diagrams partially visible in the dim
      light. Scattered energy drink cans and instant noodle cups on desks. The ping-pong table is unused and dark.
      Emergency exit signs cast a faint green glow. The atmosphere is lonely and pressurized — the cost of startup
      ambition. Cool blue screen light mixed with warm desk lamp glow at the active workstations.
      modern Chinese city, 2024, cool blue nighttime lighting, cinematic composition, photorealistic, 9:16 vertical
      frame, high detail.
      Empty environment, no people, no human figures, no faces, no photographs of people, no posters with faces, no
      portraits, architectural and environmental reference only. NOT inscribed with any characters or text.
    output: "assets/scenes/SCENE-004-night.png"

  # ============================================================
  # SCENE-005 · 林建国公司办公室 (Key Scene — EP05,08,19,27,31,50,59)
  # Props: PROP-006 (old letter), PROP-007 (bankbook)
  # Scene-embedded: PROP-005 (promotion application - in drawer, not visible)
  # ============================================================
  - id: "SCENE-005"
    prompt: >-
      Interior of a mid-level manager's cubicle in a traditional Chinese manufacturing company office, 2024, daytime
      with harsh overhead fluorescent tube lighting casting flat cool white light. A standard gray fabric-covered
      cubicle partition surrounds a small L-shaped desk with a bulky desktop computer monitor, a wired keyboard, and
      a landline telephone. On the desk corner, a small framed school achievement award and a ceramic pencil holder.
      The cubicle wall has a printed motivational poster and a company organizational chart. A metal filing cabinet
      sits in the corner with a small potted artificial plant on top. In the desk's open drawer, a yellowed handwritten
      letter on cream stationery paper is partially visible, its blue ink text and crossed-out words suggesting decades
      of hidden emotion. Next to it, a small deep crimson red bankbook with gold foil lettering. The atmosphere is
      oppressively corporate — gray carpet tiles, white acoustic ceiling panels, identical cubicles stretching into
      the background. A window shows an overcast sky. The space speaks of fifteen years of quiet compromise and
      unspoken ambition. Shot from the corridor looking into the cubicle, emphasizing the confined personal space
      within the vast corporate environment.
      modern Chinese city, 2024, cool fluorescent office lighting, cinematic composition, photorealistic, 9:16
      vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-006.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-007.png"
    output: "assets/scenes/SCENE-005.png"

  # ============================================================
  # SCENE-006 · 奶奶家老宅 (Core Scene — EP03,11,12,17,23,35,38,55,57,58,63,64,67)
  # Props: PROP-001 (jade pendant), PROP-002 (old diary), PROP-008 (paintbrushes), PROP-011 (phone)
  # ============================================================
  - id: "SCENE-006"
    prompt: >-
      Interior of an elderly Chinese grandmother's traditional living room with mixed-era furnishings, 2024 but with
      furniture spanning decades. Warm golden afternoon sunlight streams through old wooden-framed windows with yellowed
      lace curtains, casting long warm light shafts across the room. A large rosewood high-back armchair (太师椅) sits
      prominently in the foreground, its dark lacquered surface showing decades of use with a worn silk cushion. Behind
      it, a tall red lacquer wooden cabinet (红木柜) with brass fittings stands against the wall, its surface displaying
      a jade pendant with oval translucent green jadeite on a faded red cord in a small wooden tray, glowing with
      faint warm green light. On a low rosewood tea table, a worn leather-bound diary with brass clasp sits next to
      a small dark indigo cloth pouch containing bamboo-handled calligraphy brushes with worn frayed tips. An antique
      wall clock ticks on the wall. Dried flower arrangements, a porcelain tea set, and various family heirlooms
      create layers of history. The walls show aged paint and marks of time. A mismatched sofa from the 1990s sits
      opposite the traditional furniture. The space radiates warmth, memory, and three generations of family stories.
      Shot at natural eye level with wide-angle lens capturing the full depth of the room.
      modern Chinese city, 2024, warm natural lighting, soft focus background, cinematic composition, photorealistic,
      9:16 vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-001.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-002.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-008.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-011.png"
    output: "assets/scenes/SCENE-006.png"

  - id: "SCENE-006-night"
    prompt: >-
      Interior of an elderly Chinese grandmother's traditional living room, 2024, nighttime. A rosewood high-back
      armchair with worn silk cushion sits in the foreground, illuminated by a warm yellow pendant lamp overhead
      and a standing floor lamp with fabric shade casting pools of warm amber light. Behind the armchair, a tall
      red lacquer cabinet with brass fittings, its surface displaying a jade pendant with oval translucent green
      jadeite on a faded red cord, glowing faintly green. On a low rosewood tea table, a worn leather diary with
      brass clasp and a dark indigo cloth pouch with bamboo calligraphy brushes. The old windows show darkness
      outside with a sliver of moonlight filtering through yellowed lace curtains. An antique wall clock on the
      wall. Warm tungsten lighting creates deep shadows in the corners, giving the room a mysterious, timeless
      quality. Dried flowers, porcelain tea set, family heirlooms visible in the warm pools of light. The space
      feels like a repository of secrets, generations of wisdom stored in objects and silence.
      modern Chinese city, 2024, warm tungsten indoor lighting, cinematic composition, photorealistic, 9:16 vertical
      frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text.
