  # ============================================================
  # SCENE-008 · 学校操场/走廊 (Transition Scene — EP04,10,14,30,56)
  # Scene-embedded: PROP-010 (countdown banner, visible through classroom doors)
  # ============================================================
  - id: "SCENE-008"
    prompt: >-
      Exterior of a Chinese high school campus, 2024, daytime with bright warm sunlight. A wide covered corridor
      (走廊) with concrete pillars and a flat roof stretches into the distance, the floor a worn terrazzo surface
      with scuff marks from thousands of students. Along the corridor wall, a bulletin board displays printed exam
      schedules, class rankings, and motivational posters in red and gold. Classroom doors with glass panels line
      the left side — through one door, a green chalkboard with countdown text is partially visible. On the right
      side, a metal railing overlooks the school courtyard below, where tall plane trees (梧桐树) cast dappled
      shadows on a concrete basketball court. Red plastic running track visible in the distance. Potted plants
      line the corridor at intervals. The air shimmers with the warmth of early summer. A clock mounted on the
      corridor wall shows 3:30 PM. The space captures the specific atmosphere of a Chinese high school — regimented
      yet alive with youthful energy, the weight of exams balanced by the freedom of open sky. Shot looking down
      the long corridor, vanishing point perspective emphasizing the endless days of school life.
      modern Chinese city, 2024, warm natural sunlight, cinematic composition, photorealistic, 9:16 vertical frame,
      high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text besides what is naturally visible
      through the classroom door.
    output: "assets/scenes/SCENE-008.png"

  # ============================================================
  # SCENE-009 · 酒局包间 (Secondary Scene — EP08)
  # Props: PROP-007 (bankbook - discovered from wallet, narrative context)
  # ============================================================
  - id: "SCENE-009"
    prompt: >-
      Interior of a private dining room (包间) in a mid-range Chinese restaurant, 2024, nighttime. A large round
      wooden dining table with a glass lazy Susan turntable in the center dominates the room, set with white
      porcelain dishes, small white spirits glasses (白酒杯), ceramic chopstick rests, and cloth napkins. Several
      bottles of Chinese baijiu (white liquor) stand on the table. The walls are paneled in dark red wood veneer
      with decorative lattice patterns. Overhead, a dim orange-red pendant lamp casts a warm low light, creating
      deep shadows and a slightly claustrophobic atmosphere. A wall-mounted flat-screen TV plays silently in one
      corner. Red cloth chairs surround the table. A small side table holds extra glasses and a tea set. The room
      has no windows — only the warm artificial glow. The atmosphere is one of adult social obligation — polished
      surfaces hiding uncomfortable truths, the weight of middle-aged professional relationships. The air feels
      thick with unspoken tensions. Shot from the doorway looking into the room, the round table as the central
      focal point.
      modern Chinese city, 2024, warm dim restaurant lighting, cinematic composition, photorealistic, 9:16 vertical
      frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text.
    output: "assets/scenes/SCENE-009.png"

  # ============================================================
  # SCENE-010 · 老宅客厅（互换仪式）(Key Scene — EP01,24,57)
  # Props: PROP-001 (jade pendant - glowing), PROP-002 (old diary)
  # This is a special atmosphere variant of SCENE-006 at nighttime
  # ============================================================
  - id: "SCENE-010"
    prompt: >-
      Interior of the grandmother's traditional Chinese living room transformed into a ritual space, 2024, deep
      nighttime with all electric lights off. The room is illuminated solely by a ring of tall white candles placed
      on the floor and on the rosewood furniture, casting flickering warm orange light that creates dramatic moving
      shadows on the walls. In the center of the room, the low rosewood tea table has been cleared and draped with
      a dark red silk cloth. On the silk cloth, a jade pendant with oval translucent green jadeite on a faded red
      cord sits prominently, emitting a vivid warm green luminescent glow that mixes with the candlelight, casting
      green-tinted light patterns on the surrounding silk fabric. Next to the jade, a worn leather diary with brass
      clasp lies open, its yellowed pages catching the candlelight. Four empty wooden chairs are arranged around the
      table in a square formation, suggesting four people sitting face to face. The rosewood armchair and red
      lacquer cabinet are visible in the background, silhouetted against the warm candlelight. The old wall clock
      shows midnight. The atmosphere is solemn, mysterious, and charged with supernatural tension — the threshold
      between the ordinary world and something ancient. The candle flames flicker as if moved by an invisible force.
      Photorealistic rendering, shot on wide-angle lens, natural candlelight, real architectural materials, dramatic
      chiaroscuro lighting, 9:16 vertical frame.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
      and environmental reference only. NOT inscribed with any characters or text.
    image_urls:
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-001.png"
      - "https://drama-reference-images.tos-cn-beijing.volces.com/props/我和爸妈互换人生/PROP-002.png"
    output: "assets/scenes/SCENE-010.png"
