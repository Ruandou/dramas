  - id: "SCENE-007"
    prompt: >-
      Interior of a Chinese hospital cardiac care ward, 2024, daytime with soft diffused sunlight through a large
      window with thin white curtains. A standard hospital bed with crisp white sheets and a thin blue blanket
      occupies the center, the head of the bed slightly elevated. A bedside table holds a water pitcher, paper
      cups, and a small bouquet of fresh flowers. A multi-parameter patient monitor (ECG, SpO2) stands beside
      the bed, its screen showing a green heartbeat waveform. An IV pole with a half-empty saline bag stands
      nearby. The walls are painted in a pale mint green. A small wall-mounted TV is turned off. Clean linoleum
      floor tiles in light beige. The window reveals blue sky and green trees outside. The atmosphere balances
      clinical sterility with warm natural light creating a sense of hope amid anxiety. Medical equipment, wall
      oxygen outlet, and a call button are visible. Shot from the doorway looking in, capturing the full room
      with the bed as the focal point.
      modern Chinese city, 2024, warm natural daylight, soft clinical lighting, cinematic composition, photorealistic,
      9:16 vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural
