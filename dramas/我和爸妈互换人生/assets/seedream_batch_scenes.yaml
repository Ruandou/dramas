  # ============================================================
  # SCENE-001 · 林家客厅 (Core Scene — EP01-72, nearly every episode)
  # Props: PROP-001 (jade pendant), PROP-002 (old diary), PROP-003 (sketchbook), PROP-011 (phone)
  # Scene-embedded: PROP-012 (admission letter)
  # ============================================================
  - id: "SCENE-001"
    prompt: >-
      Interior of a modest Chinese apartment living room in a second-tier city, 2024, daytime with warm golden sunlight
      streaming through sheer curtains on the balcony door. A worn beige fabric sofa with a knitted throw blanket sits
      against a cream-colored wall, above which hang framed school achievement awards and merit certificates with small
      decorative items on a narrow shelf — NO family portraits or photos of people. A small rectangular dining table with
      three mismatched wooden chairs occupies the middle ground, cluttered with a rice cooker, soy sauce bottle, and
      a small bouquet of fake flowers. Against the far wall, a flat-screen TV sits on a wooden TV cabinet, the cabinet
      surface covered with daily items: reading glasses, a TV remote, a half-open tin of tea leaves, and a small jade
      pendant with oval translucent green jadeite on a faded red cord resting in a decorative wooden tray, emitting a
      faint warm green glow. A worn leather diary with brass clasp sits next to the jade pendant. On the coffee table
      in the foreground, an open sketchbook with colorful stickers on the cover lies next to a smartphone with silver
      metallic case, screen dark. Scattered daily shoes near the entrance, a pair of slippers under the dining table.
      Framed school achievement awards and small decorative items on the wall shelf. Warm tungsten indoor lighting
      mixing with natural daylight. Cluttered but lived-in, a family space that tells the story of everyday Chinese
      middle-class life. Shot at natural eye level, wide-angle 24mm lens showing the full room depth.
      modern Chinese city, 2024, warm natural lighting, soft focus background, cinematic composition, photorealistic,
      9:16 vertical frame, high detail, warm color palette.
      Empty environment, no people, no human figures, no faces, no photographs of people, no portraits, architectural and
      environmental reference only. NOT inscribed with any characters or text on walls or surfaces.
