        line: "愣住了·看着女儿·眼眶微微发红：真的？"
      - speaker: CHAR-001
        line: "用力点头·笑了：妈——你从来就不是'不知道会不会当老师'。你是——"
      - speaker: CHAR-001
        line: "一字一字地·像在告诉妈妈一个她早该知道的事实：本来就应该当老师。"
      - speaker: CHAR-002
        line: "深吸一口气·把文件整齐地收进文件夹·目光重新坚定起来：明天——妈去母校。把申请交了。"
      - speaker: CHAR-002
        line: "合上文件夹·看着女儿·笑了：你都不怕去考校考——我怕什么？"
    transition_to_next: dissolve

