        竖屏9比16连贯叙事。
        镜头1（6秒）近景 固定：空无一人的开放式办公区。大部分工位灯已关，只有角落里一台显示器的蓝光还亮着。电脑屏幕上打开着一个文档编辑器，光标在空白处闪烁。图1坐在工位上，手指悬在键盘上方。左臂纹身在蓝光下若隐若现。桌上的便利贴贴着各种代码备注和deadline，一个空了的外卖咖啡杯搁在显示器旁边。窗外暮色变暗，远处的写字楼亮起星星点点的灯火。他的手指落下去，在键盘上敲出一个字——很慢，像每一个字都在斟酌。
