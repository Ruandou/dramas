        对白（林大宇，成年男性，24岁，声线清朗有活力，咬字利落带互联网腔，语速快，自嘲时语调上扬带笑意，压力大时声音变低变沉但仍保持快语速，说"没事我能搞定"时故意装轻松语气微微上扬）：「奶奶……她提前来了。」
        对白（苏敏，成年女性，45岁，声线温暖但带有焦虑底色，咬字圆润，语速中等偏快，唠叨时语速加快语调微升像机关枪，真生气时反而变安静低沉，说"我不管你了"时是最低最慢的语速，感动时声音柔软带颤）：「快——都别慌！我来开门，你们……装。」
        对白（林小夏，成年女性，18岁，声线清亮略带倔强，咬字清晰，语速偏快，生气时语调明显升高语速加快，委屈时声音发颤带鼻音，开心时笑声明朗，口头禅"随便吧""无所谓"时语气敷衍上扬）：「装？装成妈妈……我连灶台怎么开都不知道。」
