# EP01 Seedance 段落配置 (segments.yaml)
# 对应 EP01_外卖小哥.md v1.0
# Seedance 2.0 fast | 15 SEG | 21 SHOTS | ~143s

global_defaults:
  model: doubao-seedance-2-0-fast-260128
  ratio: "9:16"
  resolution: 720p
  generate_audio: true
  prompt_suffix: "禁止画面中出现任何文字或字幕。现代都市喜剧风格，写实风格，竖屏9比16。"
  negative_prompt: "ancient costume, historical clothing, period costumes, weapon, military uniform, blurry, distorted, low quality, watermark, subtitles burned into frame, anime style, cartoon style, Qing dynasty hairstyle, queue/bianzi, real brand logo, real celebrity face"
  text_cfg_scale: 7.0

