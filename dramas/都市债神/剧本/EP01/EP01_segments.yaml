    scene_id: SCENE-001
    shots: [EP01-S01, EP01-S02]
    duration_sec: 10
    content_roles:
      - label: "[图1] qinfeng_delivery_rider"
        image_path: "assets/looks/CHAR-001-L01.png"
      - label: "[图2] city_street"
        image_path: "assets/scenes/SCENE-001.png"
    prompt: |
      【图1】CHAR-001·秦风（蓝色外卖骑手服，背蓝色外卖箱）【图2】SCENE-001
      角色分工：仅图1可骑电动车。
      道具：外卖箱（40x30x30cm，蓝色，虚构平台Logo）；电动车（红色，标准外卖电动车）。
      竖屏9比16连贯叙事。
      镜头1（5s）全景跟随：清晨城市街道阳光从高楼缝隙洒下，秦风骑红色电动车穿梭车流，蓝色外卖箱后座晃荡，他单手扶把掏手机看导航，嘴角叼着没点燃的烟
      镜头2（5s）近景固定：秦风等红灯收烟看手机，外卖APP弹出新订单提示他皱眉撇嘴；旁边一辆电动车超过他骑手竖大拇指嘲笑
      [以下对白仅供语音合成，严禁在画面中显示任何文字]
      对白（秦风，26岁，无奈）：「又来……今天第几单了。」
      画面全程无任何文字、字幕、标题、水印。
      现代都市喜剧风格，写实风格，竖屏9比16，禁止古代服饰、军事装备。
