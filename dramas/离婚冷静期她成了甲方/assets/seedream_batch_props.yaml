- id: PROP-001
  prompt_en: 'Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting
    with soft shadows. ONE single thick divorce settlement / cooling-off period legal document stack on A4 paper, slightly
    angled. Cover page and visible clauses printed in clear Simplified Chinese characters: title line 「离婚协议书」, bold clauses
    「净身出户」 and 「放弃股权」 readable, black sans-serif print on white paper, red stamp area blank. Paper corners lightly bent from
    handling, pen marks in margins but NO signatures that look like faces. Cool clinical office mood. No human faces, no people,
    no hands, no mannequin, no portrait photos on documents. cinematic lighting, photorealistic, 9:16 vertical frame, modern
    urban China city aesthetic, cool blue-gray office tones with warm gold accent highlights, low saturation realism, detailed
    textures, shallow depth of field, professional photography quality'
  output: assets/props/PROP-001.png
