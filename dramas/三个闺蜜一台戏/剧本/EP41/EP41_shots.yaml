shots:
  - shot_id: EP41-S01
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺站在工地围栏外，看着已完工的建筑，深呼一口气
    dialogue:
      - speaker: CHAR-003
        line: "[内心独白] 终于回来了……不知道现在是什么样。"
    camera: medium_shot, eye_level

  - shot_id: EP41-S02
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺走进工地，四处查看加固的结构
    dialogue:
      - speaker: CHAR-003
        line: "加固了……全部重做了。"
    camera: tracking_shot, eye_level

  - shot_id: EP41-S03
    scene_id: SCENE-010
    duration_sec: 5
    visual: 施工工人走过来，打量陈一诺
    dialogue:
      - speaker: CHAR-GRP-18
        line: "哎，你找谁？"
      - speaker: CHAR-003
        line: "我是之前这个项目的设计顾问。"
    camera: two_shot, eye_level

  - shot_id: EP41-S04
    scene_id: SCENE-010
    duration_sec: 5
    visual: 工人恍然大悟
    dialogue:
      - speaker: CHAR-GRP-18
        line: "哦！你就是那个提出安全问题的设计师？你走之后，上面换了设计团队。"
    camera: medium_close_up, eye_level

  - shot_id: EP41-S05
    scene_id: SCENE-010
    duration_sec: 5
    visual: 工人带着陈一诺查看加固细节
    dialogue:
      - speaker: CHAR-GRP-18
        line: "安全标准提了三级，地基全部重新加固过。说实话，当初要不是你坚持，这楼可能就出事了。"
    camera: over_shoulder, slightly_low

  - shot_id: EP41-S06
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺摸着加固的柱子，眼眶微红
    dialogue:
      - speaker: CHAR-003
        line: "那就好……那就好。"
    camera: close_up, eye_level

  - shot_id: EP41-S07
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺站在建筑前，抬头看天空，释怀地笑了
    dialogue:
      - speaker: CHAR-003
        line: "[内心独白] 我的坚持……没有白费。辞职是对的。"
    camera: wide_shot, low_angle

  - shot_id: EP41-S08
    scene_id: SCENE-010
    duration_sec: 5
    visual: 手机响了，陈一诺接电话
    dialogue:
      - speaker: CHAR-003
        line: "喂？"
      - speaker: CHAR-008
        line: "一诺，是我。"
      - speaker: CHAR-003
        line: "老师？"
    camera: medium_close_up, eye_level

  - shot_id: EP41-S09
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺惊讶地听着电话
    dialogue:
      - speaker: CHAR-008
        line: "我一直在关注你。听说你在开甜品店？"
      - speaker: CHAR-003
        line: "是的，和两个朋友一起。"
    camera: close_up, eye_level

  - shot_id: EP41-S10
    scene_id: SCENE-010
    duration_sec: 5
    visual: 陈一诺表情从惊讶到感动
    dialogue:
      - speaker: CHAR-008
        line: "我想来尝尝。你做的甜品，一定和你做设计一样认真。"
      - speaker: CHAR-003
        line: "老师……好，我等您。"
    camera: close_up, slightly_high

  - shot_id: EP41-S11
    scene_id: SCENE-001
    duration_sec: 5
    visual: 甜品店里，陈一诺推门进来，苏念和林小满迎上来
    dialogue:
      - speaker: CHAR-002
        line: "怎么样怎么样？那个项目现在什么情况？"
      - speaker: CHAR-001
        line: "别急，让她先坐下。"
    camera: medium_shot, eye_level

  - shot_id: EP41-S12
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺坐下，微笑
    dialogue:
      - speaker: CHAR-003
        line: "安全问题全部修复了。换了设计团队，标准提了三级。"
      - speaker: CHAR-002
        line: "真的？太好了！"
    camera: medium_close_up, eye_level

  - shot_id: EP41-S13
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满松了一口气，拍拍陈一诺的手
    dialogue:
      - speaker: CHAR-001
        line: "那你终于可以放下了。你当初的坚持是对的。"
      - speaker: CHAR-003
        line: "嗯。我可以放下了。"
    camera: two_shot, eye_level

  - shot_id: EP41-S14
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念从后厨端出一份小蛋糕
    dialogue:
      - speaker: CHAR-002
        line: "来！庆祝陈一诺同学终于释怀！这蛋糕我早就准备好了。"
      - speaker: CHAR-003
        line: "你还特意准备了？"
    camera: medium_shot, eye_level

  - shot_id: EP41-S15
    scene_id: SCENE-001
    duration_sec: 5
    visual: 三人吃蛋糕，陈一诺提到导师
    dialogue:
      - speaker: CHAR-003
        line: "对了……我以前的导师，她说想来尝尝我们的甜品。"
      - speaker: CHAR-002
        line: "导师？！"
    camera: medium_shot, eye_level

  - shot_id: EP41-S16
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念紧张地站起来，林小满笑
    dialogue:
      - speaker: CHAR-002
        line: "那可是你最敬重的人！我得做最好的甜品！"
      - speaker: CHAR-001
        line: "冷静，你每次说最好的，结果每次都超常发挥。"
      - speaker: CHAR-003
        line: "谢谢你们。"
    camera: group_shot, eye_level
