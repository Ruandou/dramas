shots:
  - shot_id: EP45-S01
    scene_id: SCENE-001
    duration_sec: 5
    visual: 甜品店客满，三人忙碌
    dialogue:
      - speaker: CHAR-001
        line: "今天又是满座。治愈故事系列太火了。"
    camera: medium_shot, eye_level

  - shot_id: EP45-S02
    scene_id: SCENE-001
    duration_sec: 5
    visual: 一个西装革履的男人走进来
    dialogue:
      - speaker: CHAR-GRP-06
        line: "请问哪位是林小满小姐？我是甜品店加盟代理。"
    camera: medium_shot, eye_level

  - shot_id: EP45-S03
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满接待加盟代理
    dialogue:
      - speaker: CHAR-GRP-06
        line: "林小姐，你们的'治愈故事'概念非常有商业价值。我们有成熟的加盟体系。"
    camera: two_shot, eye_level

  - shot_id: EP45-S04
    scene_id: SCENE-001
    duration_sec: 5
    visual: 加盟代理拿出资料
    dialogue:
      - speaker: CHAR-GRP-06
        line: "加盟费三十万，我们保证三个月回本。已经有十个城市的投资者在排队。"
    camera: close_up, eye_level

  - shot_id: EP45-S05
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满眼睛亮了
    dialogue:
      - speaker: CHAR-001
        line: "三个月回本？这么快？"
      - speaker: CHAR-GRP-06
        line: "我们有全套运营方案，你只需要提供品牌。"
    camera: medium_close_up, eye_level

  - shot_id: EP45-S06
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念端甜品过来
    dialogue:
      - speaker: CHAR-002
        line: "先尝尝我们的甜品吧。"
      - speaker: CHAR-GRP-06
        line: "嗯，不错。不过标准化以后可以更高效。"
    camera: medium_shot, eye_level

  - shot_id: EP45-S07
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺一直在观察
    dialogue:
      - speaker: CHAR-003
        line: "这个人……太热情了。小心点。"
    camera: close_up, eye_level

  - shot_id: EP45-S08
    scene_id: SCENE-001
    duration_sec: 5
    visual: 加盟代理继续推销
    dialogue:
      - speaker: CHAR-GRP-06
        line: "林小姐，机会难得。你要是犹豫，别人就抢先了。"
    camera: medium_shot, eye_level

  - shot_id: EP45-S09
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满犹豫
    dialogue:
      - speaker: CHAR-001
        line: "我需要和我的合伙人商量一下。"
      - speaker: CHAR-GRP-06
        line: "当然。这是我的名片，三天内有效。"
    camera: medium_close_up, eye_level

  - shot_id: EP45-S10
    scene_id: SCENE-001
    duration_sec: 5
    visual: 加盟代理离开
    dialogue:
      - speaker: CHAR-002
        line: "他说三个月回本……真的假的？"
    camera: medium_shot, eye_level

  - shot_id: EP45-S11
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满翻看资料
    dialogue:
      - speaker: CHAR-001
        line: "资料看起来很正规。加盟体系、培训手册、供应链……什么都有。"
    camera: close_up, eye_level

  - shot_id: EP45-S12
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺皱眉
    dialogue:
      - speaker: CHAR-003
        line: "太完美了。我做设计的时候学到一件事——太完美的方案，往往有问题。"
    camera: medium_close_up, eye_level

  - shot_id: EP45-S13
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念问林小满
    dialogue:
      - speaker: CHAR-002
        line: "你真的觉得，我们能复制'治愈'吗？"
    camera: two_shot, eye_level

  - shot_id: EP45-S14
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满沉默
    dialogue:
      - speaker: CHAR-001
        line: "我……不知道。"
    camera: close_up, eye_level

  - shot_id: EP45-S15
    scene_id: SCENE-001
    duration_sec: 5
    visual: 三人看着满店的客人
    dialogue:
      - speaker: CHAR-003
        line: "这些客人来，不是因为甜品好吃。是因为这里有温度。"
    camera: medium_shot, eye_level

  - shot_id: EP45-S16
    scene_id: SCENE-001
    duration_sec: 5
    visual: 林小满沉思
    dialogue:
      - speaker: CHAR-001
        line: "你们说得对。我再想想。"
      - speaker: CHAR-002
        line: "不着急。我们慢慢来。"
    camera: three_shot, eye_level
