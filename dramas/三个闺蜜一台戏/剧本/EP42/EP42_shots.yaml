shots:
  - shot_id: EP42-S01
    scene_id: SCENE-001
    duration_sec: 5
    visual: 甜品店门口，一位优雅的中年女性推门进来
    dialogue:
      - speaker: CHAR-002
        line: "欢迎光临！请问您是……"
    camera: medium_shot, eye_level

  - shot_id: EP42-S02
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺从后厨出来，看到导师，愣住了
    dialogue:
      - speaker: CHAR-003
        line: "老师……您来了。"
      - speaker: CHAR-008
        line: "一诺，好久不见。"
    camera: medium_close_up, eye_level

  - shot_id: EP42-S03
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念赶紧端上甜品，紧张得手抖
    dialogue:
      - speaker: CHAR-002
        line: "老师您好！这是我们店的招牌——治愈系提拉米苏。"
      - speaker: CHAR-001
        line: "苏念，手别抖。"
    camera: medium_shot, eye_level

  - shot_id: EP42-S04
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师品尝甜品，认真品味
    dialogue:
      - speaker: CHAR-008
        line: "嗯……很好。甜度适中，口感细腻。"
      - speaker: CHAR-002
        line: "真的吗？太好了！"
    camera: close_up, slightly_high

  - shot_id: EP42-S05
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师看着陈一诺，微笑
    dialogue:
      - speaker: CHAR-008
        line: "一诺，你做甜品的样子，和你做设计时一样认真。"
    camera: two_shot, eye_level

  - shot_id: EP42-S06
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺听到这话，眼眶红了
    dialogue:
      - speaker: CHAR-003
        line: "老师……"
      - speaker: CHAR-008
        line: "怎么了？"
    camera: close_up, eye_level

  - shot_id: EP42-S07
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念和林小满识趣地退到后厨
    dialogue:
      - speaker: CHAR-001
        line: "我们先回避。"
      - speaker: CHAR-002
        line: "嗯。"
    camera: medium_shot, eye_level

  - shot_id: EP42-S08
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师和陈一诺单独对话
    dialogue:
      - speaker: CHAR-008
        line: "一诺，你当年辞职……不是因为项目不安全，是因为你不想让我的事务所受牵连，对吗？"
    camera: two_shot, eye_level

  - shot_id: EP42-S09
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺哭了，点头
    dialogue:
      - speaker: CHAR-003
        line: "那个安全问题……是您合伙人的责任。如果我举报，整个事务所都会受影响。"
    camera: close_up, eye_level

  - shot_id: EP42-S10
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师握住陈一诺的手
    dialogue:
      - speaker: CHAR-008
        line: "你这个傻孩子。你选择自己扛，却让我一直内疚。"
    camera: two_shot, eye_level

  - shot_id: EP42-S11
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺摇头
    dialogue:
      - speaker: CHAR-003
        line: "我不后悔。您教了我那么多，我不能让您多年的事业毁于一旦。"
    camera: close_up, eye_level

  - shot_id: EP42-S12
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师眼眶也红了
    dialogue:
      - speaker: CHAR-008
        line: "一诺，你知道吗？我一直以为你是因为设计理念不合才走的。直到最近，我才从别人那里知道真相。"
    camera: medium_close_up, eye_level

  - shot_id: EP42-S13
    scene_id: SCENE-001
    duration_sec: 5
    visual: 苏念和林小满在后厨偷听，苏念哭了
    dialogue:
      - speaker: CHAR-002
        line: "一诺她……她从来都不说。"
      - speaker: CHAR-001
        line: "她就是这样的人。"
    camera: medium_shot, eye_level

  - shot_id: EP42-S14
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师站起来，拍拍陈一诺的肩
    dialogue:
      - speaker: CHAR-008
        line: "一诺，你做的甜品很好。和你做的设计一样，都带着温度。"
    camera: medium_shot, eye_level

  - shot_id: EP42-S15
    scene_id: SCENE-001
    duration_sec: 5
    visual: 导师离开前回头
    dialogue:
      - speaker: CHAR-008
        line: "以后有什么需要帮忙的，尽管来找我。你不再是我的学生——你是我的朋友。"
    camera: medium_shot, eye_level

  - shot_id: EP42-S16
    scene_id: SCENE-001
    duration_sec: 5
    visual: 陈一诺站在门口目送导师离开，苏念和林小满走出来抱住她
    dialogue:
      - speaker: CHAR-002
        line: "你为什么不告诉我们？"
      - speaker: CHAR-003
        line: "因为……我不想让你们担心。"
      - speaker: CHAR-001
        line: "以后不许了。"
    camera: group_shot, eye_level
