items:
  - id: "PROP-001"
    prompt: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single slice of classic Italian tiramisu on a small white ceramic plate, showing distinct layers: espresso-soaked ladyfinger biscuits at the bottom, thick creamy mascarpone cheese layer in the middle, topped with a generous dusting of dark cocoa powder. The cream is ivory white with a smooth velvety texture, the cocoa powder is rich dark brown with a matte finish. Fresh mint leaf garnish on top. The slice is approximately 8cm tall showing clear definition between each layer. Shot from a slightly elevated 30-degree angle to showcase the beautiful layering. Warm golden ambient lighting creates a cozy dessert shop atmosphere. Vertical 9:16, detailed prop reference sheet."
    output: "dramas/三个闺蜜一台戏/assets/props/PROP-001.png"
  - id: "PROP-002"
    prompt: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single elegant three-tiered dessert on a round white porcelain stand, each tier representing one of three friends: bottom tier is rich chocolate mousse cake with dark ganache glaze, middle tier is creamy vanilla panna cotta with raspberry coulis, top tier is matcha green tea tiramisu with white chocolate shavings. Each tier is approximately 6cm tall, total height about 20cm. Three small decorative flags on top, each with a different pastel color (pink, mint green, lavender). Fresh berries and edible flowers arranged around the base. The dessert shows meticulous craftsmanship with clean lines between each tier. Shot straight-on to emphasize the three distinct layers symbolizing unity. Warm soft lighting highlighting the different textures and colors. Vertical 9:16, detailed prop reference sheet."
    output: "dramas/三个闺蜜一台戏/assets/props/PROP-002.png"
  - id: "PROP-003"
    prompt: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single handmade healing story card, approximately 10cm x 7cm, made of thick cream-colored cotton paper with torn deckle edges. The card has a watercolor wash background in soft peach and mint tones. Handwritten text in warm brown ink reading \"今天也要加油呀\" (Keep going today) in running script style, with a small heart doodle below. A thin natural twine ribbon is threaded through a small hole in the top left corner. The paper shows subtle texture of cotton fibers and slight curl at the edges from humidity. A tiny pressed dried flower (baby's breath) is attached near the bottom right corner with a small piece of washi tape. The overall feeling is warm, personal, and healing. Shot from directly above to show the full card surface. Soft diffused lighting emphasizing the handmade texture. Vertical 9:16, detailed prop reference sheet."
    output: "dramas/三个闺蜜一台戏/assets/props/PROP-003.png"
  - id: "PROP-006"
    prompt: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single feminine baking apron in soft blush pink cotton fabric, hanging flat to show full shape. The apron has a sweetheart neckline with ruffled trim, adjustable neck strap with a small wooden button, and long waist ties that hang down. The fabric shows visible flour dusting in white patches across the front, particularly concentrated around the hip area where hands would wipe. Two large front pockets are slightly bulging, containing a small whisk, a silicone spatula, and a folded recipe card peeking out. The apron has subtle wear marks: a small chocolate smudge near the bottom edge, faded spots where the fabric has been washed many times, and loose threads at the hem. A tiny embroidered heart in red thread is stitched near the left pocket. The overall feeling is well-loved and frequently used. Shot hanging from an invisible hook at the top. Warm lighting highlighting the fabric texture and flour dust. Vertical 9:16, detailed prop reference sheet."
    output: "dramas/三个闺蜜一台戏/assets/props/PROP-006.png"
