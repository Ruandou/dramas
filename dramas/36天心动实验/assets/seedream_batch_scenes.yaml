  - id: "SCENE-001"
    prompt_en: "A cozy independent cafe interior with warm brown wood tones and amber pendant lighting, color temperature ~3200K. The space features: a polished medium-brown oak bar counter with a small chalkboard sign handwritten with the characters \"今日特调\" in casual marker script, a gleaming brass La Marzocco espresso machine, stacked white ceramic coffee cups on open wooden shelving, dark hardwood flooring with gentle wear, exposed warm filament pendant lights hanging from a slightly textured ceiling, a window-side area where a small round walnut table stands as the third table from the left — positioned near large street-facing windows with soft natural daylight streaming through gauze curtains. A glass-paneled entrance door with a hanging wooden flip sign. Leather-upholstered booth seating against an exposed brick accent wall, a corner bookshelf filled with well-worn paperbacks, potted monstera plants on windowsills. Jazz-era ambient warmth, rich coffee-shop atmosphere. Cinematic medium-wide shot, rich depth, photorealistic. NOT inscribed with any other characters or text besides what is specified. Empty environment, no people, no human figures, architectural and environmental reference only. modern urban Chinese drama, photorealistic, natural lighting, contemporary 2020s setting, warm natural tones, no ancient elements, no fantasy, no sci-fi, no historical costumes."
    output: "assets/scenes/SCENE-001.png"
  - id: "SCENE-002"
    prompt_en: "A cool-toned minimalist apartment interior with stark white walls and clinical precision, color temperature ~5000K. The space features: a large floor-to-ceiling whiteboard occupying half a wall covered with colorful data visualization charts, scatter plot diagrams, bar graphs and analytical sticky notes — visual data representations, not literal text. Two large widescreen computer monitors on an immaculate white minimalist desk, their screens glowing with spreadsheet-like data grids and cool blue-tinted interface light. A dark gray iPad Pro on a sleek aluminum stand, with a white Apple Pencil lying beside it on the desk. A black mechanical keyboard with visible blue switch stems. Minimalist white floating shelves with items arranged in precise functional zones. Floor-to-ceiling windows revealing a blurred city skyline at dusk — cold blue hour light mixing with interior monitor glow. A plain white sofa with a single gray cushion. Light ash wood flooring with matte finish. A subtle anomaly: a single deep blue fountain pen rests on the pristine desk — the only object that does not belong to the cold color scheme. Cinematic medium shot, clean architectural lines, photorealistic. Empty environment, no people, no human figures, architectural and environmental reference only. modern urban Chinese drama, photorealistic, natural and ambient mixed lighting, contemporary 2020s setting, cool white minimalist aesthetic, no ancient elements, no fantasy, no sci-fi, no historical costumes, no text, no characters, no writing, no inscriptions, no calligraphy."
    output: "assets/scenes/SCENE-002.png"
  - id: "SCENE-003"
    prompt_en: "A warm cozy writer's apartment interior bathed in golden yellow lamplight, color temperature ~3000K. The space features: floor-to-ceiling bookshelves covering two entire walls, densely packed with worn paperbacks and hardcovers of varying sizes, some stacked horizontally on top of vertical rows. A large wooden writing desk near the window, its surface covered with scattered handwritten manuscript pages, a brass desk lamp casting a warm focused pool of golden light, an ink bottle with a dark stain ring on the wood grain. Stacks of books and loose papers piled on the floor beside a worn brown leather armchair. A multi-level cat climbing tower occupying the prime window spot, with a plush cat bed on the top platform. Soft warm yellow curtains filtering gentle afternoon sunlight. A well-loved tweed sofa with rumpled throw blankets draped over the armrest. Distressed oak flooring partially covered by a faded Persian-style rug in muted reds and golds. The walls are a warm cream color, some areas softly darkened by years of ambient lamp light. The atmosphere is creative chaos — lived-in warmth, every surface tells a story. Cinematic establishing shot, rich amber warmth, photorealistic. Empty environment, no people, no human figures, architectural and environmental reference only. modern urban Chinese drama, photorealistic, warm natural and lamp lighting, contemporary 2020s setting, cozy lived-in atmosphere, no ancient elements, no fantasy, no sci-fi, no historical costumes, no text, no characters, no writing, no inscriptions, no calligraphy."
    output: "assets/scenes/SCENE-003.png"
