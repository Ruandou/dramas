items:
  - id: "PROP-001"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single dark gray Space Gray iPad Pro lying flat at a slight diagonal angle, its screen displaying colorful data visualization charts — bar graphs and scatter plots in blues and greens — with the tablet's slim bezel visible. The iPad back is partially visible showing data-themed vinyl stickers affixed to its surface: bar chart decals, scatter plot icons, statistical symbol stickers. Beside it on the same surface plane, ONE single white Apple Pencil, its side engraved with the text \"Null Hypothesis\" in small laser-etched sans-serif letters along the barrel. The pencil tip shows slight wear from heavy daily use. The two items form a single paired tool set — the digital brain of a data analyst. Modern tech aesthetic, contemporary 2020s design. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-001.png"
  - id: "PROP-002"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single deep navy blue metal fountain pen, its cap removed and resting beside the barrel. The 18K gold nib glints under soft directional lighting, showing fine dark ink residue in the slit and on the feed. The pen barrel interior bears a tiny engraved inscription reading the characters \"第7本·给SN\" in fine regular script — partially visible where the barrel meets the grip section, as if the pen has been slightly unscrewed. The cap exterior shows subtle wear marks and patina from years of daily use — slight brassing at the edges, micro-scratches on the deep blue lacquer. Ink residue traces near the nib feed. The pen has weight and presence — a writer's most personal tool. Contemporary craftsmanship, literary tool aesthetic. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-002.png"
  - id: "PROP-003"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single A5-sized black softcover notebook, its flexible leather-like cover showing whitened worn corners and subtle creases from being carried daily in a bag. The notebook lies slightly open at a shallow angle, pages fanning just enough to reveal dense handwritten Chinese text in dark ink within — the handwriting is compact and personal, but the specific words remain illegible from this angle, preserving the mystery. From the side profile, the thickness of filled pages is visible — this notebook has been used extensively. A black ribbon bookmark hangs from the bottom edge. The spine is creased from repeated opening and closing. A simple black elastic closure band stretches across the cover. The overall impression is of a private object carrying unspoken weight. Understated, well-used, deeply personal. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-003.png"
  - id: "PROP-004"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single A5-sized dark forest green cloth-bound notebook, brand new with crisp corners and a pristine cover showing subtle linen texture catching the side light. The notebook lies open to its first page, where handwritten Chinese text in dark blue fountain pen ink fills several lines — the handwriting is slightly hesitant but precise, written with a deliberate hand. The green cloth cover has a matte finish with fine weave texture. A dark green ribbon bookmark hangs from the spine. The paper is cream-colored with visible fiber texture. Most pages remain blank — this is a fresh beginning. The faint shadow of text from the previous page bleeds through the paper surface slightly. A fountain pen (deep blue metal) rests beside the notebook for scale and context. Modern stationery, personal journal aesthetic, the physical manifestation of a change of heart. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-004.png"
  - id: "PROP-005"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single repurposed cardboard shoebox, its lid set beside it, containing carefully organized emotional evidence. The box exterior has a handwritten paper label affixed to the front with visible Chinese characters — the label shows signs of being written by a child's hand, slightly yellowed and the ink faded over 12+ years. The box is open, revealing its contents: torn greeting card fragments meticulously taped back together with yellowed transparent tape, a calendar page with entire months marked in red marker pen, several folded Valentine's Day cards stacked neatly in one corner, and an unfinished knitted scarf — approximately one-third complete — with uneven beginner's stitches in pale gray yarn, the knitting needles still inserted into the work. The shoebox itself is a generic brand box, slightly dented at corners and edges from over a decade of storage. The contents are arranged with a data analyst's precision despite the emotional weight they carry. Emotional archaeology, physical manifestation of collected evidence. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-005.png"
  - id: "PROP-006"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single thick manuscript stack — approximately 300 pages of typed A4 paper with handwritten annotations in blue fountain pen ink scattered throughout the visible margins, the entire stack bound with a simple black metal binder clip. The cover page is visible on top, showing a single centered line of typed text with the book title — elegant and understated typography. The pages show signs of extensive handling: slightly curled corners, occasional faint coffee ring stains on some sheets, multicolored sticky note tabs protruding from the edges marking important sections. A deep blue fountain pen rests diagonally across the top page for scale. The manuscript has physical weight and presence — months of creative work made tangible. Contemporary literary artifact, a novel in progress. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-006.png"
  - id: "PROP-007"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single ordinary brass key, newly cut with fresh sharp edges and a subtle metallic burr catching the light, paired with a distinctive blue keychain attached through the key's hole. The keychain is uniquely shaped as a small circular brushed metal disc engraved with a coordinate system — two perpendicular lines forming X and Y axes crossing at the center, with the tiny engraved text \"Day 36\" at the origin point in clean sans-serif lettering. The keychain's metal has a warm cerulean blue anodized finish. The brass key has a warm golden tone with fresh-cut highlights along its teeth. The composition places the key diagonally across the frame with the keychain offset to one side. Simple, modern, deeply symbolic — a key that is also an answer. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-007.png"
  - id: "PROP-008"
    prompt_en: "Prop reference photograph, single object group isolated on warm neutral silk background, dramatic product lighting with soft shadows. TWO matching black silicone wristband heart rate monitors, identical models, resting side by side with a small intentional gap between them on the silk surface. Each monitor features a matte black textured silicone band and a small rectangular sensor module with a pulsing blue LED indicator light visible — one glowing steady, the other in a subtle blink pattern. One monitor's tiny display faintly shows a numerical heart rate reading. The paired nature of the two devices is emphasized by their identical design and synchronized blue LED glow — two monitors, one shared data stream. Modern fitness-tech minimalism, the aesthetics of quantified emotion. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-008.png"
  - id: "PROP-009"
    prompt_en: "Prop reference photograph, single object isolated on warm neutral silk background, dramatic product lighting with soft shadows. ONE single white ceramic coffee cup, simple cylindrical shape with a sturdy C-handle, resting centered on a matching white saucer. The cup's exterior wall has handwritten markings in black marker pen — a casual handwritten date and a name in Chinese characters, the ink slightly uneven as if jotted down quickly during a busy cafe shift, the marker strokes showing the natural variation of human handwriting. On the opposite visible side of the cup, a small hand-drawn doodle: a simple coordinate axis with a downward sloping line and a tiny upward-pointing arrow at the end, drawn with the same black marker — a quiet message of encouragement in mathematical language. The ceramic glaze is matte white, showing faint coffee staining along the inner rim from use. No steam — the cup is clean and empty, waiting. Cafe warmth, personal touch, understated storytelling through everyday objects. Vertical 9:16, detailed prop reference sheet."
    output: "assets/props/PROP-009.png"
