  - segment_id: EP02-SEG14
    title: 夜读日记·钩子
    shot_ids: [EP02-S35, EP02-S36, EP02-S37, EP02-S38, EP02-S39]
    duration_sec: 12
    scene_primary: SCENE-013
    characters: [CHAR-001]
