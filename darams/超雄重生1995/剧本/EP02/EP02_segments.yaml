  CHAR-014: "中年男性，50岁，沉稳厚重，老大哥语气，略显谨慎"
  CHAR-GRP-02: "混合群演：中年男性门卫/文员，中年女性工友/宿管，老年男性门卫"

segments:
  - segment_id: EP02-SEG01
    title: 案卷分析
    shot_ids: [EP02-S01, EP02-S02, EP02-S03]
    duration_sec: 12
    scene_primary: SCENE-013
    characters: [CHAR-001]
    looks: [CHAR-001-L01]
    generate_audio: true
    voice_prompt: "Male, 25 years old, deep calm tone, internal monologue, analytical"
    refs:
      scene_id: SCENE-013
    assets:
      look_urls:
        CHAR-001-L01: assets/looks/CHAR-001-L01.png
      scene_urls:
        SCENE-013: assets/scenes/SCENE-013.png
    dialogue_lines:
      - { speaker: CHAR-001, emotion: 内心, text: "周小梅，二十岁，棉纺厂第三车间纺纱工。失踪七天了。" }
      - { speaker: CHAR-001, emotion: 内心, text: "厂区治保会的结论是「跟男友跑了」……七天，就这么结了案。" }
      - { speaker: CHAR-001, emotion: 内心, text: "上辈子，这个案子拖了一个月才正式立案。等立案的时候，所有现场痕迹都没了。" }
      - { speaker: CHAR-001, emotion: 内心, text: "证人记忆模糊，物证被清理……最后不了了之。" }
      - { speaker: CHAR-001, emotion: 内心, text: "但我记得——后来在档案室翻旧卷宗，发现这不是个案。一九九三年，同样的手法。" }
      - { speaker: CHAR-001, emotion: 内心, text: "这一次，我不等七天。不等一个月。今天就去棉纺厂。" }
      - { speaker: CHAR-001, emotion: 内心, text: "案卷上写的太干净了——「自愿出走」四个字，连个问话笔录都没有。" }
      - { speaker: CHAR-001, emotion: 内心, text: "谁清理的现场？谁写的结论？我得亲眼看看。" }
    api:
      text: |
        【图1】陆峥 CHAR-001-L01【图2】陆峥宿舍 SCENE-013。
        字幕：本段内心独白显示简体白字底字幕，与语音同步。
        竖屏9比16连贯叙事。
        镜头1（5秒）中景固定：清晨微光，陆峥坐书桌前翻阅案卷；笔记本铅笔搪瓷杯；墙上1995年日历。
        对白（陆峥，25岁，沉稳偏低，内心独白）：「周小梅，二十岁……失踪七天了。」「治保会结论：跟男友跑了。」
        镜头2（5秒）特写推近：手指划过案卷文字眉头紧锁；用铅笔画线。
        对白（陆峥，同上声线）：「上辈子这案子拖了一个月……最后不了了之。」「但我记得——一九九三年，同样的手法。」
        镜头3（5秒）近景：陆峥合上案卷目光坚定，站起拿起警服外套。
        对白（陆峥，同上声线）：「这一次不等了。今天就去棉纺厂。」
        1995年中国城市，写实电影风格，竖屏9比16，无智能手机，无平板，无LED广告屏，无现代车型，无清晰广告文字。对白时画面底部居中简体白字字幕与语音同步；禁止其它乱字
      content_roles:
        - { file: CHAR-001-L01, role: reference_image, label: 图1 }
        - { file: SCENE-013, role: reference_image, label: 图2 }

