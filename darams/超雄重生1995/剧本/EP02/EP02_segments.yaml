# EP02 segments — 14 segments, all 4-12 seconds (Seedance 2.0 fast hard limit)
# image_strategy: cdn_first — CDN URLs bypass base64 payload size limit (4+ images ok)
# Without valid CDN URLs, max 3 content_roles before base64 payload exceeds limit
# No first-person death/violence language
episode_id: EP02
episode_title: 失踪案
source_md: 剧本/EP02/EP02_失踪案.md
image_strategy: cdn_first
image_cdn_registry:
  looks: assets/looks/cdn_urls.json
  scenes: assets/scenes/cdn_urls.json

defaults:
  endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  model: doubao-seedance-2-0-fast-260128
  ratio: "9:16"
  resolution: 1080x1920
  duration_sec: "8-10"
  generate_audio: true
  watermark: false
  prompt_suffix: "对白时画面底部居中简体白字字幕与语音同步；禁止其它乱字"
  prompt_suffix_silent: "本段无对白无字幕，禁止其它汉字乱字"
  negative_prompt: "smartphone, flat screen TV, LED lights, modern car, laptop, tablet, QR code, delivery box, power bank, glass curtain wall, subway station, LED billboard, Nike logo, Adidas logo, wireless earbuds, ring light, bubble tea cup, modern minimalist interior, neon RGB lighting"

voice_prompts:
