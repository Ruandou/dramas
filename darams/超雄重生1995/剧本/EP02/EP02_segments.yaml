    dialogue_lines:
      - { speaker: CHAR-001, emotion: 请示, text: "所长，我想跟您请示——周小梅的案子，我想去棉纺厂实地走访一趟。" }
      - { speaker: CHAR-014, emotion: 不以为然, text: "周小梅？那案子不是结了吗？厂区治保会的结论，跟人跑了。" }
      - { speaker: CHAR-014, emotion: 平, text: "再说，那是厂里的事，人家有自己的保卫科。" }
      - { speaker: CHAR-001, emotion: 坚持, text: "所长，她姐姐来报案的时候说，宿舍的东西都还在。一个人要是跟人走，不会什么都不带。" }
      - { speaker: CHAR-001, emotion: 平静, text: "我就去看看，不给厂里添麻烦。问几个问题就回来。" }
      - { speaker: CHAR-014, emotion: 叹气, text: "小陆啊，你才来几天？棉纺厂那边关系复杂，保卫科跟我们不是一个系统……" }
      - { speaker: CHAR-014, emotion: 让步, text: "行吧，去看看。但别惹事，问完就回来。" }
      - { speaker: CHAR-001, emotion: 恭敬, text: "是，所长。我下午之前回来汇报。" }
      - { speaker: CHAR-001, emotion: 内心, text: "他不知道这案子有多大。但我知道。" }
      - { speaker: CHAR-001, emotion: 内心, text: "七天了。每多一天，证据就少一分。" }
