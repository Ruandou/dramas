    dialogue_lines:
      - { speaker: CHAR-001, emotion: 内心, text: "周小梅的日记……从今年四月开始记。字迹工整，是个认真的姑娘。" }
      - { speaker: CHAR-001, emotion: 内心, text: "前面都是日常——上班、吃饭、宿舍聊天。正常得不能再正常。" }
      - { speaker: CHAR-001, emotion: 内心, text: "七月十号……笔迹变了。兴奋、激动。她写了什么？" }
      - { speaker: CHAR-001, emotion: 内心, text: "「今天王姐介绍了一个人给我，说南方有电子厂在招人，月薪八百。」" }
      - { speaker: CHAR-001, emotion: 内心, text: "「八百！我在厂里干一年才一千六。如果是真的……我妈的药钱就够了。」" }
      - { speaker: CHAR-001, emotion: 内心, text: "月薪八百……一九九五年，纺纱工一个月才一百多。这个数字像天上掉下来的馅饼。" }
      - { speaker: CHAR-001, emotion: 内心, text: "「南方电子厂招人」——这就是那个年代最常见的骗局。" }
      - { speaker: CHAR-001, emotion: 内心, text: "用高薪把年轻女工骗出去，然后……上辈子我在档案室看过太多这种案卷。" }
      - { speaker: CHAR-001, emotion: 内心, text: "一九九三年有一个，一九九五年又一个。同样的套路，同样的猎物。" }
      - { speaker: CHAR-001, emotion: 内心, text: "这不是一个人作案。这是一条线——从厂区内部有人拉线，到外面有人接应，再到南方有人接收。" }
      - { speaker: CHAR-001, emotion: 内心, text: "一条完整的链条。" }
      - { speaker: CHAR-001, emotion: 内心, text: "日记里提到的「王姐」……谁是王姐？她在厂里还是厂外？" }
      - { speaker: CHAR-001, emotion: 内心, text: "这个人是关键。找到她——就能找到周小梅。" }
      - { speaker: CHAR-001, emotion: 内心, text: "周小梅……等着我。这辈子，你不会消失。" }
