      - { speaker: CHAR-017, emotion: 激动, text: "三天了！万一出事了呢？！你们就不能先去问问？！" }
      - { speaker: CHAR-001, emotion: 内心, text: "周小梅……" }
      - { speaker: CHAR-001, emotion: 内心, text: "就是这个案子。上辈子，这个案子报上来的时候，所里没当回事。" }
      - { speaker: CHAR-001, emotion: 内心, text: "等到第七天立案，线索全断了。证人散了，现场没了。" }
      - { speaker: CHAR-001, emotion: 内心, text: "最后结案：「自愿出走，下落不明」。" }
      - { speaker: CHAR-001, emotion: 内心, text: "可她从来都没有自愿走。" }
      - { speaker: CHAR-001, emotion: 平静有力, text: "这位同志，我是新分配来的民警陆峥。" }
      - { speaker: CHAR-001, emotion: 平静, text: "你妹妹——周小梅，在棉纺厂第三车间，对吗？" }
      - { speaker: CHAR-017, emotion: 愣, text: "你……你怎么知道她在第三车间？" }
      - { speaker: CHAR-001, emotion: 沉稳, text: "那个车间的排班跟其他车间不一样。你说她下夜班没回去——是周三的夜班？" }
      - { speaker: CHAR-017, emotion: 惊喜, text: "对对对！就是周三！你认识她？！" }
      - { speaker: CHAR-017, emotion: 急切, text: "她东西还在宿舍里……衣服、被子都没动……" }
      - { speaker: CHAR-001, emotion: 平静, text: "不认识。但我想帮你找她。" }
      - { speaker: CHAR-001, emotion: 坚定, text: "这个案子，我来跟。" }
      - { speaker: CHAR-GRP-01, emotion: 惊讶, text: "你……你一个新来的……" }
      - { speaker: CHAR-001, emotion: 坚定, text: "我来跟。三天了，再拖下去就来不及了。" }
