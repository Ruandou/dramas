      - { speaker: CHAR-001, emotion: 内心, text: "最后的记忆是档案室……胸口发闷……然后什么都没了。" }
      - { speaker: CHAR-001, emotion: 内心, text: "这双手……这是二十五岁的手。没有老茧、没有伤疤。" }
      - { speaker: CHAR-001, emotion: 内心, text: "我的毕业证……分配通知……" }
      - { speaker: CHAR-001, emotion: 内心, text: "「一九九五年七月十四日报到」——还没去报到。" }
      - { speaker: CHAR-001, emotion: 内心, text: "我死了。上辈子，在档案室里坐了十年，最后一刻是心脏骤停。" }
      - { speaker: CHAR-001, emotion: 内心, text: "林栀走了八年了……我没能保护她。" }
      - { speaker: CHAR-001, emotion: 内心, text: "那一年，有人冲进她值班的急诊室，拿刀……" }
      - { speaker: CHAR-001, emotion: 内心, text: "而我接到电话赶过去的时候……她已经……" }
      - { speaker: CHAR-001, emotion: 内心, text: "可是现在……我回来了。这是一九九五年七月。一切还没有发生。" }
      - { speaker: CHAR-001, emotion: 内心, text: "林栀还活着。那些人还没动手。我还有机会。" }
      - { speaker: CHAR-003, emotion: VO渐弱梦境回声, text: "陆峥……陆峥……" }
