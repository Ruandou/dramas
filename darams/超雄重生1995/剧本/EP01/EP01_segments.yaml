      - { speaker: CHAR-001, emotion: 内心痛苦回忆, text: "周小梅……上辈子，她再也没有回来过。" }
      - { speaker: CHAR-001, emotion: 内心, text: "后来我在档案室翻旧卷宗，才知道——这不是「自愿出走」。" }
      - { speaker: CHAR-001, emotion: 内心, text: "她被人从厂区东门带走了。不是一个人……是一伙人。" }
      - { speaker: CHAR-001, emotion: 内心, text: "一九九三年、一九九五年……同样的手法，同样的目标——年轻女工。" }
      - { speaker: CHAR-001, emotion: 内心, text: "同一伙人，同一条线。而当年所里没人追查。" }
      - { speaker: CHAR-001, emotion: 内心坚定, text: "这一次……我不会让她消失。" }
      - { speaker: CHAR-001, emotion: 内心, text: "我知道这案子的背后是什么——招工诈骗、人口贩卖，还有一条通向更深处的线。" }
      - { speaker: CHAR-001, emotion: 内心, text: "那条线牵着棉纺厂，牵着南方贸易公司，牵着更大的保护伞。" }
      - { speaker: CHAR-001, emotion: 内心, text: "这就是我来城南的原因。这就是我选基层的原因。" }
      - { speaker: CHAR-001, emotion: 内心决绝, text: "上辈子，我用二十年学会了一件事——" }
      - { speaker: CHAR-001, emotion: 内心决绝, text: "这个世界不会因为你老实就放过你。" }
      - { speaker: CHAR-001, emotion: 内心决绝, text: "善良没有用。沉默没有用。忍耐也没有用。" }
      - { speaker: CHAR-001, emotion: 内心决绝, text: "这辈子……我不当老实人了。" }
      - { speaker: CHAR-001, emotion: 内心决绝, text: "我要改写所有人的命运——从这个案子开始。" }
      - { speaker: CHAR-001, emotion: 内心, text: "周小梅，等着我。" }
