      - { speaker: CHAR-001, emotion: 内心, text: "这个年代，信息就是最大的武器。" }
      - { speaker: CHAR-001, emotion: 内心, text: "城南派出所。上辈子我被分到了城北，坐了十年冷板凳。" }
      - { speaker: CHAR-001, emotion: 内心, text: "城北综合科……听着好听，其实就是个死胡同。" }
      - { speaker: CHAR-001, emotion: 内心, text: "这辈子……我主动来这里。因为三个月后，这里会接到一桩失踪案——" }
